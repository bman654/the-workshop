<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaballs — Strange Garden</title>
<style>
  :root { --accent: #6fe6d0; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0a0b0f; overflow:hidden;
    font-family: system-ui, sans-serif; color:#e6e8ee; -webkit-user-select:none; user-select:none; }
  #c { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #panel { position:fixed; top:16px; left:16px; width:264px; padding:16px 16px 14px;
    background:rgba(18,20,28,.66); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 8px 40px rgba(0,0,0,.5); font-size:13px; transition:opacity .2s; }
  #panel.hidden { opacity:0; pointer-events:none; }
  #panel h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #panel .desc { font-size:11px; opacity:.55; margin:0 0 10px; line-height:1.45; }
  #panel label { font-size:11px; opacity:.8; margin:11px 0 3px;
    font-family:ui-monospace,Menlo,monospace; display:flex; justify-content:space-between; }
  #panel label b { color:var(--accent); font-weight:600; }
  #panel input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
  .row { display:flex; gap:8px; margin-top:13px; }
  button { flex:1; padding:7px 4px; font-size:12px; cursor:pointer; color:#e6e8ee;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; transition:background .15s; }
  button:hover { background:rgba(255,255,255,.13); }
  button.pri { border-color:color-mix(in srgb,var(--accent) 50%,transparent);
    background:color-mix(in srgb,var(--accent) 14%,transparent); }
  #hud { position:fixed; bottom:10px; right:14px; font:11px ui-monospace,Menlo,monospace;
    opacity:.4; text-align:right; }
  #hint { position:fixed; bottom:10px; left:16px; font:11px ui-monospace,Menlo,monospace;
    opacity:.3; }
  a.back { position:fixed; top:18px; right:18px; font:12px ui-monospace,Menlo,monospace;
    color:#e6e8ee; opacity:.4; text-decoration:none; }
  a.back:hover { opacity:.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Metaballs</h1>
  <p class="desc">Drops of liquid metal drift, kiss, and pour into one another —
    a scalar field crossing its own threshold.</p>
  <label>Ball count <b id="vN">9</b></label>
  <input type="range" id="sN" min="2" max="24" step="1" value="9">
  <label>Threshold <b id="vT">1.00</b></label>
  <input type="range" id="sT" min="0.45" max="2.2" step="0.01" value="1.0">
  <label>Ball size <b id="vS">1.00</b></label>
  <input type="range" id="sS" min="0.45" max="2.0" step="0.01" value="1.0">
  <label>Speed <b id="vV">1.00</b></label>
  <input type="range" id="sV" min="0" max="2.5" step="0.01" value="1.0">
  <label>Edge glow <b id="vG">1.00</b></label>
  <input type="range" id="sG" min="0" max="2.0" step="0.01" value="1.0">
  <label>Palette <b id="vP">Mercury</b></label>
  <input type="range" id="sP" min="0" max="4" step="1" value="0">
  <div class="row"><button id="style" class="pri">Filled</button><button id="reseed">Reseed</button></div>
  <div class="row"><button id="pause">Pause</button><button id="save">Save PNG</button></div>
</div>
<div id="hud"></div>
<div id="hint">move mouse — a drop follows · space pause · r reseed · h hides panel</div>
<a class="back" href="../index.html">← garden</a>
<script>
const cv=document.getElementById('c');
const panel=document.getElementById('panel'), hud=document.getElementById('hud');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});

// ---------- parameters ----------
const MAXB=32;                 // hard cap on uniform array slots
let nBalls=9;
let threshold=1.0, sizeMul=1.0, speedMul=1.0, glowMul=1.0;
let palette=0, contour=0;      // contour: 0 = filled, 1 = contour bands
const PAL_NAMES=['Mercury','Lava','Aurora','Plasma','Gold'];

// ---------- ball state (typed arrays, no per-frame alloc) ----------
const bx=new Float32Array(MAXB), by=new Float32Array(MAXB);
const bvx=new Float32Array(MAXB), bvy=new Float32Array(MAXB);
const bs=new Float32Array(MAXB);            // base strength (radius^2 weight)
const data=new Float32Array(MAXB*4);        // packed x,y,strength,_ for uniform upload

let W,H,DPR,worldW,worldH;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  worldW=innerWidth; worldH=innerHeight;
  W=cv.width=Math.floor(worldW*DPR); H=cv.height=Math.floor(worldH*DPR);
  cv.style.width=worldW+'px'; cv.style.height=worldH+'px';
  if(gl) gl.viewport(0,0,W,H);
}
addEventListener('resize',resize);

// ---------- seed balls ----------
function seed(){
  for(let i=0;i<MAXB;i++){
    bx[i]=Math.random()*worldW;
    by[i]=Math.random()*worldH;
    const ang=Math.random()*Math.PI*2, sp=40+Math.random()*70;
    bvx[i]=Math.cos(ang)*sp; bvy[i]=Math.sin(ang)*sp;
    // strength ~ radius^2; varied sizes give organic merges
    const r=70+Math.random()*90;
    bs[i]=r*r;
  }
}

// ---------- GLSL ----------
const VERT=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const FRAG=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2  uRes;        // pixel resolution
uniform int   uN;          // active ball count
uniform vec4  uBalls[${MAXB}]; // x,y (pixels), strength(scaled), unused
uniform float uThresh;     // iso level
uniform float uGlow;       // edge glow strength
uniform int   uPal;        // palette index
uniform int   uContour;    // 0 filled, 1 contour bands
uniform float uTime;

// --- palettes: map normalized "depth" t (0..1) to color ---
vec3 pal(float t){
  t=clamp(t,0.,1.);
  if(uPal==0){            // Mercury / chrome
    vec3 lo=vec3(0.10,0.12,0.16);
    vec3 mid=vec3(0.55,0.62,0.72);
    vec3 hi=vec3(0.93,0.97,1.02);
    return t<0.5 ? mix(lo,mid,t*2.) : mix(mid,hi,(t-0.5)*2.);
  } else if(uPal==1){     // Lava
    vec3 a=vec3(0.18,0.02,0.01);
    vec3 b=vec3(0.85,0.16,0.03);
    vec3 c=vec3(1.00,0.72,0.18);
    vec3 d=vec3(1.00,0.98,0.80);
    if(t<0.4) return mix(a,b,t/0.4);
    if(t<0.75) return mix(b,c,(t-0.4)/0.35);
    return mix(c,d,(t-0.75)/0.25);
  } else if(uPal==2){     // Aurora
    vec3 a=vec3(0.02,0.10,0.18);
    vec3 b=vec3(0.05,0.55,0.55);
    vec3 c=vec3(0.35,0.90,0.55);
    vec3 d=vec3(0.85,0.98,0.80);
    if(t<0.45) return mix(a,b,t/0.45);
    if(t<0.78) return mix(b,c,(t-0.45)/0.33);
    return mix(c,d,(t-0.78)/0.22);
  } else if(uPal==3){     // Plasma
    vec3 a=vec3(0.05,0.02,0.18);
    vec3 b=vec3(0.45,0.05,0.55);
    vec3 c=vec3(0.95,0.30,0.45);
    vec3 d=vec3(1.00,0.85,0.55);
    if(t<0.4) return mix(a,b,t/0.4);
    if(t<0.74) return mix(b,c,(t-0.4)/0.34);
    return mix(c,d,(t-0.74)/0.26);
  } else {                // Gold / molten glass
    vec3 a=vec3(0.10,0.07,0.02);
    vec3 b=vec3(0.55,0.34,0.06);
    vec3 c=vec3(0.95,0.74,0.25);
    vec3 d=vec3(1.00,0.97,0.82);
    if(t<0.42) return mix(a,b,t/0.42);
    if(t<0.76) return mix(b,c,(t-0.42)/0.34);
    return mix(c,d,(t-0.76)/0.24);
  }
}

// accumulate field f and its gradient (for shading normals)
void fieldAndGrad(vec2 q, out float f, out vec2 grad){
  f=0.; grad=vec2(0.);
  for(int i=0;i<${MAXB};i++){
    if(i>=uN) break;
    vec2 d=q-uBalls[i].xy;
    float s=uBalls[i].z;
    float dd=dot(d,d)+50.0;     // epsilon avoids singularity
    float inv=s/dd;
    f+=inv;
    // d/dq of s/(|d|^2) = -2 s d / dd^2
    grad += (-2.0*s/(dd*dd))*d;
  }
}

void main(){
  vec2 q=gl_FragCoord.xy;
  float f; vec2 grad;
  fieldAndGrad(q,f,grad);

  float thr=uThresh;
  // soft anti-aliased iso edge using screen-space derivative of f
  float fw=fwidth(f)+1e-4;

  // background: very dark with a faint vignette
  vec2 uv=q/uRes;
  float vig=smoothstep(1.25,0.25,length(uv-0.5));
  vec3 bg=mix(vec3(0.018,0.020,0.028), vec3(0.030,0.034,0.046), vig);

  // inside mask (1 inside the blob)
  float inside=smoothstep(thr-fw, thr+fw, f);

  // depth: how far past threshold (normalized) -> drives palette + lighting
  float depth=clamp((f-thr)/(thr*1.4), 0.0, 1.0);

  // pseudo-3D normal from field gradient: treat field as a height, build a normal.
  // Bridges between balls have low gradient -> nearly flat normals -> read as a
  // liquid sheet rather than separate bubbles; ball centres bulge.
  vec2 g=grad;
  // bias surface curvature by how deep inside we are: deeper = flatter top (molten pool)
  float bulge=1.45*(1.0-0.55*depth);
  vec3 N=normalize(vec3(g*bulge, 0.85));
  vec3 L=normalize(vec3(-0.42,-0.6,0.95));  // key light (upper-left)
  vec3 L2=normalize(vec3(0.55,0.45,0.6));   // cool fill from lower-right
  vec3 V=vec3(0.0,0.0,1.0);
  vec3 R=reflect(-V,N);                      // view reflection vector (for env)
  float diff=clamp(dot(N,L),0.0,1.0);
  float diff2=clamp(dot(N,L2),0.0,1.0);
  float spec=pow(clamp(dot(reflect(-L,N),V),0.0,1.0), 60.0);
  float fres=pow(1.0-clamp(N.z,0.0,1.0), 2.4); // rim from facing ratio

  // faux chrome environment: dark floor, bright sky band the reflection sweeps
  // across as the surface tilts — gives mercury its restless light/dark sheen.
  float ey=R.y*0.5+0.5;
  float env = 0.05
            + 0.42*smoothstep(0.10,0.92,ey)            // sky brightens upward
            + 0.50*exp(-pow((ey-0.80)/0.085,2.0))      // bright sky strip
            + 0.16*exp(-pow((ey-0.34)/0.11,2.0));      // dim horizon glint
  float envSide = 0.10*sin(R.x*6.0+1.3);               // faint lateral ripples
  env = clamp(env+envSide, 0.0, 1.2);

  vec3 body;
  if(uContour==1){
    // contour band rendering: rings of equal field, metallic
    float bands=8.0;
    float v=fract(f/ (thr) * bands);
    float ring=smoothstep(0.0,0.08,v)*smoothstep(1.0,0.92,v);
    vec3 base=pal(depth*0.85+0.1);
    body = base*(0.35+0.65*ring) + spec*0.9;
    body += fres*0.5*pal(0.95);
    body += (env-0.4)*0.25*base;
  } else {
    vec3 base=pal(0.16 + depth*0.74);
    // metallic chrome: dark base lifted by the reflected sky + a little diffuse,
    // so highlights and shadows both survive instead of washing to white.
    body  = base*(0.10 + 0.30*diff + 0.10*diff2);      // shaded body
    body += base*env*0.95;                              // chrome reflection (keeps darks)
    body += spec*vec3(1.0,0.97,0.90)*1.7;              // hot specular pip
    body += fres*pal(0.92)*0.45;                        // inner rim sheen
  }

  // bright edge glow exactly at the iso threshold (signature merge halo)
  float edge=exp(-pow((f-thr)/(fw*2.2),2.0));
  vec3 glowCol=pal(0.85);
  if(uPal==0) glowCol=vec3(0.7,0.85,1.0);
  vec3 glow=edge*glowCol*(1.1*uGlow);

  // an outer soft halo bleeding into background near (just below) threshold
  float halo=smoothstep(thr*0.45, thr, f)*(1.0-inside);
  vec3 haloCol=glowCol*halo*0.22*uGlow;

  vec3 col=bg + haloCol;
  col=mix(col, body, inside);
  col+=glow*(0.4+0.6*inside);   // glow rides the rim

  // gentle filmic-ish tone — keeps highlights from clipping to flat white
  col=col/(col+0.85)*1.85;
  o=vec4(clamp(col,0.0,1.0),1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error('shader compile error:',gl.getShaderInfoLog(s),src);
    throw new Error('shader');
  }
  return s;
}
let prog, uLoc={};
function buildProgram(){
  prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
  gl.bindAttribLocation(prog,0,'p');
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
    console.error('link error:',gl.getProgramInfoLog(prog));
    throw new Error('link');
  }
  gl.useProgram(prog);
  for(const u of ['uRes','uN','uBalls','uThresh','uGlow','uPal','uContour','uTime'])
    uLoc[u]=gl.getUniformLocation(prog,u);
  // fullscreen triangle
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
}

// ---------- mouse: a drop follows the cursor ----------
let mx=-1e4,my=-1e4,mActive=false;
let cursorX=-1e4,cursorY=-1e4;
cv.addEventListener('pointermove',e=>{ mx=e.clientX; my=e.clientY; mActive=true; });
cv.addEventListener('pointerleave',()=>{ mActive=false; });
// click adds a fresh ball at the pointer (up to MAXB)
cv.addEventListener('pointerdown',e=>{
  if(nBalls<MAXB-1){
    const i=nBalls;
    bx[i]=e.clientX; by[i]=e.clientY;
    const ang=Math.random()*Math.PI*2, sp=40+Math.random()*70;
    bvx[i]=Math.cos(ang)*sp; bvy[i]=Math.sin(ang)*sp;
    const r=70+Math.random()*90; bs[i]=r*r;
    nBalls++; setN(nBalls);
  }
});

// ---------- simulation ----------
function step(dt){
  const v=speedMul, marginPull=0.0;
  for(let i=0;i<nBalls;i++){
    bx[i]+=bvx[i]*v*dt;
    by[i]+=bvy[i]*v*dt;
    // bounce off walls with a soft margin so blobs stay mostly on-screen
    const m=20;
    if(bx[i]<m){ bx[i]=m; bvx[i]=Math.abs(bvx[i]); }
    else if(bx[i]>worldW-m){ bx[i]=worldW-m; bvx[i]=-Math.abs(bvx[i]); }
    if(by[i]<m){ by[i]=m; bvy[i]=Math.abs(bvy[i]); }
    else if(by[i]>worldH-m){ by[i]=worldH-m; bvy[i]=-Math.abs(bvy[i]); }
  }
}

// pack uniform data; the cursor drop is the LAST slot (index nBalls if room, else overwrites)
function packUniforms(){
  const scale=DPR;                         // field computed in device pixels
  const strScale=sizeMul*sizeMul*DPR*DPR;  // strength scales with size^2 and DPR^2
  let count=nBalls;
  for(let i=0;i<nBalls;i++){
    data[i*4+0]=bx[i]*scale;
    data[i*4+1]=(worldH-by[i])*scale;      // flip Y for GL frag coords
    data[i*4+2]=bs[i]*strScale;
    data[i*4+3]=0;
  }
  // cursor-follow drop
  if(mActive && count<MAXB){
    // smooth follow
    if(cursorX<-1e3){ cursorX=mx; cursorY=my; }
    cursorX+=(mx-cursorX)*0.25; cursorY+=(my-cursorY)*0.25;
    data[count*4+0]=cursorX*scale;
    data[count*4+1]=(worldH-cursorY)*scale;
    data[count*4+2]=(95*95)*strScale*1.05;  // a juicy, slightly-large drop
    data[count*4+3]=0;
    count++;
  }
  return count;
}

function draw(){
  gl.useProgram(prog);
  const count=packUniforms();
  gl.uniform2f(uLoc.uRes,W,H);
  gl.uniform1i(uLoc.uN,count);
  gl.uniform4fv(uLoc.uBalls,data);
  gl.uniform1f(uLoc.uThresh,threshold);
  gl.uniform1f(uLoc.uGlow,glowMul);
  gl.uniform1i(uLoc.uPal,palette);
  gl.uniform1i(uLoc.uContour,contour);
  gl.uniform1f(uLoc.uTime,performance.now()*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ---------- loop ----------
let paused=false,last=performance.now(),fps=60;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(!paused && !document.hidden){ step(dt); draw(); }
  fps+=((1/Math.max(dt,1e-4))-fps)*0.08;
  hud.textContent=`${nBalls} balls · ${PAL_NAMES[palette]} · ${fps.toFixed(0)} fps`;
  requestAnimationFrame(loop);
}

// ---------- controls ----------
const $=id=>document.getElementById(id);
function bind(slider,val,fmt,set){ const s=$(slider),v=$(val);
  s.oninput=()=>{ set(parseFloat(s.value)); v.textContent=fmt(parseFloat(s.value)); }; }
function setN(x){ nBalls=Math.max(2,Math.min(MAXB-1,x|0)); $('sN').value=nBalls; $('vN').textContent=nBalls; }
bind('sN','vN',x=>x|0,x=>setN(x|0));
bind('sT','vT',x=>x.toFixed(2),x=>{ threshold=x; });
bind('sS','vS',x=>x.toFixed(2),x=>{ sizeMul=x; });
bind('sV','vV',x=>x.toFixed(2),x=>{ speedMul=x; });
bind('sG','vG',x=>x.toFixed(2),x=>{ glowMul=x; });
bind('sP','vP',x=>PAL_NAMES[x|0],x=>{ palette=x|0; });
$('style').onclick=()=>{ contour=contour?0:1; $('style').textContent=contour?'Contour':'Filled'; };
$('reseed').onclick=()=>seed();
$('pause').onclick=()=>{paused=!paused; $('pause').textContent=paused?'Play':'Pause';};
$('save').onclick=()=>{ const a=document.createElement('a');
  a.download='metaballs.png'; a.href=cv.toDataURL('image/png'); a.click(); };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '){paused=!paused;$('pause').textContent=paused?'Play':'Pause';e.preventDefault();}
  else if(e.key==='r')seed();
  else if(e.key==='h')panel.classList.toggle('hidden');
  else if(e.key==='s')$('save').click();
});

// ---------- go ----------
resize();
if(!gl){
  document.body.innerHTML='<p style="padding:40px;font-family:system-ui">WebGL2 not available in this browser.</p>';
} else {
  buildProgram();
  seed();
  requestAnimationFrame(loop);
}
</script>
<!-- sg-nav -->
<script src="../pieces.js"></script>
<script>
(function(){
  if (document.getElementById('sg-nav')) return;
  var pieces = window.PIECES;
  if (!pieces || !pieces.length) return;
  var here = (location.pathname.split('/').pop() || '').toLowerCase();
  var idx = -1;
  for (var i = 0; i < pieces.length; i++) {
    if ((pieces[i].file || '').toLowerCase() === here) { idx = i; break; }
  }
  if (idx < 0) return;
  var n = pieces.length;
  var prev = pieces[(idx - 1 + n) % n];
  var next = pieces[(idx + 1) % n];
  var neutral = 'rgba(220,225,235,0.85)';

  var bar = document.createElement('div');
  bar.id = 'sg-nav';
  bar.style.cssText = 'position:fixed;bottom:10px;left:50%;transform:translateX(-50%);' +
    'z-index:50;pointer-events:auto;font:11px ui-monospace,Menlo,monospace;' +
    'opacity:0.45;transition:opacity .18s ease;white-space:nowrap;' +
    'letter-spacing:.02em;-webkit-font-smoothing:antialiased;user-select:none;';
  bar.addEventListener('mouseenter', function(){ bar.style.opacity = '0.9'; });
  bar.addEventListener('mouseleave', function(){ bar.style.opacity = '0.45'; });

  function mkLink(piece, label){
    var a = document.createElement('a');
    a.href = piece.file;
    a.style.cssText = 'color:' + (piece.accent || neutral) + ';text-decoration:none;';
    a.textContent = label;
    return a;
  }
  var prevLink = mkLink(prev, '‹ ' + prev.name);
  var nextLink = mkLink(next, next.name + ' ›');
  var sep = document.createElement('span');
  sep.textContent = '   ·   ';
  sep.style.color = 'rgba(180,185,195,0.6)';

  bar.appendChild(prevLink);
  bar.appendChild(sep);
  bar.appendChild(nextLink);
  document.body.appendChild(bar);

  window.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var t = e.target;
    if (t) {
      var tag = (t.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
    }
    if (e.key === 'ArrowLeft') { location.href = prev.file; }
    else if (e.key === 'ArrowRight') { location.href = next.file; }
  });
})();
</script>
</body>
