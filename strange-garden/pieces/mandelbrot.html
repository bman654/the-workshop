<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbrot — Strange Garden</title>
<style>
  :root { --accent: #f0a830; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0a0b0f; overflow:hidden;
    font-family: system-ui, sans-serif; color:#e6e8ee; -webkit-user-select:none; user-select:none; }
  #c { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #panel { position:fixed; top:16px; left:16px; width:264px; padding:16px 16px 14px;
    background:rgba(18,20,28,.66); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 8px 40px rgba(0,0,0,.5); font-size:13px; transition:opacity .2s; }
  #panel.hidden { opacity:0; pointer-events:none; }
  #panel h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #panel .desc { font-size:11px; opacity:.55; margin:0 0 10px; line-height:1.45; }
  #panel label { font-size:11px; opacity:.8; margin:11px 0 3px;
    font-family:ui-monospace,Menlo,monospace; display:flex; justify-content:space-between; }
  #panel label b { color:var(--accent); font-weight:600; }
  #panel input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
  #panel select { width:100%; margin:0; font-size:11px; color:#e6e8ee; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; padding:6px 7px; font-family:ui-monospace,Menlo,monospace; }
  #panel select:hover { background:rgba(255,255,255,.10); }
  #panel .iterRow.off input[type=range] { opacity:.35; pointer-events:none; }
  .row { display:flex; gap:8px; margin-top:13px; }
  .toggle { display:flex; align-items:center; justify-content:space-between; margin-top:13px;
    font:11px ui-monospace,Menlo,monospace; opacity:.85; }
  .toggle input { accent-color:var(--accent); width:auto; }
  button { flex:1; padding:7px 4px; font-size:12px; cursor:pointer; color:#e6e8ee;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; transition:background .15s; }
  button:hover { background:rgba(255,255,255,.13); }
  button.pri { border-color:color-mix(in srgb,var(--accent) 50%,transparent);
    background:color-mix(in srgb,var(--accent) 14%,transparent); }
  #hud { position:fixed; bottom:10px; right:14px; font:11px ui-monospace,Menlo,monospace;
    opacity:.45; text-align:right; }
  #hint { position:fixed; bottom:10px; left:16px; font:11px ui-monospace,Menlo,monospace;
    opacity:.3; }
  a.back { position:fixed; top:18px; right:18px; font:12px ui-monospace,Menlo,monospace;
    color:#e6e8ee; opacity:.4; text-decoration:none; }
  a.back:hover { opacity:.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Mandelbrot</h1>
  <p class="desc">An endless coastline. We fall forever toward its edge, and the
    same impossible detail keeps blooming, smaller and smaller, all the way down.</p>
  <div class="toggle"><span>auto-zoom</span><input type="checkbox" id="auto" checked></div>
  <label>Target <b id="vTgtName"></b></label>
  <select id="sTarget"></select>
  <label>Zoom speed <b id="vSpd">0.45</b></label>
  <input type="range" id="sSpd" min="0.05" max="1.5" step="0.01" value="0.45">
  <div class="toggle"><span>auto iterations</span><input type="checkbox" id="autoIter" checked></div>
  <div class="iterRow" id="iterRow">
    <label>Max iterations <b id="vIter">300</b></label>
    <input type="range" id="sIter" min="80" max="2000" step="20" value="300">
  </div>
  <label>Palette <b id="vPal">0</b></label>
  <input type="range" id="sPal" min="0" max="5" step="1" value="0">
  <label>Color cycle <b id="vCyc">0.25</b></label>
  <input type="range" id="sCyc" min="0" max="1.5" step="0.01" value="0.25">
  <div class="row"><button id="reset" class="pri">Reset view</button><button id="pause">Pause</button></div>
  <div class="row"><button id="save">Save PNG</button></div>
</div>
<div id="hud"></div>
<div id="hint">scroll / +− zoom · click recenters · space pause · r reset · h hides · s saves</div>
<a class="back" href="../index.html">← garden</a>
<script>
const cv=document.getElementById('c');
const panel=document.getElementById('panel'), hud=document.getElementById('hud');
const $=id=>document.getElementById(id);
let W,H,DPR;

// ---------- famous deep-zoom targets ----------
const TARGETS=[
  {name:'Seahorse Valley', x:-0.743643887037151,  y: 0.131825904205330},
  {name:'Elephant Valley', x: 0.275,               y: 0.482},
  {name:'Triple Spiral',   x:-0.7756837700,        y: 0.1364673700},
  {name:'Mini Mandelbrot', x:-1.7687788770,        y: 0.0017389970},
  {name:'Scepter Valley',  x:-0.1010963415,        y: 0.9562865108},
  {name:'Dendrite Spike',  x:-0.10109636384562,    y: 0.95628651080914},
  {name:'Feather',         x:-1.62917000000000,    y: 0.0203968000000},
  {name:'Spiral Nebula',   x:-0.7453000000,        y: 0.1127000000},
];

// ---------- view + zoom state (center kept in JS doubles) ----------
const HOME_X=-0.6, HOME_Y=0.0, HOME_SCALE=1.6;   // scale = half-height of view in complex units / "1x"
let cx=HOME_X, cy=HOME_Y;        // current center (complex)
let scale=HOME_SCALE;            // half-height of view in complex units; smaller => deeper
const MIN_SCALE=1.6e-6;          // float32 precision floor — cap zoom here
let targetIdx=0;
let auto=true, zoomSpeed=0.45;
let autoIter=true, maxIter=300;
let palette=0, colorCycle=0.25, colorPhase=0;
let resetting=false;             // true while zooming back out before next target
let renderer='';

// ---------- WebGL2 ----------
let gl=null, prog=null, uni={}, vao=null;

const VERT=`#version 300 es
in vec2 a_pos;
void main(){ gl_Position=vec4(a_pos,0.0,1.0); }`;

const FRAG=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2  u_res;
uniform vec2  u_center;
uniform float u_scale;   // half-height of view in complex units
uniform float u_iter;
uniform float u_pal;
uniform float u_phase;

// smooth cyclic palette — several flavours
vec3 palette(float t, float mode){
  t = fract(t);
  float a = t * 6.28318530718;
  vec3 col;
  if(mode < 0.5){
    // molten gold / ember (accent)
    col = 0.5 + 0.5*cos(a + vec3(0.0, 0.7, 1.6));
    col = pow(col, vec3(0.85, 1.0, 1.5));
  } else if(mode < 1.5){
    // ice & amber
    col = 0.5 + 0.5*cos(a + vec3(1.2, 2.4, 4.6));
  } else if(mode < 2.5){
    // ocean / aurora
    col = 0.5 + 0.5*cos(a + vec3(3.6, 2.2, 0.7));
  } else if(mode < 3.5){
    // amethyst / magenta
    col = 0.5 + 0.5*cos(a + vec3(4.2, 2.0, 0.6));
  } else if(mode < 4.5){
    // spectral rainbow (gentle)
    col = 0.5 + 0.5*cos(a + vec3(0.0, 2.094, 4.188));
  } else {
    // jade / verdigris glow
    col = 0.5 + 0.5*cos(a*0.5 + vec3(2.4, 1.6, 1.0));
    col *= vec3(0.7, 1.05, 0.95);
  }
  return clamp(col, 0.0, 1.0);
}

void main(){
  // map pixel -> complex plane, aspect-correct, centered on u_center
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;   // y in [-0.5,0.5]
  vec2 c = u_center + uv * (2.0 * u_scale);

  float escR2 = 256.0;     // larger bailout => smoother continuous coloring
  float maxi = u_iter;
  float zx=0.0, zy=0.0;
  float m2=0.0;
  float n=0.0;
  // cardioid / period-2 bulb early-out (skip the big interior cheaply)
  float xq = c.x - 0.25;
  float q = xq*xq + c.y*c.y;
  bool inMain = q*(q + xq) <= 0.25*c.y*c.y;
  bool inBulb = (c.x+1.0)*(c.x+1.0) + c.y*c.y <= 0.0625;
  if(inMain || inBulb){
    n = maxi;
    m2 = escR2;
  } else {
    for(int i=0;i<4000;i++){
      if(float(i) >= maxi) break;
      float nx = zx*zx - zy*zy + c.x;
      float ny = 2.0*zx*zy + c.y;
      zx=nx; zy=ny;
      m2 = zx*zx + zy*zy;
      if(m2 > escR2) break;
      n += 1.0;
    }
  }

  vec3 col;
  if(n >= maxi){
    // interior — near-black with a faint warm ember pulse
    float inner = 0.5 + 0.5*sin(u_phase*2.0);
    col = vec3(0.012, 0.010, 0.022) + 0.014*inner*vec3(1.0, 0.55, 0.18);
  } else {
    // smooth (continuous) iteration count
    float mu = n + 1.0 - log2(log(sqrt(m2)));
    // band density grows slowly with depth so detail stays legible deep in
    float t = mu*0.022 + u_phase;
    col = palette(t, u_pal);
    // gentle contrast lift + slight vignette of brightness near the boundary
    col = pow(col, vec3(0.92));
    // brighten freshly-escaped filaments a touch (high mu region)
    float glow = smoothstep(0.0, 6.0, mu) * (1.0 - smoothstep(maxi*0.85, maxi, n));
    col += 0.06 * glow * vec3(1.0, 0.85, 0.6);
  }
  o = vec4(col, 1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error('shader compile error:', gl.getShaderInfoLog(s)); return null;
  }
  return s;
}
function initGL(){
  gl = cv.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true});
  if(!gl) return false;
  const vs=compile(gl.VERTEX_SHADER,VERT), fs=compile(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs) return false;
  prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs);
  gl.bindAttribLocation(prog,0,'a_pos'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
    console.error('program link error:', gl.getProgramInfoLog(prog)); return false;
  }
  gl.useProgram(prog);
  const buf=gl.createBuffer();
  vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  for(const u of ['u_res','u_center','u_scale','u_iter','u_pal','u_phase'])
    uni[u]=gl.getUniformLocation(prog,u);
  return true;
}
function drawGL(){
  gl.viewport(0,0,W,H);
  gl.uniform2f(uni.u_res, W, H);
  gl.uniform2f(uni.u_center, cx, cy);
  gl.uniform1f(uni.u_scale, scale);
  gl.uniform1f(uni.u_iter, effectiveIter());
  gl.uniform1f(uni.u_pal, palette);
  gl.uniform1f(uni.u_phase, colorPhase);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ---------- Canvas2D fallback ----------
let ctx2d=null, img=null, off=null, octx=null, oW=0, oH=0;
const C2D_SCALE=0.4;
function initC2D(){ ctx2d=cv.getContext('2d'); off=document.createElement('canvas'); octx=off.getContext('2d'); }
function paletteJS(t, mode){
  t=t-Math.floor(t); const a=t*6.28318530718;
  const cos=p=>0.5+0.5*Math.cos(a+p);
  let r,g,b;
  if(mode<0.5){ r=Math.pow(cos(0),0.85); g=Math.pow(cos(0.7),1.0); b=Math.pow(cos(1.6),1.5); }
  else if(mode<1.5){ r=cos(1.2); g=cos(2.4); b=cos(4.6); }
  else if(mode<2.5){ r=cos(3.6); g=cos(2.2); b=cos(0.7); }
  else if(mode<3.5){ r=cos(4.2); g=cos(2.0); b=cos(0.6); }
  else if(mode<4.5){ r=cos(0); g=cos(2.094); b=cos(4.188); }
  else { r=0.7*(0.5+0.5*Math.cos(a*0.5+2.4)); g=1.05*(0.5+0.5*Math.cos(a*0.5+1.6)); b=0.95*(0.5+0.5*Math.cos(a*0.5+1.0)); }
  return [Math.max(0,Math.min(1,r)),Math.max(0,Math.min(1,g)),Math.max(0,Math.min(1,b))];
}
function drawC2D(){
  oW=Math.max(2,Math.floor(W*C2D_SCALE)); oH=Math.max(2,Math.floor(H*C2D_SCALE));
  if(off.width!==oW||off.height!==oH){ off.width=oW; off.height=oH; img=octx.createImageData(oW,oH); }
  const mi=Math.min(effectiveIter(), 500);
  const escR2=256.0, data=img.data;
  for(let py=0;py<oH;py++){
    const v=((py-0.5*oH)/oH);
    for(let px=0;px<oW;px++){
      const u=((px-0.5*oW)/oH);
      const ccx=cx+u*2*scale, ccy=cy+v*2*scale;
      let zx=0, zy=0, n=0, m2=0;
      // interior early-outs
      const xq=ccx-0.25, q=xq*xq+ccy*ccy;
      if(q*(q+xq)<=0.25*ccy*ccy || (ccx+1)*(ccx+1)+ccy*ccy<=0.0625){ n=mi; m2=escR2; }
      else { while(n<mi){ const nx=zx*zx-zy*zy+ccx, ny=2*zx*zy+ccy; zx=nx; zy=ny; m2=zx*zx+zy*zy; if(m2>escR2) break; n++; } }
      const idx=(py*oW+px)*4;
      if(n>=mi){ data[idx]=3; data[idx+1]=3; data[idx+2]=6; data[idx+3]=255; }
      else {
        const mu=n+1-Math.log2(Math.log(Math.sqrt(m2)));
        const col=paletteJS(mu*0.022+colorPhase, palette);
        data[idx]=Math.pow(col[0],0.92)*255;
        data[idx+1]=Math.pow(col[1],0.92)*255;
        data[idx+2]=Math.pow(col[2],0.92)*255;
        data[idx+3]=255;
      }
    }
  }
  octx.putImageData(img,0,0);
  ctx2d.imageSmoothingEnabled=true;
  ctx2d.drawImage(off,0,0,oW,oH,0,0,W,H);
}

// ---------- iterations scale with depth ----------
function magnification(){ return HOME_SCALE/scale; }
function autoIterCount(){
  // iter grows ~ with log of magnification so detail keeps resolving deep in
  const mag=magnification();
  return Math.round(180 + 90*Math.log2(Math.max(1,mag)));
}
function effectiveIter(){
  let v = autoIter ? autoIterCount() : maxIter;
  return Math.max(60, Math.min(v, 4000));
}

// ---------- resize ----------
function resize(){
  DPR=Math.min(devicePixelRatio||1, renderer==='WebGL'?2:1);
  W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
}
addEventListener('resize',resize);

// ---------- screen <-> complex ----------
function clientToC(clientX, clientY){
  const r=cv.getBoundingClientRect();
  const fx=(clientX-r.left)/r.width, fy=(clientY-r.top)/r.height;
  // gl_FragCoord origin bottom-left; clientY top-down -> flip
  const u=(fx-0.5)*(W/H);        // matches uv.x scaling (res.x/res.y)
  const vv=(0.5-fy);             // y up
  return [cx+u*2*scale, cy+vv*2*scale];
}

// ---------- interaction ----------
function pauseAuto(){ if(auto){ auto=false; $('auto').checked=false; } resetting=false; }
function zoomAt(clientX, clientY, factor){
  // keep the point under the cursor fixed while scaling
  const before=clientToC(clientX, clientY);
  scale=Math.max(MIN_SCALE, Math.min(HOME_SCALE, scale*factor));
  const after=clientToC(clientX, clientY);
  cx += before[0]-after[0];
  cy += before[1]-after[1];
}
cv.addEventListener('wheel',e=>{
  e.preventDefault(); pauseAuto();
  const factor = e.deltaY>0 ? 1.12 : 1/1.12;
  zoomAt(e.clientX, e.clientY, factor);
},{passive:false});
cv.addEventListener('click',e=>{
  pauseAuto();
  const c=clientToC(e.clientX, e.clientY);
  cx=c[0]; cy=c[1];
});

// ---------- loop ----------
let paused=false,last=performance.now(),fps=60;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(!paused && !document.hidden){
    if(auto){
      const tg=TARGETS[targetIdx];
      if(!resetting){
        // ease the center toward the target while zooming in
        const k=Math.min(1, dt*1.6);
        cx += (tg.x-cx)*k; cy += (tg.y-cy)*k;
        scale *= Math.exp(-zoomSpeed*dt);
        if(scale<=MIN_SCALE){ scale=MIN_SCALE; resetting=true; }
      } else {
        // zoom back out, then advance to the next target
        scale *= Math.exp(zoomSpeed*1.8*dt);
        if(scale>=HOME_SCALE){
          scale=HOME_SCALE; cx=HOME_X; cy=HOME_Y;
          targetIdx=(targetIdx+1)%TARGETS.length; syncTargetUI();
          resetting=false;
        }
      }
      if(autoIter){ $('vIter').textContent=effectiveIter(); }
    }
    colorPhase += colorCycle*dt*0.08;
    if(renderer==='WebGL') drawGL(); else drawC2D();
  }
  fps+=((1/Math.max(dt,1e-4))-fps)*0.08;
  const mag=magnification();
  const magStr = mag<1000 ? mag.toFixed(0)+'×'
               : mag<1e6 ? (mag/1e3).toFixed(1)+'k×'
               : (mag/1e6).toFixed(2)+'M×';
  hud.textContent=`${renderer} · ${magStr} · ${effectiveIter()} it · ${fps.toFixed(0)} fps`;
  requestAnimationFrame(loop);
}

// ---------- controls ----------
function buildTargetMenu(){
  const sel=$('sTarget');
  TARGETS.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.name; sel.appendChild(o); });
  sel.value=targetIdx;
}
function syncTargetUI(){ $('sTarget').value=targetIdx; $('vTgtName').textContent=TARGETS[targetIdx].name; }
function bind(slider,val,fmt,set){ const s=$(slider),v=$(val);
  s.oninput=()=>{ const x=parseFloat(s.value); set(x); v.textContent=fmt(x); }; }

$('auto').onchange=()=>{ auto=$('auto').checked; resetting=false; };
$('sTarget').onchange=()=>{
  targetIdx=parseInt($('sTarget').value,10); syncTargetUI();
  // jump fresh into the new target: reset out and start zooming again
  cx=HOME_X; cy=HOME_Y; scale=HOME_SCALE; resetting=false;
  auto=true; $('auto').checked=true;
};
bind('sSpd','vSpd',x=>x.toFixed(2),x=>zoomSpeed=x);
$('autoIter').onchange=()=>{ autoIter=$('autoIter').checked; $('iterRow').classList.toggle('off',autoIter); };
bind('sIter','vIter',x=>x|0,x=>maxIter=x|0);
bind('sPal','vPal',x=>x|0,x=>palette=x|0);
bind('sCyc','vCyc',x=>x.toFixed(2),x=>colorCycle=x);

function resetView(){
  cx=HOME_X; cy=HOME_Y; scale=HOME_SCALE; resetting=false;
  auto=true; $('auto').checked=true;
}
$('reset').onclick=resetView;
$('pause').onclick=()=>{ paused=!paused; $('pause').textContent=paused?'Play':'Pause'; };
$('save').onclick=()=>{ if(renderer==='WebGL') drawGL(); else drawC2D();
  const a=document.createElement('a'); a.download='mandelbrot.png'; a.href=cv.toDataURL('image/png'); a.click(); };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key===' '){ paused=!paused; $('pause').textContent=paused?'Play':'Pause'; e.preventDefault(); }
  else if(e.key==='r') resetView();
  else if(e.key==='h') panel.classList.toggle('hidden');
  else if(e.key==='s') $('save').click();
  else if(e.key==='+'||e.key==='='){ pauseAuto(); zoomAt(innerWidth/2,innerHeight/2,1/1.2); }
  else if(e.key==='-'||e.key==='_'){ pauseAuto(); zoomAt(innerWidth/2,innerHeight/2,1.2); }
});

// ---------- go ----------
if(initGL()){ renderer='WebGL'; }
else { renderer='Canvas2D'; initC2D(); }
console.log('Mandelbrot renderer:', renderer);
buildTargetMenu(); syncTargetUI();
$('iterRow').classList.toggle('off',autoIter);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
