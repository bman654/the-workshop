<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Body — Strange Garden</title>
<style>
  :root { --accent: #b79bff; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0a0b0f; overflow:hidden;
    font-family: system-ui, sans-serif; color:#e6e8ee; -webkit-user-select:none; user-select:none; }
  #c { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #panel { position:fixed; top:16px; left:16px; width:264px; padding:16px 16px 14px;
    background:rgba(18,20,28,.66); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 8px 40px rgba(0,0,0,.5); font-size:13px; transition:opacity .2s; }
  #panel.hidden { opacity:0; pointer-events:none; }
  #panel h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #panel .desc { font-size:11px; opacity:.55; margin:0 0 10px; line-height:1.45; }
  #panel label { font-size:11px; opacity:.8; margin:11px 0 3px;
    font-family:ui-monospace,Menlo,monospace; display:flex; justify-content:space-between; }
  #panel label b { color:var(--accent); font-weight:600; }
  #panel input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
  #panel select { width:100%; margin-top:3px; padding:5px 6px; font-size:12px; color:#e6e8ee;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:8px;
    font-family:ui-monospace,Menlo,monospace; }
  .row { display:flex; gap:8px; margin-top:13px; }
  button { flex:1; padding:7px 4px; font-size:12px; cursor:pointer; color:#e6e8ee;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; transition:background .15s; }
  button:hover { background:rgba(255,255,255,.13); }
  button.pri { border-color:color-mix(in srgb,var(--accent) 50%,transparent);
    background:color-mix(in srgb,var(--accent) 14%,transparent); }
  #hud { position:fixed; bottom:10px; right:14px; font:11px ui-monospace,Menlo,monospace;
    opacity:.4; text-align:right; }
  #hint { position:fixed; bottom:10px; left:16px; font:11px ui-monospace,Menlo,monospace;
    opacity:.3; }
  a.back { position:fixed; top:18px; right:18px; font:12px ui-monospace,Menlo,monospace;
    color:#e6e8ee; opacity:.4; text-decoration:none; }
  a.back:hover { opacity:.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>N-Body</h1>
  <p class="desc">Massive suns and a haze of dust, bound only by gravity, settle into
    spiral arms and slow orbital dances.</p>
  <label>Config</label>
  <select id="sCfg">
    <option value="disc">Disc — spiral galaxy</option>
    <option value="two">Two galaxies — collision</option>
    <option value="cloud">Random cloud — collapse</option>
  </select>
  <label>Particles <b id="vN">4000</b></label>
  <input type="range" id="sN" min="500" max="14000" step="500" value="4000">
  <label>Gravity G <b id="vG">1.4</b></label>
  <input type="range" id="sG" min="0.2" max="4" step="0.1" value="1.4">
  <label>Softening <b id="vEps">26</b></label>
  <input type="range" id="sEps" min="6" max="80" step="2" value="26">
  <label>Central mass <b id="vM">5200</b></label>
  <input type="range" id="sM" min="800" max="12000" step="200" value="5200">
  <label>Attractors <b id="vA">1</b></label>
  <input type="range" id="sA" min="1" max="3" step="1" value="1">
  <label>Trail persistence <b id="vT">0.90</b></label>
  <input type="range" id="sT" min="0" max="0.97" step="0.01" value="0.90">
  <div class="row"><button id="reseed" class="pri">Reseed</button><button id="pause">Pause</button></div>
  <div class="row"><button id="save">Save PNG</button></div>
</div>
<div id="hud"></div>
<div id="hint">click &amp; hold to drop a gravity well · h hides panel</div>
<a class="back" href="../index.html">← garden</a>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const panel=document.getElementById('panel'), hud=document.getElementById('hud');
let W,H,DPR,worldW,worldH;
function resize(){
  const oldW=worldW, oldH=worldH;
  DPR=Math.min(devicePixelRatio||1,2);
  worldW=innerWidth; worldH=innerHeight;
  W=cv.width=Math.floor(worldW*DPR); H=cv.height=Math.floor(worldH*DPR);
  cv.style.width=worldW+'px'; cv.style.height=worldH+'px';
  if(oldW){ const sx=worldW/oldW, sy=worldH/oldH;
    if(px) for(let i=0;i<n;i++){ px[i]*=sx; py[i]*=sy; }
    for(let k=0;k<att.length;k++){ att[k].x*=sx; att[k].y*=sy; } }
  ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);

// ---- parameters ----
let n=4000, G=1.4, eps=26, centralM=5200, nAtt=1, persistence=0.90, cfg='disc';
const VMAX=2200;                 // velocity clamp (world px/s)
let px,py,vx,vy,spd;             // particle state (typed arrays)
let att=[];                      // attractor bodies {x,y,vx,vy,m}

// ---- colour ramp (cool deep-space -> warm core), precomputed sprite atlas ----
const RAMP=[ [38,52,120],[70,86,196],[120,120,232],[170,150,236],
            [224,176,210],[245,200,150],[255,232,180] ];
let sprites=[]; const NSPR=24;
function lerp(a,b,t){return a+(b-a)*t;}
function rampColor(t){
  t=t<0?0:t>1?1:t; const f=t*(RAMP.length-1), i=f|0, fr=f-i;
  const a=RAMP[i], b=RAMP[Math.min(i+1,RAMP.length-1)];
  return [lerp(a[0],b[0],fr)|0, lerp(a[1],b[1],fr)|0, lerp(a[2],b[2],fr)|0];
}
function makeSprites(){
  sprites=[];
  const s=Math.max(3,Math.round(3.0*DPR));     // glow radius in device px
  for(let k=0;k<NSPR;k++){
    const col=rampColor(k/(NSPR-1));
    const cvs=document.createElement('canvas'); cvs.width=cvs.height=s*2;
    const g=cvs.getContext('2d');
    const grad=g.createRadialGradient(s,s,0,s,s,s);
    grad.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},1)`);
    grad.addColorStop(0.35,`rgba(${col[0]},${col[1]},${col[2]},0.6)`);
    grad.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
    g.fillStyle=grad; g.beginPath(); g.arc(s,s,s,0,7); g.fill();
    sprites.push(cvs);
  }
}

// star sprite for the massive attractors (bigger, brighter core)
let starSprite;
function makeStarSprite(){
  const s=Math.max(10,Math.round(22*DPR));
  const cvs=document.createElement('canvas'); cvs.width=cvs.height=s*2;
  const g=cvs.getContext('2d');
  const grad=g.createRadialGradient(s,s,0,s,s,s);
  grad.addColorStop(0,'rgba(255,250,235,0.95)');
  grad.addColorStop(0.18,'rgba(255,228,180,0.7)');
  grad.addColorStop(0.5,'rgba(220,160,120,0.25)');
  grad.addColorStop(1,'rgba(180,120,200,0)');
  g.fillStyle=grad; g.beginPath(); g.arc(s,s,s,0,7); g.fill();
  starSprite=cvs;
}

// ---- circular orbital velocity helper ----
// v so a test particle at distance r from a body of mass m holds a near-circular orbit.
function orbitalSpeed(m,r){ return Math.sqrt(G*m/Math.sqrt(r*r+eps*eps)); }

// ---- seed a rotating disc of test particles around a centre ----
// arms>0 biases particles into that many logarithmic spiral arms so the disc
// reads as a spiral galaxy; differential rotation keeps winding the arms.
function seedDisc(i0,count,cx,cy,bulkVx,bulkVy,m,spin,maxR,minR,arms){
  arms=arms||0;
  const pitch=0.32;            // tightness of the log-spiral
  for(let i=i0;i<i0+count;i++){
    // bias inward for a denser bright core
    let rr=Math.random(); rr=rr*rr*0.45+rr*0.55;
    const r=minR + rr*(maxR-minR);
    let a;
    if(arms>0){
      // base angle along a log spiral for a chosen arm, plus scatter
      const arm=(Math.random()*arms|0);
      const base=arm/arms*Math.PI*2;
      const wind=spin*Math.log(r/minR)/pitch;     // log-spiral winding
      // scatter tightens toward the core, widens outward
      const scatter=(Math.random()-0.5)*(0.9+ (r/maxR)*1.6);
      a=base+wind+scatter;
    } else {
      a=Math.random()*Math.PI*2;
    }
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    px[i]=x; py[i]=y;
    const vc=orbitalSpeed(m,r)*(0.9+Math.random()*0.12);
    // tangential (perpendicular to radius), spin = +1 / -1
    const tx=-Math.sin(a)*spin, ty=Math.cos(a)*spin;
    vx[i]=bulkVx+tx*vc; vy[i]=bulkVy+ty*vc;
  }
}

function placeAttractors(){
  att=[];
  if(cfg==='two'){
    // two heavy cores; handled in seedTwo, but list them here for gravity
    return;
  }
  const cx=worldW*0.5, cy=worldH*0.5;
  if(nAtt===1){
    att.push({x:cx,y:cy,vx:0,vy:0,m:centralM});
  } else {
    // 2 or 3 attractors orbiting their common centre
    const R=Math.min(worldW,worldH)*0.16, mEach=centralM/nAtt*1.25;
    const totM=mEach*nAtt;
    for(let k=0;k<nAtt;k++){
      const a=k/nAtt*Math.PI*2;
      const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
      // give each a tangential velocity for a slow mutual orbit
      const vc=Math.sqrt(G*totM/Math.sqrt(R*R*3+eps*eps))*0.55;
      att.push({x,y,vx:-Math.sin(a)*vc,vy:Math.cos(a)*vc,m:mEach});
    }
  }
}

function init(){
  px=new Float32Array(n); py=new Float32Array(n);
  vx=new Float32Array(n); vy=new Float32Array(n); spd=new Float32Array(n);
  const cx=worldW*0.5, cy=worldH*0.5;
  const baseR=Math.min(worldW,worldH);

  if(cfg==='disc'){
    placeAttractors();
    const maxR=baseR*0.42, minR=baseR*0.045;
    const spin=1;
    if(att.length===1){
      seedDisc(0,n,cx,cy,0,0,att[0].m,spin,maxR,minR,2);
    } else {
      // disc around the multi-attractor barycentre, using total mass
      let totM=0; for(const a of att) totM+=a.m;
      seedDisc(0,n,cx,cy,0,0,totM,spin,maxR,baseR*0.20,0);
    }
  } else if(cfg==='two'){
    // two galaxies on a collision course
    const m=centralM*0.9;
    const sep=baseR*0.30, drift=Math.min(worldW,worldH)*0.10;
    const c1x=cx-sep, c1y=cy-drift*0.4, c2x=cx+sep, c2y=cy+drift*0.4;
    att=[ {x:c1x,y:c1y,vx:drift*0.6,vy:drift*0.18,m:m},
          {x:c2x,y:c2y,vx:-drift*0.6,vy:-drift*0.18,m:m} ];
    const maxR=baseR*0.18, minR=baseR*0.025;
    const half=n>>1;
    seedDisc(0,half,c1x,c1y,att[0].vx,att[0].vy,m,1,maxR,minR,2);
    seedDisc(half,n-half,c2x,c2y,att[1].vx,att[1].vy,m,-1,maxR,minR,2);
  } else { // random cloud
    placeAttractors();
    const R=baseR*0.40;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R;
      px[i]=cx+Math.cos(a)*r; py[i]=cy+Math.sin(a)*r;
      // gentle shared rotation so the collapse swirls rather than just falls
      const vc=orbitalSpeed(att.length?att[0].m:centralM,r)*0.45;
      vx[i]=-Math.sin(a)*vc + (Math.random()-0.5)*40;
      vy[i]= Math.cos(a)*vc + (Math.random()-0.5)*40;
    }
  }
  ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,W,H);
}

// ---- mouse gravity well ----
let mDown=false,mx=0,my=0;
cv.addEventListener('pointerdown',e=>{mDown=true;mx=e.clientX;my=e.clientY;});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('pointerup',()=>mDown=false);
cv.addEventListener('pointerleave',()=>mDown=false);

// ---- physics: semi-implicit (symplectic) Euler, gravity with softening ----
const SUB=2;                     // substeps for stability at high G
function step(dtFull){
  const dt=dtFull/SUB;
  const eps2=eps*eps;
  const mouseM = centralM*2.2;   // strength of the dropped well
  for(let s=0;s<SUB;s++){
    // update orbiting attractors (mutual gravity between heavy bodies)
    if(att.length>1){
      for(let k=0;k<att.length;k++){
        let ax=0,ay=0;
        for(let j=0;j<att.length;j++){ if(j===k)continue;
          const rx=att[j].x-att[k].x, ry=att[j].y-att[k].y;
          const d2=rx*rx+ry*ry+eps2*4, inv=1/(d2*Math.sqrt(d2));
          const f=G*att[j].m*inv; ax+=rx*f; ay+=ry*f;
        }
        att[k].vx+=ax*dt; att[k].vy+=ay*dt;
      }
      for(let k=0;k<att.length;k++){ att[k].x+=att[k].vx*dt; att[k].y+=att[k].vy*dt; }
    }
    const A=att, na=A.length;
    const haveMouse=mDown;
    for(let i=0;i<n;i++){
      let ax=0,ay=0; const xi=px[i], yi=py[i];
      // gravity from each massive attractor
      for(let k=0;k<na;k++){
        const a=A[k];
        const rx=a.x-xi, ry=a.y-yi;
        const d2=rx*rx+ry*ry+eps2;
        const inv=1/(d2*Math.sqrt(d2));        // 1/(r^2+eps^2)^(3/2)
        const f=G*a.m*inv;
        ax+=rx*f; ay+=ry*f;
      }
      // mouse gravity well
      if(haveMouse){
        const rx=mx-xi, ry=my-yi;
        const d2=rx*rx+ry*ry+eps2*3;
        const inv=1/(d2*Math.sqrt(d2));
        const f=G*mouseM*inv;
        ax+=rx*f; ay+=ry*f;
      }
      // semi-implicit Euler: v first, then x
      let nvx=vx[i]+ax*dt, nvy=vy[i]+ay*dt;
      // clamp extreme velocities
      const v2=nvx*nvx+nvy*nvy;
      if(v2>VMAX*VMAX){ const sc=VMAX/Math.sqrt(v2); nvx*=sc; nvy*=sc; }
      vx[i]=nvx; vy[i]=nvy;
      px[i]=xi+nvx*dt; py[i]=yi+nvy*dt;
      if(s===SUB-1) spd[i]=Math.sqrt(v2);
    }
  }
}

function draw(){
  // persistence fade (trails)
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(10,11,15,${Math.max(0.03,1-persistence)})`;
  ctx.fillRect(0,0,W,H);
  // additive glow, capped brightness via low per-sprite alpha
  ctx.globalCompositeOperation='lighter';
  // map speed -> colour index; scale by a reference speed for nice spread
  const ref=1/420;
  for(let i=0;i<n;i++){
    let t=spd[i]*ref; if(t>1)t=1;
    const idx=(t*(NSPR-1))|0;
    const sp=sprites[idx], hw=sp.width*0.5;
    ctx.drawImage(sp, px[i]*DPR-hw, py[i]*DPR-hw);
  }
  // the suns
  if(starSprite){
    const hw=starSprite.width*0.5;
    for(let k=0;k<att.length;k++){
      ctx.drawImage(starSprite, att[k].x*DPR-hw, att[k].y*DPR-hw);
    }
  }
  // mouse well marker
  if(mDown){
    ctx.globalCompositeOperation='lighter';
    const r=14*DPR; const g=ctx.createRadialGradient(mx*DPR,my*DPR,0,mx*DPR,my*DPR,r);
    g.addColorStop(0,'rgba(220,200,255,0.5)'); g.addColorStop(1,'rgba(220,200,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx*DPR,my*DPR,r,0,7); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

// ---- loop ----
let paused=false,last=performance.now(),fps=60;
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.04)dt=0.04;
  if(!paused && !document.hidden){ step(dt); draw(); }
  fps+=((1/Math.max(dt,1e-4))-fps)*0.08;
  hud.textContent=`${n} bodies · ${att.length} sun${att.length>1?'s':''} · ${fps.toFixed(0)} fps`;
  requestAnimationFrame(loop);
}

// ---- controls ----
const $=id=>document.getElementById(id);
function bind(slider,val,fmt,set){ const s=$(slider),v=$(val);
  s.oninput=()=>{ const x=parseFloat(s.value); set(x); v.textContent=fmt(x); }; }
bind('sN','vN',x=>x|0,x=>{ n=x|0; init(); });
bind('sG','vG',x=>x.toFixed(1),x=>{ G=x; });
bind('sEps','vEps',x=>x|0,x=>{ eps=x; });
bind('sM','vM',x=>x|0,x=>{ centralM=x; });
bind('sA','vA',x=>x|0,x=>{ nAtt=x|0; init(); });
bind('sT','vT',x=>x.toFixed(2),x=>{ persistence=x; });
$('sCfg').onchange=()=>{ cfg=$('sCfg').value;
  // attractors slider only meaningful for non-collision modes
  $('sA').disabled = (cfg==='two');
  init(); };
$('reseed').onclick=()=>init();
$('pause').onclick=()=>{paused=!paused; $('pause').textContent=paused?'Play':'Pause';};
$('save').onclick=()=>{ const a=document.createElement('a');
  a.download='n-body.png'; a.href=cv.toDataURL('image/png'); a.click(); };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key===' '){paused=!paused;$('pause').textContent=paused?'Play':'Pause';e.preventDefault();}
  else if(e.key==='r')init();
  else if(e.key==='h')panel.classList.toggle('hidden');
  else if(e.key==='s')$('save').click();
});

// ---- go ----
resize(); makeSprites(); makeStarSprite(); init();
requestAnimationFrame(loop);
</script>
</body>
</html>
