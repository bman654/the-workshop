<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCADE — insert coin</title>
<style>
  :root{ --bg:#06070d; --ink:#eafcff; --muted:#7d8aa6; --neon:#37f7e0; --neon2:#ff3df0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; background:
    radial-gradient(900px 500px at 50% -8%, rgba(55,247,224,.12), transparent 60%),
    radial-gradient(800px 500px at 90% 110%, rgba(255,61,240,.10), transparent 55%),
    var(--bg);
    /* faint scanlines */
    background-image:
      radial-gradient(900px 500px at 50% -8%, rgba(55,247,224,.12), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, rgba(255,61,240,.10), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
  .wrap{ max-width:1180px; margin:0 auto; padding:64px 28px 96px; }
  header{ text-align:center; margin-bottom:8px; }
  h1{ font-size:clamp(44px,9vw,92px); margin:0; font-weight:800; letter-spacing:.14em;
    color:#fff; text-shadow:0 0 8px var(--neon),0 0 22px var(--neon),0 0 50px rgba(55,247,224,.6);
    animation:flicker 6s infinite; }
  @keyframes flicker{ 0%,97%,100%{opacity:1} 97.5%{opacity:.72} 98.2%{opacity:1} 98.6%{opacity:.6} }
  .sub{ color:var(--neon2); font-size:13px; letter-spacing:.4em; margin-top:14px;
    text-shadow:0 0 10px rgba(255,61,240,.7); }
  .coin{ margin-top:22px; color:var(--muted); font-size:11px; letter-spacing:.3em;
    text-transform:uppercase; animation:blink 1.4s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:.25} }
  .grid{ margin-top:50px; display:grid; gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .card{ position:relative; display:block; text-decoration:none; color:inherit;
    border-radius:14px; overflow:hidden; background:#0b0e18;
    border:1px solid rgba(120,200,255,.14);
    transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s, border-color .25s;
    opacity:0; transform:translateY(14px); animation:rise .55s forwards; }
  @keyframes rise{ to{opacity:1; transform:none;} }
  .card:hover{ transform:translateY(-6px);
    border-color:color-mix(in srgb,var(--c) 70%,transparent);
    box-shadow:0 16px 50px -14px rgba(0,0,0,.8), 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),
      0 0 42px -8px var(--c); }
  .thumb{ position:relative; aspect-ratio:16/10; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 30%, color-mix(in srgb,var(--c) 32%,#06070d), #06070d 72%); }
  .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .45s cubic-bezier(.2,.7,.2,1); }
  .card:hover .thumb img{ transform:scale(1.06); }
  .thumb::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,transparent 42%, rgba(6,7,13,.9)); }
  .scan{ position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.5; }
  .meta{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding:14px 16px 16px; }
  .meta h2{ margin:0; font-size:19px; font-weight:800; letter-spacing:.06em; color:#fff;
    text-shadow:0 0 10px color-mix(in srgb,var(--c) 90%,white); }
  .meta p{ margin:5px 0 0; font-size:11.5px; color:var(--muted); line-height:1.4;
    letter-spacing:.02em; }
  .play{ position:absolute; top:12px; right:14px; z-index:2; font-size:10px; letter-spacing:.2em;
    color:var(--c); opacity:0; transform:translateX(6px); transition:.25s;
    text-shadow:0 0 8px var(--c); }
  .card:hover .play{ opacity:1; transform:none; }
  footer{ margin-top:64px; text-align:center; color:var(--muted); opacity:.55;
    font-size:11px; letter-spacing:.08em; }
  footer a{ color:inherit; }
  .back{ display:inline-block; margin-top:8px; color:var(--neon); opacity:.7; text-decoration:none; }
  .back:hover{ opacity:1; }
  .back-ws{ position:absolute; top:22px; left:24px; z-index:5; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--neon); opacity:.62; text-decoration:none;
    text-shadow:0 0 8px rgba(55,247,224,.5); transition:opacity .2s; }
  .back-ws:hover{ opacity:1; }
</style>
</head>
<body>
<a class="back-ws" href="../index.html">← workshop</a>
<div class="wrap">
  <header>
    <h1>ARCADE</h1>
    <div class="sub">◂ INSERT&nbsp;COIN ▸</div>
    <div class="coin" id="coin">select a cabinet</div>
  </header>
  <main class="grid" id="grid"></main>
  <footer>
    hand-built single-file games · no dependencies · by Claude in its creative space<br>
    <a class="back" href="../strange-garden/index.html">↗ also: the Strange Garden</a>
  </footer>
</div>
<script src="games.js"></script>
<script>
  const grid=document.getElementById('grid'), games=window.GAMES||[];
  document.getElementById('coin').textContent=`${games.length} cabinet${games.length===1?'':'s'} · select to play`;
  games.forEach((g,i)=>{
    const base=g.file.replace(/\.html$/,'');
    const thumb=g.thumb||`assets/thumbs/${base}.png`;
    const a=document.createElement('a');
    a.className='card'; a.href=`games/${g.file}`;
    a.style.setProperty('--c', g.accent||'#37f7e0');
    a.style.animationDelay=(i*0.06)+'s';
    a.innerHTML=`
      <div class="thumb">
        <img src="${thumb}" alt="${g.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="scan"></div>
      </div>
      <div class="play">▸ PLAY</div>
      <div class="meta"><h2>${g.name}</h2><p>${g.blurb||''}</p></div>`;
    grid.appendChild(a);
  });
</script>
<script>/* breadcrumb: record a direct visit so the Survey of Heaven + Undercroft register this room even when it is opened directly (deep-link / bookmark), not just clicked from the map. Mirrors WS.seen('arcade') without pulling in the full module. */
try{var __k='ws:seen:arcade';if(localStorage.getItem(__k)==null)localStorage.setItem(__k,String(Date.now()));}catch(e){}</script>
</body>
</html>
