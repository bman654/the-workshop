<body>

<div id="stage">

    <div class="skit-inner">
      <div class="skit-opt" data-opt="light"><span class="dot on"></span><span class="lbl">light mode</span></div>
      <div class="skit-opt" data-opt="dark"><span class="dot"></span><span class="lbl">dark mode</span></div>
      <div class="skit-opt skit-third" data-opt="leaf"><span class="dot"></span><span class="lbl">build whatever you want; have fun</span></div>
    </div>

  </div>

  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="seek">

    title="show or hide the cue log (every cue + stage note as it fires)">LOG</button>

<div id="startgate">
  <div class="kick">The Orrery Estate</div>
  <h1>a trailer</h1>
  <p class="sub">A hand-built creative web-art estate — and a short film about the afternoon it was given. One click to begin; the montage plays itself.</p>
  <button id="start-btn" type="button">▶ play the trailer</button>
</div>

<!-- the master-clock music bed (ENGINE §1). The T2.1 shell ships NO bed src — the
     real cue-locked mp3 folds in via forge:asset at T4.2/T5.1; until then the deck

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Shared estate-wide MUTE (the single key ws:pref:muted) ─────────────────
     House convention (DESIGNING.md): any page that makes sound reads/writes ONE
     shared key, so a visitor mutes once and it holds everywhere — and a mute
     toggled on another estate tab takes effect live. A page's audio gates on
     WS.muted(); a control writes via WS.setMuted(); WS.onMuteChange(fn) fires on
     any change (this tab OR another). */
  var MUTE_KEY = 'ws:pref:muted';
  var muteSubs = [];
  WS.muted = function () { return lsGet(MUTE_KEY) === '1'; };
  WS.setMuted = function (v) {
    var on = !!v;
    lsSet(MUTE_KEY, on ? '1' : '0');
    for (var i = 0; i < muteSubs.length; i++) {
      try { muteSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onMuteChange = function (fn) {
    if (typeof fn === 'function') muteSubs.push(fn);
  };
  // cross-tab: a mute set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== MUTE_KEY) return;
      var on = WS.muted();
      for (var i = 0; i < muteSubs.length; i++) {
        try { muteSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } },
    { id: 'light-mixer',    unlocked: function (s) {
        // earned by mastering every Feat of Light in the Hall of Mirrors (all 9)
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        for (var i = 0; i < f.length; i++) { if (!s.has('ws:flag:earned-' + f[i])) return false; }
        return true;
      } },

    /* reliquary (#399): read the Sealed Room's Diary to its end — the estate's
       found-diary mystery, solved across the Museum → Scytale → Card Catalog. An
       honest cross-link trophy: the Reliquary and the Undercroft share this ws
       engine. Predicate = the payoff key the Sealed Study sets on final solve. */
    { id: 'reliquary',      unlocked: function (s) { return s.has('ws:seen:reliquary-solved'); } },

    /* the-mere: the whole diary, read to its very last page — the memorial annex
       past the study's cold wall. The grand payoff of the Sealed Room's mystery,
       one clue and one chapter beyond the reliquary trophy above. Predicate = the
       grand key the annex sets on entry (guarded on the final chapter's witness). */
    { id: 'the-mere',       unlocked: function (s) { return s.has('ws:seen:the-mere'); } },

    /* ── The Constellation of Mastery (wave one) ────────────────────────────────
       A named group of secrets that reward what you CONQUERED, not merely what you
       wandered past. Each candle stands for a feat finished; the capstone lights
       only when all five are lit. Predicates are ids + fns ONLY — the names, badges,
       riddles, and prose live in undercroft/index.src.html (hidden-world content),
       so no secret prose leaks into a public trigger page. */

    /* m-keeper-of-tales: carried ALL THREE public Lantern tales to their ends.
       GATES the earned Keeper's Alcove (keeper.html). */
    { id: 'm-keeper-of-tales', unlocked: function (s) {
        return s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won');
      } },

    /* m-clean-sweep: a flawless ("clean") solve of all FOUR puzzle benches. */
    { id: 'm-clean-sweep', unlocked: function (s) {
        return s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean');
      } },

    ended: false,           /* film content is over → held black */
    rafId: 0,
    scrubbing: false,

      } else {

       a ~15× scale that crops out the previous-sentence tail the cold open needs.
       Repo wins: honour the design SCALE range 4.5–5.5 (5.5 keeps the most
       context); the crop constraints [tail visible + highlight in crop] are the

  function pokeHook(payload, kind) {

    var fw = frameWin();
    var hooks = null;
    try { hooks = fw && fw.__tourHooks; } catch (e) { hooks = null; }
    if (hooks && typeof hooks[verb] === 'function') {
      try { hooks[verb].apply(null, payload.args || []); log('✓ ' + kind + ' ' + verb + '()'); }
      catch (e) { log('✗ ' + kind + ' ' + verb + ' threw: ' + e.message); }
    } else {
      log('· ' + kind + ' ' + verb + ' — hook absent on frame');
    }
  }
  function fireSpot(payload) {
    var sel = payload && payload.sel;
    var fw = frameWin();
    if (!sel) { log('· spot cue with no sel'); return; }
    try {
      var el = fw && fw.document && fw.document.querySelector(sel);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      log('· spot ' + sel + (el ? '' : ' — not found'));
    } catch (e) { log('✗ spot ' + sel + ' threw: ' + e.message); }
  }
  function fireCue(cue) {
    var kind = CE.cueKind(cue);
    try {
      if (kind === 'frame') setFrame(cue.frame);
      else if (kind === 'state') pokeHook(cue.state, 'state');
      else if (kind === 'impulse') pokeHook(cue.impulse, 'impulse');
      else if (kind === 'spot') fireSpot(cue.spot);
      else if (kind === 'note') log('▸ ' + cue.note);
      else log('? malformed cue at t=' + cue.t);
    } catch (e) { log('✗ cue t=' + cue.t + ' threw: ' + e.message); }
  }
  function replayStates(list) {
    for (var i = 0; i < list.length; i++) pokeHook(list[i].state, 'replay');
  }

  /* ── the clock: bed.currentTime when the bed drives; synthetic rAF after the
     bed `ended`; rAF virtual otherwise (authoring / no bed) — ENGINE §1 ─────── */
  function tick(ts) {
    state.rafId = requestAnimationFrame(tick);
    var dur = durationMs();

    if (state.playing && !state.ended) {
      if (state.usingAudio && bed && !bed.paused && !state.bedEnded) {
        state.clockMs = bed.currentTime * 1000;
      } else if (state.lastRafTs != null) {
        state.clockMs += (ts - state.lastRafTs);
      }
    }
    state.lastRafTs = ts;

    if (state.playing && !state.ended) {
      var to = state.clockMs / 1000;
      var fired = CE.cuesInRange(CHAPTER, state.lastFireT, to);
      for (var i = 0; i < fired.length; i++) fireCue(fired[i]);
      state.lastFireT = to;
    }

    lightCaption();
    paintBand();
    paintChrome(dur);

    /* film content over → held black (synthetic clock keeps running under it) */
    if (state.playing && !state.ended && state.clockMs >= dur) {
      onFilmEnd();
    }
  }

  function onFilmEnd() {
    state.ended = true;
    state.clockMs = durationMs();
    if (els.heldblack) els.heldblack.classList.add('on');
    if (els.captions) els.captions.classList.add('hush');
    log('— held black — end of the trailer');
  }

  /* ── chrome paint (authoring only; DOM-removed in ?record) ─────────────────── */
  function paintChrome(dur) {
    if (RECORD) return;
    if (els.clock) els.clock.textContent = fmt(state.clockMs);
    if (els.dur) els.dur.textContent = fmt(dur);
    if (els.play) els.play.textContent = state.playing ? '⏸' : '▶';
    if (!state.scrubbing && els.scrub) {
      els.scrub.value = String(dur ? Math.round(state.clockMs / dur * 1000) : 0);
    }
  }

  /* ── the master-clock start (blessing gesture) ─────────────────────────────
     Tries the bed <audio>; falls to the rAF virtual clock when there is no bed
     src / muted (the T2.1 shell has no bed yet, so authoring runs virtual). The
     rich record-mode reach-in choreography (colophon weave-and-pause, Gate
     unlock+suspend) is T6.2. */
  function startClock() {
    if (bed && bed.getAttribute('src') && !muted()) {
      try {
        var p = bed.play();
        if (p && p.then) {
          p.then(function () { state.usingAudio = true; })
           .catch(function () { state.usingAudio = false; });
        } else { state.usingAudio = true; }
      } catch (e) { state.usingAudio = false; }
    } else {
      state.usingAudio = false;
    }
  }

  /* ── authoring transport ───────────────────────────────────────────────────── */
  function play() {
    if (!state.started) return;
    state.playing = true;
    if (state.usingAudio && bed) { try { var p = bed.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    paintChrome(durationMs());
  }
  function pause() {
    state.playing = false;
    if (state.usingAudio && bed) { try { bed.pause(); } catch (e) {} }
    for (var id in segEls) { if (segEls[id]) { try { segEls[id].pause(); } catch (e) {} } }
    paintChrome(durationMs());
  }
  function togglePlay() { if (state.playing) pause(); else play(); }

  /* ── authoring scrub (deriveSeek — the seek re-derivation earns its keep off
     the record path) ─────────────────────────────────────────────────────────── */
  function seekTo(ms) {
    var dur = durationMs();
    state.clockMs = Math.max(0, Math.min(dur, ms));
    var tSec = state.clockMs / 1000;
    var seek = CE.deriveSeek(CHAPTER, tSec, state.activeKey);
    if (seek.frame != null) setFrame(seek.frame);
    replayStates(seek.stateReplay);
    state.lastFireT = tSec;                 /* don't re-fire impulses we scrubbed past */
    state.ended = false;
    if (els.heldblack) els.heldblack.classList.remove('on');
    /* the active segment + captions re-derive lazily on the next natural cue */
    state.activeSeg = null; resetCaptions(null);
    if (state.usingAudio && bed) { try { bed.currentTime = tSec; } catch (e) {} }
    paintChrome(dur);
  }
  function scrubStart() { state.scrubbing = true; }
  function scrubMove() {
    if (!els.scrub) return;
    var dur = durationMs();
    var frac = (+els.scrub.value) / 1000;
    state.clockMs = frac * dur;
    if (els.clock) els.clock.textContent = fmt(state.clockMs);
  }
  function scrubEnd() {
    state.scrubbing = false;
    if (!els.scrub) return;
    var dur = durationMs();
    seekTo(((+els.scrub.value) / 1000) * dur);
  }

  /* ── Reduce-Motion preflight (ENGINE §8) ───────────────────────────────────── */
  function rmCheck(win, label) {
    try {
      if (win && win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (els.rmbanner) {
          els.rmbanner.hidden = false;
          els.rmbanner.textContent = 'REDUCE MOTION IS ON (' + label + ') — turn it off: System Settings → Accessibility → Display. The estate freezes its motion under it.';
        }
        return true;
      }
    } catch (e) {}
    if (els.rmbanner) els.rmbanner.hidden = true;
    return false;
  }

  /* ── boot ───────────────────────────────────────────────────────────────────── */
  function boot() {
    var $ = function (id) { return document.getElementById(id); };
    els = {
      stage: $('stage'), captions: $('captions'), card: $('card'), skit: $('skit'),
      bloom: $('bloom'),
      rmbanner: $('rmbanner'), cuelog: $('cuelog'), heldblack: $('heldblack'),
      startgate: $('startgate'), startbtn: $('start-btn'), segbank: $('segbank'),
      authoring: $('authoring'), play: $('btn-play'), scrub: $('scrub'),
      clock: $('clock'), dur: $('dur'), logbtn: $('btn-log')
    };
    bed = $('bed');

    if (RECORD) {
      document.body.classList.add('record');
      /* authoring chrome DOM-removed, not hidden (ENGINE §8 step 1) */
      if (els.authoring && els.authoring.parentNode) els.authoring.parentNode.removeChild(els.authoring);
      if (els.cuelog && els.cuelog.parentNode) els.cuelog.parentNode.removeChild(els.cuelog);
    }

    buildStack();
    buildSegments();

    /* open on the chapter's first frame so the stage is never blank behind the gate */
    var open = (CHAPTER.opening && CHAPTER.opening.frame) || null;
    if (open) setFrame(open);

    /* authoring transport wiring */
    if (!RECORD) {
      if (els.play) els.play.addEventListener('click', function () { togglePlay(); });
      if (els.scrub) {
        els.scrub.addEventListener('pointerdown', scrubStart);
        els.scrub.addEventListener('input', scrubMove);
        els.scrub.addEventListener('change', scrubEnd);
      }
      if (els.logbtn) {
        els.logbtn.addEventListener('click', function () {
          if (!els.cuelog) return;
          els.cuelog.hidden = !els.cuelog.hidden;
          els.logbtn.setAttribute('aria-pressed', els.cuelog.hidden ? 'false' : 'true');
        });
      }
      document.addEventListener('keydown', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
        if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
      });
    }

    /* the ONE blessing gesture (real input — a synthetic .click() unlocks no
       audio). The full record-mode reach-in choreography + preflight is T6.2. */
    if (els.startbtn) els.startbtn.addEventListener('click', start);

    /* RM preflight up front (parent) */
    rmCheck(window, 'this display');

    state.rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (state.started) return;
    state.started = true;
    if (els.startgate) { els.startgate.hidden = true; els.startgate.style.display = 'none'; }
    primeColdOpen();
    startClock();
    play();
  }

  /* AUTHORING-ONLY cold-open primer (ENGINE §3): weave-and-pause the colophon so
     the cold-open zoom is demonstrable in review playback. The RECORD-mode
     reach-in — the real-gesture unlock, #voice shield to 0, the silent count-in,
     and the Gate unlock+suspend — is T6.2's contract and is deliberately NOT
     built here (this no-ops in ?record). */
  function primeColdOpen() {
    if (RECORD) return;
    if (state.activeKey !== COLO_KEY) return;
    var cf = coloFrame();
    try {
      var h = cf && cf.contentWindow && cf.contentWindow.__tourHooks;
      if (h && typeof h.colophonBeginAt === 'function') {
        h.colophonBeginAt(21200);
        if (typeof h.colophonCut === 'function') h.colophonCut();
      }
    } catch (e) {}
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* ── liveness handle (the __showing / __fairgroundLiveness idiom) — a
     read-only window onto the shell for the rehearsal gate + headless probes. */
  window.__trailer = {
    state: state,
    chapter: CHAPTER,
    record: RECORD,
    start: start,
    play: play,
    pause: pause,
    seekTo: seekTo,
    clockMs: function () { return state.clockMs; },
    activeFrame: function () { return state.activeKey; },
    frameKeys: function () { return Object.keys(frameEls); },
    segIds: function () { return Object.keys(segEls); },
    deckVerbs: function () { return Object.keys(DECK_HOOKS); },
    deck: DECK_HOOKS,                                   /* poke verbs directly in a spot-check */
    cardId: function () { return curCard; },
    coloZoom: function () { return state.coloZoom || null; },
    bandHushed: function () { return !!(els.captions && els.captions.classList.contains('hush')); },
    skitOn: function () { return !!(els.skit && els.skit.classList.contains('on')); },
    injectSeg: function (id, seg) { if (segById[id]) { for (var k in seg) segById[id][k] = seg[k]; delete wordCache[id]; delete lineCache[id]; } },
    buildLines: function (id) { return buildLines(segById[id]); },
    preflight: function (win) { return rmCheck(win || window, 'preflight'); },
    bannerVisible: function () { return !!(els.rmbanner && !els.rmbanner.hidden); }
  };
})();
</script>
</body>
</html>
