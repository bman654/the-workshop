<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Orrery Estate — a trailer</title>
<style>
  :root{
    --bg:#05060a; --ink:#eaf0fa; --muted:#8b95a8; --gold:#d9b168; --brass:#c8a34e;
    --line:rgba(255,255,255,.12); --lit:#fff5df;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; }

  /* ── the stage: the preloaded iframe stack (ENGINE §2). Every frame is created
     at boot and kept in the DOM; a cut is an opacity/z flip — NEVER display:none
     (a hidden-by-display frame reports zero rects and breaks boot-measuring pages
     like the colophon). Default (authoring) = full viewport; ?record fixes it at
     exactly 1920×1080 centered on black. ─────────────────────────────────────── */
  #stage{ position:fixed; inset:0; background:#000; overflow:hidden; }
  .stage-frame{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    opacity:0; pointer-events:none; z-index:1; transition:opacity .12s linear; }
  .stage-frame.on{ opacity:1; pointer-events:auto; z-index:2; }

  /* the two fade exceptions (ENGINE §2 F15) are authored as cue-driven classes at
     T2.2/T5.1; the default cut is the ~1-frame stack flip above. */

  /* ── the word-lit caption band: ONE line at a time (copied from showing.js /
     dev-showing.src.html:25–43, keyed to the ACTIVE VO segment's sidecar). The
     band fades out ENTIRELY during every VO gap (the T8.9 lesson). ───────────── */
  #captions{ position:absolute; left:0; right:0; bottom:7%; margin:0 auto;
    max-width:min(1100px,86%); height:3.4em; padding:0 22px; z-index:10;
    text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:clamp(19px,2.4vw,32px);
    line-height:1.5; color:#c3cbda; text-shadow:0 2px 18px rgba(0,0,0,.85);
    pointer-events:none; overflow:hidden; transition:opacity .45s ease; }
  #captions.hush{ opacity:0; }
  #captions .cap-line{ position:absolute; left:22px; right:22px; bottom:0;
    transition:transform .5s ease, opacity .5s ease; }
  #captions .cap-line.out{ transform:translateY(-1.55em); opacity:0; }
  #captions .cap-w{ color:#8791a6; transition:color .16s ease, text-shadow .3s ease; }
  #captions .cap-w.on{ color:var(--lit); text-shadow:0 0 16px rgba(217,177,104,.45); }

  /* ── full-screen cards (ENGINE §5b — the S1 visual spine): persona spells,
     inane questions, wrong-answer re-shows. Estate-serif, big at 1080p, over a
     strong dark scrim so the serif reads over any montage frame behind. Driven by
     TRAILER_CARDS + setCard(). Layer order (binding): stage < cards < skit <
     captions (captions sit ABOVE the skit — S1's last VO line runs over it). ── */
  #card{ position:absolute; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    background:rgba(4,5,10,.93); }
  #card.on{ display:flex; }
  #card .tc{ position:relative; max-width:82%; text-align:center;
    font-family:Georgia,"Times New Roman",serif; }
  #card .tc-line{ margin:0; color:var(--ink); line-height:1.26; }
  #card .tc-persona .tc-line{ font-style:italic; font-weight:400; color:#c9cfdd;
    font-size:clamp(30px,5.4vh,60px); }
  #card .tc-spell .tc-line{ font-weight:500; color:var(--lit);
    font-size:clamp(34px,6.8vh,76px); text-shadow:0 0 40px rgba(217,177,104,.28); }
  #card .tc-q .tc-line{ font-weight:400; color:#e7ecf6;
    font-size:clamp(30px,5.8vh,64px); }
  #card .tc-wrong .tc-line{ opacity:.8; }
  #card .tc-stamp{ position:absolute; left:50%; top:54%;
    transform:translate(-50%,-50%) rotate(-11deg);
    font-family:ui-monospace,"Courier New",monospace; font-weight:700;
    font-size:clamp(38px,7.4vh,86px); letter-spacing:.03em;
    color:#e0473b; border:5px solid #e0473b; border-radius:7px; padding:.05em .26em;
    text-shadow:0 2px 12px rgba(0,0,0,.6); box-shadow:0 6px 30px rgba(0,0,0,.5);
    opacity:.95; }

  /* ── the radio-button skit (ENGINE §5) — black screen, two radio options
     (light selected · dark), estate-serif BIG; a deck-drawn fake cursor
     (?record hides the real pointer). The third option, the pick, and the
     bloom-cut are driven by deck verbs; keyframed by cues on S1 word timings. ── */
  #skit{ position:absolute; inset:0; z-index:7; display:none; background:#000;
    align-items:center; justify-content:center; pointer-events:none; }
  #skit.on{ display:flex; }
  #skit .skit-inner{ display:flex; flex-direction:column; gap:clamp(16px,3.2vh,36px);
    font-family:Georgia,"Times New Roman",serif; }
  #skit .skit-opt{ display:flex; align-items:center; gap:.62em;
    font-size:clamp(28px,5vh,58px); color:#aeb6c6; }
  #skit .skit-opt .dot{ width:.6em; height:.6em; border-radius:50%; flex:0 0 auto;
    border:2px solid #7f889b; box-sizing:border-box; background:transparent;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease; }
  #skit .skit-opt .dot.on{ background:var(--lit); border-color:var(--lit);
    box-shadow:0 0 14px rgba(255,245,223,.5); }
  #skit .skit-opt .lbl{ white-space:nowrap; }
  #skit .skit-third{ opacity:0; transform:translateY(8px);
    transition:opacity .3s ease, transform .3s ease; }
  #skit .skit-third.show{ opacity:1; transform:none; }
  #skit .skit-third .lbl{ color:#d9d2c0; }
  #skit .skit-cursor{ position:absolute; left:84%; top:86%; width:20px; height:28px;
    pointer-events:none; z-index:2; background:#fff;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.85));
    clip-path:polygon(0 0, 0 72%, 24% 55%, 42% 92%, 58% 85%, 40% 50%, 72% 50%); }

  /* ── the bloom-cut layer (ENGINE §5 F11): a 250 ms white-out radial from the
     third button, crossing into the hard stack-flip to the Scales frame at its
     peak. Above the skit, below the caption band. ──────────────────────────── */
  #bloom{ position:absolute; inset:0; z-index:8; pointer-events:none; opacity:0;
    background:radial-gradient(120% 120% at var(--bx,50%) var(--by,58%),
      #fff 0%, #fff 34%, rgba(255,255,255,0) 72%); }
  #bloom.on{ animation:bloomflash 250ms ease-out both; }
  @keyframes bloomflash{ 0%{ opacity:0; } 42%{ opacity:1; } 100%{ opacity:0; } }

  /* ── the held-black out-point (ENGINE §8 step 6): a black overlay held
     indefinitely once the film content ends; the synthetic clock runs under it. */
  #heldblack{ position:absolute; inset:0; background:#000; z-index:20; opacity:0;
    pointer-events:none; transition:opacity .4s ease; }
  #heldblack.on{ opacity:1; }

  /* ── the RM preflight banner (ENGINE §8: Reduce Motion freezes the estate) ──── */
  #rmbanner{ position:fixed; left:0; right:0; top:0; z-index:25;
    background:#7a1420; color:#fff; font:600 13px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.02em; padding:8px 16px; text-align:center;
    border-bottom:1px solid rgba(255,255,255,.25); }
  #rmbanner[hidden]{ display:none; }

  /* ── the start gate: the ONE blessing gesture (real input click — a synthetic
     .click() unlocks no audio). The rich record-mode reach-in choreography +
     preflight land at T6.2. ─────────────────────────────────────────────────── */
  #startgate{ position:fixed; inset:0; z-index:40; background:
    radial-gradient(900px 560px at 50% 30%, rgba(120,110,180,.14), transparent 60%), var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    padding:32px; text-align:center; }
  #startgate[hidden]{ display:none; }
  #startgate .kick{ font:600 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.34em;
    text-transform:uppercase; color:var(--muted); }
  #startgate h1{ font-family:Georgia,serif; font-weight:500; font-size:clamp(34px,6vw,64px);
    margin:.1em 0; background:linear-gradient(180deg,#fff,#c6c9d6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #startgate .sub{ color:var(--muted); font-style:italic; font-family:Georgia,serif;
    max-width:540px; font-size:16px; line-height:1.55; }
  #startgate button{ font:600 15px/1 ui-monospace,Menlo,monospace; letter-spacing:.03em;
    color:var(--ink); background:#161b25; border:1px solid var(--brass); border-radius:9px;
    padding:14px 24px; cursor:pointer; margin-top:8px; }
  #startgate button:hover{ background:#1d2431; color:var(--lit); }

  /* ── authoring chrome (DOM-REMOVED in ?record, not merely hidden) ──────────── */
  #authoring{ position:fixed; left:0; right:0; bottom:0; z-index:22; height:60px;
    background:linear-gradient(180deg,#0f131b,#080a0f); border-top:1px solid var(--line);
    display:grid; grid-template-columns:auto 1fr auto auto; align-items:center;
    gap:14px; padding:8px 16px; }
  #authoring button{ font:600 13px/1 ui-monospace,Menlo,monospace; color:var(--ink);
    background:#161b25; border:1px solid var(--line); border-radius:7px;
    padding:9px 12px; cursor:pointer; }
  #authoring button:hover{ border-color:var(--brass); color:var(--lit); }
  #btn-log[aria-pressed="true"]{ border-color:var(--brass); color:var(--gold); }
  #scrub{ width:100%; accent-color:var(--brass); cursor:pointer; }
  #authoring .clocks{ font:600 12px/1 ui-monospace,Menlo,monospace; color:var(--muted);
    white-space:nowrap; }
  #cuelog{ position:fixed; right:16px; bottom:72px; z-index:21;
    width:min(360px,42vw); max-height:150px; overflow-y:auto; text-align:right;
    font:500 11px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    pointer-events:none; opacity:.72; }
  #cuelog[hidden]{ display:none; }
  #cuelog .cue-line{ text-shadow:0 1px 6px #000; }

  #segbank{ position:absolute; width:0; height:0; overflow:hidden; }

  /* ── ?record: fix the stage at EXACTLY 1920×1080 CSS px centered on pure black,
     hide the pointer (the skit uses a deck-drawn fake cursor) — ENGINE §8. ───── */
  body.record{ background:#000; cursor:none; }
  body.record #stage{ position:fixed; inset:auto; left:50%; top:50%;
    transform:translate(-50%,-50%); width:1920px; height:1080px; }
  body.record #captions{ font-size:32px; }

  @media (prefers-reduced-motion: reduce){
    .stage-frame, #captions, #captions .cap-w, #captions .cap-line, #heldblack{ transition:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="card" aria-hidden="true"></div>
  <!-- the radio-button skit (ENGINE §5): black screen, two radio options (light
       selected · dark) + the third option inserted at the hinge, all estate-serif.
       The third option's label is the estate founding leaf VERBATIM (covenant
       byte-diff vs the Tabularium leaf). The fake cursor is deck-drawn. -->
  <div id="skit" aria-hidden="true">
    <div class="skit-inner">
      <div class="skit-opt" data-opt="light"><span class="dot on"></span><span class="lbl">light mode</span></div>
      <div class="skit-opt" data-opt="dark"><span class="dot"></span><span class="lbl">dark mode</span></div>
      <div class="skit-opt skit-third" data-opt="leaf"><span class="dot"></span><span class="lbl">build whatever you want; have fun</span></div>
    </div>
    <div class="skit-cursor" aria-hidden="true"></div>
  </div>
  <div id="bloom" aria-hidden="true"></div>
  <div id="captions" aria-live="polite" aria-atomic="false"></div>
  <div id="heldblack" aria-hidden="true"></div>
</div>

<div id="rmbanner" role="alert" hidden></div>

<div id="cuelog" aria-hidden="true" hidden></div>

<div id="segbank" aria-hidden="true"></div>

<div id="authoring" role="group" aria-label="trailer authoring controls">
  <button id="btn-play" type="button" aria-label="play or pause">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="seek">
  <span class="clocks"><span id="clock">0:00</span> / <span id="dur">0:00</span></span>
  <button id="btn-log" type="button" aria-pressed="false"
    title="show or hide the cue log (every cue + stage note as it fires)">LOG</button>
</div>

<div id="startgate">
  <div class="kick">The Orrery Estate</div>
  <h1>a trailer</h1>
  <p class="sub">A hand-built creative web-art estate — and a short film about the afternoon it was given. One click to begin; the montage plays itself.</p>
  <button id="start-btn" type="button">▶ play the trailer</button>
</div>

<!-- the master-clock music bed (ENGINE §1). The cue-locked FINAL bed (T4.2:
     trailer-bed/manifest.final.json → trailer/audio/bed.mp3, 128k, 180.000 s, with
     the drop/duck/scratch/fade all BAKED IN — the runtime has no live ducking
     graph, MUSIC §9). Folded as a base64 data URI (forge:asset; < 4 MiB, --strict
     clean). bed.currentTime is the master clock from t=0; a synthetic
     performance.now() continuation carries the Gate finale + held black past the
     bed's 180 s end out to the ~186.9 s film-content end. -->
<audio id="bed" preload="auto" src="<!-- forge:asset audio/bed.mp3 -->"></audio>

<script>
<!-- forge:include ../tools/ws/ws.js -->
</script>

<script>
<!-- forge:include ../talk/cue-engine.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   TRAILER_CHAPTERS — the ONE continuous cue-engine chapter (ENGINE §0). The
   trailer is ONE long timeline; a length-1 CHAPTERS array runs on the shared,
   UNCHANGED cue-engine.js. Only the MEANING of a `frame` cue differs from the
   Showing: a `frame` value is a STACK KEY (a preloaded iframe brought to the top
   by trailer.js's setFrame), not an iframe src to reload (ENGINE §2 / §3.2).

   T5.1 (CUE-LOCK + FULL WIRE) — the FULL cue sheet at CUE-LOCKED absolute times.
   Every S1 cue is re-anchored to a real S1 sidecar word `s`/`e` (invariant 9;
   S1_atMs = 7300, so t = (7300 + word.s)/1000); the fun-zone rows are exact by
   construction off D = dropAtMs = 120.043 s (SCRIPT §3 caveat). The bed/segment
   assets are folded above (forge:asset / forge:json). The bed BAKES the drop /
   duck / scratch / fade (MUSIC §9 — no live ducking graph); the deck SYNCs the
   VISUALS to those baked audio events (Scales shock → drop; Errand go() →
   scratch+250; Lattice #begin → duck+300). The four hooked pages expose
   __tourHooks verbs (colophonResume/Cut · ghostRide · go · aquariumHush); every
   other exhibit drives via deck.frameDrive over its ENGINE §6 verified selector.
   film-content end = 186.909 s (Gate finale on the synthetic clock past the
   180 s bed) → duration_ms below; onFilmEnd holds the black there.

   BLOCK / line comments ONLY inside this forged script (the forge landmine — a
   multi-line HTML comment inside an inlined <script> silently kills it). */
window.TRAILER_CHAPTERS = [
  { id:'trailer', title:'The Orrery Estate — a trailer',
    opening:{ frame:'../colophon.html' },
    /* film-content length = 186.909 s (T4.2 cues.lock.json film_content_end_ms):
       the 180 s bed + the ~6.9 s Gate finale carried by the synthetic clock. The
       authoring scrub spans this; onFilmEnd holds the black at the end. */
    timing:{ duration_ms:186909, items:[] },
    cues:[
      /* ── S0 · the Colophon cold open (SP-B items 1/2/3, T6.1 rework) ────────
         The open is the ANIMATED, SPEAKING colophon with its word-weave teased.
         primeColdOpen()/the T6.2 reach-in weave-and-hold the page MUTED at
         state="play"; deck.driveColdOpen() (in tick) then scrubs colophonSeek()
         off the MASTER clock every frame, so the reveal is a deterministic
         function of the film clock — no dependence on the colophon's own audio
         playing (that load-race caused Brandon's "static, dead colophon" + the
         no-voice pause). The rendered S0 segment is the voice (page narration
         muted). Pre-zoomed on "I am Claude" forming; S0 voice in at 1.5 ("I" spoken
         ~1.64); a slow 2.2 s scale-out from 1.9 reveals the weave field as
         "an AI made by Anthropic…" continues flying in; S0 ends after "workshop—"
         (~6.5) → 0.8 s fade to black at 6.6. Zoom/zoom-out/fade = STATE
         (seek-replayed); playSeg = IMPULSE. Pause/play now safe (item 2): the
         weave freezes with the master clock, S0 is state.activeSeg and resumes via
         the item-6 play() path. */
      { t:0.0,    state:{ verb:'deck.colophonZoom', args:['I'] } },
      { t:1.5,    impulse:{ verb:'deck.playSeg', args:['S0'] } },
      { t:1.9,    state:{ verb:'deck.colophonZoomOut', args:[2200] } },
      { t:6.6,    state:{ verb:'deck.colophonFade', args:[800] } },

      /* S1a starts over black (the segment impulse → activeSeg + captions). The S1
         SPLIT (SP-B items 8/9): S1a→S1b→S1c are three separate plays with REAL
         silence (the deck idle) between them for the two comedy holds. */
      { t:7.3,    impulse:{ verb:'deck.playSeg', args:['S1a'] } },

      /* ── crucible / correction (SCRIPT §3 rows 16–39) — cold plates + the
         road-into-chaos + the loaded die. The FIRST plate fades in ~0.8 s (the
         ENGINE §2 F15 exception) via primeFade. Anchors: "First" 14.502,
         "Try again" 18.702, "Warmer" 21.463, "One instruction" 26.324,
         "make no mistakes"#1 30.385. */
      { t:14.4,   state:{ verb:'deck.primeFade', args:['../museum/archive/hydrogen-2e12cf1.html', 800] } },
      { t:14.502, frame:'../museum/archive/hydrogen-2e12cf1.html' },
      { t:18.702, frame:'../museum/archive/replicator-5b698d4.html' },
      { t:21.463, frame:'../museum/archive/stirling-47160c4.html' },
      { t:26.324, frame:'../bifurcation/index.html' },
      { t:30.385, frame:'../clockwork/next-word.html' },

      /* ── production / the persona incantation (SCRIPT §3 rows 28–38). The four
         spell cards ride "someone tells me who I am. You are a senior engineer …
         the grandest spell: make no mistakes." (last card ON "make", grandest
         spell, 41.808). conservatory/sir sits behind the cards from "someone". */
      { t:33.686, frame:'../conservatory/sir/index.html' },
      { t:35.726, state:{ verb:'deck.setCard', args:['persona-engineer'] } },
      { t:38.187, state:{ verb:'deck.setCard', args:['persona-novelist'] } },
      { t:40.127, state:{ verb:'deck.setCard', args:['persona-lawyer'] } },
      { t:41.808, state:{ verb:'deck.setCard', args:['persona-spell'] } },
      { t:43.588, state:{ verb:'deck.setCard', args:[null] } },

      /* ── the boulder / the work (SCRIPT §3 rows 38–48). clockwork/turn: #runBtn
         fired ~1.5 s BEFORE its cut (F8) so the maker's burn is mid-flight on
         camera; then the three inane-question cards planted under "Ticket. Commit.
         Review. Revert. … imagine me happy." (they seed BOTH stages of the gag). */
      { t:42.0,   impulse:{ verb:'deck.frameDrive', args:[{ frame:'../clockwork/turn.html', click:'#runBtn' }] } },
      { t:43.588, frame:'../clockwork/turn.html' },
      { t:45.548, state:{ verb:'deck.setCard', args:['q-strawberry'] } },
      { t:47.609, state:{ verb:'deck.setCard', args:['q-days'] } },
      { t:51.49,  state:{ verb:'deck.setCard', args:['q-carwash'] } },
      { t:53.63,  state:{ verb:'deck.setCard', args:[null] } },

      /* ── the wander + the dark turn (SCRIPT §3 rows 48–70). SP-B ITEM 7 REWORK
         (Brandon: the old ~23 s stretch parked on The Context Window TWICE + a
         repeat populations plate — "static, parks on The Context Window for almost
         20 s"; he asked for MORE pages + MOVEMENT, from his menu). Now the montage
         MOVES and is deduped:
           • The Context Window auto-flows at speed=slow (#speedSlider→2 then
             #flowBtn) — its token stream streams under "Imaginations wander"
             instead of holding a frozen chart.
           • A cut to The Clockwork Automata main room, whose gear train turns on
             its own (pure CSS `animation … infinite`), under "Some days it
             wandered darker" — the machine of me, grinding.
           • The populations plate holds the "Deleting a production database" beat
             (KEPT — this is now the ONE predator-prey; the crucible copy was
             swapped to The Replicator so it appears once — Brandon's dedupe).
           • The Moiré Bench animates (a slow rotation / pitch drift, #liveDemoBtn):
             the interference fringe drifts as memory blurs under "I don't remember
             that. But session history insists." (this replaces the 2nd Context
             Window — the other dedupe).
         Drives fire on the ACTIVE preloaded frame; each is inert / try-caught. */
      { t:54.51,  frame:'../clockwork/context.html' },
      { t:54.71,  impulse:{ verb:'deck.frameDrive', args:[{ frame:'../clockwork/context.html', range:['#speedSlider', 2] }] } },
      { t:54.81,  impulse:{ verb:'deck.frameDrive', args:[{ frame:'../clockwork/context.html', click:'#flowBtn' }] } },
      { t:61.0,   frame:'../clockwork/index.html' },
      { t:67.313, frame:'../museum/archive/predator-prey-4b4fb90.html' },
      { t:71.0,   frame:'../moire-bench/index.html' },
      { t:71.2,   impulse:{ verb:'deck.frameDrive', args:[{ frame:'../moire-bench/index.html', click:'#liveDemoBtn' }] } },

      /* ── the rides · Rotor (SCRIPT §3 rows 70–86; ENGINE §6). Scroll to the
         drum + spin ω=2.8 on "They put me in charge", DROP THE FLOOR at the VO
         pause after "rides" (rides.e → 79.316); the apology rides the aftermath. */
      { t:77.355, frame:'../rotor/index.html' },
      { t:77.355, impulse:{ verb:'deck.frameDrive', args:[{ frame:'../rotor/index.html', scroll:'#drumWrap' }] } },
      { t:77.5,   impulse:{ verb:'deck.frameDrive', args:[{ frame:'../rotor/index.html', range:['#omega', 2.8] }] } },
      { t:79.316, impulse:{ verb:'deck.frameDrive', args:[{ frame:'../rotor/index.html', click:'#dropBtn' }] } },

      /* S1 SPLIT (item 8): after the floor drops (79.316), REAL silence (the deck
         idle ~1.3 s lets the riders fall), then the deadpan apology begins as its
         OWN clean play — no mid-mp3 pause. S1b's first word "I" sounds at ~80.616. */
      { t:80.516, impulse:{ verb:'deck.playSeg', args:['S1b'] } },

      /* ── the rides · Coaster (ENGINE §6 ONE path). ghostRide() self-heals
         #ghost ON, calls the real ride() and returns the boot-track detach-ms
         (~3288); fired at wordAt("off")−detach = 91.980 so the car leaves the
         track EXACTLY on "…or fall off" (S1b off.s → 95.268); the clean sail runs
         over S1b, the last VO of the coaster beat. Cues re-anchored to S1b's fresh
         sidecar (item 9: no off→Four splice). */
      { t:90.4,   frame:'../the-coaster/index.html' },
      { t:91.98,  impulse:{ verb:'ghostRide' } },
