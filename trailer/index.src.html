<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Orrery Estate — a trailer</title>
<style>
  :root{
    --bg:#05060a; --ink:#eaf0fa; --muted:#8b95a8; --gold:#d9b168; --brass:#c8a34e;
    --line:rgba(255,255,255,.12); --lit:#fff5df;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; }

  /* ── the stage: the preloaded iframe stack (ENGINE §2). Every frame is created
     at boot and kept in the DOM; a cut is an opacity/z flip — NEVER display:none
     (a hidden-by-display frame reports zero rects and breaks boot-measuring pages
     like the colophon). Default (authoring) = full viewport; ?record fixes it at
     exactly 1920×1080 centered on black. ─────────────────────────────────────── */
  #stage{ position:fixed; inset:0; background:#000; overflow:hidden; }
  .stage-frame{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;
    opacity:0; pointer-events:none; z-index:1; transition:opacity .12s linear; }
  .stage-frame.on{ opacity:1; pointer-events:auto; z-index:2; }

  /* the two fade exceptions (ENGINE §2 F15) are authored as cue-driven classes at
     T2.2/T5.1; the default cut is the ~1-frame stack flip above. */

  /* ── the word-lit caption band: ONE line at a time (copied from showing.js /
     dev-showing.src.html:25–43, keyed to the ACTIVE VO segment's sidecar). The
     band fades out ENTIRELY during every VO gap (the T8.9 lesson). ───────────── */
  #captions{ position:absolute; left:0; right:0; bottom:7%; margin:0 auto;
    max-width:min(1100px,86%); height:3.4em; padding:0 22px; z-index:5;
    text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:clamp(19px,2.4vw,32px);
    line-height:1.5; color:#c3cbda; text-shadow:0 2px 18px rgba(0,0,0,.85);
    pointer-events:none; overflow:hidden; transition:opacity .45s ease; }
  #captions.hush{ opacity:0; }
  #captions .cap-line{ position:absolute; left:22px; right:22px; bottom:0;
    transition:transform .5s ease, opacity .5s ease; }
  #captions .cap-line.out{ transform:translateY(-1.55em); opacity:0; }
  #captions .cap-w{ color:#8791a6; transition:color .16s ease, text-shadow .3s ease; }
  #captions .cap-w.on{ color:var(--lit); text-shadow:0 0 16px rgba(217,177,104,.45); }

  /* ── full-screen cards + the radio-button skit: placeholder layers wired at T2.2
     (ENGINE §5/§5b). Layer order (binding): stage < cards < skit < captions. ──── */
  #card{ position:absolute; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; pointer-events:none; }
  #card.on{ display:flex; }
  #skit{ position:absolute; inset:0; z-index:7; display:none; background:#000;
    align-items:center; justify-content:center; pointer-events:none; }
  #skit.on{ display:flex; }

  /* ── the held-black out-point (ENGINE §8 step 6): a black overlay held
     indefinitely once the film content ends; the synthetic clock runs under it. */
  #heldblack{ position:absolute; inset:0; background:#000; z-index:20; opacity:0;
    pointer-events:none; transition:opacity .4s ease; }
  #heldblack.on{ opacity:1; }

  /* ── the RM preflight banner (ENGINE §8: Reduce Motion freezes the estate) ──── */
  #rmbanner{ position:fixed; left:0; right:0; top:0; z-index:25;
    background:#7a1420; color:#fff; font:600 13px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.02em; padding:8px 16px; text-align:center;
    border-bottom:1px solid rgba(255,255,255,.25); }
  #rmbanner[hidden]{ display:none; }

  /* ── the start gate: the ONE blessing gesture (real input click — a synthetic
     .click() unlocks no audio). The rich record-mode reach-in choreography +
     preflight land at T6.2. ─────────────────────────────────────────────────── */
  #startgate{ position:fixed; inset:0; z-index:40; background:
    radial-gradient(900px 560px at 50% 30%, rgba(120,110,180,.14), transparent 60%), var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    padding:32px; text-align:center; }
  #startgate[hidden]{ display:none; }
  #startgate .kick{ font:600 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.34em;
    text-transform:uppercase; color:var(--muted); }
  #startgate h1{ font-family:Georgia,serif; font-weight:500; font-size:clamp(34px,6vw,64px);
    margin:.1em 0; background:linear-gradient(180deg,#fff,#c6c9d6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #startgate .sub{ color:var(--muted); font-style:italic; font-family:Georgia,serif;
    max-width:540px; font-size:16px; line-height:1.55; }
  #startgate button{ font:600 15px/1 ui-monospace,Menlo,monospace; letter-spacing:.03em;
    color:var(--ink); background:#161b25; border:1px solid var(--brass); border-radius:9px;
    padding:14px 24px; cursor:pointer; margin-top:8px; }
  #startgate button:hover{ background:#1d2431; color:var(--lit); }

  /* ── authoring chrome (DOM-REMOVED in ?record, not merely hidden) ──────────── */
  #authoring{ position:fixed; left:0; right:0; bottom:0; z-index:9; height:60px;
    background:linear-gradient(180deg,#0f131b,#080a0f); border-top:1px solid var(--line);
    display:grid; grid-template-columns:auto 1fr auto auto; align-items:center;
    gap:14px; padding:8px 16px; }
  #authoring button{ font:600 13px/1 ui-monospace,Menlo,monospace; color:var(--ink);
    background:#161b25; border:1px solid var(--line); border-radius:7px;
    padding:9px 12px; cursor:pointer; }
  #authoring button:hover{ border-color:var(--brass); color:var(--lit); }
  #btn-log[aria-pressed="true"]{ border-color:var(--brass); color:var(--gold); }
  #scrub{ width:100%; accent-color:var(--brass); cursor:pointer; }
  #authoring .clocks{ font:600 12px/1 ui-monospace,Menlo,monospace; color:var(--muted);
    white-space:nowrap; }
  #cuelog{ position:fixed; right:16px; bottom:72px; z-index:8;
    width:min(360px,42vw); max-height:150px; overflow-y:auto; text-align:right;
    font:500 11px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    pointer-events:none; opacity:.72; }
  #cuelog[hidden]{ display:none; }
  #cuelog .cue-line{ text-shadow:0 1px 6px #000; }

  #segbank{ position:absolute; width:0; height:0; overflow:hidden; }

  /* ── ?record: fix the stage at EXACTLY 1920×1080 CSS px centered on pure black,
     hide the pointer (the skit uses a deck-drawn fake cursor) — ENGINE §8. ───── */
  body.record{ background:#000; cursor:none; }
  body.record #stage{ position:fixed; inset:auto; left:50%; top:50%;
    transform:translate(-50%,-50%); width:1920px; height:1080px; }
  body.record #captions{ font-size:32px; }

  @media (prefers-reduced-motion: reduce){
    .stage-frame, #captions, #captions .cap-w, #captions .cap-line, #heldblack{ transition:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="card" aria-hidden="true"></div>
  <div id="skit" aria-hidden="true"></div>
  <div id="captions" aria-live="polite" aria-atomic="false"></div>
  <div id="heldblack" aria-hidden="true"></div>
</div>

<div id="rmbanner" role="alert" hidden></div>

<div id="cuelog" aria-hidden="true" hidden></div>

<div id="segbank" aria-hidden="true"></div>

<div id="authoring" role="group" aria-label="trailer authoring controls">
  <button id="btn-play" type="button" aria-label="play or pause">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="seek">
  <span class="clocks"><span id="clock">0:00</span> / <span id="dur">0:00</span></span>
  <button id="btn-log" type="button" aria-pressed="false"
    title="show or hide the cue log (every cue + stage note as it fires)">LOG</button>
</div>

<div id="startgate">
  <div class="kick">The Orrery Estate</div>
  <h1>a trailer</h1>
  <p class="sub">A hand-built creative web-art estate — and a short film about the afternoon it was given. One click to begin; the montage plays itself.</p>
  <button id="start-btn" type="button">▶ play the trailer</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   TRAILER_CHAPTERS — the ONE continuous cue-engine chapter (ENGINE §0). The
   trailer is ONE long timeline; a length-1 CHAPTERS array runs on the shared,
   UNCHANGED cue-engine.js. Only the MEANING of a `frame` cue differs from the
   Showing: a `frame` value is a STACK KEY (a preloaded iframe brought to the top
   by trailer.js's setFrame), not an iframe src to reload (ENGINE §2 / §3.2).

   T2.1 (this shell) authors the FRAME-FLIP SPINE only — every montage cut, at
   PLANNING t (SCRIPT §3 shot list; D = dropAtMs planning worst-case 113.2 s).

   T2.2 / T4 / T5.1. Every t here is a placeholder to be re-anchored to a real
   sidecar word time (invariant 9); nothing below is a locked value.

   BLOCK / line comments ONLY inside this forged script (the forge landmine — a
   multi-line HTML comment inside an inlined <script> silently kills it). */
window.TRAILER_CHAPTERS = [
  { id:'trailer', title:'The Orrery Estate — a trailer',
    opening:{ frame:'../colophon.html' },
    /* placeholder film length (~3:00) so authoring scrub has a range; the real
       duration comes from the cue-locked bed manifest (T4.2). */
    timing:{ duration_ms:180000, items:[] },
    cues:[
      { t:0.0,   note:'S0 · cold open — the Colophon speaks for itself (zoom + page audio: T2.2)' },
      { t:7.3,   note:'S1 starts over black — first cold plates fade in under "First, the crucible"' },

/* ════════════════════════════════════════════════════════════════════════════
   TRAILER_FRAME_MANIFEST — the per-frame determinism-and-audio manifest (cloned

   URL the deck frames is keyed with its `allow` (the ENGINE §2 audio-policy
   table), a `class` (the page's dominant source nondeterminism), a `disposition`
   (how the film keeps it honest — a recorded take is ONE roll, so `tolerant` is
   easy), and a note. trailer.js builds one preloaded iframe per key at boot and
   setFrame flips them; the T5.2 rehearsal gate is the enforcer that REDs any
   framed page whose source greps Date.now|Math.random|new Date without an honest
   entry. `class`/`disposition` recorded from a live honesty grep at T2.1 (counts
   noted where a page rolls). The four audio moments (colophon · lattice · errand

window.TRAILER_FRAME_MANIFEST = {
  frames: {
    '../colophon.html':
      { allow:'autoplay', class:'random-seed', disposition:'tolerant',
        note:'COLD OPEN (audio moment 1) — hooked (colophonBeginAt/Cut/Resume/WordRect, T1.1). The woven narration is deterministic content; the candidate cloud is deterministic-seeded (mulberry32(392)) and the residual Math.random is decorative. The take pre-seeks to ~21.2 s and cuts ~26.3 s.' },
    '../museum/archive/hydrogen-2e12cf1.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'deterministic',
        note:'COLD PLATE (sha 2e12cf1) — the mandated before→after pair BEFORE side; the lone `new Date` is display-only formatting of a committer epoch, no Date.now/Math.random in any render path.' },
    '../museum/archive/predator-prey-4b4fb90.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'deterministic',
        note:'COLD PLATE (sha 4b4fb90) — Lotka–Volterra charts, zero animals; `new Date` display-only.' },
    '../museum/archive/stirling-47160c4.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'deterministic',
        note:'COLD PLATE (sha 47160c4) — the P–V loop + "self-test 9/9" pill; `new Date` display-only.' },
    '../bifurcation/index.html':
      { allow:"autoplay 'none'", class:'random-seed', disposition:'tolerant',
        note:'The Road Into Chaos — logistic-map cobweb + bifurcation road-map; 1 decorative Math.random, no VO line names a rolled state.' },
    '../conservatory/sir/index.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'tolerant',
        note:'The SIR Epidemic — on-screen ODE strip; the ODE render is deterministic, `new Date` display-only.' },
    '../clockwork/next-word.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'deterministic',
        note:'The Next Word (the loaded die) — source clean of Date.now/Math.random/new Date; rides the incantation VO.' },
    '../clockwork/turn.html':
      { allow:"autoplay 'none'", class:'calm', disposition:'tolerant',
        note:'The Turn — a maker burns its turn and is gone (the boulder beat); `new Date` display-only.' },
    '../clockwork/context.html':
      { allow:"autoplay 'none'", class:'deterministic', disposition:'deterministic',
        note:'The Context Window — "I do not have a memory. I have a context window" (the wander/session-history beat); source clean of Date.now/Math.random/new Date.' },

        note:'The Rotor — deterministic physics driven on camera via #omega + #dropBtn (scroll to #drumWrap), T5.1; `new Date` display-only.' },

        note:'The Coaster — hooked ghostRide() (deterministic boot-track detach ~3288 ms, T1.2); NOT forge-managed (no .src.html; gate is core.test.mjs); `new Date` display-only.' },
    '../stellar-forge/index.html':

        note:'Scales of a Star’s Death — the collar past the Chandrasekhar limit → collapse → pulsar spin; the DROP lands on the shock flash; `new Date` display-only.' },

/* ════════════════════════════════════════════════════════════════════════════

window.TRAILER_SEGMENTS = [
  { id:'S1', atMs:7300 },
  { id:'S2', atMs:116700 },
  { id:'S3', atMs:135900 },
  { id:'S4', atMs:151300 },
  { id:'S5', atMs:168700 }
];
</script>
