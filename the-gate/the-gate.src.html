<title>The Orrery Estate — the Gate</title>
<style>
  :root{
    /* ---- house tokens (verbatim from index.src.html:8-20) ---- */
    --bg:#080a0f; --ink:#eaf0fa; --muted:#8b95a8; --brass:#c9a24a; --brass-bright:#f0d489;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }

  /* the stage holds the SVG scene + the FX canvas + the UI chrome */
  #stage{ position:fixed; inset:0; background:var(--bg); }
  #scene-host{ position:absolute; inset:0; }
  #scene-host svg{ display:block; width:100%; height:100%; }
  /* the FX canvas overlay (rain/lightning/birds later) — empty this pass */
  #fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* a generous click target over the gate (the gate svg captures most clicks too) */
  #gate-hit{ position:absolute; inset:0; cursor:pointer; }

  /* black overlay for fade-in / fade-out */
  #overlay{ position:absolute; inset:0; background:#000; opacity:1; pointer-events:none; z-index:40; }

  /* the welcome card (colophon idiom: gradient-clip title + mono kicker + tagline) */
  #welcome{ position:absolute; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; flex-direction:column; text-align:center;
    background:radial-gradient(60% 60% at 50% 45%, rgba(20,16,8,.4), #000 78%);
    opacity:0; transform:translateY(8px);
    transition:opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
  #welcome.in{ opacity:1; transform:none; }
  #welcome .mark{ font:600 12px/1 var(--mono); letter-spacing:.4em; text-transform:uppercase;
    color:var(--brass); opacity:.85; margin-bottom:.7em; }
  #welcome h1{ font-family:var(--serif); font-weight:500; font-size:clamp(40px,7vw,72px);
    margin:.1em 0 .25em; letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff,#c6c9d6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #welcome .sub{ color:var(--muted); font-size:clamp(15px,2.2vw,19px); font-style:italic;
    max-width:560px; margin:0 auto; line-height:1.55; }

  /* ── UI chrome: weather tri-toggle + mute chip (brass-styled, bottom corners) ── */
  .chip{ position:absolute; bottom:18px; z-index:30; display:flex; align-items:center; gap:1px;
    background:rgba(11,14,22,.78); border:1px solid rgba(201,162,74,.45); border-radius:10px;
    padding:3px; box-shadow:0 0 18px -8px rgba(201,162,74,.5); backdrop-filter:blur(2px); }
  .chip button{ background:none; border:none; cursor:pointer; color:var(--muted);
    font:600 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
    padding:6px 9px; border-radius:7px; transition:color .2s, background .2s; }
  .chip button:hover{ color:var(--brass-bright); }
  .chip button.active{ color:var(--brass-bright); background:rgba(201,162,74,.14); }
  #weather-toggle{ left:18px; }
  #mute-chip{ right:18px; }
  #mute-chip button{ font-size:14px; padding:6px 10px; }

  /* gnomon discoverability hint pulse */
  .gnomon-hint{ animation:gnomon-pulse 2.6s ease-in-out infinite; }
  @keyframes gnomon-pulse{ 0%,100%{ opacity:0; } 50%{ opacity:.45; } }
  @media (prefers-reduced-motion: reduce){ .gnomon-hint{ animation:none; } }
</style>
</head>
<body>
  <div id="stage">
    <div id="scene-host"></div>
    <canvas id="fx"></canvas>
    <div id="gate-hit" aria-label="Open the gate"></div>
    <div id="overlay"></div>
    <div id="welcome" role="dialog" aria-label="Welcome">
      <div class="mark">The Orrery Estate</div>
      <h1>Welcome to the Orrery Estate</h1>
      <div class="sub">Where the mathematics keeps its mysteries.</div>
    </div>

    <!-- UI chrome -->
    <div class="chip" id="weather-toggle" role="group" aria-label="Weather">
      <button data-wx="clear">Clear</button>
      <button data-wx="cloudy">Cloudy</button>
      <button data-wx="storm">Storm</button>
    </div>
    <div class="chip" id="mute-chip">
      <button id="mute-btn" aria-label="Mute">🔊</button>
    </div>
  </div>

  <!-- ════ BOOT — a thin dispatcher. Calls Gate.scene.*, Gate.colormap.*, etc.
       Asset agents edit their own module file, never this boot. ════ -->
  <script>
  (function () {
    'use strict';
    var Gate = window.Gate;
    var S = Gate.scene, CM = Gate.colormap;

    // ── parse dev URL overrides ──────────────────────────────────────────────
    var url = Gate.sequence.parseUrl(window.location.search);

    // ── init subsystems with any pins ────────────────────────────────────────
    Gate.timeofday.init({ pin: url.t });
    Gate.weather.init({ pin: url.wx, seed: url.seed });
    Gate.audio.init();
    var moonK = url.moon != null ? url.moon : 0.6;   // greybox default
    S.setMoonK(moonK);                               // also drives the DRAWN phase
    S.setDevUndercroft(url.undercroft);              // ?undercroft=1 forces the hatch

    // ── current brightness + resolved palette → write CSS vars on the scene host ─
    var host = document.getElementById('scene-host');
    var sceneRoot = document.getElementById('stage');
    var flash = false;

    function currentB() {
      return CM.B(Gate.timeofday.band(), moonK, Gate.weather.weather(), flash);
    }
    function resolved() {
      return CM.resolve(Gate.timeofday.band(), currentB());
    }
    function paintImmediate() {
      S.applyResolved(sceneRoot, resolved());
    }

    // ── build the scene ──────────────────────────────────────────────────────
    paintImmediate();                 // set vars BEFORE first paint (no flash of unstyled)
    S.build(host);

    // crossfade helper used by gnomon + weather changes
    var cancelFade = null;
    function recolor() {
      // snapshot current vars (read from inline style), compute target, JS-lerp.
      var from = {};
      var target = resolved();
      for (var k in target) {
        if (Object.prototype.hasOwnProperty.call(target, k)) {
          var cur = sceneRoot.style.getPropertyValue(k);
          from[k] = cur || target[k];
        }
      }
      if (cancelFade) cancelFade();
      cancelFade = CM.crossfade(sceneRoot, from, target, 1000, null);
      // sky objects (moon↔sun) swap immediately under the fade
      S.refreshSkyObjects();
      // mirror dash aliases continuously during the fade so SVG attrs track it
      mirrorDuring(target);
    }

    // colormap.crossfade writes the dotted vars; SVG attrs read dash aliases.
    // Keep the dash aliases in lockstep during a fade with a short rAF mirror.
    function mirrorDuring(target) {
      var t0 = performance.now();
      function tick(now) {
        for (var k in target) {
          if (!Object.prototype.hasOwnProperty.call(target, k)) continue;
          var v = sceneRoot.style.getPropertyValue(k);
          if (v) sceneRoot.style.setProperty(S.dashName(k.replace(/^--/, '')), v);
        }
        if (now - t0 < 1100) requestAnimationFrame(tick);
        else S.applyResolved(sceneRoot, target); // final exact set
      }
      requestAnimationFrame(tick);
    }

    // ── wire the gnomon: tap → advance band → recolor ────────────────────────
    Gate.gnomon.bind(S.refs.gnomon, function () { recolor(); });
    // band changes from anywhere also recolor
    Gate.timeofday.onChange(function () { recolor(); });

    // ── wire the weather tri-toggle ──────────────────────────────────────────
    var wxButtons = document.querySelectorAll('#weather-toggle button');
    function syncWx() {
      var w = Gate.weather.weather();
      wxButtons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-wx') === w); });
    }
    wxButtons.forEach(function (b) {
      b.addEventListener('click', function () { Gate.weather.set(b.getAttribute('data-wx')); });
    });
    Gate.weather.onChange(function () { syncWx(); recolor(); });
    syncWx();

    // ── wire the mute chip to the shared estate flag ─────────────────────────
    var muteBtn = document.getElementById('mute-btn');
    function syncMute() {
      var m = Gate.audio.muted();
      muteBtn.textContent = m ? '🔇' : '🔊';
      muteBtn.setAttribute('aria-label', m ? 'Unmute the estate' : 'Mute the estate');
    }
    muteBtn.addEventListener('click', function () { Gate.audio.toggle(); });
    Gate.audio.onMuteChange(function () { syncMute(); });
    syncMute();

    // ── the click-through sequence ───────────────────────────────────────────
    var overlay = document.getElementById('overlay');
    var welcomeEl = document.getElementById('welcome');
    var gateHit = document.getElementById('gate-hit');

    Gate.sequence.start({
      overlay: overlay, welcomeEl: welcomeEl, S: S,
      dev: url.dev, scene: url.scene, dest: '../index.html',
      onEnterIdle: function () {
        // clicking the gate (but NOT the gnomon or the chrome) opens it
        function onGateClick(ev) {
          // ignore clicks on the gnomon target or the UI chips
          var t = ev.target;
          while (t && t !== document.body) {
            if (t.id === 'gnomon-target' || (t.classList && t.classList.contains('chip'))) return;
            if (t.parentNode && t.parentNode.id === 'gnomon-target') return;
            t = t.parentNode;
          }
          Gate.sequence.triggerOpen();
        }
        gateHit.addEventListener('click', onGateClick);
        if (S.refs.svg) S.refs.svg.addEventListener('click', onGateClick);
      }
    });

    // ── the ONE perpetual rAF loop (idles ~0 CPU when backgrounded) ──────────
    // Greybox: it just stamps fps + (later) drives FX / sway / lightning. The
    // colormap fades + sequence run on their own rAFs (short-lived); this is the
    // persistent screensaver loop.
    var last = performance.now(), fpsAccum = 0, fpsCount = 0;
    window.__gateFps = 0;
    var DPR = Math.min(2, window.devicePixelRatio || 1);
    var fx = document.getElementById('fx');
    function resizeFx() {
      fx.width = Math.floor(fx.clientWidth * DPR);
      fx.height = Math.floor(fx.clientHeight * DPR);
    }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function loop(now) {
      requestAnimationFrame(loop);
      if (document.hidden) { last = now; return; }   // idle when backgrounded
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      // fps gauge
      fpsAccum += dt; fpsCount++;
      if (fpsAccum >= 0.5) { window.__gateFps = Math.round(fpsCount / fpsAccum); fpsAccum = 0; fpsCount = 0; }
      // TODO Phase D: weather-fx.draw(fx, dt, band, weather, flash) — rain, lightning
      //               bloom, clouds, birds, sway. Empty this pass.
    }
    requestAnimationFrame(loop);

    // expose a tiny debug handle
    window.__gate = { recolor: recolor, currentB: currentB, S: S, url: url };
  })();
  </script>
