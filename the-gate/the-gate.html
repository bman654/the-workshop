     toggled on another estate tab takes effect live. A page's audio gates on

  //                 { DAY:{'rep.swatch1':'#..','rep.glow1':'#..'}, DUSK:{…}, NIGHT:{…} },

      DUSK:  { 'rep.swatch1': '#3f8a9a', 'rep.swatch2': '#6fb6c0', 'rep.glow1': '#7fe0e8' },

      DUSK:  { 'rep.swatch1': '#5a4632', 'rep.glow1': '#cf7bff' },

    var featId = featuredId(slab);
    if (featId && featId !== 'cairn') {
      for (var f = 0; f < slab.length; f++) {

      return { id: 'cairn', rep: 'cairn', repColors: BESPOKE.cairn.repColors,

    return { id: 'cairn', rep: 'cairn', repColors: BESPOKE.cairn.repColors,

    // the ring up to the crown, opening toward the upper-right where the barrel exits.
    var slL_b = ox + 2,  slR_b = ox + 17;          // base (at the ring)
    var slL_t = ox + 8,  slR_t = ox + 20;          // top (near the crown)
    var slTopY = domeTop + 2;
    // the dark interior of the open slit (the night sky / dome interior seen through it)
    S.el('path', { d: 'M ' + slL_b + ' ' + ringY + ' L ' + slL_t + ' ' + slTopY +
      ' L ' + slR_t + ' ' + slTopY + ' L ' + slR_b + ' ' + ringY + ' Z',
      fill: BODY_R }, g);
    // warm interior GLOW pooling at the bottom of the open slit (the lit dome within)
    S.el('path', { d: 'M ' + (slL_b + 1.5) + ' ' + (ringY - 1) +
      ' L ' + (slL_t + 1) + ' ' + (domeTop + domeRy * 0.5) +
      ' L ' + (slR_t - 1) + ' ' + (domeTop + domeRy * 0.5) +
      ' L ' + (slR_b - 1.5) + ' ' + (ringY - 1) + ' Z',
      fill: GLOW, opacity: '0.42', filter: SOFT }, g);
    // the two shutter-leaf edges (brass, top-lit) framing the open slit
    S.el('line', { x1: slL_b, y1: ringY, x2: slL_t, y2: slTopY,
      stroke: BRASS, 'stroke-width': '1.3', opacity: '0.9' }, g);
    S.el('line', { x1: slR_b, y1: ringY, x2: slR_t, y2: slTopY,
      stroke: BRASS, 'stroke-width': '1.3', opacity: '0.9' }, g);
    // bright top-lit glints up BOTH shutter leaves — the left up-facing edge and the
    // right leaf where the barrel emerges (per judges: brass-bright the slit edge at
    // the barrel exit so the aperture reads as a real opening).
    S.el('line', { x1: slL_b + 0.6, y1: ringY - 1, x2: slL_t + 0.6, y2: slTopY - 1,
      stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.65' }, g);
    S.el('line', { x1: slR_b + 0.6, y1: ringY - 1, x2: slR_t + 0.6, y2: slTopY - 1,
      stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.6' }, g);
    // a small brass shutter-leaf head cap at the crown (the rolled-back shutter top)
    S.el('circle', { cx: slR_t, cy: slTopY, r: 1.8, fill: TONE, stroke: BRASS, 'stroke-width': '0.9' }, g);

    // ── the TELESCOPE — a segmented brass barrel leaning out of the slit toward
    //    the sky: a wider draw-tube near the dome stepping to a narrower objective
    //    tube, with brass body-bands and a bright objective-lens glint at the tip. ──
    var tx0 = ox + 12, ty0 = domeTop + 5;         // barrel root (inside the open slit)
    var tx1 = ox + 46, ty1 = domeTop - 22;        // objective end (out at the sky)
    // outer dark barrel core (one stroke, round caps) — bumped a touch bolder so the
    // telescope (the load-bearing 'observatory' cue) survives at full-frame distance.
    S.el('line', { x1: tx0, y1: ty0, x2: tx1, y2: ty1, stroke: TONE,
      'stroke-width': '8.5', 'stroke-linecap': 'round' }, g);
    // brass tube sheath + a thin bright top-lit edge along the up-facing side
    S.el('line', { x1: tx0, y1: ty0, x2: tx1, y2: ty1, stroke: BRASS,
      'stroke-width': '5.8', 'stroke-linecap': 'round' }, g);
    S.el('line', { x1: tx0 - 0.6, y1: ty0 - 1.4, x2: tx1 - 0.6, y2: ty1 - 1.4,
      stroke: BRIGHT, 'stroke-width': '1.1', 'stroke-linecap': 'round', opacity: '0.75' }, g);
    // two body-bands across the barrel (draw-tube joints) — perpendicular ticks
    var bdx = tx1 - tx0, bdy = ty1 - ty0, blen = Math.sqrt(bdx * bdx + bdy * bdy);
    var nx = -bdy / blen, ny = bdx / blen;        // unit normal to the barrel
    for (var bt = 0.38; bt <= 0.66; bt += 0.28) {
      var cxb = tx0 + bdx * bt, cyb = ty0 + bdy * bt;
      S.el('line', { x1: cxb - nx * 3.6, y1: cyb - ny * 3.6, x2: cxb + nx * 3.6, y2: cyb + ny * 3.6,
        stroke: BRASS, 'stroke-width': '1.4', opacity: '0.85' }, g);
    }
    // a small brass mount/yoke saddle where the barrel exits the dome
    S.el('circle', { cx: tx0, cy: ty0, r: 3, fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('circle', { cx: tx0 - 0.8, cy: ty0 - 0.8, r: 1, fill: BRIGHT, opacity: '0.8' }, g);
    // objective lens cap ring + a bright lens glint catching the sky
    S.el('circle', { cx: tx1, cy: ty1, r: 3.2, fill: TONE, stroke: BRASS, 'stroke-width': '1.2' }, g);
    S.el('circle', { cx: tx1 - 0.8, cy: ty1 - 0.9, r: 1.6, fill: BRIGHT, opacity: '0.9' }, g);

    // ── two small ARCHED lit windows in the drum (the astronomer's lamp within):
    //    a brass arch surround over an emissive pane that glows at night, recedes
    //    by day. Kept small + quiet so the building reads distant. ──
    drawObsWindow(S, g, ox - 26, oy - 40, 12, 18);
    drawObsWindow(S, g, ox + 14, oy - 40, 12, 18);

    // a low brass DOOR pip at the drum foot on the central axis (a hint of entry)
    S.el('rect', { x: ox - 5, y: oy - 16, width: 10, height: 14, rx: 4,
      fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('line', { x1: ox - 4, y1: oy - 15, x2: ox + 4, y2: oy - 15,
      stroke: BRIGHT, 'stroke-width': '0.8', opacity: '0.5' }, g);
  };

  // a small arch-topped observatory window: brass arched reveal + emissive pane +
  // a glazing-bar cross + a top-lit lintel glint. Reads as a warm lit slot at night.
  function drawObsWindow(S, g, x, y, w, h) {
    var BRASS = 'var(--brass-stroke-ref, #9c8350)';
    var BRIGHT = 'var(--brass-bright-ref, #cdb375)';
    var cx = x + w / 2, arch = y - 5;
    // brass arched reveal (the opening cut into the drum)
    S.el('path', { d: 'M ' + x + ' ' + (y + h) + ' L ' + x + ' ' + y +
      ' Q ' + cx + ' ' + arch + ' ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' Z',
      fill: 'rgba(11,14,22,.85)', stroke: BRASS, 'stroke-width': '1' }, g);
    // emissive warm pane via the shared litWindow helper (glows at night)
    litWindow(S, g, x + 1.5, y + 1, w - 3, h - 2);
    // glazing-bar cross splitting the pane (thin dark muntins)
    S.el('line', { x1: cx, y1: y + 1, x2: cx, y2: y + h - 1, stroke: 'rgba(11,14,22,.55)', 'stroke-width': '0.7' }, g);
    S.el('line', { x1: x + 1.5, y1: y + h / 2, x2: x + w - 1.5, y2: y + h / 2, stroke: 'rgba(11,14,22,.55)', 'stroke-width': '0.7' }, g);
    // top-lit arch glint (the up-facing brass edge)
    S.el('path', { d: 'M ' + (x + 0.6) + ' ' + (y - 0.4) + ' Q ' + cx + ' ' + (arch - 1) + ' ' + (x + w - 0.6) + ' ' + (y - 0.4),
      fill: 'none', stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.6' }, g);
  }

  /* ── CENTER: the manor house — the DESTINATION, centered behind the gate ──────
     Centered on the seam (x≈800) so the road through the opened gate leads straight
     to it; you glimpse it through the bars. Distant + slightly smaller than before
     so the gate dominates the foreground. Base meets the grounds cleanly at the
     horizon (no float). Sits between the piers, read THROUGH the gate. */
  /* ── TAKE 2 — "The Palladian Seat." A formal Georgian/Palladian country house:
     strict bilateral symmetry, a pedimented central FRONTISPIECE (a temple-front
     portico) framing the lit door, quoined wing corners, a hipped slate roof with
     dormers + chimneys, a balustraded parapet stringcourse, and a clock tower
     crowned by an open CUPOLA lantern with a brass finial. The character vs. the
     other takes: aristocratic restraint + a strong central axis (a frontispiece
     you read straight down the road), with every up-facing course caught by a
     brass-bright top-lit highlight in the estate idiom.

     Palette roles: manor.wall (dressed stone) / manor.roof (slate) / manor.trim
     (cornice band) / brass.stroke + brass.bright (top-lit eaves, lintels, quoins).
     Emissive: window.lit (a regular sash grid + door + dormers + clock face/pip +
     wing windows). Lit from above — sheen on TOP edges, shadow drops down/forward. */

  // small private helper: a top-lit brass cornice/string course — a body band with
  // a brass stroke and a brass-bright glint along its UP-facing top edge.
  function brassCourse(S, g, x, y, w, h) {
    S.el('rect', { x: x, y: y, width: w, height: h,
      fill: 'rgba(11,14,22,.42)', stroke: 'var(--brass-stroke-ref, #9c8350)',
      'stroke-width': '1.1', filter: 'url(#glow-soft)' }, g);
    S.el('line', { x1: x + 1, y1: y + 0.8, x2: x + w - 1, y2: y + 0.8,
      stroke: 'var(--brass-bright-ref, #cdb375)', 'stroke-width': '1.1', opacity: '0.7' }, g);
  }

  // a single sash window: dressed-stone reveal + brass lintel + emissive glass with
  // a glazing-bar cross + a sill. Reads as candlelight at night, recedes by day.
  function sashWindow(S, g, x, y, w, h) {
    // stone reveal / surround (so windows read as openings cut into stone, not decals)
    S.el('rect', { x: x - 2, y: y - 2, width: w + 4, height: h + 4, rx: 1,
      fill: 'var(--manor-wall-ref, #aeb6c6)', stroke: 'var(--brass-stroke-ref, #9c8350)',
      'stroke-width': '0.8', opacity: '0.9' }, g);
    // emissive glass (window.lit) — the warm pane
    litWindow(S, g, x, y, w, h);
    // glazing bars (thin dark muntins splitting the pane into a 2×2 sash)
    S.el('line', { x1: x + w / 2, y1: y, x2: x + w / 2, y2: y + h,
      stroke: 'rgba(11,14,22,.55)', 'stroke-width': '0.9' }, g);
    S.el('line', { x1: x, y1: y + h / 2, x2: x + w, y2: y + h / 2,
      stroke: 'rgba(11,14,22,.55)', 'stroke-width': '0.9' }, g);
    // brass lintel above (top-lit) + a thin stone sill below (shadow drops forward)
    S.el('line', { x1: x - 2, y1: y - 2.4, x2: x + w + 2, y2: y - 2.4,
      stroke: 'var(--brass-bright-ref, #cdb375)', 'stroke-width': '1.1', opacity: '0.65' }, g);
    S.el('line', { x1: x - 3, y1: y + h + 1.8, x2: x + w + 3, y2: y + h + 1.8,
      stroke: 'var(--brass-stroke-ref, #9c8350)', 'stroke-width': '1', opacity: '0.55' }, g);
  }

  B.drawManor = function (parent, S) {
    var g = S.group('manor', parent);
    // anchor: dead-center, GRAND — base sits ON the horizon (y=472, no float).
    // Main block + flanking wings ALMOST FILL the gate opening (x472..1128, center
    // x800) with a small margin inside the piers, so the bars FRAME it. The central
    // frontispiece + clock tower carry the eye straight down the road's axis.
    var mx = 800, baseY = 472, w = 392, h = 124;
    var left = mx - w / 2, top = baseY - h;     // main block x604..996

    var WALL = 'var(--manor-wall-ref, #aeb6c6)';
    var ROOF = 'var(--manor-roof-ref, #3a4150)';
    var TRIM = 'var(--manor-trim-ref, #8f8466)';
    var BRASS = 'var(--brass-stroke-ref, #9c8350)';
    var BRIGHT = 'var(--brass-bright-ref, #cdb375)';
    var GLOW = 'var(--window-lit-ref, #ffcf73)';
    var TONE = 'rgba(11,14,22,.85)';

    // ════ FLANKING WINGS (drawn first, behind the taller main block) ════════════
    // Subordinate two-storey pavilions reaching out toward the piers. Slightly
    // shorter than the main block + lower hipped roofs → the centre dominates.
    var wingW = 104, wingTop = top + 26;
    var lwX = left - wingW + 8;                  // left wing  x508..612
    var rwX = left + w - 8;                      // right wing x996..1100
    var wingBodies = [lwX, rwX];
    for (var wi = 0; wi < 2; wi++) {
      var wxL = wingBodies[wi];
      // hipped roof cap (trapezoid — a hip, not a gable) sitting on the eave line
      S.el('path', { d: 'M ' + (wxL - 5) + ' ' + wingTop +
        ' L ' + (wxL + wingW * 0.30) + ' ' + (wingTop - 22) +
        ' L ' + (wxL + wingW * 0.70) + ' ' + (wingTop - 22) +
        ' L ' + (wxL + wingW + 5) + ' ' + wingTop + ' Z',
        fill: ROOF, stroke: BRASS, 'stroke-width': '1' }, g);
      // top-lit ridge sheen
      S.el('line', { x1: wxL + wingW * 0.30, y1: wingTop - 21, x2: wxL + wingW * 0.70, y2: wingTop - 21,
        stroke: BRIGHT, 'stroke-width': '1.1', opacity: '0.55' }, g);
      // wing wall
      S.el('rect', { x: wxL, y: wingTop, width: wingW, height: baseY - wingTop,
        fill: WALL, stroke: BRASS, 'stroke-width': '1' }, g);
      // QUOINED outer corner (alternating stone blocks) — formal stonework cue
      var qOuterX = (wi === 0) ? wxL : wxL + wingW - 7;
      for (var qy = wingTop + 4; qy < baseY - 8; qy += 24) {
        S.el('rect', { x: qOuterX, y: qy, width: 7, height: 12,
          fill: WALL, stroke: BRASS, 'stroke-width': '0.7', opacity: '0.9' }, g);
        S.el('line', { x1: qOuterX, y1: qy + 0.6, x2: qOuterX + 7, y2: qy + 0.6,
          stroke: BRIGHT, 'stroke-width': '0.7', opacity: '0.4' }, g);
      }
      // eave cornice band (top-lit)
      brassCourse(S, g, wxL - 2, wingTop - 2, wingW + 4, 4);
    }

    // ════ MAIN BLOCK ════════════════════════════════════════════════════════════
    S.el('rect', { x: left, y: top, width: w, height: h, fill: WALL,
      stroke: BRASS, 'stroke-width': '1.1' }, g);
    // a horizontal STRINGCOURSE splitting the two storeys (top-lit band)
    var storeyY = top + h * 0.5;
    brassCourse(S, g, left, storeyY - 2, w, 4);

    // ════ HIPPED SLATE ROOF over the main block (trapezoid hip, top-lit eave) ════
    var eaveOver = 10, ridgeRise = 50, ridgeInset = w * 0.26;
    S.el('path', { d: 'M ' + (left - eaveOver) + ' ' + top +
      ' L ' + (left + ridgeInset) + ' ' + (top - ridgeRise) +
      ' L ' + (left + w - ridgeInset) + ' ' + (top - ridgeRise) +
      ' L ' + (left + w + eaveOver) + ' ' + top + ' Z',
      fill: ROOF, stroke: BRASS, 'stroke-width': '1.1' }, g);
    // ridge line + the two hip rakes catch the top light
    S.el('line', { x1: left + ridgeInset, y1: top - ridgeRise + 1, x2: left + w - ridgeInset, y2: top - ridgeRise + 1,
      stroke: BRIGHT, 'stroke-width': '1.3', opacity: '0.6' }, g);
    S.el('path', { d: 'M ' + (left - eaveOver) + ' ' + top + ' L ' + (left + ridgeInset) + ' ' + (top - ridgeRise),
      fill: 'none', stroke: BRIGHT, 'stroke-width': '1.1', opacity: '0.4' }, g);
    // brass-bright cornice course running the full eave (the brightest top edge)
    brassCourse(S, g, left - eaveOver, top - 2, w + eaveOver * 2, 5);
    // a restrained BRASS BALUSTRADE PARAPET hint riding the eave — two thin brass
    // rails with sparse balusters, lit from above. Kept crisp + sparse so the
    // roofline stays calm; the parapet just adds an estate top-edge sheen.
    var balY = top - 10, balH = 7, balL = left + 4, balR = left + w - 4;
    S.el('line', { x1: balL, y1: balY + balH, x2: balR, y2: balY + balH, stroke: BRASS, 'stroke-width': '1.3' }, g);
    S.el('line', { x1: balL, y1: balY, x2: balR, y2: balY, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('line', { x1: balL, y1: balY - 0.8, x2: balR, y2: balY - 0.8, stroke: BRIGHT, 'stroke-width': '0.8', opacity: '0.6' }, g);
    for (var bx = balL + 10; bx < balR; bx += 18) {
      S.el('line', { x1: bx, y1: balY + 1, x2: bx, y2: balY + balH - 1, stroke: BRASS, 'stroke-width': '1.4', opacity: '0.7' }, g);
    }

    // dormer windows poking through the roof slope (emissive — the attic is lived in)
    var dormX = [left + w * 0.20, left + w * 0.80];
    for (var di = 0; di < dormX.length; di++) {
      var dx = dormX[di], dyTop = top - ridgeRise * 0.42;
      // little hipped dormer roof (enlarged so the attic windows read from gate distance)
      S.el('path', { d: 'M ' + (dx - 14) + ' ' + dyTop + ' L ' + dx + ' ' + (dyTop - 13) +
        ' L ' + (dx + 14) + ' ' + dyTop + ' Z', fill: ROOF, stroke: BRASS, 'stroke-width': '0.9' }, g);
      S.el('line', { x1: dx - 13, y1: dyTop - 0.6, x2: dx, y2: dyTop - 13,
        stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.5' }, g);
      litWindow(S, g, dx - 8, dyTop, 16, 17);
    }
    // a pair of slender, tall ESTATE CHIMNEY STACKS at the ridge shoulders — slim
    // and proud (the take-3 idiom) so the roofline reads as a lived-in great house,
    // kept crisp + sparse so it stays calmer than a cluttered ridge.
    var chimX = [left + ridgeInset - 4, left + w - ridgeInset - 3];
    for (var ci = 0; ci < chimX.length; ci++) {
      var cxv = chimX[ci];
      S.el('rect', { x: cxv, y: top - ridgeRise - 28, width: 11, height: 32,
        fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
      // a faint mid-stack string + the up-facing left edge sheen (lit from above)
      S.el('line', { x1: cxv + 0.8, y1: top - ridgeRise - 27, x2: cxv + 0.8, y2: top - ridgeRise + 2,
        stroke: BRIGHT, 'stroke-width': '0.7', opacity: '0.4' }, g);
      // flared brass cap
      S.el('rect', { x: cxv - 2.5, y: top - ridgeRise - 31, width: 16, height: 4,
        fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
      S.el('line', { x1: cxv - 1.5, y1: top - ridgeRise - 30.2, x2: cxv + 13, y2: top - ridgeRise - 30.2,
        stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.6' }, g);
    }

    // ════ CENTRAL FRONTISPIECE — a pedimented temple-front over the door ════════
    var tx = left + w * 0.5;       // central axis
    var fpW = 86, fpL = tx - fpW / 2, fpR = tx + fpW / 2;
    var fpTop = top + 8;           // the projecting bay rises slightly above the eave
    // the slightly-projecting bay (a touch brighter wall to read as forward)
    S.el('rect', { x: fpL, y: fpTop, width: fpW, height: baseY - fpTop,
      fill: WALL, stroke: BRASS, 'stroke-width': '1.1' }, g);
    S.el('line', { x1: fpL + 1, y1: fpTop + 1, x2: fpR - 1, y2: fpTop + 1,
      stroke: BRIGHT, 'stroke-width': '1', opacity: '0.4' }, g);
    // GIANT-ORDER PILASTER STRIPS framing the projecting bay (a Palladian cue):
    // full-height brass pilasters up both edges, top-lit on their up-facing side,
    // that read the central pavilion as a temple-front straight down the road's axis.
    var pilX = [fpL + 4, fpR - 4];
    for (var pl = 0; pl < 2; pl++) {
      S.el('line', { x1: pilX[pl], y1: fpTop + 4, x2: pilX[pl], y2: baseY - 4,
        stroke: BRASS, 'stroke-width': '1.5' }, g);
      S.el('line', { x1: pilX[pl] - 0.9, y1: fpTop + 4, x2: pilX[pl] - 0.9, y2: baseY - 4,
        stroke: BRIGHT, 'stroke-width': '0.7', opacity: '0.5' }, g);
      // a small brass capital + base block grounding each pilaster
      S.el('rect', { x: pilX[pl] - 2.5, y: fpTop + 2, width: 5, height: 3, fill: TONE, stroke: BRASS, 'stroke-width': '0.7' }, g);
    }
    // the triangular PEDIMENT crowning the frontispiece — kept PALE STONE (not slate)
    // so its mass reads against the dark roof in the idle/through-bars framing.
    var pedApex = fpTop - 34;
    S.el('path', { d: 'M ' + (fpL - 8) + ' ' + fpTop + ' L ' + tx + ' ' + pedApex +
      ' L ' + (fpR + 8) + ' ' + fpTop + ' Z', fill: WALL, stroke: BRASS, 'stroke-width': '1.3' }, g);
    // pediment top-lit rakes (the two up-facing edges, brightest sheen) + base cornice
    S.el('path', { d: 'M ' + (fpL - 8) + ' ' + fpTop + ' L ' + tx + ' ' + pedApex +
      ' L ' + (fpR + 8) + ' ' + fpTop, fill: 'none', stroke: BRIGHT, 'stroke-width': '1.3', opacity: '0.7' }, g);
    // a thin slate raking-cornice shadow just inside the pale face (so it still reads as a roof gable)
    S.el('path', { d: 'M ' + (fpL - 3) + ' ' + (fpTop - 2) + ' L ' + tx + ' ' + (pedApex + 5) +
      ' L ' + (fpR + 3) + ' ' + (fpTop - 2), fill: 'none', stroke: ROOF, 'stroke-width': '1.4', opacity: '0.7' }, g);
    brassCourse(S, g, fpL - 8, fpTop - 2, fpW + 16, 4);
    // a small lit oculus (round window) in the tympanum
    S.el('circle', { cx: tx, cy: fpTop - 11, r: 5, fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('circle', { cx: tx, cy: fpTop - 11, r: 2.8, fill: GLOW, opacity: '0.85' }, g);
    // four columns of the portico (a tetrastyle temple front) — fluted brass
    // shafts on stone plinths with a brass-bright lit edge; they frame the door.
    var colY0 = fpTop + 16, colY1 = baseY - 4;
    for (var pc = 0; pc < 4; pc++) {
      var pxv = fpL + 12 + pc * ((fpW - 24) / 3);
      // shaft
      S.el('rect', { x: pxv - 2, y: colY0, width: 4, height: colY1 - colY0,
        fill: TONE, stroke: BRASS, 'stroke-width': '0.9' }, g);
      S.el('line', { x1: pxv - 1.4, y1: colY0 + 1, x2: pxv - 1.4, y2: colY1,
        stroke: BRIGHT, 'stroke-width': '0.8', opacity: '0.6' }, g);
      // capital + base blocks
      S.el('rect', { x: pxv - 3, y: colY0 - 3, width: 6, height: 3, fill: TONE, stroke: BRASS, 'stroke-width': '0.7' }, g);
      S.el('rect', { x: pxv - 3, y: colY1, width: 6, height: 3, fill: TONE, stroke: BRASS, 'stroke-width': '0.7' }, g);
    }
    // entablature the columns carry (a bright top-lit lintel under the pediment)
    S.el('line', { x1: fpL + 6, y1: colY0 - 4, x2: fpR - 6, y2: colY0 - 4,
      stroke: BRIGHT, 'stroke-width': '1.2', opacity: '0.7' }, g);

    // ════ CLOCK TOWER rising on the central axis, above the pediment ═══════════
    // Kept compact so the clock face + cupola sit in a CLEAR band above the main
    // roof ridge — the seam gear-train sits at x800/y336+, so a tall tower would be
    // buried; a short, bold tower with a large bright dial reads around the gears.
    var twW = 48, twTop = pedApex - 60;
    S.el('rect', { x: tx - twW / 2, y: twTop, width: twW, height: pedApex - twTop + 6,
      fill: WALL, stroke: BRASS, 'stroke-width': '1.1' }, g);
    S.el('line', { x1: tx - twW / 2 + 1, y1: twTop + 1, x2: tx + twW / 2 - 1, y2: twTop + 1,
      stroke: BRIGHT, 'stroke-width': '1', opacity: '0.45' }, g);
    // tower cornice course
    brassCourse(S, g, tx - twW / 2 - 2, twTop - 2, twW + 4, 4);
    // the CLOCK FACE — brass ring + numeral ticks + emissive dial + hands.
    // Larger + brighter so it reads as the manor's signature even past the gears.
    var clkY = twTop + 22, clkR = 15;
    S.el('circle', { cx: tx, cy: clkY, r: clkR + 2, fill: TONE,
      stroke: BRASS, 'stroke-width': '1.6', filter: 'url(#glow-soft)' }, g);
    S.el('circle', { cx: tx, cy: clkY, r: clkR, fill: GLOW, opacity: '0.5' }, g);
    // top-lit glint on the ring's upper arc
    S.el('path', { d: 'M ' + (tx - clkR * 0.7) + ' ' + (clkY - clkR * 0.7) +
      ' A ' + clkR + ' ' + clkR + ' 0 0 1 ' + (tx + clkR * 0.7) + ' ' + (clkY - clkR * 0.7),
      fill: 'none', stroke: BRIGHT, 'stroke-width': '1.1', opacity: '0.7' }, g);
    // twelve hour ticks
    for (var hk = 0; hk < 12; hk++) {
      var ha = hk * Math.PI / 6;
      var hx0 = tx + Math.sin(ha) * (clkR - 2.4), hy0 = clkY - Math.cos(ha) * (clkR - 2.4);
      var hx1 = tx + Math.sin(ha) * (clkR - 0.6), hy1 = clkY - Math.cos(ha) * (clkR - 0.6);
      S.el('line', { x1: hx0, y1: hy0, x2: hx1, y2: hy1, stroke: BRASS, 'stroke-width': '0.9', opacity: '0.8' }, g);
    }
    // hands (a classic ten-past-ten so they read clearly)
    S.el('line', { x1: tx, y1: clkY, x2: tx - clkR * 0.42, y2: clkY - clkR * 0.42,
      stroke: TONE, 'stroke-width': '1.4' }, g);
    S.el('line', { x1: tx, y1: clkY, x2: tx + clkR * 0.5, y2: clkY - clkR * 0.55,
      stroke: TONE, 'stroke-width': '1.2' }, g);
    S.el('circle', { cx: tx, cy: clkY, r: 1.6, fill: BRASS }, g);
    // open CUPOLA lantern crowning the tower: a small arched aedicule + brass finial
    var cupBase = twTop, cupTop = twTop - 22, cupW = 26;
    S.el('rect', { x: tx - cupW / 2, y: cupTop, width: cupW, height: cupBase - cupTop,
      fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
    // two open arches showing the warm bell-chamber glow
    S.el('rect', { x: tx - cupW / 2 + 3, y: cupTop + 4, width: cupW - 6, height: cupBase - cupTop - 6,
      fill: GLOW, opacity: '0.42', filter: 'url(#glow-soft)' }, g);
    S.el('line', { x1: tx, y1: cupTop + 2, x2: tx, y2: cupBase - 2, stroke: BRASS, 'stroke-width': '1.1' }, g);
    // domed cap + brass finial spire (top-lit)
    S.el('path', { d: 'M ' + (tx - cupW / 2 - 2) + ' ' + cupTop + ' Q ' + tx + ' ' + (cupTop - 14) +
      ' ' + (tx + cupW / 2 + 2) + ' ' + cupTop + ' Z', fill: ROOF, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('path', { d: 'M ' + (tx - cupW * 0.34) + ' ' + (cupTop - 4) + ' Q ' + tx + ' ' + (cupTop - 12) +
      ' ' + (tx + cupW * 0.34) + ' ' + (cupTop - 4), fill: 'none', stroke: BRIGHT, 'stroke-width': '1', opacity: '0.6' }, g);
    S.el('line', { x1: tx, y1: cupTop - 12, x2: tx, y2: cupTop - 26, stroke: BRASS, 'stroke-width': '1.6' }, g);
    S.el('circle', { cx: tx, cy: cupTop - 27, r: 2.2, fill: TONE, stroke: BRASS, 'stroke-width': '1' }, g);
    S.el('circle', { cx: tx - 0.6, cy: cupTop - 27.6, r: 0.9, fill: BRIGHT, opacity: '0.9' }, g);

    // ════ THE GRAND DOOR at the foot of the central axis (the road's terminus) ══
    var dW = 22, dH = 40, dX = tx - dW / 2, dY = baseY - dH;
    // a fanlight-arched lit doorway
    S.el('path', { d: 'M ' + dX + ' ' + baseY + ' L ' + dX + ' ' + (dY + 8) +
      ' Q ' + tx + ' ' + (dY - 6) + ' ' + (dX + dW) + ' ' + (dY + 8) +
      ' L ' + (dX + dW) + ' ' + baseY + ' Z', fill: GLOW, opacity: '0.92' }, g);
    // soft door halo
    S.el('rect', { x: dX - 4, y: dY - 6, width: dW + 8, height: dH + 8, rx: 3,
      fill: GLOW, opacity: '0.16', filter: 'url(#glow-soft)' }, g);
    // door mullion + a brass-bright surround (top-lit lintel)
    S.el('line', { x1: tx, y1: dY + 2, x2: tx, y2: baseY, stroke: TONE, 'stroke-width': '1.4' }, g);
    S.el('path', { d: 'M ' + (dX - 2) + ' ' + (dY + 8) + ' Q ' + tx + ' ' + (dY - 8) +
      ' ' + (dX + dW + 2) + ' ' + (dY + 8), fill: 'none', stroke: BRIGHT, 'stroke-width': '1.1', opacity: '0.7' }, g);

    // ════ SASH WINDOW GRID on the main block (2 rows × 6, skipping the centre bay) ═
    var cols = 6, rows = 2, win_w = 14, win_h = 22;
    var col0 = left + 30;
    var colStep = (w - 60) / (cols - 1);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var wx = col0 + c * colStep - win_w / 2;
        // skip the two central columns where the frontispiece sits
        if (wx + win_w > fpL - 4 && wx < fpR + 4) continue;
        var wy = top + 22 + r * (h * 0.5);
        sashWindow(S, g, wx, wy, win_w, win_h);
      }
    }

    // ════ WING WINDOWS — two tiers, a regular pair per wing ═══════════════════
    var wingPad = 22, wingGap = 44, wingTierY = [wingTop + 26, wingTop + 26 + 46];
    var wingXs = [[lwX + wingPad, lwX + wingPad + wingGap],
                  [rwX + wingPad, rwX + wingPad + wingGap]];
    for (var ww = 0; ww < 2; ww++) {
      for (var ty = 0; ty < wingTierY.length; ty++) {
        for (var wc = 0; wc < 2; wc++) {
          // enlarged so the wing window rhythm reads from gate distance
          sashWindow(S, g, wingXs[ww][wc], wingTierY[ty], 14, 20);
        }
      }
    }
  };

  /* ── RIGHT: the greenhouse — a 3/4 CORNER view Victorian glasshouse ───────────
     Drawn FORWARD into the midground (base BELOW the manor's horizon at y470, so
     it reads as CLOSER) and at a 3/4 angle so we see TWO faces meeting at a near
     vertical corner: a FRONT GABLE face (left) + a SIDE WALL receding back-right,
     with the ridge roof angled in perspective and the gable end showing. Sits to
     the RIGHT of the right pier (cap edge ~x1214), clear of the frame, leaving the
     ground in front for the undercroft hatch. A dimensional glasshouse, not a
     flat decal. Palette: frame=greenhouse.frame, panes=greenhouse.glass; a faint
     warm window.lit interior glow at night. */
  /* ── TAKE 1 — "The Vinery." A small jewel-box Victorian glasshouse seen at 3/4:
     a low STONE STALL WALL grounds it, slim brass glazing bars catch the top light,
     translucent jewel panes glint with the sky, a brass RIDGE CRESTING runs the
     prism with little spike finials at both ends, and a turned BRASS CORNER POST
     marks the near 3/4 edge. At night a warm PLANT-GLOW fills the lower glass with
     a brighter lantern pip down low. Compact + quiet — clearly a utility building
     secondary to the manor — but finely wrought in the estate's black-and-brass
     idiom, lit from above.

     Geometry is BYTE-faithful to the loved 3/4 silhouette (same SC / ncx / baseY /
     frontW / sideRun / sideRise / gable rise) — only the RENDERING is elevated.
     Swappable: greenhouse.frame / greenhouse.glass / stone. Brass: brass.stroke /
     brass.bright. Emissive: window.lit (interior glow + a low pip). */
  B.drawGreenhouse = function (parent, S) {
    var g = S.group('greenhouse', parent);
    var FR     = 'var(--greenhouse-frame-ref, #222a30)';   // swappable frame
    var GL     = 'var(--greenhouse-glass-ref, #5a7280)';   // swappable glass
    var STONE  = 'var(--stone-ref, #6a7079)';              // swappable stall wall
    var BRASS  = 'var(--brass-stroke-ref, #9c8350)';
    var BRIGHT = 'var(--brass-bright-ref, #cdb375)';
    var GLOW   = 'var(--window-lit-ref, #ffcf73)';
    var TONE   = 'rgba(11,14,22,.85)';                     // estate brass DARK body
    var SOFT   = 'url(#glow-soft)';

    // ── box corners (a 3/4 projection: front face square-on, side wall sheared
    // up-and-right with perspective foreshortening). Near vertical corner is the
    // edge shared by both faces; the front face is to its LEFT, side wall RIGHT.
    // SHAPE preserved EXACTLY (same proportions × SC) so the loved 3/4 silhouette
    // is unchanged. Anchored low + forward-right so its gable apex sits clearly
    // BELOW the manor roofline → it reads as SECONDARY. ──
    var SC = 0.66;
    var ncx = 1372, baseY = 600;      // NEAR corner foot (the closest point)
    var wallH = 132 * SC;             // eave height at the near corner
    var frontW = 122 * SC;            // front-face apparent width (to the left)
    var sideRun = 188 * SC, sideRise = 40 * SC; // side wall recede (right) + perspective rise
    var sideH = wallH - 26 * SC;      // far eave is lower (smaller w/ distance)

    // front face foot-left / eave-left / eave-corner / foot-corner
    var fL = ncx - frontW, fEaveY = baseY - wallH;
    // side far foot / far eave
    var sFx = ncx + sideRun, sFy = baseY - sideRise;
    var sEaveY = sFy - sideH;

    // the low stall-wall course height (the masonry the glazing stands on)
    var stallH = 30 * SC;             // near-corner stall height
    var fStallY = baseY - stallH;     // front-face stall top
    var sStallNearY = baseY - stallH; // side stall top at near corner
    var sStallFarY  = sFy - stallH * 0.78; // side stall top at far corner (foreshortened)
    var gh = (fEaveY + baseY) / 2;    // front mid-rail height

    // helpers ----------------------------------------------------------------
    // a translucent jewel pane: a soft glass fill + (optional) a bright sky-glint
    // wedge in its upper-left so the surface reads as GLASS catching the sky.
    function pane(d, op, glint, gd) {
      S.el('path', { d: d, fill: GL, opacity: op }, g);
      if (glint) {
        S.el('path', { d: gd, fill: BRIGHT, opacity: '0.10' }, g);
      }
    }

    // ════ SIDE WALL (recedes back-right) — drawn first (behind the front face) ═══
    var sideD = 'M ' + ncx + ' ' + baseY +
      ' L ' + ncx + ' ' + fEaveY +
      ' L ' + sFx + ' ' + sEaveY +
      ' L ' + sFx + ' ' + sFy + ' Z';
    pane(sideD, '0.50', false);
    // a bright sky-glint sheet over the UPPER side glass (top-lit, recedes downward)
    S.el('path', { d: 'M ' + ncx + ' ' + fEaveY +
      ' L ' + sFx + ' ' + sEaveY +
      ' L ' + sFx + ' ' + (sEaveY + sideH * 0.42) +
      ' L ' + ncx + ' ' + (fEaveY + wallH * 0.42) + ' Z',
      fill: BRIGHT, opacity: '0.07' }, g);
    S.el('path', { d: sideD, fill: 'none', stroke: FR, 'stroke-width': '1.4' }, g);

    // ════ ROOF — back gable end first, then the two pitched planes ══════════════
    var ridgeFrontX = (fL + ncx) / 2;          // ridge apex above the front face
    var ridgeApexY = fEaveY - 52 * SC;         // gable rise scaled with the rest
    var ridgeBackX = ridgeFrontX + sideRun, ridgeBackY = ridgeApexY - sideRise;
    // back gable end (a faint glass triangle so the ridge reads as a closed prism)
    pane('M ' + sFx + ' ' + sEaveY + ' L ' + ridgeBackX + ' ' + ridgeBackY +
      ' L ' + sFx + ' ' + sFy + ' Z', '0.42', false);
    // RIDGE ROOF PLANE (recedes back-right in perspective) — the UP-facing slope
    // catches the most sky-light, so it is the brightest pane.
    var roofD = 'M ' + ridgeFrontX + ' ' + ridgeApexY +
      ' L ' + ridgeBackX + ' ' + ridgeBackY +
      ' L ' + sFx + ' ' + sEaveY +
      ' L ' + ncx + ' ' + fEaveY + ' Z';
    pane(roofD, '0.46', false);
    // top-lit roof glaze sheet (the sky reflection sliding down the slope)
    S.el('path', { d: 'M ' + ridgeFrontX + ' ' + ridgeApexY +
      ' L ' + ridgeBackX + ' ' + ridgeBackY +
      ' L ' + (ridgeBackX + (sFx - ridgeBackX) * 0.5) + ' ' + (ridgeBackY + (sEaveY - ridgeBackY) * 0.5) +
      ' L ' + (ridgeFrontX + (ncx - ridgeFrontX) * 0.5) + ' ' + (ridgeApexY + (fEaveY - ridgeApexY) * 0.5) + ' Z',
      fill: BRIGHT, opacity: '0.10' }, g);
    S.el('path', { d: roofD, fill: 'none', stroke: FR, 'stroke-width': '1.2' }, g);

    // ════ FRONT GABLE FACE ══════════════════════════════════════════════════════
    var frontD = 'M ' + fL + ' ' + baseY +
      ' L ' + fL + ' ' + fEaveY +
      ' L ' + ncx + ' ' + fEaveY +
      ' L ' + ncx + ' ' + baseY + ' Z';
    pane(frontD, '0.66', false);
    // a bright sky-glint band across the UPPER front glass (top-lit)
    S.el('path', { d: 'M ' + fL + ' ' + fEaveY + ' L ' + ncx + ' ' + fEaveY +
      ' L ' + ncx + ' ' + (fEaveY + wallH * 0.30) + ' L ' + fL + ' ' + (fEaveY + wallH * 0.30) + ' Z',
      fill: BRIGHT, opacity: '0.08' }, g);
    S.el('path', { d: frontD, fill: 'none', stroke: FR, 'stroke-width': '1.5' }, g);

    // ════ FRONT GABLE TRIANGLE (the pitched glass end above the eave) ═══════════
    var gableD = 'M ' + fL + ' ' + fEaveY +
      ' L ' + ridgeFrontX + ' ' + ridgeApexY +
      ' L ' + ncx + ' ' + fEaveY + ' Z';
    pane(gableD, '0.58', false);
    // a sky-glint on the up-left half of the gable
    S.el('path', { d: 'M ' + fL + ' ' + fEaveY + ' L ' + ridgeFrontX + ' ' + ridgeApexY +
      ' L ' + ridgeFrontX + ' ' + fEaveY + ' Z', fill: BRIGHT, opacity: '0.09' }, g);
    S.el('path', { d: gableD, fill: 'none', stroke: FR, 'stroke-width': '1.5' }, g);
    // GRAFT (take 2, rendered CRISP): a gable SUNBURST MUNTIN SPIDER fanning from the
    // apex — proper brass-stroke bars radiating down into the tympanum, each with a
    // bright top glint up its up-facing side so the fan-light reads as forged brass,
    // not the faint scratchy thin lines take 2 shipped. Anchored at the apex springing.
    var spX = ridgeFrontX, spY = ridgeApexY + 1.5;          // fan hub just below the apex
    var spR = (fEaveY - ridgeApexY) * 0.92;                 // spoke reach toward the eave
    var spokes = [-0.62, -0.31, 0, 0.31, 0.62];             // five even rays
    for (var sp = 0; sp < spokes.length; sp++) {
      var sa = spokes[sp];
      var ex = spX + Math.sin(sa) * spR;
      var ey = spY + Math.cos(sa) * spR;
      // crisp brass spoke
      S.el('line', { x1: spX, y1: spY, x2: ex, y2: ey, stroke: BRASS, 'stroke-width': '1', opacity: '0.85' }, g);
      // a thin bright top-lit glint up the spoke's up-facing side
      S.el('line', { x1: spX, y1: spY - 0.7, x2: ex, y2: ey - 0.7, stroke: BRIGHT, 'stroke-width': '0.5', opacity: '0.5' }, g);
    }
    // a small brass hub knop where the spider's rays converge (top-lit)
    S.el('circle', { cx: spX, cy: spY, r: 1.5, fill: TONE, stroke: BRASS, 'stroke-width': '0.8' }, g);
    S.el('circle', { cx: spX - 0.5, cy: spY - 0.5, r: 0.7, fill: BRIGHT, opacity: '0.9' }, g);

    // ════ GLAZING BARS — slim brass muntins, the up-facing edge brass-bright ════
    // front face verticals (dark muntin + a thin bright left-edge = lit from above)
    var fbars = 4;
    for (var i = 1; i < fbars; i++) {
      var bx = fL + i * (frontW / fbars);
      S.el('line', { x1: bx, y1: fEaveY, x2: bx, y2: fStallY, stroke: FR, 'stroke-width': '1.2' }, g);
      S.el('line', { x1: bx - 0.7, y1: fEaveY, x2: bx - 0.7, y2: fStallY,
        stroke: BRIGHT, 'stroke-width': '0.6', opacity: '0.5' }, g);
    }
    // front mid transom rail (top-lit)
    S.el('line', { x1: fL, y1: gh, x2: ncx, y2: gh, stroke: FR, 'stroke-width': '1.3' }, g);
    S.el('line', { x1: fL, y1: gh - 0.8, x2: ncx, y2: gh - 0.8, stroke: BRIGHT, 'stroke-width': '0.7', opacity: '0.45' }, g);
    // side wall verticals (converge toward the far corner = perspective)
    var sbars = 5;
    for (var j = 1; j < sbars; j++) {
      var t = j / sbars;
      var topx = ncx + t * (sFx - ncx), topy = fEaveY + t * (sEaveY - fEaveY);
      var sty  = (sStallNearY) + t * (sStallFarY - sStallNearY);
      S.el('line', { x1: topx, y1: topy, x2: topx, y2: sty, stroke: FR, 'stroke-width': '1' }, g);
      S.el('line', { x1: topx - 0.6, y1: topy, x2: topx - 0.6, y2: sty,
        stroke: BRIGHT, 'stroke-width': '0.5', opacity: '0.4' }, g);
    }
    // roof glazing bars along the ridge (front→back), top-lit
    var rbars = 4;
    for (var k = 1; k < rbars; k++) {
      var rt = k / rbars;
      var ex = ncx + rt * (sFx - ncx), ey = fEaveY + rt * (sEaveY - fEaveY);
      var rxk = ridgeFrontX + rt * (ridgeBackX - ridgeFrontX), ryk = ridgeApexY + rt * (ridgeBackY - ridgeApexY);
      S.el('line', { x1: ex, y1: ey, x2: rxk, y2: ryk, stroke: FR, 'stroke-width': '0.9' }, g);
      S.el('line', { x1: ex, y1: ey - 0.7, x2: rxk, y2: ryk - 0.7,
        stroke: BRIGHT, 'stroke-width': '0.5', opacity: '0.45' }, g);
    }

    // ════ LOW STONE STALL WALL — the masonry the glazing stands on (grounds it) ═
    // front-face stall (a low dressed-stone course with a top-lit cap)
    S.el('rect', { x: fL, y: fStallY, width: frontW, height: baseY - fStallY,
      fill: STONE, stroke: FR, 'stroke-width': '1.2' }, g);
    S.el('line', { x1: fL + 1, y1: fStallY + 0.9, x2: ncx - 1, y2: fStallY + 0.9,
      stroke: BRIGHT, 'stroke-width': '1', opacity: '0.5' }, g);
    // a couple of faint vertical stone joints
    for (var sj = 1; sj < 3; sj++) {
      var sjx = fL + sj * (frontW / 3);
      S.el('line', { x1: sjx, y1: fStallY + 2, x2: sjx, y2: baseY - 1,
        stroke: FR, 'stroke-width': '0.6', opacity: '0.5' }, g);
    }
    // side-face stall (a receding parallelogram course), slightly darker (turned away)
    var sideStallD = 'M ' + ncx + ' ' + sStallNearY +
      ' L ' + sFx + ' ' + sStallFarY +
      ' L ' + sFx + ' ' + sFy +
      ' L ' + ncx + ' ' + baseY + ' Z';
    S.el('path', { d: sideStallD, fill: STONE, stroke: FR, 'stroke-width': '1.1' }, g);
    S.el('path', { d: sideStallD, fill: 'rgba(8,10,15,.18)' }, g);
    S.el('line', { x1: ncx, y1: sStallNearY + 0.9, x2: sFx, y2: sStallFarY + 0.9,
      stroke: BRIGHT, 'stroke-width': '0.8', opacity: '0.4' }, g);

    // ════ EAVES — a thin top-lit brass gutter course along both eave lines ══════
    S.el('line', { x1: fL, y1: fEaveY, x2: ncx, y2: fEaveY, stroke: BRASS, 'stroke-width': '1.4' }, g);
    S.el('line', { x1: fL, y1: fEaveY - 0.9, x2: ncx, y2: fEaveY - 0.9, stroke: BRIGHT, 'stroke-width': '0.8', opacity: '0.6' }, g);
    S.el('line', { x1: ncx, y1: fEaveY, x2: sFx, y2: sEaveY, stroke: BRASS, 'stroke-width': '1.2' }, g);
    S.el('line', { x1: ncx, y1: fEaveY - 0.8, x2: sFx, y2: sEaveY - 0.8, stroke: BRIGHT, 'stroke-width': '0.7', opacity: '0.5' }, g);

    // ════ BRASS RIDGE CRESTING (the prism) + spike finials at both ends ════════
    // the ridge body (dark + brass stroke + warm halo), then a bright top glint
    S.el('line', { x1: ridgeFrontX, y1: ridgeApexY, x2: ridgeBackX, y2: ridgeBackY,
      stroke: TONE, 'stroke-width': '3', 'stroke-linecap': 'round', filter: SOFT }, g);
    S.el('line', { x1: ridgeFrontX, y1: ridgeApexY, x2: ridgeBackX, y2: ridgeBackY,
      stroke: BRASS, 'stroke-width': '1.6', 'stroke-linecap': 'round' }, g);
    S.el('line', { x1: ridgeFrontX, y1: ridgeApexY - 1, x2: ridgeBackX, y2: ridgeBackY - 1,
      stroke: BRIGHT, 'stroke-width': '0.9', opacity: '0.8' }, g);
    // small cresting spikes along the ridge (the toothed Victorian crest)
    var rdx = ridgeBackX - ridgeFrontX, rdy = ridgeBackY - ridgeApexY;
    for (var cr = 1; cr <= 4; cr++) {
      var cf = cr / 5;
      var cxr = ridgeFrontX + cf * rdx, cyr = ridgeApexY + cf * rdy;
      S.el('line', { x1: cxr, y1: cyr, x2: cxr, y2: cyr - 4 * SC,
        stroke: BRASS, 'stroke-width': '0.9', opacity: '0.8' }, g);
      S.el('circle', { cx: cxr, cy: cyr - 4 * SC, r: 0.9, fill: BRIGHT, opacity: '0.85' }, g);

        ' ' + (ox + sgn * 8) + ' ' + (bandMid + 2) +
        ' C ' + (ox - sgn * 14) + ' ' + (bandMid - 3) + ' ' + (ox - sgn * 4) + ' ' + (bandMid + 14) +

    S.el('circle', { cx: lc, cy: bandMid, r: mR, fill: 'none', stroke: BRASS, 'stroke-width': '1.8', filter: SOFT }, g);

    S.el('line', { x1: isx + 1.6, y1: top + 1, x2: isx + 1.6, y2: BOT, stroke: BRIGHT, 'stroke-width': '1', opacity: '0.45' }, g);

  /* ── the arched / scrolled CREST: flattened-gothic arch + sunburst tympanum +

  function drawCrest(S, parent) {

        ' C ' + (sxp + sgn * 44) + ' ' + (peak + 26) + ' ' + (sxp + sgn * 50) + ' ' + (peak + 64) +
        ' ' + (sxp + sgn * 18) + ' ' + (peak + 70) +
        ' C ' + (sxp - sgn * 6) + ' ' + (peak + 74) + ' ' + (sxp + sgn * 6) + ' ' + (peak + 52) +
        ' ' + (sxp + sgn * 2) + ' ' + (peak + 54),

    S.el('circle', { cx: CX, cy: peak - 36, r: 7.5, fill: BODY, stroke: BRASS, 'stroke-width': '1.8' }, g);
    S.el('circle', { cx: CX, cy: peak - 36, r: 7.5, fill: 'none', stroke: BRASS, 'stroke-width': '1', opacity: '0.6', filter: SOFT }, g);
    S.el('circle', { cx: CX - 2.4, cy: peak - 38.4, r: 2, fill: BRIGHT, opacity: '0.9' }, g);
    S.el('path', { d: 'M ' + (CX - 4.5) + ' ' + (peak - 42) + ' L ' + CX + ' ' + (peak - 60) +
      ' L ' + (CX + 4.5) + ' ' + (peak - 42) + ' Z', fill: BODY, stroke: BRASS, 'stroke-width': '1.4' }, g);
    S.el('line', { x1: CX - 0.6, y1: peak - 43, x2: CX - 0.6, y2: peak - 58, stroke: BRIGHT, 'stroke-width': '1', opacity: '0.85' }, g);

  }

  function drawPier(S, parent, cx) {

    // NB: CSS custom props with a dot in the name need escaping in url()/var()
    // references inside attributes; we instead set stop-color via JS below to be safe.
    grad.childNodes[0].setAttribute('stop-color', 'var(--sky-top-ref)');
    grad.childNodes[1].setAttribute('stop-color', 'var(--sky-horizon-ref)');

    // soft warm glow for emissive halos
    var f = el('filter', { id: 'glow-soft', x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
    el('feGaussianBlur', { 'in': 'SourceGraphic', stdDeviation: '7', result: 'b' }, f);
    var m = el('feMerge', {}, f);
    el('feMergeNode', { 'in': 'b' }, m);
    el('feMergeNode', { 'in': 'SourceGraphic' }, m);

    // a tighter glow for stars
    var f2 = el('filter', { id: 'glow-star', x: '-200%', y: '-200%', width: '500%', height: '500%' }, defs);
    el('feGaussianBlur', { 'in': 'SourceGraphic', stdDeviation: '3', result: 'b2' }, f2);
    var m2 = el('feMerge', {}, f2);
    el('feMergeNode', { 'in': 'b2' }, m2);
    el('feMergeNode', { 'in': 'SourceGraphic' }, m2);

    // a WIDE, blur-ONLY feather for the moon's lit-limb glow. Unlike glow-soft this
    // does NOT merge the source back in — we want a pure blurred copy of the LIT
    // crescent/gibbous shape so the halo follows the illuminated edge and fades to
    // nothing as it wraps toward the dark limb (no glow on the dark side).
    var f3 = el('filter', { id: 'glow-moon', x: '-90%', y: '-90%', width: '280%', height: '280%' }, defs);
    el('feGaussianBlur', { 'in': 'SourceGraphic', stdDeviation: '16' }, f3);
  }

  /* ── a faint full-bleed starfield (always present; reads at night) ───────────── */
  function drawStarfield(parent) {
    var g = group('starfield', parent);
    // deterministic scatter so it doesn't twinkle-jump on re-renders
    var seed = 1337;
    function rng() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < 90; i++) {
      var x = rng() * VB_W, y = rng() * (VB_H * 0.55);
      var r = 0.5 + rng() * 1.1;
      el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2),
        fill: 'var(--asterism-star-ref, #f0d489)', opacity: (0.25 + rng() * 0.4).toFixed(2) }, g);
    }
    S.refs.starfield = g;
  }

  /* ── LAYER 2 refresh: moon (night) OR sun (day/dusk) + the asterism ─────────── */
  S.refreshSkyObjects = function () {
    var g = S.refs.skyObjects;
    if (!g) return;
    while (g.firstChild) g.removeChild(g.firstChild);
    var band = Gate.timeofday ? Gate.timeofday.band() : 'night';

    // the disc sits DIRECTLY ABOVE the centered manor (manor at x800) → upper sky,
    // clear of the gate crest (which peaks at ~y146)
    var discX = 800, discY = 124, discR = 64;
    if (band === 'night') drawMoon(g, discX, discY, discR);
    else drawSun(g, discX, discY, discR, band);

    // asterism in OPEN sky to the upper-LEFT of the disc — placed in the top-left
    // (x<360, above the observatory) so it never clips behind the gate bars and its
    // label is fully legible.
    drawAsterism(g, 70, 24, 180);
  };

  /* ── PHASE-PARAMETRIC moon ──────────────────────────────────────────────────
     drawMoon(g, cx, cy, r) reads three params off S:
       S._moonFrac : illuminated fraction 0..1 (0 new · 0.5 quarter · 1 full)
       S._moonSide : +1 = lit on the RIGHT (waxing) · -1 = lit on the LEFT (waning)
     and renders, back→front:
       (Fix 2) a near-DARK full disc (structural night tone, sampled from the
               resolved observatory.body) so the unlit sphere nearly merges into
               the night sky — only a faint hint of form, never mid-grey.
       (Fix 3) a soft GLOW that hugs only the LIT limb: a blurred copy of the
               illuminated crescent/gibbous PATH itself, so the halo follows the
               lit edge and fades to nothing toward the dark side (no dark-limb
               glow). Near-full → the lit shape is almost the whole disc, so the
               glow approaches a full ring; thin crescent → a bright arc only.
       the bright emissive LIT region (var(--moon.disc)).
       a faint top-edge highlight along the lit limb ("lit from above").

     TODO Phase D: feed sky-core.mjs moonPhase()/terminator() output
       {illuminatedFraction, litSide, curvature} into S.setMoonPhase() instead of
       the ?moon dev pin, so the drawn phase matches the user's real date. */
  function drawMoon(g, cx, cy, r) {
    var moonG = group('moon', g);
    var frac = clamp01(S._moonFrac == null ? 0.6 : S._moonFrac);
    var side = (S._moonSide === -1) ? -1 : 1;       // default waxing (lit right)

    // (Fix 2) the dark sphere — structural-dark, NOT mid-grey. Prefer the resolved
    // observatory.body tone (the night structural dark); fall back to a deep tint.
    var darkFill = resolvedRole('observatory.body') ||
      'var(--observatory-body-ref, #181c26)';
    el('circle', { cx: cx, cy: cy, r: r, fill: darkFill }, moonG);
    // a whisper of rim form on the dark side so it isn't a flat hole
    el('circle', { cx: cx, cy: cy, r: r, fill: 'none',
      stroke: 'var(--brass-stroke-ref, #4a4436)', 'stroke-width': '0.8', opacity: '0.22' }, moonG);

    // the LIT-region path (crescent/gibbous bounded by limb + terminator).
    var litD = litRegionPath(cx, cy, r, frac, side);

    if (litD) {
      // (Fix 3 / restore) glow = blurred copies of the LIT shape (pure feather, no
      // source merge) → naturally hugs the illuminated limb, zero glow on the dark
      // side. TWO layers: a WIDE soft halo + a TIGHTER brighter bloom so the glow
      // is clearly VISIBLE on the lit limb (crescent → bright arc, near-full → ring)
      // without spilling onto the dark side.
      el('path', { d: litD, fill: 'var(--moon-disc-ref, #f2ead2)',
        opacity: '0.85', filter: 'url(#glow-moon)' }, moonG);   // wide soft halo
      el('path', { d: litD, fill: 'var(--moon-disc-ref, #f2ead2)',
        opacity: '0.6', filter: 'url(#glow-star)' }, moonG);    // tight inner bloom
      // the bright emissive lit region
      el('path', { d: litD, fill: 'var(--moon-disc-ref, #f2ead2)' }, moonG);
      // faint top-edge highlight along the lit limb ("lit from above")
      var hx = cx + side * r * 0.18;
      el('path', { d: 'M ' + (hx - side * r * 0.5) + ' ' + (cy - r * 0.6) +
        ' A ' + r + ' ' + r + ' 0 0 ' + (side > 0 ? 1 : 0) + ' ' + (hx + side * r * 0.4) + ' ' + (cy - r * 0.72),
        fill: 'none', stroke: 'var(--brass-bright-ref, #f0d489)', 'stroke-width': '1.1', opacity: '0.3' }, moonG);
    }
  }

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  /* resolvedRole(role): read a resolved CSS var (dash alias) so the moon's dark
     side tracks the live palette/brightness. The vars are written on #stage; the
     svg is a descendant, so walk UP from it to the first node carrying the alias.
     Returns null if not available yet (caller falls back to the default tint). */
  function resolvedRole(role) {
    try {
      var node = S.refs && S.refs.svg;
      while (node) {
        var v = node.style && node.style.getPropertyValue(dashName(role));
        if (v) return v;
        node = node.parentNode;
      }
    } catch (e) {}
    return null;
  }

  /* litRegionPath(cx,cy,r,frac,side): the illuminated portion as a closed path.
     Built from the OUTER limb semicircle (on the lit side) + the TERMINATOR arc.
       frac=0   → null (new moon, nothing lit)
       frac=1   → full disc circle
       0<frac<1 → crescent (frac<0.5) or gibbous (frac>0.5)
     The terminator is a half-ellipse with semi-minor axis tx = r·|1−2·frac|
     (the projected day/night boundary); its bulge direction flips at frac=0.5. */
  function litRegionPath(cx, cy, r, frac, side) {
    if (frac <= 0.001) return null;
    if (frac >= 0.999) {
      // full disc
      return 'M ' + (cx - r) + ' ' + cy +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx + r) + ' ' + cy +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx - r) + ' ' + cy + ' Z';
    }
    var topY = cy - r, botY = cy + r;
    var tx = r * Math.abs(1 - 2 * frac);   // terminator semi-minor axis
    // OUTER limb: the visible semicircle on the LIT side, from top → bottom.
    // For side=+1 (lit right) we sweep the RIGHT half (clockwise, sweep=1);
    // for side=-1 (lit left) we sweep the LEFT half (sweep=0).
    var limbSweep = side > 0 ? 1 : 0;
    // TERMINATOR: half-ellipse from bottom → top closing the inner edge.
    // gibbous (frac>0.5): terminator bows AWAY from lit side → same sweep dir as limb.
    // crescent (frac<0.5): terminator bows INTO lit side → opposite sweep.
    var gibbous = frac > 0.5;
    var termSweep;
    if (side > 0) termSweep = gibbous ? 1 : 0;   // lit right
    else          termSweep = gibbous ? 0 : 1;   // lit left
    return 'M ' + cx + ' ' + topY +
      ' A ' + r + ' ' + r + ' 0 0 ' + limbSweep + ' ' + cx + ' ' + botY +
      ' A ' + tx + ' ' + r + ' 0 0 ' + termSweep + ' ' + cx + ' ' + topY + ' Z';
  }

  function drawSun(g, cx, cy, r, band) {
    var sunG = group('sun', g);
    // dusk → lower toward horizon; day → higher
    var y = band === 'dusk' ? cy + 70 : cy;
    el('circle', { cx: cx, cy: y, r: r * 2.0, fill: 'var(--sun-disc-ref, #ffe9a8)',
      opacity: band === 'dusk' ? '0.22' : '0.14', filter: 'url(#glow-soft)' }, sunG);
    el('circle', { cx: cx, cy: y, r: r, fill: 'var(--sun-disc-ref, #ffe9a8)' }, sunG);
  }

  function drawAsterism(g, ox, oy, size) {
    if (!Gate.asterism) return;
    var fig = Gate.asterism.current();
    if (!fig) return; // Phase D: nothing unlocked → draw nothing
    var astG = group('asterism', g);
    var sc = size / 100;
    function px(p) { return ox + p.x * sc; }
    function py(p) { return oy + p.y * sc; }
    // lines first
    for (var i = 0; i < fig.lines.length; i++) {
      var a = fig.stars[fig.lines[i][0]], b = fig.stars[fig.lines[i][1]];
      el('line', { x1: px(a).toFixed(1), y1: py(a).toFixed(1), x2: px(b).toFixed(1), y2: py(b).toFixed(1),
        stroke: 'var(--asterism-line-ref, #c9a24a)', 'stroke-width': '1.6', opacity: '0.62' }, astG);
    }
    // stars
    for (var j = 0; j < fig.stars.length; j++) {
      var s = fig.stars[j];
      el('circle', { cx: px(s).toFixed(1), cy: py(s).toFixed(1), r: (s.mag === 1 ? 4.2 : 3.0).toFixed(1),
        fill: 'var(--asterism-star-ref, #f0d489)', filter: 'url(#glow-star)' }, astG);
    }
    // engraved italic label below
    var lx = ox + size * 0.5, ly = oy + size * 0.92;
    var t = el('text', { x: lx.toFixed(1), y: ly.toFixed(1), 'text-anchor': 'middle',
      'font-family': 'Georgia, serif', 'font-style': 'italic', 'font-size': '20',
      fill: 'var(--asterism-line-ref, #c9a24a)', opacity: '0.85' }, astG);
    t.textContent = fig.name;
    if (fig.myth) {
      var t2 = el('text', { x: lx.toFixed(1), y: (ly + 20).toFixed(1), 'text-anchor': 'middle',
        'font-family': 'ui-monospace, monospace', 'font-size': '11', 'letter-spacing': '0.18em',
        fill: 'var(--asterism-line-ref, #c9a24a)', opacity: '0.5' }, astG);
      t2.textContent = fig.myth.toUpperCase();
    }
  }

  /* ── LAYER 5 — grounds: midground grass + road to the manor + a NEAR foreground
     APRON the gate stands on (the single biggest depth cue: foreground apron →
     midground grounds → distant buildings → sky). ───────────────────────────── */
  /* ── grounds-local deterministic PRNG (stable across re-renders, no twinkle-jump),
     plus a 1-decimal rounder; both private to drawGrounds/drawLamp. ─────────────── */
  function groundsRng(seed) {
    var s = (seed * 2246822519) & 0x7fffffff || 1;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }
  function g1f(n) { return (Math.round(n * 10) / 10); }

  /* ── TAKE 3 — "the kept gravel court." A quiet, lush estate stage: a deep opaque
     grass plane that lightens toward an atmospheric horizon, with a low pelt of
     tonal mottling + sparse tufts only where the eye expects them (the horizon line
     and the road verges); a believable raked-GRAVEL drive to the manor with a lit
     crown, kerb stones and faint scatter; two brass lamp-posts; and a NEAR cobbled
     APRON of HINTED individual flagstones receding to a top-lit back lip — the big
     depth cue. All swappable color via roles, so it goes lush by day / dark by night;
     only the lamp globes glow. Lit from above throughout. RESTRAINT: the stage stays
     quiet so the hero gate + the manor keep the eye. ────────────────────────────── */
  function drawGrounds(parent) {
    var GRASS = 'var(--grass-ref, #3c4a50)';
    var HILL  = 'var(--hill-ref, #2c3742)';
    var ROAD  = 'var(--road-ref, #5a5f6a)';
    var STONE = 'var(--stone-ref, #6a7079)';
    var BRI   = 'var(--brass-bright-ref, #f0d489)';
    var groundTop = GROUND_TOP;

    // ════ THE GRASS PLANE — the HARD occlusion boundary (SPEC §1.3). A full-width,
    //   FULL-OPACITY fill x0..1600 / y470..900 hiding the manor/observatory bases. ════
    el('rect', { x: 0, y: groundTop, width: VB_W, height: VB_H - groundTop, fill: GRASS }, parent);

    // atmospheric LIGHTENING toward the horizon — the hill-toned grade band, stacked
    // in three softening passes so the meadow recedes into haze instead of a hard line.
    var grade = group('grass-grade', parent);
    el('rect', { x: 0, y: groundTop, width: VB_W, height: 78, fill: HILL, opacity: '0.42' }, grade);
    el('rect', { x: 0, y: groundTop, width: VB_W, height: 44, fill: HILL, opacity: '0.30' }, grade);
    el('rect', { x: 0, y: groundTop, width: VB_W, height: 20, fill: 'var(--mist-ref, #7c8aa0)', opacity: '0.22' }, grade);

    // TONAL MOTTLING — a sparse pelt of broad soft patches across the meadow giving
    // the plane subtle life without busy-ness. Light patches up top (catching the
    // sky), darker hollows lower/forward. Deterministic so it never jitters.
    var mott = group('grass-mottle', parent);
    var mr = groundsRng(91);
    for (var mi = 0; mi < 26; mi++) {
      var my = groundTop + 30 + mr() * 300;
      var depth = (my - groundTop) / 330;            // 0 at horizon → 1 forward
      var mx = mr() * VB_W;
      var mw = 70 + mr() * 150 + depth * 90;          // wider toward the viewer
      var mh = 14 + mr() * 22 + depth * 16;
      var light = mr() > 0.5;
      el('ellipse', { cx: g1f(mx), cy: g1f(my), rx: g1f(mw), ry: g1f(mh),
        fill: light ? BRI : '#000',
        opacity: (light ? (0.05 + depth * 0.04) : (0.07 + depth * 0.07)).toFixed(3) }, mott);
    }

    // ════ THE DRIVE — a raked-gravel ribbon from the gate seam (front, wide) back to
    //   the CENTERED manor door (narrow). Kept the exact taper + destination. ════
    var roadG = group('drive', parent);
    var Lf = 706, Rf = 894, Lb = 768, Rb = 832;      // front (y900) / back (y478) rails
    var yF = 900, yB = 478;
    function dLx(t) { return Lf + (Lb - Lf) * t; }   // t: 0 front → 1 back
    function dRx(t) { return Rf + (Rb - Rf) * t; }
    function dY(t)  { return yF + (yB - yF) * t; }
    var roadD = 'M ' + Lf + ' ' + yF + ' L ' + Rf + ' ' + yF +
                ' L ' + Rb + ' ' + yB + ' L ' + Lb + ' ' + yB + ' Z';
    // a soft cast shadow hugging the drive's edges so it beds into the grass
    el('path', { d: 'M ' + (Lf - 10) + ' ' + yF + ' L ' + (Rf + 10) + ' ' + yF +
      ' L ' + (Rb + 5) + ' ' + yB + ' L ' + (Lb - 5) + ' ' + yB + ' Z',
      fill: '#000', opacity: '0.22', filter: 'url(#glow-soft)' }, roadG);
    // the gravel bed
    el('path', { d: roadD, fill: ROAD }, roadG);
    // a darker centre-worn hollow either side of the crown (cart-track wear)
    el('path', { d: 'M ' + (Lf + 36) + ' ' + yF + ' L ' + (Lf + 70) + ' ' + yF +
      ' L ' + dLx(1) + ' ' + yB + ' L ' + (Lb + 14) + ' ' + yB + ' Z',
      fill: '#000', opacity: '0.10' }, roadG);
    el('path', { d: 'M ' + (Rf - 70) + ' ' + yF + ' L ' + (Rf - 36) + ' ' + yF +
      ' L ' + (Rb - 14) + ' ' + yB + ' L ' + dRx(1) + ' ' + yB + ' Z',
      fill: '#000', opacity: '0.10' }, roadG);
    // GRAVEL SCATTER — tiny stones speckled down the drive (perspective: bigger/closer
    // toward the front), a couple lit on top. Sparse so the drive reads raked, not busy.
    var gr = groundsRng(401);
    for (var gi = 0; gi < 44; gi++) {
      var t = gr() * gr();                            // bias toward the front (closer)
      var ty = dY(t);
      var spanL = dLx(t) + 6, spanR = dRx(t) - 6;
      var gx = spanL + gr() * (spanR - spanL);
      var grad = 1 - t;                                // 1 front → 0 back
      var rr = 0.7 + grad * 1.8;
      var lit = gr() > 0.62;
      el('circle', { cx: g1f(gx), cy: g1f(ty), r: g1f(rr),
        fill: lit ? BRI : '#000', opacity: (lit ? 0.22 : 0.18).toFixed(2) }, roadG);
    }
    // KERB STONES down each verge — a top-lit brass-bright edge that beds the drive,
    // brightest at the near front, fading back (lit from above).
    el('path', { d: 'M ' + Lf + ' ' + yF + ' L ' + Lb + ' ' + yB, fill: 'none',
      stroke: BRI, 'stroke-width': '1.6', opacity: '0.22' }, roadG);
    el('path', { d: 'M ' + Rf + ' ' + yF + ' L ' + Rb + ' ' + yB, fill: 'none',
      stroke: BRI, 'stroke-width': '1.6', opacity: '0.22' }, roadG);
    // the lit crown down the centre (raised, catching the sky)
    el('path', { d: 'M 800 ' + yF + ' L 800 ' + yB, fill: 'none',
      stroke: BRI, 'stroke-width': '2', opacity: '0.16' }, roadG);
    // a few faint cross-flags (paving seams) stepping back up the drive (perspective)
    var flagTs = [0.12, 0.30, 0.52, 0.76];
    for (var fi = 0; fi < flagTs.length; fi++) {
      var ft = flagTs[fi];
      el('line', { x1: g1f(dLx(ft)), y1: g1f(dY(ft)), x2: g1f(dRx(ft)), y2: g1f(dY(ft)),
        stroke: '#000', 'stroke-width': '1', opacity: (0.16 * (1 - ft) + 0.05).toFixed(2) }, roadG);
    }

    // ════ TUFTS — sparse grass blades only along the horizon line + the drive verges,
    //   so texture sits exactly where the eye reads the meadow's edges. ════
    drawTufts(parent);

    // two brass lamp-posts flanking the road just inside the grounds (emissive).
    // Nudged a touch OUTBOARD (x600 / x1000) so each warm globe sits over dark manor
    // wall, not over a lit window pane, and given more HEIGHT (h78, foot lowered to
    // y538) so they read as proper estate lamp-posts rather than bollards.
    drawLamp(parent, 600, 538, 78);
    drawLamp(parent, 1000, 538, 78);

    // ════ FOREGROUND APRON — the near cobbled paving the gate + piers stand ON.
    //   A shallow trapezoid (back edge y812 → y900) of HINTED individual flagstones in
    //   a fanning perspective grid, with a top-lit back lip. The biggest depth cue. ══
    var g = group('foreground-apron', parent);
    var apronTopY = 812;
    var aBackL = -40, aBackR = VB_W + 40;            // back edge (narrower visually due to fan)
    var aFrontL = -120, aFrontR = VB_W + 120;        // front edge (fans wider toward viewer)
    function aLx(t) { return aBackL + (aFrontL - aBackL) * t; }
    function aRx(t) { return aBackR + (aFrontR - aBackR) * t; }
    function aY(t)  { return apronTopY + (VB_H - apronTopY) * t; }
    // the paving slab (stone)
    el('path', { d: 'M ' + aBackL + ' ' + apronTopY + ' L ' + aBackR + ' ' + apronTopY +
      ' L ' + aFrontR + ' ' + VB_H + ' L ' + aFrontL + ' ' + VB_H + ' Z',
      fill: STONE }, g);
    // a subtle overall down-shade so the apron darkens away from the lit back lip
    el('path', { d: 'M ' + g1f(aLx(0.45)) + ' ' + g1f(aY(0.45)) + ' L ' + g1f(aRx(0.45)) + ' ' + g1f(aY(0.45)) +
      ' L ' + aFrontR + ' ' + VB_H + ' L ' + aFrontL + ' ' + VB_H + ' Z',
      fill: '#000', opacity: '0.10' }, g);

    // ════ PER-STONE FLAGSTONES (grafted from take 2) — the apron reads as INDIVIDUAL
    //   laid stones, not a uniform grid: a fanning grid of perspective joints + stagger-
    //   bonded course rows, each stone given its own slightly lighter/darker tonal face,
    //   a recessed left+bottom joint shadow, and a thin top-lit lip on its up-facing
    //   (back) edge. Deterministic so it never jitters. The single biggest depth cue. ══
    var ar = groundsRng(777);
    var cols = 18;
    var rowTs = [0.0, 0.20, 0.44, 0.72, 1.0];
    for (var ri = 0; ri < rowTs.length - 1; ri++) {
      var t0 = rowTs[ri], t1 = rowTs[ri + 1];
      var y0 = aY(t0), y1 = aY(t1);
      var stagger = (ri % 2) * 0.5;                  // alternate-row half-stone offset (bond)
      for (var jx = -1; jx < cols; jx++) {
        var cL = jx + stagger, cR = jx + 1 + stagger;
        var fcL = Math.max(0, cL / cols), fcR = Math.min(1, cR / cols);
        if (fcR <= 0 || fcL >= 1) continue;
        // stone quad corners (perspective: top edge from back row, bottom from front)
        var x0L = aLx(t0) + (aRx(t0) - aLx(t0)) * fcL;
        var x0R = aLx(t0) + (aRx(t0) - aLx(t0)) * fcR;
        var x1L = aLx(t1) + (aRx(t1) - aLx(t1)) * fcL;
        var x1R = aLx(t1) + (aRx(t1) - aLx(t1)) * fcR;
        var tint = ar();                              // gentle per-stone tonal variation
        // a hair more per-stone contrast than take 2 so the variation survives thumbnail
        var faceOp = (tint > 0.74) ? 0.09 : (tint < 0.26 ? -1 : 0);
        if (faceOp > 0) {                             // a slightly LIGHTER stone face
          el('path', { d: 'M ' + g1f(x0L) + ' ' + g1f(y0) + ' L ' + g1f(x0R) + ' ' + g1f(y0) +
            ' L ' + g1f(x1R) + ' ' + g1f(y1) + ' L ' + g1f(x1L) + ' ' + g1f(y1) + ' Z',
            fill: BRI, opacity: faceOp.toFixed(2) }, g);
        } else if (faceOp < 0) {                      // a slightly DARKER stone face
          el('path', { d: 'M ' + g1f(x0L) + ' ' + g1f(y0) + ' L ' + g1f(x0R) + ' ' + g1f(y0) +
            ' L ' + g1f(x1R) + ' ' + g1f(y1) + ' L ' + g1f(x1L) + ' ' + g1f(y1) + ' Z',
            fill: '#000', opacity: '0.10' }, g);
        }
        // recessed joint shadow on the stone's LEFT edge (lit from above → left in shade)
        el('path', { d: 'M ' + g1f(x0L) + ' ' + g1f(y0) + ' L ' + g1f(x1L) + ' ' + g1f(y1),
          stroke: '#000', 'stroke-width': '1.1', opacity: '0.20', fill: 'none' }, g);
        // a thin top-lit lip on the stone's UP-facing (back) edge
        el('path', { d: 'M ' + g1f(x0L + 1) + ' ' + g1f(y0 + 0.8) + ' L ' + g1f(x0R - 1) + ' ' + g1f(y0 + 0.8),
          stroke: BRI, 'stroke-width': '0.8', opacity: '0.09', fill: 'none' }, g);
      }
      // the course row joint (horizontal seam) at the bottom of this row
      el('path', { d: 'M ' + g1f(aLx(t1)) + ' ' + g1f(y1) + ' L ' + g1f(aRx(t1)) + ' ' + g1f(y1),
        stroke: '#000', 'stroke-width': '1.2', opacity: (0.22 - t1 * 0.08).toFixed(2), fill: 'none' }, g);
    }
    // a darker mortar shadow just under the back edge (sits the apron in front)
    el('rect', { x: aBackL, y: apronTopY, width: aBackR - aBackL, height: 8, fill: 'rgba(0,0,0,.30)' }, g);
    // top-lit front lip of the back edge — the apron's up-facing leading coping
    el('line', { x1: aBackL, y1: apronTopY + 1, x2: aBackR, y2: apronTopY + 1,
      stroke: BRI, 'stroke-width': '1.4', opacity: '0.26' }, g);
  }

  /* sparse grass TUFTS — small fan-of-blades clusters along the horizon line and the
     drive verges, drawn over the opaque plane so they texture only the read edges. */
  function drawTufts(parent) {
    var g = group('grass-tufts', parent);
    var FOL = 'var(--tree-foliage-ref, #2c3a40)';
    var GRASS = 'var(--grass-ref, #3c4a50)';
    var BRI = 'var(--brass-bright-ref, #f0d489)';
    var tr = groundsRng(53);
    function tuft(cx, by, sc, lit) {
      var blades = 3 + Math.floor(tr() * 3);
      for (var b = 0; b < blades; b++) {
        var spread = (b - (blades - 1) / 2) * 3.0 * sc;
        var lean = (tr() - 0.5) * 6 * sc;
        var hgt = (8 + tr() * 7) * sc;
        el('path', { d: 'M ' + g1f(cx + spread) + ' ' + g1f(by) +
          ' Q ' + g1f(cx + spread + lean * 0.5) + ' ' + g1f(by - hgt * 0.6) + ' ' +
          g1f(cx + spread + lean) + ' ' + g1f(by - hgt),
          fill: 'none', stroke: (lit && b === blades - 1) ? BRI : FOL,
          'stroke-width': g1f(1.0 * sc), 'stroke-linecap': 'round',
          opacity: (lit && b === blades - 1) ? '0.30' : '0.55' }, g);
      }
    }
    // a thin scatter ALONG THE HORIZON (small + faint — distance)
    for (var hi = 0; hi < 22; hi++) {
      var hx = tr() * VB_W;
      tuft(hx, 478 + tr() * 14, 0.5 + tr() * 0.3, tr() > 0.7);
    }
    // clusters hugging the DRIVE VERGES (a touch larger, catching the lamp/sky)
    var verge = [ [700, 880], [900, 880], [742, 660], [858, 660], [760, 540], [840, 540] ];
    for (var vi = 0; vi < verge.length; vi++) {
      var depth = 1 - (verge[vi][1] - 470) / 430;
      tuft(verge[vi][0], verge[vi][1], 0.8 + (1 - depth) * 0.6, true);
    }
    // a faint blanket of low GRASS-toned tufts to soften the bare plane near mid-field
    for (var li = 0; li < 14; li++) {
      var lx = tr() * VB_W, ly = 520 + tr() * 240;
      var blades = 2 + Math.floor(tr() * 2), sc = 0.6 + tr() * 0.4;
      for (var bb = 0; bb < blades; bb++) {
        var sp = (bb - (blades - 1) / 2) * 2.6 * sc;
        var hh = (6 + tr() * 5) * sc;
        el('path', { d: 'M ' + g1f(lx + sp) + ' ' + g1f(ly) +
          ' L ' + g1f(lx + sp + (tr() - 0.5) * 4) + ' ' + g1f(ly - hh),
          fill: 'none', stroke: GRASS, 'stroke-width': g1f(1.0 * sc),
          'stroke-linecap': 'round', opacity: '0.40' }, g);
      }
    }
  }

  function drawLamp(parent, x, baseY, h) {
    var g = group(null, parent);
    var BODY = 'rgba(11,14,22,.85)';
    var BRASS = 'var(--brass-stroke-ref, #c9a24a)';
    var BRI = 'var(--brass-bright-ref, #f0d489)';
    var FLAME = 'var(--lamp-flame-ref, #ffd27a)';
    var fL = function (n) { return (Math.round(n * 10) / 10); };
    var topY = baseY - h;                 // where the post meets the lantern collar

    // a soft cast shadow at the foot so the post stands on the grass (light from above)
    el('ellipse', { cx: x + 3, cy: baseY + 3, rx: 11, ry: 4, fill: '#000', opacity: '0.26' }, g);

    // ── stepped stone-dark BASE plinth (grafted from take 2: a crisper two-step foot) ──
    el('rect', { x: x - 7, y: baseY - 5, width: 14, height: 6, rx: 1, fill: BODY,
      stroke: BRASS, 'stroke-width': '1' }, g);
    el('rect', { x: x - 5, y: baseY - 9, width: 10, height: 5, rx: 1, fill: BODY,
      stroke: BRASS, 'stroke-width': '1' }, g);
    el('line', { x1: x - 6, y1: baseY - 4.4, x2: x + 6, y2: baseY - 4.4,
      stroke: BRI, 'stroke-width': '0.9', opacity: '0.4' }, g);

    // ── tapered POST (grafted from take 2: wider at the foot, narrower at the lantern —
    //    a more legible brass column than a straight shaft) ──
    el('path', { d: 'M ' + fL(x - 3.4) + ' ' + fL(baseY - 9) +
      ' L ' + fL(x + 3.4) + ' ' + fL(baseY - 9) +
      ' L ' + fL(x + 2.2) + ' ' + fL(topY + 3) +
      ' L ' + fL(x - 2.2) + ' ' + fL(topY + 3) + ' Z',
      fill: BODY, stroke: BRASS, 'stroke-width': '1.2' }, g);
    // a brass-bright sheen up the post's left (up-light) edge
    el('line', { x1: fL(x - 2.0), y1: fL(topY + 6), x2: fL(x - 3.0), y2: fL(baseY - 11),
      stroke: BRI, 'stroke-width': '0.9', opacity: '0.30' }, g);
    // a mid collar where the post meets the lantern
    el('rect', { x: x - 5, y: topY + 1, width: 10, height: 4, rx: 1, fill: BODY,
      stroke: BRASS, 'stroke-width': '1' }, g);

    // ── LANTERN HOUSING (grafted from take 2) — a glazed cage: dark body + brass
    //    stroke, a vertical glazing bar, and a flared brass-bright cap up top
    //    (lit from above). Cleaner proportions than take 3's straight cage. ──
    var lh = 17, lw = 17;
    var lx = x - lw / 2, ly = topY - lh + 2;
    // glass body (dark cage)
    el('path', { d: 'M ' + fL(lx + 1.5) + ' ' + fL(ly + lh) +
      ' L ' + fL(lx - 0.5) + ' ' + fL(ly + 2) +
      ' L ' + fL(lx + lw + 0.5) + ' ' + fL(ly + 2) +
      ' L ' + fL(lx + lw - 1.5) + ' ' + fL(ly + lh) + ' Z',
      fill: BODY, stroke: BRASS, 'stroke-width': '1.2' }, g);
    // glazing bar (vertical muntin)
    el('line', { x1: fL(x), y1: fL(ly + 2), x2: fL(x), y2: fL(ly + lh),
      stroke: BRASS, 'stroke-width': '0.8', opacity: '0.7' }, g);
    // flared CAP (a stepped brass roof) — top-lit
    el('path', { d: 'M ' + fL(lx - 2) + ' ' + fL(ly + 2) +
      ' L ' + fL(x) + ' ' + fL(ly - 5) +
      ' L ' + fL(lx + lw + 2) + ' ' + fL(ly + 2) + ' Z',
      fill: BODY, stroke: BRASS, 'stroke-width': '1.2' }, g);
    el('path', { d: 'M ' + fL(lx - 2) + ' ' + fL(ly + 2) + ' L ' + fL(x) + ' ' + fL(ly - 5),
      stroke: BRI, 'stroke-width': '1.1', opacity: '0.4', fill: 'none' }, g);
    // finial atop the cap
    el('circle', { cx: x, cy: ly - 7, r: 1.8, fill: BODY, stroke: BRASS, 'stroke-width': '1' }, g);
    el('circle', { cx: x - 0.6, cy: ly - 7.6, r: 0.7, fill: BRI, opacity: '0.85' }, g);

    // ── EMISSIVE GLOBE (kept from take 3 — its strongest asset: a 3-layer warm point:
    //    wide soft halo + a tight bright bloom + a hot core + a glint). Sits inside the
    //    lantern cage (globe nudged DOWN to the cage centre per the judges). The hot
    //    core is trimmed ~12% (3.4 → 3.0) so the road lamp stays unambiguously SECONDARY
    //    to the pier lamps at full-moon brightness. Palette-immune so it blazes at night
    //    + recedes (but stays lit) by day. ──
    var globeY = ly + lh * 0.52;
    el('circle', { cx: x, cy: globeY, r: 18, fill: FLAME, opacity: '0.22', filter: 'url(#glow-soft)' }, g);
    el('circle', { cx: x, cy: globeY, r: 7, fill: FLAME, opacity: '0.5', filter: 'url(#glow-star)' }, g);
    el('circle', { cx: x, cy: globeY, r: 3.0, fill: FLAME }, g);
    el('circle', { cx: x - 1, cy: globeY - 1, r: 1.1, fill: '#fff', opacity: '0.7' }, g);
  }

  /* ── WIND + foliage sway (SPEC §5.9) ─────────────────────────────────────────
     A single scene-wide WIND drives a gentle rightward sway of the foliage crowns
     (trees + bushes). Wind ALWAYS blows right (+x); the level scales amplitude/speed
     only — a draw fn never reasons about direction. The hero gate, buildings, and
     water stay rigid: they register no crown, so they never move. Driven by the boot's
     perpetual rAF (so a weather toggle intensifies the sway LIVE, which SMIL can't do);
     reduced-motion = no sway (the boot simply never ticks it → crowns stay upright). */
  var WIND_AMP = { none: 0, light: 1.5, strong: 3.4 };   // peak sway, degrees
  var WIND_DUR = { none: 4, light: 3.6, strong: 2.1 };   // base sway period, seconds
  S._foliage = [];                  // [{el,px,py,phase,per,heavy}] — swayable crowns
  S._windLevel = 'light';
  S._windAmp = WIND_AMP.light;      // current (eased) amplitude
  S._windAmpTarget = WIND_AMP.light;
  S._windDur = WIND_DUR.light;

  S.setWind = function (level) {
    if (WIND_AMP[level] == null) level = 'light';
    S._windLevel = level;
    S._windAmpTarget = WIND_AMP[level];
    S._windDur = WIND_DUR[level];
  };
  // the SCENE chooses wind from weather: storm = strong; clear/cloudy = a light
  // ambient breeze (a dead-still default reads lifeless). 'none' is reserved for
  // reduced-motion / an explicit calm.
  S.windFromWeather = function (wx) { S.setWind(wx === 'storm' ? 'strong' : 'light'); };

  /* swayTick(nowMs): rotate each foliage crown about its pivot by a gentle GUSTING
     angle, biased rightward (leaning into the wind). The live amplitude eases toward
     the wind target so a weather change ramps in rather than snapping. Each crown has
     its own period + phase so they never sway in unison; heavier (bigger) crowns sway
     a touch less. Cheap: one transform write per crown (~7 total) per frame. */
  S.swayTick = function (nowMs) {
    var fol = S._foliage;
    if (!fol || !fol.length) return;
    S._windAmp += (S._windAmpTarget - S._windAmp) * 0.04;   // ~0.4s ease at 60fps
    var amp = S._windAmp;
    var t = (nowMs || 0) / 1000;
    var twoPi = Math.PI * 2;
    for (var i = 0; i < fol.length; i++) {
      var f = fol[i];
      var omega = twoPi / (S._windDur * f.per);
      var ang = (amp * 0.62 + amp * 0.5 * Math.sin(t * omega + f.phase)) * f.heavy;
      f.el.setAttribute('transform', 'rotate(' + (Math.round(ang * 1000) / 1000) + ' ' + f.px + ' ' + f.py + ')');
    }
  };

  /* ── trees/bushes — rounded estate grounds framing the scene ────────────────────
     ART (foundry, take 1): each tree is a TAPERED trunk (root-flare + a hinted
     limb) carrying a layered foliage MASS built from many overlapping crown lobes —
     a dark shadow underbelly (down/forward), a mid body in tree.foliage, and small
     top-lit highlight clumps rimmed with brass.bright so the crown catches light
     from above. NOT a flat lollipop. Bushes are low 3-lobe shrubs with the same
     shadow-belly / lit-crown logic. All color is via palette roles, so the grounds
     recede to dark silhouettes at night and read lush green by day. The crown lobes
     are emitted as a single child <g> per tree (`tree-crown`) about which a future
     gentle sway would pivot — but NO animation is added here (sway is Phase D). */
  function drawTrees(parent) {
    var g = group('trees', parent);
    S._foliage.length = 0;            // rebuild the swayable-crown list from scratch
    // LEFT cluster — frames the observatory rise + flanks the cairn slot. Kept OUT
    // of the room-rep slot CORE (x152..308 below y492) so a tall rep isn't crowded:
    // the big tree sits at x96 (crown to ~x150), the others at x250/x348 keep their
    // bulk above/around the slot, not fattened into its core.
    drawTree(g, 96, 556, 1.35);
    drawTree(g, 250, 600, 0.85);
    drawTree(g, 348, 572, 1.05);
    drawBush(g, 300, 700, 1.0);
    // RIGHT cluster — FRAMES the forward greenhouse (footprint ~x1291..1496) rather
    // than sit under its translucent glass: one to its LEFT (between pier + house),
    // one tucked to the far-RIGHT frame edge. (Trees are midground, BEHIND the
    // greenhouse, so any overlap would otherwise show foliage THROUGH the glass.)
    drawTree(g, 1232, 588, 1.2);
    drawTree(g, 1548, 624, 0.78);
    drawBush(g, 1500, 724, 1.1);
    drawBush(g, 1240, 706, 0.85);
    S.refs.trees = g;
  }

  /* a tiny deterministic PRNG seeded per-instance so every tree gets its own crown
     scatter but the scene is STABLE across re-renders (no twinkle-jump). */
  function foliageRng(seed) {
    var s = (seed * 2654435761) & 0x7fffffff || 1;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }
  function f1f(n) { return (Math.round(n * 10) / 10); }

  function drawTree(parent, x, baseY, sc) {
    var g = group(null, parent);
    var FOL  = 'var(--tree-foliage-ref, #2c3a40)';
    var TRK  = 'var(--tree-trunk-ref, #2a2620)';
    var BRI  = 'var(--brass-bright-ref, #cdb375)';
    var rnd  = foliageRng(Math.round(x * 7 + baseY));

    // crown geometry: a soft rounded mass centered above the trunk. The two trees
    // flanking the cairn slot (x≈250 & x≈348) get a TALLER/NARROWER, more
    // topiary/estate-manicured silhouette so the four don't read as one cloned
    // species — same unified-lobe-mass construction, just a stretched proportion.
    var manicured = (x > 200 && x < 380);
    var crownCY = baseY - (manicured ? 88 : 78) * sc;     // mass center (taller for cairn-side)
    var crownRX = (manicured ? 33 : 40) * sc, crownRY = (manicured ? 54 : 48) * sc;

    // ── TRUNK: a tapered column (wider at the root, narrower at the crown) with a
    //    root flare and two forked limbs reaching into the canopy. Drawn first so the
    //    foliage mass sits over its top. ──
    var trunkTopY = crownCY + crownRY * 0.30;   // trunk vanishes into the canopy
    var rootW = 7.2 * sc, topW = 4.0 * sc;
    el('path', { d:
      'M ' + f1f(x - rootW) + ' ' + f1f(baseY) +
      ' C ' + f1f(x - rootW * 0.55) + ' ' + f1f(baseY - 14 * sc) + ' ' + f1f(x - topW) + ' ' + f1f(trunkTopY + 18 * sc) + ' ' + f1f(x - topW) + ' ' + f1f(trunkTopY) +
      ' L ' + f1f(x + topW) + ' ' + f1f(trunkTopY) +
      ' C ' + f1f(x + topW) + ' ' + f1f(trunkTopY + 18 * sc) + ' ' + f1f(x + rootW * 0.55) + ' ' + f1f(baseY - 14 * sc) + ' ' + f1f(x + rootW) + ' ' + f1f(baseY) +
      ' Z', fill: TRK }, g);
    // root flares splaying onto the ground
    el('path', { d: 'M ' + f1f(x - rootW) + ' ' + f1f(baseY) +
      ' Q ' + f1f(x - rootW * 2.1) + ' ' + f1f(baseY - 1) + ' ' + f1f(x - rootW * 2.6) + ' ' + f1f(baseY + 2 * sc) +
      ' L ' + f1f(x - rootW * 0.7) + ' ' + f1f(baseY + 2 * sc) + ' Z', fill: TRK }, g);
    el('path', { d: 'M ' + f1f(x + rootW) + ' ' + f1f(baseY) +
      ' Q ' + f1f(x + rootW * 2.1) + ' ' + f1f(baseY - 1) + ' ' + f1f(x + rootW * 2.6) + ' ' + f1f(baseY + 2 * sc) +
      ' L ' + f1f(x + rootW * 0.7) + ' ' + f1f(baseY + 2 * sc) + ' Z', fill: TRK }, g);
    // two forked limbs climbing into the canopy (a touch more structural credibility
    // than a single hinted branch — and it individuates the trunks). The left limb
    // reaches longer/higher; the right is shorter, so the fork reads asymmetric.
    el('path', { d: 'M ' + f1f(x - topW * 0.4) + ' ' + f1f(trunkTopY + 6 * sc) +
      ' Q ' + f1f(x - 14 * sc) + ' ' + f1f(crownCY + 6 * sc) + ' ' + f1f(x - 20 * sc) + ' ' + f1f(crownCY - 6 * sc),
      fill: 'none', stroke: TRK, 'stroke-width': f1f(3.0 * sc), 'stroke-linecap': 'round' }, g);
    el('path', { d: 'M ' + f1f(x + topW * 0.4) + ' ' + f1f(trunkTopY + 7 * sc) +
      ' Q ' + f1f(x + 12 * sc) + ' ' + f1f(crownCY + 10 * sc) + ' ' + f1f(x + 17 * sc) + ' ' + f1f(crownCY - 1 * sc),
      fill: 'none', stroke: TRK, 'stroke-width': f1f(2.6 * sc), 'stroke-linecap': 'round' }, g);
    // faint top-lit sheen up the trunk's left edge (lit from above/left)
    el('line', { x1: f1f(x - topW * 0.7), y1: f1f(trunkTopY + 4 * sc), x2: f1f(x - rootW * 0.7), y2: f1f(baseY - 6 * sc),
      stroke: BRI, 'stroke-width': '1', opacity: '0.14' }, g);

    // ── FOLIAGE MASS — a single crown <g> (the natural sway pivot) built in layers:
