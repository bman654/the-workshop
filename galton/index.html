    </div>

    </div>

      <label>Seed</label>

    </div>

    <div class="caption" id="caption"></div>

    </div>

  </div>
  <button id="reopen" title="Show controls">controls</button>

  <div id="stats"></div>
  <div id="hud"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   galton.js — the Galton board's DOM-free probability CORE.

   A Galton board (bean machine, quincunx) drops balls through a triangular
   array of pegs. At each of `rows` rows a ball bounces RIGHT with probability
   `(1 - p)` and LEFT with probability `p`, independently. A ball's final BIN is
   exactly its count of right-bounces, an integer in [0, rows]. Because each ball
   is a sum of `rows` independent Bernoulli trials, the bin is — by definition —
   a **Binomial(rows, 1-p)** random variable, and as balls accumulate the
   histogram converges to that binomial PMF (the bell curve, for symmetric p).

   The workshop's rule is that a piece must PROVE its claim. So this file is not
   "a simulation that looks bell-shaped." It carries:

     • binomialPMF(rows, p) — the EXACT closed-form P(bin = k) for every k, built
       from log-factorials so it is numerically stable for large `rows`. The PMF
       is the GROUND TRUTH the simulation is measured against.
     • normalPDF / normalApprox — the continuous N(μ=rows·q, σ²=rows·p·q)
       approximation (q = 1-p) the page can overlay.
     • simulate(...) — a SEEDED mulberry32 simulation (no Math.random, no
       wall-clock) of N balls; deterministic given (seed, rows, p, N).
     • chiSquare(...) + chiSquareCDF / pValue — a goodness-of-fit statistic of an
       empirical histogram against the binomial PMF, with its p-value, so we can
       state honestly: a large seeded run does NOT reject the binomial at a given
       significance. (Statistical convergence — not an exact identity.)

   The provable claims (see runSelfTest, mirrored by the Node test):
     1. The ideal IS exactly binomial — the PMF sums to 1, has mean rows·q and
        variance rows·p·q, and matches hand-checked small cases (Pascal's row).
     2. The simulation converges to it — a ≥100k seeded run's χ² to the binomial
        does NOT reject at α (statistic < critical value), at p=0.5 AND biased p.
     3. Every path is valid — each ball makes exactly `rows` ±steps, lands in one
        bin ∈ [0,rows], bin == right-bounces; histogram conserves every ball.
     4. Determinism — same (seed,rows,p,N) ⇒ identical paths + identical histogram.
     5. Empirical mean/variance track rows·q and rows·p·q within an N-tightening
        tolerance.

   Vanilla, ES5-ish, zero-dependency, DOM-free. Dual-use: attaches a `Galton`
   global in the browser; exports the same object under Node for the self-test.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var Galton = {};

  /* Supported row range for the UI; the math holds for any rows ≥ 0. */
  Galton.ROWS_MIN = 4;
  Galton.ROWS_MAX = 16;

  Galton.clampRows = function (r) {
    r = Math.round(+r);
    if (!isFinite(r)) r = 8;
    if (r < Galton.ROWS_MIN) r = Galton.ROWS_MIN;
    if (r > Galton.ROWS_MAX) r = Galton.ROWS_MAX;
    return r;
  };
  Galton.clampP = function (p) {
    p = +p;
    if (!isFinite(p)) p = 0.5;
    // clamp into (0,1) with a tiny margin so log() and variance stay finite
    if (p < 1e-6) p = 1e-6;
    if (p > 1 - 1e-6) p = 1 - 1e-6;
    return p;
  };

  /* ── Seeded RNG (mulberry32) ──────────────────────────────────────────────
     xmur3 hashes a string to a 32-bit seed; mulberry32 turns that into a
     deterministic [0,1) stream. Same seed string ⇒ identical stream. No
     Math.random, no Date — fully reproducible. */
  function xmur3(str) {
    str = String(str);
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* makeRng(seed): a fresh deterministic [0,1) generator from a seed string. */
  function makeRng(seed) {
    return mulberry32(xmur3(seed)());
  }
  Galton.makeRng = makeRng;

  /* ── Log-factorial / log-binomial (numerically stable) ────────────────────
     We build the PMF in log-space so binomial coefficients for rows up to the
     hundreds never overflow. logFactorial uses a small memoized table for exact
     small values and the Lanczos log-gamma for larger ones. */
  var LF_CACHE = [0, 0]; // logFactorial(0)=logFactorial(1)=0
  // Lanczos approximation for ln(Γ(z)), z > 0 (g=7, n=9 coefficients).
  var LANCZOS_G = 7;
  var LANCZOS_C = [
    0.99999999999980993,
    676.5203681218851,
    -1259.1392167224028,
    771.32342877765313,
    -176.61502916214059,
    12.507343278686905,
    -0.13857109526572012,
    9.9843695780195716e-6,
    1.5056327351493116e-7
  ];
  function logGamma(z) {
    // reflection for z<0.5 (not hit for our z≥1 uses, but keep it correct)
    if (z < 0.5) {
      return Math.log(Math.PI / Math.sin(Math.PI * z)) - logGamma(1 - z);
    }
    z -= 1;
    var x = LANCZOS_C[0];
    for (var i = 1; i < LANCZOS_G + 2; i++) x += LANCZOS_C[i] / (z + i);
    var t = z + LANCZOS_G + 0.5;
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
  }
  /* logFactorial(n) = ln(n!) — exact small table, log-gamma beyond. */
  function logFactorial(n) {
    n = Math.round(n);
    if (n < 0) return NaN;
    if (n < LF_CACHE.length) return LF_CACHE[n];
    if (n <= 256) {
      for (var i = LF_CACHE.length; i <= n; i++) {
        LF_CACHE[i] = LF_CACHE[i - 1] + Math.log(i);
      }
      return LF_CACHE[n];
    }
    return logGamma(n + 1);
  }
  Galton.logFactorial = logFactorial;

  /* logChoose(n, k) = ln(C(n,k)). */
  function logChoose(n, k) {
    if (k < 0 || k > n) return -Infinity;
    return logFactorial(n) - logFactorial(k) - logFactorial(n - k);
  }
  Galton.logChoose = logChoose;

  /* choose(n, k) = C(n,k) (rounded; exact for the small `rows` the board uses). */
  Galton.choose = function (n, k) {
    if (k < 0 || k > n) return 0;
    return Math.round(Math.exp(logChoose(n, k)));
  };

  /* ── The EXACT binomial PMF ────────────────────────────────────────────────
     binomialPMF(rows, p) → [P(bin=0), …, P(bin=rows)].

     CONVENTION: a ball goes LEFT with probability `p`, RIGHT with `1-p`, and the
     bin is the number of RIGHT bounces. So bin ~ Binomial(rows, q) with q = 1-p:
         P(bin = k) = C(rows,k) · q^k · p^(rows-k).
     Built in log-space for numerical stability. Returns an array of length
     rows+1 that sums to 1 to ~1e-15. */
  Galton.binomialPMF = function (rows, p) {
    rows = Math.round(rows);
    p = Galton.clampP(p);
    var q = 1 - p;            // right-probability
    var lq = Math.log(q), lp = Math.log(p);
    var out = new Array(rows + 1);
    for (var k = 0; k <= rows; k++) {
      out[k] = Math.exp(logChoose(rows, k) + k * lq + (rows - k) * lp);
    }
    return out;
  };

  /* Mean / variance of Binomial(rows, q), q = 1-p. */
  Galton.binomialMean = function (rows, p) { return rows * (1 - Galton.clampP(p)); };
  Galton.binomialVar = function (rows, p) {
    p = Galton.clampP(p);
    return rows * p * (1 - p);
  };

  /* ── Normal approximation ──────────────────────────────────────────────────
     N(μ = rows·q, σ² = rows·p·q). normalPDF(x, μ, σ) is the density; normalApprox
     samples it on the bin grid 0..rows (a continuous overlay, NOT a PMF — it need
     not sum to 1 on the discrete grid). */
  Galton.normalPDF = function (x, mu, sigma) {
    var z = (x - mu) / sigma;
    return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
  };
  Galton.normalApprox = function (rows, p) {
    var mu = Galton.binomialMean(rows, p);
    var sigma = Math.sqrt(Galton.binomialVar(rows, p));
    var out = new Array(rows + 1);
    for (var k = 0; k <= rows; k++) out[k] = Galton.normalPDF(k, mu, sigma);
    return out;
  };

  /* ═══════════════════════════════════════════════════════════════════════════
     SONIFICATION — "hear the bell curve" (the Sound Garden crossing).
     ────────────────────────────────────────────────────────────────────────────
     Every landing ball is voiced as a soft pluck whose PITCH is its BIN, and
     each peg bounce ticks a quiet pitched click. Because a bin is Binomial, more
     balls land in the centre bins → more notes sound there → the audible texture
     THICKENS at the centre exactly where the curve peaks. Probability, heard.

     This block is the pure, DOM-free, Web-Audio-FREE mapping math, so the
     self-test re-audits it headless (the page only renders it through Web Audio).
     The load-bearing audible claim, made falsifiable:

       • binToPitch is a STRICTLY MONOTONIC bijection bin↔Hz. So the histogram of
         the PITCHES you hear is the SAME histogram as the bins — i.e. the
         note-density across pitch IS the binomial PMF (the bell curve), to
         machine precision. That is "the χ² fit you can hear settle."
       • every pitch stays inside a comfortable audible band (never shrill /
         sub-audible), across the full rows range.
       • the summed-voice master gain keeps the peak under a hard ceiling → the
         cascade can never clip however many balls fall at once.
     ──────────────────────────────────────────────────────────────────────────── */

  /* A two-octave MINOR-PENTATONIC scale (semitone offsets from a root), the
     consonant five-note set — adjacent bins are always a pleasant step apart, so
     a pour reads as music, not noise. Repeated each octave so any bin range maps
     cleanly across as many octaves as it needs. */
  Galton.PENTATONIC = [0, 3, 5, 7, 10];   // minor pentatonic semitone classes
  Galton.AUDIO_ROOT_HZ = 220;             // A3 — bin 0 sits here (the low anchor)
  var SEMITONE = Math.pow(2, 1 / 12);

  /* The scale degree (0,1,2,…) for the k-th step up the pentatonic, walking
     octaves: degree d → octave ⌊d/5⌋, class PENTATONIC[d mod 5]. */
  function pentatonicSemitone(d) {
    d = Math.round(d);
    var oct = Math.floor(d / 5), cls = ((d % 5) + 5) % 5;
    return oct * 12 + Galton.PENTATONIC[cls];
  }
  Galton.pentatonicSemitone = pentatonicSemitone;

  /* binToPitch(bin, rows[, opts]) → Hz. Bin k is the k-th rung up the pentatonic
     from the root, so pitch is a STRICTLY INCREASING function of bin (a bijection
     onto its image). Higher bin = higher note; the most-populated centre bins are
     the busy middle register. Deterministic, no DOM, no Web Audio. */
  Galton.binToPitch = function (bin, rows, opts) {
    opts = opts || {};
    var root = opts.rootHz || Galton.AUDIO_ROOT_HZ;
    bin = Math.round(bin);
    var semis = pentatonicSemitone(bin);
    return root * Math.pow(SEMITONE, semis);
  };

  /* pegClickHz(row, rows[, baseHz]) → Hz for the soft tick when a ball grazes a
     peg in row r (0=top). Deeper rows tick slightly higher → a descending-into-
     ascending shimmer as the ball falls. Bounded, deterministic. */
  Galton.pegClickHz = function (row, rows, baseHz) {
    baseHz = baseHz || 1200;
    rows = Math.max(1, Math.round(rows));
    var frac = Math.max(0, Math.min(1, row / rows));
    // a gentle ~1 octave rise top→bottom, kept well inside the audible band
    return baseHz * Math.pow(2, frac * 0.9);
  };

  /* voiceGainFor(activeVoices, perVoiceAmp, ceiling) → master gain that keeps the
     summed peak of `activeVoices` simultaneous plucks under `ceiling` (≤1) so the
     output can never clip when a burst of balls lands together. (Mirrors the
     Harmonograph's masterGainFor; the same headroom proof.) */
  Galton.voiceGainFor = function (activeVoices, perVoiceAmp, ceiling) {
    ceiling = ceiling == null ? 0.9 : ceiling;
    var peak = Math.max(1, activeVoices) * perVoiceAmp;
    return peak <= 1e-9 ? 1 : Math.min(1, ceiling / peak);
  };

  /* pitchProfile(rows, p) → [{ hz, prob }] — the EXPECTED note-density across the
     sounded pitches: each bin's pitch carries its binomial probability. Because
     binToPitch is a bijection, this profile's shape over pitch IS the binomial
     PMF — the bell curve you hear. Handy for the page's "pitch spectrum" readout
     and for the self-test. */
  Galton.pitchProfile = function (rows, p) {
    rows = Math.round(rows);
    var pmf = Galton.binomialPMF(rows, p);
    var out = new Array(rows + 1);
    for (var k = 0; k <= rows; k++) out[k] = { hz: Galton.binToPitch(k, rows), prob: pmf[k] };
    return out;
  };

  /* ── A single ball's path ──────────────────────────────────────────────────
     dropBall(rng, rows, p) → { bin, steps } where steps is an array of length
     `rows` of -1 (left) / +1 (right). bin = count of +1 steps = right-bounces.
     A draw u < p goes LEFT; otherwise RIGHT. */
  Galton.dropBall = function (rng, rows, p) {
    rows = Math.round(rows);
    p = Galton.clampP(p);
    var steps = new Array(rows);
    var bin = 0;
    for (var i = 0; i < rows; i++) {
      if (rng() < p) { steps[i] = -1; }   // left
      else { steps[i] = 1; bin++; }        // right → +1 bin
    }
    return { bin: bin, steps: steps };
  };

  /* ── A seeded run ──────────────────────────────────────────────────────────
     simulate(seed, rows, p, n[, opts]) → {
       hist: int[rows+1],   // counts per bin (sums to n)
       n, rows, p,
       mean, variance,      // empirical (from the histogram)
       paths?                // first opts.keepPaths ball step-arrays (debug/anim)
     }
     Deterministic in (seed, rows, p, n). The histogram is the load-bearing
     output the page grows; paths are kept only for the first few balls (for the
     in-page animation / determinism check) to keep memory bounded for big runs. */
  Galton.simulate = function (seed, rows, p, n, opts) {
    rows = Math.round(rows);
    p = Galton.clampP(p);
    n = Math.max(0, Math.round(n));
    opts = opts || {};
    var keep = opts.keepPaths || 0;
    var rng = makeRng(seed);
    var hist = new Array(rows + 1);
    for (var b = 0; b <= rows; b++) hist[b] = 0;
    var paths = keep ? [] : null;
    var sum = 0, sumSq = 0;
    for (var i = 0; i < n; i++) {
      var ball = Galton.dropBall(rng, rows, p);
      hist[ball.bin]++;
      sum += ball.bin;
      sumSq += ball.bin * ball.bin;
      if (keep && i < keep) paths.push(ball.steps);
    }
    var mean = n ? sum / n : 0;
    var variance = n ? (sumSq / n - mean * mean) : 0;
    var res = { hist: hist, n: n, rows: rows, p: p, mean: mean, variance: variance };
    if (paths) res.paths = paths;
    return res;
  };

  /* ── χ² goodness-of-fit ─────────────────────────────────────────────────────
     chiSquare(hist, pmf) → { stat, df, n } comparing observed counts to the
     binomial expectation. df = (#testable bins) − 1 (no fitted params; rows & p
     are given, not estimated). Bins whose theoretical probability is 0 are
     dropped from both sides (they contribute neither obs nor expectation) — the
     honest thing for an extreme biased p. */
  Galton.chiSquare = function (hist, pmf) {
    var n = 0, k;
    for (k = 0; k < hist.length; k++) n += hist[k];
    var stat = 0, df = 0;
    for (k = 0; k < pmf.length; k++) {
      var expected = pmf[k] * n;
      if (expected <= 0) continue;       // theoretical 0 → not a testable cell
      var obs = hist[k] || 0;
      var d = obs - expected;
      stat += (d * d) / expected;
      df++;
    }
    df = Math.max(1, df - 1);            // −1 for the fixed total
    return { stat: stat, df: df, n: n };
  };

  /* Regularized lower incomplete gamma P(a,x) = γ(a,x)/Γ(a), via series (x<a+1)
     or continued fraction (otherwise). Used for the χ² CDF. */
  function gammaP(a, x) {
    if (x < 0 || a <= 0) return NaN;
    if (x === 0) return 0;
    var gln = logGamma(a);
    if (x < a + 1) {
      var ap = a, sum = 1 / a, del = sum;
      for (var i = 0; i < 1000; i++) {
        ap += 1;
        del *= x / ap;
        sum += del;
        if (Math.abs(del) < Math.abs(sum) * 1e-15) break;
      }
      return sum * Math.exp(-x + a * Math.log(x) - gln);
    } else {
      // Lentz's continued fraction for upper incomplete Q(a,x); P = 1 − Q
      var FPMIN = 1e-300;
      var b = x + 1 - a, c = 1 / FPMIN, d = 1 / b, h = d;
      for (var j = 1; j < 1000; j++) {
        var an = -j * (j - a);
        b += 2;
        d = an * d + b; if (Math.abs(d) < FPMIN) d = FPMIN;
        c = b + an / c; if (Math.abs(c) < FPMIN) c = FPMIN;
        d = 1 / d;
        var delta = d * c;
        h *= delta;
        if (Math.abs(delta - 1) < 1e-15) break;
      }
      var Q = Math.exp(-x + a * Math.log(x) - gln) * h;
      return 1 - Q;
    }
  }
  Galton.gammaP = gammaP;

  /* χ² CDF with `df` degrees of freedom: P(X ≤ x) = gammaP(df/2, x/2). */
  Galton.chiSquareCDF = function (x, df) {
    if (x <= 0) return 0;
    return gammaP(df / 2, x / 2);
  };
  /* p-value for a χ² statistic = upper tail = 1 − CDF. A LARGE p-value means the
     observed histogram is CONSISTENT with the binomial (do NOT reject). */
  Galton.chiSquarePValue = function (stat, df) {
    return 1 - Galton.chiSquareCDF(stat, df);
  };

  /* Critical value: the x with CDF(x,df) = 1−α. Bisection on the monotone CDF. */
  Galton.chiSquareCritical = function (alpha, df) {
    var target = 1 - alpha;
    var lo = 0, hi = Math.max(40, df * 4 + 40);
    while (Galton.chiSquareCDF(hi, df) < target && hi < 1e6) hi *= 2;
    for (var i = 0; i < 200; i++) {
      var mid = 0.5 * (lo + hi);
      if (Galton.chiSquareCDF(mid, df) < target) lo = mid; else hi = mid;
    }
    return 0.5 * (lo + hi);
  };

  /* ── The shared self-test battery ──────────────────────────────────────────
     The EXACT battery the in-page green chip runs; the Node test wraps this and
     adds hardening. Returns { pass, n, total, results:[{name,pass,note}] }. */
  Galton.runSelfTest = function () {
    var results = [];
    var allPass = true;
    var EPS_SUM = 1e-12, EPS_MOM = 1e-9;

    /* Check #1 — the ideal IS exactly binomial: PMF sums to 1, mean = rows·q,
       variance = rows·p·q, and rows=4,p=.5 is Pascal's row 1,4,6,4,1 over 16. */
    (function () {
      var ok = true, fail = '', maxSumErr = 0, maxMomErr = 0;
      var cases = [
        { rows: 4, p: 0.5 }, { rows: 8, p: 0.5 }, { rows: 12, p: 0.5 },
        { rows: 16, p: 0.5 }, { rows: 10, p: 0.3 }, { rows: 13, p: 0.72 }
      ];
      for (var ci = 0; ci < cases.length && ok; ci++) {
        var rows = cases[ci].rows, p = cases[ci].p, q = 1 - p;
        var pmf = Galton.binomialPMF(rows, p);
        var s = 0, m = 0, m2 = 0;
        for (var k = 0; k <= rows; k++) { s += pmf[k]; m += k * pmf[k]; m2 += k * k * pmf[k]; }
        var sumErr = Math.abs(s - 1);
        if (sumErr > maxSumErr) maxSumErr = sumErr;
        if (sumErr > EPS_SUM) { ok = false; fail = 'rows=' + rows + ' p=' + p + ' Σ=' + s; break; }
        var variance = m2 - m * m;
        var mErr = Math.abs(m - rows * q), vErr = Math.abs(variance - rows * p * q);
        if (mErr > maxMomErr) maxMomErr = mErr;
        if (vErr > maxMomErr) maxMomErr = vErr;
        if (mErr > EPS_MOM || vErr > EPS_MOM) {
          ok = false; fail = 'rows=' + rows + ' p=' + p + ' meanErr=' + mErr.toExponential(2) + ' varErr=' + vErr.toExponential(2); break;
        }
      }
      if (ok) {
        var pmf4 = Galton.binomialPMF(4, 0.5);
        var pascal = [1, 4, 6, 4, 1];
        for (var i = 0; i <= 4; i++) {
          if (Math.abs(pmf4[i] - pascal[i] / 16) > 1e-15) { ok = false; fail = 'Pascal[' + i + ']=' + pmf4[i]; break; }
        }
      }
      results.push({ name: 'ideal is exactly Binomial (Σ=1, mean=rows·q, var=rows·p·q, Pascal row)', pass: ok,
        note: ok ? ('Σ-err ≤ ' + maxSumErr.toExponential(1) + ', moment-err ≤ ' + maxMomErr.toExponential(1) + ', 1·4·6·4·1/16 ✓') : fail });
      allPass = allPass && ok;
    })();

    /* Check #2 — the simulation converges: a large seeded run's χ² to the
       binomial does NOT reject at α=0.01, at p=0.5 AND a biased p. (A
       statistical claim — stated as such.) */
    (function () {
      var ok = true, fail = '', noteParts = [];
      var alpha = 0.01;
      var runs = [
        { seed: 'verify-fair', rows: 12, p: 0.5, n: 120000 },
        { seed: 'verify-bias', rows: 12, p: 0.3, n: 120000 }
      ];
      for (var ri = 0; ri < runs.length && ok; ri++) {
        var r = runs[ri];
        var sim = Galton.simulate(r.seed, r.rows, r.p, r.n);
        var pmf = Galton.binomialPMF(r.rows, r.p);
        var cs = Galton.chiSquare(sim.hist, pmf);
        var crit = Galton.chiSquareCritical(alpha, cs.df);
        var pv = Galton.chiSquarePValue(cs.stat, cs.df);
        if (cs.stat >= crit) {
          ok = false;
          fail = r.seed + ' (p=' + r.p + ', N=' + r.n + ') χ²=' + cs.stat.toFixed(2) +
                 ' ≥ crit=' + crit.toFixed(2) + ' df=' + cs.df + ' (p-value ' + pv.toExponential(2) + ')';
          break;
        }
        noteParts.push('p=' + r.p + ': χ²=' + cs.stat.toFixed(1) + '<' + crit.toFixed(1) + ' (pv ' + pv.toFixed(3) + ')');
      }
      results.push({ name: 'simulation converges: χ² does NOT reject Binomial at α=0.01 (fair + biased)', pass: ok,
        note: ok ? noteParts.join(' · ') : fail });
      allPass = allPass && ok;
    })();

    /* Check #3 — every path is valid: each ball makes exactly `rows` ±steps,
       lands in one bin ∈ [0,rows], bin == #right-bounces; Σ hist == N. */
    (function () {
      var ok = true, fail = '';
      var sim = Galton.simulate('paths-check', 10, 0.5, 4000, { keepPaths: 4000 });
      var conserved = 0;
      for (var b = 0; b < sim.hist.length; b++) conserved += sim.hist[b];
      if (conserved !== sim.n) { ok = false; fail = 'Σhist=' + conserved + ' != N=' + sim.n; }
      if (ok) {
        var rng = Galton.makeRng('paths-check'); // SAME seed/stream → same balls
        for (var i = 0; i < sim.n && ok; i++) {
          var ball = Galton.dropBall(rng, 10, 0.5);
          if (ball.steps.length !== 10) { ok = false; fail = 'ball ' + i + ' has ' + ball.steps.length + ' steps'; break; }
          var rights = 0, valid = true;
          for (var s = 0; s < ball.steps.length; s++) {
            if (ball.steps[s] !== 1 && ball.steps[s] !== -1) { valid = false; break; }
            if (ball.steps[s] === 1) rights++;
          }
          if (!valid) { ok = false; fail = 'ball ' + i + ' has a non-±1 step'; break; }
          if (rights !== ball.bin) { ok = false; fail = 'ball ' + i + ' bin=' + ball.bin + ' != rights=' + rights; break; }
          if (ball.bin < 0 || ball.bin > 10) { ok = false; fail = 'ball ' + i + ' bin out of [0,10]'; break; }
        }
      }
      results.push({ name: 'every path valid: rows ±1 steps, bin == right-bounces ∈ [0,rows], Σhist == N', pass: ok,
        note: ok ? '4000 balls × 10 rows: every bin == right-count, all conserved' : fail });
      allPass = allPass && ok;
    })();

    /* Check #4 — determinism: same (seed,rows,p,N) ⇒ identical histogram AND
       identical per-ball path sequence across two independent runs. */
    (function () {
      var ok = true, fail = '';
      var a = Galton.simulate('det', 9, 0.4, 5000, { keepPaths: 200 });
      var b = Galton.simulate('det', 9, 0.4, 5000, { keepPaths: 200 });
      for (var k = 0; k < a.hist.length; k++) {
        if (a.hist[k] !== b.hist[k]) { ok = false; fail = 'hist differs at bin ' + k; break; }
      }
      if (ok) {
        for (var i = 0; i < a.paths.length && ok; i++) {
          for (var s = 0; s < a.paths[i].length; s++) {
            if (a.paths[i][s] !== b.paths[i][s]) { ok = false; fail = 'path ' + i + ' step ' + s + ' differs'; break; }
          }
        }
      }
      if (ok) {
        var c = Galton.simulate('det-other', 9, 0.4, 5000);
        var same = true;
        for (var j = 0; j < a.hist.length; j++) if (a.hist[j] !== c.hist[j]) { same = false; break; }
        if (same) { ok = false; fail = 'distinct seeds produced identical histograms'; }
      }
      results.push({ name: 'deterministic: same (seed,rows,p,N) ⇒ identical paths + histogram', pass: ok,
        note: ok ? 'two runs byte-identical; distinct seed differs' : fail });
      allPass = allPass && ok;
    })();

    /* Check #5 — empirical mean/variance track rows·q and rows·p·q, and the gap
       TIGHTENS with N. Compare a small run to a large run for the mean. */
    (function () {
      var ok = true, fail = '';
      var rows = 12, p = 0.5, q = 1 - p;
      var muT = rows * q, varT = rows * p * q;
      var small = Galton.simulate('moments-s', rows, p, 2000);
      var big = Galton.simulate('moments-b', rows, p, 200000);
      var meanErrBig = Math.abs(big.mean - muT), varErrBig = Math.abs(big.variance - varT);
      if (meanErrBig > 0.05) { ok = false; fail = 'big mean err ' + meanErrBig.toFixed(4) + ' (μ=' + muT + ')'; }
      else if (varErrBig > 0.12) { ok = false; fail = 'big var err ' + varErrBig.toFixed(4) + ' (σ²=' + varT + ')'; }
      if (ok) {
        var meanErrSmall = Math.abs(small.mean - muT);
        if (meanErrBig > meanErrSmall + 0.02) { ok = false; fail = 'mean did not tighten: big ' + meanErrBig.toFixed(4) + ' vs small ' + meanErrSmall.toFixed(4); }
      }
      results.push({ name: 'empirical mean/variance track rows·q & rows·p·q (tightening with N)', pass: ok,
        note: ok ? ('N=200k: mean-err ' + meanErrBig.toExponential(1) + ', var-err ' + varErrBig.toExponential(1) + ' vs μ=' + muT + ', σ²=' + varT) : fail });
      allPass = allPass && ok;
    })();

    /* Check #6 — AUDIO · PITCH IS A MONOTONIC BIJECTION OF BIN. binToPitch is
       strictly increasing in bin and one-to-one across the full UI row range, so
       the histogram of the pitches you HEAR is identical to the histogram of the
       bins — the sound can't drift from the distribution. (Guards against a
       collapsed/duplicated mapping that would mash bins onto one note.) */
    (function () {
      var ok = true, fail = '', minHz = Infinity, maxHz = 0;
      for (var rows = Galton.ROWS_MIN; rows <= Galton.ROWS_MAX && ok; rows++) {
        var prev = -Infinity, seen = {};
        for (var k = 0; k <= rows && ok; k++) {
          var hz = Galton.binToPitch(k, rows);
          if (!(hz > prev + 1e-9)) { ok = false; fail = 'rows=' + rows + ' bin ' + k + ' not strictly above ' + k + '−1 (' + hz.toFixed(2) + '≤' + prev.toFixed(2) + ')'; break; }
          var key = hz.toFixed(6);
          if (seen[key]) { ok = false; fail = 'rows=' + rows + ' duplicate pitch at bin ' + k; break; }
          seen[key] = 1; prev = hz;
          if (hz < minHz) minHz = hz; if (hz > maxHz) maxHz = hz;
        }
      }
      results.push({ name: 'audio: pitch is a strictly-monotonic bijection of bin (heard histogram == bin histogram)', pass: ok,
        note: ok ? ('rows 4..16: every bin → a distinct, rising pitch ∈ [' + minHz.toFixed(0) + ', ' + maxHz.toFixed(0) + '] Hz') : fail });
      allPass = allPass && ok;
    })();

    /* Check #7 — AUDIO · THE HEARD NOTE-DENSITY IS THE BELL CURVE. Because the
       pitch↔bin map is a bijection, the expected density of notes across pitch
       (pitchProfile) carries exactly the binomial PMF per pitch, peaks at the
       distribution's mode, sums to 1, and rises into the centre then falls —
       i.e. the bell curve, sounded. This is the χ²-fit-you-can-hear, as an
       EXACT identity (the profile's probs ARE the PMF). */
    (function () {
      var ok = true, fail = '';
      var rows = 12, p = 0.5;
      var prof = Galton.pitchProfile(rows, p);
      var pmf = Galton.binomialPMF(rows, p);
      var s = 0, modeK = 0, modeHz = 0, maxProb = -1;
      for (var k = 0; k <= rows; k++) {
        if (Math.abs(prof[k].prob - pmf[k]) > 1e-15) { ok = false; fail = 'profile prob ≠ PMF at bin ' + k; break; }
        if (Math.abs(prof[k].hz - Galton.binToPitch(k, rows)) > 1e-9) { ok = false; fail = 'profile hz wrong at bin ' + k; break; }
        s += prof[k].prob;
        if (prof[k].prob > maxProb) { maxProb = prof[k].prob; modeK = k; modeHz = prof[k].hz; }
      }
      if (ok && Math.abs(s - 1) > 1e-12) { ok = false; fail = 'profile does not sum to 1 (Σ=' + s + ')'; }
      // unimodal & symmetric for p=0.5: the mode is the central bin (rows/2).
      if (ok && modeK !== rows / 2) { ok = false; fail = 'pitch-density mode at bin ' + modeK + ', expected ' + (rows / 2); }
      // honestly rises into the centre then falls (the bell shape, in pitch order)
      if (ok) {
        for (var j = 1; j <= rows / 2; j++) if (!(pmf[j] > pmf[j - 1])) { ok = false; fail = 'not rising into centre at bin ' + j; break; }
        if (ok) for (var m = rows / 2 + 1; m <= rows; m++) if (!(pmf[m] < pmf[m - 1])) { ok = false; fail = 'not falling past centre at bin ' + m; break; }
      }
      results.push({ name: 'audio: note-density across pitch == binomial PMF (the bell curve, heard — peaks at centre, Σ=1)', pass: ok,
        note: ok ? ('rows=12 p=.5: density peaks at the centre pitch (' + modeHz.toFixed(0) + ' Hz, P=' + maxProb.toFixed(3) + '), Σ=1, rises-then-falls') : fail });
      allPass = allPass && ok;
    })();

    /* Check #8 — AUDIO · NO CLIP. The summed-voice master gain keeps even a dense
       burst of simultaneous plucks under the 0.9 ceiling, so the cascade can
       never clip; and a single voice is never gated to silence. */
    (function () {
      var ok = true, fail = '', amp = 0.32;
      for (var v = 1; v <= 64; v++) {
        var g = Galton.voiceGainFor(v, amp, 0.9);
        var peak = v * amp * g;
        if (peak > 0.9 + 1e-12) { ok = false; fail = v + ' voices peak ' + peak.toFixed(4) + ' > 0.9'; break; }

var state = {
  rows: 12,
  p: 0.5,
  speed: 1.0,
  seed: '',
  skin: 'slate',
  showNormal: false,
  playing: true,
  rng: null,            // the live seeded stream (Galton.makeRng)
  hist: null,           // int[rows+1] — the growing tally
  count: 0,             // balls landed
  sumBin: 0, sumBinSq: 0,
  active: [],           // balls currently animating

/* ---- seed helpers ---- */

  var availH = window.innerHeight - 60;
  var W = Math.max(300, Math.min(availW, 860));
  var H = Math.max(360, Math.min(availH, 720));
  // keep a pleasant aspect; board is a touch taller than wide
  if (W / H > 1.15) W = H * 1.15;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  layoutGeometry(W, H);
}

/* lay out pegs + bins in CSS px space (we scale the ctx by DPR) */
function layoutGeometry(W, H){
  var rows = state.rows;
  var padX = 26, padTop = 40, hopperH = 26;
  var binTop = Math.round(H * 0.60);          // pegs above, bins below
  var binH = H - binTop - 24;
  var nBins = rows + 1;
  // peg field is a triangle: row r has r+1 pegs. Fit horizontally + vertically.
  var pegAreaH = binTop - padTop - hopperH;

  var usableW = W - 2*padX;

  geo.cx = W/2;
  geo.pegTop = padTop + hopperH;
  geo.pegGapY = pegGapY;
  geo.pegGapX = pegGap;
  geo.pegR = pegR;
  geo.binTop = binTop;
  geo.binH = binH;
  geo.nBins = nBins;
  geo.binW = usableW / nBins;

/* peg position (row r in 0..rows-1, index i in 0..r) — centred triangle */
function pegPos(r, i){

function spawnBall(){

  var pts = [];
  pts.push({ x: geo.cx, y: geo.hopperY + 4 });
  // simulate the lateral drift: start at centre column position 0, each step ±0.5 column
  var col = 0; // fractional column offset in peg-gap units
  pts.push({ x: geo.cx, y: geo.pegTop + 0.2*geo.pegGapY });

    var graze = { x: geo.cx + col*geo.pegGapX, y: py - geo.pegR*1.4 };
    pts.push(graze);

  // bin index relates: bin = (rows + (rights-lefts))/2 ... but we track bin directly.
  var bx = binCenterX(ball.bin);

    bin: ball.bin,
    pts: pts,
    seg: 0,            // current segment index
    t: 0,              // 0..1 within segment
    landed: false,
    settleY: 0,        // y to rest at once landed (set on landing)
    x: pts[0].x, y: pts[0].y

}

/* land a ball into the histogram */
function landBall(b){
  state.hist[b.bin]++;

  state.sumBinSq += b.bin * b.bin;

/* drop N balls. If animating, queue them; if reduced-motion or huge N, tally

function dropN(n){
  if (reduceMotion || n > 2000){
    // tally directly from the stream — order-identical to spawning them
    for (var i=0;i<n;i++){
      var ball = Galton.dropBall(state.rng, state.rows, state.p);
      landBall({ bin: ball.bin });
    }
    flashHud('Tallied <b>' + n.toLocaleString() + '</b> balls' + (reduceMotion ? ' (reduced motion)' : ' (fast)'));
    if (!state.playing) draw();
  } else {

  }

}

/* ---- animation ---- */
var MAX_ACTIVE = 90;        // cap simultaneous balls for perf
function stepBalls(dt){

    state.active.push(spawnBall());

/* ---- drawing ---- */
function curScale(){

  // ~92% of the bin area height, plus headroom for empirical overshoot.
  var maxP = 0;
  for (var k=0;k<state.pmf.length;k++) if (state.pmf[k] > maxP) maxP = state.pmf[k];

    for (var j=0;j<state.hist.length;j++){ var f = state.hist[j]/state.count; if (f>maxF) maxF=f; }
  }

}

function drawBoard(targetCtx, scale){
  var c = targetCtx;
  var sk = SKINS[state.skin];
  c.clearRect(0,0,geo.W,geo.H);

  // hopper (funnel at top)
  c.save();
  c.strokeStyle = 'rgba(150,190,220,0.30)';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(geo.cx - 26, geo.hopperY);
  c.lineTo(geo.cx - 5, geo.hopperY + 22);
  c.lineTo(geo.cx + 5, geo.hopperY + 22);
  c.lineTo(geo.cx + 26, geo.hopperY);

  // pegs
  c.fillStyle = sk.peg;

    for (var i=0;i<=r;i++){
      var p = pegPos(r,i);
      c.beginPath(); c.arc(p.x, p.y, geo.pegR, 0, Math.PI*2); c.fill();
    }
  }

  // bin separators (subtle)
  c.strokeStyle = 'rgba(150,190,220,0.10)';
  c.lineWidth = 1;
  for (var s=0;s<=geo.nBins;s++){
    var x = geo.x0 + s*geo.binW;

  }

  c.strokeStyle = 'rgba(150,190,220,0.28)';
  c.beginPath(); c.moveTo(geo.x0, geo.binTop + geo.binH); c.lineTo(geo.x0 + geo.usableW, geo.binTop + geo.binH); c.stroke();

    var baseY = geo.binTop + geo.binH;

      var frac = state.hist[k]/state.count;
      var h = frac * scale;
      if (h < 0.5) continue;

      var bw = geo.binW - 2;

      c.fillRect(bx+1, baseY - h, bw, h);

}

/* draw a probability curve (array over bins) at the shared scale */
function drawCurve(c, arr, scale, colour, withDots){
  var baseY = geo.binTop + geo.binH;

function getCSS(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  var c = ctx;
  c.save();
  c.setTransform(DPR,0,0,DPR,0,0);
  drawBoard(c, curScale());
  c.restore();
}

/* ---- main loop ---- */
var last = 0, rafId = null;
function frame(now){
  rafId = requestAnimationFrame(frame);
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last)/1000);
  last = now;
  var animating = state.active.length > 0 || state.pending > 0;
  if (state.playing && animating){
    stepBalls(dt);
    paintStats();
  }
  // always draw (cheap) so resizes / overlay toggles reflect immediately
  draw();
}
function startLoop(){ if (rafId == null){ last = 0; rafId = requestAnimationFrame(frame); } }

/* ---- self-test chip (calls the SAME core as the Node test) ---- */
function runChip(){
  var res = Galton.runSelfTest();
  var el = document.getElementById('selftest');
  var mark = res.pass ? '✓' : '✗';
  el.className = 'selftest ' + (res.pass ? 'ok' : 'bad');
  el.textContent = mark + ' galton verified — ' + res.n + '/' + res.total;
  console.log('%cGalton board self-test', 'font-weight:bold');
  res.results.forEach(function(r,i){
    var line = '  check #' + (i+1) + ' [' + (r.pass?'PASS':'FAIL') + '] ' + r.name + ' — ' + r.note;
    if (r.pass) console.log(line); else console.error(line);
  });
  console.log('Galton board self-test: ' + res.n + '/' + res.total + ' ' + (res.pass?'PASS':'FAIL'));
  return res;
}

/* ---- live stats line: count, mean, σ, χ² + p-value vs binomial ---- */
function paintStats(){
  var el = document.getElementById('stats');
  var n = state.count;
  if (n === 0){
    el.innerHTML = 'Drop some balls — the tally will rise to meet the <b>binomial</b> curve. ' +
      'Theory: mean <b>' + Galton.binomialMean(state.rows, state.p).toFixed(2) +
      '</b>, σ <b>' + Math.sqrt(Galton.binomialVar(state.rows, state.p)).toFixed(2) + '</b>.';
    return;
  }
  var mean = state.sumBin / n;
  var variance = state.sumBinSq / n - mean*mean;
  var sd = Math.sqrt(Math.max(0, variance));
  var muT = Galton.binomialMean(state.rows, state.p);
  var sdT = Math.sqrt(Galton.binomialVar(state.rows, state.p));
  var cs = Galton.chiSquare(state.hist, state.pmf);
  var pv = Galton.chiSquarePValue(cs.stat, cs.df);
  var verdict, cls;
  if (n < 200){ verdict = 'gathering…'; cls = 'warn'; }
  else if (pv >= 0.01){ verdict = 'consistent with binomial (p=' + pv.toFixed(3) + ')'; cls = 'ok'; }
  else { verdict = 'χ² high — keep dropping (p=' + pv.toFixed(3) + ')'; cls = 'warn'; }
  el.innerHTML =
    'n <b>' + n.toLocaleString() + '</b> &nbsp;·&nbsp; ' +
    'mean <b>' + mean.toFixed(3) + '</b> <span style="opacity:.6">(μ=' + muT.toFixed(2) + ')</span> &nbsp;·&nbsp; ' +
    'σ <b>' + sd.toFixed(3) + '</b> <span style="opacity:.6">(' + sdT.toFixed(2) + ')</span> &nbsp;·&nbsp; ' +
    'χ²(' + cs.df + ') <b>' + cs.stat.toFixed(1) + '</b> &nbsp;·&nbsp; ' +
    '<span class="' + cls + '">' + verdict + '</span>';
}

/* ---- caption ---- */
function paintCaption(){
  var rows = state.rows, p = state.p, q = 1-p;
  document.getElementById('caption').innerHTML =
    'Each ball makes <b>' + rows + '</b> bounces, right with prob <b>' + q.toFixed(2) + '</b>; its bin is ' +
    'its count of rights — so a bin is <b>Binomial(' + rows + ', ' + q.toFixed(2) + ')</b>. The amber ' +
    'curve is that <b>exact</b> PMF; the bars are the running tally. The χ² p-value below measures, live, ' +
    'whether the run is consistent with it.';
}

/* ---- 2× PNG export ---- */
function exportPNG(){
  var W = geo.W, H = geo.H, S = 2;
  var off = document.createElement('canvas');
  off.width = Math.round(W*S); off.height = Math.round(H*S);
  var oc = off.getContext('2d');
  oc.fillStyle = getCSS('--bg') || '#08090d';
  oc.fillRect(0,0,off.width,off.height);
  oc.setTransform(S,0,0,S,0,0);
  drawBoard(oc, curScale());
  off.toBlob(function(blob){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'galton_' + state.rows + 'rows_p' + state.p.toFixed(2) + '_n' + state.count + '_' + state.seed + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 3000);
      flashHud('Exported · <b>' + state.count.toLocaleString() + '</b> balls');
    }catch(e){ console.error(e); }
  }, 'image/png');
}

/* ws: unlock breadcrumb — the shared module (one source of truth), inlined via
   forge. See /UNLOCK.md and tools/ws/README.md. Defines WS, records this piece's
   first-visit, and (via WS auto-init) fires the unlock cue. Harmless if storage off. */
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Shared estate-wide MUTE (the single key ws:pref:muted) ─────────────────
     House convention (DESIGNING.md): any page that makes sound reads/writes ONE
     shared key, so a visitor mutes once and it holds everywhere — and a mute
     toggled on another estate tab takes effect live. A page's audio gates on
     WS.muted(); a control writes via WS.setMuted(); WS.onMuteChange(fn) fires on
     any change (this tab OR another). */
  var MUTE_KEY = 'ws:pref:muted';
  var muteSubs = [];
  WS.muted = function () { return lsGet(MUTE_KEY) === '1'; };
  WS.setMuted = function (v) {
    var on = !!v;
    lsSet(MUTE_KEY, on ? '1' : '0');
    for (var i = 0; i < muteSubs.length; i++) {
      try { muteSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onMuteChange = function (fn) {
    if (typeof fn === 'function') muteSubs.push(fn);
  };
  // cross-tab: a mute set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== MUTE_KEY) return;
      var on = WS.muted();
      for (var i = 0; i < muteSubs.length; i++) {
        try { muteSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } },
    { id: 'light-mixer',    unlocked: function (s) {
        // earned by mastering every Feat of Light in the Hall of Mirrors (all 9)
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        for (var i = 0; i < f.length; i++) { if (!s.has('ws:flag:earned-' + f[i])) return false; }
        return true;
      } },

    /* ── The Constellation of Mastery (wave one) ────────────────────────────────
       A named group of secrets that reward what you CONQUERED, not merely what you
       wandered past. Each candle stands for a feat finished; the capstone lights
       only when all five are lit. Predicates are ids + fns ONLY — the names, badges,
       riddles, and prose live in undercroft/index.src.html (hidden-world content),
       so no secret prose leaks into a public trigger page. */

    /* m-keeper-of-tales: carried ALL THREE public Lantern tales to their ends.
       GATES the earned Keeper's Alcove (keeper.html). */
    { id: 'm-keeper-of-tales', unlocked: function (s) {
        return s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won');
      } },

    /* m-clean-sweep: a flawless ("clean") solve of all FOUR puzzle benches. */
    { id: 'm-clean-sweep', unlocked: function (s) {
        return s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean');
      } },

    /* m-held-the-line: outlasted the Swarm to the tenth wave (reachable; sits
       between survivor>=5 and rosette>=8 with no clash). */
    { id: 'm-held-the-line', unlocked: function (s) {
        return (+s.get('ws:best:swarm') || 0) >= 10;
      } },

    /* m-half-the-light: mastered at least FIVE of the nine Feats of Light. */
    { id: 'm-half-the-light', unlocked: function (s) {
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        return n >= 5;
      } },

    /* m-eleven-and-still: pushed every dial to eleven AND kept the long quiet. */
    { id: 'm-eleven-and-still', unlocked: function (s) {
        return s.has('ws:flag:eleven') && s.has('ws:flag:patience');
      } },

    /* m-grandmaster (capstone): the constellation's own rosette — lights only when
       all five mastery feats above are satisfied. Re-evaluates the RAW predicates
       against `s` (does NOT recurse through WS.unlocked). */
    { id: 'm-grandmaster', unlocked: function (s) {
        // 1) m-keeper-of-tales
        if (!(s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won'))) return false;
        // 2) m-clean-sweep
        if (!(s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean'))) return false;
        // 3) m-held-the-line
        if (!((+s.get('ws:best:swarm') || 0) >= 10)) return false;
        // 4) m-half-the-light
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        if (n < 5) return false;
        // 5) m-eleven-and-still
        if (!(s.has('ws:flag:eleven') && s.has('ws:flag:patience'))) return false;
        return true;
      } }
  ];

  /* lookup a secret row by id */
  function secretById(id) {
    for (var i = 0; i < WS.SECRETS.length; i++) {
      if (WS.SECRETS[i].id === id) return WS.SECRETS[i];
    }
    return null;
  }

  /* WS.unlocked(id, store): is secret <id> unlocked given a store? */
  WS.unlocked = function (id, store) {
    var m = secretById(id);
    return !!(m && store && store.ok && m.unlocked(store));
  };

  /* ── Cue machinery (`ws:ann:` announced-namespace) ────────────────────────── */

  /* WS.bootstrap(): on the FIRST EVER run on this origin (ws:ann:bootstrap absent),
     silently mark ws:ann:<id> for every CURRENTLY-satisfied secret, so a returning
     visitor who unlocked things before this feature existed gets NO cue spam. Then
     sets ws:ann:bootstrap. Idempotent. Must run before checkUnlocks. */
  WS.bootstrap = function () {
    if (lsGet('ws:ann:bootstrap') != null) return;
    var store = WS.store();
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (sec.unlocked(store)) lsSet('ws:ann:' + sec.id, String(Date.now()));
      }
    }
    lsSet('ws:ann:bootstrap', String(Date.now()));
  };

  /* WS.checkUnlocks(opts): for every secret currently satisfied AND not yet
     announced (ws:ann:<id> absent), mark it announced and collect it. If any are
     fresh AND not opts.silent AND we're in a browser, renderCue(fresh, store).
     Returns the fresh id list. */
  WS.checkUnlocks = function (opts) {
    opts = opts || {};
    var store = WS.store();
    var fresh = [];
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (!sec.unlocked(store)) continue;
        var ak = 'ws:ann:' + sec.id;
        if (lsGet(ak) != null) continue;
        lsSet(ak, String(Date.now()));
        fresh.push(sec.id);
      }
    }
    if (fresh.length && !opts.silent && root && root.document) {
      WS.renderCue(fresh, store);
    }
    return fresh;
  };

  /* WS.renderCue(ids, store): inject a tasteful candlelit toast. Spoiler-light &
     evocative — never names the secret. One toast even if several ids are fresh. */
  var CUE_STYLE_ID = 'wscue-style';
  WS.renderCue = function (ids, store) {
    if (!root || !root.document) return;
    var doc = root.document;
    var body = doc.body;
    if (!body) return;
    if (!store) store = WS.store();

    var reduce = false;
    try { reduce = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    // once-only scoped stylesheet
    if (!doc.getElementById(CUE_STYLE_ID)) {
      var st = doc.createElement('style');

        '.wscue{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);' +
        'z-index:2147483600;max-width:min(92vw,440px);box-sizing:border-box;' +
        'display:flex;align-items:flex-start;gap:13px;padding:16px 18px 16px 17px;' +
        'border-radius:14px;border:1px solid rgba(201,162,74,.34);' +

        'inset 0 1px 0 rgba(201,162,74,.10);' +
        'color:#e7e2d6;pointer-events:auto;opacity:0;' +
        'transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);' +
        'font-family:Georgia,"Times New Roman",serif;}' +
        '.wscue.wscue-in{opacity:1;transform:translateX(-50%) translateY(0);}' +
        '.wscue .wscue-rune{flex:0 0 auto;font-size:21px;line-height:1.2;color:#c9a24a;' +
        'text-shadow:0 0 16px rgba(201,162,74,.65);animation:wscue-flicker 3.4s ease-in-out infinite;}' +
        '.wscue .wscue-body{flex:1 1 auto;min-width:0;}' +
        '.wscue .wscue-kick{display:block;font:600 9.5px/1 ui-monospace,Menlo,monospace;' +
        'letter-spacing:.26em;text-transform:uppercase;color:#c9a24a;opacity:.72;margin-bottom:6px;}' +
        '.wscue .wscue-text{display:block;font-size:14.5px;line-height:1.5;color:#e7e2d6;}' +
        '.wscue .wscue-x{flex:0 0 auto;margin:-4px -4px 0 2px;padding:4px 7px;cursor:pointer;' +
        'background:none;border:none;color:#8a8472;font:600 15px/1 ui-monospace,Menlo,monospace;' +
        'border-radius:8px;transition:color .25s,background .25s;}' +
        '.wscue .wscue-x:hover{color:#c9a24a;background:rgba(201,162,74,.08);}' +
        '.wscue .wscue-mute{flex:0 0 auto;margin:-4px 0 0 2px;padding:4px 6px;cursor:pointer;' +
        'background:none;border:none;color:#8a8472;font:600 14px/1 ui-monospace,Menlo,monospace;' +
        'border-radius:8px;transition:color .25s,background .25s;}' +
        '.wscue .wscue-mute:hover{color:#c9a24a;background:rgba(201,162,74,.08);}' +
        '@keyframes wscue-flicker{0%,100%{opacity:.92;}45%{opacity:.66;}70%{opacity:1;}}' +

    // evocative, spoiler-light copy — warmer if they've already found the cellar
    var found = store && store.has && store.has('ws:seen:undercroft');
    var text = found
      ? 'A way has opened beneath — the Undercroft keeps something new.'

    var toast = doc.createElement('div');
    toast.className = 'wscue';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');

    var rune = doc.createElement('span');

    rune.textContent = '✦';

    var bodyWrap = doc.createElement('div');
    bodyWrap.className = 'wscue-body';
    var kick = doc.createElement('span');
    kick.className = 'wscue-kick';
    kick.textContent = 'beneath the workshop';
    var txt = doc.createElement('span');
    txt.className = 'wscue-text';
    txt.textContent = text;
    bodyWrap.appendChild(kick);
    bodyWrap.appendChild(txt);

    // estate-wide mute toggle — writes the shared key ws:pref:muted, so muting
    // here (the chime sounds from this toast) holds across every estate page.
    var mute = doc.createElement('button');
    mute.className = 'wscue-mute';
    function syncMuteBtn() {
      var m = WS.muted();
      mute.textContent = m ? '🔇' : '🔊';
      mute.setAttribute('aria-label', m ? 'unmute the estate' : 'mute the estate');
      mute.title = m ? 'Muted estate-wide — click to unmute' : 'Mute sound across the whole estate';

    mute.addEventListener('click', function () { WS.setMuted(!WS.muted()); syncMuteBtn(); });

    x.setAttribute('aria-label', 'dismiss');

    // create/resume one (respect the workshop's audio-courtesy rule). Honours the
    // estate-wide mute: if ws:pref:muted === '1', the chime stays silent (read at
    // fire-time, so a mute toggled on ANY estate tab takes effect immediately).

      var __wsMuted = false;
      try { __wsMuted = WS.muted(); } catch (e) {}
      var AC = root.__wsAudioCtx || root.audioCtx || null;

        var now = AC.currentTime;

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.04, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);

    // auto-dismiss after ~7s
    hideTimer = setTimeout(dismiss, 7000);
  };

  /* ── Auto-init (browser only) ─────────────────────────────────────────────
