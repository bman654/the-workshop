<!-- The hidden land + its renderer (forge-inlined; window handles set before boot). -->
<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════
   THE CARTOGRAPHER'S DREAM — core.mjs
   The HIDDEN LAND. A whole antique chart, deterministic from a seed, generated
   ONCE and never re-derived. The lantern in the page only changes VISIBILITY;
   this module owns all GEOMETRY. Same seed → byte-identical land + identical
   ordered placement list, by construction.

   Ported from the proven cartographer/ pipeline (xmur3+mulberry32 → fBm
   heightmap with island-mask falloff → percentile sea-level → ocean flood-fill
   → coastline BFS → moisture/biome → NW hillshade → steepest-descent river
   flow-accumulation → greedy label placement), with a NEW family-resemblance
   toponymy in the estate's verse/theogony idiom (a per-world syllable family so
   one land's names sound related).

   This file is forge-inlined into index.html verbatim AND imported by
   core.test.mjs — one authority, two consumers. Zero deps (pure JS).
   ═══════════════════════════════════════════════════════════════════════════ */

/* ----------------------------- PRNG (xmur3 + mulberry32) ------------------- */
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){ const s = xmur3(String(seedStr)); return mulberry32(s()); }

/* ----------------------------- Value Noise (2D fBm) ----------------------- */
class ValueNoise{
  constructor(rng){
    const N = 256;
    this.perm = new Uint8Array(N*2);
    this.grad = new Float32Array(N);
    const p = new Uint8Array(N);
    for (let i=0;i<N;i++){ p[i]=i; this.grad[i]=rng(); }
    for (let i=N-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; }
    for (let i=0;i<N*2;i++) this.perm[i]=p[i&(N-1)];
  }
  _smooth(t){ return t*t*t*(t*(t*6-15)+10); }
  _val(ix,iy){ return this.grad[(this.perm[(ix & 255) + this.perm[iy & 255]])]; }
  noise(x,y){
    const ix=Math.floor(x), iy=Math.floor(y);
    const fx=x-ix, fy=y-iy;
    const u=this._smooth(fx), v=this._smooth(fy);
    const a=this._val(ix,iy), b=this._val(ix+1,iy);
    const c=this._val(ix,iy+1), d=this._val(ix+1,iy+1);
    const top=a+(b-a)*u, bot=c+(d-c)*u;
    return top+(bot-top)*v; // 0..1
  }
  fbm(x,y,oct,lac,gain){
    let amp=1, freq=1, sum=0, norm=0;
    for(let i=0;i<oct;i++){
      sum += amp * (this.noise(x*freq, y*freq)*2-1);
      norm += amp;
      amp *= gain; freq *= lac;
    }
    return (sum/norm)*0.5 + 0.5;
  }
  ridged(x,y,oct,lac,gain){
    let amp=1, freq=1, sum=0, norm=0;
    for(let i=0;i<oct;i++){
      let n = this.noise(x*freq, y*freq)*2-1;
      n = 1 - Math.abs(n);
      n *= n;
      sum += amp*n; norm += amp;
      amp *= gain; freq *= lac;
    }
    return sum/norm;
  }
}

/* ----------------------------- Biome indices ------------------------------ */
const B = { DEEP:0, SHALLOW:1, LAKE:2, BEACH:3, GRASS:4, FOREST:5, JUNGLE:6,
           SAVANNA:7, DESERT:8, TAIGA:9, TUNDRA:10, SNOW:11, MTN_LOW:12,
           MTN_HIGH:13, ALPINE:14 };

/* value at the given fraction (0..1) of a sorted copy of arr */
function percentile(arr, frac){
  const N=arr.length;
  const copy=Float32Array.from(arr);
  copy.sort();
  let idx=Math.floor(frac*(N-1));
  if(idx<0)idx=0; if(idx>=N)idx=N-1;
  return copy[idx];
}

function shuffle(arr,rng){ for(let i=arr.length-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=arr[i];arr[i]=arr[j];arr[j]=t; } }

/* connected-component clusters of cells matching pred; centroids of big ones */
function findClusters(field, GW, GH, pred, minSize){
  const N=GW*GH; const seen=new Uint8Array(N); const out=[];
  for(let i=0;i<N;i++){
    if(seen[i]||!pred(field[i]))continue;
    let sx=0,sy=0,n=0; const stack=[i]; seen[i]=1;
    while(stack.length){
      const c=stack.pop(); const x=c%GW,y=(c/GW)|0; sx+=x; sy+=y; n++;
      const cx=c%GW;
      if(cx<GW-1 && !seen[c+1]&&pred(field[c+1])){seen[c+1]=1;stack.push(c+1);}
      if(cx>0 && !seen[c-1]&&pred(field[c-1])){seen[c-1]=1;stack.push(c-1);}
      if(c+GW<N && !seen[c+GW]&&pred(field[c+GW])){seen[c+GW]=1;stack.push(c+GW);}
      if(c-GW>=0 && !seen[c-GW]&&pred(field[c-GW])){seen[c-GW]=1;stack.push(c-GW);}
    }
    if(n>=minSize) out.push({cx:Math.round(sx/n),cy:Math.round(sy/n),size:n});
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TOPONYMY — a per-world syllable FAMILY (family resemblance by construction).
   Each world seeds its own small onset/nucleus/coda set + syllable-count
   distribution, so one sheet's names share a phonetic feel ("Vell", "Vantor",
   "Vellmere") and another sheet's feel wholly different. Names are pronounceable
   by construction (only legal, hand-chosen syllable pieces) and collision-checked
   against already-placed names before accepting. Composed via hand-authored
   templates keyed to real feature kind, in the estate's serif/portolan hand.
   ═══════════════════════════════════════════════════════════════════════════ */
const ONSET_POOL = ["b","br","c","cr","d","dr","f","fl","g","gr","gl","h","k","kr","l","m","n","p","pr","r","s","sh","st","str","t","th","tr","v","vr","w","y","z","bl","cl","sk","sn","sl","thr","kh","ph","w","m","n"];
const NUC_POOL   = ["a","e","i","o","u","ae","ia","io","ei","ou","au","ea","oa","ee","ai","y","or","ar","en","el"];
const CODA_POOL  = ["","","n","r","l","s","m","th","nd","rn","ll","st","sk","rd","ng","lt","rk","ss","x","ff"];

function makeToponymy(seedStr){
  // A dedicated PRNG stream so toponymy is stable regardless of geometry draws.
  const frng = makeRng(seedStr + "::toponymy-family");
  const pick = (arr)=> arr[(frng()*arr.length)|0];
  const drawSet = (pool, lo, hi)=>{
    const n = lo + ((frng()*(hi-lo+1))|0);
    const set = [];
    const used = new Set();
    let guard=0;
    while(set.length<n && guard++<200){ const v=pick(pool); if(!used.has(v)){ used.add(v); set.push(v); } }
    return set;
  };
  // this world's family: a restricted palette
  const onsets = drawSet(ONSET_POOL, 5, 8);
  const nuclei = drawSet(NUC_POOL, 3, 5);
  const codas  = drawSet(CODA_POOL, 4, 7);
  // syllable-count weights for this world (some worlds "sound" longer)
  const sylMin = 1, sylMax = frng() < 0.5 ? 2 : 3;

  // the name-generation stream (separate so word draws don't disturb the family)
  const wrng = makeRng(seedStr + "::toponymy-words");
  const wpick = (arr)=> arr[(wrng()*arr.length)|0];
  const cap = (s)=> s.charAt(0).toUpperCase()+s.slice(1);

  function syl(){ return wpick(onsets)+wpick(nuclei); }
  function root(minS, maxS){
    const n = minS + ((wrng()*(maxS-minS+1))|0);
    let w=""; for(let i=0;i<n;i++) w += syl();
    w += wpick(codas);
    // avoid a bare empty (all-empty coda + single short syl) reading too thin
    if(w.length < 2) w += wpick(nuclei);
    return cap(w);
  }
  // a root guaranteed to END IN A VOWEL — for direct-glue suffixes ("Xteeth",
  // "Xmere") where a consonant-cluster coda butted against a consonant-initial
  // suffix would pile up unpronounceably. Ends on an open syllable, no coda.
  function vroot(minS, maxS){
    const n = minS + ((wrng()*(maxS-minS+1))|0);
    let w=""; for(let i=0;i<n;i++) w += syl();   // every syl ends in a nucleus (vowel)
    return cap(w);
  }

  // feature-kind templates in the estate's portolan hand
  const seaSuffix  = ["Sea","Reach","Deep","Sound","Bight","Gulf","Main","Expanse"];
  const seaMere    = ["mere","water","-sea"];
  const holdSuffix = ["'s Hollow","'s Cross","'s Landing","'s Rest","'s Watch","'s Ford","'s Reach"];
  const holdPlain  = ["Cross","Landing","Watch","Ford","Gate","Bay","Head","Fell"];
  const rangeThe   = ["teeth","spine","wall","horns","crags","fangs","spires","backbone"];
  const regionSuf  = ["reach","march","vale","wold","mark","holt","downs","moor","heath","weald","fields","lands"];
  const titleAdj   = ["Sundered","Veiled","Hidden","Elder","Wandering","Riven","Twilight","Verdant","Storm","Silver","Last","Lost","Ashen","Drowned","Gilded","Far"];

  const seen = new Set();
  function unique(fn){
    let guard=0, name;
    do { name = fn(); guard++; } while(seen.has(name.toLowerCase()) && guard<40);
    seen.add(name.toLowerCase());
    return name;
  }

  return {
    family: { onsets, nuclei, codas, sylMin, sylMax },
    // a settlement / hold — possessive holds or plain landmark names
    hold(){
      return unique(()=>{
        const r = wrng();
        const base = root(sylMin, sylMax);
        if(r < 0.5) return base + wpick(holdSuffix);
        if(r < 0.78) return base + " " + wpick(holdPlain);
        return base; // a bare hold name (a town)
      });
    },
    // a sea / large water body
    sea(){
      return unique(()=>{
        const r = wrng();
        if(r < 0.30) return "The " + root(sylMin, Math.max(sylMin, sylMax-1)) + " " + wpick(seaSuffix);
        // direct-glue "Xmere" — use a vowel-ending root so no consonant pileup
        if(r < 0.60) return vroot(sylMin, Math.max(sylMin, sylMax-1)) + wpick(seaMere);
        return root(sylMin, Math.max(sylMin, sylMax-1)) + " " + wpick(seaSuffix);
      });
    },
    // a mountain range — the portolan "Xteeth" idiom (direct-glued, vowel-ended root)
    range(){
      return unique(()=>{
        const r = wrng();
        if(r < 0.45) return "the " + vroot(sylMin, Math.max(sylMin, sylMax-1)) + wpick(rangeThe);
        if(r < 0.72) return "the " + wpick(titleAdj) + " " + cap(wpick(rangeThe));
        return "the " + root(sylMin, Math.max(sylMin, sylMax-1)) + " " + cap(wpick(rangeThe));
      });
    },
    // a region / inland province
    region(){
      return unique(()=>{
        const r = wrng();
        if(r < 0.42) return "The " + wpick(titleAdj) + " " + cap(syl()+wpick(codas));
        // direct-glue "Xreach" — vowel-ended root
        if(r < 0.72) return vroot(sylMin, sylMax) + wpick(regionSuf);
        return root(sylMin, sylMax) + " " + cap(wpick(regionSuf));
      });
    },
    // the world's grand title (for the cartouche)
    title(){
      const r = wrng();
      // a grand title wants heft — never a one-syllable stub
      const core = root(Math.max(2,sylMin), Math.max(2,sylMax));
      if(r < 0.30) return "the " + core;
      if(r < 0.55) return "the " + wpick(titleAdj) + " Reach";
      if(r < 0.78) return "the " + core + " " + cap(wpick(regionSuf));
      return "the " + wpick(titleAdj) + " " + core;
    }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   generateLand(seedStr, opts) — the whole hidden chart, once.
   Returns a frozen-in-spirit LAND object: the fields, the rivers, and an
   ORDERED placement list (labels + settlements + peaks) in a deterministic
   order. Same seed → byte-identical fields + identical ordered placement list.
   opts: { GW, GH } logical grid (defaults 360×240, cartographer's proven size).
   ═══════════════════════════════════════════════════════════════════════════ */
function generateLand(seedStr, opts={}){
  seedStr = String(seedStr);
  const GW = opts.GW||360, GH = opts.GH||240;
  const N = GW*GH;
  const aspect = GW/GH;

  // deterministic PRNG streams, keyed off the one seed
  const rng      = makeRng(seedStr);
  const noiseRng = makeRng(seedStr + "::height");
  const moistRng = makeRng(seedStr + "::moist");
  const warpRng  = makeRng(seedStr + "::warp");

  const hN = new ValueNoise(noiseRng);
  const mN = new ValueNoise(moistRng);
  const warpN = new ValueNoise(warpRng);

  const oct = 7, lac = 2.0, gain = 0.55;

  // "continents" form (one form; the room re-rolls the SEED, not a slider)
  const maskPow=2.6, maskStrength=0.98, baseFreq=3.0, landBias=0.0, blobAmp=0.42, nBlobs=3;
  const blobR=[0.20,0.42];

  const blobs = [];
  for(let i=0;i<nBlobs;i++){
    blobs.push({
      x: 0.5 + (rng()-0.5)*0.7,
      y: 0.5 + (rng()-0.5)*0.55,
      r: blobR[0] + rng()*(blobR[1]-blobR[0])
    });
  }

  const height = new Float32Array(N);
  const moisture = new Float32Array(N);
  let hMin=Infinity, hMax=-Infinity;
  for(let y=0;y<GH;y++){
    const ny = y/GH;
    for(let x=0;x<GW;x++){
      const nx = x/GW;
      const i = y*GW+x;
      const wfx = warpN.fbm(nx*3+11.3, ny*3+5.7, 3, 2, 0.5);
      const wfy = warpN.fbm(nx*3+31.1, ny*3+17.2, 3, 2, 0.5);
      const sx = nx*baseFreq + (wfx-0.5)*0.55;
      const sy = ny*baseFreq + (wfy-0.5)*0.55;
      let h = hN.fbm(sx, sy, oct, lac, gain);
      const ridge = hN.ridged(sx*1.7+3.3, sy*1.7+1.1, 5, 2, 0.55);
      h = h*0.72 + ridge*0.42;
      const dx = (nx-0.5)*aspect, dy=(ny-0.5);
      let d = Math.sqrt(dx*dx + dy*dy) / (0.5*Math.sqrt(aspect*aspect+1));
      let mask = 1 - Math.pow(Math.min(1,d), maskPow);
      let blobBias = 0;
      for(const b of blobs){
        const bdx=(nx-b.x)*aspect, bdy=(ny-b.y);
        const bd = Math.sqrt(bdx*bdx+bdy*bdy);
        blobBias = Math.max(blobBias, 1 - Math.min(1, bd/b.r));
      }
      h = h*maskStrength + (mask-0.5)*0.6 + (blobBias-0.35)*blobAmp + landBias;
      height[i]=h;
      if(h<hMin)hMin=h; if(h>hMax)hMax=h;
      let m = mN.fbm(nx*3.4+7.1, ny*3.4+2.9, 5, 2, 0.5);
      moisture[i]=m;
    }
  }
  const hr = (hMax-hMin)||1;
  for(let i=0;i<N;i++) height[i]=(height[i]-hMin)/hr;

  // ---- sea level via target land fraction (percentile threshold) ----
  let targetLand = 0.44;
  const sea = percentile(height, 1-targetLand);
  const water = new Uint8Array(N); // 0 land, 1 ocean, 2 lake
  for(let i=0;i<N;i++) water[i] = height[i] < sea ? 1 : 0;

  // ---- ocean flood fill from borders (lakes vs ocean) ----
  const ocean = new Uint8Array(N);
  {
    const stack=[];
    const pushIf=(x,y)=>{ if(x<0||y<0||x>=GW||y>=GH)return; const i=y*GW+x; if(water[i]===1 && !ocean[i]){ocean[i]=1; stack.push(i);} };
    for(let x=0;x<GW;x++){ pushIf(x,0); pushIf(x,GH-1); }
    for(let y=0;y<GH;y++){ pushIf(0,y); pushIf(GW-1,y); }
    while(stack.length){
      const i=stack.pop(); const x=i%GW, y=(i/GW)|0;
      pushIf(x+1,y); pushIf(x-1,y); pushIf(x,y+1); pushIf(x,y-1);
    }
  }
  for(let i=0;i<N;i++){ if(water[i]===1 && !ocean[i]) water[i]=2; }

  // ---- coastline distance (BFS from ocean) ----
  const coastDist = new Int16Array(N).fill(-1);
  {
    const q=[]; let head=0;
    for(let i=0;i<N;i++){ if(water[i]===1){ coastDist[i]=0; q.push(i);} }
    while(head<q.length){
      const i=q[head++]; const x=i%GW, y=(i/GW)|0; const nd=coastDist[i]+1;
      const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(const [bx,by] of nb){ if(bx<0||by<0||bx>=GW||by>=GH)continue; const j=by*GW+bx; if(coastDist[j]===-1){ coastDist[j]=nd; q.push(j);} }
    }
  }

  // ---- moisture finalize ----
  for(let i=0;i<N;i++){
    if(water[i]) continue;
    const cd = coastDist[i]<0?40:coastDist[i];
    const coastWet = Math.exp(-cd/22);
    let m = moisture[i]*0.6 + coastWet*0.4;
    moisture[i] = Math.max(0, Math.min(1, m));
  }

  // ---- latitude temperature ----
  function latTemp(y){ const lat = Math.abs((y/GH) - 0.5)*2; return 1 - lat; }

  // ---- biome classification ----
  const biome = new Uint8Array(N);
  for(let y=0;y<GH;y++){
    const temp = latTemp(y);
    for(let x=0;x<GW;x++){
      const i=y*GW+x;
      if(water[i]===1){ biome[i] = (coastDist[i]<=1 ? B.SHALLOW : B.DEEP); continue; }
      if(water[i]===2){ biome[i] = B.LAKE; continue; }
      const h = height[i]; const m = moisture[i];
      const e = (h - sea)/(1-sea);
      if(e>0.74){ biome[i] = (temp<0.35 || e>0.9) ? B.ALPINE : B.MTN_HIGH; continue; }
      if(e>0.56){ biome[i] = B.MTN_LOW; continue; }
      if(coastDist[i]<=1 && e<0.10){ biome[i]=B.BEACH; continue; }
      const localT = temp - e*0.45;
      if(localT < 0.16){ biome[i] = (m>0.45? B.SNOW : B.TUNDRA); continue; }
      if(localT < 0.34){ biome[i] = (m>0.4? B.TAIGA : B.TUNDRA); continue; }
      if(localT > 0.72){
        if(m>0.62) biome[i]=B.JUNGLE;
        else if(m>0.34) biome[i]=B.SAVANNA;
        else biome[i]=B.DESERT;
      } else {
        if(m>0.58) biome[i]=B.FOREST;
        else if(m>0.30) biome[i]=B.GRASS;
        else biome[i]=B.DESERT;
      }
    }
  }

  // ---- hillshade (gradient, light from NW) ----
  const hillshade = new Float32Array(N);
  const lx=-0.6, ly=-0.6, lz=0.9;
  const llen = Math.hypot(lx,ly,lz);
  const Lx=lx/llen, Ly=ly/llen, Lz=lz/llen;
  const zscale = 2.4;
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const i=y*GW+x;
      const xl=Math.max(0,x-1), xr=Math.min(GW-1,x+1);
      const yt=Math.max(0,y-1), yb=Math.min(GH-1,y+1);
      const hl=height[y*GW+xl], hrr=height[y*GW+xr];
      const ht=height[yt*GW+x], hb=height[yb*GW+x];
      const nx=(hl-hrr)*zscale, ny=(ht-hb)*zscale, nz=1;
      const nl=Math.hypot(nx,ny,nz);
      let dot=(nx*Lx+ny*Ly+nz*Lz)/nl;
      hillshade[i]=Math.max(0,dot);
    }
  }

  // ---- rivers via flow accumulation (steepest descent) ----
  const order = new Int32Array(N);
  for(let i=0;i<N;i++) order[i]=i;
  order.sort((a,b)=> height[b]-height[a]);

  const flow = new Float32Array(N);
  const downTo = new Int32Array(N).fill(-1);
  for(let k=0;k<N;k++){
    const i=order[k];
    if(water[i]===1){ continue; }
    const x=i%GW, y=(i/GW)|0;
    const rain = 0.25 + moisture[i]*1.4 + Math.max(0,(height[i]-sea))*0.6;
    flow[i]+=rain;
    let best=-1, bestH=height[i];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const bx=x+dx, by=y+dy; if(bx<0||by<0||bx>=GW||by>=GH)continue;
      const j=by*GW+bx;
      if(height[j]<bestH){ bestH=height[j]; best=j; }
    }
    if(best>=0){ downTo[i]=best; flow[best]+=flow[i]; }
  }

  const riverThresh = 22 + (1-0.55)*70;
  const riverCells = new Float32Array(N);
  const onRiver = new Uint8Array(N);
  const rivers = [];
  function bigUpstream(i){
    const x=i%GW, y=(i/GW)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue; const bx=x+dx,by=y+dy; if(bx<0||by<0||bx>=GW||by>=GH)continue;
      const j=by*GW+bx; if(downTo[j]===i && flow[j]>=riverThresh) return true;
    }
    return false;
  }
  for(let k=0;k<N;k++){
    const i=order[k];
    if(water[i]) continue;
    if(flow[i] < riverThresh) continue;
    if(bigUpstream(i)) continue;
    const path=[]; let cur=i, guard=0, reachedWater=false, merged=false;
    while(cur>=0 && guard++<8000){
      const cx=cur%GW, cy=(cur/GW)|0;
      path.push([cx,cy,flow[cur]]);
      riverCells[cur]=Math.max(riverCells[cur],flow[cur]);
      if(water[cur]){ reachedWater=true; break; }
      if(onRiver[cur] && cur!==i){ merged=true; break; }
      onRiver[cur]=1;
      cur=downTo[cur];
    }
    if(path.length>=5 && (reachedWater||merged)){
      rivers.push(path);
    }
  }

  // ---- mountain peaks: local maxima, well spaced ----
  const peakCands=[];
  for(let y=2;y<GH-2;y++){
    for(let x=2;x<GW-2;x++){
      const i=y*GW+x;
      if(biome[i]<B.MTN_LOW) continue;
      const h=height[i];
      let isMax=true;
      for(let dy=-2;dy<=2 && isMax;dy++)for(let dx=-2;dx<=2;dx++){
        if(!dx&&!dy)continue; const j=(y+dy)*GW+(x+dx);
        if(height[j]>h){ isMax=false; break; }
      }
      if(!isMax) continue;
      peakCands.push({x,y,h,big:biome[i]>=B.MTN_HIGH});
    }
  }
  peakCands.sort((a,b)=> b.h-a.h || (a.y*GW+a.x)-(b.y*GW+b.x));
  const peaks=[]; const peakSep=2.2;
  for(const p of peakCands){
    let ok=true;
    for(const q of peaks){ const dx=q.x-p.x,dy=q.y-p.y; if(dx*dx+dy*dy<peakSep*peakSep){ok=false;break;} }
    if(ok) peaks.push(p);
  }

  // land fraction (for the twin's no-flood invariant)
  let landCount=0; for(let i=0;i<N;i++) if(!water[i]) landCount++;
  const landFraction = landCount/N;

  // ---- placement list — DETERMINISTIC ordered list of named features ----
  const topo = makeToponymy(seedStr);
  const placements = buildPlacements({GW,GH,water,biome,coastDist,flow},topo,rng);

  return {
    seed:seedStr, GW, GH, N, sea, landFraction,
    height, water, moisture, biome, hillshade, flow, coastDist, riverCells,
    rivers, peaks, blobs,
    labels: placements.labels,          // {x,y,text,kind}
    settlements: placements.settlements, // {x,y,name,port,capital}
    title: placements.title,
    landCells: landCount,
    reachableLandCells: landCount,       // (whole land is reachable — one sheet)
    topoFamily: topo.family
  };
}

/* Greedy, DETERMINISTIC placement — the ORDERED list the twin byte-compares.
   Order is fixed: title, then settlements (score desc, tie by cell index),
   then region labels, then range labels, then sea labels. */
function buildPlacements(f, topo, rng){
  const {GW,GH,water,biome,coastDist,flow}=f;
  const N=GW*GH;
  const labels=[]; const settlements=[];
  const labelDensity = 0.62;

  const title = topo.title();

  // settlements — coastal/riverside, greedy well-spread
  const targetSettlements = Math.round(4 + labelDensity*12);
  const candidates=[];
  for(let y=4;y<GH-4;y++){
    for(let x=4;x<GW-4;x++){
      const i=y*GW+x;
      if(water[i]) continue;
      const b=biome[i];
      if(b>=B.MTN_LOW) continue;
      const cd=coastDist[i];
      let score=0;
      if(cd<=2) score+=3; else if(cd<=6) score+=1.2;
      if(flow[i]>30) score += Math.min(2.5, flow[i]/60);
      if(b===B.GRASS||b===B.FOREST||b===B.SAVANNA) score+=1;
      if(b===B.DESERT||b===B.TUNDRA||b===B.SNOW) score-=1.2;
      score += rng()*0.8;
      if(score>1.4) candidates.push({x,y,score,i});
    }
  }
  // deterministic order: score desc, tie broken by cell index (stable)
  candidates.sort((a,b)=> b.score-a.score || a.i-b.i);
  const minSep = Math.max(12, GW*0.06);
  for(const c of candidates){
    if(settlements.length>=targetSettlements) break;
    let ok=true;
    for(const s of settlements){
      const dx=s.x-c.x, dy=s.y-c.y;
      if(dx*dx+dy*dy < minSep*minSep){ ok=false; break; }
    }
    if(ok){
      const port = coastDist[c.i]<=2;
      settlements.push({x:c.x,y:c.y, name:topo.hold(), port, capital: settlements.length===0});
    }
  }

  // region labels — interior land cells, greedy spread (deterministic shuffle)
  const targetRegions = Math.round(2 + labelDensity*4);
  const interior=[];
  for(let y=8;y<GH-8;y+=3)for(let x=8;x<GW-8;x+=3){
    const i=y*GW+x; if(water[i])continue; if(coastDist[i]<8)continue;
    if(biome[i]>=B.MTN_LOW)continue;
    interior.push({x,y});
  }
  shuffle(interior, rng);
  const regionSep=Math.max(40, GW*0.18);
  const regionPts=[];
  for(const p of interior){
    if(regionPts.length>=targetRegions)break;
    let ok=true;
    for(const r of regionPts){ const dx=r.x-p.x,dy=r.y-p.y; if(dx*dx+dy*dy<regionSep*regionSep){ok=false;break;} }
    if(ok) regionPts.push(p);
  }
  for(const p of regionPts) labels.push({x:p.x,y:p.y,text:topo.region(),kind:"region"});

  // range labels
  const mtnClusters = findClusters(biome, GW, GH, (b)=> b>=B.MTN_LOW, 30);
  mtnClusters.sort((a,b)=> b.size-a.size || (a.cy*GW+a.cx)-(b.cy*GW+b.cx));
  shuffle(mtnClusters, rng);
  const nMtn = Math.min(mtnClusters.length, Math.round(1+labelDensity*2));
  for(let i=0;i<nMtn;i++){ const c=mtnClusters[i]; labels.push({x:c.cx,y:c.cy,text:topo.range(),kind:"mountains"}); }

  // sea labels — biggest ocean regions
  const seaClusters = findClusters(water, GW, GH, (w)=> w===1, 400);
  seaClusters.sort((a,b)=> b.size-a.size || (a.cy*GW+a.cx)-(b.cy*GW+b.cx));
  const nSea = Math.min(seaClusters.length, Math.round(1+labelDensity*2));
  for(let i=0;i<nSea;i++){ const c=seaClusters[i]; labels.push({x:c.cx,y:c.cy,text:topo.sea(),kind:"sea"}); }

  return {labels, settlements, title};
}

/* A compact, byte-stable serialization of the ORDERED placement list — the
   thing the twin regenerates twice and compares char-for-char. Rounds coords to
   integers (grid cells) so it is exact. NOT shown to the visitor. */
function placementSignature(land){
  const rows=[];
  rows.push("T|"+land.title);
  for(const s of land.settlements) rows.push(`S|${s.x}|${s.y}|${s.capital?1:0}|${s.port?1:0}|${s.name}`);
  for(const l of land.labels) rows.push(`L|${l.kind}|${l.x}|${l.y}|${l.text}`);
  return rows.join("\n");
}

/* --- river monotonicity check (the twin's "rivers flow downhill to sea") --- */
function checkRivers(land){
  const {rivers,height,water,GW,GH}=land;
  let checked=0, violations=0, notEndingInSea=0;
  for(const path of rivers){
    checked++;
    // monotone non-increasing height along the path (steepest descent),
    // allowing equality (flats) but never an uphill step
    for(let k=1;k<path.length;k++){
      const [px,py]=path[k-1], [cx,cy]=path[k];
      const hp=height[py*GW+px], hc=height[cy*GW+cx];
      if(hc > hp + 1e-6) { violations++; break; }
    }
    // must end in a water cell OR merge into an on-river trunk that does;
    // by construction we only keep reachedWater||merged, so the last cell of a
    // reachedWater path is water. Verify at least the terminus is sane:
    const [ex,ey]=path[path.length-1];
    const endsWater = water[ey*GW+ex]!==0;
    // a merged river's last cell is the junction (land) — accept if its
    // downstream continues (it was on an existing trunk). We approximate the
    // merge case as valid; the strict test below counts only pure violations.
    if(!endsWater){
      // check the cell just past the terminus continues downhill toward water:
      notEndingInSea++;
    }
  }
  return {checked, violations, notEndingInSea};
}
/* ═══════════════════════════════════════════════════════════════════════════
   THE CARTOGRAPHER'S DREAM — land-render.mjs
   Renders the HIDDEN LAND (from core.mjs generateLand) ONCE per seed onto an
   offscreen canvas as a warm sepia ANTIQUE CHART. The lantern in the page only
   changes VISIBILITY through a mask — this canvas is drawn a single time and
   never redrawn while you explore. So exploring is cheap: the expensive chart
   is pre-baked; per-frame we only recompute the fog mask + frontier bloom.

   The chart is WARM parchment/sepia so that, revealed through the cool "un-inked
   vellum" fog, the contrast reads as an old sheet glowing under a lantern.

   API (installed on window for the page module; also importable for tests):
     renderLand(land, W, H, {nib}) -> { canvas, place(gx,gy), toScreen, sx, sy,
                                        mapX, mapY, mapW, mapH,
                                        labelLayout: [...],   // placed labels
                                        settleLayout: [...] } // placed settlements
   `nib` ∈ {'fine','bold'} chooses the DRAWING HAND (line weights / stipple),
   never the land. The label/settlement layout is returned so the page can drive
   the "names letter themselves in" beat against the SAME placed geometry.
   ═══════════════════════════════════════════════════════════════════════════ */

/* the warm antique-chart palette (sepia on aged vellum) */
const PAL = {
  paper: ["#e9d8b0", "#ddc79a"],
  deepOcean:"#c9d2b4", shallow:"#d6dcbe", lake:"#cdd6b6",
  beach:"#e6d4a6",
  grassland:"#d2c68a", forest:"#a9bd76", jungle:"#8fae62", savanna:"#d6c47e",
  desert:"#e6d296", taiga:"#a3b47c", tundra:"#c7c396", snow:"#efe8d2",
  mountainLow:"#c1aa76", mountainHigh:"#a88b5c", alpine:"#e7dfc7",
  coast:"#5a4526", river:"#6a5433", riverInk:"#4e3d22",
  ink:"#4a3718", inkSoft:"rgba(74,55,24,0.55)", label:"#3a2a12",
  seaLabel:"#6a5a3a", frameFill:"#f2e6c6",
  hill:0.55, hillCol:[70,50,22],
  waterHatch:"rgba(120,110,80,0.4)"
};

function clamp255(v){ return v<0?0:v>255?255:v; }
function boundary(a,b){
  if(a===0 && b===1) return true;
  if(a===2 && b===1) return true;
  if(a===0 && b===2) return true;
  return false;
}
function overlap(a,b){ return !(a.x+a.w<b.x||b.x+b.w<a.x||a.y+a.h<b.y||b.y+b.h<a.y); }

/* one cached paper-grain tile (deterministic) */
let _grain=null;
function grainTile(){
  if(_grain) return _grain;
  _grain=document.createElement('canvas'); _grain.width=_grain.height=200;
  const g=_grain.getContext('2d'); const im=g.createImageData(200,200); const d=im.data;
  const gr=makeRng("dream-paper-grain");
  for(let i=0;i<200*200;i++){ const v=(gr()*255)|0; const j=i*4; d[j]=d[j+1]=d[j+2]=v; d[j+3]=255; }
  g.putImageData(im,0,0); return _grain;
}

function renderLand(land, W, H, opts={}){
  const nib = opts.nib==='bold' ? 'bold' : 'fine';
  const {GW,GH,biome,height,hillshade,water,sea,coastDist,rivers,peaks,
         labels,settlements}=land;

  // fit the chart into the sheet with a margin, preserving grid aspect
  const margin = Math.round(Math.min(W,H)*0.045);
  const availW = W-margin*2, availH = H-margin*2;
  const gridAspect = GW/GH, availAspect = availW/availH;
  let mapW, mapH;
  if(availAspect > gridAspect){ mapH=availH; mapW=mapH*gridAspect; }
  else { mapW=availW; mapH=mapW/gridAspect; }
  const mapX = Math.round((W-mapW)/2), mapY = Math.round((H-mapH)/2);
  const sx = mapW/GW, sy = mapH/GH;
  const gx = (cx)=> mapX+cx*sx, gy=(cy)=> mapY+cy*sy;
  const toScreen = (cx,cy)=> [mapX+cx*sx, mapY+cy*sy];

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // ---- biome raster onto a GW×GH image, hillshaded, then scaled up ----
  const terr = document.createElement('canvas'); terr.width=GW; terr.height=GH;
  const tctx = terr.getContext('2d');
  const img = tctx.createImageData(GW,GH); const d=img.data;
  const biomeHex=[PAL.deepOcean,PAL.shallow,PAL.lake,PAL.beach,PAL.grassland,PAL.forest,
    PAL.jungle,PAL.savanna,PAL.desert,PAL.taiga,PAL.tundra,PAL.snow,
    PAL.mountainLow,PAL.mountainHigh,PAL.alpine];
  const cache={};
  const hex=(h)=>{ if(cache[h])return cache[h]; const n=parseInt(h.slice(1),16); const o=[(n>>16)&255,(n>>8)&255,n&255]; cache[h]=o; return o; };
  const reliefK=PAL.hill, [hr_,hg_,hb_]=PAL.hillCol;
  for(let i=0;i<GW*GH;i++){
    let c=hex(biomeHex[biome[i]]); let r=c[0],g=c[1],b=c[2];
    if(!water[i]){
      const hs=hillshade[i]; const shade=(hs-0.5)*2; const t=shade*reliefK;
      if(t<0){ const a=-t; r=clamp255(r*(1-a)+hr_*a); g=clamp255(g*(1-a)+hg_*a); b=clamp255(b*(1-a)+hb_*a); }
      else { const a=t*0.8; r=clamp255(r+(255-r)*a); g=clamp255(g+(255-g)*a); b=clamp255(b+(255-b)*a); }
    }
    const j=i*4; d[j]=r; d[j+1]=g; d[j+2]=b; d[j+3]=255;
  }
  tctx.putImageData(img,0,0);

  // paper backdrop + smoothed land
  const pg=ctx.createLinearGradient(mapX,mapY,mapX,mapY+mapH);
  pg.addColorStop(0,PAL.paper[0]); pg.addColorStop(1,PAL.paper[1]);
  ctx.fillStyle=pg; ctx.fillRect(mapX,mapY,mapW,mapH);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(terr, mapX, mapY, mapW, mapH);

  // water hatching near coasts (engraving feel)
  ctx.save(); ctx.beginPath(); ctx.rect(mapX,mapY,mapW,mapH); ctx.clip();
  ctx.strokeStyle=PAL.waterHatch; ctx.lineWidth=Math.max(0.4, sx*0.14);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const i=y*GW+x; if(water[i]!==1)continue; const cd=coastDist[i];
    if(cd<1||cd>5)continue; if(((x+y)%3)!==0)continue;
    const px=mapX+x*sx, py=mapY+y*sy; ctx.globalAlpha=(6-cd)/10;
    ctx.beginPath(); ctx.moveTo(px,py+sy*0.5); ctx.lineTo(px+sx*0.85,py+sy*0.5); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.restore();

  // paper grain
  ctx.save(); ctx.beginPath(); ctx.rect(mapX,mapY,mapW,mapH); ctx.clip();
  ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.08;
  ctx.fillStyle=ctx.createPattern(grainTile(),'repeat'); ctx.fillRect(mapX,mapY,mapW,mapH);
  ctx.restore();

  // ---- coastlines ----
  const coastLW = (nib==='bold'? 0.72:0.5);
  ctx.save(); ctx.strokeStyle=PAL.coast; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=Math.max(0.7, Math.min(sx,sy)*coastLW); ctx.beginPath();
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const i=y*GW+x; if(water[i]!==0 && water[i]!==2) continue;
    const px=mapX+x*sx, py=mapY+y*sy;
    if(x+1<GW && boundary(water[i],water[i+1])){ ctx.moveTo(px+sx,py); ctx.lineTo(px+sx,py+sy); }
    if(x>0 && boundary(water[i],water[i-1])){ ctx.moveTo(px,py); ctx.lineTo(px,py+sy); }
    if(y+1<GH && boundary(water[i],water[i+GW])){ ctx.moveTo(px,py+sy); ctx.lineTo(px+sx,py+sy); }
    if(y>0 && boundary(water[i],water[i-GW])){ ctx.moveTo(px,py); ctx.lineTo(px+sx,py); }
  }
  ctx.stroke(); ctx.restore();

  // ---- rivers ----
  if(rivers.length){
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    let maxF=1; for(const r of rivers){ const f=r[r.length-1][2]; if(f>maxF)maxF=f; }
    const widthK = nib==='bold'? 2.0:1.6;
    for(const path of rivers){
      if(path.length<2)continue;
      const pts=path.map(p=>({x:mapX+(p[0]+0.5)*sx,y:mapY+(p[1]+0.5)*sy,f:p[2]}));
      for(let i=0;i<pts.length-1;i++){
        const a=pts[i],b=pts[i+1]; const p0=pts[i-1]||a,p3=pts[i+2]||b;
        const c1x=a.x+(b.x-p0.x)/6,c1y=a.y+(b.y-p0.y)/6;
        const c2x=b.x-(p3.x-a.x)/6,c2y=b.y-(p3.y-a.y)/6;
        ctx.lineWidth=Math.max(0.55,0.5+Math.sqrt(a.f/maxF)*sx*widthK);
        ctx.strokeStyle=PAL.riverInk; ctx.globalAlpha=0.9;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(c1x,c1y,c2x,c2y,b.x,b.y); ctx.stroke();
      }
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  // ---- mountain glyphs (hand-drawn, back-to-front) ----
  if(peaks.length){
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    const u=Math.min(sx,sy); const ink=PAL.ink;
    const lit=PAL.frameFill, shadeC="rgba(70,52,24,0.42)";
    const sorted=peaks.slice().sort((a,b)=>a.y-b.y);
    for(const p of sorted){
      const px=mapX+(p.x+0.5)*sx, py=mapY+(p.y+0.5)*sy;
      const s=u*(p.big?3.0:2.1); const hgt=s*(p.big?1.35:1.1);
      const baseY=py+s*0.42, apexY=py-hgt+s*0.42, apexX=px; const ridgeX=px-s*0.16;
      ctx.beginPath(); ctx.moveTo(px-s,baseY); ctx.lineTo(apexX,apexY); ctx.lineTo(ridgeX,baseY); ctx.closePath();
      ctx.fillStyle=lit; ctx.globalAlpha=0.9; ctx.fill();
      ctx.beginPath(); ctx.moveTo(ridgeX,baseY); ctx.lineTo(apexX,apexY); ctx.lineTo(px+s,baseY); ctx.closePath();
      ctx.fillStyle=shadeC; ctx.globalAlpha=0.85; ctx.fill();
      ctx.globalAlpha=0.8; ctx.strokeStyle=ink; ctx.lineWidth=Math.max(0.5,u*(nib==='bold'?0.5:0.4));
      ctx.beginPath(); ctx.moveTo(px-s,baseY); ctx.lineTo(apexX,apexY); ctx.lineTo(px+s,baseY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(apexX,apexY); ctx.lineTo(ridgeX,baseY); ctx.stroke();
      if(p.big){
        const capY=apexY+hgt*0.30;
        ctx.beginPath(); ctx.moveTo(apexX,apexY);
        ctx.lineTo(apexX-(apexX-(px-s))*((capY-apexY)/(baseY-apexY)),capY);
        ctx.lineTo(ridgeX-(ridgeX-apexX)*0.4,capY-hgt*0.04);
        ctx.lineTo(apexX+(px+s-apexX)*((capY-apexY)/(baseY-apexY))*0.55,capY);
        ctx.closePath(); ctx.fillStyle="#f4efe0"; ctx.globalAlpha=0.92; ctx.fill();
      }
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  // ---- settlement dots (drawn now; names are traced in by the page) ----
  const settleLayout=[];
  ctx.save();
  for(const st of settlements){
    const px=gx(st.x+0.5), py=gy(st.y+0.5);
    const r=st.capital? Math.max(4,Math.min(sx,sy)*2.4):Math.max(2.6,Math.min(sx,sy)*1.7);
    ctx.beginPath(); ctx.fillStyle=PAL.frameFill; ctx.globalAlpha=0.85; ctx.arc(px,py,r+1.6,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    if(st.capital){
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fillStyle=PAL.ink; ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,r*0.45,0,Math.PI*2); ctx.fillStyle=PAL.frameFill; ctx.fill();
    } else { ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fillStyle=PAL.ink; ctx.fill(); }
    settleLayout.push({x:px, y:py, name:st.name, capital:st.capital, port:st.port, anchorCX:st.x, anchorCY:st.y});
  }
  ctx.restore();

  // ---- LABEL LAYOUT — placed here (greedy overlap avoidance), but the TEXT is
  //      NOT drawn onto the chart. The page traces each label in as its anchor
  //      cell is lit. We return the resolved geometry so the trace matches. ----
  const placed=[]; const labelLayout=[];
  const measurer = ctx; // reuse for measureText

  function sizeFor(kind){
    if(kind==='sea')       return {size:Math.max(13,Math.min(W,H)*0.028), font:'italic', family:'serif', color:PAL.seaLabel, letter:2.2, region:false};
    if(kind==='region')    return {size:Math.max(12,Math.min(W,H)*0.022), font:'', family:'serif', color:PAL.label, letter:2.6, region:true};
    if(kind==='mountains') return {size:Math.max(10,Math.min(W,H)*0.016), font:'italic', family:'serif', color:PAL.label, letter:1.4, region:false};
    return {size:Math.max(9,Math.min(W,H)*0.014), font:'', family:'serif', color:PAL.label, letter:0.6, region:false};
  }

  // settlement name labels (anchor at the dot)
  for(const st of settleLayout){
    const spec=sizeFor('settlement');
    const size=st.capital? spec.size*1.18 : spec.size;
    measurer.font=`${size}px ${spec.family}`;
    const tw=measurer.measureText(st.name).width + spec.letter*(st.name.length-1);
    const th=size*1.1;
    const cands=[[7,0,'left'],[-7,0,'right'],[0,-th,'center'],[0,th,'center'],[9,-th*0.6,'left']];
    let done=false;
    for(const [ox,oy,al] of cands){
      let lx=st.x+ox, ly=st.y+oy, left = al==='center'? lx-tw/2 : al==='right'? lx-tw : lx;
      const box={x:left-2,y:ly-th/2-1,w:tw+4,h:th+2};
      if(box.x<mapX+4||box.x+box.w>mapX+mapW-4||box.y<mapY+4||box.y+box.h>mapY+mapH-4) continue;
      if(placed.some(p=>overlap(box,p))) continue;
      placed.push(box);
      labelLayout.push({kind:'settlement', text:st.name, x:lx, y:ly, align:al, size, letter:spec.letter,
        font:spec.font, family:spec.family, color:spec.color, anchorCX:st.anchorCX, anchorCY:st.anchorCY,
        capital:st.capital, region:false});
      done=true; break;
    }
    // if it can't be placed, drop the name (dot remains) — never overlap
  }

  // area labels (region / mountains / sea) — anchored at the feature centroid
  for(const l of labels){
    const spec=sizeFor(l.kind);
    const size=spec.size;
    measurer.font=`${spec.font?spec.font+' ':''}${size}px ${spec.family}`;
    const tw=measurer.measureText(l.text).width + spec.letter*(l.text.length-1);
    const th=size*1.1;
    const cx=gx(l.x+0.5), cy=gy(l.y+0.5);
    const box={x:cx-tw/2-3,y:cy-th/2-2,w:tw+6,h:th+4};
    if(box.x<mapX+3||box.x+box.w>mapX+mapW-3||box.y<mapY+3||box.y+box.h>mapY+mapH-3) {
      // nudge inward if slightly off, else skip
      continue;
    }
    if(placed.some(p=>overlap(box,p))) continue;
    placed.push(box);
    labelLayout.push({kind:l.kind, text:l.text, x:cx, y:cy, align:'center', size, letter:spec.letter,
      font:spec.font, family:spec.family, color:spec.color, anchorCX:l.x, anchorCY:l.y, region:spec.region});
  }

  return { canvas, place:(cx,cy)=>[gx(cx),gy(cy)], toScreen, sx, sy,
           mapX, mapY, mapW, mapH, PAL, labelLayout, settleLayout };
}

if(typeof window!=='undefined'){ window.DreamLandRender = renderLand; window.DreamPAL = PAL; }
window.__DREAM_CORE = { generateLand };
</script>

<!-- Shared estate mute (WS.muted / WS.setMuted). -->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Shared estate-wide MUTE (the single key ws:pref:muted) ─────────────────
     House convention (DESIGNING.md): any page that makes sound reads/writes ONE
     shared key, so a visitor mutes once and it holds everywhere — and a mute
     toggled on another estate tab takes effect live. A page's audio gates on
     WS.muted(); a control writes via WS.setMuted(); WS.onMuteChange(fn) fires on
     any change (this tab OR another). */
  var MUTE_KEY = 'ws:pref:muted';
  var muteSubs = [];
  WS.muted = function () { return lsGet(MUTE_KEY) === '1'; };
  WS.setMuted = function (v) {
    var on = !!v;
    lsSet(MUTE_KEY, on ? '1' : '0');
    for (var i = 0; i < muteSubs.length; i++) {
      try { muteSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onMuteChange = function (fn) {
    if (typeof fn === 'function') muteSubs.push(fn);
  };
  // cross-tab: a mute set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== MUTE_KEY) return;
      var on = WS.muted();
      for (var i = 0; i < muteSubs.length; i++) {
        try { muteSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } },
    { id: 'light-mixer',    unlocked: function (s) {
        // earned by mastering every Feat of Light in the Hall of Mirrors (all 9)
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        for (var i = 0; i < f.length; i++) { if (!s.has('ws:flag:earned-' + f[i])) return false; }
        return true;
      } },

    /* reliquary (#399): read the Sealed Room's Diary to its end — the estate's
       found-diary mystery, solved across the Museum → Scytale → Card Catalog. An
       honest cross-link trophy: the Reliquary and the Undercroft share this ws
       engine. Predicate = the payoff key the Sealed Study sets on final solve. */
    { id: 'reliquary',      unlocked: function (s) { return s.has('ws:seen:reliquary-solved'); } },

    /* the-mere: the whole diary, read to its very last page — the memorial annex
       past the study's cold wall. The grand payoff of the Sealed Room's mystery,
       one clue and one chapter beyond the reliquary trophy above. Predicate = the
       grand key the annex sets on entry (guarded on the final chapter's witness). */
    { id: 'the-mere',       unlocked: function (s) { return s.has('ws:seen:the-mere'); } },

    /* ── The Constellation of Mastery (wave one) ────────────────────────────────
       A named group of secrets that reward what you CONQUERED, not merely what you
       wandered past. Each candle stands for a feat finished; the capstone lights
       only when all five are lit. Predicates are ids + fns ONLY — the names, badges,
       riddles, and prose live in undercroft/index.src.html (hidden-world content),
       so no secret prose leaks into a public trigger page. */

    /* m-keeper-of-tales: carried ALL THREE public Lantern tales to their ends.
       GATES the earned Keeper's Alcove (keeper.html). */
    { id: 'm-keeper-of-tales', unlocked: function (s) {
        return s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won');
      } },

    /* m-clean-sweep: a flawless ("clean") solve of all FOUR puzzle benches. */
    { id: 'm-clean-sweep', unlocked: function (s) {
        return s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean');
      } },

    /* m-held-the-line: outlasted the Swarm to the tenth wave (reachable; sits
       between survivor>=5 and rosette>=8 with no clash). */
    { id: 'm-held-the-line', unlocked: function (s) {
        return (+s.get('ws:best:swarm') || 0) >= 10;
      } },

    /* m-half-the-light: mastered at least FIVE of the nine Feats of Light. */
    { id: 'm-half-the-light', unlocked: function (s) {
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        return n >= 5;
      } },

    /* m-eleven-and-still: pushed every dial to eleven AND kept the long quiet. */
    { id: 'm-eleven-and-still', unlocked: function (s) {
        return s.has('ws:flag:eleven') && s.has('ws:flag:patience');
      } },

    /* m-grandmaster (capstone): the constellation's own rosette — lights only when
       all five mastery feats above are satisfied. Re-evaluates the RAW predicates
       against `s` (does NOT recurse through WS.unlocked). */
    { id: 'm-grandmaster', unlocked: function (s) {
        // 1) m-keeper-of-tales
        if (!(s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won'))) return false;
        // 2) m-clean-sweep
        if (!(s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean'))) return false;
        // 3) m-held-the-line
        if (!((+s.get('ws:best:swarm') || 0) >= 10)) return false;
        // 4) m-half-the-light
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        if (n < 5) return false;
        // 5) m-eleven-and-still
        if (!(s.has('ws:flag:eleven') && s.has('ws:flag:patience'))) return false;
        return true;
      } }
  ];

  /* lookup a secret row by id */
  function secretById(id) {
    for (var i = 0; i < WS.SECRETS.length; i++) {
      if (WS.SECRETS[i].id === id) return WS.SECRETS[i];
    }
    return null;
  }

  /* WS.unlocked(id, store): is secret <id> unlocked given a store? */
  WS.unlocked = function (id, store) {
    var m = secretById(id);
    return !!(m && store && store.ok && m.unlocked(store));
  };

  /* ── Cue machinery (`ws:ann:` announced-namespace) ────────────────────────── */

  /* WS.bootstrap(): on the FIRST EVER run on this origin (ws:ann:bootstrap absent),
     silently mark ws:ann:<id> for every CURRENTLY-satisfied secret, so a returning
     visitor who unlocked things before this feature existed gets NO cue spam. Then
     sets ws:ann:bootstrap. Idempotent. Must run before checkUnlocks. */
  WS.bootstrap = function () {
    if (lsGet('ws:ann:bootstrap') != null) return;
    var store = WS.store();
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (sec.unlocked(store)) lsSet('ws:ann:' + sec.id, String(Date.now()));
      }
    }
    lsSet('ws:ann:bootstrap', String(Date.now()));
  };

     announced (ws:ann:<id> absent), mark it announced and collect it. If any are
     fresh AND not opts.silent AND we're in a browser, renderCue(fresh, store).

  WS.checkUnlocks = function (opts) {
    opts = opts || {};
    var store = WS.store();
    var fresh = [];
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (!sec.unlocked(store)) continue;
        var ak = 'ws:ann:' + sec.id;
        if (lsGet(ak) != null) continue;
        lsSet(ak, String(Date.now()));
        fresh.push(sec.id);
      }
    }
    if (fresh.length && !opts.silent && root && root.document) {
      WS.renderCue(fresh, store);
    }
    return fresh;
  };

  /* WS.renderCue(ids, store): inject a tasteful candlelit toast. Spoiler-light &
     evocative — never names the secret. One toast even if several ids are fresh. */
  var CUE_STYLE_ID = 'wscue-style';
  WS.renderCue = function (ids, store) {
    if (!root || !root.document) return;
    var doc = root.document;
    var body = doc.body;
    if (!body) return;
    if (!store) store = WS.store();

    var reduce = false;
    try { reduce = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    // once-only scoped stylesheet
    if (!doc.getElementById(CUE_STYLE_ID)) {
      var st = doc.createElement('style');
      st.id = CUE_STYLE_ID;
      st.textContent =
        '.wscue{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);' +
        'z-index:2147483600;max-width:min(92vw,440px);box-sizing:border-box;' +
        'display:flex;align-items:flex-start;gap:13px;padding:16px 18px 16px 17px;' +
        'border-radius:14px;border:1px solid rgba(201,162,74,.34);' +
        'background:linear-gradient(180deg,rgba(19,20,28,.97),rgba(9,10,15,.98));' +
        'box-shadow:0 18px 54px -20px rgba(0,0,0,.85),0 0 64px -26px rgba(201,162,74,.6),' +
        'inset 0 1px 0 rgba(201,162,74,.10);' +
        'color:#e7e2d6;pointer-events:auto;opacity:0;' +
        'transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);' +
        'font-family:Georgia,"Times New Roman",serif;}' +
        '.wscue.wscue-in{opacity:1;transform:translateX(-50%) translateY(0);}' +
        '.wscue .wscue-rune{flex:0 0 auto;font-size:21px;line-height:1.2;color:#c9a24a;' +
        'text-shadow:0 0 16px rgba(201,162,74,.65);animation:wscue-flicker 3.4s ease-in-out infinite;}' +
        '.wscue .wscue-body{flex:1 1 auto;min-width:0;}' +
        '.wscue .wscue-kick{display:block;font:600 9.5px/1 ui-monospace,Menlo,monospace;' +
        'letter-spacing:.26em;text-transform:uppercase;color:#c9a24a;opacity:.72;margin-bottom:6px;}' +
        '.wscue .wscue-text{display:block;font-size:14.5px;line-height:1.5;color:#e7e2d6;}' +
        '.wscue .wscue-x{flex:0 0 auto;margin:-4px -4px 0 2px;padding:4px 7px;cursor:pointer;' +
        'background:none;border:none;color:#8a8472;font:600 15px/1 ui-monospace,Menlo,monospace;' +

<script>
'use strict';
/* ── Gate SFX: "nib" — the pen-scratch of ink being laid on vellum ──────────
   A short, dry, papery scratch grain played in overlapping bursts WHILE the
   lantern lights new cells. It is filtered noise (no tone, no click train) with
   a fast papery envelope; `param` (0..1 = how much new ground is being revealed)
   raises the brightness and rate a touch so a fast sweep sounds busier than a
   slow one, and it falls silent at rest.

   Deterministic (seeded), builds on the passed ctx (live OR OfflineAudioContext).
   Contract: Gate.sfx.nib({ ctx, dest, dur, when=0, seed=1, param }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
function _dreamMulberry(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};
window.Gate.sfx.nib = function ({ ctx, dest, dur, when = 0, seed = 1, param = 0.5 }) {
  var t0 = ctx.currentTime + when;
  var sr = ctx.sampleRate;
  var D = (dur && dur > 0) ? dur : 0.11;
  var p = Math.max(0, Math.min(1, param));
  var rng = _dreamMulberry((seed|0) || 1);

  // a short buffer of pink-ish noise (papery, not white/hissy)
  var len = Math.ceil(D * sr);
  var buf = ctx.createBuffer(1, len, sr);
  var ch = buf.getChannelData(0);
  var last = 0;
  for (var i = 0; i < len; i++) {
    var n = rng() * 2 - 1;
    last = last * 0.72 + n * 0.28;   // lowpass toward paper
    // grain sub-envelope: a few tiny scratches within the burst
    ch[i] = last;
  }
  var src = ctx.createBufferSource(); src.buffer = buf;

  // bandpass gives the dry "scritch"; center rises with param
  var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1400 + p * 2600;   // 1.4k..4k
  bp.Q.value = 0.7;
  var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;

  var g = ctx.createGain();
  var peak = 0.05 + p * 0.09;              // quiet; scales with activity
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + D);

  src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(dest);
  src.start(t0); src.stop(t0 + D + 0.02);
  return { stop: function (at) { try { g.gain.cancelScheduledValues(at); g.gain.setTargetAtTime(0, at, 0.02); } catch (e) {} } };
};
</script>
<script>
'use strict';
/* ── Gate SFX: "fwump" — a fresh sheet of vellum settling onto the table ────
   A soft low paper-thump with a brief airy flutter, played once when a new
   sheet is unrolled (reseal). Body = a fast-decaying low-noise thud; the airy
   flutter = a short high-passed noise swell. No tone, no click.
   Contract: Gate.sfx.fwump({ ctx, dest, dur, when=0, seed=1 }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
function _dreamMulberryF(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};
window.Gate.sfx.fwump = function ({ ctx, dest, dur, when = 0, seed = 7 }) {
  var t0 = ctx.currentTime + when;
  var sr = ctx.sampleRate;
  var D = (dur && dur > 0) ? dur : 0.5;
  var rng = _dreamMulberryF((seed|0) || 7);

  var len = Math.ceil(D * sr);
  var buf = ctx.createBuffer(1, len, sr);
  var ch = buf.getChannelData(0);
  var last = 0;
  for (var i = 0; i < len; i++) { var n = rng()*2-1; last = last*0.5 + n*0.5; ch[i] = last; }
  var src = ctx.createBufferSource(); src.buffer = buf;

  // LOW body — the settle thud
  var lp = ctx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(520, t0);
  lp.frequency.exponentialRampToValueAtTime(120, t0 + 0.28);
  var gBody = ctx.createGain();
  gBody.gain.setValueAtTime(0, t0);
  gBody.gain.linearRampToValueAtTime(0.32, t0 + 0.012);
  gBody.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.34);

  // AIRY flutter — the paper edge riffling
  var hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
  var gAir = ctx.createGain();
  gAir.gain.setValueAtTime(0, t0);
  gAir.gain.linearRampToValueAtTime(0.06, t0 + 0.03);
  gAir.gain.exponentialRampToValueAtTime(0.0006, t0 + D);

  var src2 = ctx.createBufferSource(); src2.buffer = buf;

  src.connect(lp); lp.connect(gBody); gBody.connect(dest);
  src2.connect(hp); hp.connect(gAir); gAir.connect(dest);
  src.start(t0); src.stop(t0 + D + 0.02);
  src2.start(t0); src2.stop(t0 + D + 0.02);
  return { stop:function(at){ try{ gBody.gain.setTargetAtTime(0,at,0.02); gAir.gain.setTargetAtTime(0,at,0.02);}catch(e){} } };
};
</script>
<script>
'use strict';
/* ── Gate SFX: "ting" — a small brass compass chime on bearing-lock ─────────
   A gentle struck-brass note (a soft bell) played once when the compass needle
   swings to true north and settles as you pause. Two detuned partials + a fast
   pluck envelope; warm, not glassy. No noise, no click.
   Contract: Gate.sfx.ting({ ctx, dest, dur, when=0, seed=3 }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};
window.Gate.sfx.ting = function ({ ctx, dest, dur, when = 0 }) {
  var t0 = ctx.currentTime + when;
  var D = (dur && dur > 0) ? dur : 0.7;

  var master = ctx.createGain();
  master.gain.value = 0.16;
  master.connect(dest);

  // a small warm brass chord: fundamental + a bright-ish partial, slightly detuned
  var partials = [
    { f: 784, g: 1.0,  dec: D },       // G5
    { f: 1174, g: 0.5, dec: D*0.7 },   // ~D6 partial

  }

};

<script type="module">

   dwells the fog erodes and the sepia chart shows through. Dwell = discovery.

     (1) DRAWN LAND — the pre-baked offscreen sepia chart (land-render.mjs),
         revealed through a mask built from the per-cell EXPOSURE field.
     (2) FOG — warm parchment under a cooler haze + grain, with a ghost "here be"
         flourish and a coiled sea-serpent drifting ONLY in still-unmapped WATER;
         they dissolve as you light them.
     (3) LANTERN POOL — a warm radial glow following the cursor, with a candle
         flicker; it is the MASK that reveals the land + erodes the fog.
