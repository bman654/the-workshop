<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slitherlink — a loop atelier</title>
<style>
  :root{
    /* ---- Graphite (default skin) — verbatim from Latch ---- */
    --bg:        #0c0c0f;
    --stage:     radial-gradient(1200px 800px at 56% 38%, #18181c 0%, #111114 68%, #0a0a0c 100%);
    --panel-bg:  rgba(20,20,24,0.88);
    --panel-edge:rgba(150,150,165,0.28);
    --ink:       #ededf2;
    --ink-dim:   #9a9aa6;
    --accent:    #c9a24a;            /* warm gilt */
    --accent-soft: rgba(201,162,74,0.16);
    --accent-ink: #16140d;
    --ok:  #7fd28a;
    --bad: #f08a7a;
    /* board surfaces */
    --board-bg:   #14141a;
    --cell-bg:    rgba(255,255,255,0.012);
    --dot:        rgba(170,170,185,0.55);
    --dot-on:     var(--accent);
    --line:       var(--accent);          /* a drawn loop segment */
    --line-soft:  rgba(201,162,74,0.5);
    --cross:      #6f6f7c;                 /* the ✕ glyph */
    --clue-ink:   #c9c9d2;
    --clue-done:  #5a5a64;                 /* dimmed when satisfied */
    --clue-over:  #f08a7a;                 /* warning when exceeded */
    --reveal-glow: rgba(201,162,74,0.55);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-clue: Georgia, "Times New Roman", serif;
  }
  /* ---- Blueprint skin (cyan-on-navy drafting) — verbatim from Latch ---- */
  body[data-skin="blueprint"]{
    --bg:#071726;
    --stage: radial-gradient(1200px 800px at 52% 36%, #0e2c45 0%, #0a2236 64%, #061521 100%);
    --panel-bg: rgba(8,30,48,0.9);
    --panel-edge: rgba(120,196,238,0.34);
    --ink:#dcf1ff; --ink-dim:#7fb3d6;
    --accent:#5fd0ff; --accent-soft: rgba(95,208,255,0.16); --accent-ink:#06223a;
    --ok:#7fe4d0; --bad:#ff9a8a;
    --board-bg: rgba(10,40,64,0.5);
    --cell-bg: rgba(120,196,238,0.025);
    --dot: rgba(120,196,238,0.5);
    --line:#5fd0ff; --line-soft:rgba(95,208,255,0.5);
    --cross:#5b86a8;
    --clue-ink:#bfe3fb; --clue-done:#4f7e9e; --clue-over:#ff9a8a;
    --reveal-glow: rgba(95,208,255,0.6);
  }
  /* ---- Parchment skin (warm paper + ink) — verbatim from Latch ---- */
  body[data-skin="parchment"]{
    --bg:#e8ddc4;
    --stage: radial-gradient(1200px 800px at 54% 36%, #f3ead2 0%, #e9dcbe 66%, #ddcfa8 100%);
    --panel-bg: rgba(247,239,221,0.92);
    --panel-edge: rgba(120,96,60,0.34);
    --ink:#3a2f1d; --ink-dim:#7a6a4c;
    --accent:#a8541f; --accent-soft: rgba(168,84,31,0.14); --accent-ink:#f7efdd;
    --ok:#4f7a3a; --bad:#b23a25;
    --board-bg: rgba(255,251,238,0.55);
    --cell-bg: rgba(120,96,60,0.02);
    --dot: rgba(120,96,60,0.5);
    --line:#a8541f; --line-soft:rgba(168,84,31,0.5);
    --cross:#b09a6e;
    --clue-ink:#5a4a2e; --clue-done:#b3a079; --clue-over:#b23a25;
    --reveal-glow: rgba(168,84,31,0.5);
  }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    transition: background .4s ease, color .4s ease;
  }
  #stage{
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    background:var(--stage); transition: background .4s ease;
    padding:22px 18px 60px;
  }
  .wrap{
    display:flex; gap:22px; align-items:flex-start;
    flex-wrap:wrap; justify-content:center; width:100%; max-width:1100px;
  }

  /* ----------------------------- Panel (Latch chrome) ----------------------------- */
  #panel{
    width:296px; flex:0 0 296px;
    background:var(--panel-bg);
    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:16px 16px 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    transition: background .4s ease, border-color .4s ease;
  }
  .topline{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  #panel h1{ font-size:23px; font-weight:700; letter-spacing:-0.4px; margin:0; }
  .links{ display:flex; gap:10px; align-items:baseline; white-space:nowrap; }
  .back{ font-size:11px; color:var(--accent); text-decoration:none; opacity:.85; }
  .back:hover{ opacity:1; text-decoration:underline; }
  .sub{ font-size:10px; color:var(--ink-dim); margin:3px 0 12px; letter-spacing:1.2px; text-transform:uppercase; }

  /* self-test chip */
  .selftest{ display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-family:var(--font-mono); padding:5px 9px; border-radius:8px;
    border:1px solid var(--panel-edge); background:rgba(255,255,255,0.02);
    color:var(--ink-dim); cursor:default; margin-bottom:14px; user-select:none; }
  .selftest.ok{ color:var(--ok); border-color:rgba(127,210,138,0.4); background:rgba(127,210,138,0.08); }
  .selftest.bad{ color:var(--bad); border-color:rgba(240,138,122,0.5); background:rgba(240,138,122,0.1); }
  .selftest .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .row{ margin-bottom:12px; }
  .row > label{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.4px; text-transform:uppercase; }

  /* segmented control */
  .seg{ display:flex; gap:4px; background:rgba(0,0,0,0.18); border:1px solid var(--panel-edge);
    border-radius:9px; padding:4px; }
  .seg button{ flex:1 1 0; min-width:0; border:none; background:transparent; color:var(--ink-dim);
    font-size:11.5px; padding:7px 4px; border-radius:6px; cursor:pointer; transition:.15s;
    font-family:var(--font-ui); letter-spacing:.2px; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .seg button:not(.active):hover{ color:var(--ink); background:rgba(255,255,255,0.05); }

  .seedrow{ display:flex; gap:7px; }
  .seedrow input[type=text]{ flex:1; min-width:0; background:rgba(0,0,0,0.2);
    border:1px solid var(--panel-edge); color:var(--ink); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:var(--font-mono); letter-spacing:.5px; }
  .seedrow input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .iconbtn{ flex:0 0 auto; width:38px; border:1px solid var(--panel-edge); border-radius:8px;
    background:rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; font-size:16px; line-height:1; }
  .iconbtn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .actions button{ border:1px solid var(--panel-edge); border-radius:9px; padding:9px 8px;
    background:rgba(255,255,255,0.03); color:var(--ink); cursor:pointer; font-size:12.5px;
    font-weight:600; transition:.15s; letter-spacing:.2px; font-family:var(--font-ui); }
  .actions button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .actions button.wide{ grid-column:1 / -1; }
  .actions button:disabled{ opacity:.4; cursor:default; }

  .caption{ font-size:11px; color:var(--ink-dim); margin-top:14px; line-height:1.6; letter-spacing:.2px; }
  .caption b{ color:var(--ink); font-weight:600; }
  .caption .mono{ font-family:var(--font-mono); color:var(--accent); }
  .stat{ font-family:var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums; }

  /* ----------------------------- Board ----------------------------- */
  #boardWrap{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; min-width:0; }
  #boardOuter{ position:relative; border-radius:12px; padding:14px;
    background:var(--board-bg); border:1px solid var(--panel-edge);
    transition: background .4s ease, border-color .4s ease; }
  svg#board{ display:block; user-select:none; -webkit-user-select:none; touch-action:none; }

  /* SVG element styles (driven by classes toggled in JS) */
  .cellbg{ fill:var(--cell-bg); }
  .dot{ fill:var(--dot); transition: fill .2s; }
  .clue{ font-family:var(--font-clue); fill:var(--clue-ink); text-anchor:middle;
    dominant-baseline:central; transition: fill .2s, opacity .6s; pointer-events:none; }
  .clue.done{ fill:var(--clue-done); }
  .clue.over{ fill:var(--clue-over); font-weight:700; }

  .hit{ stroke:transparent; fill:transparent; cursor:pointer; }
  /* a drawn loop segment */
  .seg-line{ stroke:var(--line); stroke-width:4; stroke-linecap:round; opacity:0;
    transition: opacity .12s ease; pointer-events:none;
    filter: drop-shadow(0 0 3px var(--line-soft)); }
  .edge.on .seg-line{ opacity:1; }
  /* a crossed-out edge (small ✕ at midpoint) */
  .seg-cross{ stroke:var(--cross); stroke-width:2; stroke-linecap:round; opacity:0;
    transition: opacity .12s ease; pointer-events:none; }
  .edge.cross .seg-cross{ opacity:.85; }
  /* contradiction flash */
  .edge.err .seg-line, .edge.err .seg-cross{ stroke:var(--bad); opacity:1; }
  .edge.err{ animation: eshake .4s ease; }
  /* hint pop */
  .edge.hintpop .seg-line, .edge.hintpop .seg-cross{ animation: hpop .55s ease; }
  /* over-degree dot flag */
  .dot.bad{ fill:var(--bad); }
  @keyframes eshake{ 0%,100%{ transform:translate(0,0) } 25%{ transform:translate(-1.5px,0) } 75%{ transform:translate(1.5px,0) } }
  @keyframes hpop{ 0%{ transform:scale(.2) } 60%{ transform:scale(1.25) } 100%{ transform:scale(1) } }

  /* win reveal */
  #boardOuter.won svg#board{ cursor:default; }
  #boardOuter.won .edge.on .seg-line{
    stroke-width:5;
    filter: drop-shadow(0 0 9px var(--reveal-glow)) drop-shadow(0 0 3px var(--reveal-glow));
    animation: bloom .7s ease backwards;
  }
  #boardOuter.won .edge.cross .seg-cross{ opacity:0; }
  #boardOuter.won .clue{ opacity:.16; }
  @keyframes bloom{ from{ opacity:.2 } to{ opacity:1 } }

  .verdict{ min-height:30px; margin-top:16px; text-align:center; font-size:15px; letter-spacing:.3px;
    opacity:0; transition:opacity .4s ease; }
  .verdict.show{ opacity:1; }
  .verdict .name{ color:var(--accent); font-weight:700; }
  .verdict .small{ display:block; font-size:11px; color:var(--ink-dim); margin-top:3px; letter-spacing:.4px; }

  @media (max-width:720px){
    .wrap{ flex-direction:column; align-items:center; }
    #panel{ width:100%; max-width:360px; flex:none; }
  }
</style>
</head>
<body data-skin="graphite">
<div id="stage">
  <div class="wrap">
    <!-- ----------------------------- PANEL ----------------------------- -->
    <div id="panel">
      <div class="topline">
        <h1>Slitherlink</h1>
        <div class="links">
          <a class="back" href="index.html">↗ Latch</a>
          <a class="back" href="akari.html">↗ Akari</a>
          <a class="back" href="../index.html">← workshop</a>
        </div>
      </div>
      <div class="sub">a loop atelier</div>

      <div id="selftest" class="selftest" title="Built-in logic verifier"><span class="dot"></span><span id="stText">running self-test…</span></div>

      <div class="row">
        <label>Size</label>
        <div class="seg" id="sizeSeg">
          <button data-size="5" class="active">Tiny · 5</button>
          <button data-size="7">Classic · 7</button>
          <button data-size="10">Big · 10</button>
        </div>
      </div>

      <div class="row">
        <label>Seed</label>
        <div class="seedrow">
          <input type="text" id="seedInput" spellcheck="false" autocomplete="off">
          <button class="iconbtn" id="diceBtn" title="New random puzzle">⚄</button>
        </div>
      </div>

      <div class="row">
        <label>Skin</label>
        <div class="seg" id="skinSeg">
          <button data-skin="graphite" class="active">Graphite</button>
          <button data-skin="blueprint">Blueprint</button>
          <button data-skin="parchment">Parchment</button>
        </div>
      </div>

      <div class="actions">
        <button id="hintBtn">Hint</button>
        <button id="checkBtn">Check</button>
        <button id="resetBtn">Reset</button>
        <button id="revealBtn">Reveal</button>
        <button id="newBtn" class="wide">New puzzle ⟳</button>
      </div>

      <div class="caption" id="caption"></div>
    </div>

    <!-- ----------------------------- BOARD ----------------------------- -->
    <div id="boardWrap">
      <div id="boardOuter">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===========================================================================
   SLITHERLINK — a generative loop-the-loop (Fences) atelier.

   The workshop crux (sibling to Latch): every puzzle it hands you is PROVABLY
   solvable by PURE LOGIC alone (no guessing) and has EXACTLY ONE solution — a
   single closed loop — proven, not asserted, by two independent engines that
   run before any puzzle is shipped:
     (a) a sound constraint-propagation LOGIC SOLVER (never guesses), and
     (b) an independent BRUTE-FORCE solution counter (the second witness).

   GRID MODEL
   ----------
   R×C cells; (R+1)×(C+1) dots; dot(dr,dc) = dr*(C+1)+dc.
   Horizontal edges hId(dr,dc)=dr*C+dc          (dr∈[0..R], dc∈[0..C-1]).
   Vertical   edges vId(dr,dc)=NH+dr*(C+1)+dc    (dr∈[0..R-1], dc∈[0..C]).
   Edge state: 0 UNKNOWN, 1 LINE (in the loop), 2 CROSS (asserted not-in-loop).
   ======================================================================== */

const UNKNOWN = 0, LINE = 1, CROSS = 2;

/* ----------------------------- geometry ----------------------------- */
function makeGeom(R, C) {
  const NH = (R + 1) * C;
  const NV = R * (C + 1);
  const NE = NH + NV;
  const ND = (R + 1) * (C + 1);
  const dot = (dr, dc) => dr * (C + 1) + dc;
  const hId = (dr, dc) => dr * C + dc;
  const vId = (dr, dc) => NH + dr * (C + 1) + dc;

  const cellEdges = new Array(R * C);
  for (let r = 0; r < R; r++)
    for (let c = 0; c < C; c++)
      cellEdges[r * C + c] = [hId(r, c), hId(r + 1, c), vId(r, c), vId(r, c + 1)]; // top,bottom,left,right

  const edgeDots = new Array(NE);
  for (let dr = 0; dr <= R; dr++)
    for (let dc = 0; dc < C; dc++)
      edgeDots[hId(dr, dc)] = [dot(dr, dc), dot(dr, dc + 1)];
  for (let dr = 0; dr < R; dr++)
    for (let dc = 0; dc <= C; dc++)
      edgeDots[vId(dr, dc)] = [dot(dr, dc), dot(dr + 1, dc)];

  const dotEdges = new Array(ND);
  for (let i = 0; i < ND; i++) dotEdges[i] = [];
  for (let e = 0; e < NE; e++) { const [a, b] = edgeDots[e]; dotEdges[a].push(e); dotEdges[b].push(e); }

  return { R, C, NH, NV, NE, ND, dot, hId, vId, cellEdges, edgeDots, dotEdges };
}

/* ===========================================================================
   VALIDITY HELPERS (reused by solver, tests, win-check)
   ======================================================================== */
function isSingleLoop(geom, edgeSet) {
  const { NE, ND, edgeDots, dotEdges } = geom;
  const deg = new Int32Array(ND);
  let lineCount = 0;
  for (let e = 0; e < NE; e++) if (edgeSet[e] === LINE) { lineCount++; deg[edgeDots[e][0]]++; deg[edgeDots[e][1]]++; }
  if (lineCount === 0) return false;
  let start = -1;
  for (let d = 0; d < ND; d++) { if (deg[d] !== 0 && deg[d] !== 2) return false; if (deg[d] === 2 && start === -1) start = d; }
  if (start === -1) return false;
  const usedEdge = new Uint8Array(NE);
  let cur = start, walked = 0;
  while (true) {
    let next = -1; const inc = dotEdges[cur];
    for (let i = 0; i < inc.length; i++) { const e = inc[i]; if (edgeSet[e] === LINE && !usedEdge[e]) { next = e; break; } }
    if (next === -1) break;
    usedEdge[next] = 1; walked++;
    const [a, b] = edgeDots[next];
    cur = (a === cur) ? b : a;
    if (cur === start) break;
  }
  return cur === start && walked === lineCount;
}

function cluesSatisfied(geom, edgeSet, clues) {
  const { R, C, cellEdges } = geom;
  for (let i = 0; i < R * C; i++) {
    const cl = clues[i]; if (cl < 0) continue;
    const es = cellEdges[i]; let k = 0;
    for (let j = 0; j < 4; j++) if (edgeSet[es[j]] === LINE) k++;
    if (k !== cl) return false;
  }
  return true;
}
function isValidSolution(geom, edgeSet, clues) { return isSingleLoop(geom, edgeSet) && cluesSatisfied(geom, edgeSet, clues); }

/* union-find over dots (for the no-premature-closure rule) */
function makeDSU(n) {
  const parent = new Int32Array(n);
  for (let i = 0; i < n; i++) parent[i] = i;
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b) { a = find(a); b = find(b); if (a !== b) parent[a] = b; }
  return { find, union };
}

/* ===========================================================================
   LOGIC SOLVER — sound deduction only, never guesses.
   Returns { state:Uint8Array(NE), ok:bool, solved:bool }.
   ======================================================================== */
function logicSolve(geom, clues, initial) {
  const { R, C, NE, ND, cellEdges, edgeDots, dotEdges } = geom;
  const state = initial ? Uint8Array.from(initial) : new Uint8Array(NE);
  let ok = true;

  function setEdge(e, val) {
    if (state[e] === val) return false;
    if (state[e] !== UNKNOWN) { ok = false; return false; }
    state[e] = val; return true;
  }

  let changed = true, guard = 0;
  const guardMax = NE * 6 + 64;
  while (changed && ok) {
    changed = false;
    if (++guard > guardMax) break;

    /* RULE A — clue saturation */
    for (let i = 0; i < R * C && ok; i++) {
      const cl = clues[i]; if (cl < 0) continue;
      const es = cellEdges[i]; let line = 0, cross = 0;
      for (let j = 0; j < 4; j++) { const s = state[es[j]]; if (s === LINE) line++; else if (s === CROSS) cross++; }
      const unk = 4 - line - cross;
      if (line > cl) { ok = false; break; }
      if (line + unk < cl) { ok = false; break; }
      if (line === cl && unk > 0) { for (let j = 0; j < 4; j++) if (state[es[j]] === UNKNOWN && setEdge(es[j], CROSS)) changed = true; }
      else if (line + unk === cl && unk > 0) { for (let j = 0; j < 4; j++) if (state[es[j]] === UNKNOWN && setEdge(es[j], LINE)) changed = true; }
    }
    if (!ok) break;

    /* RULE B — dot-degree (vertex) rules */
    for (let d = 0; d < ND && ok; d++) {
      const inc = dotEdges[d]; let line = 0, unkCount = 0;
      for (let i = 0; i < inc.length; i++) { const s = state[inc[i]]; if (s === LINE) line++; else if (s === UNKNOWN) unkCount++; }
      if (line > 2) { ok = false; break; }
      if (line === 2 && unkCount > 0) { for (let i = 0; i < inc.length; i++) if (state[inc[i]] === UNKNOWN && setEdge(inc[i], CROSS)) changed = true; }
      else if (line === 1 && unkCount === 1) { for (let i = 0; i < inc.length; i++) if (state[inc[i]] === UNKNOWN && setEdge(inc[i], LINE)) changed = true; }
      else if (line === 0 && unkCount === 1) { for (let i = 0; i < inc.length; i++) if (state[inc[i]] === UNKNOWN && setEdge(inc[i], CROSS)) changed = true; }
    }
    if (!ok) break;

    /* RULE C — no-premature-closure (connectivity) */
    {
      let lineEdgeCount = 0;
      for (let e = 0; e < NE; e++) if (state[e] === LINE) lineEdgeCount++;
      if (lineEdgeCount > 0) {
        const dsu = makeDSU(ND);
        for (let e = 0; e < NE; e++) if (state[e] === LINE) { const [a, b] = edgeDots[e]; dsu.union(a, b); }
        const compEdges = new Map();
        for (let e = 0; e < NE; e++) if (state[e] === LINE) { const root = dsu.find(edgeDots[e][0]); compEdges.set(root, (compEdges.get(root) || 0) + 1); }
        for (let e = 0; e < NE && ok; e++) {
          if (state[e] !== UNKNOWN) continue;
          const [a, b] = edgeDots[e]; const ra = dsu.find(a), rb = dsu.find(b);
          if (ra === rb) {
            const inThis = compEdges.get(ra) || 0;
            if (inThis < lineEdgeCount) { if (setEdge(e, CROSS)) changed = true; } // closing would orphan other LINE edges
          }
        }
      }
    }
  }

  let solved = ok;
  if (ok) for (let e = 0; e < NE; e++) if (state[e] === UNKNOWN) { solved = false; break; }
  return { state, ok, solved };
}

/* ===========================================================================
   PRNG (mulberry32 + xmur3 — same family as Latch)
   ======================================================================== */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return h >>> 0; };
}
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function makeRng(seedStr) { const s = xmur3(String(seedStr)); return mulberry32(s()); }

/* ===========================================================================
   GENERATOR — a random simply-connected region; its perimeter = the loop.
   ======================================================================== */
function regionPerimeter(geom, region) {
  const { R, C, NE, hId, vId } = geom;
  // NB: coerce to a real boolean — region[i] is a Uint8 (0/1) while the bounds
  // guard yields `false`; `0 !== false` under strict compare would falsely flag
  // a perimeter edge. Always return true/false.
  const inR = (r, c) => (r >= 0 && r < R && c >= 0 && c < C && region[r * C + c] === 1);
  const edgeSet = new Uint8Array(NE);
  for (let dr = 0; dr <= R; dr++) for (let dc = 0; dc < C; dc++) if (inR(dr - 1, dc) !== inR(dr, dc)) edgeSet[hId(dr, dc)] = LINE;
  for (let dr = 0; dr < R; dr++) for (let dc = 0; dc <= C; dc++) if (inR(dr, dc - 1) !== inR(dr, dc)) edgeSet[vId(dr, dc)] = LINE;
  return edgeSet;
}

// A "pinch" is an interior dot around which exactly two DIAGONALLY-OPPOSITE
// cells are in the region. The perimeter then self-touches (degree 4) → a
// figure-eight, NOT a single loop. Returns true if the region has NO pinch.
function regionNoPinch(geom, region) {
  const { R, C } = geom;
  const inR = (r, c) => (r >= 0 && r < R && c >= 0 && c < C && region[r * C + c] === 1);
  for (let dr = 1; dr < R; dr++) for (let dc = 1; dc < C; dc++) {
    const tl = inR(dr - 1, dc - 1), tr = inR(dr - 1, dc), bl = inR(dr, dc - 1), br = inR(dr, dc);
    if ((tl && br && !tr && !bl) || (tr && bl && !tl && !br)) return false;
  }
  return true;
}

// Simply connected: one 4-connected blob with no holes (the complement,
// including the outside, is one 4-connected piece reachable from the border).
function regionSimplyConnected(geom, region) {
  const { R, C } = geom;
  const idx = (r, c) => r * C + c;
  let count = 0, seed = -1;
  for (let i = 0; i < R * C; i++) if (region[i]) { count++; if (seed < 0) seed = i; }
  if (count === 0) return false;
  { // one blob
    const seen = new Uint8Array(R * C); const stack = [seed]; seen[seed] = 1; let reached = 1;
    while (stack.length) {
      const cur = stack.pop(); const r = (cur / C) | 0, c = cur % C;
      const nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
      for (const [nr, nc] of nb) { if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue; const ni = idx(nr, nc); if (region[ni] && !seen[ni]) { seen[ni] = 1; reached++; stack.push(ni); } }
    }
    if (reached !== count) return false;
  }
  { // no holes
    const nonCount = R * C - count; if (nonCount === 0) return true;
    const seen = new Uint8Array(R * C); const stack = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (r === 0 || r === R - 1 || c === 0 || c === C - 1) { const i = idx(r, c); if (!region[i] && !seen[i]) { seen[i] = 1; stack.push(i); } }
    let reached = stack.length;
    while (stack.length) {
      const cur = stack.pop(); const r = (cur / C) | 0, c = cur % C;
      const nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
      for (const [nr, nc] of nb) { if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue; const ni = idx(nr, nc); if (!region[ni] && !seen[ni]) { seen[ni] = 1; reached++; stack.push(ni); } }
    }
    if (reached !== nonCount) return false; // an interior hole exists
  }
  return true;
}

// Grow a random simply-connected, pinch-free region of ~`target` cells.
function growRegion(geom, rng, target) {
  const { R, C } = geom;
  const region = new Uint8Array(R * C);
  const sr = Math.min(R - 1, Math.max(0, ((R / 2) | 0) + (rng() < 0.5 ? 0 : -1)));
  const sc = Math.min(C - 1, Math.max(0, ((C / 2) | 0) + (rng() < 0.5 ? 0 : -1)));
  region[sr * C + sc] = 1; let size = 1;
  let attempts = 0; const maxAttempts = R * C * 40;
  while (size < target && attempts < maxAttempts) {
    attempts++;
    const frontier = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      if (region[r * C + c]) continue;
      if ((r > 0 && region[(r - 1) * C + c]) || (r < R - 1 && region[(r + 1) * C + c]) ||
        (c > 0 && region[r * C + c - 1]) || (c < C - 1 && region[r * C + c + 1])) frontier.push(r * C + c);
    }
    if (frontier.length === 0) break;
    const pick = frontier[(rng() * frontier.length) | 0];
    region[pick] = 1;
    if (regionSimplyConnected(geom, region) && regionNoPinch(geom, region)) size++;
    else region[pick] = 0;
  }
  return { region, size };
}

function cluesFromLoop(geom, edgeSet) {
  const { R, C, cellEdges } = geom;
  const clues = new Int8Array(R * C);
  for (let i = 0; i < R * C; i++) { const es = cellEdges[i]; let k = 0; for (let j = 0; j < 4; j++) if (edgeSet[es[j]] === LINE) k++; clues[i] = k; }
  return clues;
}
function loopsEqual(geom, a, b) { for (let e = 0; e < geom.NE; e++) { if ((a[e] === LINE) !== (b[e] === LINE)) return false; } return true; }

// Remove clues (seeded order) while the puzzle stays uniquely logic-solvable
// to exactly `loop`. Yields a minimal-ish, guaranteed logic-solvable puzzle.
function reduceClues(geom, rng, fullClues, loop) {
  const { R, C } = geom;
  const clues = Int8Array.from(fullClues);
  const order = []; for (let i = 0; i < R * C; i++) order.push(i);
  for (let i = order.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = order[i]; order[i] = order[j]; order[j] = t; }
  for (const cell of order) {
    const saved = clues[cell]; if (saved < 0) continue;
    clues[cell] = -1;
    const res = logicSolve(geom, clues, null);
    if (!(res.ok && res.solved && loopsEqual(geom, res.state, loop))) clues[cell] = saved;
  }
  return clues;
}

// Generate deterministically. Returns { R,C,seed,geom,loop,clues,fullClues,regionSize,fallback }.
function generatePuzzle(seed, R, C) {
  const geom = makeGeom(R, C);
  const rng = makeRng(seed + "|" + R + "x" + C);
  const cells = R * C;
  const MAX_TRIES = 24;
  for (let attempt = 0; attempt < MAX_TRIES; attempt++) {
    const frac = 0.35 + rng() * 0.30; // 35%..65%
    let target = Math.max(2, Math.round(cells * frac));
    target = Math.min(target, cells - 1); if (target < 2) target = 2;
    const { region, size } = growRegion(geom, rng, target);
    if (size < 2) continue;
    if (!regionSimplyConnected(geom, region)) continue;
    const loop = regionPerimeter(geom, region);
    if (!isSingleLoop(geom, loop)) continue;
    const fullClues = cluesFromLoop(geom, loop);
    const full = logicSolve(geom, fullClues, null);
    if (!(full.ok && full.solved && loopsEqual(geom, full.state, loop))) continue;
    const clues = reduceClues(geom, rng, fullClues, loop);
    const res = logicSolve(geom, clues, null);
    if (res.ok && res.solved && loopsEqual(geom, res.state, loop))
      return { R, C, seed, geom, loop, clues, fullClues, regionSize: size, fallback: false };
  }
  return fallbackPuzzle(seed, R, C, geom);
}

function fallbackPuzzle(seed, R, C, geom) {
  const region = new Uint8Array(R * C);
  const rr = Math.max(1, (R / 3) | 0), cc = Math.max(1, (C / 3) | 0);
  const r0 = ((R - rr) / 2) | 0, c0 = ((C - cc) / 2) | 0;
  for (let r = r0; r < r0 + rr; r++) for (let c = c0; c < c0 + cc; c++) region[r * C + c] = 1;
  const loop = regionPerimeter(geom, region);
  const fullClues = cluesFromLoop(geom, loop);
  return { R, C, seed, geom, loop, clues: fullClues, fullClues, regionSize: rr * cc, fallback: true };
}

/* ===========================================================================
   INDEPENDENT BRUTE-FORCE SOLUTION COUNTER (the second witness).
   Exhaustive DFS over edges in DOT-MAJOR order with O(1)-incremental degree +
   clue maintenance, INDEPENDENT of logicSolve. At a leaf it accepts iff the
   isSingleLoop + cluesSatisfied helpers agree. Returns the solution count
   (capped at `cap`; cap=1 distinguishes exactly-1 from ≥2). Small boards only.
   ======================================================================== */
function bruteCountSolutions(geom, clues, cap) {
  const { NE, ND, R, C, edgeDots, cellEdges, dotEdges } = geom;
  const order = []; const placed = new Uint8Array(NE);
  for (let d = 0; d < ND; d++) { const inc = dotEdges[d]; for (let i = 0; i < inc.length; i++) { const e = inc[i]; if (!placed[e]) { placed[e] = 1; order.push(e); } } }
  const posOf = new Int32Array(NE); for (let i = 0; i < order.length; i++) posOf[order[i]] = i;
  const dotsFinalAt = Array.from({ length: order.length }, () => []);
  for (let d = 0; d < ND; d++) { let last = -1; const inc = dotEdges[d]; for (let i = 0; i < inc.length; i++) last = Math.max(last, posOf[inc[i]]); dotsFinalAt[last].push(d); }
  const cluesFinalAt = Array.from({ length: order.length }, () => []);
  for (let i = 0; i < R * C; i++) { if (clues[i] < 0) continue; const es = cellEdges[i]; let last = -1; for (let j = 0; j < 4; j++) last = Math.max(last, posOf[es[j]]); cluesFinalAt[last].push(i); }

  const state = new Uint8Array(NE), dotDeg = new Int32Array(ND), cellLine = new Int32Array(R * C);
  let count = 0;
  const edgeCells = new Array(NE); for (let e = 0; e < NE; e++) edgeCells[e] = [];
  for (let i = 0; i < R * C; i++) { const es = cellEdges[i]; for (let j = 0; j < 4; j++) edgeCells[es[j]].push(i); }

  // place applies the FULL incremental update (never short-circuits midway) so
  // the matching unplace always restores exactly — a partial update would
  // corrupt the shared dotDeg/cellLine across sibling branches.
  function place(pos, val) {
    const e = order[pos]; state[e] = val;
    if (val !== LINE) return true;
    const [a, b] = edgeDots[e]; dotDeg[a]++; dotDeg[b]++;
    let okp = (dotDeg[a] <= 2 && dotDeg[b] <= 2);
    const cb = edgeCells[e];
    for (let i = 0; i < cb.length; i++) { const ci = cb[i]; if (clues[ci] >= 0) { cellLine[ci]++; if (cellLine[ci] > clues[ci]) okp = false; } }
    return okp;
  }
  function unplace(pos, val) {
    const e = order[pos]; state[e] = UNKNOWN;
    if (val !== LINE) return;
    const [a, b] = edgeDots[e]; dotDeg[a]--; dotDeg[b]--;
    const cb = edgeCells[e];
    for (let i = 0; i < cb.length; i++) { const ci = cb[i]; if (clues[ci] >= 0) cellLine[ci]--; }
  }
  function finalsOk(pos) {
    const ds = dotsFinalAt[pos];
    for (let i = 0; i < ds.length; i++) { const dg = dotDeg[ds[i]]; if (dg !== 0 && dg !== 2) return false; }
    const cs = cluesFinalAt[pos];
    for (let i = 0; i < cs.length; i++) { const ci = cs[i]; if (cellLine[ci] !== clues[ci]) return false; }
    return true;
  }
  function rec(pos) {
    if (count > cap) return;
    if (pos === order.length) { if (isSingleLoop(geom, state) && cluesSatisfied(geom, state, clues)) count++; return; }
    if (place(pos, CROSS)) { if (finalsOk(pos)) rec(pos + 1); } unplace(pos, CROSS);
    if (count > cap) return;
    if (place(pos, LINE)) { if (finalsOk(pos)) rec(pos + 1); } unplace(pos, LINE);
  }
  rec(0);
  return count;
}

/* ===========================================================================
   THE SELF-TEST — runs on load; flips the chip green only if all pass.
   ======================================================================== */
function runSelfTest() {
  const checks = [];

  /* Check 1 — logic-solver soundness on hand-crafted tiny boards */
  let c1 = true; const c1notes = [];
  function expectForced(geom, clues, asserts, note) {
    const r = logicSolve(geom, clues, null);
    if (!r.ok) { c1 = false; c1notes.push(note + " (solver flagged contradiction)"); return; }
    for (const [edge, want] of asserts) {
      if (r.state[edge] !== want) { c1 = false; c1notes.push(note + " edge " + edge + " expected " + want + " got " + r.state[edge]); return; }
    }
  }
  {
    // (a) 0-clue: a 1×1 cell with clue 0 ⇒ all 4 edges CROSS.
    let g = makeGeom(1, 1);
    expectForced(g, Int8Array.from([0]), [[g.hId(0,0),CROSS],[g.hId(1,0),CROSS],[g.vId(0,0),CROSS],[g.vId(0,1),CROSS]], "0-clue all-cross");
    // (b) clue 4 on 1×1 ⇒ all 4 LINE, a tiny loop; solver fully solves it.
    {
      const r = logicSolve(g, Int8Array.from([4]), null);
      const allLine = [g.hId(0,0),g.hId(1,0),g.vId(0,0),g.vId(0,1)].every(e=>r.state[e]===LINE);
      if (!(r.ok && r.solved && allLine && isSingleLoop(g, r.state))) { c1=false; c1notes.push("4-clue tiny loop"); }
    }
    // (c) dot-degree case: 2×1 board, top cell only ⇒ clues [4,1]. The shared
    //     middle edge must be forced; solver must reach the exact loop.
    {
      const g2 = makeGeom(2, 1);
      const loop = regionPerimeter(g2, Uint8Array.from([1,0]));
      const clues = cluesFromLoop(g2, loop);
      const r = logicSolve(g2, clues, null);
      if (!(r.ok && r.solved && loopsEqual(g2, r.state, loop) && isSingleLoop(g2, r.state))) { c1=false; c1notes.push("2×1 dot-degree loop"); }
    }
    // (d) soundness: solver never asserts an edge that isn't in the true loop
    //     across a few small generated boards (every decided LINE/CROSS agrees
    //     with the solution).
    {
      for (let i=0;i<6 && c1;i++){
        const p = generatePuzzle("sound-"+i, 5, 5);
        const r = logicSolve(p.geom, p.clues, null);
        if (!r.ok || !r.solved) { c1=false; c1notes.push("sound-"+i+" not solved"); break; }
        for (let e=0;e<p.geom.NE;e++){
          const want = p.loop[e]===LINE ? LINE : CROSS;
          if (r.state[e] !== want) { c1=false; c1notes.push("sound-"+i+" unsound edge "+e); break; }
        }
      }
    }
  }
  checks.push({ name: "logic-solver soundness", pass: c1, detail: c1 ? "0-clue, dot-degree, tiny-loop + 6 boards" : c1notes.join("; ") });

  /* Check 2 — generation sweep: each fully logic-solvable AND logicSolve loop
     == generated loop, valid single loop, clues satisfied, 0 fallback. */
  let c2 = true, swept = 0, mismatch = 0, fallback = 0, notloop = 0, cbad = 0; const c2fail = [];
  const sweepSizes = [[5,5],[7,7],[10,10]];
  const perSize = 32; // 96 puzzles
  for (const [R, C] of sweepSizes) {
    for (let i = 0; i < perSize; i++) {
      const seed = "sweep-" + R + "x" + C + "-" + i;
      const p = generatePuzzle(seed, R, C); swept++;
      if (p.fallback) fallback++;
      const res = logicSolve(p.geom, p.clues, null);
      const ok = res.ok && res.solved;
      const match = ok && loopsEqual(p.geom, res.state, p.loop);
      const loopOk = isSingleLoop(p.geom, p.loop);
      const cOk = cluesSatisfied(p.geom, p.loop, p.clues);
      if (!ok || !match || !loopOk || !cOk || p.fallback) { c2 = false; if (!match) mismatch++; if (!loopOk) notloop++; if (!cOk) cbad++; if (c2fail.length < 5) c2fail.push(seed); }
    }
  }
  checks.push({ name: "sweep " + swept + " puzzles logic-solvable", pass: c2, detail: c2 ? (swept + " puzzles, 0 guesses, 0 mismatch, 0 fallback") : ("fail: " + c2fail.join(",") + " (mismatch " + mismatch + ", notloop " + notloop + ", clues " + cbad + ", fallback " + fallback + ")") });

  /* Check 3 — uniqueness via the independent brute-force counter. */
  let c3 = true, c3n = 0; const c3fail = [];
  for (const [R, C] of [[5,5],[7,7]]) {
    const per = R === 5 ? 16 : 8; // 24 small boards
    for (let i = 0; i < per; i++) {
      const seed = "uniq-" + R + "-" + i;
      const p = generatePuzzle(seed, R, C);
      const count = bruteCountSolutions(p.geom, p.clues, 1);
      c3n++;
      if (count !== 1) { c3 = false; if (c3fail.length < 6) c3fail.push(seed + "=" + count); }
    }
  }
  checks.push({ name: "uniqueness (brute-force witness)", pass: c3, detail: c3 ? (c3n + " small boards, exactly 1 solution each") : ("fail: " + c3fail.join(",")) });

  /* Check 4 — seed purity / skin-invariance. */
  let c4 = true; const c4fail = [];
  for (const [R, C] of [[5,5],[7,7],[10,10]]) {
    for (let i = 0; i < 6; i++) {
      const seed = "det-" + R + "-" + i;
      const a = generatePuzzle(seed, R, C), b = generatePuzzle(seed, R, C);
      const sameClues = a.clues.length === b.clues.length && a.clues.every((v, k) => v === b.clues[k]);
      const sameLoop = loopsEqual(a.geom, a.loop, b.loop);
      if (!(sameClues && sameLoop)) { c4 = false; c4fail.push(seed); }
    }
  }
  let differs = false;
  for (let i = 0; i < 30 && !differs; i++) { const a = generatePuzzle("rollA-" + i, 7, 7), b = generatePuzzle("rollB-" + i, 7, 7); if (!loopsEqual(a.geom, a.loop, b.loop)) differs = true; }
  if (!differs) { c4 = false; c4fail.push("re-roll-never-differs"); }
  checks.push({ name: "seed purity + skin-invariance", pass: c4, detail: c4 ? "same seed ⇒ identical; re-roll differs; skin is cosmetic" : ("fail: " + c4fail.join(",")) });

  const passed = checks.filter(c => c.pass).length, total = checks.length;
  for (const c of checks) {
    if (c.pass) console.log("[Slitherlink] self-test PASS — " + c.name + " (" + c.detail + ")");
    else console.error("[Slitherlink] self-test FAIL — " + c.name + " (" + c.detail + ")");
  }
  return { passed, total, allPass: passed === total, checks };
}

/* ===========================================================================
   ============================  THE UI / GAME  ===========================
   ======================================================================== */
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const board = $('board'), boardOuter = $('boardOuter'), verdict = $('verdict'),
      caption = $('caption'), seedInput = $('seedInput');

const state = {
  size: 5,            // cells per side (square boards)
  seed: "",
  skin: "graphite",
  puzzle: null,       // current generated puzzle
  player: null,       // Uint8Array edge states (UNKNOWN/LINE/CROSS)
  won: false,
  mistakes: 0,
  geom: null,
  edgeEls: null,      // per-edge <g class="edge"> element
};

/* ---- storage helpers (guarded; page works even when storage throws) ---- */
function safeSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function markBest() {
  try { const prev = parseInt(safeGet('ws:best:slitherlink') || '0', 10) || 0; if (state.size > prev) safeSet('ws:best:slitherlink', state.size); } catch (e) { }
}

/* ---- random seed string (Latch's word list) ---- */
function randomSeed() {
  const words = ["mica","quill","ember","fjord","latch","thorn","glade","verge","cusp","slate","onyx","reed","cairn","wisp","brume","flint","loom","gable","spire","nook","weft","skein","helix","noose"];
  return words[Math.floor(Math.random() * words.length)] + "-" + Math.floor(Math.random() * 9000 + 1000);
}

/* ---- build a new puzzle ---- */
function newPuzzle(seed) {
  state.seed = seed;
  seedInput.value = seed;
  state.puzzle = generatePuzzle(seed, state.size, state.size);
  state.geom = state.puzzle.geom;
  state.player = new Uint8Array(state.geom.NE); // all UNKNOWN
  state.won = false; state.mistakes = 0;
  boardOuter.classList.remove('won');
  verdict.classList.remove('show'); verdict.innerHTML = "";
  renderBoard();
  updateCaption();
}

/* ---- render the SVG board ---- */
function renderBoard() {
  const g = state.geom, R = g.R, C = g.C;
  const cellPx = R <= 5 ? 64 : R <= 7 ? 52 : 40;
  const pad = Math.round(cellPx * 0.5);            // margin so dots/lines aren't clipped
  const W = C * cellPx + pad * 2, H = R * cellPx + pad * 2;
  const X = dc => pad + dc * cellPx, Y = dr => pad + dr * cellPx;

  board.setAttribute('viewBox', `0 0 ${W} ${H}`);
  board.setAttribute('width', W); board.setAttribute('height', H);
  board.style.maxWidth = '100%';
  while (board.firstChild) board.removeChild(board.firstChild);

  // faint cell backgrounds
  const bgLayer = document.createElementNS(SVGNS, 'g');
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', X(c)); rect.setAttribute('y', Y(r));
    rect.setAttribute('width', cellPx); rect.setAttribute('height', cellPx);
    rect.setAttribute('class', 'cellbg');
    bgLayer.appendChild(rect);
  }
  board.appendChild(bgLayer);

  // clue numbers
  const clueLayer = document.createElementNS(SVGNS, 'g');
  const clueEls = new Array(R * C).fill(null);
  const clueFs = Math.round(cellPx * 0.42);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const cl = state.puzzle.clues[r * C + c];
    if (cl < 0) continue;
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', X(c) + cellPx / 2); t.setAttribute('y', Y(r) + cellPx / 2 + 1);
    t.setAttribute('class', 'clue'); t.setAttribute('font-size', clueFs);
    t.textContent = String(cl);
    clueLayer.appendChild(t);
    clueEls[r * C + c] = t;
  }
  board.appendChild(clueLayer);
  state.clueEls = clueEls;

  // edges: a wide invisible hit-zone + a visible line + a cross glyph, grouped.
  const edgeLayer = document.createElementNS(SVGNS, 'g');
  const edgeEls = new Array(g.NE).fill(null);
  const hitW = Math.max(16, Math.round(cellPx * 0.34));
  const crossR = Math.max(4, Math.round(cellPx * 0.13));

  function makeEdge(e, x1, y1, x2, y2) {
    const grp = document.createElementNS(SVGNS, 'g');
    grp.setAttribute('class', 'edge'); grp.dataset.e = e;
    // visible loop segment
    const ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1); ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
    ln.setAttribute('class', 'seg-line');
    grp.appendChild(ln);
    // cross glyph at midpoint
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const cl1 = document.createElementNS(SVGNS, 'line');
    cl1.setAttribute('x1', mx - crossR); cl1.setAttribute('y1', my - crossR); cl1.setAttribute('x2', mx + crossR); cl1.setAttribute('y2', my + crossR);
    cl1.setAttribute('class', 'seg-cross');
    const cl2 = document.createElementNS(SVGNS, 'line');
    cl2.setAttribute('x1', mx - crossR); cl2.setAttribute('y1', my + crossR); cl2.setAttribute('x2', mx + crossR); cl2.setAttribute('y2', my - crossR);
    cl2.setAttribute('class', 'seg-cross');
    grp.appendChild(cl1); grp.appendChild(cl2);
    // hit-zone (wide, on top)
    const hit = document.createElementNS(SVGNS, 'line');
    hit.setAttribute('x1', x1); hit.setAttribute('y1', y1); hit.setAttribute('x2', x2); hit.setAttribute('y2', y2);
    hit.setAttribute('class', 'hit'); hit.setAttribute('stroke-width', hitW);
    grp.appendChild(hit);
    edgeLayer.appendChild(grp);
    edgeEls[e] = grp;
  }
  // horizontals
  for (let dr = 0; dr <= R; dr++) for (let dc = 0; dc < C; dc++)
    makeEdge(g.hId(dr, dc), X(dc), Y(dr), X(dc + 1), Y(dr));
  // verticals
  for (let dr = 0; dr < R; dr++) for (let dc = 0; dc <= C; dc++)
    makeEdge(g.vId(dr, dc), X(dc), Y(dr), X(dc), Y(dr + 1));
  board.appendChild(edgeLayer);
  state.edgeEls = edgeEls;

  // dots on top
  const dotLayer = document.createElementNS(SVGNS, 'g');
  const dotEls = new Array(g.ND).fill(null);
  const dotR = Math.max(2.2, cellPx * 0.045);
  for (let dr = 0; dr <= R; dr++) for (let dc = 0; dc <= C; dc++) {
    const ci = document.createElementNS(SVGNS, 'circle');
    ci.setAttribute('cx', X(dc)); ci.setAttribute('cy', Y(dr)); ci.setAttribute('r', dotR);
    ci.setAttribute('class', 'dot');
    dotLayer.appendChild(ci);
    dotEls[g.dot(dr, dc)] = ci;
  }
  board.appendChild(dotLayer);
  state.dotEls = dotEls;

  paintAll();
  refreshClues();
}

/* ---- paint a single edge's state onto its group classes ---- */
function paintEdge(e) {
  const grp = state.edgeEls[e]; if (!grp) return;
  const v = state.player[e];
  grp.classList.toggle('on', v === LINE);
  grp.classList.toggle('cross', v === CROSS);
}
function paintAll() { for (let e = 0; e < state.geom.NE; e++) paintEdge(e); refreshDotFlags(); }

/* ---- clue feedback: count LINE edges around each clue; dim/warn ---- */
function clueLineCount(cell) {
  const es = state.geom.cellEdges[cell]; let k = 0;
  for (let j = 0; j < 4; j++) if (state.player[es[j]] === LINE) k++;
  return k;
}
function refreshClues() {
  const g = state.geom;
  for (let i = 0; i < g.R * g.C; i++) {
    const t = state.clueEls[i]; if (!t) continue;
    const cl = state.puzzle.clues[i];
    const k = clueLineCount(i);
    t.classList.toggle('done', k === cl);
    t.classList.toggle('over', k > cl);
  }
}
/* ---- flag any dot whose LINE-degree exceeds 2 (illegal branch) ---- */
function refreshDotFlags() {
  const g = state.geom;
  for (let d = 0; d < g.ND; d++) {
    const inc = g.dotEdges[d]; let line = 0;
    for (let i = 0; i < inc.length; i++) if (state.player[inc[i]] === LINE) line++;
    const el = state.dotEls && state.dotEls[d];
    if (el) el.classList.toggle('bad', line > 2);
  }
}

/* ---- win check: player's LINE edges == the unique solution loop AND a valid
       single loop satisfying every clue (honest: only a true solve wins) ---- */
function isWin() {
  const g = state.geom, pl = state.player, loop = state.puzzle.loop;
  // player's LINE set must equal the solution loop exactly
  for (let e = 0; e < g.NE; e++) if ((pl[e] === LINE) !== (loop[e] === LINE)) return false;
  // and it must independently verify as a valid single loop with satisfied clues
  return isSingleLoop(g, pl) && cluesSatisfied(g, pl, state.puzzle.clues);
}
function checkWin() {
  if (state.won) return;
  if (isWin()) {
    state.won = true;
    boardOuter.classList.add('won');
    paintAll();
    let segs = 0; for (let e = 0; e < state.geom.NE; e++) if (state.player[e] === LINE) segs++;
    const clean = state.mistakes === 0;
    verdict.innerHTML = `<span>solved — <span class="name">one loop, ${segs} segments</span></span>` +
      `<span class="small">${clean ? "a clean solve · no mistakes" : state.mistakes + " mistake" + (state.mistakes === 1 ? "" : "s")} · seed ${state.puzzle.seed}</span>`;
    verdict.classList.add('show');
    markBest();
    if (clean) safeSet('ws:flag:slitherlink-clean', Date.now());
  }
}

/* ---- apply a player action to an edge ---- */
function cycleLine(e) {           // UNKNOWN → LINE → UNKNOWN (primary)
  if (state.won) return;
  state.player[e] = (state.player[e] === LINE) ? UNKNOWN : LINE;
  paintEdge(e); refreshClues(); refreshDotFlags(); checkWin();
}
function toggleCross(e) {          // toggle CROSS (secondary)
  if (state.won) return;
  state.player[e] = (state.player[e] === CROSS) ? UNKNOWN : CROSS;
  paintEdge(e); refreshClues(); refreshDotFlags(); checkWin();
}

/* ---- pointer input on edges (left = line, right/shift = cross) ---- */
function edgeFromEvent(ev) {
  const t = ev.target.closest('g.edge');
  if (!t) return -1;
  return +t.dataset.e;
}
board.addEventListener('contextmenu', ev => { if (ev.target.closest('g.edge')) ev.preventDefault(); });
board.addEventListener('pointerdown', ev => {
  const e = edgeFromEvent(ev);
  if (e < 0 || state.won) return;
  ev.preventDefault();
  const wantCross = (ev.button === 2) || ev.shiftKey;
  if (wantCross) toggleCross(e); else cycleLine(e);
});

/* ---- Hint: assert one logically-forced edge the player hasn't placed ---- */
function doHint() {
  if (state.won) return;
  const g = state.geom;
  // current known state from the player's marks
  const res = logicSolve(g, state.puzzle.clues, state.player);
  if (!res.ok) { flashCaption("your marks contradict the logic — try Check, then Reset a wrong edge."); return; }
  // find the first edge the solver forced that the player hasn't set yet
  for (let e = 0; e < g.NE; e++) {
    if (state.player[e] === UNKNOWN && res.state[e] !== UNKNOWN) {
      state.player[e] = res.state[e];
      paintEdge(e);
      const grp = state.edgeEls[e];
      if (grp) { grp.classList.remove('hintpop'); void grp.getBBox(); grp.classList.add('hintpop'); setTimeout(() => grp.classList.remove('hintpop'), 600); }
      refreshClues(); refreshDotFlags(); checkWin();
      return;
    }
  }
  flashCaption("no single-step deduction left from here — you're at a logic fixpoint.");
}

/* ---- Check: highlight contradictions vs the unique solution ---- */
function doCheck() {
  if (state.won) return;
  const g = state.geom, loop = state.puzzle.loop, pl = state.player;
  let wrong = 0;
  // a player edge contradicts the solution if it's LINE where the loop has none,
  // or CROSS where the loop needs a line.
  for (let e = 0; e < g.NE; e++) {
    const inLoop = loop[e] === LINE;
    const bad = (pl[e] === LINE && !inLoop) || (pl[e] === CROSS && inLoop);
    if (bad) {
      wrong++;
      const grp = state.edgeEls[e];
      if (grp) { grp.classList.remove('err'); void grp.getBBox(); grp.classList.add('err'); setTimeout(() => grp.classList.remove('err'), 900); }
    }
  }
  // also surface any illegal degree-3 dots (a structural contradiction)
  let badDots = 0;
  for (let d = 0; d < g.ND; d++) { const inc = g.dotEdges[d]; let line = 0; for (let i = 0; i < inc.length; i++) if (pl[inc[i]] === LINE) line++; if (line > 2) badDots++; }
  if (wrong > 0) { state.mistakes += wrong; flashCaption(wrong + " contradiction" + (wrong === 1 ? "" : "s") + " with the unique solution" + (badDots ? " (incl. " + badDots + " over-degree dot" + (badDots === 1 ? "" : "s") + ")" : "") + "."); }
  else if (badDots > 0) { flashCaption(badDots + " dot" + (badDots === 1 ? "" : "s") + " with too many lines — that branch can't be in a loop."); }
  else flashCaption("no contradictions — every mark agrees with the logic.");
}

/* ---- Reveal full solution loop ---- */
function doReveal() {
  const g = state.geom, loop = state.puzzle.loop;
  for (let e = 0; e < g.NE; e++) state.player[e] = (loop[e] === LINE) ? LINE : CROSS;
  paintAll(); refreshClues();
  if (!state.won) {
    boardOuter.classList.add('won'); state.won = true;
    let segs = 0; for (let e = 0; e < g.NE; e++) if (loop[e] === LINE) segs++;
    verdict.innerHTML = `<span>revealed — <span class="name">one loop, ${segs} segments</span></span>` +
      `<span class="small">solution shown · seed ${state.puzzle.seed}</span>`;
    verdict.classList.add('show'); paintAll();
  }
}

/* ---- Reset (clear marks, same puzzle) ---- */
function doReset() {
  state.player = new Uint8Array(state.geom.NE);
  state.won = false; state.mistakes = 0;
  boardOuter.classList.remove('won');
  verdict.classList.remove('show'); verdict.innerHTML = "";
  paintAll(); refreshClues();
}

/* ---- caption / transient messages ---- */
let capTimer = null;
function updateCaption() {
  const p = state.puzzle, g = state.geom;
  let segs = 0; for (let e = 0; e < g.NE; e++) if (p.loop[e] === LINE) segs++;
  let nc = 0; for (let i = 0; i < g.R * g.C; i++) if (p.clues[i] >= 0) nc++;
  caption.innerHTML = `A <b>${g.R}×${g.C}</b> Slitherlink, <b>logic-solvable &amp; unique</b> — proven before it reached you by a sound solver and an independent counter. ` +
    `The loop is <span class="stat">${segs}</span> segments; <span class="stat">${nc}</span> clues. Left-click an edge to draw the loop · right-click / shift to cross one out.`;
}
function flashCaption(msg) {
  caption.innerHTML = `<b>${msg}</b>`;
  if (capTimer) clearTimeout(capTimer);
  capTimer = setTimeout(updateCaption, 3000);
}

/* ----------------------------- wiring ----------------------------- */
$('sizeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#sizeSeg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.size = +b.dataset.size;
  newPuzzle(state.seed || randomSeed());
});
$('skinSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#skinSeg button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.skin = b.dataset.skin;
  document.body.dataset.skin = state.skin;   // PURELY cosmetic — never re-rolls the puzzle
});
$('diceBtn').addEventListener('click', () => newPuzzle(randomSeed()));
$('newBtn').addEventListener('click', () => newPuzzle(randomSeed()));
$('hintBtn').addEventListener('click', doHint);
$('checkBtn').addEventListener('click', doCheck);
$('resetBtn').addEventListener('click', doReset);
$('revealBtn').addEventListener('click', doReveal);
seedInput.addEventListener('change', () => { const s = seedInput.value.trim(); if (s) newPuzzle(s); });
seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') seedInput.blur(); });

/* keyboard: h hint, c check, n new, r reset */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h' || e.key === 'H') doHint();
  else if (e.key === 'c' || e.key === 'C') doCheck();
  else if (e.key === 'n' || e.key === 'N') newPuzzle(randomSeed());
  else if (e.key === 'r' || e.key === 'R') doReset();
});

/* ----------------------------- boot ----------------------------- */
(function boot() {
  // self-test FIRST (workshop tradition); chip reflects the result.
  let st;
  try { st = runSelfTest(); }
  catch (err) { console.error('[Slitherlink] self-test threw', err); st = { passed: 0, total: 4, allPass: false }; }
  const chip = $('selftest'), txt = $('stText');
  if (st.allPass) { chip.classList.add('ok'); txt.textContent = `logic-verified — ${st.passed}/${st.total} ✓`; }
  else { chip.classList.add('bad'); txt.textContent = `self-test ${st.passed}/${st.total} — see console`; }

  // breadcrumb (guarded; see /UNLOCK.md)
  safeSet('ws:seen:slitherlink', Date.now());

  // first puzzle
  newPuzzle(randomSeed());
  console.log('[Slitherlink] ready. seed:', state.seed, 'size:', state.size);
})();
</script>
