<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>aquarium asset preview</title>
<style>html,body{margin:0;background:#05070f}#c{display:block;margin:0 auto}</style>
</head><body>
<canvas id="c" width="700" height="880"></canvas>
<script>
"use strict";
// The aquarium tank backdrop + a pose grid that exercises the candidate asset in
// true depth context. The candidate (asset.js, loaded after) sets window.__ASSET
// (a draw fn) and window.__ASSET_KIND ('fish' | 'caustics' | 'vent').
const c=document.getElementById('c'), ctx=c.getContext('2d'), W=c.width, H=c.height, TAU=Math.PI*2, RIM=16;
function yOfDepth(d){ return RIM + d*(H-2*RIM); }
function depthOfY(y){ return (y-RIM)/(H-2*RIM); }
function drawColumn(){
  const g=ctx.createLinearGradient(0,RIM,0,H-RIM);
  g.addColorStop(0,'#1d3a5e');g.addColorStop(0.16,'#16314f');g.addColorStop(0.45,'#0e1f38');
  g.addColorStop(0.72,'#081428');g.addColorStop(0.92,'#04080f');g.addColorStop(1,'#020409');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawVentGlow(){
  const vx=W*0.5, vy=yOfDepth(0.985);
  ctx.save(); ctx.globalCompositeOperation='screen';
  const rg=ctx.createRadialGradient(vx,vy,0,vx,vy,200);
  rg.addColorStop(0,'rgba(120,210,200,0.45)');rg.addColorStop(0.4,'rgba(70,150,170,0.16)');rg.addColorStop(1,'rgba(40,90,120,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(vx,vy,200,0,TAU); ctx.fill(); ctx.restore();
}
function run(){
  const A=window.__ASSET, kind=window.__ASSET_KIND||'fish';
  drawColumn();
  if(kind==='caustics'){
    // the candidate paints the whole light field; call it for a few phases overlaid
    if(A) for(let p=0;p<1;p++) A(ctx,{W,H,RIM,yOfDepth,t:1.2,TAU});
    drawVentGlow();
  } else if(kind==='vent'){
    drawVentGlow();
    if(A) A(ctx,{W,H,RIM,yOfDepth,t:1.2,TAU,stock:30});
  } else {
    // fish: draw a swim-cycle row across the body's home depth band
    drawVentGlow();
    if(A){
      const phases=[0,0.7,1.4,2.1,2.8,3.5,4.2,4.9];
      const cols=4, rows=2;
      for(let i=0;i<8;i++){
        const cx=W*0.16 + (i%cols)*(W*0.24), cy=H*0.30 + Math.floor(i/cols)*(H*0.30);
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(0.0);
        A(ctx,{s:11,L:22,col:'#9ad6c8',ph:phases[i],boil:i%2,light:0.9,TAU});
        ctx.restore();
      }
    }
  }
}
const s=document.createElement('script'); s.src='asset.js';
s.onload=()=>{ requestAnimationFrame(()=>requestAnimationFrame(run)); };
document.body.appendChild(s);
</script>
</body></html>
