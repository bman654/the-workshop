<style>
  :root{
    --void:#070912; --void2:#0b0f1c; --indigo:#141d38; --indigo2:#1b264a;
    --parch:#e9dcc0; --parch-dim:#cdbf9d; --ink:#241a0c;
    --gold:#f0c766; --gold-hot:#ffe9a8; --gold-deep:#c98a3a;

    --serif: ui-serif, "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: radial-gradient(120% 90% at 50% -10%, #10182f 0%, var(--void2) 45%, var(--void) 100%);
    color:var(--parch); font-family:var(--serif);
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #wrap{ position:fixed; inset:0; display:flex; }

  /* ── the lectern: the sky on the left, the kept folio on the right ── */
  #stage{ position:relative; flex:1 1 auto; min-width:0; }
  #sky{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  /* header — the top is ONE flex row (nav · kicker · mute) so nothing overlaps;
     the whisper narrates the state just below it. */
  #topbar{ position:absolute; top:0; left:0; right:0; z-index:9; display:flex; align-items:center;
    justify-content:space-between; gap:12px; padding:11px 14px 0; pointer-events:none; }
  #kicker{ flex:1 1 auto; text-align:center; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:600 10px/1.4 var(--mono); letter-spacing:.30em; text-transform:uppercase;
    color:var(--gold-deep); opacity:.85; transition:opacity .5s; }
  #whisper{ position:absolute; top:38px; left:0; right:0; text-align:center; z-index:6; pointer-events:none;
    font-size:15px; letter-spacing:.01em; color:var(--parch-dim); text-shadow:0 1px 12px #000;
    transition:opacity .5s; padding:0 16px; }
  #whisper b{ color:var(--gold); font-weight:600; font-style:italic; }

  /* a slim breadcrumb back to the estate + its celestial kin */
  #nav{ flex:0 0 auto; display:flex; gap:14px; align-items:center; pointer-events:auto; }
  #nav a{ font:600 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--fog); text-decoration:none; opacity:.72; transition:.2s; }
  #nav a:hover{ color:var(--gold); opacity:1; }

  /* the controls — a thin brass rail, bottom-centre of the stage */
  #rail{ position:absolute; left:0; right:0; bottom:18px; z-index:6; display:flex; gap:10px;
    align-items:center; justify-content:center; flex-wrap:wrap; padding:0 14px; }
  .brass{ font-family:var(--serif); font-size:13px; letter-spacing:.05em; color:var(--parch-dim);
    background:rgba(20,29,56,.55); border:1px solid var(--line); border-radius:3px;
    padding:9px 15px; cursor:pointer; transition:.18s; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  .brass:hover{ color:var(--gold); border-color:rgba(240,199,102,.55); background:rgba(40,32,14,.5); }
  .brass:disabled{ opacity:.3; cursor:default; }
  .brass.primary{ color:var(--gold); border-color:rgba(240,199,102,.5); }
  .brass.primary:not(:disabled){ box-shadow:0 0 0 1px rgba(240,199,102,.14), 0 6px 22px -12px rgba(240,199,102,.6); }

  /* the mute — the topbar's right element, a safe inline SVG (no ♪ glyph mojibake) */
  #mute{ flex:0 0 auto; pointer-events:auto; width:32px; height:32px; padding:6px;
    background:rgba(20,29,56,.5); border:1px solid rgba(233,220,192,.2); border-radius:4px;

  #mute:hover{ color:var(--parch); border-color:rgba(233,220,192,.42); }
  #mute svg{ width:17px; height:17px; display:block; }

  /* ── the constellarium: the kept folio you flip back through ── */
  #shelf{ position:relative; flex:0 0 300px; background:linear-gradient(180deg,#0c1120,#080b14);
    border-left:1px solid rgba(240,199,102,.16); display:flex; flex-direction:column; z-index:8; }
  #shelfHead{ padding:18px 20px 8px; }
  #shelfHead .t{ font:600 12px/1 var(--mono); letter-spacing:.28em; text-transform:uppercase; color:var(--gold-deep); }
  #shelfHead .n{ font-size:12.5px; color:var(--fog); margin-top:5px; font-style:italic; }
  #stackHolder{ position:relative; flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:8px 12px; min-height:0; }
  #stackHolder canvas{ border-radius:4px; box-shadow:0 12px 44px rgba(0,0,0,.6), 0 0 0 1px rgba(240,199,102,.12);
    max-width:100%; height:auto; }
  #shelfEmpty{ padding:0 26px; text-align:center; color:var(--fog); font-style:italic; font-size:13px; line-height:1.65; }
  #stackMeta{ text-align:center; color:var(--parch-dim); font:11px/1.4 var(--mono); letter-spacing:.04em; padding:0 16px 4px; min-height:15px; }
  #flip{ display:flex; gap:8px; justify-content:center; padding:12px 14px 16px; }
  #flip .brass{ padding:6px 13px; font-size:12px; }

  @media (max-width:860px){
    #wrap{ flex-direction:column; }
    #shelf{ flex:0 0 190px; border-left:none; border-top:1px solid rgba(240,199,102,.16); flex-direction:row; }
    #shelfHead{ display:none; }
    #stackHolder{ flex:1 1 auto; }

    #nav a:nth-child(3){ display:none; }  /* drop the longest sibling link when space is tight */
    #whisper{ top:34px; font-size:13.5px; }
  }

<script type="module">
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   A SKY YOU NAME — the page. "The Inking Table."

   A make-believe celestial toy: a seeded starfield you lace by hand into your
   own figure, then CLOSE to catasterize — the page inks a golden asterism,
   letters its generated NAME, and tells a two-line origin MYTH in the estate's
   own voice. RE-SEED scatters a fresh sky; KEEP files the finished chart to a
   constellarium folio you flip back through. Silent until a first gesture;
   honors the shared ws:pref:muted.

   Claim-free (delight-first). The only self-test is WELL-FORMEDNESS: a kept
   chart re-inks BYTE-IDENTICALLY from its stored seed + normalized points
   (deterministic xmur3+mulberry32), and any laced N-star figure yields a
   well-formed name + two-line myth. See a-sky-you-name/core.test.mjs (the Node
   twin over the SAME starlore.mjs inlined below).

   Craft: xmur3+mulberry32 (the-cartographers-dream/core.mjs) for the seeded
   field + the naming; the verse/theogony myth register lives in starlore.mjs;
   nib/ting/fwump-kin SFX for the ink polish. Zero deps, single file.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── the star-lore generator (forge-inlined; also imported by core.test.mjs) ── */
<!-- forge:include ./starlore.mjs -->

const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const smoothstep = (t)=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const easeOutCubic = (x)=> 1-Math.pow(1-x,3);
let REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══════════════════════════════════════════════════════════════════════════
   THE FIELD — a seeded starfield. Deterministic: same seed → identical stars.
   Two parallax bands of faint dust twinkle + drift; a set of bright, lace-able
   ANCHOR stars sit on a nearer band. Stars live in a virtual 0..1 × 0..1 sky-
   space; the view maps sky-space → screen with a slow parallax drift that is
   DRAW-TIME ONLY — it never touches a star's identity/position in sky-space, so
   the laced geometry stays frozen (this is what keeps a kept chart re-ink exact).
   ═══════════════════════════════════════════════════════════════════════════ */
const DUST_N = 220, ANCHOR_N = 22;
function generateField(seedStr){
  const rng = makeRng(seedStr + "::field");
  // faint far dust — two depth bands for parallax
  const dust = [];
  for(let i=0;i<DUST_N;i++){
    dust.push({ x:rng(), y:rng(),
      depth: rng()<0.55 ? 0.35 : 0.7,
      r: 0.4 + rng()*0.9,
      base: 0.10 + rng()*0.30,
      tph: rng()*TAU, trate: 0.4 + rng()*1.1 });
  }
  // bright lace-able anchor stars — spread by light poisson-ish rejection
  const anchors = []; let guard=0;
  while(anchors.length<ANCHOR_N && guard++<4000){
    const s = { x:0.08+rng()*0.84, y:0.12+rng()*0.72,
      mag: 0.6+rng()*0.4, depth: 0.9+rng()*0.18,
      tph: rng()*TAU, trate: 0.5+rng()*0.9, hue: rng() };
    let ok=true;
    for(const o of anchors){ const dx=o.x-s.x, dy=o.y-s.y; if(dx*dx+dy*dy < 0.014){ ok=false; break; } }
    if(ok) anchors.push(s);
  }
  anchors.forEach((s,i)=> s.i=i);
  return { seed:seedStr, dust, anchors };
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════════════ */
let W=0,H=0,DPR=1;
let field;
let laced=[];             // ordered anchor indices in the current figure
let dragging=false, dragFrom=-1;
let pointer={x:0,y:0,has:false};
let phase="lacing";       // "lacing" | "reveal"
let firstGesture=false;
let snapStep=0;           // pentatonic step, climbs per snap
let parallax={x:0,y:0,tx:0,ty:0};
let t0=performance.now();

// the catasterized figure once closed: geometry frozen in NORMALIZED sky-space
let reveal=null;          // { lore, ptsN:[{x,y}], glow, inkT }

const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
const $ = id=>document.getElementById(id);
const whisperEl=$('whisper'), kickerEl=$('kicker');
const nameBtn=$('nameBtn'), undoBtn=$('undoBtn'), reseedBtn=$('reseedBtn'), keepBtn=$('keepBtn');

/* ---------- view mapping: sky-space → screen, with draw-time parallax ---- */
function anchorPx(s){
  return { x: 0.06*W + s.x*0.88*W + parallax.x*s.depth*26,
           y: 0.08*H + s.y*0.82*H + parallax.y*s.depth*26 };
}
function dustPx(d){
  return { x:(d.x*1.02-0.01)*W + parallax.x*d.depth*26,
           y:(d.y*1.02-0.01)*H + parallax.y*d.depth*26 };
}
function nearestAnchor(mx,my,maxD){
  let best=-1, bd=maxD*maxD;
  for(const s of field.anchors){
    const p=anchorPx(s); const dx=p.x-mx, dy=p.y-my; const d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=s.i; }
  }
  return best;
}
/* is the loose end hovering the FIRST star of a closeable (≥3) figure? */
function wantsClosing(){
  if(laced.length<3) return false;
  const first=anchorPx(field.anchors[laced[0]]);
  const dx=first.x-pointer.x, dy=first.y-pointer.y;
  return (dx*dx+dy*dy) < (34*34);
}

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER — the live sky
   ═══════════════════════════════════════════════════════════════════════════ */
function draw(now){
  const t=(now-t0)/1000;
  // ease parallax toward target; FREEZE the target while dragging so lacing coords hold
  parallax.x += (parallax.tx-parallax.x)*0.06;
  parallax.y += (parallax.ty-parallax.y)*0.06;
  if(!REDUCED && !dragging && phase==="lacing"){
    parallax.tx = Math.sin(t*0.05)*0.6; parallax.ty = Math.cos(t*0.037)*0.5;
  }

  ctx.clearRect(0,0,W,H);
  // deep indigo vignette
  const g=ctx.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.5,Math.hypot(W,H)*0.62);
  g.addColorStop(0,'#12131c'); g.addColorStop(0.6,'#0a0c11'); g.addColorStop(1,'#060710');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // faint far dust — twinkles (frozen bright under reduced-motion)
  for(const d of field.dust){
    const p=dustPx(d);
    const tw = REDUCED?1:(0.6+0.4*Math.sin(t*d.trate+d.tph));
    ctx.globalAlpha=d.base*tw; ctx.fillStyle='#cfd6e6';
    ctx.beginPath(); ctx.arc(p.x,p.y,d.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ── the CATASTERIZE beat: for the first breath of the reveal, the figure the
  //    visitor drew inks GOLD IN PLACE (where their hand left it) before the
  //    framed plate composes over it. The plate (drawReveal Plate, below) owns
  //    the settled name/myth; this is just the "your gesture became a star-figure"
  //    flash, fading as the plate's dim rises. ──
  if(reveal){
    const flash = 1 - smoothstep(reveal.inkT/0.42);   // 1→0 over the first ~40%
    if(flash>0.001){
      ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
      const gl=reveal.glow;
      const poly = laced.map(i=>anchorPx(field.anchors[i]));
      ctx.strokeStyle=`rgba(240,199,102,${0.9*flash*gl})`; ctx.lineWidth=1.7;
      ctx.shadowColor='rgba(240,199,102,0.6)'; ctx.shadowBlur=9*flash;
      ctx.beginPath(); poly.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
      ctx.shadowBlur=0;
      for(const p of poly) Gate.art.star(ctx, p.x, p.y, 3.0, 'gild', flash*gl);
      ctx.restore();
    }
  }

  // ── the LIVE laced polyline (cool → warms as it grows) ──
  if(laced.length>0 && !reveal){
    ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
    for(let i=1;i<laced.length;i++){
      const a=anchorPx(field.anchors[laced[i-1]]), b=anchorPx(field.anchors[laced[i]]);
      lineWarm(a,b, i/Math.max(1,laced.length));
    }
    // the rubber-band from the last star to the pointer while dragging
    if(dragging && dragFrom>=0 && pointer.has){
      const a=anchorPx(field.anchors[dragFrom]);
      const closing=wantsClosing();
      ctx.strokeStyle= closing?'rgba(240,199,102,0.9)':'rgba(135,148,166,0.5)';
      ctx.lineWidth= closing?1.8:1.1;
      ctx.setLineDash(closing?[]:[3,5]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(pointer.x,pointer.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  // ── the anchor stars (bright, lace-able) ──
  for(const s of field.anchors){
    const p=anchorPx(s);
    const tw = REDUCED?0.9:(0.72+0.28*Math.sin(t*s.trate+s.tph));
    const inFig = laced.includes(s.i);
    const isFirst = laced.length>=3 && s.i===laced[0] && !reveal;
    const r = 1.7 + s.mag*1.6;
    if(isFirst){
      // the FIRST star pulses invitingly + grows a faint "close here" ring
      const pulse = REDUCED?1:(0.6+0.4*Math.sin(t*3));
      Gate.art.star(ctx, p.x, p.y, r+1.2, 'gild', pulse);
      ctx.strokeStyle=`rgba(240,199,102,${REDUCED?0.5:(0.25+0.25*pulse)})`;
      ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p.x,p.y,13,0,TAU); ctx.stroke();
    } else {
      Gate.art.star(ctx, p.x, p.y, r*tw, inFig?'gild':(s.hue<0.4?'warm':'cool'), 1);
    }
    // hover halo on the star the pointer would grab
    if(pointer.has && !reveal && !dragging){
      const dx=p.x-pointer.x, dy=p.y-pointer.y;
      if(dx*dx+dy*dy < 22*22){
        ctx.strokeStyle='rgba(233,220,192,0.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(p.x,p.y,10,0,TAU); ctx.stroke();
      }
    }
  }

  // ── the reveal PLATE (name + two-line myth in a reserved, on-screen band) ──
  if(reveal){
    if(reveal.inkT<1) reveal.inkT = Math.min(1, reveal.inkT + (REDUCED?1:0.02));
    if(reveal.glow<1) reveal.glow = Math.min(1, reveal.glow + (REDUCED?1:0.04));
    drawRevealPlate();
  }

  requestAnimationFrame(draw);
}
function lineWarm(a,b,frac){
  const c1=[135,148,166], c2=[240,199,102];
  const mix=i=>Math.round(c1[i]+(c2[i]-c1[i])*Math.min(1,frac*1.2));
  ctx.strokeStyle=`rgba(${mix(0)},${mix(1)},${mix(2)},0.78)`;
  ctx.lineWidth=1.35; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}

/* ── the reveal composition — a reserved plate with name/myth bands, NEVER
   centroid-anchored text. The figure is scaled into a reserved box; the name +
   two myth lines sit in reserved bands below, inside an aged-vellum cartouche. ── */
function drawRevealPlate(){
  const lore = reveal.lore;
  const inkT = reveal.inkT;
  // the plate occupies a centred, on-stage rect (never runs off-screen)
  const pad = Math.min(W,H)*0.06;
  const plateW = Math.min(W - pad*2, 620);
  const plateH = Math.min(H - pad*2 - 40, 520);
  const px = (W-plateW)/2, py = Math.max(pad, (H-plateH)/2 - 14);
  // vertical bands inside the plate: figure box (top ~52%), name band, myth band
  const figBox = { x:px+plateW*0.10, y:py+plateH*0.10, w:plateW*0.80, h:plateH*0.46 };
  const nameY  = py + plateH*0.66;
  const mythY  = py + plateH*0.74;

  ctx.save();
  // dim the surrounding sky a touch so the plate reads
  ctx.fillStyle=`rgba(7,9,18,${0.34*inkT})`; ctx.fillRect(0,0,W,H);
  // the forged aged-vellum / indigo engraved-atlas cartouche frame
  Gate.art.cartouche(ctx, px, py, plateW, plateH, smoothstep(inkT*1.1));

  // scale the (already frozen) figure into the reserved figure box
  const poly = reveal.ptsN.map(pn=>({ x:pn.x, y:pn.y }));  // 0..1
  let minx=1,miny=1,maxx=0,maxy=0;
  for(const p of poly){ minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x); miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y); }
  const bw=Math.max(1e-3,maxx-minx), bh=Math.max(1e-3,maxy-miny);
  const sc=Math.min(figBox.w/bw, figBox.h/bh)*0.86;
  const ox=figBox.x+figBox.w/2 - (minx+bw/2)*sc, oy=figBox.y+figBox.h/2 - (miny+bh/2)*sc;
  const P=poly.map(p=>({ x:ox+p.x*sc, y:oy+p.y*sc }));
  // the asterism, inked gold (segments flow first→last across the first third)
  ctx.lineJoin='round'; ctx.lineCap='round';
  const edgeT = inkT*3;
  for(let e=1;e<P.length;e++){
    const local=clamp(edgeT - (e-1)*(1/Math.max(1,P.length-1))*1.0, 0, 1);
    if(local<=0) continue;
    const a=P[e-1], b=P[e];
    const mx=a.x+(b.x-a.x)*easeOutCubic(local), my=a.y+(b.y-a.y)*easeOutCubic(local);
    ctx.strokeStyle=`rgba(240,199,102,${0.9})`; ctx.lineWidth=1.9;
    ctx.shadowColor='rgba(240,199,102,0.65)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mx,my); ctx.stroke();
  }
  ctx.shadowBlur=0;
  for(const p of P) Gate.art.star(ctx, p.x, p.y, 2.6, 'gild', reveal.glow);

  // the NAME — lettered in the reserved band (left→right ink wipe)
  const nameProg = REDUCED?1:smoothstep((inkT-0.32)/0.34);
  if(nameProg>0){
    ctx.textAlign='center';
    const fs=Math.max(18, Math.min(30, plateW*0.05));
    drawTracedName(ctx, lore.name, W/2, nameY, fs, nameProg);
    // the designation, small, under the name
    ctx.globalAlpha=nameProg*0.85;
    ctx.fillStyle='#9db4ff'; ctx.font=`600 ${Math.max(10,fs*0.36)}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;
    ctx.fillText(lore.designation + '   ·   ' + lore.traits.n + ' stars', W/2, nameY + fs*0.72);
    ctx.globalAlpha=1;
  }
  // the MYTH — two lines fade in, wrapped, in the reserved myth band
  const mythProg = REDUCED?1:smoothstep((inkT-0.6)/0.36);
  if(mythProg>0){
    ctx.save(); ctx.globalAlpha=mythProg;
    ctx.fillStyle='rgba(233,220,192,0.92)'; ctx.textAlign='center';
    const fs=Math.max(13, Math.min(17, plateW*0.028));
    ctx.font=`italic ${fs}px ${getComputedStyle(document.body).getPropertyValue('--serif')}`;
    const maxW=plateW*0.82, lh=fs*1.45;
    let yy=mythY;
    yy = wrapCentered(ctx, lore.myth[0], W/2, yy, maxW, lh) + lh*0.55;
    wrapCentered(ctx, lore.myth[1], W/2, yy, maxW, lh);
    ctx.restore();
  }
  ctx.restore();
}
function drawTracedName(g, text, cxp, y, size, prog){
  g.save();
  const serif = getComputedStyle(document.body).getPropertyValue('--serif');
  g.font=`${size}px ${serif}`;
  let total=0; const adv=[]; const letter=size*0.03;
  for(const ch of text){ const w=g.measureText(ch).width; adv.push(w); total+=w+letter; }
  total-=letter;
  const x0=cxp-total/2, revealX=x0+total*smoothstep(prog);
  g.beginPath(); g.rect(x0-8, y-size, (revealX-x0)+size, size*1.7); g.clip();
  g.textAlign='left'; g.shadowColor='rgba(240,199,102,0.55)'; g.shadowBlur=9;
  let cxx=x0;
  for(let i=0;i<text.length;i++){
    const mid=cxx+adv[i]/2;
    g.fillStyle = Math.abs(mid-revealX)<size ? '#fff2cf' : '#f0c766';
    g.fillText(text[i], cxx, y); cxx+=adv[i]+letter;
  }
  g.restore();
}
function wrapCentered(g,text,cxp,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxW && line){ g.fillText(line,cxp,yy); yy+=lh; line=w; }
    else line=test;
  }
  if(line){ g.fillText(line,cxp,yy); }
  return yy;
}

/* ═══════════════════════════════════════════════════════════════════════════
   POINTER STATE MACHINE — ONE continuous held drag: grab the nearest bright
   star, glide within snap radius of an un-laced anchor to SNAP a line to it
   (chime climbs), auto-close on returning to the first star, or release on the
   first star to close. The "Name it" button is the reduced-dexterity fallback.
   ═══════════════════════════════════════════════════════════════════════════ */
function evtXY(e){ const r=cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }

function onDown(e){
  e.preventDefault();
  firstUse();                        // unlock audio on ANY first interaction
  if(reveal){ return; }              // figure inked — must Keep / Fresh sky
  const {x,y}=evtXY(e); pointer.x=x; pointer.y=y; pointer.has=true;
  const hit=nearestAnchor(x,y,26);
  if(hit<0) return;
  if(laced.length===0){ laced=[hit]; dragFrom=hit; snapStep=0; snap(0); }
  else if(laced[laced.length-1]===hit){ dragFrom=hit; }   // resume from the tip
  else { laced=[hit]; dragFrom=hit; snapStep=0; snap(0); } // fresh single-tap restart
  dragging=true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  syncButtons();
}
function onMove(e){
  const {x,y}=evtXY(e); pointer.x=x; pointer.y=y; pointer.has=true;
  if(!dragging){
    // a gentle pointer-nudge to the parallax target while idle (not dragging)
    if(!REDUCED && phase==="lacing"){ parallax.tx=(x/W-0.5)*1.6; parallax.ty=(y/H-0.5)*1.4; }
    return;
  }
  if(dragFrom<0 || reveal) return;
  const hit=nearestAnchor(x,y,24);
  if(hit>=0 && hit!==dragFrom){
    if(hit===laced[0] && laced.length>=3){ closeFigure(); return; }   // auto-close
    if(!laced.includes(hit)){
      laced.push(hit); dragFrom=hit; snapStep++;
      snap(snapStep);
      Gate.sfxPlay('nib', 0.09, Math.min(1,laced.length/8));
      syncButtons();
    }
  }
}
function onUp(){
  dragging=false;
  if(!reveal && wantsClosing()){ closeFigure(); }   // belt-and-suspenders release-on-first
}

/* the warm brass snap-chime — pitch climbs one pentatonic step per snap (C5..E6) */
function snap(step){
  Gate.sfxPlay('snap', 0.5, clamp(step/8, 0, 1));
}

/* ── CLOSE → CATASTERIZE ── */
function closeFigure(){
  if(laced.length<3 || reveal) return;
  dragging=false;
  // FREEZE the geometry: capture the laced anchors in NORMALIZED sky-space (never
  // the pixels), so the words + the re-ink are byte-identical from (seed, ptsN).
  const ptsN = laced.map(i=>({ x:field.anchors[i].x, y:field.anchors[i].y }));
  const lore = nameSky(field.seed, ptsN);
  reveal = { lore, ptsN, glow:0, inkT:0 };
  phase="reveal";
  // the ink sound: a papery nib sweep then a settling brass ting/swell
  Gate.sfxPlay('nib', 0.5, 0.9);
  setTimeout(()=>Gate.sfxPlay('settle', 1.4, 0.9), REDUCED?0:240);
  whisperEl.innerHTML = `<b>${escapeHtml(lore.name)}</b> — keep it, or scatter a fresh sky.`;
  syncButtons();
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ═══════════════════════════════════════════════════════════════════════════
   BUTTONS / HINT / RESEED
   ═══════════════════════════════════════════════════════════════════════════ */
function syncButtons(){
  nameBtn.disabled = laced.length<3 || !!reveal;
  undoBtn.disabled = laced.length===0 || !!reveal;
  keepBtn.disabled = !reveal;
  if(!reveal){
    if(laced.length===0) whisperEl.innerHTML = `Drag from <b>star to star</b> to lace a figure of your own.`;
    else if(laced.length<3) whisperEl.innerHTML = `A figure of <b>${laced.length}</b> ${laced.length===1?'star':'stars'}. Keep going — close it to name it.`;
    else whisperEl.innerHTML = `A figure of <b>${laced.length} stars</b>. Bring the line home to the first star, or press <b>Name it</b>.`;
  }
}
function firstUse(){
  if(firstGesture) return; firstGesture=true;
  Gate.unlock();   // create/resume the AudioContext inside this user gesture
}
function newSky(seedStr){
  seedStr = seedStr || ("sky-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e6).toString(36));
  field = generateField(seedStr);
  laced=[]; dragFrom=-1; dragging=false; reveal=null; phase="lacing"; snapStep=0;
  syncButtons();
}

nameBtn.addEventListener('click', ()=>{ firstUse(); if(laced.length>=3 && !reveal) closeFigure(); });
undoBtn.addEventListener('click', ()=>{ if(reveal) return; if(laced.length){ laced.pop(); dragFrom=laced.length?laced[laced.length-1]:-1; syncButtons(); } });
reseedBtn.addEventListener('click', ()=>{ firstUse(); newSky(); Gate.sfxPlay('fwump', 0.5, 0); });
keepBtn.addEventListener('click', ()=>{ keepChart(); });

/* ═══════════════════════════════════════════════════════════════════════════
   THE CONSTELLARIUM — the kept folio. Each kept chart is a COMPOSED framed plate:
   the asterism scaled into a reserved box + the name + two-line myth in reserved
   bands below, RE-INKED byte-identically from its stored (seed, normalized pts).
   Store ONLY (seed, ptsN) — never the rendered strings — so a future bank edit
   never silently breaks an old chart (the generator is versioned).
   ═══════════════════════════════════════════════════════════════════════════ */
const shelf = {
  holder:$('stackHolder'), empty:$('shelfEmpty'), count:$('shelfCount'),
  flip:$('flip'), meta:$('stackMeta'), prev:$('prevBtn'), next:$('nextBtn'),
  cards:[], view:0, canvas:null
};
function keepChart(){
  if(!reveal) return;
  shelf.cards.push({ seed:field.seed, ptsN:reveal.ptsN.map(p=>({x:p.x,y:p.y})) });
  shelf.view = shelf.cards.length-1;
  renderShelf();
  // file it, then scatter a fresh sky for the next figure
  newSky(); Gate.sfxPlay('fwump', 0.5, 0);
}
function renderShelf(){
  const n=shelf.cards.length;
  shelf.count.textContent = n===0?'an empty folio':(n===1?'1 chart kept':n+' charts kept');
  if(n===0){ shelf.empty.style.display=''; shelf.flip.style.visibility='hidden'; shelf.meta.textContent='';
    if(shelf.canvas){ shelf.canvas.remove(); shelf.canvas=null; } return; }
  shelf.empty.style.display='none';
  shelf.flip.style.visibility='visible';
  shelf.prev.disabled = shelf.view<=0;
  shelf.next.disabled = shelf.view>=n-1;
  const card=shelf.cards[shelf.view];
  const lore=nameSky(card.seed, card.ptsN);       // RE-DERIVE from the seed (the self-test made visible)
  shelf.meta.textContent = `№ ${shelf.view+1} · ${lore.traits.n} stars`;
  drawKeptPlate(card, lore);
}
function drawKeptPlate(card, lore){
  const CW=256, CH=280;
  if(!shelf.canvas){ shelf.canvas=document.createElement('canvas'); shelf.holder.appendChild(shelf.canvas); }
  const c=shelf.canvas, dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=CW*dpr; c.height=CH*dpr; c.style.width=CW+'px'; c.style.height=CH+'px';
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  // plate background + cartouche frame (same idiom as the main reveal)
  const bg=g.createLinearGradient(0,0,0,CH); bg.addColorStop(0,'#141d38'); bg.addColorStop(1,'#0b0f1c');
  g.fillStyle=bg; g.fillRect(0,0,CW,CH);
  Gate.art.cartouche(g, 5, 5, CW-10, CH-10, 1);
  // the figure scaled into a reserved box (0..1 pts → the box)
  const box={ x:26, y:22, w:CW-52, h:116 };
  let minx=1,miny=1,maxx=0,maxy=0;
  for(const p of card.ptsN){ minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x); miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y); }
  const bw=Math.max(1e-3,maxx-minx), bh=Math.max(1e-3,maxy-miny);
  const sc=Math.min(box.w/bw, box.h/bh)*0.84;
  const ox=box.x+box.w/2-(minx+bw/2)*sc, oy=box.y+box.h/2-(miny+bh/2)*sc;
  const P=card.ptsN.map(p=>({x:ox+p.x*sc, y:oy+p.y*sc}));
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='rgba(240,199,102,0.9)'; g.lineWidth=1.4;
  g.shadowColor='rgba(240,199,102,0.6)'; g.shadowBlur=5;
  g.beginPath(); P.forEach((p,i)=> i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke();
  g.shadowBlur=0;
  for(const p of P){ g.fillStyle='#ffe9a8'; g.beginPath(); g.arc(p.x,p.y,1.8,0,TAU); g.fill(); }
  // name band
  g.textAlign='center';
  g.fillStyle='#f0c766'; g.font='15px ' + getComputedStyle(document.body).getPropertyValue('--serif');
  g.fillText(fit(g, lore.name, CW-40), CW/2, box.y+box.h+26);
  g.fillStyle='#9db4ff'; g.font='9px ' + getComputedStyle(document.body).getPropertyValue('--mono');
  g.fillText(lore.designation, CW/2, box.y+box.h+42);
  // myth band (both lines, small italic)
  g.fillStyle='rgba(233,220,192,0.82)'; g.font='italic 10px ' + getComputedStyle(document.body).getPropertyValue('--serif');
  let yy=box.y+box.h+62;
  yy=wrapCentered(g, lore.myth[0], CW/2, yy, CW-36, 13)+16;
  wrapCentered(g, lore.myth[1], CW/2, yy, CW-36, 13);
}
function fit(g,text,maxW){
  if(g.measureText(text).width<=maxW) return text;
  let t=text; while(t.length>3 && g.measureText(t+'…').width>maxW) t=t.slice(0,-1);
  return t+'…';
}
shelf.prev.addEventListener('click', ()=>{ if(shelf.view>0){ shelf.view--; renderShelf(); } });
shelf.next.addEventListener('click', ()=>{ if(shelf.view<shelf.cards.length-1){ shelf.view++; renderShelf(); } });

/* ═══════════════════════════════════════════════════════════════════════════
   AUDIO — silent until the first gesture; honors ws:pref:muted (shared).
   Gate.sfx.<key> builders are installed by the included sfx-*.js. Gate.sfxPlay
   routes through the live ctx + respects mute; Gate.unlock() creates/resumes the
   ctx inside a user gesture.
   ═══════════════════════════════════════════════════════════════════════════ */
window.Gate = window.Gate || {}; Gate.sfx = Gate.sfx || {}; Gate.art = Gate.art || {};
Gate._ctx = null;
function isMuted(){ try{ return (typeof WS!=='undefined'&&WS.muted)?WS.muted():localStorage.getItem('ws:pref:muted')==='1'; }catch(e){ return false; } }
Gate.unlock = function(){
  try{
    if(!Gate._ctx) Gate._ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(Gate._ctx.state==='suspended') Gate._ctx.resume();
  }catch(e){}
};
Gate.sfxPlay = function(key, dur, param){
  if(isMuted()) return;
  const ctx=Gate._ctx; if(!ctx || ctx.state!=='running') return;
  const b=Gate.sfx[key]; if(!b) return;
  try{ b({ ctx, dest:ctx.destination, dur, when:0, seed:1, param }); }catch(e){}
};

/* the mute control — a safe inline SVG in its own corner (no ♪ glyph mojibake) */
const muteBtn=$('mute');
function muteSVG(on){
  // a small speaker; a slash when muted
  return on
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="16" y1="9" x2="21" y2="14"/><line x1="21" y1="9" x2="16" y2="14"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7"/><path d="M18.5 6a7 7 0 0 1 0 12"/></svg>`;
}
function syncMute(){ muteBtn.innerHTML = muteSVG(isMuted()); }
muteBtn.addEventListener('click', ()=>{
  try{ if(typeof WS!=='undefined'&&WS.setMuted){ WS.setMuted(!WS.muted()); } else { localStorage.setItem('ws:pref:muted', isMuted()?'0':'1'); } }catch(e){}
  syncMute();
});
try{ if(typeof WS!=='undefined'&&WS.onMuteChange) WS.onMuteChange(syncMute); }catch(e){}
syncMute();

/* ═══════════════════════════════════════════════════════════════════════════
   RESIZE / BOOT / SELF-TEST
   ═══════════════════════════════════════════════════════════════════════════ */
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=Math.max(1,W*DPR); cv.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,80));

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('pointerleave', ()=>{ if(!dragging) pointer.has=false; });

/* WELL-FORMEDNESS self-test (claim-free) — mirrors core.test.mjs against the SAME
   inlined starlore. Byte-identical re-ink from a stored seed + N-star well-formedness.
   Console-only; the piece owes no proof. */
function selfTest(){
  const fig = s=>s.map(([x,y])=>({x,y}));
  const cases=[
    fig([[.5,.15],[.75,.3],[.78,.62],[.55,.8],[.3,.7],[.24,.36],[.5,.15]]),  // ring
    fig([[.2,.2],[.38,.4],[.56,.6],[.74,.8]]),                                // line
    fig([[.2,.3],[.45,.6],[.3,.75],[.6,.5],[.78,.72]]),                       // tangle
  ];
  const wf=/^The .+/;
  let allWF=true, allDet=true;
  for(const pts of cases){
    const a=nameSky('selftest', pts), b=nameSky('selftest', pts.map(p=>({x:p.x,y:p.y})));
    if(!(wf.test(a.name) && a.myth.length===2 && a.myth[0].endsWith(',') && a.myth[1].endsWith('.'))) allWF=false;
    if(a.sig!==b.sig) allDet=false;
  }
  // arbitrary N well-formed
  for(let n=2;n<=12;n++){ const r=makeRng('n'+n); const pts=[]; for(let k=0;k<n;k++)pts.push({x:r(),y:r()}); const a=nameSky('n'+n,pts); if(!wf.test(a.name)) allWF=false; }
  const pass=allWF&&allDet;
  console.log('%cA Sky You Name — self-test (well-formedness only)', 'color:#f0c766;font-weight:bold');
  console.log(`  ${allWF?'✓':'✗'} any N-star figure → well-formed name + two-line myth`);
  console.log(`  ${allDet?'✓':'✗'} kept chart re-inks byte-identical from its seed (gen v${GEN_VERSION})`);
  console.log(pass?'%cALL WELL-FORMED':'%cFAILED', pass?'color:#7fd67f':'color:#e07f7f');
  window.__selfTest={ pass, allWF, allDet, version:GEN_VERSION };
  return pass;
}

/* prototype-free production: no ?frozen / ?reduced flags, no test-driver BRIDGE
   (Explorer 0's window.__sky.drive() synthetic-pointer harness is gone — the
   interaction is verified with GENUINE trusted input). What remains is a tiny,
   INERT, READ-ONLY inspector: it drives nothing and mutates nothing, it only
   reads state so a headless self-test can confirm well-formedness. */
window.__sky = {
  state:()=>({ laced:[...laced], phase, reveal: reveal?reveal.lore.name:null,
    myth: reveal?[reveal.lore.myth[0],reveal.lore.myth[1]]:null, kept:shelf.cards.length,
    firstGesture, ctx: Gate._ctx?Gate._ctx.state:'none' }),
  anchorPx:(i)=>anchorPx(field.anchors[i]),
  seed:()=>field.seed
};

resize();
newSky();
renderShelf();
selfTest();
requestAnimationFrame(draw);

/* drop the front-door seen breadcrumb on a direct visit (kin to the other pages) */
try{ var __ck='ws:seen:a-sky-you-name'; if(!localStorage.getItem(__ck)) localStorage.setItem(__ck, String(Date.now())); }catch(e){}
</script>
