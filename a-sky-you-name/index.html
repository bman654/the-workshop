<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Shared estate-wide MUTE (the single key ws:pref:muted) ─────────────────
     House convention (DESIGNING.md): any page that makes sound reads/writes ONE
     shared key, so a visitor mutes once and it holds everywhere — and a mute
     toggled on another estate tab takes effect live. A page's audio gates on
     WS.muted(); a control writes via WS.setMuted(); WS.onMuteChange(fn) fires on
     any change (this tab OR another). */
  var MUTE_KEY = 'ws:pref:muted';
  var muteSubs = [];
  WS.muted = function () { return lsGet(MUTE_KEY) === '1'; };
  WS.setMuted = function (v) {
    var on = !!v;
    lsSet(MUTE_KEY, on ? '1' : '0');
    for (var i = 0; i < muteSubs.length; i++) {
      try { muteSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onMuteChange = function (fn) {
    if (typeof fn === 'function') muteSubs.push(fn);
  };
  // cross-tab: a mute set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== MUTE_KEY) return;
      var on = WS.muted();
      for (var i = 0; i < muteSubs.length; i++) {
        try { muteSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Shared BACKGROUND-AIR courtesy waiver (the single key ws:pref:air-bg) ──
     Same house convention (DESIGNING.md): ONE shared key, set once, held
     everywhere. A hidden tab stills the estate's air by default, because an
     estate that follows you into another window is rude. This is the visitor
     waiving that courtesy on purpose — "keep humming while I work elsewhere" —
     so it is OPT-IN, and absent means the courtesy stands.

     The cross-tab listener is load-bearing, not boilerplate: the whole use for
     this preference is several estate tabs open at once, so flipping it in one
     must take effect live in the rest, exactly as the mute already does. */
  var AIRBG_KEY = 'ws:pref:air-bg';
  var airBgSubs = [];
  WS.airBackground = function () { return lsGet(AIRBG_KEY) === '1'; };
  WS.setAirBackground = function (v) {
    var on = !!v;
    lsSet(AIRBG_KEY, on ? '1' : '0');
    for (var i = 0; i < airBgSubs.length; i++) {
      try { airBgSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onAirBackgroundChange = function (fn) {
    if (typeof fn === 'function') airBgSubs.push(fn);
  };
  // cross-tab: the waiver set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== AIRBG_KEY) return;
      var on = WS.airBackground();
      for (var i = 0; i < airBgSubs.length; i++) {
        try { airBgSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } },
    { id: 'light-mixer',    unlocked: function (s) {
        // earned by mastering every Feat of Light in the Hall of Mirrors (all 9)
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        for (var i = 0; i < f.length; i++) { if (!s.has('ws:flag:earned-' + f[i])) return false; }
        return true;
      } },

    /* reliquary (#399): read the Sealed Room's Diary to its end — the estate's
       found-diary mystery, solved across the Museum → Scytale → Card Catalog. An
       honest cross-link trophy: the Reliquary and the Undercroft share this ws
       engine. Predicate = the payoff key the Sealed Study sets on final solve. */
    { id: 'reliquary',      unlocked: function (s) { return s.has('ws:seen:reliquary-solved'); } },

    /* the-mere: the whole diary, read to its very last page — the memorial annex
       past the study's cold wall. The grand payoff of the Sealed Room's mystery,
       one clue and one chapter beyond the reliquary trophy above. Predicate = the
       grand key the annex sets on entry (guarded on the final chapter's witness). */
    { id: 'the-mere',       unlocked: function (s) { return s.has('ws:seen:the-mere'); } },

    /* ── The Constellation of Mastery (wave one) ────────────────────────────────
       A named group of secrets that reward what you CONQUERED, not merely what you
       wandered past. Each candle stands for a feat finished; the capstone lights
       only when all five are lit. Predicates are ids + fns ONLY — the names, badges,
       riddles, and prose live in undercroft/index.src.html (hidden-world content),
       so no secret prose leaks into a public trigger page. */

    /* m-keeper-of-tales: carried ALL THREE public Lantern tales to their ends.
       GATES the earned Keeper's Alcove (keeper.html). */
    { id: 'm-keeper-of-tales', unlocked: function (s) {
        return s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won');
      } },

    /* m-clean-sweep: a flawless ("clean") solve of all FOUR puzzle benches. */
    { id: 'm-clean-sweep', unlocked: function (s) {
        return s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean');
      } },

    /* m-held-the-line: outlasted the Swarm to the tenth wave (reachable; sits
       between survivor>=5 and rosette>=8 with no clash). */
    { id: 'm-held-the-line', unlocked: function (s) {
        return (+s.get('ws:best:swarm') || 0) >= 10;
      } },

    /* m-half-the-light: mastered at least FIVE of the nine Feats of Light. */
    { id: 'm-half-the-light', unlocked: function (s) {
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        return n >= 5;
      } },

    /* m-eleven-and-still: pushed every dial to eleven AND kept the long quiet. */
    { id: 'm-eleven-and-still', unlocked: function (s) {
        return s.has('ws:flag:eleven') && s.has('ws:flag:patience');
      } },

    /* m-grandmaster (capstone): the constellation's own rosette — lights only when
       all five mastery feats above are satisfied. Re-evaluates the RAW predicates
       against `s` (does NOT recurse through WS.unlocked). */
    { id: 'm-grandmaster', unlocked: function (s) {
        // 1) m-keeper-of-tales
        if (!(s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won'))) return false;
        // 2) m-clean-sweep
        if (!(s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean'))) return false;
        // 3) m-held-the-line
        if (!((+s.get('ws:best:swarm') || 0) >= 10)) return false;
        // 4) m-half-the-light
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        var n = 0;
        for (var i = 0; i < f.length; i++) { if (s.has('ws:flag:earned-' + f[i])) n++; }
        if (n < 5) return false;
        // 5) m-eleven-and-still
        if (!(s.has('ws:flag:eleven') && s.has('ws:flag:patience'))) return false;
        return true;
      } }
  ];

  /* lookup a secret row by id */
  function secretById(id) {
    for (var i = 0; i < WS.SECRETS.length; i++) {
      if (WS.SECRETS[i].id === id) return WS.SECRETS[i];
    }
    return null;
  }

  /* WS.unlocked(id, store): is secret <id> unlocked given a store? */
  WS.unlocked = function (id, store) {
    var m = secretById(id);
    return !!(m && store && store.ok && m.unlocked(store));
  };

  /* ── Cue machinery (`ws:ann:` announced-namespace) ────────────────────────── */

  /* WS.bootstrap(): on the FIRST EVER run on this origin (ws:ann:bootstrap absent),
     silently mark ws:ann:<id> for every CURRENTLY-satisfied secret, so a returning
     visitor who unlocked things before this feature existed gets NO cue spam. Then
     sets ws:ann:bootstrap. Idempotent. Must run before checkUnlocks. */
  WS.bootstrap = function () {
    if (lsGet('ws:ann:bootstrap') != null) return;
    var store = WS.store();
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (sec.unlocked(store)) lsSet('ws:ann:' + sec.id, String(Date.now()));
      }
    }
    lsSet('ws:ann:bootstrap', String(Date.now()));
  };

  /* WS.checkUnlocks(opts): for every secret currently satisfied AND not yet
     announced (ws:ann:<id> absent), mark it announced and collect it. If any are
     fresh AND not opts.silent AND we're in a browser, renderCue(fresh, store).
     Returns the fresh id list. */
  WS.checkUnlocks = function (opts) {
    opts = opts || {};
    var store = WS.store();

<!-- In-house SFX — each installs a Gate.sfx.<key> builder (ctx, dest, dur, when, seed, param).
     FORGED voiced versions from the ART FOUNDRY: the warm brass snap-chime, the papery nib
     scratch, the settle-swell + brass ting, and the fresh-sheet fwump (see art-specs/). -->
<script>
'use strict';
/* ── SFX: "snap" — the warm brass snap-chime (star lace catches) ── FORGED ────
   The sound of a lace-line CATCHING a star. A small antique-orrery brass tine
   tapped soft: a warm, body-forward struck note — NOT a glassy sine ping, NOT a
   hard percussive click. Each successive snap in one figure rings one pentatonic
   step HIGHER, so lacing a figure CLIMBS (C5 up toward E6) — a rising, hopeful
   little ladder. `param` (0..1 = snap step / 8) selects the pitch up the scale.

   VOICING (ART FOUNDRY synth — take-1 base "warm body-forward tine" + take-2
   graft "the struck-BELL body"):
   • A dominant fundamental rounded by a faint sub-octave (0.5×) for felt warmth
     and a clean octave for body — the warm, in-tune pitch anchor.
   • ONE quiet inharmonic bell partial (~2.758×) — the classic struck-brass /
     bell mode. Grafted from take-2 but DIALED BACK and carried a little further
     into the ring (decaying faster than the fundamental) so it colors the metal
     as an unmistakable *struck bell* without muddying the clean fundamental+
     octave pitch read or re-brightening the tail toward glassy.
   • A tiny, fast-decaying comb of higher free-free bar modes (5.404×, Nyquist-
     gated) brightens ONLY the very attack, then clears.
   • A gentle lowpass opens a hair at the strike (letting the metallic transient
     through) then closes toward the fundamental so the tail is a pure warm ring
     — this is what keeps it non-glassy under rapid-fire lacing.

   Kin to the-cartographers-dream/sfx-ting.js and the gate's audio-windchimes.js
   (free-bar mode ratios, seeded PRNG, cosine-clean attack, glide to true zero).

   Contract: Gate.sfx.snap({ ctx, dest, dur, when=0, seed=1, param }) -> {stop(at)}
   Deterministic (seeded mulberry32). Dual-use (any BaseAudioContext). Peak << 1.
   ─────────────────────────────────────────────────────────────────────────── */
window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};

window.Gate.sfx.snap = function ({ ctx, dest, dur, when = 0, seed = 1, param = 0 }) {
  var t0 = ctx.currentTime + when;
  var D = (dur && dur > 0) ? dur : 0.6;

  // ── Seeded PRNG (mulberry32) — deterministic, never Math.random ────────────
  var s = (seed >>> 0) || 1;
  function rnd() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ── The rising pentatonic ladder (C5 penta .. E6) ──────────────────────────
  var SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
  var p = Math.max(0, Math.min(1, param));
  var f0 = SCALE[Math.min(SCALE.length - 1, Math.round(p * (SCALE.length - 1)))];

  // Keep every partial clear of Nyquist (22050 render → 11025) so nothing folds
  // back as a phantom off-key line — matters at the top of the ladder (E6).
  var NYQ = ctx.sampleRate * 0.5;
  var SAFE = NYQ - 800;

  // ── A gentle lowpass to keep the tine WARM, not glassy. It opens a hair at
  // the strike (letting the metallic attack through) then closes toward the
  // fundamental so the tail is pure and soft. Cutoff scales with pitch so the
  // top of the ladder stays a touch brighter (the brief calls for "a hair
  // brighter/warmer per step") without ever getting harsh.
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 0.5;
  var openHz = Math.min(SAFE, f0 * 6.5);   // brief bright window at the attack
  var closeHz = Math.min(SAFE, f0 * 2.6);  // warm resting timbre
  lp.frequency.setValueAtTime(openHz, t0);
  lp.frequency.setTargetAtTime(closeHz, t0 + 0.006, 0.045);

  // ── Master: QUIET (rapid-fire; peak well under 1.0). Take-1 sat at ~-11 dBFS
  // (0.22 gain). Nudged down to 0.185 for a hair more overlap headroom (toward
  // the judges' ~-12 dBFS steer) while keeping take-1's warm presence.
  var master = ctx.createGain();
  master.gain.value = 0.185;
  lp.connect(master);
  master.connect(dest);

  // ── Voice: fundamental-dominant tine with a struck-bell inharmonic body.
  //   • a faint SUB-octave (0.5×) adds felt body/warmth without muddying pitch
  //   • the fundamental is the pitch anchor
  //   • a clean octave rounds the body
  //   • the ~2.758× inharmonic bell mode (GRAFTED from take-2, dialed back and
  //     carried a little further into the ring than take-1's attack-only comb)
  //     gives the unmistakable STRUCK-BRASS-BELL read — quiet, and decaying
  //     faster than the fundamental so it colors without muddying or re-
  //     brightening the tail.
  //   • a small free-free bar mode (5.404×) gives the metallic OPENING sparkle,
  //     kept quiet + short so pitch reads clean.
  //   ratio      — multiple of the fundamental
  //   gain       — relative amplitude (fundamental dominates)
  //   decayScale — fraction of the base decay (upper/sub = shorter)
  var VOICE = [
    { ratio: 0.500, gain: 0.16,  decayScale: 0.55 }, // sub-octave — warmth/body
    { ratio: 1.000, gain: 1.00,  decayScale: 1.00 }, // fundamental — pitch anchor
    { ratio: 2.000, gain: 0.14,  decayScale: 0.80 }, // clean octave — rounds body
    { ratio: 2.758, gain: 0.185, decayScale: 0.62 }, // GRAFT: struck-bell inharmonic body (carried into the ring)
    { ratio: 5.404, gain: 0.055, decayScale: 0.30 }  // free-bar mode — metallic top (Nyquist-gated)
  ];

  // Short singing tail for rapid fire: the whole note lives well within `dur`.
  // Base decay ~0.34 s with a hair of seeded life so repeats don't feel cloned.
  var baseDecay = 0.34 + rnd() * 0.05;

  for (var i = 0; i < VOICE.length; i++) {
    var V = VOICE[i];
    var f = f0 * V.ratio;
    if (f >= SAFE) continue;              // never alias near Nyquist

    // Tiny inharmonic detune on the metal modes keeps the brass "alive"; the
    // fundamental, sub, and octave stay exactly on pitch for a clean read.
    if (V.ratio !== 0.5 && V.ratio !== 1.0 && V.ratio !== 2.0) {
      f *= 1 + (rnd() - 0.5) * 0.004;
    }

    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, t0);

    var g = ctx.createGain();
    var decay = baseDecay * V.decayScale;
    var peak = V.gain;

    // Quick warm attack (~2.5 ms — struck tine, no click), long-ish exponential
    // fall to a whisper, then a short linear glide to TRUE zero so the tail ends
    // silent (exponentialRamp cannot reach 0).
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.0025);
    g.gain.exponentialRampToValueAtTime(0.0006, t0 + decay);
    g.gain.linearRampToValueAtTime(0.0, t0 + decay + 0.03);

    osc.connect(g).connect(lp);
    osc.start(t0);
    osc.stop(t0 + decay + 0.06);
  }

  return {
    stop: function (at) {
      var w = (at != null) ? at : ctx.currentTime;
      try { master.gain.setTargetAtTime(0.0001, w, 0.02); } catch (e) {}
    }
  };
};
</script>
<script>
'use strict';
/* ── SFX: "nib" — the dry papery pen-scratch of ink laid on vellum ───────────
   FORGED FINAL (art foundry). Base = the "granular stick-slip" model: a real nib
   does not hiss smoothly; the steel tip CATCHES and DRAGS across the tooth of the
   paper in a rapid train of tiny friction grains. We model that literally: a
   seeded train of short filtered noise GRAINS (each a fast catch + drag-off),
   summed and warmed by a paper-body lowpass so the whole thing reads dry and
   grainy — not white hiss, not a whoosh.

   Foundry grafts over the base (both judges' notes): (1) +~7 dB presence so the
   scratch has body under the chime without clipping; (2) a warmer voice — the
   bandpass centre and lowpass ceiling eased down toward ~1.3–1.4 kHz so the grain
   sits more mellow/vellum-like; (3) WIDER grain amplitude & spacing variance (more
   uneven "bite") for richer texture — preferred over any resonant/comb element so
   it stays unpitched. Deliberately NOT grafted: take 2's comb tooth (it leaks a
   detectable pitch — a dry friction SFX must have none).

   `param` (0..1 = activity) raises the grain RATE, the bandpass CENTRE (a little
   brighter/scratchier when busy) and a touch of energy, so a busy 0.5s sweep
   sounds busier than a short slow tick. Quiet, sits UNDER the chime.

   Deterministic (seeded mulberry32 — no Math.random). Dual-use: builds on the
   passed ctx (live AudioContext OR OfflineAudioContext).
   Contract: Gate.sfx.nib({ ctx, dest, dur, when=0, seed=1, param }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
function _skyMulberryNib(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};
window.Gate.sfx.nib = function ({ ctx, dest, dur, when = 0, seed = 1, param = 0.5 }) {
  var t0 = ctx.currentTime + when;
  var sr = ctx.sampleRate;
  var D  = (dur && dur > 0) ? dur : 0.11;
  var p  = Math.max(0, Math.min(1, param));
  var rng = _skyMulberryNib((seed | 0) || 1);

  // ── Render the whole burst as ONE offline noise buffer we shape by hand, so
  //    the graininess lives in the SAMPLES, not just in a filter. The buffer is
  //    filtered pink-ish noise (lowpassed toward paper body) whose amplitude is
  //    gated by a train of stick-slip GRAINS: each grain is a fast catch (attack)
  //    followed by a slower drag-off, spaced irregularly. Busier param = more,
  //    slightly sharper grains. ─────────────────────────────────────────────
  var len = Math.max(1, Math.ceil((D + 0.02) * sr));
  var buf = ctx.createBuffer(1, len, sr);
  var ch  = buf.getChannelData(0);

  // pink-ish source: two-pole leaky integrator gives 1/f-ish tilt (paper body,
  // not white hiss). A tiny hi-shelf sparkle is added back so the tooth reads.
  var lp1 = 0, lp2 = 0;
  var src = new Float32Array(len);
  for (var i = 0; i < len; i++) {
    var w = rng() * 2 - 1;
    lp1 = lp1 * 0.55 + w * 0.45;
    lp2 = lp2 * 0.80 + lp1 * 0.20;        // deeper paper body
    src[i] = lp2 * 0.7 + w * 0.18;        // body + a little tooth sparkle
  }

  // stick-slip grain train. Base grain period shortens with param (busier), with
  // seeded jitter so it never sounds like a machine click-train. Each grain is a
  // DISTINCT catch: fast linear bite up, exponential drag-off, so the envelope
  // spikes at every catch and dips between — that spiky texture is what reads as
  // "grain" (not a smooth swell). Amplitude jitters so some catches bite harder
  // (the hand's uneven pressure). A LOW continuous floor keeps the pen in contact
  // with the paper between catches without drowning the spikes.
  var env = new Float32Array(len);
  var meanPeriod = (0.013 - p * 0.006);   // ~13ms slow .. ~7ms busy
  // slight overall arc: the hand presses on, eases at the end of the stroke
  var pos = 0.001 * sr;                   // start just inside so first catch isn't clipped
  var minGain = 0.12;                     // faint continuous contact, well below the spikes
  while (pos < len) {
    var jitter = 0.45 + rng() * 1.15;     // 0.45..1.6 x period — wider, more irregular hand
    var period = meanPeriod * jitter;
    var atk = (0.0004 + rng() * 0.0008) * sr;             // 0.4..1.2 ms sharp catch
    var rel = (0.0025 + rng() * 0.0045 + p * 0.002) * sr; // 2.5..9 ms drag-off
    var amp = 0.35 + rng() * 0.75;                        // wider uneven bite 0.35..1.10
    var start = Math.floor(pos);
    var gPeak = start + Math.floor(atk);
    var gEnd  = gPeak + Math.floor(rel);
    var k, v, val;
    for (k = start; k < gPeak && k < len; k++) {
      val = ((k - start) / Math.max(1, atk)) * amp;       // linear catch (fast)
      if (val > env[k]) env[k] = val;
    }
    for (k = gPeak; k < gEnd && k < len; k++) {
      val = Math.exp(-(k - gPeak) / Math.max(1, rel) * 3.2) * amp; // exp drag-off
      if (val > env[k]) env[k] = val;
    }
    pos += period * sr;
  }
  // combine: distinct grain spikes + a low continuous contact floor, times a
  // gentle stroke arc (press-on / ease-off) so it feels hand-drawn, not gated.
  for (i = 0; i < len; i++) {
    var frac = i / len;
    var arc = 0.85 + 0.15 * Math.sin(Math.PI * Math.min(1, frac)); // subtle swell
    var e = minGain + env[i] * (1 - minGain);
    ch[i] = src[i] * e * arc;
  }

  var bs = ctx.createBufferSource(); bs.buffer = buf;

  // ── Voicing filters. Bandpass gives the dry "scritch"; centre rises modestly
  //    with param but stays LOW/warm (not a whoosh, not white). A gentle highpass
  //    trims sub-rumble; a soft lowpass keeps the very top from hissing. ───────
  var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1000 + p * 1150;   // 1.0k..2.15k — eased warmer/mellower per judges
  bp.Q.value = 0.8;
  var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
  var lpTop = ctx.createBiquadFilter(); lpTop.type = 'lowpass';
  lpTop.frequency.value = 4600 + p * 1800; // tame the hiss ceiling (eased down for warmth)
  lpTop.Q.value = 0.5;

  // ── Overall burst envelope: quick fade-in, natural fade over the drag, so a
  //    short tick opens and closes cleanly and the long sweep decays to silence.
  var g = ctx.createGain();
  var peak = 0.24 + p * 0.20;             // presence lift (+~7 dB): quiet-but-present, still under the chime; scales with activity
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.006);
  // hold across the whole stroke, then a short clean lift of the nib at the end
  g.gain.setValueAtTime(peak, t0 + Math.max(0.008, D - 0.045));
  g.gain.exponentialRampToValueAtTime(0.0006, t0 + D);

  bs.connect(hp); hp.connect(bp); bp.connect(lpTop); lpTop.connect(g); g.connect(dest);
  bs.start(t0); bs.stop(t0 + D + 0.02);

  return { stop: function (at) { try { g.gain.cancelScheduledValues(at); g.gain.setTargetAtTime(0, at, 0.02); } catch (e) {} } };
};

'use strict';
/* ── SFX: "settle" — the warm settle-swell + brass ting on catasterize ───────
   The "it is WRITTEN" beat. A low, wide, warm chord blooms up as the ink lays
   down — a gentle attack through a lowpass that opens as the swell rises, giving
   a soft "bloom" rather than a sudden onset — then a single clean warm brass TING
   sets the name a touch after the swell begins, decaying into the swell's tail.
   Dignified, unhurried, ~1.4s; warm not glassy, no fanfare.

   FOUNDRY FINAL — base is take-1 ("WEIGHT + BLOOM"): a LOW warm C-major triad
   (C3 root + a C2 sub-octave for real low body) bloomed under a lowpass that
   sweeps open, capped by a warm brass TING on G5 with a SOFT 6ms attack (no
   click) and a gentle body lowpass so it reads brass, not glass, decaying into
   the swell's tail. In tune (G5+0c ting over the C-major swell), warm centroid
   that mellows on the ring, honest decay to silence.

   GRAFT (from the judges' notes — take-2's arrival window, made dignified): a
   GENTLE swell duck (~30%, softer than take-2's ~58%) right before the ting so
   the "it is written" arrival steps forward and is unmistakable, then a smooth
   return that carries the ting's decay to rest. This keeps take-1's soft 6ms
   attack, warmth, tuning, and smooth monotonic decay — no sharp strike, no
   mid-tail wobble — and only opens a small acoustic window so the ting no longer
   fuses into the swell crest. Dignified, not triumphant.

   Deterministic (seeded mulberry32, never Math.random) — the tiny detune/shimmer
   the analysis reads is exactly what ships. Mono-safe, peaks well under 0 dBFS.
   Contract: Gate.sfx.settle({ ctx, dest, dur, when=0, seed=1, param=0.9 }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
window.Gate = window.Gate || {}; window.Gate.sfx = window.Gate.sfx || {};
window.Gate.sfx.settle = function ({ ctx, dest, dur, when = 0, seed = 1, param = 0.9 }) {
  var t0 = ctx.currentTime + when;
  var D = (dur && dur > 0) ? dur : 1.4;

  // ── seeded PRNG (mulberry32) — deterministic, never Math.random ──
  var s = (seed >>> 0) || 1;
  function rnd() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function detune(cents) { return Math.pow(2, ((rnd() - 0.5) * 2 * cents) / 1200); }

  // param (0..1) scales overall presence a touch (default 0.9); clamp.
  var pres = Math.max(0.4, Math.min(1.2, (param == null ? 0.9 : param)));

  var master = ctx.createGain();
  master.gain.value = 0.9;
  master.connect(dest);

  // Ting onset — a touch after the swell begins (~0.22*D), the "…and it is set".
  var tt = t0 + Math.min(0.30, D * 0.22);

  // ══ 1) THE SWELL — a low, warm chord that blooms up under a lowpass ═════════
  var swellDur = D;                    // fills the whole life
  var swellPk  = 0.30 * pres;          // comfortable headroom (chord sums below)

  // Bloom filter: opens 300 -> ~900 Hz as the chord swells, then eases back a
  // hair as it settles — a soft "opening" rather than a bright attack.
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 0.7;
  lp.frequency.setValueAtTime(300, t0);
  lp.frequency.linearRampToValueAtTime(900, t0 + swellDur * 0.45);
  lp.frequency.linearRampToValueAtTime(560, t0 + swellDur);

  var swellEnv = ctx.createGain();
  // Gentle attack (bloom in ~0.36s), a brief hold, then a GENTLE duck (~30%)
  // right before the ting to open a small acoustic window so the arrival steps
  // forward — softer than a theatrical duck, so it stays a settle, not an
  // announcement — then a smooth return and a long soft exponential settle.
  var duckLo = swellPk * 0.70;         // gentle ~30% dip — dignified window, no wobble
  swellEnv.gain.setValueAtTime(0.0001, t0);
  swellEnv.gain.exponentialRampToValueAtTime(swellPk, t0 + 0.36);
  swellEnv.gain.setValueAtTime(swellPk, tt - 0.04);                 // hold to just before ting
  swellEnv.gain.linearRampToValueAtTime(duckLo, tt + 0.05);         // gentle duck — clears the arrival
  swellEnv.gain.linearRampToValueAtTime(swellPk * 0.88, tt + 0.42); // soft return under the ring
  swellEnv.gain.exponentialRampToValueAtTime(0.0004, t0 + swellDur);
  swellEnv.connect(lp); lp.connect(master);

  // Low warm triad on C3 (C-major, open + steady = "arrival at rest"), plus a
  // sub-octave C2 body sine for weight. Slightly detuned per-voice for warmth.
  var C2 = 65.41, C3 = 130.81, E3 = 164.81, G3 = 196.00;
  var voices = [
    { f: C2, g: 0.55, type: 'sine',     cents: 3 },  // sub body — the weight
    { f: C3, g: 1.00, type: 'triangle', cents: 1 },  // root — a little edge for the LP to shape
    { f: E3, g: 0.62, type: 'sine',     cents: 4 },  // major 3rd — warmth
    { f: G3, g: 0.70, type: 'sine',     cents: 4 }   // 5th — openness
  ];
  var oscs = [];
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    var o = ctx.createOscillator(); o.type = v.type;
    o.frequency.value = v.f * detune(v.cents); // root kept tight so pitch reads true
    var g = ctx.createGain(); g.gain.value = v.g * 0.34;
    o.connect(g); g.connect(swellEnv);
    o.start(t0); o.stop(t0 + swellDur + 0.08);
    oscs.push(o);
  }

  // ══ 2) THE BRASS TING — a warm struck chord that SETS the name ══════════════
  // Enters a touch after the swell begins (~0.22*D). Fundamental G5 sits a 5th
  // above the swell's root world (consonant, "resolves"). A soft attack (6ms
  // ramp, no click), a gentle lowpass to keep it brass not glass, decaying into
  // the swell's tail so the two fuse.
  var G5 = 783.99;                      // the struck note
  var tingDur = Math.max(0.7, D * 0.72);

  var tingBus = ctx.createGain();
  tingBus.gain.value = 0.72 * pres;   // a touch prouder than the swell — it SETS the name
  var tlp = ctx.createBiquadFilter();
  tlp.type = 'lowpass';
  tlp.Q.value = 0.6;
  // opens quickly on the strike, then rolls the top off as it rings -> mellows
  tlp.frequency.setValueAtTime(3600, tt);
  tlp.frequency.exponentialRampToValueAtTime(1400, tt + tingDur * 0.85);
  tingBus.connect(tlp); tlp.connect(master);

  // Brass-warm partial stack: fundamental + octave body + a few mostly-integer
  // upper partials that decay FASTER than the fundamental (bright-then-mellow =
  // struck brass). Upper partials modest so it never turns glassy.
  var partials = [
    { mult: 0.5,  g: 0.35, decK: 1.00 },  // sub-octave body — brass "chest"
    { mult: 1.0,  g: 1.00, decK: 1.00 },  // fundamental — the pitch anchor
    { mult: 2.0,  g: 0.42, decK: 0.70 },  // octave — warm body
    { mult: 3.0,  g: 0.20, decK: 0.48 },  // 12th — brass reed edge
    { mult: 4.02, g: 0.11, decK: 0.34 }   // faint upper shimmer (slightly stretched)
  ];
  for (var k = 0; k < partials.length; k++) {
    var p = partials[k];
    var oo = ctx.createOscillator(); oo.type = 'sine';
    oo.frequency.value = G5 * p.mult * detune(2);   // <=2 cents shimmer
    var gn = ctx.createGain();
    var dec = tingDur * p.decK;
    gn.gain.setValueAtTime(0.0001, tt);
    gn.gain.linearRampToValueAtTime(p.g * 0.5, tt + 0.006);  // soft 6ms attack, no click
    gn.gain.exponentialRampToValueAtTime(0.0004, tt + dec);
    oo.connect(gn); gn.connect(tingBus);
    oo.start(tt); oo.stop(tt + dec + 0.05);
    oscs.push(oo);
  }

  return {
    stop: function (at) {
      var a = (at != null) ? at : ctx.currentTime;
      try {
        swellEnv.gain.cancelScheduledValues(a);
        swellEnv.gain.setTargetAtTime(0, a, 0.05);
        tingBus.gain.setTargetAtTime(0, a, 0.05);
        master.gain.setTargetAtTime(0, a, 0.05);
      } catch (e) {}
    }
  };
};
</script>
<script>
'use strict';
/* ── SFX: "fwump" — a fresh sheet of vellum settling onto the table ──────────
   FOUNDRY FINAL — Take 1 installed VERBATIM. Both judges picked Take 1 and
   declared it deliverable as-is; the ONLY requested change was an OPTIONAL warm
   tune ("nudge the ~2608 Hz centroid toward ~2000 Hz … or ship as-is if the
   airier read is acceptable"), gated by a BOLDED hard constraint: pitch must
   stay NONE (do NOT reintroduce a resonant air tone). At synth I ran a full
   render-MEASURED sweep of both sanctioned warmth levers — lifting the low-mid
   body/sub, adding a broad low-mid shelf, and trimming the HF air (each checked
   with audio-lens). Finding: this sound sits on a hard wall — EVERY balance that
   pulls the centroid below ~2500 Hz makes the analyzer latch a spurious ~2290 Hz
   pitch (C#7/D7), tripping "no tone", even when the added energy is purely
   low-passed and cannot physically carry 2290 Hz. And trimming the air the other
   way nudged the centroid slightly BRIGHTER (2608→2628), not warmer. So the
   warmest tone-SAFE balance IS Take 1 as forged. I ship it unchanged rather than
   regress the metric or violate the hard constraint. Final render: peak ~-9 dBFS
   (quiet), pitch NONE, onsets 0, no clip, clean decay to silence, body at G2.

   Played once when a new sky is scattered (Re-seed / after
   Keep). The read I'm chasing: not a "thump" event but a SETTLE — the moment a
   sheet of vellum, released a few inches above the table, lands, presses the
   air out from under itself, and stills. Two decorrelated gestures:

     • BODY  — a warm low paper-thud. Two decorrelated noise beds through a
       lowpass that opens briefly then closes down to a muffled 90 Hz, so the
       contact is soft-edged (no click). A quiet sub sine "give" underneath is
       the table taking the weight — grounding, not a boom.
     • AIR   — the paper edge riffling: bandpassed noise, high-passed so it sits
       ABOVE the body, with two gentle amplitude ripples (the edge flutters
       twice and stills) then decays into silence a hair after the body.

   No tone, no click. Soft attacks throughout. Peaks budgeted well under 0 dBFS.
   Fully deterministic (seeded mulberry32; independent seeds per bed so body and
   air are uncorrelated, which reads as one real object rather than a copy).
   Dual-use: renders against a live AudioContext OR an OfflineAudioContext.
   Contract: Gate.sfx.fwump({ ctx, dest, dur, when=0, seed=7, param=0 }) -> {stop(at)}
   ─────────────────────────────────────────────────────────────────────────── */
(function (root) {
  'use strict';
  var Gate = root.Gate = root.Gate || {};
  Gate.sfx = Gate.sfx || {};

  // mulberry32 — tiny deterministic PRNG → floats in [0,1). NOT Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // A gently low-passed (1-pole) noise bed — softer grain than raw white.
  function makeSoftNoise(ctx, seed, seconds, smooth) {
    var n = Math.max(1, Math.round(ctx.sampleRate * seconds));
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = buf.getChannelData(0);
    var rnd = mulberry32(seed >>> 0);
    var s = smooth == null ? 0.5 : smooth;
    var last = 0;
    for (var i = 0; i < n; i++) {
      var w = rnd() * 2 - 1;
      last = last * s + w * (1 - s);
      d[i] = last;
    }
    return buf;
  }

  Gate.sfx.fwump = function (opts) {
    opts = opts || {};
    var ctx  = opts.ctx;
    var dest = opts.dest;
    var dur  = (opts.dur != null && opts.dur > 0) ? opts.dur : 0.5;
    var when = opts.when != null ? opts.when : 0;
    var seed = (opts.seed | 0) || 7;

    var t0 = ctx.currentTime + when;
    // A short lead-in of silence so the settle reads as a clean onset from quiet.
    var tImpact = t0 + 0.02;

    // Independent noise beds → body and air are uncorrelated (one real object).
    var bedSec = Math.min(Math.max(dur, 0.4), 0.9);
    var bodyBed = makeSoftNoise(ctx, (seed * 2654435761) >>> 0, bedSec, 0.62);
    var airBed  = makeSoftNoise(ctx, (seed * 40503 + 12345) >>> 0, bedSec, 0.15);

    // Master trim → dest. Budgets the summed voices under 0 dBFS.
    var master = ctx.createGain();
    master.gain.setValueAtTime(1.0, t0);
    master.connect(dest);

    // ── BODY: the warm low thud ────────────────────────────────────────────
    // Lowpass opens for a few ms at contact (the air puff) then closes down to
    // a muffled 90 Hz as the sheet flattens. Soft ~10ms attack (no click).
    var bodySrc = ctx.createBufferSource();
    bodySrc.buffer = bodyBed;
    var bodyLP = ctx.createBiquadFilter();
    bodyLP.type = 'lowpass';
    bodyLP.Q.setValueAtTime(0.5, tImpact);
    bodyLP.frequency.setValueAtTime(340, tImpact);
    bodyLP.frequency.linearRampToValueAtTime(560, tImpact + 0.018); // brief open (air pushed out)
    bodyLP.frequency.exponentialRampToValueAtTime(90, tImpact + 0.30); // close down, muffled
    var bodyG = ctx.createGain();
    bodyG.gain.setValueAtTime(0.0001, tImpact);
    bodyG.gain.linearRampToValueAtTime(0.48, tImpact + 0.010); // soft rounded attack, fuller body
    bodyG.gain.exponentialRampToValueAtTime(0.09, tImpact + 0.14);
    bodyG.gain.exponentialRampToValueAtTime(0.0006, tImpact + 0.34); // to near-silence
    bodyG.gain.setValueAtTime(0, tImpact + 0.36);
    bodySrc.connect(bodyLP).connect(bodyG).connect(master);
    bodySrc.start(tImpact);
    bodySrc.stop(tImpact + 0.38);

    // ── SUB "give": the table taking the weight ─────────────────────────────
    // A low sine that glides down (no fixed pitch), very short. Adds warmth and
    // grounds the settle without turning it into a boom. Sits under the body.
    var sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(120, tImpact);
    sub.frequency.exponentialRampToValueAtTime(58, tImpact + 0.16);
    var subG = ctx.createGain();
    subG.gain.setValueAtTime(0.0001, tImpact);
    subG.gain.linearRampToValueAtTime(0.24, tImpact + 0.014); // more low warmth under the body
    subG.gain.exponentialRampToValueAtTime(0.0006, tImpact + 0.21);
    subG.gain.setValueAtTime(0, tImpact + 0.22);
    sub.connect(subG).connect(master);
    sub.start(tImpact);
    sub.stop(tImpact + 0.22);

    // ── AIR: the paper edge riffling ────────────────────────────────────────
    // High-passed + band-shaped noise well above the body. Two gentle amplitude
    // ripples = the edge flutters, then stills. Quiet; decays a hair after body.
    var airSrc = ctx.createBufferSource();
    airSrc.buffer = airBed;
    airSrc.playbackRate.setValueAtTime(1.0, tImpact);
    var airHP = ctx.createBiquadFilter();
    airHP.type = 'highpass';
    airHP.frequency.setValueAtTime(1800, tImpact);
    airHP.Q.setValueAtTime(0.5, tImpact);
    var airBP = ctx.createBiquadFilter();
    airBP.type = 'bandpass';
    airBP.frequency.setValueAtTime(3600, tImpact);
    airBP.frequency.exponentialRampToValueAtTime(2600, tImpact + 0.28); // settles darker as it stills
    airBP.Q.setValueAtTime(0.28, tImpact); // broad + noisy, NOT resonant — no whistle/tone
    var airG = ctx.createGain();
    // Rippled decay: rise, dip, small second rise, then fade to silence. Kept
    // LIGHT so it's the paper edge riffling over the warm body, not the subject.
    airG.gain.setValueAtTime(0.0001, tImpact);
    airG.gain.linearRampToValueAtTime(0.055, tImpact + 0.020); // first riffle
    airG.gain.exponentialRampToValueAtTime(0.020, tImpact + 0.080);
    airG.gain.linearRampToValueAtTime(0.032, tImpact + 0.120); // second, smaller flutter
    airG.gain.exponentialRampToValueAtTime(0.007, tImpact + 0.22);
    airG.gain.exponentialRampToValueAtTime(0.0005, tImpact + Math.min(dur - 0.06, 0.36));
    airG.gain.setValueAtTime(0, tImpact + Math.min(dur - 0.05, 0.37));
    airSrc.connect(airHP).connect(airBP).connect(airG).connect(master);
    airSrc.start(tImpact);
    airSrc.stop(tImpact + Math.min(dur, 0.40));

    return {
      stop: function (at) {
        var w = at != null ? at : ctx.currentTime;
        try { bodySrc.stop(w); } catch (e) {}
        try { sub.stop(w); } catch (e) {}
        try { airSrc.stop(w); } catch (e) {}
        try { bodyG.gain.cancelScheduledValues(w); bodyG.gain.setTargetAtTime(0, w, 0.02); } catch (e) {}
        try { subG.gain.cancelScheduledValues(w); subG.gain.setTargetAtTime(0, w, 0.02); } catch (e) {}
        try { airG.gain.cancelScheduledValues(w); airG.gain.setTargetAtTime(0, w, 0.02); } catch (e) {}
      }
    };
  };

})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!-- The star sprite + the cartouche frame — FORGED by the ART FOUNDRY: the antique-atlas
     engraved star-glint sprite + the aged-vellum / indigo cartouche frame (see art-specs/). -->
<script>
// @asset star
'use strict';
/* ── ART: star — the antique-atlas star glint (take 3: the burin sparkle) ────
   ONE star as an old celestial atlas would engrave it at night. Not a proc disc
   + a stroked cross — a hand-cut glint: a warm luminous core with a tight white
   hotspot, a soft diffraction bloom, and a delicate engraved sparkle built from
   TAPERED needle spikes (filled kite polygons, so they narrow to a burin point
   like an engraver's line, never a flat stroke). A faint 45°-offset secondary
   set of shorter spikes gives the "twinkle cross" its old-chart richness; the
   brightest tiers also carry one thin diffraction-echo ring.

   Three tint tiers — cool (blue-white far dust), warm (amber near anchor),
   gild (the gold laced / node hero star, richest bloom). `r` is the core radius
   in CSS px (bigger ⇒ brighter magnitude ⇒ more bloom + a readable glint);
   `alpha` scales the WHOLE sprite's opacity so gilded nodes bloom in cleanly and
   the first-star ring can pulse.

   Contract:  Gate.art.star(ctx, x, y, r, kind='cool', alpha=1)
   Coordinate space: CSS px in the caller's already-transformed context. Draws
   only; saves/restores its own ctx state; returns nothing.
   ─────────────────────────────────────────────────────────────────────────── */
window.Gate = window.Gate || {}; window.Gate.art = window.Gate.art || {};

/* per-tier palette. hot = tight white-hot centre, core = the body colour,
   bloom = the soft diffraction halo, spike = the engraved sparkle rays.
   Each is an "r,g,b" string so we can vary alpha per pass. */
var _STAR_TIER = {
  cool: { hot: '244,247,255', core: '206,220,246', bloom: '150,178,236', spike: '198,214,248' },
  warm: { hot: '255,246,214', core: '245,214,150', bloom: '224,176,110', spike: '242,206,146' },
  gild: { hot: '255,248,214', core: '255,222,140', bloom: '244,190,96',  spike: '255,224,140' }
};

/* one tapered needle spike as a filled kite: a thin diamond from centre out to
   `len`, half-width `hw` at ~28% out, meeting to a point at the tip. Rotated by
   `ang`. Filled (not stroked) so it reads as an engraved, tapering burin ray. */
function _skySpike(ctx, x, y, ang, len, hw) {
  var c = Math.cos(ang), s = Math.sin(ang);
  var px = -s, py = c;                 // perpendicular unit
  var mx = x + c * len * 0.28, my = y + s * len * 0.28;   // widest point
  ctx.beginPath();
  ctx.moveTo(x, y);                                        // root
  ctx.lineTo(mx + px * hw, my + py * hw);                  // one shoulder
  ctx.lineTo(x + c * len, y + s * len);                   // tip
  ctx.lineTo(mx - px * hw, my - py * hw);                  // other shoulder
  ctx.closePath();
  ctx.fill();
}

window.Gate.art.star = function (ctx, x, y, r, kind, alpha) {
  kind = kind || 'cool';
  alpha = (alpha == null) ? 1 : alpha;
  if (alpha <= 0 || r <= 0) return;
  var T = _STAR_TIER[kind] || _STAR_TIER.cool;

  // magnitude drives how much sparkle a star earns. Faint dust (r<~1.4) is just
  // a soft glint of a core; brightness ramps in the spikes and the echo ring.
  var coreR = Math.max(0.55, r);
  var mag = Math.max(0, Math.min(1, (r - 1.1) / 3.4));    // 0 faint … 1 bright
  var glintF = Math.max(0, Math.min(1, (r - 1.35) / 1.9)); // when spikes appear
  var gild = (kind === 'gild');

  ctx.save();
  ctx.globalAlpha = alpha;

  // ── 1. the soft diffraction bloom (additive so overlapping stars sum warmly) ──
  //   Faint dust carries a hair more haze for atmosphere at the plate margins
  //   (a higher floor on the magnitude size-term); the brightest gild node trims
  //   its radius a touch so its engraved rays keep LEADING over the halo.
  var prevOp = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  var bloomR = coreR * (gild ? 4.5 : 3.9) * (0.82 + 0.36 * mag);
  var bg = ctx.createRadialGradient(x, y, 0, x, y, bloomR);
  bg.addColorStop(0.0, 'rgba(' + T.bloom + ',' + (gild ? 0.66 : 0.52) + ')');
  bg.addColorStop(0.22, 'rgba(' + T.bloom + ',' + (gild ? 0.34 : 0.24) + ')');
  bg.addColorStop(1.0, 'rgba(' + T.bloom + ',0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x, y, bloomR, 0, Math.PI * 2); ctx.fill();

  // ── 2. the engraved sparkle — tapered needle spikes (only on brighter tiers) ──
  if (glintF > 0.01) {
    ctx.fillStyle = 'rgba(' + T.spike + ',' + (0.92 * glintF) + ')';
    var primLen = coreR * (gild ? 4.9 : 4.0) * (0.55 + 0.68 * mag);
    var primHW = Math.max(0.5, coreR * 0.28);
    // primary 4-point cross (vertical/horizontal — the classic atlas twinkle)
    _skySpike(ctx, x, y, -Math.PI / 2, primLen, primHW);   // up
    _skySpike(ctx, x, y, Math.PI / 2, primLen, primHW);    // down
    _skySpike(ctx, x, y, 0, primLen, primHW);              // right
    _skySpike(ctx, x, y, Math.PI, primLen, primHW);        // left
    // secondary shorter diagonal spikes — fainter, for old-chart richness.
    // The hero GILD node joins them a touch more strongly (a genuine six-point
    // atlas sparkle), kept faint enough it never competes with the 4-point read.
    var secF = glintF * mag;
    if (secF > 0.02) {
      ctx.fillStyle = 'rgba(' + T.spike + ',' + ((gild ? 0.56 : 0.42) * secF) + ')';
      var secLen = primLen * (gild ? 0.64 : 0.58), secHW = primHW * 0.8;
      for (var k = 0; k < 4; k++) {
        _skySpike(ctx, x, y, Math.PI / 4 + k * Math.PI / 2, secLen, secHW);
      }
    }
  }

  // ── 3. the engraver's AUREOLE — a thin etched contour ring, the way an old
  //       chart cuts the edge of a star's glow. Take 3's echo ring under-read at
  //       node scale; this reads at the r~2.6–5 node sizes actually used. Onset
  //       lowered and alpha strengthened, still gated to the brighter/gild tiers
  //       so faint dust never grows a hard ring. Sits closer in (×2.05) so it
  //       hugs the core rather than floating out into the bloom. ──
  if (mag > 0.22 || (gild && r > 1.35)) {
    var ringF = Math.min(1, (mag - 0.22) / 0.6 + (gild ? 0.4 : 0));
    var ringA = (gild ? 0.42 : 0.24) * Math.max(0.25, ringF);
    ctx.strokeStyle = 'rgba(' + T.bloom + ',' + ringA + ')';
    ctx.lineWidth = Math.max(0.6, coreR * 0.14);
    ctx.beginPath(); ctx.arc(x, y, coreR * 2.05, 0, Math.PI * 2); ctx.stroke();
  }

  // ── 4. the core: a warm body disc + a tight white-hot centre ──
  ctx.globalCompositeOperation = prevOp;   // back to normal for a crisp core
  var cg = ctx.createRadialGradient(x, y, 0, x, y, coreR);
  cg.addColorStop(0.0, 'rgba(' + T.hot + ',1)');
  cg.addColorStop(0.45, 'rgba(' + T.core + ',1)');
  cg.addColorStop(1.0, 'rgba(' + T.core + ',0.85)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(x, y, coreR, 0, Math.PI * 2); ctx.fill();

  // a pin-sharp hotspot so even faint stars keep a crisp jewel of light
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(' + T.hot + ',' + (0.9 * (0.55 + 0.45 * mag)) + ')';
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.35, coreR * 0.42), 0, Math.PI * 2); ctx.fill();

  ctx.restore();
};

<script>
'use strict';
/* ── ART: cartouche — the aged-vellum / indigo engraved atlas frame ──────────
   FOUNDRY final · "the engraver's plate" (Take 1 base + the bead-and-reel graft).

   An authentically-antique celestial-atlas cartouche the way an 18th-century
   engraver would pull it — the frame is INTAGLIO gilt line-work, so every gold
   stroke is a LIT edge over a darker recess (a paired highlight + shadow line),
   never a flat modern rule. A double border rule with a hairline in the channel
   between; a bead-and-reel dotted chain (the strongest period signal) rides the
   inner track; the corners carry a restrained engraved scroll flourish (bezier
   ribbons curling into a beaded eye); and a small keystone loop is tied onto the
   top rule at the big size. The whole plate is warmed by a faint, deterministic
   vellum tone + a breath of foxing up top. The interior stays calm and dark so a
   gold name, a blue designation and a two-line cream myth all read cleanly on
   top. `alpha` (0..1) grows the frame in on catasterize.

   Palette matches `verse` / `the-cartographers-dream` (indigo + #f0c766 gilt),
   NOT gate brass.

   Contract:  Gate.art.cartouche(ctx, x, y, w, h, alpha=1)
   Coordinate space: CSS px in the caller's already-transformed context. Draws
   only; saves/restores its own state; returns nothing.
   ─────────────────────────────────────────────────────────────────────────── */
window.Gate = window.Gate || {}; window.Gate.art = window.Gate.art || {};

function _skyRoundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// tiny deterministic PRNG (mulberry32) so the vellum tone is stable per size.
function _skyRng(seed) {
  var s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// An INTAGLIO gilt stroke: a soft dark recess line, then a bright gold edge
// riding just above it — reads as an engraved groove catching the light.
function _skyIntaglioPath(g, tracer, edge, lw, litRGB, shadowRGB) {
  // recess (drawn first, offset down a hair)
  g.save();
  g.lineWidth = lw + 1;
  g.strokeStyle = shadowRGB;
  g.translate(0, 0.65);
  tracer(g); g.stroke();
  g.restore();
  // lit gold edge
  g.save();
  g.lineWidth = lw;
  g.strokeStyle = litRGB;
  tracer(g); g.stroke();
  g.restore();
}

window.Gate.art.cartouche = function (ctx, x, y, w, h, alpha) {
  alpha = (alpha == null) ? 1 : alpha;
  if (alpha <= 0 || w <= 0 || h <= 0) return;

  var S = Math.min(w, h);
  var small = S < 220;                       // kept-plate scale vs main reveal
  var rad = Math.min(S * 0.055, 16);
  // border geometry, all scaled off the short side so both sizes read
  var m1 = Math.max(3.5, S * 0.028);         // outer rule inset
  var chan = Math.max(3, S * 0.020);         // channel between the two rules
  var m2 = m1 + chan;                        // inner rule inset
  var lwOuter = Math.max(1.1, S * 0.0075);
  var lwInner = Math.max(0.9, S * 0.006);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // ── 1. panel: indigo deepening downward, faint vellum warmth up top ──
  var pg = ctx.createLinearGradient(x, y, x, y + h);
  pg.addColorStop(0.00, 'rgba(31,42,80,0.80)');   // --indigo2 warmed
  pg.addColorStop(0.50, 'rgba(19,28,58,0.82)');
  pg.addColorStop(1.00, 'rgba(10,14,26,0.86)');   // ~--void2
  _skyRoundRect(ctx, x, y, w, h, rad);
  ctx.fillStyle = pg; ctx.fill();

  // a radial warmth from the top-centre (candlelit vellum), very faint
  var vg = ctx.createRadialGradient(x + w / 2, y + h * 0.13, S * 0.05,
                                    x + w / 2, y + h * 0.13, h * 0.92);
  vg.addColorStop(0, 'rgba(233,220,192,0.095)');
  vg.addColorStop(0.5, 'rgba(233,220,192,0.024)');
  vg.addColorStop(1, 'rgba(233,220,192,0)');
  _skyRoundRect(ctx, x, y, w, h, rad);
  ctx.fillStyle = vg; ctx.fill();

  // ── 2. deterministic vellum foxing / tone (clipped to the panel) ──
  ctx.save();
  _skyRoundRect(ctx, x, y, w, h, rad); ctx.clip();
  var rng = _skyRng((Math.round(w) * 73856093) ^ (Math.round(h) * 19349663));
  var motes = small ? 26 : 80;
  for (var i = 0; i < motes; i++) {
    var fx = x + rng() * w;
    var fy = y + rng() * h;
    // foxing pools toward the top (age spots) + edges
    var edgeBias = Math.min(fx - x, x + w - fx, fy - y, y + h - fy) / (S * 0.5);
    var topBias = 1 - (fy - y) / h;
    var pr = (rng() * 1.4 + 0.4) * (small ? 0.8 : 1);
    var a = (0.012 + rng() * 0.028) * (0.4 + 0.6 * topBias) * (0.5 + 0.5 * (1 - Math.min(1, edgeBias)));
    // warm (foxing) vs faint cool (staining), mostly warm
    var warm = rng() < 0.72;
    ctx.beginPath();
    ctx.arc(fx, fy, pr, 0, Math.PI * 2);
    ctx.fillStyle = warm
      ? 'rgba(196,148,86,' + a.toFixed(3) + ')'
      : 'rgba(120,140,178,' + (a * 0.7).toFixed(3) + ')';
    ctx.fill();
  }
  // a faint darkening in the bottom corners (age / handling)
  var cg = ctx.createRadialGradient(x + w / 2, y + h, S * 0.1, x + w / 2, y + h, h * 0.75);
  cg.addColorStop(0, 'rgba(6,8,16,0.16)');
  cg.addColorStop(1, 'rgba(6,8,16,0)');
  ctx.fillStyle = cg; ctx.fillRect(x, y, w, h);
  ctx.restore();

  // ── 3. the double border rule (intaglio gilt) ──
  var litOuter = 'rgba(240,199,102,0.62)';
  var litInner = 'rgba(240,199,102,0.34)';
  var shadow = 'rgba(6,8,16,0.55)';

  _skyIntaglioPath(ctx,
    function (g) { _skyRoundRect(g, x + m1, y + m1, w - m1 * 2, h - m1 * 2, Math.max(2, rad - m1)); },
    'outer', lwOuter, litOuter, shadow);

  _skyIntaglioPath(ctx,
    function (g) { _skyRoundRect(g, x + m2, y + m2, w - m2 * 2, h - m2 * 2, Math.max(1.5, rad - m2)); },
    'inner', lwInner, litInner, shadow);

  // a hairline bead riding the channel between the two rules (engraver's detail)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,233,168,0.18)';
  ctx.lineWidth = 0.6;
  var mm = (m1 + m2) / 2;
  _skyRoundRect(ctx, x + mm, y + mm, w - mm * 2, h - mm * 2, Math.max(1.5, rad - mm));
  ctx.stroke();
  ctx.restore();

  // ── 3b. bead-and-reel dotted chain riding the inner rule (grafted from
  //    Take 3) — the strongest period signal in the set. A regular run of tiny
  //    gilt dots along the straight portion of each inner-rule edge, inset past
  //    the corner radius so it never crowds the volutes. Modest density; thinned
  //    and sparser on the small branch so the kept-plate stays quiet.
  var ir2 = Math.max(1.5, rad - m2);           // inner-rule corner radius
  var bix = x + m2, biy = y + m2, biw = w - m2 * 2, bih = h - m2 * 2;
  if (biw > 40 && bih > 40) {
    var beadR = Math.max(0.6, (small ? 0.62 : 0.85) * (S / 260) + 0.35);
    var step = Math.max(small ? 11 : 9, (small ? 13 : 10.5) * (S / 260));
    ctx.fillStyle = small ? 'rgba(244,208,120,0.30)' : 'rgba(244,208,120,0.40)';
    // top + bottom runs (start half a corner-radius past the arc)
    var runX0 = bix + ir2 + step * 0.5, runX1 = bix + biw - ir2;
    for (var bx = runX0; bx < runX1; bx += step) {
      ctx.beginPath(); ctx.arc(bx, biy, beadR, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bx, biy + bih, beadR, 0, Math.PI * 2); ctx.fill();
    }
    // left + right runs
    var runY0 = biy + ir2 + step * 0.5, runY1 = biy + bih - ir2;
    for (var by = runY0; by < runY1; by += step) {
      ctx.beginPath(); ctx.arc(bix, by, beadR, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bix + biw, by, beadR, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ── 4. engraved corner flourishes — restrained bezier scrollwork ──
  // Drawn at the inner-rule corners, curling inward. A lit gold ribbon over a
  // shadow ribbon, so it reads as engraved intaglio like the rules.
  var fl = Math.min(S * (small ? 0.11 : 0.10), 44);     // flourish reach
  var ix = x + m2, iy = y + m2, iw = w - m2 * 2, ih = h - m2 * 2;
  var flLw = Math.max(0.9, S * 0.0055);

  function drawFlourish(cx, cy, sx, sy) {
    // local frame: sx/sy point INTO the panel from this corner
    var ex = cx + sx * fl * 0.30, ey = cy + sy * fl * 0.30;   // volute eye
    function ribbon(g) {
      g.beginPath();
      // main sweep along the top edge, curling inward to a tight volute eye
      g.moveTo(cx + sx * fl * 0.98, cy + sy * fl * 0.05);
      g.bezierCurveTo(
        cx + sx * fl * 0.55, cy + sy * fl * 0.01,
        cx + sx * fl * 0.22, cy + sy * fl * 0.07,
        cx + sx * fl * 0.11, cy + sy * fl * 0.30);
      g.bezierCurveTo(
        cx + sx * fl * 0.04, cy + sy * fl * 0.50,
        cx + sx * fl * 0.22, cy + sy * fl * 0.62,
        cx + sx * fl * 0.38, cy + sy * fl * 0.50);
      // the tight inner spiral of the volute (1.25 turns into the eye)
      g.bezierCurveTo(
        cx + sx * fl * 0.48, cy + sy * fl * 0.40,
        cx + sx * fl * 0.44, cy + sy * fl * 0.24,
        cx + sx * fl * 0.30, cy + sy * fl * 0.22);
      g.bezierCurveTo(
        cx + sx * fl * 0.18, cy + sy * fl * 0.205,
        cx + sx * fl * 0.18, cy + sy * fl * 0.36,
        ex, ey);
      // a second, shorter leaf sweeping down the side edge
      g.moveTo(cx + sx * fl * 0.05, cy + sy * fl * 0.98);
      g.bezierCurveTo(
        cx + sx * fl * 0.01, cy + sy * fl * 0.55,
        cx + sx * fl * 0.12, cy + sy * fl * 0.28,
        cx + sx * fl * 0.34, cy + sy * fl * 0.19);
    }
    // shadow recess
    ctx.save();
    ctx.strokeStyle = 'rgba(6,8,16,0.5)';
    ctx.lineWidth = flLw + 0.9;
    ctx.translate(0, 0.6);
    ribbon(ctx); ctx.stroke();
    ctx.restore();
    // lit gold ribbon
    ctx.save();
    ctx.strokeStyle = 'rgba(240,199,102,0.55)';
    ctx.lineWidth = flLw;
    ribbon(ctx); ctx.stroke();
    ctx.restore();
    // a tiny gilt bead at the volute eye
    ctx.beginPath();
    ctx.arc(ex, ey, Math.max(0.8, flLw * 0.95), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,233,168,0.55)';
    ctx.fill();
  }

  drawFlourish(ix, iy, 1, 1);
  drawFlourish(ix + iw, iy, -1, 1);
  drawFlourish(ix, iy + ih, 1, -1);
  drawFlourish(ix + iw, iy + ih, -1, -1);

  // ── 5. top-centre keystone tick — a small engraved anchor for the eye ──
  if (!small) {
    var kx = x + w / 2, ky = y + m2, kw = fl * 0.34;
    ctx.save();
    // shadow recess for the keystone (matches the intaglio rules)
    ctx.strokeStyle = 'rgba(6,8,16,0.5)';
    ctx.lineWidth = flLw + 0.9;
    ctx.translate(0, 0.6);
    ctx.beginPath();
    ctx.moveTo(kx - kw, ky);
    ctx.quadraticCurveTo(kx, ky + fl * 0.24, kx + kw, ky);
    ctx.stroke();
    ctx.restore();
    // lit gold keystone loop, riding the top rule
    ctx.save();
    ctx.strokeStyle = 'rgba(240,199,102,0.48)';
    ctx.lineWidth = flLw;
    ctx.beginPath();
    ctx.moveTo(kx - kw, ky);
    ctx.quadraticCurveTo(kx, ky + fl * 0.24, kx + kw, ky);
    ctx.stroke();
    // little pendant bead + the eye
    ctx.beginPath();
    ctx.arc(kx, ky + fl * 0.14, Math.max(0.9, flLw * 1.05), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,233,168,0.55)';
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
};
</script>

<script type="module">
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   A SKY YOU NAME — the page. "The Inking Table."

   A make-believe celestial toy: a seeded starfield you lace by hand into your
   own figure, then CLOSE to catasterize — the page inks a golden asterism,
   letters its generated NAME, and tells a two-line origin MYTH in the estate's
   own voice. RE-SEED scatters a fresh sky; KEEP files the finished chart to a
   constellarium folio you flip back through. Silent until a first gesture;
   honors the shared ws:pref:muted.

   Claim-free (delight-first). The only self-test is WELL-FORMEDNESS: a kept
   chart re-inks BYTE-IDENTICALLY from its stored seed + normalized points
   (deterministic xmur3+mulberry32), and any laced N-star figure yields a
   well-formed name + two-line myth. See a-sky-you-name/core.test.mjs (the Node
   twin over the SAME starlore.mjs inlined below).

   Craft: xmur3+mulberry32 (the-cartographers-dream/core.mjs) for the seeded
   field + the naming; the verse/theogony myth register lives in starlore.mjs;
   nib/ting/fwump-kin SFX for the ink polish. Zero deps, single file.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── the star-lore generator (forge-inlined; also imported by core.test.mjs) ── */
/* ═══════════════════════════════════════════════════════════════════════════
   starlore.mjs — THE STAR-LORE (the soul of "A Sky You Name")

   A christening + a two-line origin-myth couplet in an antique celestial-atlas
   voice, for a figure a visitor laced by hand out of the stars.

   The thesis: the words are a READING OF THE HAND, not a random myth stapled to
   a shape. The generator first READS the drawn polyline — pure geometry: how
   many stars, whether it closes into a loop, its silhouette, how many times the
   path turns back, how far it reaches, how straight it runs — and then christens
   + narrates FROM those traits. A ring earns a Crown / a Wheel / a thing that
   returns; a long taut stroke earns a Bearer / a Road / a wanderer who does not
   arrive; a tangle earns a Serpent / a Thorn / a knot that cannot rest. Every
   clause of the myth is licensed by a real trait of the figure, so the couplet
   is a CAPTION OF THE GESTURE — it cannot drift from the shape the hand drew.

   Determinism is the whole self-test: same (seed, normalized-points) → the same
   name + myth, byte-for-byte, forever. ONE PRNG stream, keyed off the seed AND a
   serialized reading of the shape (no Date / Math.random in here). A kept chart
   stores the SEED + the normalized points — never the rendered strings — and
   re-derives on re-ink; if a future edit widens the banks, bump GEN_VERSION so
   old kept charts can be re-derived under their own generation.

   Zero deps. Ported (verbatim in spirit) from cycle 407's explorer 1, with the
   classifier calibration the design called for:
     · the tangle turn-threshold lowered (turns>=2, not >=3) so a genuine zigzag
       reads as a tangle, not a bend;
     · a turn-ANGLE gate on the line/bend split (a stroke is only a "line" if it
       is BOTH taut AND barely bends — totalTurn small), so a wide reclining
       figure can never be christened a line/spear;
     · a hard silhouette override: a wide/reclining open figure resolves to a
       reclining FORM (never line), a tall/standing one to standing;
     · banks widened so a long KEEP session rarely repeats within one form.
   ═══════════════════════════════════════════════════════════════════════════ */

const GEN_VERSION = 1;

/* ---------- PRNG — the house xmur3 + mulberry32 (verbatim from cartographers) */
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){ const s = xmur3(String(seedStr)); return mulberry32(s()); }

/* ═══════════════════════════════════════════════════════════════════════════
   1. READ THE SHAPE — pure geometry → a small trait record the words read from.

   Input: an ordered list of laced star points [{x,y}, …], ALREADY normalized to
   the 0..1 field so the reading is resolution-independent (this is what makes a
   kept chart re-ink byte-identical — we store the normalized points, not pixels).
   ═══════════════════════════════════════════════════════════════════════════ */
function readShape(pts){
  const n = pts.length;
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity, pathLen=0;
  for(const p of pts){ if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
  for(let i=1;i<n;i++){ pathLen += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); }
  const w = Math.max(1e-4, maxx-minx), h = Math.max(1e-4, maxy-miny);
  const diag = Math.hypot(w,h);
  const span = Math.hypot(pts[n-1].x-pts[0].x, pts[n-1].y-pts[0].y);  // start→end gap

  // CLOSED? — the last star returns near the first AND the walk enclosed real
  //   area (a single back-and-forth has span≈0 too, so require ≥4 stars + area).
  const gapFrac = span / (diag||1);
  const area = polyArea(pts);
  const closed = n>=4 && gapFrac < 0.28 && area > (w*h)*0.10;

  // WINDING — count sign changes of the turn (busy-ness) AND accumulate the
  //   TOTAL absolute turn angle (a smooth arc barely turns; a zigzag turns a lot).
  let turns=0, prevCross=0, totalTurn=0;
  for(let i=1;i<n-1;i++){
    const ax=pts[i].x-pts[i-1].x, ay=pts[i].y-pts[i-1].y;
    const bx=pts[i+1].x-pts[i].x, by=pts[i+1].y-pts[i].y;
    const cross = ax*by - ay*bx;
    const ang = Math.abs(Math.atan2(cross, ax*bx+ay*by));  // 0..π turn at this vertex
    totalTurn += ang;
    if(i>1 && Math.sign(cross)!==Math.sign(prevCross) && Math.abs(cross)>1e-5) turns++;
    if(Math.abs(cross)>1e-5) prevCross = cross;
  }

  // SILHOUETTE aspect — tall / wide / squarish.
  const ar = w/h;
  let aspect = "squared";
  if(ar > 1.5) aspect = "reclining";       // wide, low — a beast, a reach, a bridge
  else if(ar < 0.66) aspect = "standing";  // tall — a bearer, a spire, an upright figure

  const reach = diag;                                     // 0..1 of the field diagonal
  const straightness = closed ? 0 : Math.min(1, span / (pathLen||1)); // 1 = a taut stroke

  // ── classify a coarse FORM the words key off of (CALIBRATED) ──
  //   turn-ANGLE gate: a "line" must be BOTH taut (straightness high) AND barely
  //   bending (totalTurn small); a wide/reclining or tall/standing silhouette is
  //   resolved to its silhouette form so it can never be mis-christened a spear.
  const TAUT   = 0.80;   // straightness above this is "taut"
  const CALM   = 0.9;    // total turn (radians) below this is "barely bends"
  const BUSY   = 2;      // >= this many sign-changes is a genuine zigzag/tangle
  let form;
  if(closed){
    form = (turns>=2) ? "vessel" : "ring";   // a busy loop is a woven vessel; a clean loop a ring
  } else if(n<=2){
    form = "spark";                          // two stars — a pair, a gate, twins
  } else if(turns>=BUSY){
    form = "tangle";                         // a busy open figure — a serpent, a knot
  } else if(aspect==="reclining"){
    form = "reclining";                      // wide & low — a beast, a bridge; never a line
  } else if(aspect==="standing"){
    form = "standing";                       // tall & upright — a mast, a sentinel; never a line
  } else if(straightness > TAUT && totalTurn < CALM){
    form = "line";                           // taut AND calm — a true stroke / spear / road
  } else {
    form = "bend";                           // a gentle open arc — a hook, a horn, a leap
  }

  return { n, closed, turns, totalTurn:round(totalTurn), aspect, ar:round(ar),
           reach:round(reach), straightness:round(straightness), area:round(area), form };
}
function polyArea(pts){
  let a=0; for(let i=0;i<pts.length;i++){ const j=(i+1)%pts.length; a += pts[i].x*pts[j].y - pts[j].x*pts[i].y; }
  return Math.abs(a)/2;
}
function round(x){ return Math.round(x*1e4)/1e4; }
