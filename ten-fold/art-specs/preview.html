<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ten-Fold Glass — foundry preview bench</title>
<style>
  html,body{ margin:0; background:#07080c; color:#e9dcc0;
    font-family: ui-serif, Georgia, serif; overflow:hidden; }
  #bench{ display:block; }
  #cap{ position:fixed; left:16px; top:12px; font:600 12px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.12em; text-transform:uppercase; color:rgba(240,199,102,.75); }
  #err{ position:fixed; left:16px; bottom:14px; font:12px/1.4 ui-monospace,Menlo,monospace;
    color:#f08a7a; max-width:90vw; }
</style>
</head>
<body>
<canvas id="bench" width="1200" height="760"></canvas>
<div id="cap"></div>
<div id="err"></div>
<script src="../plates.js"></script>
<script src="../rig.js"></script>
<script>
/* THE FOUNDRY PREVIEW BENCH.
   Loads a candidate art module and renders it EXACTLY the way the room does —
   a plate at its own scale, the same plate as a distant mote, and the same
   plate blown up 300x (which is what a multi-decade gap does to it). Judges
   see all three at once, which is the whole point: a plate that only survives
   at its own scale has not solved the problem.
   Query: ?cand=<url>&key=<plate key>   or   ?cand=<url>&mode=rig  */
(function () {
  var Q = new URLSearchParams(location.search);
  var cand = Q.get('cand'), key = Q.get('key'), mode = Q.get('mode') || 'plate';
  var g = document.getElementById('bench').getContext('2d');
  var err = document.getElementById('err'), cap = document.getElementById('cap');
  function fail(m){ err.textContent = m; }

  function paintBg(){
    var bg = g.createRadialGradient(600, 360, 0, 600, 360, 900);
    bg.addColorStop(0, '#0d1018'); bg.addColorStop(1, '#05060a');
    g.fillStyle = bg; g.fillRect(0, 0, 1200, 760);
  }
  function panelFrame(x, y, w, h, label){
    g.save(); g.strokeStyle = 'rgba(240,199,102,.22)'; g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, w, h);
    g.fillStyle = 'rgba(233,220,192,.55)';
    g.font = '600 11px ui-monospace,Menlo,monospace';
    g.fillText(label, x + 6, y + h + 16); g.restore();
  }

  function drawPlate(){
    var PA = (typeof PlateArt !== 'undefined') ? PlateArt : null;
    var art = PA && PA[key];
    if (!art) return fail('no PlateArt.' + key + ' after loading the candidate');
    /* mirrors LADDER's anchors in glass.mjs — the point the CHILD emerges from */
    var A = { nucleus:[0,0], emptyroom:[0.02,-0.03], atom:[-0.04,0.05], lattice:[0.13,-0.09],
      chloro:[-0.06,0.02], cell:[0.14,-0.10], vein:[-0.11,-0.14], pinnule:[-0.18,0.12],
      fern:[0.10,-0.22], hand:[-0.05,0.14], stoop:[0.07,0.19], street:[0.16,0.06],
      city:[-0.12,-0.09], coast:[0.19,0.13], earth:[-0.09,-0.16], moonroad:[0.21,-0.08],
      inner:[-0.15,0.18], sunfamily:[0.08,0.11], comets:[-0.22,0.06], localstars:[0.06,0.05],
      arm:[0.17,-0.15], galaxy:[-0.19,-0.14], localgroup:[0.12,-0.07], web:[0.11,0.20],
      whole:[-0.07,0.09] };
    var L = A[key] || [0.14, -0.10];
    paintBg();
    /* 1 — at its own scale, the frame it was composed for */
    g.save(); g.beginPath(); g.rect(20, 30, 620, 620); g.clip();
    g.translate(330, 340); art(g, 600, 1, 3.2, L); g.restore();
    panelFrame(20, 30, 620, 620, 'AT ITS OWN DECADE  (u = 600 px)');
    /* 2 — as the mote you dive toward, 40x too small */
    g.save(); g.beginPath(); g.rect(670, 30, 240, 240); g.clip();
    g.translate(790, 150); art(g, 15, 0.55, 3.2, L); g.restore();
    panelFrame(670, 30, 240, 240, 'ARRIVING  (u = 15 px, a = 0.55)');
    /* 3 — blown up 300x: what a multi-decade gap actually does to it. If this
       panel is a flat wash, the field texture has failed and the take loses. */
    g.save(); g.beginPath(); g.rect(670, 330, 500, 320); g.clip();
    g.translate(920, 490); art(g, 180000, 0.30, 3.2, L); g.restore();
    panelFrame(670, 330, 500, 320, 'BLOWN UP 300x, a = 0.30  (the gap)');
    cap.textContent = 'plate: ' + key;
  }

  function drawRig(){
    var RA = (typeof RigArt !== 'undefined') ? RigArt : null;
    var art = RA && RA.drum;
    if (!art) return fail('no RigArt.drum after loading the candidate');
    paintBg();
    var ds = [3.0, 3.5, 3.12];
    for (var i = 0; i < 3; i++){
      g.save(); g.translate(120 + i * 360, 60);
      art(g, 200, 620, ds[i], { E_MIN: -15, E_MAX: 26, portrait: false, t: 3.2 });
      g.restore();
      panelFrame(120 + i * 360, 60, 200, 620,
        i === 0 ? 'SEATED ON A DETENT' : (i === 1 ? 'ON A CREST' : 'JUST OFF A DETENT'));
    }
    cap.textContent = 'the rig: the knurled drum + its pawl';
  }

  var s = document.createElement('script');
  s.onload = function () {
    try { (mode === 'rig' ? drawRig : drawPlate)(); }
    catch (e) { fail('threw: ' + e.message); }
  };
  s.onerror = function () { fail('candidate failed to load: ' + cand); };
  s.src = cand;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
