<style>

  .chip.ok{ color:#8fd79a; border-color:rgba(120,200,130,.5); background:rgba(20,42,26,.55); }
  .chip.bad{ color:#f08a7a; border-color:rgba(220,120,100,.6); background:rgba(60,26,22,.55); }

  /* ── the reading, engraved large in the margin ───────────────────────── */
  #reading{ position:fixed; left:24px; top:52px; z-index:12; pointer-events:none;
    text-shadow:0 1px 14px #000; }
  #reading .val{ font-size:clamp(26px,4vw,36px); letter-spacing:.01em; color:var(--gold); line-height:1.05; }

    color:rgba(233,220,192,.52); margin-top:8px; max-width:min(48vw,430px); }
  #reading .nm em{ font-style:italic; text-transform:none; letter-spacing:.02em;

  /* ── the whisper ──────────────────────────────────────────────────────── */
  #whisper{ position:fixed; left:24px; bottom:20px; max-width:min(46vw,430px);

  #whisper b{ color:var(--gold); font-weight:600; }
  #whisper.dim{ opacity:0; }

  /* ── the instrument: rule + wheel, mounted at the right edge ─────────── */
  #rig{ position:fixed; right:0; top:0; height:100vh; width:344px; z-index:14;
    display:flex; align-items:center; justify-content:flex-end; pointer-events:none; }
  #rig canvas{ pointer-events:auto; }

  .nudge{ position:absolute; left:50%; transform:translateX(-50%); pointer-events:auto;
    width:42px; height:26px; border-radius:8px; border:1px solid rgba(240,199,102,.28);

  #up{ top:-6px; } #down{ bottom:-6px; }

  @media (max-width:760px){

          flex-direction:column-reverse; align-items:center; justify-content:flex-start; }

<div id="whisper">Take the <b>coarse focus</b> and turn it. There is no map and no list — the wheel is the only way through, and every ten-fold is a door you must pass.</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════════
   THE TEN-FOLD GLASS — the coarse focus, with the wind in it.

   One number, `d`, a continuous decade. Everything you see is that number
   rendered: the plates on one exponential axis, the brass drum's knurl phase,
   the cursor on the engraved rule, the wind in the frame. Turn the wheel and
   you are not stepping between pictures — you are moving continuously along a
   ladder that was always all there at once.

   The core (the axis, the detent, the warp, the settle, the liveness twin) is
   forge-inlined below from glass.mjs and is byte-identical to it — the Node
   twin glass.test.mjs proves that every run.
   ════════════════════════════════════════════════════════════════════════════ */

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DKEY = 'ws:ten-fold:d';

/* the estate's shared prefs, the core (byte-twin of glass.mjs), and the ink */

<!-- forge:include ../tools/ws/ws.js -->

<!-- forge:include glass.mjs -->

<!-- forge:include plates.js -->

<!-- forge:include rig.js -->

<!-- forge:include sfx.js -->

/* ── canvases ─────────────────────────────────────────────────────────────── */
const cv = document.getElementById('plate'), cx = cv.getContext('2d');
const rl = document.getElementById('rule'),  rx = rl.getContext('2d');
const wl = document.getElementById('wheel'), wx = wl.getContext('2d');
let DPR = Math.min(2, devicePixelRatio || 1), W = 0, H = 0, VIEW = 0, portrait = false;

function fit(c, g){ const r = c.getBoundingClientRect();
  c.width = Math.max(1, Math.round(r.width * DPR)); c.height = Math.max(1, Math.round(r.height * DPR));
  g.setTransform(DPR, 0, 0, DPR, 0, 0); return r; }
function resize(){
  const r = fit(cv, cx); W = r.width; H = r.height;
  portrait = innerWidth <= 760;
  VIEW = portrait ? Math.min(W, H) * 0.80 : Math.min(W * 0.86, H) * 0.80;
  fit(rl, rx); fit(wl, wx);
  wind = null;                                   // the trail buffer is stale
}
addEventListener('resize', resize);

/* ── THE STATE — one number, and its momentum ─────────────────────────────── */
let d = 0, vel = 0, tNow = 0;
let dragging = false, dragU = 0, dragPx = 0, lastPx = 0, lastT = 0;
let lastRidge = 0, glide = null;
try { d = sanitizeD(localStorage.getItem(DKEY)); } catch (e) { d = 0; }
lastRidge = ridgeIndex(d);

let saveTimer = null;
function remember(){ if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null;
    try { localStorage.setItem(DKEY, d.toFixed(3)); } catch (e) {} }, 400); }

/* ── THE DUST — one log-space mote field, shared by every decade ───────────
   Each mote holds a fixed angle and a fixed phase; its radius is
   R0·10^((phase − d) mod 1), so the field is IDENTICAL at every decade and
   streams outward for ever as you dive. It is what tells you that you are
   still moving even inside an honest emptiness. The band you are in only
   TINTS it — nine weathers on one field, never nine systems. ───────────── */
const MOTES = (() => {
  const r = (() => { let s = 20260721 >>> 0;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; })();
  const M = [];
  for (let i = 0; i < 240; i++) M.push({ th: r() * 6.283, ph: r(), sz: 0.5 + r() * 2.1, b: r() });
  return M;
})();

/* ── THE WIND — the partial clear ─────────────────────────────────────────
   Because the whole axis is a PURE SCALE about one pinned point, not clearing
   the frame completely turns the accumulated frames into a true radial
   zoom-streak: the light of the plate you are leaving is smeared outward
   along the very rays it is travelling. One line, and it is the best thing
   in the room. Under reduced motion the clear is opaque and there is no
   trail at all. ───────────────────────────────────────────────────────── */
let wind = null;
/* THE GLASS'S OWN GRAIN — a small screen-space noise tile, laid over the world
   each frame. It is what keeps a plate a PICTURE once the blow-up has outrun
   even the finest octave of its own field texture: at ten-thousandfold there is
   no drawing left to see, and this is the emulsion the drawing was printed on.
   Its weight rises with how magnified the biggest plate on screen is. */
let glassPat = null;
function glassGrain(){
  if (!glassPat){
    const N = 128, oc = document.createElement('canvas'); oc.width = oc.height = N;
    const og = oc.getContext('2d'), img = og.createImageData(N, N);
    let s = 987654321 >>> 0;
    for (let i = 0; i < N * N; i++){
      s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
      const v = (s / 4294967296);
      const k = 150 + Math.round(v * 105);
      img.data[i*4] = k; img.data[i*4+1] = k - 6; img.data[i*4+2] = k - 22;
      img.data[i*4+3] = Math.round(Math.pow(v, 2.6) * 255);
    }
    og.putImageData(img, 0, 0);
    glassPat = cx.createPattern(oc, 'repeat');
  }
  return glassPat;
}
function clearWorld(speed){
  const alpha = REDUCED ? 1 : Math.max(0.11, 1 - Math.min(1, speed) * 0.30);
  if (!wind || wind.w !== W || wind.h !== H){
    const bg = cx.createRadialGradient(W * 0.42, H * 0.46, 0, W * 0.42, H * 0.46, Math.max(W, H) * 0.78);
    bg.addColorStop(0, '#0d1018'); bg.addColorStop(1, '#05060a');
    wind = { w: W, h: H, bg };
  }
  cx.globalAlpha = alpha;
  cx.fillStyle = wind.bg;
  cx.fillRect(0, 0, W, H);
  cx.globalAlpha = 1;
}

/* ── THE RENDER ───────────────────────────────────────────────────────────── */
function render(){
  const speed = Math.min(1, Math.abs(vel) / 3.6);
  clearWorld(speed);

  const C = [portrait ? W * 0.5 : W * 0.44, portrait ? H * 0.40 : H * 0.5];
  const plan = renderPlan(d, VIEW);

  /* the dust, under everything — strongest where the plates are thinnest */
  let cover = 0;
  for (const q of plan) cover = Math.max(cover, q.alpha);
  const voidA = Math.max(0, 1 - cover * 1.15);
  if (voidA > 0.012){
    const band = bandAt(d);
    const R0 = Math.min(W, H) * 0.030;
    const drift = REDUCED ? 0 : tNow * 0.010;
    for (const m of MOTES){
      const u = ((m.ph - d + drift) % 1 + 1) % 1;
      const R = R0 * Math.pow(10, u * 1.9);
      const x = C[0] + Math.cos(m.th) * R, y = C[1] + Math.sin(m.th) * R * 0.94;
      if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
      const fade = Math.min(1, u * 3.2) * (1 - u * 0.55);
      cx.fillStyle = 'rgba(' + band.col + ',' + (voidA * 0.85 * fade * (0.3 + 0.7 * m.b)).toFixed(4) + ')';
      cx.beginPath(); cx.arc(x, y, m.sz * (0.5 + u * 2.4), 0, 6.283); cx.fill();
    }
  }

  /* THE PLATES — every one on the SAME continuous exponential axis, each
     anchored so the zoom point sits still at C. The nesting is a consequence
     of the geometry; nothing here cross-fades anything. */
  for (const q of plan){
    const S = q.size, x = C[0] + q.x, y = C[1] + q.y;
    /* THE MOTE — while a plate is far too small to read it is a point of warm
       light on the dark: you can SEE what you are diving toward long before
       you can see what it IS. */
    if (S < 34){
      const rr = Math.max(9, S * 2.4), m = 1 - S / 34;
      const gl = cx.createRadialGradient(x, y, 0, x, y, rr);
      gl.addColorStop(0, 'rgba(255,232,178,' + (0.30 * q.alpha * m).toFixed(4) + ')');
      gl.addColorStop(0.4, 'rgba(240,199,102,' + (0.13 * q.alpha * m).toFixed(4) + ')');
      gl.addColorStop(1, 'rgba(240,199,102,0)');
      cx.fillStyle = gl; cx.beginPath(); cx.arc(x, y, rr, 0, 6.283); cx.fill();
    }
    if (S > 3.2e5) continue;                       // past all legibility; the grain has it
    cx.save(); cx.translate(x, y);
    if (S < VIEW * 3.4){                           // the plate's own mount, a hairline
      cx.strokeStyle = 'rgba(240,199,102,' + (0.16 * q.alpha * Math.min(1, S / (VIEW * 0.35))).toFixed(4) + ')';
      cx.lineWidth = Math.max(0.5, Math.min(1.4, S * 0.0016));
      cx.strokeRect(-S / 2, -S / 2, S, S);
    }
    const art = PlateArt[q.key];
    if (art) art(cx, S, q.alpha, tNow, LADDER[q.i].anchor);
    cx.restore();
  }

  /* the emulsion — heavier the further any plate has been blown up */
  let blow = 0;
  for (const q of plan) blow = Math.max(blow, Math.min(1, Math.log10(Math.max(1, q.size / VIEW)) / 3.2) * q.alpha);
  if (blow > 0.01){
    cx.save();
    cx.globalAlpha = 0.05 + 0.13 * blow;
    cx.globalCompositeOperation = 'screen';
    cx.fillStyle = glassGrain();
    cx.translate((tNow * 7) % 128 - 128, (tNow * 4.5) % 128 - 128);
    cx.fillRect(0, 0, W + 256, H + 256);
    cx.restore();
  }

  const vg = cx.createRadialGradient(C[0], C[1], VIEW * 0.34, C[0], C[1], Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
}

/* ── THE BRASS ────────────────────────────────────────────────────────────── */
const brassGrad = (g, x0, y0, x1, y1) => RigArt.brassGrad(g, x0, y0, x1, y1);
const SUP = {'-':'⁻','−':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');

/* the machined drum: a knurl whose PHASE IS THE DECADE, so the wheel's surface
   is literally the ladder, and a leaf-spring pawl riding on it. */
function drawWheel(){
  const r = wl.getBoundingClientRect();
  wx.clearRect(0, 0, r.width, r.height);
  RigArt.drum(wx, r.width, r.height, d, { E_MIN, E_MAX, portrait, t: tNow });
}

/* the engraved rule — the WHOLE ladder at once, every detent legended whether
   or not a plate is drawn there. It is a ruler, not a menu: nothing on it is
   clickable, and there is no jumping. */
function drawRule(){
  const r = rl.getBoundingClientRect(), w = r.width, h = r.height;
  rx.clearRect(0, 0, w, h);
  const vert = !portrait, span = E_MAX - E_MIN;
  const L = vert ? h * 0.86 : w * 0.92;
  const o = vert ? h * 0.07 : w * 0.04;
  const pos = e => o + (vert ? (1 - (e - E_MIN) / span) * L : (e - E_MIN) / span * L);
  const axis = vert ? w * 0.80 : h * 0.50;

  rx.save();
  if (vert){ rx.beginPath(); rx.roundRect(axis - 13, o - 16, 26, L + 32, 7); }
  else { rx.beginPath(); rx.roundRect(o - 16, axis - 12, L + 32, 24, 7); }
  rx.fillStyle = brassGrad(rx, vert ? axis - 13 : 0, vert ? 0 : axis - 12,
                               vert ? axis + 13 : 0, vert ? 0 : axis + 12);
  rx.fill(); rx.strokeStyle = 'rgba(255,236,180,.22)'; rx.lineWidth = 1; rx.stroke();
  rx.restore();

  for (let e = E_MIN; e <= E_MAX; e++){
    const p = pos(e), isPlate = LADDER.some(q => q.e === e);
    const len = isPlate ? 11 : (e % 5 === 0 ? 8 : 5);
    rx.strokeStyle = isPlate ? 'rgba(58,42,16,.95)' : 'rgba(58,42,16,.6)';
    rx.lineWidth = isPlate ? 1.6 : 1;
    rx.beginPath();
    if (vert){ rx.moveTo(axis - len, p); rx.lineTo(axis + len, p); }
    else { rx.moveTo(p, axis - len); rx.lineTo(p, axis + len); }
    rx.stroke();
    if (vert && (isPlate || e % 5 === 0)){
      rx.fillStyle = 'rgba(233,220,192,.42)'; rx.font = '11px ' + getComputedStyle(document.body).fontFamily;
      rx.textAlign = 'left'; rx.textBaseline = 'middle';
      rx.fillText('10' + sup(e), axis + 14, p);
    } else if (!vert && e % 5 === 0){
      rx.fillStyle = 'rgba(233,220,192,.42)'; rx.font = '10px ' + getComputedStyle(document.body).fontFamily;
      rx.textAlign = 'center'; rx.textBaseline = 'top';
      rx.fillText('10' + sup(e), p, axis + 13);
    }
  }
  if (vert){
    rx.textAlign = 'right'; rx.textBaseline = 'middle';
    for (let e = E_MIN; e <= E_MAX; e++){
      const plate = LADDER.find(q => q.e === e), p = pos(e);
      rx.font = (plate ? 'italic 10.5px ' : '9.5px ') + getComputedStyle(document.body).fontFamily;
      rx.fillStyle = plate ? 'rgba(233,220,192,.30)' : 'rgba(135,148,166,.20)';
      rx.fillText(plate ? plate.name : LEGEND[String(e)], axis - 16, p);
    }
  }

  /* THE CURSOR — a brass slider carrying the live reading. It slides
     CONTINUOUSLY: sitting between two ticks is not sloppiness, it is because
     YOU are standing between two decades. */
  const rd = readingAt(d), p = pos(d);
  const label = rd.atDetent ? rd.title : (rd.hasPlate ? rd.title + ' …' : rd.legend);
  rx.save();
  rx.font = (rd.atDetent ? '' : 'italic ') + '11px ' + getComputedStyle(document.body).fontFamily;
  const tw = rx.measureText(label).width;
  if (vert){
    rx.translate(axis, p);
    const bw = 176;
    rx.fillStyle = 'rgba(10,12,17,.93)';
    rx.beginPath(); rx.roundRect(-bw + 8, -11, bw, 22, 4); rx.fill();
    rx.strokeStyle = rd.atDetent ? 'rgba(255,236,176,.95)' : 'rgba(255,232,170,.45)';
    rx.lineWidth = 1.3; rx.stroke();
    rx.strokeStyle = 'rgba(255,120,90,.95)'; rx.lineWidth = 1;
    rx.beginPath(); rx.moveTo(-bw + 14, 0); rx.lineTo(4, 0); rx.stroke();
    rx.textAlign = 'left'; rx.textBaseline = 'middle';
    rx.fillStyle = 'rgba(10,12,17,.93)'; rx.fillRect(-bw + 24, -8, tw + 8, 16);
    rx.fillStyle = rd.atDetent ? 'rgba(240,199,102,.95)' : 'rgba(200,192,170,.7)';
    rx.fillText(label, -bw + 28, 0);
    rx.restore();
  } else {
    /* on a phone the cursor is an UPRIGHT pill riding above the rule — a
       rotated word is not an engraving, it is a mistake. */
    rx.restore();
    rx.save();
    rx.font = (rd.atDetent ? '' : 'italic ') + '11px ' + getComputedStyle(document.body).fontFamily;
    rx.translate(Math.max(tw / 2 + 12, Math.min(w - tw / 2 - 12, p)), axis - 24);
    rx.fillStyle = 'rgba(10,12,17,.94)';
    rx.beginPath(); rx.roundRect(-tw / 2 - 9, -11, tw + 18, 22, 5); rx.fill();
    rx.strokeStyle = rd.atDetent ? 'rgba(255,236,176,.95)' : 'rgba(255,232,170,.45)';
    rx.lineWidth = 1.2; rx.stroke();
    rx.textAlign = 'center'; rx.textBaseline = 'middle';
    rx.fillStyle = rd.atDetent ? 'rgba(240,199,102,.95)' : 'rgba(200,192,170,.72)';
    rx.fillText(label, 0, 0);
    rx.restore();
    rx.save();
    rx.strokeStyle = 'rgba(255,120,90,.95)'; rx.lineWidth = 1.2;
    rx.beginPath(); rx.moveTo(p, axis - 13); rx.lineTo(p, axis + 13); rx.stroke();
    rx.restore();
  }
}

/* ── THE READING ──────────────────────────────────────────────────────────── */
const rval = document.getElementById('rval'), rnm = document.getElementById('rnm');
const wh = document.getElementById('whisper');
function updateReading(){
  const rd = readingAt(d);
  rval.innerHTML = '10<sup>' + rd.exp + '</sup>&thinsp;m';
  if (rd.hasPlate && rd.atDetent) rnm.innerHTML = rd.title.toUpperCase();
  else if (rd.hasPlate) rnm.innerHTML = rd.title.toUpperCase() + ' &nbsp;<em>— between plates</em>';
  else rnm.innerHTML = rd.legend.toUpperCase() + ' &nbsp;<em>— no plate is drawn here</em>';
}

/* ── SOUND: the detent, and the wall ──────────────────────────────────────
   Unlocked by the FIRST real gesture (a grab, a key, a press) — never on
   load, because a context created on load is born suspended and stays
   silent. The estate's one shared mute holds. ───────────────────────────── */
let ac = null;
const muteBtn = document.getElementById('mute');
function muted(){ return (typeof WS !== 'undefined') ? WS.muted() : false; }
function paintMute(){ muteBtn.textContent = 'sound: ' + (muted() ? 'off' : 'on'); }
paintMute();
if (typeof WS !== 'undefined' && WS.onMuteChange) WS.onMuteChange(paintMute);
muteBtn.onclick = () => {
  const now = !muted();
  if (typeof WS !== 'undefined') WS.setMuted(now);
  paintMute();
  if (!now) { unlock(); click(0.55); }
};
function unlock(){
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function click(strength){
  if (muted() || !ac || ac.state !== 'running') return;
  try {
    // The brass pawl seating into its detent groove (ten-fold/sfx.js). when:0 —
    // every estate sfx builder derives t0 = ctx.currentTime + when, so the whole
    // family passes when:0 and lets the module base itself on now.
    Gate.sfx['tenfold-detent']({
      ctx: ac, dest: ac.destination, dur: 0.45, when: 0,
      seed: (Math.random() * 1e6) | 0, strength
    });
  } catch (e) {}
}

/* ── SETTING d — the one place the number changes ─────────────────────────── */
function setD(nd){
  const before = lastRidge, after = ridgeIndex(nd);
  const wasEnd = (d >= E_MAX - 1e-9 || d <= E_MIN + 1e-9);
  d = nd; lastRidge = after;
  if (after !== before && Math.abs(after % 2) === 1) click(Math.min(1, 0.42 + Math.abs(vel) * 0.16));
  if (!wasEnd && (d >= E_MAX - 1e-9 || d <= E_MIN + 1e-9) && Math.abs(vel) > 0.5) click(0.85);
  remember();
}

/* THE DETENT PRESS — the real entry point every impulse comes through, and the
   one the liveness twin drives. Under reduced motion it is the WHOLE control:
   one plate per press, no momentum, no coast. */
function press(dir, step){
  wh.classList.add('dim');
  unlock();
  /* a press mid-glide steps on from where the glide is HEADED, not from where
     the drum happens to be — so holding the key really walks the ladder
     instead of stalling against its own animation. */
  const target = stepDetent(glide ? glide.to : d, dir, step);
  if (REDUCED){ vel = 0; glide = null; setD(target); return target; }
  glide = { from: d, to: target, t0: performance.now(), dur: 120 + Math.abs(target - d) * 130 };
  vel = 0;
  return target;
}
document.getElementById('up').onclick   = () => press(+1);
document.getElementById('down').onclick = () => press(-1);

/* ── THE HAND ON THE WHEEL ────────────────────────────────────────────────── */
const PX_PER_DECADE = 150;
const pointerPos = ev => portrait ? ev.clientX : -ev.clientY;   // + = climb outward

wl.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  unlock();
  wl.setPointerCapture(ev.pointerId);
  dragging = true; glide = null; vel = 0;
  dragPx = pointerPos(ev); lastPx = dragPx; lastT = performance.now();
  dragU = invWarp(d);                     // invert the warp so a re-grab never snaps
  wh.classList.add('dim');
});
addEventListener('pointermove', ev => {
  if (!dragging) return;
  const px = pointerPos(ev);
  const u = dragU + (px - dragPx) / PX_PER_DECADE;
  const nd = clampTravel(warp(u));
  const now = performance.now(), dt = Math.max(1, now - lastT) / 1000;
  if (!REDUCED) vel = ((px - lastPx) / PX_PER_DECADE) / dt * 0.55 + vel * 0.45;
  lastPx = px; lastT = now;
  setD(nd);
});
function release(){
  if (!dragging) return;
  dragging = false;
  if (REDUCED){ vel = 0; setD(clampDetent(Math.round(d))); }    // a second design, not a disabled room
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

function spin(deltaY, k){
  wh.classList.add('dim'); unlock();
  if (REDUCED){ press(deltaY > 0 ? -1 : +1); return; }
  glide = null;
  vel += -(deltaY * k) / PX_PER_DECADE * 3.0;
  vel = Math.max(-9, Math.min(9, vel));
}
wl.addEventListener('wheel', ev => { ev.preventDefault(); spin(ev.deltaY, ev.deltaMode === 1 ? 18 : 1); }, { passive: false });
addEventListener('wheel', ev => { if (ev.target === wl) return; ev.preventDefault();
  spin(ev.deltaY, (ev.deltaMode === 1 ? 18 : 1) * 0.8); }, { passive: false });

addEventListener('keydown', ev => {
  const step = ev.shiftKey ? 5 : 1;
  if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight' || ev.key === 'PageUp'){ ev.preventDefault(); press(+1, step); }
  else if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft' || ev.key === 'PageDown'){ ev.preventDefault(); press(-1, step); }
  else if (ev.key === 'Home'){ ev.preventDefault(); press(+1, 99); }
  else if (ev.key === 'End'){ ev.preventDefault(); press(-1, 99); }
});

/* ── THE LOOP ─────────────────────────────────────────────────────────────── */
let prev = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; tNow = now / 1000;
  if (glide){
    const t = Math.min(1, (now - glide.t0) / glide.dur);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    setD(clampTravel(glide.from + (glide.to - glide.from) * e));
    if (t >= 1){ glide = null; vel = 0; }
  } else if (!dragging && !REDUCED){
    const s = stepFree(d, vel, dt, null);
    vel = s.vel; setD(s.d);
  }
  updateReading(); render(); drawWheel(); drawRule();
  requestAnimationFrame(frame);
}

/* ── THE LIVENESS CHIP — the same runSelfTest() the Node twin runs ─────────
   NO theorem here, and no accuracy claim: it asserts only that the experience
   FIRES. It drives the REAL detent function, never a synthetic canvas
   pointer event (which a headless browser cannot deliver at all). ───────── */
const chip = document.getElementById('selftest');
function runChip(){
  const st = runSelfTest();
  /* one extra check the page can make and the core cannot: the detent really
     MOVES this room — drive press() for real and watch d change. */
  const d0 = d, want = press(-1);
  const moved = (REDUCED ? d === want : (glide && glide.to === want));
  if (REDUCED) setD(d0); else { glide = null; setD(d0); }
  const lines = st.lines.concat([{ name: '(g) the live control moves the live room', ok: moved,
    detail: 'press(−1) from 10^' + d0.toFixed(2) + ' → 10^' + want }]);
  const passed = lines.filter(l => l.ok).length, ok = passed === lines.length;
  chip.className = 'chip ' + (ok ? 'ok' : 'bad');
  chip.textContent = (ok ? '✓ liveness ' : '✗ liveness ') + passed + '/' + lines.length;
  chip.title = lines.map(l => (l.ok ? '✓ ' : '✗ ') + l.name + (l.detail ? ' — ' + l.detail : '')).join('\n');
  window.__tenfold = { ok, passed, total: lines.length, lines };
  return window.__tenfold;
}
chip.onclick = runChip;
window.runSelfTest = runSelfTest;      // the twin's entry, for a headless driver
window.tenFoldPress = press;           // the REAL control, drivable headlessly
window.tenFoldState = () => ({ d, vel, plates: renderPlan(d, VIEW).length });

resize();
requestAnimationFrame(frame);
if (new URLSearchParams(location.search).has('selftest')) setTimeout(runChip, 60);
setTimeout(() => { if (!dragging) wh.classList.remove('dim'); }, 300);
</script>
</body>
