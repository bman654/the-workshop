<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope</title>
<style>
  :root{
    --panel-bg: rgba(9,11,16,0.86);
    --panel-edge: rgba(150,190,220,0.26);
    --ink: #e7edf4;
    --ink-dim: #8f9bb0;
    --accent: #7fc7e8;
    --accent-soft: rgba(127,199,232,0.16);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --font-serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --bg: #08090d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ---- Top bar ---- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 0; pointer-events:none;
  }
  .topbar a, .topbar .brand, .topbar .selftest{ pointer-events:auto; }
  .back{ font:600 11px/1 var(--font-mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim); text-decoration:none; opacity:.82; transition:.25s; }
  .back:hover{ color:var(--accent); opacity:1; }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{ font-family:var(--font-serif); font-size:21px; font-weight:600; letter-spacing:.4px; margin:0; color:var(--ink); }
  .brand .tag{ font:11px/1 var(--font-mono); color:var(--ink-dim); letter-spacing:.4px; }
  .selftest{ font:600 10.5px/1 var(--font-mono); letter-spacing:.3px; padding:6px 10px; border-radius:20px;
    border:1px solid var(--panel-edge); background:rgba(0,0,0,0.35); white-space:nowrap; cursor:default; user-select:none; }
  .selftest.ok{ color:#8fd79a; border-color:rgba(120,200,130,0.5); background:rgba(30,58,38,0.4); }
  .selftest.bad{ color:#f08a7a; border-color:rgba(220,120,100,0.6); background:rgba(70,30,26,0.4); }
  .selftest .detail{ display:none; }

  /* ---- Layout ---- */
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1100px 760px at 56% 44%, #14151b 0%, #0c0d12 66%, #07080b 100%);
    padding:18px;
  }
  #scopeWrap{ position:relative; border-radius:50%;
    box-shadow: 0 30px 90px rgba(0,0,0,0.62), 0 0 0 1px rgba(150,190,220,0.10) inset; }
  canvas#scope{ display:block; border-radius:50%; }
  /* the brass rim of the eyepiece */
  #scopeWrap::after{ content:""; position:absolute; inset:-10px; border-radius:50%; pointer-events:none;
    box-shadow: 0 0 0 2px rgba(170,150,110,0.22), 0 0 0 9px rgba(0,0,0,0.35),
                0 0 28px rgba(0,0,0,0.5) inset; }

  /* ---- Control panel ---- */
  #panel{
    position:fixed; top:64px; left:18px; width:286px;
    background:var(--panel-bg);
    backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%);
    border:1px solid var(--panel-edge); border-radius:14px; padding:14px 15px 15px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55); z-index:20;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s;
    max-height: calc(100vh - 84px); overflow-y:auto;
  }
  #panel.collapsed{ transform: translateX(calc(-100% - 30px)); opacity:0; pointer-events:none; }
  #reopen{ position:fixed; top:64px; left:18px; z-index:19; display:none;
    font:600 11px/1 var(--font-mono); letter-spacing:.12em; color:var(--accent);
    background:var(--panel-bg); border:1px solid var(--panel-edge); border-radius:10px;
    padding:9px 12px; cursor:pointer; }
  #panel.collapsed ~ #reopen{ display:block; }
  .phead{ display:flex; justify-content:space-between; align-items:center; margin:0 0 10px; }
  .phead .sub{ font-size:10px; color:var(--ink-dim); letter-spacing:1.1px; text-transform:uppercase; margin:0; }
  .collapse{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:15px; line-height:1; padding:2px 4px; }
  .collapse:hover{ color:var(--accent); }

  .row{ margin:11px 0; }
  .row > label{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.3px; }
  .row label .val{ color:var(--accent); font-variant-numeric:tabular-nums; font-size:11px; font-family:var(--font-mono); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:3px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--fill,50%), rgba(255,255,255,0.12) var(--fill,50%));
    outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#eaf6ff; border:2px solid #3f7fa0; box-shadow:0 1px 4px rgba(0,0,0,.5); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%;
    background:#eaf6ff; border:2px solid #3f7fa0; cursor:pointer; }

  .seedrow{ display:flex; gap:6px; align-items:center; }
  .seedrow input[type=text]{ flex:1; min-width:0; background:rgba(0,0,0,0.32); border:1px solid var(--panel-edge);
    color:var(--ink); border-radius:8px; padding:7px 9px; font-size:13px; font-family:var(--font-mono); letter-spacing:.5px; }
  .seedrow input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .iconbtn{ flex:0 0 auto; width:34px; height:34px; border-radius:9px; border:1px solid var(--panel-edge);
    background:rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:.15s; }
  .iconbtn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .seg{ display:flex; gap:4px; background:rgba(0,0,0,0.30); padding:3px; border-radius:9px; border:1px solid rgba(150,190,220,0.18); }
  .seg button{ flex:1 1 0; min-width:0; border:none; background:transparent; color:var(--ink-dim);
    font-size:11px; padding:7px 4px; border-radius:6px; cursor:pointer; transition:.15s; letter-spacing:.2px; }
  .seg button.active{ background:var(--accent); color:#06222d; font-weight:700; }
  .seg button:not(.active):hover{ color:var(--ink); background:rgba(255,255,255,0.05); }

  .actions{ display:flex; gap:8px; margin-top:14px; }
  .actions button{ flex:1; padding:10px 8px; border-radius:10px; border:1px solid var(--panel-edge);
    background:rgba(255,255,255,0.05); color:var(--ink); font-size:12.5px; font-weight:600; cursor:pointer;
    transition:.15s; letter-spacing:.3px; }
  .actions button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .actions button.primary{ background:linear-gradient(180deg, rgba(127,199,232,0.30), rgba(127,199,232,0.10)); border-color:rgba(127,199,232,0.5); }
  .actions button.primary:hover{ background:linear-gradient(180deg, rgba(127,199,232,0.44), rgba(127,199,232,0.16)); }

  hr.sep{ border:none; border-top:1px solid rgba(150,190,220,0.16); margin:13px 0 11px; }
  .caption{ font-size:11px; color:var(--ink-dim); margin-top:12px; line-height:1.6; letter-spacing:.2px; }
  .caption b{ color:var(--accent); font-weight:600; }

  #hud{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    font:11px/1.4 var(--font-mono); color:var(--ink-dim); background:rgba(0,0,0,0.55);
    border:1px solid var(--panel-edge); border-radius:9px; padding:8px 13px; letter-spacing:.3px;
    pointer-events:none; opacity:0; transition:opacity .2s; max-width:90%; text-align:center; z-index:25; }
  #hud.show{ opacity:1; } #hud b{ color:var(--accent); }

  @media (max-width: 720px){
    #panel{ top:auto; bottom:0; left:0; right:0; width:auto; max-height:48vh; border-radius:14px 14px 0 0; }
    #panel.collapsed{ transform: translateY(110%); }
    #reopen{ top:auto; bottom:16px; left:50%; transform:translateX(-50%); }
    .brand .tag{ display:none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../index.html">&larr; workshop</a>
    <div class="brand">
      <h1>Kaleidoscope</h1>
      <span class="tag">a tumbling Dₙ mirror</span>
    </div>
    <div class="selftest" id="selftest" title="Click for per-check detail">checking symmetry&hellip;</div>
  </div>

  <div id="stage">
    <div id="scopeWrap"><canvas id="scope"></canvas></div>
  </div>

  <div id="panel">
    <div class="phead">
      <p class="sub">Mirror toy — provable Dₙ symmetry</p>
      <button class="collapse" id="collapseBtn" title="Hide panel">&#10005;</button>
    </div>

    <div class="row">
      <label>Symmetry order <span class="val" id="orderVal">6-fold</span></label>
      <input type="range" id="order" min="3" max="12" step="1" value="6">
    </div>

    <div class="row">
      <label>Seed</label>
      <div class="seedrow">
        <input type="text" id="seed" spellcheck="false" autocomplete="off">
        <button class="iconbtn" id="reseed" title="New contents">&#9860;</button>
      </div>
    </div>

    <div class="row">
      <label>Tumble speed <span class="val" id="speedVal">1.0&times;</span></label>
      <input type="range" id="speed" min="0" max="250" step="1" value="100">
    </div>

    <div class="row">
      <label>Skin</label>
      <div class="seg" id="skin">
        <button data-skin="glass" class="active">glass</button>
        <button data-skin="stained">stained</button>
        <button data-skin="ink">ink</button>
      </div>
    </div>

    <div class="actions">
      <button id="playBtn">&#9208; Pause</button>
      <button id="exportBtn" class="primary">Export 2&times; PNG</button>
    </div>

    <hr class="sep">
    <div class="caption" id="caption"></div>
  </div>
  <button id="reopen" title="Show controls">controls</button>

  <div id="hud"></div>

<script>
<!-- forge:include ../tools/kaleido/kaleido.js -->

/* ===========================================================================
   THE PAGE — drives the CORE (tools/kaleido/kaleido.js). The CORE is the proof;
   this is only chrome + canvas raster. Every pixel inside the disk is painted
   by Kaleido.sampleRGBAAt(scene, n, x, y) = content(foldDn(P)), so the image is
   Dₙ-symmetric by construction. We raster a moderate-resolution field then
   upscale it (the fold is exact per sampled pixel — upscaling can't break
   symmetry, since the sample grid is itself Dₙ-aligned by the fold).
   =========================================================================== */
'use strict';

var canvas = document.getElementById('scope');
var ctx = canvas.getContext('2d', { willReadFrequently:true });
var DPR = Math.min(window.devicePixelRatio || 1, 2);

var state = {
  n: 6,
  seed: '',
  speed: 1.0,
  skin: 'glass',
  playing: true,
  scene: null,          // base scene (Kaleido.buildScene)
  t: 0,                 // tumble phase (seconds, scaled by speed)
  size: 640,            // CSS px diameter of the disk
  rasterN: 360          // offscreen field resolution (square)
};

/* offscreen field buffer (reused) */
var fieldCanvas = document.createElement('canvas');
var fieldCtx = fieldCanvas.getContext('2d', { willReadFrequently:true });
var fieldImage = null;

var reduceMotion = (typeof window.matchMedia === 'function')
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduceMotion) state.playing = false;

/* ---- seed helpers ---- */
function randomSeed(){
  var alphabet = 'abcdefghijkmnpqrstuvwxyz23456789';
  var s = '';
  for (var i=0;i<6;i++) s += alphabet[Math.floor(Math.random()*alphabet.length)];
  return s;
}
function rebuildScene(){
  state.scene = Kaleido.buildScene(state.seed, state.n);
}

/* ---- sizing ---- */
function computeSize(){
  var avail = Math.min(window.innerWidth, window.innerHeight) - 60;
  // leave room for the panel on wide screens
  if (window.innerWidth > 720) avail = Math.min(avail, window.innerWidth - 360);
  var d = Math.max(280, Math.min(avail, 900));
  state.size = d;
  canvas.style.width = d + 'px';
  canvas.style.height = d + 'px';
  canvas.width = Math.round(d * DPR);
  canvas.height = Math.round(d * DPR);
  // raster resolution scales gently with size (perf cap)
  state.rasterN = Math.round(Math.min(440, Math.max(260, d * 0.62)));
  fieldCanvas.width = state.rasterN;
  fieldCanvas.height = state.rasterN;
  fieldImage = fieldCtx.createImageData(state.rasterN, state.rasterN);
}

/* ---- raster the field into the offscreen buffer ---- */
function rasterField(scene, n, skin){
  var N = state.rasterN;
  var data = fieldImage.data;
  var inv = 2 / (N - 1);                 // map [0,N-1] → [-1,1]
  var k = 0;
  var bg = skin.bg;
  for (var j=0;j<N;j++){
    var y = j * inv - 1;
    for (var i=0;i<N;i++){
      var x = i * inv - 1;
      // clip to the unit disk for the circular eyepiece
      if (x*x + y*y > 1.0){
        data[k]=bg[0]*0.55; data[k+1]=bg[1]*0.55; data[k+2]=bg[2]*0.55; data[k+3]=255;
        k+=4; continue;
      }
      var acc = Kaleido.sampleRGBAAt(scene, n, x, y);
      var px = Kaleido.mixSlots(acc, skin);
      var a = px[3];
      // composite translucent glass over the dark chamber
      data[k]   = Math.round(px[0]*a + bg[0]*(1-a));
      data[k+1] = Math.round(px[1]*a + bg[1]*(1-a));
      data[k+2] = Math.round(px[2]*a + bg[2]*(1-a));
      data[k+3] = 255;
      k+=4;
    }
  }
  fieldCtx.putImageData(fieldImage, 0, 0);
}

/* ---- draw one frame ---- */
function draw(){
  var scene = Kaleido.sceneAt(state.scene, state.t);
  rasterField(scene, state.n, Kaleido.SKINS[state.skin]);
  var W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.clearRect(0,0,W,H);
  // smooth upscale of the exact-symmetry field
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(fieldCanvas, 0, 0, W, H);
  // a soft CENTERED vignette for depth (cosmetic, post-symmetry — centered so it
  // never visually breaks the Dₙ mirror; the field underneath is exact)
  var grd = ctx.createRadialGradient(W*0.5, H*0.5, W*0.05, W*0.5, H*0.5, W*0.52);
  grd.addColorStop(0, 'rgba(255,255,255,0.06)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0.0)');
  grd.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(W/2,H/2,W/2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---- animation loop (reduced-motion safe) ---- */
var last = 0, rafId = null;
function frame(now){
  rafId = requestAnimationFrame(frame);
  if (state.playing){
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last)/1000);
    last = now;
    state.t += dt * state.speed;
    draw();
  } else {
    last = 0;
  }
}
function startLoop(){ if (rafId == null){ last = 0; rafId = requestAnimationFrame(frame); } }

/* ---- self-test chip (calls the SAME core as the Node test) ---- */
function runChip(){
  var res = Kaleido.runSelfTest();
  var el = document.getElementById('selftest');
  var mark = res.pass ? '✓' : '✗';
  el.className = 'selftest ' + (res.pass ? 'ok' : 'bad');
  el.innerHTML = mark + ' kaleidoscope verified — ' + res.n + '/' + res.total +
    '<div class="detail"></div>';
  // console summary mirrors the Node test
  console.log('%cKaleidoscope self-test', 'font-weight:bold');
  res.results.forEach(function(r,i){
    var line = '  check #' + (i+1) + ' [' + (r.pass?'PASS':'FAIL') + '] ' + r.name + ' — ' + r.note;
    if (r.pass) console.log(line); else console.error(line);
  });
  console.log('Kaleidoscope self-test: ' + res.n + '/' + res.total + ' ' + (res.pass?'PASS':'FAIL'));
  return res;
}

/* ---- caption ---- */
function paintCaption(){
  var n = state.n;
  document.getElementById('caption').innerHTML =
    'Dihedral group <b>D' + n + '</b> &mdash; <b>' + n + '</b> rotations &times; <b>' + n + '</b> mirror axes (order ' + (2*n) + ').<br>' +
    'Every pixel is painted by <b>content(fold(P))</b>: the fold collapses each ' +
    'D' + n + ' orbit to one wedge, so the seams are an exact mirror, not a rotate.';
}

/* ---- UI wiring ---- */
function flashHud(html, ms){
  var hud = document.getElementById('hud');
  hud.innerHTML = html; hud.classList.add('show');
  clearTimeout(flashHud._t);
  flashHud._t = setTimeout(function(){ hud.classList.remove('show'); }, ms||2600);
}
function setRangeFill(input){
  var min = +input.min, max = +input.max, v = +input.value;
  input.style.setProperty('--fill', ((v-min)/(max-min)*100) + '%');
}

function bindUI(){
  var order = document.getElementById('order');
  var orderVal = document.getElementById('orderVal');
  order.addEventListener('input', function(){
    state.n = Kaleido.clampOrder(+order.value);
    orderVal.textContent = state.n + '-fold';
    setRangeFill(order);
    rebuildScene();        // contents live in the wedge, which depends on n
    paintCaption();
    if (!state.playing) draw();
  });

  var seed = document.getElementById('seed');
  seed.addEventListener('change', function(){
    state.seed = seed.value.trim() || randomSeed();
    seed.value = state.seed;
    rebuildScene();
    if (!state.playing) draw();
  });
  document.getElementById('reseed').addEventListener('click', function(){
    state.seed = randomSeed();
    seed.value = state.seed;
    rebuildScene();
    flashHud('New chamber: seed <b>' + state.seed + '</b>');
    if (!state.playing) draw();
  });

  var speed = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  speed.addEventListener('input', function(){
    state.speed = (+speed.value)/100;
    speedVal.textContent = state.speed.toFixed(1) + '×';
    setRangeFill(speed);
  });

  document.getElementById('skin').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.skin = b.dataset.skin;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('active', x===b); });
    if (!state.playing) draw();
  });

  var playBtn = document.getElementById('playBtn');
  function syncPlay(){ playBtn.innerHTML = state.playing ? '&#9208; Pause' : '&#9654; Play'; }
  playBtn.addEventListener('click', function(){ state.playing = !state.playing; syncPlay(); if(state.playing) last=0; });
  syncPlay();

  document.getElementById('exportBtn').addEventListener('click', exportPNG);
  document.getElementById('collapseBtn').addEventListener('click', function(){ document.getElementById('panel').classList.add('collapsed'); });
  document.getElementById('reopen').addEventListener('click', function(){ document.getElementById('panel').classList.remove('collapsed'); });
  document.getElementById('selftest').addEventListener('click', function(){
    flashHud('Symmetry proven by the SAME core the Node test runs — see the console.', 3600);
  });

  var rt=null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ computeSize(); draw(); }, 120); });

  setRangeFill(order); setRangeFill(speed);
}

/* ---- 2× PNG export (offscreen, full symmetric raster) ---- */
function exportPNG(){
  var SZ = Math.round(state.size * 2 * DPR);
  var off = document.createElement('canvas');
  off.width = SZ; off.height = SZ;
  var og = off.getContext('2d');
  // raster a high-res field directly for crisp export
  var N = Math.min(1100, Math.round(SZ * 0.7));
  var tmp = document.createElement('canvas'); tmp.width = N; tmp.height = N;
  var tg = tmp.getContext('2d');
  var img = tg.createImageData(N, N);
  var data = img.data;
  var scene = Kaleido.sceneAt(state.scene, state.t);
  var skin = Kaleido.SKINS[state.skin], bg = skin.bg;
  var inv = 2/(N-1), k=0;
  for (var j=0;j<N;j++){ var y=j*inv-1;
    for (var i=0;i<N;i++){ var x=i*inv-1;
      if (x*x+y*y>1.0){ data[k]=bg[0]*0.55; data[k+1]=bg[1]*0.55; data[k+2]=bg[2]*0.55; data[k+3]=255; k+=4; continue; }
      var acc = Kaleido.sampleRGBAAt(scene, state.n, x, y);
      var px = Kaleido.mixSlots(acc, skin); var a=px[3];
      data[k]=Math.round(px[0]*a+bg[0]*(1-a)); data[k+1]=Math.round(px[1]*a+bg[1]*(1-a));
      data[k+2]=Math.round(px[2]*a+bg[2]*(1-a)); data[k+3]=255; k+=4;
    }
  }
  tg.putImageData(img,0,0);
  og.imageSmoothingEnabled=true; og.imageSmoothingQuality='high';
  og.drawImage(tmp,0,0,SZ,SZ);
  // circular crop
  og.globalCompositeOperation='destination-in';
  og.beginPath(); og.arc(SZ/2,SZ/2,SZ/2,0,Math.PI*2); og.fill();
  og.globalCompositeOperation='source-over';
  off.toBlob(function(blob){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'kaleidoscope_D' + state.n + '_' + state.seed + '_' + state.skin + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 3000);
      flashHud('Exported <b>D' + state.n + '</b> · seed <b>' + state.seed + '</b> · <b>' + state.skin + '</b>');
    }catch(e){ console.error(e); }
  }, 'image/png');
}

/* ===========================================================================
   GO
   =========================================================================== */
state.seed = randomSeed();
document.getElementById('seed').value = state.seed;
rebuildScene();
computeSize();
bindUI();
paintCaption();
runChip();                 // the crux — paints the chip, logs PASS/FAIL
draw();
startLoop();
if (reduceMotion){
  flashHud('Reduced motion: the tumble is paused — press <b>▶ Play</b> to watch it turn.', 5200);
}
