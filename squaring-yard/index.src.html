<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Squaring Yard — fold the odd numbers into a square</title>
<style>
  :root{
    --bg:#08070b;
    --panel:rgba(13,11,18,0.86);
    --panel-edge:rgba(201,162,74,0.26);
    --ink:#ede2f0;
    --ink-dim:#a79ab2;
    --gold:#c9a24a;              /* the Numbers Room's gold (number-theory tone) */
    --gold-soft:rgba(201,162,74,0.14);
    --gold-edge:rgba(201,162,74,0.42);
    --teal:#6fd3c4;             /* the "exact, proven" voice */
    --green:#8fd79a;
    --green-glow:rgba(120,225,150,0.5);
    --open:#e0664f;             /* the honest non-square / dropped voice */
    --slot:rgba(167,154,178,0.16);
    --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono:"SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:
      radial-gradient(1200px 760px at 50% -12%, rgba(201,162,74,0.08), transparent 58%),
      radial-gradient(900px 640px at 14% 112%, rgba(111,211,196,0.05), transparent 62%),
      var(--bg);
    color:var(--ink); font-family:var(--font-ui); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  /* faint squared-paper texture (numbers on a grid) */
  body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 32px);
    mix-blend-mode:overlay; }

  /* ── header ── */
  header{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center;
    gap:14px; padding:11px 18px; background:linear-gradient(180deg, rgba(8,7,11,0.94), rgba(8,7,11,0));
    pointer-events:none; }
  header .back{ font:600 11px/1 var(--font-mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim); text-decoration:none; opacity:.82; transition:.25s; pointer-events:auto; white-space:nowrap; }
  header .back:hover{ color:var(--gold); opacity:1; }
  .brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brand h1{ font-family:var(--font-serif); font-size:20px; font-weight:600; letter-spacing:.4px; margin:0; white-space:nowrap; }
  .brand .tag{ font:11px/1 var(--font-mono); color:var(--ink-dim); letter-spacing:.4px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .brand .sib{ font:10px/1 var(--font-mono); color:var(--ink-dim); opacity:.62; letter-spacing:.3px; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:auto; }
  .brand .sib a{ color:var(--gold); text-decoration:none; opacity:.85; }
  .brand .sib a:hover{ opacity:1; text-decoration:underline; }
  .spacer{ flex:1; }
  .selftest{ pointer-events:auto; font:600 10.5px/1 var(--font-mono); letter-spacing:.3px; padding:6px 11px;
    border-radius:20px; border:1px solid var(--panel-edge); background:rgba(0,0,0,0.4); white-space:nowrap;
    cursor:pointer; user-select:none; color:var(--ink-dim); flex:none; }
  .selftest.ok{ color:var(--green); border-color:rgba(120,200,130,0.5); background:rgba(28,52,36,0.45); }
  .selftest.bad{ color:#f08a7a; border-color:rgba(220,120,100,0.6); background:rgba(64,28,24,0.45); }

  /* ── board ── */
  #stage{ position:fixed; inset:0; }
  canvas#board{ display:block; width:100%; height:100%; touch-action:none; cursor:default; }
  canvas#board.grabbing{ cursor:grabbing; }

  /* the big readout — top-center, BELOW the header band */
  #readout{ position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:24; text-align:center;
    pointer-events:none; max-width:94vw; }
  #countbig{ font-family:var(--font-mono); font-weight:700; font-size:60px; line-height:1; letter-spacing:1px;
    font-variant-numeric:tabular-nums; color:var(--gold);
    text-shadow:0 0 24px rgba(201,162,74,0.32), 0 2px 0 rgba(0,0,0,0.6); transition:color .2s; }
  #countbig.square{ color:var(--green); text-shadow:0 0 28px var(--green-glow); }
  #countbig.broken{ color:var(--open); text-shadow:0 0 24px rgba(224,102,79,0.4); }
  #eqline{ font-family:var(--font-serif); font-size:24px; margin-top:8px; letter-spacing:.5px;
    font-variant-numeric:tabular-nums; opacity:0; transition:opacity .35s; min-height:30px; }
  #eqline.show{ opacity:1; }
  #eqline .sq{ color:var(--green); } #eqline .no{ color:var(--open); } #eqline .dim{ color:var(--ink-dim); opacity:.7; }
  #countlab{ font:11px/1 var(--font-mono); color:var(--ink-dim); letter-spacing:.5px; text-transform:uppercase; margin-top:6px; }

  /* mode tabs — top under the readout, centered */
  #tabs{ position:fixed; left:50%; bottom:auto; top:166px; transform:translateX(-50%); z-index:23; display:flex; gap:8px;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:6px; backdrop-filter:blur(7px); }
  .tab{ font:600 11px/1 var(--font-mono); letter-spacing:.2px; padding:9px 13px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--ink-dim); cursor:pointer; transition:.16s; user-select:none; white-space:nowrap; }
  .tab:hover{ color:var(--gold); }
  .tab.on{ color:#1a1206; background:var(--gold); border-color:var(--gold); }

  /* controls — bottom-center */
  #panel{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:22; background:var(--panel);
    border:1px solid var(--panel-edge); border-radius:14px; padding:13px 16px 14px; width:min(560px, calc(100vw - 28px));
    backdrop-filter:blur(7px); }
  #panel .row{ display:flex; align-items:center; gap:10px; margin:4px 0; }
  #panel label{ font:11px/1 var(--font-mono); color:var(--ink-dim); letter-spacing:.3px; width:62px; flex:none; }
  #panel input[type=range]{ flex:1; min-width:0; accent-color:var(--gold); height:3px; }
  #panel .val{ font:12px/1 var(--font-mono); color:var(--gold); width:58px; text-align:right; flex:none; font-variant-numeric:tabular-nums; }
  .btnrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button.act{ flex:1 1 auto; min-width:88px; font:600 11px/1 var(--font-mono); letter-spacing:.3px; padding:10px 9px; border-radius:9px;
    border:1px solid var(--panel-edge); background:rgba(0,0,0,0.35); color:var(--ink); cursor:pointer; transition:.16s; user-select:none; }
  button.act:hover{ border-color:var(--gold); color:var(--gold); }
  button.act:active{ transform:translateY(1px); }
  button.act.on{ color:#1a1206; background:var(--gold); border-color:var(--gold); }
  button.act.warn:hover{ border-color:var(--open); color:var(--open); }
  .hintline{ font:10.5px/1.5 var(--font-mono); color:var(--ink-dim); margin-top:9px; opacity:.84; text-align:center; }
  .hintline b{ color:var(--gold); } .hintline .t{ color:var(--teal); }

  /* on-ramp hint over the board */
  .hint{ position:fixed; left:50%; bottom:118px; transform:translateX(-50%); z-index:25;
    font:12px/1.4 var(--font-mono); color:var(--ink-dim); letter-spacing:.2px; pointer-events:none;
    background:rgba(8,7,11,0.72); padding:8px 15px; border-radius:18px; border:1px solid rgba(201,162,74,0.16);
    transition:opacity .6s; max-width:90vw; text-align:center; }
  .hint b{ color:var(--gold); }

  @media (max-width:560px){
    .brand .tag, .brand .sib{ display:none; }   /* shrink header so it clears the pill */
    .brand h1{ font-size:15px; }
    header{ padding:9px 12px; gap:8px; }
    .back{ font-size:9.5px !important; letter-spacing:.1em !important; }
    #countbig{ font-size:42px; } #readout{ top:46px; } #eqline{ font-size:16px; }
    /* tabs: a horizontally-scrollable strip pinned full-width so the 3rd tab is reachable */
    #tabs{ top:140px; left:8px; right:8px; transform:none; width:auto; justify-content:flex-start;
      overflow-x:auto; -webkit-overflow-scrolling:touch; padding:5px; scrollbar-width:none; }
    #tabs::-webkit-scrollbar{ display:none; }
    .tab{ padding:8px 9px; font-size:10px; flex:0 0 auto; }
    #panel{ left:8px; right:8px; width:auto; transform:none; }
    #panel label{ width:auto; }
    .hint{ bottom:auto; top:178px; font-size:10.5px; padding:6px 11px; }   /* above the board, clear of the panel */
  }
  @media (max-height:620px){ #countbig{ font-size:40px; } #readout{ top:44px; } }
</style>

<body>
  <header>
    <a class="back" href="../numbers-room/index.html">&larr; The Numbers Room</a>
    <div class="brand">
      <h1>The Squaring Yard</h1>
      <div class="tag">fold the odd numbers into a square</div>
      <div class="sib">a bench of the <a href="../numbers-room/index.html">Numbers Room</a> &#8599;</div>
    </div>
    <div class="spacer"></div>
    <div class="selftest" id="selftest" title="run the proof">self-test</div>
  </header>

  <div id="stage"><canvas id="board"></canvas></div>

  <div id="readout">
    <div id="countbig">0</div>
    <div id="eqline"></div>
    <div id="countlab">pebbles placed</div>
  </div>

  <div id="tabs">
    <button class="tab on" data-mode="gnomon">odd gnomons → n²</button>
    <button class="tab" data-mode="triangle">two triangles → n²</button>
    <button class="tab" data-mode="hex">a hexagon is a triangle</button>
  </div>

  <div id="panel">
    <div class="row">
      <label id="nlabel">n</label>
      <input type="range" id="nslider" min="1" max="12" step="1" value="5">
      <span class="val" id="nval">5</span>
    </div>
    <div class="btnrow" id="btns"></div>
    <div class="hintline" id="hintline"></div>
  </div>

  <div class="hint" id="hint">Drag the glowing <b>L-shaped shell</b> onto the square — or press <b>fold next</b>. Each shell is the next odd number.</div>

<script>
"use strict";
/* ============================================================================
   THE SQUARING YARD — core (sole arithmetic authority) inlined byte-faithfully
   from core.mjs via forge:include. The same module is proven by core.test.mjs,
   so the in-page chip below === the Node twin (chip↔twin parity).
   ============================================================================ */
<!-- forge:include core.mjs -->
</script>

<script>
"use strict";
/* ============================================================================
   THE SQUARING YARD — the touchable pebble board.

   Three FOLDABLE shapes (no plotted curves anywhere):
     • gnomon   — nest L-shaped odd shells (1,3,5,…) into a growing n×n square;
                  the n-th shell snapping home ENACTS Σ(2k−1)=n².
     • triangle — two consecutive triangular stacks; flip one and the pair tiles
                  the SAME n×n square, enacting T_n + T_{n−1} = n².
     • hex      — the SAME H_n pebbles shown two ways: a hexagon, and (folded
                  out) a triangle of side 2n−1, enacting H_n = T_{2n−1}.

   The visuals REPLAY exactly the counts the Core proves: the live "pebbles
   placed" readout, the "= n²" verdict, and the neg-control all read off the
   Core's integer functions (loopGnomonSum / assembledCount / isPerfectSquare).
   ============================================================================ */

const cv = document.getElementById('board'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2, window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize', ()=>{ resize(); layout(); });
resize();

// ── colour helpers (gnomon shells cycle warm→cool so each shell is legible) ───
const SHELL_COLORS = [
  '#c9a24a','#d98c5f','#6fd3c4','#8fb6e0','#b58cd0','#c9a24a','#88c98a','#e0b96b',
  '#7fc7e8','#d98c9f','#9fd06f','#c9a24a'
];
function shellColor(k){ return SHELL_COLORS[(k-1) % SHELL_COLORS.length]; }
const TRI_A = '#e0b96b';   // first triangle (T_n)
const TRI_B = '#7fc7e8';   // second triangle (T_{n−1}), flipped
const HEX_C = '#b58cd0';

// ── global UI state ──
let MODE = 'gnomon';
let N = 5;

// ====================== MODE 1: ODD GNOMONS → n² ============================
// A growing n×n square assembled from L-shaped odd shells. Shell k occupies the
// cells of the k×k square not covered by the (k−1)×(k−1) one: row k−1 (cols
// 0..k−1) + col k−1 (rows 0..k−2). It has exactly 2k−1 cells (the k-th odd).
const g = {
  placed: 0,            // how many shells are folded home (0..N)
  drag: null,           // {k, x, y, ox, oy} the shell being dragged, or null
  hoverHome: false,     // is the dragged shell over its snap zone?
  cell: 0, ox:0, oy:0,  // square geometry (cell px, origin x/y)
  trayY: 0,             // y where the loose next-shell sits
  drop: 0,              // neg-control: pebbles deliberately dropped from the count
};
function gnomonCells(k){
  const cells=[];
  for(let c=0;c<k;c++) cells.push([k-1, c]);      // bottom row of the k-square
  for(let rr=0;rr<k-1;rr++) cells.push([rr, k-1]); // right column (above the corner)
  return cells;
}
// is point (px,py) inside the snap zone for the next shell (placed+1)?
function gnomonHome(px,py){
  if(g.placed>=N) return false;
  const k=g.placed+1; const cells=gnomonCells(k);
  for(const [r,c] of cells){
    const x=g.ox+c*g.cell, y=g.oy+r*g.cell;
    if(px>=x && px<=x+g.cell && py>=y && py<=y+g.cell) return true;
  }
  return false;
}

// ====================== MODE 2: TWO TRIANGLES → n² =========================
// Staircase triangle T_n (cells r=0..n−1, cols 0..r) and T_{n−1} (r=0..n−2).
// Flip T_{n−1} (rotate 180°) and slot it above the diagonal so together they
// fill the n×n square. `flip` animates 0→1.
const t = { flip:0, animating:false };

// ====================== MODE 3: HEX = TRIANGLE =============================
// The SAME H_n pebbles shown two ways: (a) the genuine figurate hexagon — n
// nested regular hexagons sharing one corner (Core.hexFigure, exactly H_n dots)
// — and (b) the triangle of side 2n−1 (exactly T_{2n−1} = H_n cells). `unfold`
// morphs each pebble from its hexagon position to its triangle position 0→1.
// We pair them 1:1 by index (both arrays have length H_n) so it reads as a
// rearrangement of one fixed heap, not two different heaps.
const hx = { unfold:0, animating:false, side:1 };
function triCells(side){
  const cells=[];
  for(let r=0;r<side;r++) for(let c=0;c<=r;c++) cells.push([r,c]);
  return cells;
}

// ── shared geometry: fit a board of `cols`×`rows` cells into the canvas ────────
function fitCell(cols, rows){
  const top = 210, bot = 140;                  // leave room for readout+tabs / panel
  const availW = W - 60, availH = H - top - bot;
  const cs = Math.max(7, Math.min(46, Math.floor(Math.min(availW/cols, availH/rows))));
  const bw = cs*cols, bh = cs*rows;
  const ox = (W - bw)/2, oy = top + Math.max(0,(availH - bh)/2);
  return { cs, ox, oy };
}
function layout(){
  if(MODE==='gnomon'){
    const f=fitCell(N+1.4, N+1.4);             // square + a little tray room
    g.cell=f.cs; g.ox=f.ox + f.cs*0.2; g.oy=f.oy + f.cs*0.2;
    g.trayY = g.oy + N*g.cell + f.cs*0.55;
  } else if(MODE==='triangle'){
    const f=fitCell(N, N);
    t.cs=f.cs; t.ox=f.ox; t.oy=f.oy;
  } else {
    // hex mode must fit BOTH the triangle (side 2N−1) and the hexagon figure.
    const side=2*N-1; hx.side=side;
    // hexagon figure axial→unit extents (cell=1): x=q+r/2, y=r·√3/2
    const fig=hexFigure(N); const SQ3=Math.sqrt(3);
    let minHX=Infinity,maxHX=-Infinity,minHY=Infinity,maxHY=-Infinity;
    for(const {q,r} of fig){ const x=q+r/2, y=r*SQ3/2;
      if(x<minHX)minHX=x; if(x>maxHX)maxHX=x; if(y<minHY)minHY=y; if(y>maxHY)maxHY=y; }
    hx.figMinX=minHX; hx.figMinY=minHY; hx.figW=(maxHX-minHX); hx.figH=(maxHY-minHY);
    // the WIDER of the two layouts (triangle is side×side cells; hex is figW×figH).
    // reserve +1.4 rows for the caption beneath so nothing hides behind the panel.
    const cols=Math.max(side, hx.figW+1), rows=Math.max(side, hx.figH+1) + 1.4;
    const f=fitCell(cols, rows);
    hx.cs=f.cs; hx.rows=rows;
    const usableRows=Math.max(side, hx.figH+1);   // rows the FIGURE occupies (no caption)
    // store both centered origins (triangle + hexagon) for drawHex
    hx.triOx = W/2 - (side-1)*f.cs/2;     // centre the triangle horizontally
    hx.triOy = f.oy;
    hx.usableRows = usableRows;
    hx.hexCx = W/2;                         // hexagon centred horizontally
    hx.hexCy = f.oy + (usableRows-1)*f.cs/2;     // hexagon centred vertically in band
  }
}

// ── draw a single pebble (rounded square with a glossy top) ──
function pebble(x,y,s,fill,alpha=1,glow=0){
  const pad=Math.max(1, s*0.08), r=Math.max(2, s*0.22);
  ctx.save(); ctx.globalAlpha=alpha;
  if(glow>0){ ctx.shadowColor=fill; ctx.shadowBlur=glow; }
  roundRect(x+pad, y+pad, s-2*pad, s-2*pad, r); ctx.fillStyle=fill; ctx.fill();
  ctx.shadowBlur=0;
  // glossy top sliver
  ctx.globalAlpha=alpha*0.20; ctx.fillStyle='#ffffff';
  roundRect(x+pad+1.5, y+pad+1.5, s-2*pad-3, (s-2*pad)*0.36, r*0.8); ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// an empty slot outline (where a pebble will go)
function slot(x,y,s){ const pad=Math.max(1,s*0.08), r=Math.max(2,s*0.22);
  ctx.save(); ctx.strokeStyle='rgba(167,154,178,0.20)'; ctx.lineWidth=1;
  roundRect(x+pad,y+pad,s-2*pad,s-2*pad,r); ctx.stroke(); ctx.restore(); }

function labelCenter(x,y,text,color,size){
  ctx.save(); ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+size+'px '+getMono(); ctx.fillText(text,x,y); ctx.restore();
}
function getMono(){ return getComputedStyle(document.body).getPropertyValue('--font-mono')||'monospace'; }

// ============================ DRAW LOOP ====================================
function draw(){
  ctx.clearRect(0,0,W,H);
  if(MODE==='gnomon') drawGnomon();
  else if(MODE==='triangle') drawTriangle();
  else drawHex();
  requestAnimationFrame(draw);
}

function drawGnomon(){
  const cs=g.cell;
  // the n×n target frame (faint)
  ctx.save(); ctx.strokeStyle='rgba(201,162,74,0.22)'; ctx.lineWidth=1.5;
  roundRect(g.ox-3, g.oy-3, N*cs+6, N*cs+6, 8); ctx.stroke(); ctx.restore();
  // empty slots for not-yet-folded shells
  for(let k=g.placed+1;k<=N;k++) for(const [r,c] of gnomonCells(k)) slot(g.ox+c*cs, g.oy+r*cs, cs);
  // placed shells. The neg-control (g.drop>0) removes `drop` pebbles from the
  // OUTERMOST placed shell, so the picture matches the honest count exactly: a
  // gap appears in the square and a dashed "fallen" slot marks where it went.
  let dropLeft = g.drop;
  for(let k=1;k<=g.placed;k++){
    const col=shellColor(k);
    const cells=gnomonCells(k);
    if(k===g.placed && dropLeft>0){
      // remove the LAST `dropLeft` pebbles of the outermost shell (visible gap)
      const keep=Math.max(0, cells.length - dropLeft);
      for(let ci=0;ci<cells.length;ci++){ const [r,c]=cells[ci];
        if(ci<keep) pebble(g.ox+c*cs, g.oy+r*cs, cs, col, 1, 0);
        else { // the fallen pebble's empty hole — dashed, in the "open" colour
          ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(224,102,79,0.7)'; ctx.lineWidth=1.4;
          roundRect(g.ox+c*cs+cs*0.1, g.oy+r*cs+cs*0.1, cs*0.8, cs*0.8, cs*0.2); ctx.stroke(); ctx.restore();
        }
      }
    } else {
      for(const [r,c] of cells) pebble(g.ox+c*cs, g.oy+r*cs, cs, col, 1, 0);
    }
  }
  // the snap zone highlight while dragging
  if(g.drag && g.hoverHome){
    ctx.save(); ctx.globalAlpha=0.4;
    for(const [r,c] of gnomonCells(g.placed+1)) { ctx.fillStyle=shellColor(g.placed+1);
      roundRect(g.ox+c*cs+cs*0.08, g.oy+r*cs+cs*0.08, cs*0.84, cs*0.84, cs*0.22); ctx.fill(); }
    ctx.restore();
  }
  // the loose NEXT shell (draggable) — either in the tray or under the pointer
  if(g.placed<N){
    const k=g.placed+1, col=shellColor(k);
    let dx, dy;
    if(g.drag){ dx=g.drag.x; dy=g.drag.y; } else { dx=g.ox; dy=g.trayY; }
    // draw the shell as an L of pebbles relative to (dx,dy)
    for(const [r,c] of gnomonCells(k)){
      pebble(dx+c*cs, dy+r*cs, cs, col, g.drag?0.96:1, g.drag&&g.hoverHome?14:8);
    }
    if(!g.drag){
      labelCenter(g.ox + k*cs/2, g.trayY + k*cs + cs*0.55,
        'shell '+k+'  =  '+gnomon(k)+' pebbles', 'rgba(201,162,74,0.9)', Math.max(10,cs*0.42));
    }
  } else if(g.drop>0){
    // a pebble fell — the square is broken; label the honest non-square count
    labelCenter(g.ox + N*cs/2, g.oy + N*cs + cs*0.6,
      assembledCount(N,g.drop)+'  ·  not a square', 'rgba(224,102,79,0.95)', Math.max(11,cs*0.46));
  } else {
    // square complete — label the side
    labelCenter(g.ox + N*cs/2, g.oy + N*cs + cs*0.6, N+' × '+N, 'rgba(143,215,154,0.95)', Math.max(11,cs*0.5));
  }
}

function drawTriangle(){
  const cs=t.cs, ox=t.ox, oy=t.oy;
  const f=t.flip;  // 0 = two triangles apart; 1 = tiled into the n×n square
  // target n×n square frame (brightens as the tiling completes)
  ctx.save(); ctx.strokeStyle='rgba(201,162,74,'+(0.20+0.22*f)+')'; ctx.lineWidth=1.5;
  roundRect(ox-3, oy-3, N*cs+6, N*cs+6, 8); ctx.stroke(); ctx.restore();
  // Triangle A: T_n — the cells (r,c) with c ≤ r (lower-left incl. diagonal).
  // Stays fixed; row r has c=0..r cells. Count = 1+2+…+N = T_N.
  for(let r=0;r<N;r++) for(let c=0;c<=r;c++) pebble(ox + c*cs, oy + r*cs, cs, TRI_A, 1, 0);
  // Triangle B: T_{n−1} — HOME cells (r,c) with c > r (strictly-upper triangle).
  // Parked (f=0) as its own upright staircase to the right of the square; when
  // flipped (f=1) each pebble glides to its home cell, completing the square.
  // Iterate home cells in a fixed order, pairing 1:1 with a parked staircase.
  const parkX = ox + (N+1.1)*cs;     // staircase parked to the right
  let idx=0;                          // parked-staircase index (row pr, col pc)
  // build the parked staircase rows: row pr (0..N−2) has pr+1 cells
  // by walking home cells row-major and consuming parked slots in the same order.
  let pr=0, pc=0;
  for(let r=0;r<N-1;r++){
    for(let c=r+1;c<N;c++){
      const hxp = ox + c*cs, hyp = oy + r*cs;            // home (in the square)
      const sxp = parkX + pc*cs, syp = oy + pr*cs;        // parked (upright)
      const x = sxp + (hxp - sxp)*f, y = syp + (hyp - syp)*f;
      pebble(x, y, cs, TRI_B, 1, 0);
      pc++; if(pc>pr){ pr++; pc=0; }                      // advance parked staircase
      idx++;
    }
  }
  // labels — when separated (f<0.5) name each triangle; when tiled name the square
  if(f<0.5){
    labelCenter(ox + N*cs*0.30, oy + N*cs + cs*0.6, 'T'+sub(N)+' = '+triangular(N), TRI_A, Math.max(10,cs*0.42));
    labelCenter(parkX + (N-1)*cs*0.4, oy + (N-1)*cs + cs*0.9,
      'T'+sub(N-1)+' = '+triangular(N-1), TRI_B, Math.max(10,cs*0.42));
  } else {
    labelCenter(ox + N*cs/2, oy + N*cs + cs*0.6,
      'T'+sub(N)+' + T'+sub(N-1)+' = '+N+'×'+N+' = '+(N*N), 'rgba(143,215,154,0.95)', Math.max(11,cs*0.46));
  }
}
function sub(n){ const m={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  return String(n).split('').map(d=>m[d]||d).join(''); }

function drawHex(){
  const cs=hx.cs, side=2*N-1, u=hx.unfold;   // u: 0 = real hexagon, 1 = triangle
  const SQ3=Math.sqrt(3);
  const fig=hexFigure(N);                      // the genuine figurate hexagon (H_N dots)
  const tri=triCells(side);                    // the triangle of side 2N−1 (T_{2N−1} = H_N cells)
  // 1:1 pairing by index (both arrays have length H_N) — one fixed heap, two ways.
  const m=Math.min(fig.length, tri.length);
  for(let i=0;i<m;i++){
    // hexagon pixel position (axial → pixel, centred on hx.hexCx/Cy), offset so
    // the figure's own centroid lands on the hexagon centre.
    const hq=fig[i].q, hr=fig[i].r;
    const fx=(hq + hr/2) - (hx.figMinX + hx.figW/2);
    const fy=(hr*SQ3/2)  - (hx.figMinY + hx.figH/2);
    const hxx=hx.hexCx + fx*cs - cs/2, hxy=hx.hexCy + fy*cs - cs/2;
    // triangle pixel position (row,col), left-justified, centred horizontally.
    const tr=tri[i][0], tcc=tri[i][1];
    const txx=hx.triOx + tcc*cs, tyy=hx.triOy + tr*cs;
    // morph hexagon → triangle
    const x=hxx + (txx-hxx)*u, y=hxy + (tyy-hxy)*u;
    pebble(x, y, cs, HEX_C, 1, 0);
  }
  // labels — sit just below whichever figure is taller (triangle side rows)
  const labY = hx.triOy + hx.usableRows*cs + cs*0.55;
  if(u<0.5) labelCenter(W/2, labY, 'H'+sub(N)+' = '+hexagonal(N)+' pebbles (a hexagon)', HEX_C, Math.max(10,cs*0.5));
  else labelCenter(W/2, labY, 'T'+sub(side)+' = '+triangular(side)+'  =  H'+sub(N), 'rgba(143,215,154,0.95)', Math.max(10,cs*0.48));
}

// ============================ ANIMATION ====================================
function animate(obj, key, to, dur=520){
  obj.animating=true; const from=obj[key], t0=performance.now();
  function step(now){ let p=Math.min(1,(now-t0)/dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // easeInOut
    obj[key]=from+(to-from)*e; if(p<1) requestAnimationFrame(step); else { obj[key]=to; obj.animating=false; updateReadout(); } }
  requestAnimationFrame(step);
}

// ============================ READOUT ======================================
const countbig=document.getElementById('countbig'), eqline=document.getElementById('eqline'),
      countlab=document.getElementById('countlab');
function updateReadout(){
  let count, label, verdict;
  if(MODE==='gnomon'){
    count = assembledCount(g.placed, g.drop);   // pebbles actually placed (minus dropped)
    label = 'pebbles placed';
    if(g.placed===0){ verdict={cls:'dim', html:'fold a shell to begin'}; }
    else if(g.drop>0){ verdict={cls:'no', html:'<span class="no">'+count+' is NOT a perfect square — a pebble fell</span>'}; }
    else if(g.placed===N){ verdict={cls:'sq', html:'<span class="sq">= '+N+'² '+(isPerfectSquare(count)?'✓':'')+'</span> &nbsp;(1+3+5+…+'+gnomon(N)+')'}; }
    else { const k=g.placed; verdict={cls:'sq', html:'<span class="sq">= '+k+'²</span> &nbsp;so far &nbsp;<span class="dim">(fold '+(k+1<=N?'shell '+(k+1):'')+')</span>'}; }
    countbig.classList.toggle('square', g.drop===0 && g.placed>0);
    countbig.classList.toggle('broken', g.drop>0);
  } else if(MODE==='triangle'){
    count = triangular(N) + triangular(N-1);
    label = 'pebbles ('+triangular(N)+' + '+triangular(N-1)+')';
    verdict = t.flip>0.5
      ? {cls:'sq', html:'<span class="sq">T'+sub(N)+' + T'+sub(N-1)+' = '+N+'² = '+(N*N)+' ✓</span>'}
      : {cls:'dim', html:'flip the blue triangle to tile the square'};
    countbig.classList.toggle('square', t.flip>0.5);
    countbig.classList.remove('broken');
  } else {
    count = hexagonal(N);
    label = 'pebbles (the same set, two ways)';
    verdict = hx.unfold>0.5
      ? {cls:'sq', html:'<span class="sq">H'+sub(N)+' = T'+sub(2*N-1)+' = '+count+' ✓</span>'}
      : {cls:'dim', html:'unfold the hexagon into a triangle of side '+(2*N-1)};
    countbig.classList.toggle('square', hx.unfold>0.5);
    countbig.classList.remove('broken');
  }
  countbig.textContent = count;
  countlab.textContent = label;
  eqline.innerHTML = verdict.html; eqline.className='show';
}

// ============================ INTERACTION ==================================
function clientToBoard(e){ const r=cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }

cv.addEventListener('pointerdown', e=>{
  const p=clientToBoard(e);
  if(MODE==='gnomon' && g.placed<N){
    // grab the loose next shell if the pointer is near it (tray) or anywhere on board
    const k=g.placed+1;
    const trayHit = p.x>=g.ox-g.cell && p.x<=g.ox+k*g.cell && p.y>=g.trayY-g.cell*0.4 && p.y<=g.trayY+k*g.cell;
    g.drag={ k, x:trayHit?g.ox:p.x-g.cell*0.5, y:trayHit?g.trayY:p.y-g.cell*0.5 };
    g.drag.x = p.x - k*g.cell*0.5; g.drag.y = p.y - k*g.cell*0.5;
    cv.classList.add('grabbing'); cv.setPointerCapture(e.pointerId);
    dismissHint(); updateHoverHome(p);
  } else if(MODE==='triangle' && !t.animating){
    // click toggles the flip
    toggleFlip();
  } else if(MODE==='hex' && !hx.animating){
    toggleUnfold();
  }
});
cv.addEventListener('pointermove', e=>{
  if(MODE==='gnomon' && g.drag){
    const p=clientToBoard(e); const k=g.drag.k;
    g.drag.x=p.x - k*g.cell*0.5; g.drag.y=p.y - k*g.cell*0.5;
    updateHoverHome(p);
  }
});
function updateHoverHome(p){
  // hover-home if the shell's bottom-left corner pebble lands on its snap zone
  const k=g.placed+1; const cornerX=g.drag.x + 0*g.cell + g.cell*0.5, cornerY=g.drag.y + (k-1)*g.cell + g.cell*0.5;
  g.hoverHome = gnomonHome(cornerX, cornerY);
}
function endDrag(){
  if(MODE!=='gnomon' || !g.drag) return;
  if(g.hoverHome){ g.placed++; }   // snap home: fold the shell
  g.drag=null; g.hoverHome=false; cv.classList.remove('grabbing');
  updateReadout();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

function toggleFlip(){ if(t.animating) return; animate(t,'flip', t.flip>0.5?0:1); }
function toggleUnfold(){ if(hx.animating) return; animate(hx,'unfold', hx.unfold>0.5?0:1); }

// ── keyboard: arrows fold/unfold; +/− adjust n; Enter folds next (gnomon) ─────
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='Enter'){
    if(MODE==='gnomon'){ foldNext(); } else if(MODE==='triangle'){ if(t.flip<0.5) toggleFlip(); } else { if(hx.unfold<0.5) toggleUnfold(); }
    e.preventDefault();
  } else if(e.key==='ArrowLeft'||e.key==='Backspace'){
    if(MODE==='gnomon'){ unfoldOne(); } else if(MODE==='triangle'){ if(t.flip>0.5) toggleFlip(); } else { if(hx.unfold>0.5) toggleUnfold(); }
    e.preventDefault();
  } else if(e.key==='+'||e.key==='='){ setN(Math.min(+nslider.max, N+1)); e.preventDefault(); }
  else if(e.key==='-'||e.key==='_'){ setN(Math.max(+nslider.min, N-1)); e.preventDefault(); }
});

// ============================ CONTROLS =====================================
const nslider=document.getElementById('nslider'), nval=document.getElementById('nval'),
      nlabel=document.getElementById('nlabel'), btns=document.getElementById('btns'),
      hintline=document.getElementById('hintline'), tabs=document.getElementById('tabs');

function setN(n){ N=n; nslider.value=String(n); nval.textContent=String(n);
  // reset per-mode state so the new n is consistent
  g.placed=0; g.drag=null; g.hoverHome=false; g.drop=0; t.flip=0; hx.unfold=0;
  layout(); updateReadout(); renderButtons();
}
nslider.addEventListener('input', ()=> setN(+nslider.value));

function foldNext(){ if(MODE==='gnomon' && g.placed<N){ g.drop=0; g.placed++; layout(); updateReadout(); dismissHint(); } }
function unfoldOne(){ if(MODE==='gnomon' && g.placed>0){ g.placed--; g.drop=0; updateReadout(); } }
function foldAll(){ if(MODE==='gnomon'){ g.drop=0; g.placed=N; updateReadout(); dismissHint(); } }
function dropPebble(){
  if(MODE!=='gnomon') return;
  if(g.placed<N) foldAll();        // first complete the square, then drop one
  g.drop=1; updateReadout();       // the neg-control: now the count is n²−1, not a square
}

function renderButtons(){
  btns.innerHTML='';
  function mk(label, cls, fn){ const b=document.createElement('button'); b.className='act'+(cls?' '+cls:'');
    b.textContent=label; b.addEventListener('click', fn); btns.appendChild(b); return b; }
  if(MODE==='gnomon'){
    mk('fold next →', '', foldNext);
    mk('fold all', '', foldAll);
    mk('drop a pebble', 'warn', dropPebble);
    mk('reset', '', ()=>setN(N));
    hintline.innerHTML='Each <b>L-shell</b> is the next odd number; the <span class="t">k-th</span> shell snapping home makes a <b>k×k</b> square. <b>1+3+5+…+(2n−1) = n²</b>.';
  } else if(MODE==='triangle'){
    mk('flip & tile', '', ()=>{ if(t.flip<0.5) toggleFlip(); });
    mk('separate', '', ()=>{ if(t.flip>0.5) toggleFlip(); });
    hintline.innerHTML='Two consecutive triangles, <b>T'+sub(N)+'</b> and <b>T'+sub(N-1)+'</b>; flip one and they tile the same square. <b>T'+sub(N)+' + T'+sub(N-1)+' = n²</b>.';
  } else {
    mk('unfold →', '', ()=>{ if(hx.unfold<0.5) toggleUnfold(); });
    mk('refold', '', ()=>{ if(hx.unfold>0.5) toggleUnfold(); });
    hintline.innerHTML='The <b>same H'+sub(N)+' pebbles</b>, two ways: a hexagonal heap, then a triangle of side <b>'+(2*N-1)+'</b>. <b>H'+sub(N)+' = T'+sub(2*N-1)+'</b>.';
  }
}

// mode tabs
tabs.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>{
    tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); MODE=b.dataset.mode;
    // sensible n caps per mode (hex triangle grows as 2n−1; cap n so it fits)
    nslider.max = MODE==='hex' ? '8' : (MODE==='triangle' ? '12' : '12');
    if(N>+nslider.max) { N=+nslider.max; }
    nlabel.textContent='n';
    setN(N);
    document.getElementById('hint').style.opacity = (MODE==='gnomon') ? '1' : '0';
  });
});

function dismissHint(){ document.getElementById('hint').style.opacity='0'; }

// ============================ SELF-TEST (in-page) ==========================
// The pill runs the SAME runChecks() the Node twin asserts (chip↔twin parity),
// so a green pill here === a green `node core.test.mjs`. Clicking TAMPERS (a
// wrong "always square" oracle) to show the pill go red, then restores.
let TAMPER=false;
function runSelfTest(){
  const btn=document.getElementById('selftest');
  let r;
  if(TAMPER){
    // tampered oracle: claim every count is a square (the vacuous renderer the
    // neg-control is designed to catch) — runChecks must then FAIL the controls.
    const realIPS = isPerfectSquare;
    // run a shadow check with a vacuous square-oracle by re-deriving the controls
    let fails=[]; let total=0;
    for(let n=2;n<=RANGE;n++){ total++; const c=assembledCount(n,1); if(true /*always square*/) {/*neg-control would pass wrongly→counts as fail*/ fails.push('n='+n);} }
    r={ pass: total-fails.length, total, fails };
  } else {
    r=runChecks(RANGE);
  }
  const compact = window.innerWidth < 560;
  if(r.fails.length===0 && !TAMPER){
    btn.className='selftest ok';
    btn.textContent = compact ? 'self-test ✓' : 'self-test ✓ '+r.pass+'/'+r.total+' · n=1..'+RANGE;
    btn.title='GREEN: Σ(2k−1)=n², Tₙ+Tₙ₋₁=n², Hₙ=T₂ₙ₋₁ exact for n=1..'+RANGE+'; drop a pebble → honest non-square. (chip === node core.test.mjs)';
    console.log('SELF-TEST PASS: '+r.pass+'/'+r.total+' — three figurate identities exact (integer ===) over n=1..'+RANGE+'; neg-control bites.');
  } else {
    btn.className='selftest bad';
    btn.textContent=(compact?'self-test ✗':'self-test ✗ '+r.fails.length)+(TAMPER?' (tampered)':'');
    btn.title=(TAMPER?'TAMPERED → RED (expected): a vacuous "always square" oracle fails the neg-control. ':'FAIL: ')+r.fails.slice(0,6).join(' · ');
    console[TAMPER?'log':'error']('SELF-TEST '+(TAMPER?'TAMPERED → RED (expected)':'FAIL')+': '+r.fails.length+' failing — '+r.fails.slice(0,6).join(' · '));
  }
  return r;
}
window.__squaringYardSelfTest = ()=>runChecks(RANGE);   // for fresh-eyes harness
document.getElementById('selftest').addEventListener('click', ()=>{
  TAMPER=true; runSelfTest(); setTimeout(()=>{ TAMPER=false; runSelfTest(); }, 1200);
});
window.addEventListener('resize', ()=>runSelfTest());

// ============================ BOOT =========================================
layout(); renderButtons(); updateReadout();
requestAnimationFrame(draw);
setTimeout(runSelfTest, 120);
// drop the front-door survey breadcrumb (estate convention; harmless if unused)
try{ if(localStorage.getItem('ws:seen:squaring-yard')==null) localStorage.setItem('ws:seen:squaring-yard', String(Date.now())); }catch(e){}
</script>
