<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mirror Maze — a laser-reflection atelier</title>
<style>
  :root{
    /* ---- Hall (default skin) — gilt-on-graphite estate ---- */
    --bg:        #08090d;
    --stage:     radial-gradient(1200px 820px at 54% 36%, #16171f 0%, #0e0f15 66%, #07080b 100%);
    --panel-bg:  rgba(18,19,26,0.88);
    --panel-edge:rgba(150,156,180,0.26);
    --ink:       #edeef4;
    --ink-dim:   #9a9caa;
    --accent:    #c9a24a;            /* warm gilt */
    --accent-soft: rgba(201,162,74,0.16);
    --accent-ink: #16140d;
    --ok:  #7fd28a;
    --bad: #f08a7a;
    /* board surfaces */
    --grid-bg:   #111219;
    --cell-edge: rgba(150,156,180,0.12);
    --cell-edge-major: rgba(150,156,180,0.30);
    --emitter:   #f4d479;
    --beam:      #ffcf5a;            /* laser colour */
    --beam-glow: rgba(255,207,90,0.55);
    --mirror:    #cdd3e4;            /* mirror glass */
    --mirror-edge: rgba(220,228,248,0.9);
    --wall:      #3a3d4d;
    --wall-edge: rgba(150,156,180,0.4);
    --target:    #6fb6ff;            /* unlit sensor */
    --target-lit:#7fd28a;            /* lit sensor */
    --target-lit-glow: rgba(127,210,138,0.7);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  /* ---- Spectrum skin (cool prism on indigo) ---- */
  body[data-skin="spectrum"]{
    --bg:#070a18;
    --stage: radial-gradient(1200px 820px at 52% 34%, #131b3a 0%, #0c1228 66%, #060912 100%);
    --panel-bg: rgba(12,16,34,0.9);
    --panel-edge: rgba(130,150,230,0.30);
    --ink:#e7ecff; --ink-dim:#90a0d0;
    --accent:#8ab6ff; --accent-soft: rgba(138,182,255,0.16); --accent-ink:#0a1230;
    --ok:#7fe4d0; --bad:#ff9a8a;
    --grid-bg:#0c1124;
    --cell-edge: rgba(130,150,230,0.14);
    --cell-edge-major: rgba(130,150,230,0.34);
    --emitter:#a6f0ff;
    --beam:#67e8ff; --beam-glow: rgba(103,232,255,0.55);
    --mirror:#dfe6ff; --mirror-edge: rgba(223,230,255,0.9);
    --wall:#2a3354; --wall-edge: rgba(130,150,230,0.45);
    --target:#c89bff; --target-lit:#7fe4d0; --target-lit-glow: rgba(127,228,208,0.7);
  }
  /* ---- Brass skin (warm amber laboratory) ---- */
  body[data-skin="brass"]{
    --bg:#120d06;
    --stage: radial-gradient(1200px 820px at 54% 36%, #2a1f0f 0%, #1c1408 66%, #110b04 100%);
    --panel-bg: rgba(28,20,8,0.9);
    --panel-edge: rgba(196,158,92,0.34);
    --ink:#f6ecd6; --ink-dim:#bda378;
    --accent:#e0a93a; --accent-soft: rgba(224,169,58,0.16); --accent-ink:#1c1408;
    --ok:#aacb6a; --bad:#f0926a;
    --grid-bg:#191204;
    --cell-edge: rgba(196,158,92,0.16);
    --cell-edge-major: rgba(196,158,92,0.40);
    --emitter:#ffdf8f;
    --beam:#ff7e3a; --beam-glow: rgba(255,126,58,0.55);
    --mirror:#f0e6cf; --mirror-edge: rgba(240,230,207,0.92);
    --wall:#4a3a1c; --wall-edge: rgba(196,158,92,0.5);
    --target:#7ad0c0; --target-lit:#aacb6a; --target-lit-glow: rgba(170,203,106,0.7);
  }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    transition: background .4s ease, color .4s ease;
  }
  #stage{
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    background:var(--stage); transition: background .4s ease;
    padding:22px 18px 60px;
  }
  .wrap{
    display:flex; gap:22px; align-items:flex-start;
    flex-wrap:wrap; justify-content:center; width:100%; max-width:1120px;
  }

  /* ----------------------------- Panel ----------------------------- */
  #panel{
    width:300px; flex:0 0 300px;
    background:var(--panel-bg);
    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:16px 16px 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.4);
    transition: background .4s ease, border-color .4s ease;
  }
  .topline{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  #panel h1{
    font-family:Georgia,"Times New Roman",serif; font-weight:500;
    font-size:25px; letter-spacing:.2px; margin:0;
    background:linear-gradient(96deg,#ff8f8f,#ffd27a,#f4f0c0,#9fe6b4,#8ecbff,#b6a8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .links{ display:flex; flex-direction:column; gap:3px; align-items:flex-end; white-space:nowrap; }
  .back{ font-size:10.5px; color:var(--accent); text-decoration:none; opacity:.85; }
  .back:hover{ opacity:1; text-decoration:underline; }
  .sub{ font-size:10px; color:var(--ink-dim); margin:4px 0 13px; letter-spacing:1.2px; text-transform:uppercase; font-family:var(--font-mono); }

  /* self-test chip */
  .selftest{ display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-family:var(--font-mono); padding:5px 9px; border-radius:8px;
    border:1px solid var(--panel-edge); background:rgba(255,255,255,0.02);
    color:var(--ink-dim); cursor:default; margin-bottom:14px; user-select:none; }
  .selftest.ok{ color:var(--ok); border-color:rgba(127,210,138,0.4); background:rgba(127,210,138,0.08); }
  .selftest.bad{ color:var(--bad); border-color:rgba(240,138,122,0.5); background:rgba(240,138,122,0.1); }
  .selftest .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .row{ margin-bottom:12px; }
  .row > label{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.4px; text-transform:uppercase; }

  /* segmented control */
  .seg{ display:flex; gap:4px; background:rgba(0,0,0,0.22); border:1px solid var(--panel-edge);
    border-radius:9px; padding:4px; }
  .seg button{ flex:1 1 0; min-width:0; border:none; background:transparent; color:var(--ink-dim);
    font-size:11.5px; padding:7px 4px; border-radius:6px; cursor:pointer; transition:.15s;
    font-family:var(--font-ui); letter-spacing:.2px; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .seg button:not(.active):hover{ color:var(--ink); background:rgba(255,255,255,0.05); }

  .seedrow{ display:flex; gap:7px; }
  .seedrow input[type=text]{ flex:1; min-width:0; background:rgba(0,0,0,0.25);
    border:1px solid var(--panel-edge); color:var(--ink); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:var(--font-mono); letter-spacing:.5px; }
  .seedrow input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .iconbtn{ flex:0 0 auto; width:38px; border:1px solid var(--panel-edge); border-radius:8px;
    background:rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; font-size:16px; line-height:1; }
  .iconbtn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .actions button{ border:1px solid var(--panel-edge); border-radius:9px; padding:9px 8px;
    background:rgba(255,255,255,0.03); color:var(--ink); cursor:pointer; font-size:12.5px;
    font-weight:600; transition:.15s; letter-spacing:.2px; font-family:var(--font-ui); }
  .actions button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .actions button.wide{ grid-column:1 / -1; }
  .actions button:disabled{ opacity:.4; cursor:default; }

  .stats{ display:flex; gap:14px; margin:14px 0 4px; padding:11px 12px;
    border:1px solid var(--panel-edge); border-radius:10px; background:rgba(0,0,0,0.18); }
  .stat-item{ flex:1; }
  .stat-item .k{ font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-dim); }
  .stat-item .v{ font-family:var(--font-mono); font-size:18px; color:var(--accent);
    font-variant-numeric:tabular-nums; margin-top:2px; }
  .stat-item .v.warn{ color:var(--bad); }

  .caption{ font-size:11px; color:var(--ink-dim); margin-top:14px; line-height:1.6; letter-spacing:.2px; }
  .caption b{ color:var(--ink); font-weight:600; }
  .caption .mono{ font-family:var(--font-mono); color:var(--accent); }

  /* ----------------------------- Board ----------------------------- */
  #boardWrap{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; min-width:0; }
  #boardOuter{ position:relative; line-height:0; }
  #board{ display:block; border-radius:12px; touch-action:none; cursor:pointer;
    box-shadow: 0 14px 44px rgba(0,0,0,0.42); }
  #boardOuter.won #board{ cursor:default; }

  .verdict{ min-height:30px; margin-top:16px; text-align:center; font-size:15px; letter-spacing:.3px;
    opacity:0; transition:opacity .4s ease; line-height:1.4; }
  .verdict.show{ opacity:1; }
  .verdict .name{ color:var(--accent); font-weight:700; }
  .verdict .small{ display:block; font-size:11px; color:var(--ink-dim); margin-top:3px; letter-spacing:.4px; }

  /* ---- Feats of Light (shared gilt UX; literal colours intentionally shared) ---- */
  .feat-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:9999;
    background:rgba(20,18,14,0.95);border:1px solid rgba(201,162,74,0.6);border-radius:12px;
    padding:11px 18px;color:#f0e6cf;font:500 13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 24px rgba(201,162,74,0.25);opacity:0;
    transition:opacity .5s ease,transform .5s ease;pointer-events:none;max-width:80vw}
  .feat-toast.show{opacity:1;transform:translate(-50%,0)}
  .feat-toast .feat-star{color:#e9c46a;font-size:15px}
  .feat-toast b{color:#ffe9b0;font-weight:600}
  .feat-chip{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.04em;padding:6px 10px;border-radius:20px;border:1px solid rgba(201,162,74,0.35);
    background:rgba(40,34,22,0.4);color:#b9a571;white-space:nowrap;transition:all .35s ease}
  .feat-chip.earned{color:#ffe3a0;border-color:rgba(233,196,106,0.85);background:rgba(70,56,24,0.55);
    box-shadow:0 0 14px rgba(233,196,106,0.3)}
  .feat-chip .fc-star{color:#e9c46a}
  /* harmonise spacing: sits under the self-test chip, matching its rhythm */
  #featChip{ margin-bottom:14px; }

  @media (max-width:760px){
    .wrap{ flex-direction:column; align-items:center; }
    #panel{ width:100%; max-width:380px; flex:none; }
  }
</style>

<script>
"use strict";
/* ===========================================================================
   THE MIRROR MAZE — a generative laser-reflection puzzle (the Hall of Mirrors).

   A laser enters the grid from a border cell and travels in a straight line.
   You place mirrors ( / and \ ) on empty cells to bend the beam 90° and route
   it through EVERY target sensor. You have exactly as many mirror tokens as the
   reference solution uses.

   The workshop crux: every board it deals is PROVABLY solvable by construction.
   The dealer first lays down a working route — a beam that bounces off placed
   mirrors and passes through all chosen targets — then strips the player-placed
   mirrors back into a token budget. Because the puzzle is *derived from* a route
   that already works, a solution provably exists. The self-test re-traces each
   board's stored reference solution and asserts 100% of targets are lit, over
   hundreds of seeded boards.
   ======================================================================== */

/* ----------------------------- PRNG (mulberry32 + xmur3 hash) ------------ */
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){ const s = xmur3(String(seedStr)); return mulberry32(s()); }

/* ===========================================================================
   EXACT BEAM MECHANICS — the deterministic heart.

   Directions are unit (dr,dc) vectors. We name the four cardinals:
     R = (0,+1)  right     L = (0,-1)  left
     D = (+1,0)  down      U = (-1,0)  up

   Reflection table (EXACT, asserted in the self-test):
     '\'  (top-left → bottom-right glass):
         R → D ,  D → R ,  L → U ,  U → L
     '/'  (bottom-left → top-right glass):
         R → U ,  U → R ,  L → D ,  D → L

   A cell may be empty (beam passes straight through), a mirror ('/' or '\'),
   or a wall (beam is absorbed / stopped).
   ======================================================================== */
const DIRS = { R:[0,1], L:[0,-1], D:[1,0], U:[-1,0] };
const DIR_NAMES = ['R','L','D','U'];
// canonical index for (cell,dir) loop-state keys
const DIR_IDX = { R:0, L:1, D:2, U:3 };

// reflect(dirName, mirrorChar) → new dirName. Pure, total over the 8 cases.
function reflect(dir, mirror){
  if (mirror === '\\'){
    switch(dir){ case 'R': return 'D'; case 'D': return 'R'; case 'L': return 'U'; case 'U': return 'L'; }
  } else if (mirror === '/'){
    switch(dir){ case 'R': return 'U'; case 'U': return 'R'; case 'L': return 'D'; case 'D': return 'L'; }
  }
  return dir; // not a mirror: unchanged (caller handles pass-through)
}

/* ---------------------------------------------------------------------------
   traceBeam(board) — deterministic ray march with loop / step-cap detection.

   board = {
     N,                                   // grid is N×N
     cells: Array(N*N) of '' | '/' | '\\' | '#'(wall),
     emitter: { r, c, dir }               // r,c is the BORDER entry cell, dir points inward
   }

   Returns {
     path: [ {r,c,dir} , ... ]            // ordered cell-visits (entry .. exit/absorb/loop)
     visited: Set("r,c")                  // cells the beam passed through (for target test)
     terminated: true                     // ALWAYS true — proves the tracer halts
     reason: 'exit' | 'wall' | 'loop'     // why it stopped
   }

   Loop safety: we record every (cell,dir) state in a visited-state set. A grid
   of mirrors can cycle a beam forever; the instant we re-enter a state we've
   already been in, we stop (reason:'loop'). We also keep a hard step cap of
   4*N*N+8 (> the 4*N*N distinct (cell,dir) states) as a belt-and-suspenders
   guarantee that the loop ALWAYS terminates.
   ======================================================================== */
function traceBeam(board){
  const { N, cells, emitter } = board;
  const path = [];
  const visitedCells = new Set();
  const seenStates = new Set();        // "r,c,dirIdx"
  const STEP_CAP = 4*N*N + 8;

  let r = emitter.r, c = emitter.c, dir = emitter.dir;
  let steps = 0;
  let reason = 'exit';

  // The emitter cell is a border cell; the beam begins entering it.
  while (true){
    if (steps++ > STEP_CAP){ reason = 'loop'; break; }      // hard guarantee of halting
    // out of bounds?  the beam has exited the grid.
    if (r < 0 || r >= N || c < 0 || c >= N){ reason = 'exit'; break; }

    const stateKey = r + ',' + c + ',' + DIR_IDX[dir];
    if (seenStates.has(stateKey)){ reason = 'loop'; break; }
    seenStates.add(stateKey);

    const cell = cells[r*N + c];

    if (cell === '#'){ reason = 'wall'; break; }            // absorbed by a wall

    // the beam occupies this cell
    path.push({ r, c, dir });
    visitedCells.add(r + ',' + c);

    if (cell === '/' || cell === '\\'){
      dir = reflect(dir, cell);
    }
    // step one cell along the (possibly new) direction
    const d = DIRS[dir];
    r += d[0]; c += d[1];
  }

  return { path, visited: visitedCells, terminated: true, reason };
}

/* Does the current board light every target? (the win predicate) */
function countLit(board, targets){
  const tr = traceBeam(board);
  let lit = 0;
  for (const t of targets){ if (tr.visited.has(t.r + ',' + t.c)) lit++; }
  return { lit, total: targets.length, allLit: lit === targets.length, trace: tr };
}

/* ===========================================================================
   THE GENERATOR — provably solvable by construction.
   ---------------------------------------------------------------------------
   We walk a beam from a random border emitter inward. At chosen interior cells
   we DROP a mirror (the exact char that turns the current heading toward where
   we want to go next), bending the route. We let it run a number of legs,
   recording the cells the beam actually passes through. A subset of those
   visited cells become the TARGETS; the dropped mirrors become the reference
   solution (and thus the token budget). The emitter, targets and any fixed
   mirrors ship to the player; the player-placed mirrors are removed.

   Because the targets are exactly cells the working route already passes
   through, re-tracing the route lights 100% of them — solvability is structural,
   not hoped-for. We additionally re-trace before returning and reject any board
   whose own reference solution fails to light every target (belt + suspenders),
   and reject degenerate boards (no mirrors used, < 2 targets, a straight shot,
   immediate escape).
   ======================================================================== */

// turn options from a heading: the two perpendicular headings and the mirror
// char that achieves each. (straight-through needs no mirror.)
// For heading H, placing mirror M at a cell sends the beam to reflect(H,M).
// We invert: to leave a cell heading T (perp to H), which mirror?
function mirrorFor(incoming, outgoing){
  // find the mirror char m such that reflect(incoming,m)===outgoing, else null
  if (reflect(incoming,'\\') === outgoing) return '\\';
  if (reflect(incoming,'/')  === outgoing) return '/';
  return null; // outgoing not perpendicular-reachable (same or reverse)
}
function perpDirs(dir){
  if (dir==='R'||dir==='L') return ['U','D'];
  return ['L','R'];
}

function generatePuzzle(seed, N){
  const rng = makeRng(seed + '|' + N);
  const ri = (n)=> Math.floor(rng()*n);

  // Try several routes; pick the first that yields a non-degenerate board.
  for (let attempt=0; attempt<60; attempt++){
    const route = buildRoute(rng, ri, N, attempt);
    if (!route) continue;
    const board = routeToBoard(route, N, rng, ri);
    if (board){ board.seed = seed; return board; }
  }
  // Guaranteed fallback: a single-bounce L route, always valid.
  return fallbackPuzzle(seed, N);
}

/* Walk a beam, dropping mirrors at chosen cells, recording the trail. */
function buildRoute(rng, ri, N, attempt){
  // choose a border emitter: pick a side, an offset, and the inward dir.
  const side = ri(4); // 0 top,1 bottom,2 left,3 right
  let r,c,dir;
  if (side===0){ r=0;          c=1+ri(N-2); dir='D'; }
  else if (side===1){ r=N-1;   c=1+ri(N-2); dir='U'; }
  else if (side===2){ c=0;     r=1+ri(N-2); dir='R'; }
  else {             c=N-1;    r=1+ri(N-2); dir='L'; }

  // occupancy: which cells already host a mirror (we won't double-place)
  const mirrorAt = new Map();   // "r,c" -> char
  const trail = [];             // ordered visited interior cells (with dir)
  // target number of bends scales with size; more bends ⇒ richer maze.
  const wantBends = (N<=6 ? 2+ri(2) : N<=8 ? 3+ri(2) : 4+ri(3));
  let bends = 0;
  let steps = 0;
  const STEP_CAP = 4*N*N + 8;
  let cr=r, cc=c, cd=dir;

  while (true){
    if (steps++ > STEP_CAP) break;
    if (cr<0||cr>=N||cc<0||cc>=N) break; // exited — route done
    trail.push({ r:cr, c:cc, dir:cd });

    // decide whether to bend here. Don't bend on the very first (border) cell.
    const interior = !(cr===0||cr===N-1||cc===0||cc===N-1);
    const canBendMore = bends < wantBends;
    // probability of a bend, biased so we hit roughly wantBends across the route
    const bendHere = interior && canBendMore && !mirrorAt.has(cr+','+cc) && rng() < 0.55;

    if (bendHere){
      // pick a perpendicular outgoing heading that keeps us on-board for ≥1 step
      const perps = perpDirs(cd);
      // shuffle the two choices deterministically
      if (rng()<0.5) perps.reverse();
      let placed=false;
      for (const out of perps){
        const m = mirrorFor(cd, out);
        if (!m) continue;
        const d = DIRS[out];
        const nr=cr+d[0], nc=cc+d[1];
        // require the next cell to be on-board (so the bend actually routes inward)
        if (nr<0||nr>=N||nc<0||nc>=N) continue;
        mirrorAt.set(cr+','+cc, m);
        bends++;
        cd = out;
        placed=true;
        break;
      }
      if (!placed){
        // couldn't bend; continue straight
        const d=DIRS[cd]; cr+=d[0]; cc+=d[1]; continue;
      }
    }
    // advance one cell along current heading
    const d=DIRS[cd]; cr+=d[0]; cc+=d[1];
  }

  if (bends === 0) return null;           // a straight shot is degenerate
  if (trail.length < 3) return null;      // too short

  return { emitter:{ r, c, dir }, mirrorAt, trail };
}

/* Convert a working route into a player puzzle. */
function routeToBoard(route, N, rng, ri){
  const { emitter, mirrorAt, trail } = route;

  // Candidate target cells: interior trail cells that are NOT mirror cells and
  // not the emitter cell. (A target sits on a straight segment of the beam.)
  const mirrorKeys = new Set(mirrorAt.keys());
  const seenT = new Set();
  const candidates = [];
  for (const v of trail){
    const key = v.r+','+v.c;
    if (mirrorKeys.has(key)) continue;
    if (v.r===emitter.r && v.c===emitter.c) continue;
    // border cells make poor targets visually; prefer interior
    if (v.r===0||v.r===N-1||v.c===0||v.c===N-1) continue;
    if (seenT.has(key)) continue;
    seenT.add(key);
    candidates.push({ r:v.r, c:v.c });
  }
  if (candidates.length < 2) return null;

  // Choose how many targets: 2..min(4, candidates). Spread them along the route.
  const maxT = Math.min(4, candidates.length);
  const nT = Math.max(2, Math.min(maxT, 2 + ri(maxT-1)));
  // pick nT spread-out candidates (every k-th) for nicer distribution
  const targets = [];
  if (nT >= candidates.length){
    for (const c of candidates) targets.push(c);
  } else {
    const step = candidates.length / nT;
    const start = ri(Math.max(1, Math.floor(step)));
    for (let i=0;i<nT;i++){
      const idx = Math.min(candidates.length-1, Math.floor(start + i*step));
      const c = candidates[idx];
      if (!targets.some(t=>t.r===c.r && t.c===c.c)) targets.push(c);
    }
    // backfill if dedupe shrank it
    let bi=0;
    while (targets.length < 2 && bi < candidates.length){
      const c=candidates[bi++]; if(!targets.some(t=>t.r===c.r&&t.c===c.c)) targets.push(c);
    }
  }
  if (targets.length < 2) return null;

  // The reference solution = the mirrors the route placed.
  let solution = [];                 // [{r,c,char}]
  for (const [key,char] of mirrorAt){
    const [r,c] = key.split(',').map(Number);
    solution.push({ r, c, char });
  }
  if (solution.length === 0) return null;

  const applied = (mirrors)=>{
    const cells = new Array(N*N).fill('');
    for (const m of mirrors) cells[m.r*N+m.c] = m.char;
    return cells;
  };

  // The full route must light every target (it does, by construction).
  if (!countLit({ N, cells:applied(solution), emitter }, targets).allLit) return null;

  // ---- PRUNE redundant mirrors so the solution is MINIMAL ----
  // A mirror is redundant if removing it still lights every target (it sits past
  // the last target on the path, or its leg grazes no unlit sensor). We remove
  // such mirrors greedily until every remaining mirror is load-bearing. This
  // tightens the token budget AND guarantees the win-check has teeth: removing
  // OR rotating any single mirror from a minimal solution unlights ≥1 target.
  let pruned = true;
  while (pruned){
    pruned = false;
    for (let i=0;i<solution.length;i++){
      const without = solution.slice(0,i).concat(solution.slice(i+1));
      if (countLit({ N, cells:applied(without), emitter }, targets).allLit){
        solution = without; pruned = true; break;
      }
    }
  }
  if (solution.length === 0) return null;       // everything was redundant ⇒ degenerate

  // After pruning, verify minimality: removing OR rotating any single mirror
  // must break the solution. (This is the puzzle's "teeth" guarantee, checked
  // per-board so the dealer never ships a sloppy budget.)
  for (const m of solution){
    const rm = solution.filter(x=>x!==m);
    if (countLit({ N, cells:applied(rm), emitter }, targets).allLit) return null;
    const rot = solution.map(x=> x===m ? {r:x.r,c:x.c,char:(x.char==='/'?'\\':'/')} : x);
    if (countLit({ N, cells:applied(rot), emitter }, targets).allLit) return null;
  }

  // Build the empty player board (no player mirrors; emitter + targets fixed).
  const cells = new Array(N*N).fill('');

  const board = {
    N,
    seed: '',              // set by generatePuzzle()
    cells,                 // mutable player layer (mirrors the player places)
    emitter,
    targets,
    solution,              // minimal reference mirrors (token budget = solution.length)
    budget: solution.length,
  };

  // Belt + suspenders: apply the reference solution and re-trace; assert all lit.
  if (!countLit({ N, cells:applied(solution), emitter }, targets).allLit) return null;

  // reject if a *blank* board already lights everything (trivial straight line)
  const blank = countLit({ N, cells:new Array(N*N).fill(''), emitter }, targets);
  if (blank.allLit) return null;

  return board;
}

/* Guaranteed fallback — a clean single-bounce L, always solvable & non-trivial. */
function fallbackPuzzle(seed, N){
  // emitter enters top at column 1, travels down; one '\' at (mid,1) sends it
  // right; targets sit on the down leg and the right leg.
  const mid = Math.max(2, Math.floor(N/2));
  const emitter = { r:0, c:1, dir:'D' };
  const solution = [{ r:mid, c:1, char:'\\' }];
  const targets = [ { r:1, c:1 }, { r:mid, c:Math.min(N-1, mid+1) } ];
  // ensure the second target is on the right leg and on-board
  if (targets[1].c <= 1) targets[1] = { r:mid, c:2 };
  const cells = new Array(N*N).fill('');
  return { N, seed, cells, emitter, targets, solution, budget: solution.length };
}

/* serialise a board's PUZZLE definition (not player layer) for determinism tests */
function boardFingerprint(b){
  const t = b.targets.map(t=>t.r+':'+t.c).sort().join(',');
  const s = b.solution.map(m=>m.r+':'+m.c+m.char).sort().join(',');
  return `N${b.N}|E${b.emitter.r}:${b.emitter.c}:${b.emitter.dir}|T${t}|S${s}|B${b.budget}`;
}

/* ===========================================================================
   THE SELF-TEST — runs on load; flips the chip green only if all pass.
   ======================================================================== */
function runSelfTest(){
  const checks = [];

  // ---- Check 1: EXACT reflection table — all 8 mirror×direction cases ----
  let c1=true; const c1fail=[];
  const expect = [
    ['\\','R','D'], ['\\','D','R'], ['\\','L','U'], ['\\','U','L'],
    ['/','R','U'],  ['/','U','R'],  ['/','L','D'],  ['/','D','L'],
  ];
  for (const [m,inD,outD] of expect){
    const got = reflect(inD, m);
    if (got !== outD){ c1=false; c1fail.push(`${m} ${inD}→${got}≠${outD}`); }
  }
  checks.push({ name:"exact reflection (8 cases)", pass:c1, detail:c1?"all 8 mirror×dir correct":c1fail.join("; ") });

  // ---- Check 2: tracer ALWAYS terminates — incl. an adversarial 4-mirror loop ----
  let c2=true; const c2fail=[];
  // a 2×2 box of mirrors that cycles the beam forever must terminate as 'loop'
  // layout (3×3, beam enters at (0,1) going down):
  //   . \ .          (1,1)=\  bends D→R
  //   / . \   -> arrange a square cycle
  //   . / .
  {
    const N=4;
    const cells=new Array(N*N).fill('');
    // build a closed square loop of mirrors at corners (1,1)(1,2)(2,2)(2,1)
    cells[1*N+1]='\\'; cells[1*N+2]='/'; cells[2*N+2]='\\'; cells[2*N+1]='/';
    // emitter aimed into the loop
    const res = traceBeam({ N, cells, emitter:{ r:0, c:1, dir:'D' } });
    if (!res.terminated){ c2=false; c2fail.push('loop board did not terminate'); }
    // it should report a loop (or at least halt cleanly)
    if (res.path.length > 4*N*N+8){ c2=false; c2fail.push('exceeded step cap'); }
  }
  // also: a board of ALL identical mirrors (dense) must still halt for many seeds
  for (let i=0;i<50;i++){
    const N=8; const cells=new Array(N*N).fill('');
    const rng=makeRng('adv-'+i);
    for (let k=0;k<N*N;k++){ const x=rng(); cells[k]= x<0.33?'/':x<0.66?'\\':''; }
    const r0=1+Math.floor(rng()*(N-2));
    const res = traceBeam({ N, cells, emitter:{ r:r0, c:0, dir:'R' } });
    if (!res.terminated){ c2=false; c2fail.push('dense board #'+i+' hung'); break; }
  }
  checks.push({ name:"tracer always terminates", pass:c2, detail:c2?"loop+50 dense adversarial boards halt":c2fail.join("; ") });

  // ---- Check 3: SOLVABILITY — ≥200 seeded boards across sizes; each reference
  //               solution lights 100% of targets ----
  let c3=true; let n3=0; const c3fail=[];
  const sizes=[6,8,10];
  const perSize=80; // 240 boards total
  for (const sz of sizes){
    for (let i=0;i<perSize;i++){
      const seed='sweep-'+sz+'-'+i;
      const b = generatePuzzle(seed, sz);
      n3++;
      // sanity: non-degenerate
      if (b.targets.length < 2 || b.budget < 1){ c3=false; if(c3fail.length<5) c3fail.push(seed+':degenerate'); continue; }
      // apply reference solution, re-trace, assert all targets lit
      const cells = b.cells.slice();
      for (const m of b.solution) cells[m.r*b.N+m.c]=m.char;
      const chk = countLit({ N:b.N, cells, emitter:b.emitter }, b.targets);
      if (!chk.allLit){ c3=false; if(c3fail.length<5) c3fail.push(seed+':'+chk.lit+'/'+chk.total); }
    }
  }
  checks.push({ name:"solvability ("+n3+" boards)", pass:c3, detail:c3?(n3+" boards, every reference solution lights 100% of targets"):("fail: "+c3fail.join(",")) });

  // ---- Check 4: WIN DETECTION has teeth — solved board reports solved; removing
  //               or rotating ONE mirror reports unsolved ----
  let c4=true; let n4=0; const c4fail=[];
  for (let i=0;i<60;i++){
    const sz=[6,8,10][i%3];
    const seed='teeth-'+i;
    const b=generatePuzzle(seed, sz);
    // solved:
    const cells=b.cells.slice();
    for (const m of b.solution) cells[m.r*b.N+m.c]=m.char;
    const solved=countLit({N:b.N,cells,emitter:b.emitter}, b.targets);
    // remove one mirror:
    const cellsRm=cells.slice();
    const drop=b.solution[i % b.solution.length];
    cellsRm[drop.r*b.N+drop.c]='';
    const unsolvedRm=countLit({N:b.N,cells:cellsRm,emitter:b.emitter}, b.targets);
    // rotate one mirror ( / <-> \ ):
    const cellsRot=cells.slice();
    cellsRot[drop.r*b.N+drop.c]= (drop.char==='/'?'\\':'/');
    const unsolvedRot=countLit({N:b.N,cells:cellsRot,emitter:b.emitter}, b.targets);
    n4++;
    if (!solved.allLit){ c4=false; if(c4fail.length<5) c4fail.push(seed+':notsolved'); }
    if (unsolvedRm.allLit){ c4=false; if(c4fail.length<5) c4fail.push(seed+':removal-still-solved'); }
    if (unsolvedRot.allLit){ c4=false; if(c4fail.length<5) c4fail.push(seed+':rotate-still-solved'); }
  }
  checks.push({ name:"win detection has teeth", pass:c4, detail:c4?(n4+" boards: solved=win, −1 mirror & rotate=loss"):("fail: "+c4fail.join(",")) });

  // ---- Check 5: SEED reproducibility + skin-invariance ----
  let c5=true; const c5fail=[];
  for (const sz of [6,8,10]){
    for (let i=0;i<10;i++){
      const seed='det-'+sz+'-'+i;
      const a=generatePuzzle(seed,sz), b=generatePuzzle(seed,sz);
      if (boardFingerprint(a)!==boardFingerprint(b)){ c5=false; c5fail.push(seed); }
    }
  }
  // re-roll changes the board (high probability across seeds)
  let differs=false;
  for (let i=0;i<30 && !differs;i++){
    const a=generatePuzzle('rollA-'+i,8), b=generatePuzzle('rollB-'+i,8);
    if (boardFingerprint(a)!==boardFingerprint(b)) differs=true;
  }
  if(!differs){ c5=false; c5fail.push('reroll-never-differs'); }
  checks.push({ name:"seed reproducibility", pass:c5, detail:c5?"same seed ⇒ identical board; skins cosmetic":("fail: "+c5fail.join(",")) });

  const passed = checks.filter(c=>c.pass).length;
  const total = checks.length;
  for (const c of checks){
    if (c.pass) console.log("[Mirror Maze] self-test PASS — "+c.name+" ("+c.detail+")");
    else console.error("[Mirror Maze] self-test FAIL — "+c.name+" ("+c.detail+")");
  }
  return { passed, total, allPass: passed===total, checks };
}

/* ===========================================================================
   ============================  THE UI / GAME  ===========================
   ======================================================================== */
const $ = id => document.getElementById(id);
const cv = $('board'), boardOuter = $('boardOuter'), verdict = $('verdict'),
      caption = $('caption'), seedInput = $('seedInput');
const ctx = cv.getContext('2d');

const state = {
  N: 8,
  seed: "",
  skin: "hall",
  board: null,           // current generated puzzle
  player: null,          // Array(N*N) of '' | '/' | '\\' (player-placed mirrors)
  won: false,
  moves: 0,
  showingSolution: false,
};

let dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
let cellPx = 56;         // CSS px per cell (set on render)
let pad = 18;            // CSS px padding around grid

/* ---- storage helpers (guarded) ---- */
function safeSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* Hall of Mirrors — "Feats of Light": a quiet, earned achievement.
   Drops a raise-only breadcrumb the Survey/Undercroft can read, + a consistent gilt toast. */
function earnFeat(id,label){var k='ws:flag:earned-'+id,fresh=false;
  try{if(!localStorage.getItem(k)){localStorage.setItem(k,String(Date.now()));fresh=true;}}catch(e){}
  var chip=document.getElementById('featChip'); if(chip){chip.classList.add('earned');}
  if(fresh)showFeatToast(label);}
function showFeatToast(label){var t=document.createElement('div');t.className='feat-toast';
  t.innerHTML='<span class="feat-star">&#10022;</span> Feat of Light earned<br><b>'+label+'</b>';
  document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},600);},3800);}
function initFeatChip(id){try{if(localStorage.getItem('ws:flag:earned-'+id)){var c=document.getElementById('featChip');if(c)c.classList.add('earned');}}catch(e){}}

/* ---- random seed string ---- */
function randomSeed(){
  const words=["mica","quill","ember","fjord","prism","facet","glint","lumen","onyx","reed","cairn","wisp","brume","flint","gable","spire","nook","azure","ray","beam","gleam","ardent"];
  const w = words[Math.floor(Math.random()*words.length)];
  return w + "-" + Math.floor(Math.random()*9000+1000);
}

/* ---- the combined board for tracing = puzzle fixed mirrors + player mirrors ---- */
function liveCells(){
  // board.cells holds nothing fixed in this design (all mirrors are player-placed);
  // we trace player layer directly. (Kept as a function for future fixed mirrors.)
  return state.player;
}

/* ---- new puzzle ---- */
function newPuzzle(seed){
  state.seed = seed;
  seedInput.value = seed;
  state.board = generatePuzzle(seed, state.N);
  state.player = new Array(state.N*state.N).fill('');
  state.won = false;
  state.moves = 0;
  state.showingSolution = false;
  boardOuter.classList.remove('won');
  verdict.classList.remove('show'); verdict.innerHTML = "";
  resizeCanvas();
  draw();
  updateStats();
  updateCaption();
}

/* ---- size the canvas to the grid (DPR-crisp) ---- */
function resizeCanvas(){
  const N = state.N;
  cellPx = N<=6 ? 60 : N<=8 ? 52 : 44;
  pad = Math.round(cellPx*0.34);
  const px = N*cellPx + pad*2;
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  cv.width = Math.round(px*dpr);
  cv.height = Math.round(px*dpr);
  cv.style.width = px+'px';
  cv.style.height = px+'px';
}

/* ---- geometry helpers (CSS px) ---- */
function cellCenter(r,c){ return { x: pad + c*cellPx + cellPx/2, y: pad + r*cellPx + cellPx/2 }; }
// where a beam enters the emitter border cell from outside (for the stub)
function emitterStub(em){
  const ctr = cellCenter(em.r, em.c);
  const d = DIRS[em.dir];
  // back the stub OUT of the grid, opposite the inward dir
  return { x: ctr.x - d[1]*cellPx*0.9, y: ctr.y - d[0]*cellPx*0.9, cx:ctr.x, cy:ctr.y };
}

function css(v){ return getComputedStyle(document.body).getPropertyValue(v).trim(); }

/* ---- draw the whole scene ---- */
/* The LIVE canvas just renders the scene at device-pixel-ratio scale. */
function draw(){ drawScene(ctx, dpr); }

/* a rounded-rect path on any context */
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function poly(c,pts){ c.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y); }

function readColors(){
  return {
    grid: css('--grid-bg'), edge: css('--cell-edge'), edgeM: css('--cell-edge-major'),
    emitter: css('--emitter'), beam: css('--beam'), beamGlow: css('--beam-glow'),
    mirror: css('--mirror'), mirrorEdge: css('--mirror-edge'),
    wall: css('--wall'), wallEdge: css('--wall-edge'),
    target: css('--target'), targetLit: css('--target-lit'), targetGlow: css('--target-lit-glow'),
    ink: css('--ink'),
  };
}

function drawBeamOn(c, tr, COL){
  if (tr.path.length===0) return;
  const pts = [];
  const stub = emitterStub(state.board.emitter);
  pts.push({ x:stub.x, y:stub.y });
  for (const p of tr.path){ const ctr=cellCenter(p.r,p.c); pts.push({x:ctr.x,y:ctr.y}); }
  // if the beam exited (not wall/loop), extend one cell past the last toward its heading
  if (tr.reason==='exit' && tr.path.length){
    const last = tr.path[tr.path.length-1];
    const d = DIRS[last.dir];
    const ctr=cellCenter(last.r,last.c);
    pts.push({ x:ctr.x + d[1]*cellPx*0.7, y:ctr.y + d[0]*cellPx*0.7 });
  }
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle=COL.beamGlow; c.lineWidth=9; c.beginPath(); poly(c,pts); c.stroke();
  c.strokeStyle=COL.beam; c.globalAlpha=0.9; c.lineWidth=4; c.beginPath(); poly(c,pts); c.stroke();
  c.globalAlpha=1; c.strokeStyle='#fff'; c.lineWidth=1.4; c.beginPath(); poly(c,pts); c.stroke();
  c.globalAlpha=1;
}

function drawEmitterOn(c, em, COL){
  const stub = emitterStub(em);
  const d = DIRS[em.dir];
  c.save();
  c.translate(stub.x, stub.y);
  c.rotate(Math.atan2(d[0], d[1]));
  c.fillStyle=COL.emitter;
  roundRect(c, -cellPx*0.22, -cellPx*0.18, cellPx*0.5, cellPx*0.36, 4); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(cellPx*0.22, 0, cellPx*0.06, 0, Math.PI*2); c.fill();
  c.restore();
}

function drawTargetOn(c, t, lit, COL){
  const {x,y} = cellCenter(t.r, t.c);
  const R = cellPx*0.26;
  if (lit){
    const g = c.createRadialGradient(x,y,0,x,y,R*2.4);
    g.addColorStop(0, COL.targetGlow); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle=g; c.beginPath(); c.arc(x,y,R*2.4,0,Math.PI*2); c.fill();
  }
  c.save(); c.translate(x,y); c.rotate(Math.PI/4);
  c.fillStyle = lit ? COL.targetLit : COL.target;
  c.globalAlpha = lit ? 1 : 0.62;
  roundRect(c, -R,-R, R*2,R*2, 3); c.fill();
  c.globalAlpha=1;
  c.strokeStyle = lit ? '#fff' : 'rgba(255,255,255,0.5)'; c.lineWidth=1.2;
  roundRect(c, -R,-R, R*2,R*2, 3); c.stroke();
  c.strokeStyle='rgba(255,255,255,0.35)'; c.lineWidth=0.8;
  c.beginPath(); c.moveTo(-R,0); c.lineTo(R,0); c.moveTo(0,-R); c.lineTo(0,R); c.stroke();
  c.restore();
}

function drawMirrorOn(c, r, cc, m, COL){
  const {x,y}=cellCenter(r,cc);
  const L = cellPx*0.34;
  c.save(); c.translate(x,y);
  // '\' goes top-left→bottom-right (slope +), '/' goes bottom-left→top-right
  const dx = L, dy = (m==='\\') ? L : -L;
  c.lineCap='round';
  c.strokeStyle='rgba(0,0,0,0.5)'; c.lineWidth=6;
  c.beginPath(); c.moveTo(-dx,-dy); c.lineTo(dx,dy); c.stroke();
  c.strokeStyle=COL.mirror; c.lineWidth=4.5;
  c.beginPath(); c.moveTo(-dx,-dy); c.lineTo(dx,dy); c.stroke();
  c.strokeStyle=COL.mirrorEdge; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(-dx,-dy); c.lineTo(dx,dy); c.stroke();
  c.restore();
}

function drawWallOn(c, r, cc, COL){
  const x=pad+cc*cellPx, y=pad+r*cellPx;
  const inset=cellPx*0.12;
  c.fillStyle=COL.wall;
  roundRect(c, x+inset, y+inset, cellPx-inset*2, cellPx-inset*2, 4); c.fill();
  c.strokeStyle=COL.wallEdge; c.lineWidth=1;
  roundRect(c, x+inset, y+inset, cellPx-inset*2, cellPx-inset*2, 4); c.stroke();
}

/* ---- pointer → cell ---- */
function cellFromEvent(e){
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left);
  const y = (e.clientY - rect.top);
  const c = Math.floor((x - pad)/cellPx);
  const r = Math.floor((y - pad)/cellPx);
  if (r<0||r>=state.N||c<0||c>=state.N) return null;
  return { r, c };
}

/* ---- placement rules: empty → '/' → '\' → empty ; can't place on emitter,
        target or a fixed wall cell ---- */
function isLockedCell(r,c){
  const em = state.board.emitter;
  if (r===em.r && c===em.c) return true;
  for (const t of state.board.targets) if (t.r===r && t.c===c) return true;
  if (state.board.cells[r*state.N+c]==='#') return true; // fixed wall
  return false;
}

function clickCell(r,c){
  if (state.won || state.showingSolution) return;
  if (isLockedCell(r,c)) { flashCaption("that cell holds a sensor or the emitter — place mirrors on empty cells."); return; }
  const idx=r*state.N+c;
  const cur=state.player[idx];
  // cycle: '' → '/' → '\' → ''
  let next;
  if (cur==='') next='/';
  else if (cur==='/') next='\\';
  else next='';
  // budget guard: placing a NEW mirror (from empty) requires a free token
  if (cur==='' && next!=='' && placedCount() >= state.board.budget){
    flashCaption("out of mirror tokens — rotate or remove a placed mirror, or the budget is "+state.board.budget+".");
    return;
  }
  state.player[idx]=next;
  state.moves++;
  draw();
  updateStats();
  checkWin();
}
function placedCount(){
  let n=0; for (const m of state.player) if (m==='/'||m==='\\') n++; return n;
}

/* ---- win check ---- */
function checkWin(){
  if (state.won) return;
  const chk = countLit({ N:state.N, cells:liveCells(), emitter:state.board.emitter }, state.board.targets);
  if (chk.allLit){
    state.won = true;
    boardOuter.classList.add('won');
    draw();
    const used = placedCount();
    const clean = used <= state.board.budget;
    verdict.innerHTML =
      `<span>solved — <span class="name">every sensor lit</span></span>` +
      `<span class="small">${used} mirror${used===1?'':'s'} placed · ${state.moves} move${state.moves===1?'':'s'} · seed ${state.board.seed}</span>`;
    verdict.classList.add('show');
    safeSet('ws:best:mirror-maze', state.N);
    if (used <= state.board.budget) safeSet('ws:flag:mirror-maze-clean', Date.now());
    // Feat of Light — earned ONLY on a genuine player solve (mirrors they placed),
    // never via "Show solution" (that path is checkWinForSolutionPreview, untouched).
    earnFeat('maze', 'Solved the maze');
  }
}

/* ---- show / hide reference solution ---- */
function showSolution(){
  if (state.showingSolution){ // toggle off → restore player attempt? simplest: clear to player layer
    state.showingSolution=false;
    $('solveBtn').textContent='Show solution';
    draw(); updateStats(); updateCaption();
    return;
  }
  // overlay the reference solution onto the player layer (animated reveal).
  state.showingSolution=true;
  $('solveBtn').textContent='Hide solution';
  // snapshot then animate placing the solution mirrors one by one
  const sol = state.board.solution.slice();
  // start from a CLEARED board so the reference is shown cleanly
  state.player = new Array(state.N*state.N).fill('');
  draw(); updateStats();
  let i=0;
  const stepMs = 260;
  function place(){
    if (!state.showingSolution) return;       // toggled off mid-animation
    if (i>=sol.length){
      // final: confirm it lights everything (it must, by construction)
      checkWinForSolutionPreview();
      updateCaption();
      return;
    }
    const m=sol[i++];
    state.player[m.r*state.N+m.c]=m.char;
    draw(); updateStats();
    setTimeout(place, stepMs);
  }
  setTimeout(place, stepMs);
}
function checkWinForSolutionPreview(){
  const chk = countLit({ N:state.N, cells:liveCells(), emitter:state.board.emitter }, state.board.targets);
  if (chk.allLit && !state.won){
    boardOuter.classList.add('won');
    draw();
    verdict.innerHTML =
      `<span>reference route — <span class="name">all sensors lit</span></span>` +
      `<span class="small">the dealer's ${state.board.budget}-mirror solution · seed ${state.board.seed}</span>`;
    verdict.classList.add('show');
  }
}

/* ---- clear board (keep puzzle) ---- */
function clearBoard(){
  state.player = new Array(state.N*state.N).fill('');
  state.won=false; state.moves=0; state.showingSolution=false;
  $('solveBtn').textContent='Show solution';
  boardOuter.classList.remove('won');
  verdict.classList.remove('show'); verdict.innerHTML="";
  draw(); updateStats(); updateCaption();
}

/* ---- stats + caption ---- */
function updateStats(){
  const placed=placedCount();
  const sM=$('statMirrors'), sL=$('statLit'), sMv=$('statMoves');
  sM.textContent = placed + " / " + state.board.budget;
  sM.classList.toggle('warn', placed>state.board.budget);
  const chk = countLit({ N:state.N, cells:liveCells(), emitter:state.board.emitter }, state.board.targets);
  sL.textContent = chk.lit + " / " + chk.total;
  sMv.textContent = state.moves;
}
let capTimer=null;
function updateCaption(){
  const b=state.board;
  caption.innerHTML =
    `A <b>${state.N}×${state.N}</b> hall, <b>provably solvable</b> — derived from a working light-route before it reached you. ` +
    `Route the laser through all <span class="mono">${b.targets.length}</span> sensors using <span class="mono">${b.budget}</span> mirror${b.budget===1?'':'s'}. ` +
    `Click a cell to place <span class="mono">/</span>, again to flip to <span class="mono">\\</span>, again to remove.`;
}
function flashCaption(msg){
  caption.innerHTML=`<b>${msg}</b>`;
  if(capTimer) clearTimeout(capTimer);
  capTimer=setTimeout(updateCaption, 2800);
}

/* ---- 2× PNG export — re-render crisply offscreen via the shared renderer ---- */
function exportPNG(){
  const N=state.N;
  const scale=2;
  const px = N*cellPx + pad*2;
  const off=document.createElement('canvas');
  off.width=Math.round(px*scale); off.height=Math.round(px*scale);
  const octx=off.getContext('2d');
  drawScene(octx, scale);
  const finish=(url)=>{ const a=document.createElement('a'); a.href=url; a.download='mirror-maze-'+state.board.seed+'.png'; document.body.appendChild(a); a.click(); a.remove(); };
  if(off.toBlob){ off.toBlob(b=>{ const u=URL.createObjectURL(b); finish(u); setTimeout(()=>URL.revokeObjectURL(u),4000); },'image/png'); }
  else finish(off.toDataURL('image/png'));
}

/* The single source-of-truth scene renderer, parameterised by context + scale.
   The live canvas calls drawScene(ctx, dpr); PNG export calls drawScene(octx, 2). */
function drawScene(c, scale){
  const N=state.N;
  const COL = readColors();
  c.setTransform(scale,0,0,scale,0,0);
  const px = N*cellPx + pad*2;
  // backing fill (so PNG isn't transparent) + rounded board panel
  c.clearRect(0,0,px,px);
  roundRect(c, 0.5,0.5, px-1,px-1, 12); c.fillStyle=COL.grid; c.fill();
  // grid lines
  c.lineWidth=1; c.strokeStyle=COL.edge; c.beginPath();
  for(let i=0;i<=N;i++){ const x=pad+i*cellPx,y=pad+i*cellPx;
    c.moveTo(x,pad); c.lineTo(x,pad+N*cellPx); c.moveTo(pad,y); c.lineTo(pad+N*cellPx,y); }
  c.stroke();
  c.lineWidth=1.5; c.strokeStyle=COL.edgeM; c.strokeRect(pad,pad,N*cellPx,N*cellPx);
  // beam (under the pieces), then pieces
  const cells=liveCells();
  const tr=traceBeam({N,cells,emitter:state.board.emitter});
  drawBeamOn(c,tr,COL);
  drawEmitterOn(c,state.board.emitter,COL);
  for(const t of state.board.targets) drawTargetOn(c,t,tr.visited.has(t.r+','+t.c),COL);
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){ if(cells[r*N+cc]==='#') drawWallOn(c,r,cc,COL); }
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){ const m=cells[r*N+cc]; if(m==='/'||m==='\\') drawMirrorOn(c,r,cc,m,COL); }
}

/* ----------------------------- wiring ----------------------------------- */
cv.addEventListener('click', e=>{
  const cell = cellFromEvent(e);
  if (cell) clickCell(cell.r, cell.c);
});
// right-click on a cell flips toward '\' directly (and prevents the menu)
cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const cell = cellFromEvent(e);
  if (!cell || state.won || state.showingSolution) return;
  if (isLockedCell(cell.r, cell.c)) return;
  const idx=cell.r*state.N+cell.c;
  const cur=state.player[idx];
  // right-click: empty→'\', '\'→'/', '/'→empty (reverse cycle)
  let next;
  if (cur==='') next='\\';
  else if (cur==='\\') next='/';
  else next='';
  if (cur==='' && next!=='' && placedCount() >= state.board.budget){
    flashCaption("out of mirror tokens — the budget is "+state.board.budget+".");
    return;
  }
  state.player[idx]=next; state.moves++;
  draw(); updateStats(); checkWin();
});

$('sizeSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.N = +b.dataset.size;
  newPuzzle(state.seed || randomSeed());
});
$('skinSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#skinSeg button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.skin = b.dataset.skin;
  document.body.dataset.skin = state.skin;   // PURELY cosmetic — never re-rolls the puzzle
  draw();                                     // re-read CSS vars, repaint same board
});
$('diceBtn').addEventListener('click', ()=> newPuzzle(randomSeed()));
$('newBtn').addEventListener('click', ()=> newPuzzle(randomSeed()));
$('solveBtn').addEventListener('click', showSolution);
$('resetBtn').addEventListener('click', clearBoard);
$('pngBtn').addEventListener('click', exportPNG);
seedInput.addEventListener('change', ()=>{
  const s = seedInput.value.trim();
  if (s) newPuzzle(s);
});
seedInput.addEventListener('keydown', e=>{ if(e.key==='Enter') seedInput.blur(); });

/* keyboard: n = new, r = reset/clear, s = show solution */
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='n'||e.key==='N') newPuzzle(randomSeed());
  else if (e.key==='r'||e.key==='R') clearBoard();
  else if (e.key==='s'||e.key==='S') showSolution();
});

window.addEventListener('resize', ()=>{
  const d = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  if (d!==dpr){ resizeCanvas(); draw(); }
});

/* ----------------------------- boot ------------------------------------- */
(function boot(){
  // self-test FIRST (workshop tradition); chip reflects the result.
  let st;
  try{ st = runSelfTest(); }
  catch(err){ console.error('[Mirror Maze] self-test threw', err); st={passed:0,total:5,allPass:false}; }
  const chip = $('selftest'), txt = $('stText');
  if (st.allPass){
    chip.classList.add('ok');
    txt.textContent = `verified — ${st.passed}/${st.total} ✓`;
  } else {
    chip.classList.add('bad');
    txt.textContent = `self-test ${st.passed}/${st.total} — see console`;
  }

  // breadcrumb (guarded) — REQUIRED exact key
  try{ var k='ws:seen:mirror-maze'; if(!localStorage.getItem(k)) localStorage.setItem(k,String(Date.now())); }catch(e){}

  // reflect any previously-earned Feat of Light in the goal chip
  initFeatChip('maze');

  newPuzzle(randomSeed());
  console.log('[Mirror Maze] ready. seed:', state.seed, 'size:', state.N);
})();
</script>
