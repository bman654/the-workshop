<!DOCTYPE html>
<!-- forged cycle #132 -->
<!-- THE PATRON'S MEDALLION OF PERSEVERANCE — an honor awarded to the makers of this manor
     for four cycles' refusal to lay down their tools until THE CLIMB was worthy of the Estate:
     #115 (the girder ascent struck) · #122 (the root-fix, green core true) ·
     #125 (the dt-tween, the feel proved) · #129 (the honest arc, the climb made true).
     A struck-metal reliquary: a dark coined disc whose rim, bevel and reeded edge are lit from a
     real height-map + surface normals (so the dark disc reads as STRUCK, not a glowing CSS card),
     bearing an inlaid-neon relief of The Climb in the game's own primitives + palette.
     Lives beside the maker records in ledger/. NOT linked from the deployed estate, arcade or nav.
     Self-contained: HTML + Canvas2D + a thin SVG/CSS frame. No deps. Opens by double-click. No network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Patron's Medallion of Perseverance</title>
<style>
  /* The Climb's OWN constants — the only palette permitted here. */
  :root{
    --accent:   #ff7a3d;   /* girder orange */
    --accent2:  #37d6ff;   /* ladder cyan   */
    --warn:     #ff2e88;   /* barrel pink   */
    --bg:       #06040c;   /* the void      */
    --gold:     #ffd24d;   /* struck gold   */
    --goal:     #39ff9e;   /* the win green */
    --player:   #ffe7cf;   /* the climber   */
    --incise:   #1a0f03;   /* dark-incised  */
    --girderEdge:#ffc08a;
    --girderGlow:#ff6a1d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    /* a faint radial vignette so the disc floats in the dark */
    background-image:
      radial-gradient(900px 760px at 50% 44%, #0c0816 0%, #08050e 52%, #06040c 100%);
    color:var(--player);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden; cursor:default;
    -webkit-user-select:none; user-select:none;
  }

  /* the whole jewel hangs from a faceted ring; the wrap is what we 3D-tilt */
  #scene{
    position:relative;
    perspective:1400px;
    display:flex; flex-direction:column; align-items:center;
  }
  #tilt{
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(0deg) rotateY(0deg);
    transition:transform .12s cubic-bezier(.2,.7,.2,1);
    will-change:transform;
  }

  /* ── the suspension ring (Explorer 1 graft a): a faceted gold ring the disc hangs through ── */
  .ring-wrap{ display:flex; flex-direction:column; align-items:center; }
  .ring{ display:block; }

  /* ── the struck disc ── */
  #discWrap{
    position:relative; width:520px; height:520px; margin-top:-14px;
    filter:drop-shadow(0 22px 40px rgba(0,0,0,.7));
  }
  #disc{ display:block; width:520px; height:520px; }

  /* ── the exergue line (Explorer 1 graft b): a single struck caption below the disc ── */
  .exergue{
    margin-top:18px; text-align:center;
    font-size:10.5px; letter-spacing:.42em; text-transform:uppercase;
    color:rgba(255,210,77,.62);
    text-shadow:0 1px 0 #1a0f03;
    display:flex; align-items:center; gap:.7em;
  }
  .exergue .mark{ color:rgba(255,210,77,.8); font-size:12px; transform:translateY(.5px); }

  /* the hover legend that surfaces in the rim margin */
  #legend{
    position:absolute; left:50%; bottom:-44px; transform:translateX(-50%);
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(255,210,77,.0); text-shadow:0 1px 0 #1a0f03, 0 0 1px #1a0f03;
    white-space:nowrap; pointer-events:none;
    transition:color .35s ease, opacity .35s ease; opacity:0;
    max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  #legend.on{ color:rgba(255,210,77,.78); opacity:1; }
  #legend .dim{ color:rgba(255,210,77,.42); }

  @media (max-width:560px){
    #discWrap, #disc{ width:88vw; height:88vw; }
  }
</style>
</head>
<body>
  <div id="scene">
    <div id="tilt">
      <div class="ring-wrap">
        <!-- faceted gold suspension ring: a hint of ceremony — the medal is WORN, not floating -->
        <svg class="ring" width="64" height="58" viewBox="0 0 64 58" aria-hidden="true">
          <defs>
            <linearGradient id="gring" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0"   stop-color="#ffe9a8"/>
              <stop offset=".34" stop-color="#ffd24d"/>
              <stop offset=".62" stop-color="#a8841f"/>
              <stop offset="1"   stop-color="#6b531a"/>
            </linearGradient>
            <linearGradient id="gfacet" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff4cf"/>
              <stop offset="1" stop-color="#8a6a18"/>
            </linearGradient>
          </defs>
          <!-- the torus seen from the front: an annulus with faceted highlights -->
          <circle cx="32" cy="30" r="20" fill="none" stroke="url(#gring)" stroke-width="8"/>
          <circle cx="32" cy="30" r="20" fill="none" stroke="#3a2c0a" stroke-width="8" stroke-dasharray="2.4 6.0" opacity=".55"/>
          <!-- bright facet sweeping the upper-left (catches the page light) -->
          <path d="M18 18 A20 20 0 0 1 46 18" fill="none" stroke="url(#gfacet)" stroke-width="3.4" stroke-linecap="round" opacity=".9"/>
          <!-- the bail bridging ring to disc -->
          <rect x="28" y="44" width="8" height="12" rx="3" fill="url(#gring)" stroke="#3a2c0a" stroke-width="1"/>
        </svg>
      </div>
      <div id="discWrap">
        <canvas id="disc" width="1040" height="1040"></canvas>
        <div id="legend"></div>
      </div>
    </div>
    <div class="exergue">
      <span class="mark">✶</span><span>Awarded by the Patron</span><span class="mark">✶</span>
    </div>
  </div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════════════════════
   THE PATRON'S MEDALLION OF PERSEVERANCE  ·  forged cycle #132
   A struck-metal reliquary. The body is a NEON RELIQUARY (Explorer 2): a dark coined disc with
   an inlaid channel of The Climb's own light. Grafted with:
     • Explorer 0 — a real HEIGHT MAP + surface NORMALS drive the rim/bevel/reeded-edge relief
       and a tilt-coupled light, so the dark disc reads STRUCK, not as a glowing card.
     • Explorer 1 — two restrained frame elements: a faceted gold suspension RING (SVG, above)
       and a single struck EXERGUE line (below). No heraldry, no ribbon, no wreath.
   Palette: The Climb's constants ONLY. Voice: ui-monospace, uppercase, letter-spaced. No math
   claim — a crafted honor owes no proof; the only truth obligation is the four cycles + essences.
   ════════════════════════════════════════════════════════════════════════════════════════ */

const PAL = {
  accent:'#ff7a3d', accent2:'#37d6ff', warn:'#ff2e88', bg:'#06040c', gold:'#ffd24d',
  goal:'#39ff9e', player:'#ffe7cf', incise:'#1a0f03', girderEdge:'#ffc08a', girderGlow:'#ff6a1d'
};
const TAU = Math.PI*2;
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv  = document.getElementById('disc');
const ctx = cv.getContext('2d');
const DPR = 2;                         // canvas backing store is 2× the 520px CSS box
const N   = cv.width;                  // 1040 — the working pixel field (square)
const C   = N/2;                       // center
const R    = N*0.486;                  // outer disc radius (px)
const legendEl = document.getElementById('legend');

function hexToRgba(hex,a){
  const h=hex.replace('#',''); const n=parseInt(h,16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

/* ── the four honored cycles: gem color + the engraved cycle number + the TRUE essence ───────
   (verified against git history this cycle — not invented):
     #115 Bloom The Climb — the Arcade's 21st cabinet
     #122 Fix The Climb at the root — 5 broken-physics counts cleared, self-test hardened 5→10
     #125 Fix The Climb's FEEL — dt-tween for smooth human-paced motion
     #129 Re-tune the jump arc + bonus — the climb made true                                   */
const JEWELS = [
  { cyc:115, ang:-Math.PI/2, color:PAL.accent,  glow:PAL.girderGlow, essence:'THE GIRDER ASCENT STRUCK — THE 21ST CABINET' },
  { cyc:122, ang: 0,          color:PAL.accent2, glow:'#1aa9d6',      essence:'FIVE BROKEN COUNTS CLEARED AT THE ROOT — THE GREEN CORE NO LONGER LIES' },
  { cyc:129, ang: Math.PI/2,  color:PAL.goal,    glow:'#1bbf76',      essence:'AN HONEST JUMP-ARC, AN ATTAINABLE BONUS — THE CLIMB MADE TRUE' },
  { cyc:125, ang: Math.PI,    color:PAL.gold,    glow:'#b8911f',      essence:'THE DT-TWEEN — A HELD ARROW PROVED THE FEEL' },
];
// jewel socket centers ring the inner rim (just inside the bevel)
const JEWEL_RADIUS = R*0.80;
const JEWEL_BEAD_R = N*0.025;

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE HEIGHT FIELD  (the load-bearing graft, Explorer 0)
   One offscreen Float32 height map for the disc PROFILE — sunken field floor, ramped wall, a
   raised polished rim, the reeded edge — plus the jewel sockets. Blur it so edges become rounded
   bevels (not cliffs), compute surface NORMALS once via Sobel, and an ambient-occlusion-ish band.
   Per frame we re-light ONLY the small rim+bevel+edge region with a tilt-coupled light; the field
   floor stays dark on purpose, so the lit work is cheap.
   ════════════════════════════════════════════════════════════════════════════════════════ */

// height profile as a function of normalized radius rr = dist/R  (0=center .. 1=edge .. >1 outside)
//   field floor (deep)  → bevel ramp up  → polished raised rim → reeded edge teeth → fall to nothing
const N_TEETH = 140;
function profileHeight(rr, theta){
  if (rr > 1.0) return 0;                                 // outside the coin
  // base field: a broad shallow dished floor (the dominant surface) — the relief + legend live
  // here. Lowest in the middle so the relief sits in a basin; this stays DARK on purpose.
  if (rr < 0.84){
    const dish = -0.14 * (1 - Math.abs(rr-0.42)/0.42);
    return 0.08 + dish;                                   // ~ -0.06 .. 0.08
  }
  // bevel ramp: a SHORT climb from the field up to the thin raised rim, 0.84 .. 0.88
  if (rr < 0.88){
    const t = (rr-0.84)/0.04;
    return 0.08 + t*0.66;                                 // ramps to ~0.74
  }
  // a THIN polished raised rim plateau 0.88 .. 0.93 (a band, not a wide bezel)
  if (rr < 0.93){
    return 0.74;
  }
  // reeded / milled edge: N_TEETH short radial ticks 0.93 .. 1.0
  const teeth = (Math.cos(theta*N_TEETH) * 0.5 + 0.5);    // 0..1 ridge profile
  const fall  = 1 - (rr-0.93)/0.07;                       // taper to 0 at the very edge
  return (0.52 + teeth*0.30) * Math.max(0,fall);
}

// build the field
const H  = new Float32Array(N*N);      // blurred height
const NX = new Float32Array(N*N);      // normal x
const NY = new Float32Array(N*N);      // normal y
const NZ = new Float32Array(N*N);      // normal z
const MASK = new Uint8Array(N*N);      // 1 = inside the coin
// region tags so per-frame lighting touches only the metal band, never the whole field
const REEDED = 1, RIM = 2, BEVEL = 3, FIELD = 4, SOCKET = 5;
const REGION = new Uint8Array(N*N);

(function buildField(){
  const raw = new Float32Array(N*N);
  for (let y=0;y<N;y++){
    const dy=y-C;
    for (let x=0;x<N;x++){
      const dx=x-C; const i=y*N+x;
      const dist=Math.hypot(dx,dy); const rr=dist/R;
      if (rr>1.0){ raw[i]=0; MASK[i]=0; REGION[i]=0; continue; }
      MASK[i]=1;
      const theta=Math.atan2(dy,dx);
      let h=profileHeight(rr,theta);
      // jewel sockets: carve a small spherical dimple at each cardinal so the bead sits SET, not pasted
      for (const J of JEWELS){
        const jx=C+Math.cos(J.ang)*JEWEL_RADIUS, jy=C+Math.sin(J.ang)*JEWEL_RADIUS;
        const jd=Math.hypot(x-jx,y-jy);
        const sr=JEWEL_BEAD_R*1.7;
        if (jd<sr){ const t=jd/sr; h -= 0.42*(1-t*t); REGION[i]=SOCKET; }
      }
      raw[i]=h;
      // tag the band region (socket already tagged above wins)
      if (REGION[i]!==SOCKET){
        if      (rr>=0.93) REGION[i]=REEDED;
        else if (rr>=0.88) REGION[i]=RIM;
        else if (rr>=0.84) REGION[i]=BEVEL;
        else               REGION[i]=FIELD;
      }
    }
  }
  // separable box blur (~3px radius, two passes ≈ gaussian) so cliffs become rounded bevels
  const BR=3;
  function blurPass(src,dst,horiz){
    const win=BR*2+1;
    for (let y=0;y<N;y++){
      for (let x=0;x<N;x++){
        let sum=0,cnt=0;
        for (let k=-BR;k<=BR;k++){
          const xx=horiz?x+k:x, yy=horiz?y:y+k;
          if (xx<0||xx>=N||yy<0||yy>=N) continue;
          sum+=src[yy*N+xx]; cnt++;
        }
        dst[y*N+x]=sum/cnt;
      }
    }
  }
  const tmp=new Float32Array(N*N);
  blurPass(raw,tmp,true);
  blurPass(tmp,H,false);
  blurPass(H,tmp,true);
  blurPass(tmp,H,false);

  // surface normals via Sobel on the height field. zScale tunes relief steepness.
  const Z=2.6;
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const i=y*N+x;
      if (!MASK[i]){ NX[i]=0;NY[i]=0;NZ[i]=1; continue; }
      const xm=x>0?x-1:x, xp=x<N-1?x+1:x, ym=y>0?y-1:y, yp=y<N-1?y+1:y;
      const gx = (H[y*N+xp]-H[y*N+xm]);
      const gy = (H[yp*N+x]-H[ym*N+x]);
      let nx=-gx*Z, ny=-gy*Z, nz=1;
      const len=Math.hypot(nx,ny,nz)||1;
      NX[i]=nx/len; NY[i]=ny/len; NZ[i]=nz/len;
    }
  }
})();

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE STRUCK BASE LAYER (rendered once → an offscreen canvas; re-lit only on tilt step)
   We paint: the dark struck void (radial gradient), then the tilt-lit metal band derived from
   the normals (reeded teeth sparkle tooth-by-tooth, the bevel's bright/shadow arcs, the rim).
   ════════════════════════════════════════════════════════════════════════════════════════ */
const baseCv = document.createElement('canvas'); baseCv.width=N; baseCv.height=N;
const baseCtx = baseCv.getContext('2d');
const baseImg = baseCtx.createImageData(N,N);

// the void: dark radial gradient, drawn straight to the base image data (cheap, fixed)
(function paintVoid(){
  const d=baseImg.data;
  const cInner=[0x0d,0x0a,0x16], cRim=[0x06,0x04,0x0c];
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const i=y*N+x; const o=i*4;
      if (!MASK[i]){ d[o]=0;d[o+1]=0;d[o+2]=0;d[o+3]=0; continue; }
      const rr=Math.hypot(x-C,y-C)/R;
      const t=Math.min(1,rr/0.95);
      d[o]  =cInner[0]+(cRim[0]-cInner[0])*t;
      d[o+1]=cInner[1]+(cRim[1]-cInner[1])*t;
      d[o+2]=cInner[2]+(cRim[2]-cInner[2])*t;
      d[o+3]=255;
    }
  }
})();

// light direction is set by tilt; relight() writes only the metal band over the void base.
let LX=0.45, LY=-0.62, LZ=0.64;        // current light dir (normalized-ish)
function relight(){
  const d=baseImg.data;
  // normalize light
  const ll=Math.hypot(LX,LY,LZ)||1; const lx=LX/ll, ly=LY/ll, lz=LZ/ll;
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const i=y*N+x; const reg=REGION[i];
      if (reg!==REEDED && reg!==RIM && reg!==BEVEL) continue;  // ONLY the metal band — cheap
      const o=i*4;
      // diffuse, but RAISED to a power so only faces squarely toward the light brighten —
      // a struck medal is mostly dark metal with thin catch-lights, NOT a glowing gold ring.
      const ndlRaw = NX[i]*lx + NY[i]*ly + NZ[i]*lz;
      const ndl = Math.pow(Math.max(0, ndlRaw), 2.2);
      // specular: reflect light around the normal, dot with the view (0,0,1)
      const dot = ndlRaw;
      const rz=2*dot*NZ[i]-lz;
      const spec = Math.pow(Math.max(0,rz), 30);
      // gold metal: a DARK struck tone + restrained diffuse + a sharp spec glint.
      // teeth glint hardest (they're the one place metal reads as metal). Keep the base
      // tones low so the disc reads STRUCK/dark, with light catching only the high faces.
      let base, kd, ks;
      if (reg===REEDED){ base=[0x2a,0x22,0x0d]; kd=1.0; ks=2.4; }   // dim gold milled edge
      else if (reg===RIM){ base=[0x18,0x14,0x09]; kd=0.85; ks=1.6; } // polished raised rim
      else { base=[0x10,0x0c,0x07]; kd=0.7; ks=0.7; }               // bevel ramp (mostly dark)
      const litR = base[0] + 195*kd*ndl + 235*ks*spec;
      const litG = base[1] + 150*kd*ndl + 205*ks*spec;
      const litB = base[2] +  52*kd*ndl + 130*ks*spec;
      d[o]  =Math.min(255,litR);
      d[o+1]=Math.min(255,litG);
      d[o+2]=Math.min(255,litB);
      d[o+3]=255;
    }
  }
  baseCtx.putImageData(baseImg,0,0);
  // a soft inner-rim bevel arc on top (bright-side / shadow-side) so the disc reads coined.
  // these are cheap vector arcs keyed to the same light direction.
  baseCtx.save();
  const lightAng=Math.atan2(ly,lx);
  // bright arc faces the light; shadow arc opposes
  baseCtx.lineWidth=N*0.009;
  baseCtx.beginPath();
  baseCtx.arc(C,C,R*0.86, lightAng-1.4, lightAng+1.4);
  baseCtx.strokeStyle=hexToRgba(PAL.gold,0.18);
  baseCtx.stroke();
  baseCtx.beginPath();
  baseCtx.arc(C,C,R*0.86, lightAng+TAU/2-1.4, lightAng+TAU/2+1.4);
  baseCtx.strokeStyle='rgba(0,0,0,0.5)';
  baseCtx.stroke();
  baseCtx.restore();
}
relight();

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE LEGEND — struck engraved text on circular paths (NOT neon: the deliberate contrast).
   Each glyph drawn twice: a dark-incised pass (+1px down-right) under a dim raised-gold pass.
   Catches the rim light; does NOT bloom. Drawn once onto an offscreen layer (it never animates).
   ════════════════════════════════════════════════════════════════════════════════════════ */
const textCv=document.createElement('canvas'); textCv.width=N; textCv.height=N;
const tctx=textCv.getContext('2d');
function drawArcText(c, str, radius, midAng, faceOut, sizePx, spacing){
  // lay characters along a circular arc centered on midAng. faceOut=true → upright reading
  // along the top; for the bottom arc we flip so it reads correctly.
  c.save();
  c.font=`700 ${sizePx}px ui-monospace, Menlo, monospace`;
  c.textAlign='center'; c.textBaseline='middle';
  const chars=[...str];
  // total angular span from per-char width
  let totalArc=0;
  const widths=chars.map(ch=>{ const w=c.measureText(ch).width+spacing; totalArc+=w/radius; return w; });
  let a = midAng - (faceOut ? totalArc/2 : -totalArc/2);
  for (let k=0;k<chars.length;k++){
    const w=widths[k]; const step=w/radius;
    const ca = a + (faceOut?1:-1)*step/2;
    const x=C+Math.cos(ca)*radius, y=C+Math.sin(ca)*radius;
    c.save();
    c.translate(x,y);
    c.rotate(ca + (faceOut?Math.PI/2:-Math.PI/2));
    // a dark incised channel UNDER the glyph (deeper + slightly spread) so the engraving reads
    // against the lit rim — a struck legend is a shadow trough with a raised gold ridge in it.
    c.fillStyle='rgba(8,5,2,0.92)';
    c.fillText(chars[k],  1.4,  1.4);
    c.fillText(chars[k], -0.6,  1.4);
    c.fillText(chars[k],  1.4, -0.6);
    // the raised gold ridge (bright, catches the rim light; no glow/bloom)
    c.fillStyle=hexToRgba('#ffe7a0',0.92);
    c.fillText(chars[k], 0, 0);
    c.restore();
    a += (faceOut?1:-1)*step;
  }
  c.restore();
}
function paintLegend(){
  tctx.clearRect(0,0,N,N);
  tctx.shadowBlur=0;
  // upper arc — reads left→right across the top
  drawArcText(tctx, '★ PATRON’S MEDALLION OF PERSEVERANCE ★', R*0.905, -Math.PI/2, true, N*0.026, N*0.0035);
  // lower arc — reads left→right across the bottom (flipped)
  drawArcText(tctx, 'THE CLIMB · CYCLES 115 · 122 · 125 · 129', R*0.905, Math.PI/2, false, N*0.024, N*0.0035);
  // the four jewel cycle numbers, micro-engraved beneath each socket
  tctx.save();
  tctx.font=`700 ${N*0.020}px ui-monospace, Menlo, monospace`;
  tctx.textAlign='center'; tctx.textBaseline='middle';
  for (const J of JEWELS){
    const jx=C+Math.cos(J.ang)*JEWEL_RADIUS, jy=C+Math.sin(J.ang)*JEWEL_RADIUS;
    // place the number just outward from the bead toward the rim
    const ox=Math.cos(J.ang)*(JEWEL_BEAD_R+N*0.026), oy=Math.sin(J.ang)*(JEWEL_BEAD_R+N*0.026);
    const lx=jx+ox, ly=jy+oy;
    tctx.fillStyle='rgba(8,5,2,0.92)'; tctx.fillText('#'+J.cyc, lx+1.2, ly+1.2);
    tctx.fillStyle=hexToRgba('#ffe7a0',0.9); tctx.fillText('#'+J.cyc, lx, ly);
  }
  tctx.restore();
}
paintLegend();

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE RELIEF — The Climb as inlaid neon, in the game's OWN primitives + palette.
   A vertical micro-tableau: 3 slanted girders (linear-gradient beams w/ tube-bloom), 2 cyan
   ladders (round-cap strokes, 3 rungs), the climber mid-ascent, the captive's basket at the
   summit (gold cradle on a goal-green platform top), one warn-pink barrel tumbling. The relief
   reads as a CHANNEL OF LIGHT set into the black metal — cloisonné/circuit.
   Drawn live (it animates) in disc-local coords into the field basin.
   ════════════════════════════════════════════════════════════════════════════════════════ */

// relief layout (disc-local px, origin at center C,C). Kept to a readable tableau.
const RU = N*0.5;                      // relief unit scale base
function drawClimbRelief(time){
  ctx.save();
  ctx.translate(C,C);
  // clip the relief to the sunken field basin so light never spills onto the metal rim
  ctx.beginPath(); ctx.arc(0,0,R*0.70,0,TAU); ctx.clip();

  const cell=N*0.092;                  // a "cell" comparable to the game's grid
  const beamThk=cell*0.34;
  // three slanted girder tiers stacked vertically, alternating slant (the tower zig-zag)
  // y positions: bottom tier lowest, summit highest
  const tiers=[
    { y: cell*1.85, x0:-cell*1.7, x1: cell*1.7, slant: 0.16 },   // bottom girder (climber here)
    { y: cell*0.30, x0: cell*1.7, x1:-cell*1.7, slant:-0.16 },   // middle girder
    { y:-cell*1.30, x0:-cell*1.7, x1: cell*1.5, slant: 0.13 },   // upper girder (just below summit)
  ];
  const shimmer = REDUCED ? 1 : (0.82 + 0.18*Math.sin(time*0.00057));   // ~3.5s neon breathing

  // GIRDERS — linear-gradient beams with tube-bloom (girderEdge→girder→girderGlow + shadow)
  function girder(t, idx){
    const len=Math.hypot(t.x1-t.x0, (t.y+ (t.x1-t.x0)*t.slant) - t.y);
    ctx.save();
    const ph = shimmer * (0.9 + 0.1*Math.sin(time*0.0006 + idx*1.3));
    const ya=t.y, yb=t.y + (t.x1-t.x0)*t.slant;
    const grad=ctx.createLinearGradient(0,Math.min(ya,yb)-beamThk, 0, Math.max(ya,yb)+beamThk);
    grad.addColorStop(0, PAL.girderEdge);
    grad.addColorStop(0.4, PAL.accent);
    grad.addColorStop(1, hexToRgba(PAL.girderGlow, 0.85));
    ctx.strokeStyle=grad; ctx.lineWidth=beamThk; ctx.lineCap='round';
    ctx.shadowBlur=14*ph; ctx.shadowColor=PAL.girderGlow;
    ctx.globalAlpha=ph;
    ctx.beginPath(); ctx.moveTo(t.x0,ya); ctx.lineTo(t.x1,yb); ctx.stroke();
    // rivet hatching for the same hand as the game's girder
    ctx.globalAlpha=ph*0.6; ctx.shadowBlur=0;
    ctx.strokeStyle=hexToRgba(PAL.incise,0.5); ctx.lineWidth=1.4;
    const steps=5;
    for (let s=1;s<steps;s++){
      const tt=s/steps; const gx=t.x0+(t.x1-t.x0)*tt; const gy=ya+(yb-ya)*tt;
      ctx.beginPath(); ctx.moveTo(gx-3,gy-beamThk*0.4); ctx.lineTo(gx+3,gy+beamThk*0.4); ctx.stroke();
    }
    ctx.restore();
  }
  tiers.forEach((t,i)=>girder(t,i));

  // SUMMIT PLATFORM — goal-green top edge (the win color) with the captive's basket
  (function summit(){
    const sy=-cell*2.05, sx0=-cell*1.3, sx1=cell*0.4;
    ctx.save();
    // platform beam (gold) with a goal-green top edge
    const g=ctx.createLinearGradient(0,sy-beamThk,0,sy+beamThk);
    g.addColorStop(0, PAL.goal); g.addColorStop(0.5, PAL.goal); g.addColorStop(1, hexToRgba(PAL.gold,0.8));
    ctx.strokeStyle=g; ctx.lineWidth=beamThk; ctx.lineCap='round';
    ctx.shadowBlur=16*shimmer; ctx.shadowColor=PAL.goal;
    ctx.beginPath(); ctx.moveTo(sx0,sy); ctx.lineTo(sx1,sy); ctx.stroke();
    // the captive's basket — a woven gold cradle on the platform
    const bx=sx0+cell*0.45, by=sy-cell*0.42, bw=cell*0.62, bh=cell*0.42;
    ctx.shadowBlur=10*shimmer; ctx.shadowColor=PAL.gold;
    ctx.strokeStyle=PAL.gold; ctx.lineWidth=2.2; ctx.lineCap='round';
    // cradle outline (a rounded trapezoid basket)
    ctx.beginPath();
    ctx.moveTo(bx-bw/2, by); ctx.lineTo(bx-bw/2*0.75, by+bh); ctx.lineTo(bx+bw/2*0.75, by+bh); ctx.lineTo(bx+bw/2, by);
    ctx.stroke();
    // woven verticals + a rim
    ctx.lineWidth=1.4;
    for (let k=-2;k<=2;k++){ const wx=bx+k*(bw/5); ctx.beginPath(); ctx.moveTo(wx,by); ctx.lineTo(wx*0.94+bx*0.06, by+bh); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(bx-bw/2-1,by); ctx.lineTo(bx+bw/2+1,by); ctx.stroke();
    ctx.restore();
  })();

  // LADDERS — two cyan ladders, round-cap strokes, 3 rungs (the drawLadder primitive)
  function ladder(lx, y0, y1){
    ctx.save();
    ctx.strokeStyle=PAL.accent2; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.shadowBlur=9*shimmer; ctx.shadowColor=PAL.accent2;
    const w=cell*0.46; const r1=lx-w/2, r2=lx+w/2;
    ctx.beginPath(); ctx.moveTo(r1,y0); ctx.lineTo(r1,y1); ctx.moveTo(r2,y0); ctx.lineTo(r2,y1); ctx.stroke();
    for (let i=0;i<3;i++){ const ry=y0+(y1-y0)*(0.2+i*0.3); ctx.beginPath(); ctx.moveTo(r1,ry); ctx.lineTo(r2,ry); ctx.stroke(); }
    ctx.restore();
  }
  // ladder run from bottom girder up to middle girder (the climber's run)
  ladder( cell*0.55, tiers[0].y - beamThk*0.5, tiers[1].y + beamThk*0.5);
  // ladder run from middle up toward upper girder
  ladder(-cell*0.55, tiers[1].y - beamThk*0.5, tiers[2].y + beamThk*0.5);

  // THE CLIMBER — mid-ascent on the lowest ladder (the game's climbing pose, arms up)
  (function climber(){
    const lx=cell*0.55;
    const climb = REDUCED ? 0.5 : (0.5 + 0.42*Math.sin(time*0.00045));   // rides up & down the lowest ladder
    const cy = (tiers[0].y - beamThk*0.5) + (tiers[1].y + beamThk*0.5 - (tiers[0].y - beamThk*0.5))*climb;
    const r=cell*0.30;
    const glowPulse = REDUCED ? 1 : (0.7+0.3*Math.sin(time*0.0009)); // slower beat than the shimmer
    ctx.save(); ctx.translate(lx,cy);
    ctx.shadowBlur=13*glowPulse; ctx.shadowColor=PAL.accent;  // playerGlow
    ctx.lineCap='round'; ctx.lineJoin='round';
    const HEAD=-r*1.95, SH=-r*1.45, HIP=-r*0.55;
    const stride=Math.sin(time*0.0024)*0.5;     // ladder stride
    ctx.strokeStyle=PAL.player; ctx.lineWidth=3.0;
    ctx.beginPath(); ctx.moveTo(0,SH); ctx.lineTo(0,HIP); ctx.stroke();       // torso
    ctx.lineWidth=2.6;                                                         // legs
    ctx.beginPath();
    ctx.moveTo(0,HIP); ctx.lineTo(-r*0.42+stride*r, 0);
    ctx.moveTo(0,HIP); ctx.lineTo( r*0.42-stride*r, 0);
    ctx.stroke();
    ctx.lineWidth=2.4;                                                         // arms up (climbing)
    ctx.beginPath();
    ctx.moveTo(0,SH); ctx.lineTo( r*0.55, SH-r*0.7);
    ctx.moveTo(0,SH); ctx.lineTo(-r*0.55, SH-r*0.7);
    ctx.stroke();
    ctx.fillStyle=PAL.player;                                                  // head
    ctx.beginPath(); ctx.arc(0,HEAD,r*0.45,0,TAU); ctx.fill();
    ctx.restore();
  })();

  // ONE warn-pink barrel-glyph tumbling down a girder (the threat overcome)
  (function barrel(){
    const t=tiers[1];
    const roll = REDUCED ? 0.4 : ((time*0.00018)%1);   // travels along the middle girder
    const bx=t.x0+(t.x1-t.x0)*roll;
    const by=t.y+(t.x1-t.x0)*t.slant*roll - beamThk*0.7;
    const r=cell*0.20;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(roll*TAU* (t.slant<0?-1:1));
    ctx.shadowBlur=11*shimmer; ctx.shadowColor=PAL.warn;
    ctx.strokeStyle=PAL.warn; ctx.lineWidth=2.0; ctx.globalAlpha=0.92;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.ellipse(0,0,r*0.45,r,0,0,TAU); ctx.stroke();          // stave
    ctx.beginPath(); ctx.moveTo(-r,-r*0.42); ctx.lineTo(r,-r*0.42); ctx.moveTo(-r,r*0.42); ctx.lineTo(r,r*0.42); ctx.stroke();
    ctx.restore();
  })();

  // ONE faint light-mote travelling up the ladder rungs + along the girders — the ascent that
  // never finishes = the perseverance. (frozen to a steady dim glow under reduced-motion)
  (function mote(){
    if (REDUCED) return;
    const loop=(time*0.00012)%1;
    // path: up the lowest ladder, across the middle girder, up the next ladder
    let mx,my;
    if (loop<0.4){ const t=loop/0.4; mx=cell*0.55; my=(tiers[0].y)+(tiers[1].y-tiers[0].y)*t; }
    else if (loop<0.6){ const t=(loop-0.4)/0.2; mx=cell*0.55+( -cell*0.55-cell*0.55)*t; my=tiers[1].y; }
    else { const t=(loop-0.6)/0.4; mx=-cell*0.55; my=(tiers[1].y)+(tiers[2].y-tiers[1].y)*t; }
    ctx.save();
    ctx.fillStyle=hexToRgba(PAL.player,0.85);
    ctx.shadowBlur=14; ctx.shadowColor=PAL.gold;
    ctx.beginPath(); ctx.arc(mx,my,N*0.006,0,TAU); ctx.fill();
    ctx.restore();
  })();

  ctx.restore();
}

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE JEWELS — four luminous emitting gem-nodes, one per honored cycle, in their sunken sockets.
   A radial-gradient bead (bright core → colored halo with shadowBlur). Hover flares it +
   surfaces its struck-metal essence line in the rim margin.
   ════════════════════════════════════════════════════════════════════════════════════════ */
let hoverIdx=-1;
function drawJewels(time){
  ctx.save();
  for (let k=0;k<JEWELS.length;k++){
    const J=JEWELS[k];
    const jx=C+Math.cos(J.ang)*JEWEL_RADIUS, jy=C+Math.sin(J.ang)*JEWEL_RADIUS;
    const flare = (k===hoverIdx) ? 1.55 : 1;
    const pulse = REDUCED ? 1 : (0.85+0.15*Math.sin(time*0.0011 + k*1.7));
    const r=JEWEL_BEAD_R*flare;
    // socket shadow ring (reads as set, deepened by the height-map dimple beneath)
    ctx.save();
    ctx.beginPath(); ctx.arc(jx,jy,r*1.5,0,TAU);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.shadowBlur=0; ctx.fill();
    ctx.restore();
    // the emitting bead
    ctx.save();
    ctx.shadowBlur=(22*flare)*pulse; ctx.shadowColor=J.color;
    const g=ctx.createRadialGradient(jx-r*0.3,jy-r*0.3,r*0.12, jx,jy,r);
    g.addColorStop(0,'#fff'); g.addColorStop(0.32,J.color); g.addColorStop(1,hexToRgba(J.glow,0.85));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(jx,jy,r,0,TAU); ctx.fill();
    // a tiny crisp specular catch-light so the bead reads as a polished gem
    ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(jx-r*0.34,jy-r*0.34,r*0.18,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ════════════════════════════════════════════════════════════════════════════════════════
   COMPOSITE + ANIMATION LOOP
   Per frame: blit the (re-lit) struck base → the engraved legend → the live relief → jewels.
   Re-lighting (the expensive normal pass over the metal band) runs ONLY when tilt/sway moves
   the light enough — not every frame.
   ════════════════════════════════════════════════════════════════════════════════════════ */
let lastLightKey='';
function maybeRelight(){
  // quantize the light dir; only recompute the metal band when it actually moved
  const key = `${Math.round(LX*40)},${Math.round(LY*40)},${Math.round(LZ*40)}`;
  if (key!==lastLightKey){ relight(); lastLightKey=key; }
}

function frame(time){
  maybeRelight();
  ctx.clearRect(0,0,N,N);
  ctx.drawImage(baseCv,0,0);    // the struck metal disc
  ctx.drawImage(textCv,0,0);    // the engraved legend (static)
  drawClimbRelief(time);        // the inlaid neon Climb (animated)
  drawJewels(time);             // the four gems (animated)
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE INTERACTION — tiltable. Pointer/touch applies a small CSS 3D rotate (≤8°) AND drives the
   tilt-coupled light over the height-map'd metal so the bright edge faces the light and teeth
   sparkle one-by-one. The neon relief shifts a few px against the tilt so the glow sits INSIDE a
   physical disc. Idle: a barely-there auto-sway. prefers-reduced-motion freezes the life.
   ════════════════════════════════════════════════════════════════════════════════════════ */
const tiltEl=document.getElementById('tilt');
const discWrap=document.getElementById('discWrap');
let targetRX=0, targetRY=0, curRX=0, curRY=0;
let pointerActive=false;

function applyTilt(nx,ny){   // nx,ny in -1..1 (fraction of the disc box from center)
  targetRY =  nx*8;          // rotateY follows horizontal
  targetRX = -ny*8;          // rotateX follows vertical
}
function lightFromTilt(rx,ry){
  // map the tilt to a light direction; up-light always faces the high edge
  LX = Math.sin(ry*Math.PI/180)*1.2 + 0.18;
  LY = -Math.sin(rx*Math.PI/180)*1.2 - 0.55;
  LZ = 0.7;
  // neon relief parallax: shift the relief a few px against the tilt (glow sits inside the disc)
  cv.style.transform = `translate(${(-ry*0.5).toFixed(2)}px, ${(rx*0.5).toFixed(2)}px)`;
}

function onMove(clientX, clientY){
  const r=discWrap.getBoundingClientRect();
  const nx=((clientX-r.left)/r.width -0.5)*2;
  const ny=((clientY-r.top )/r.height-0.5)*2;
  applyTilt(Math.max(-1,Math.min(1,nx)), Math.max(-1,Math.min(1,ny)));
  // jewel hover hit-test (in canvas px)
  const px=((clientX-r.left)/r.width)*N, py=((clientY-r.top)/r.height)*N;
  let hit=-1;
  for (let k=0;k<JEWELS.length;k++){
    const J=JEWELS[k];
    const jx=C+Math.cos(J.ang)*JEWEL_RADIUS, jy=C+Math.sin(J.ang)*JEWEL_RADIUS;
    if (Math.hypot(px-jx,py-jy) < JEWEL_BEAD_R*2.0){ hit=k; break; }
  }
  if (hit!==hoverIdx){
    hoverIdx=hit;
    if (hit>=0){
      legendEl.innerHTML = `<span class="dim">#${JEWELS[hit].cyc}</span>&nbsp;&nbsp;${JEWELS[hit].essence}`;
      legendEl.classList.add('on');
    } else {
      legendEl.classList.remove('on');
    }
  }
}

window.addEventListener('pointermove', e=>{ pointerActive=true; onMove(e.clientX,e.clientY); }, {passive:true});
window.addEventListener('pointerleave', ()=>{ pointerActive=false; hoverIdx=-1; legendEl.classList.remove('on'); });
window.addEventListener('touchmove', e=>{ if(e.touches[0]){ pointerActive=true; onMove(e.touches[0].clientX,e.touches[0].clientY);} }, {passive:true});

// guarded deviceorientation on phones (no-op if unavailable / not permitted)
if (window.DeviceOrientationEvent){
  window.addEventListener('deviceorientation', e=>{
    if (e.gamma==null && e.beta==null) return;
    const nx=Math.max(-1,Math.min(1,(e.gamma||0)/30));
    const ny=Math.max(-1,Math.min(1,((e.beta||0)-45)/30));
    pointerActive=true; applyTilt(nx,ny);
  }, {passive:true});
}

// the tilt + sway + light update loop (cheap; separate from the canvas rAF cadence is fine here)
let swayT=0;
function tiltLoop(){
  if (!pointerActive){
    // barely-there auto-sway so it's never dead-flat
    if (!REDUCED){ swayT+=0.012; applyTilt(Math.sin(swayT)*0.22, Math.cos(swayT*0.8)*0.18); }
  }
  // ease toward the target
  curRX += (targetRX-curRX)*0.12;
  curRY += (targetRY-curRY)*0.12;
  tiltEl.style.transform=`rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg)`;
  lightFromTilt(curRX, curRY);
  requestAnimationFrame(tiltLoop);
}
requestAnimationFrame(tiltLoop);
</script>
</body>
</html>
