<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Orrery Estate — an Estate Plan</title>
<style>
  :root{
    /* ---- house tokens (the workshop's dark aesthetic) ---- */
    --bg:#080a0f; --ink:#eaf0fa; --muted:#8b95a8; --brass:#c9a24a; --brass-bright:#f0d489;
    /* drafting linework laid as warm ink on the dark ground */
    --line:#7884a0;          /* hairline ink (slightly brighter for presence) */
    --line-soft:#414c66;     /* faint drafting grid */
    --line-warm:#b29a64;     /* brass-tinted plan linework (footprints) — warmer & more present */
    --line-warm-d:#8d7a4e;   /* a dimmer warm ink for fine detail */
    --paper:#10141f;         /* footprint fill (a touch lifted from the ground) */
    --paper-lit:#1a2230;     /* lit edge of a footprint slab */
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }
  /* atmosphere: a warm candlelit core pooling at the manor + cool light bleed over the
     grounds, with a deep edge-vignette so the plate feels lamplit & contained. The warm
     core sits centre (the inhabited house); the dark gathers toward the margins. */
  body{ background:
    radial-gradient(1180px 760px at 51% 45%, rgba(201,162,74,.085), transparent 60%),
    radial-gradient(1500px 980px at 50% 44%, rgba(95,150,196,.045), transparent 64%),
    radial-gradient(760px 560px at 20% 78%, rgba(120,150,120,.045), transparent 60%),
    radial-gradient(760px 560px at 82% 30%, rgba(120,110,180,.045), transparent 60%),
    radial-gradient(1500px 1500px at 50% 50%, transparent 52%, rgba(2,3,6,.62) 100%),
    var(--bg); }

  /* the stage no longer scrolls — pan/zoom is a transform on #viewport (below) */
  /* reserve a bottom band so the fixed footer never embeds into the meet-scaled plate,
     and glue the fixed overlays to the plate's letterboxed edges at any aspect ratio. */
  :root{ --plate-w: min(100vw, calc((100vh - 46px) * 1.6));
         --gutter-x: max(0px, calc((100vw - var(--plate-w)) / 2)); }
  .stage{ position:fixed; inset:0 0 46px 0; overflow:hidden; touch-action:none; }
  .plan{ position:relative; width:100%; height:100%; display:block; }
  svg.sheet{ width:100%; height:100%; display:block; touch-action:none; }

  /* a slow drifting candle-haze over the whole plate (behind the linework) — warm light
     gathered at the manor, a cool wash drifting over the grounds. */
  .haze{ position:fixed; inset:-12%; z-index:0; pointer-events:none; opacity:.95;
    background:
      radial-gradient(540px 420px at 50% 46%, rgba(201,162,74,.085), transparent 66%),
      radial-gradient(620px 460px at 27% 70%, rgba(110,150,120,.05), transparent 64%),
      radial-gradient(560px 420px at 76% 30%, rgba(95,150,196,.05), transparent 64%); }
  @keyframes hazedrift{
    0%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(-2.2%,1.6%,0); }
    100%{ transform:translate3d(0,0,0); } }
  .haze{ animation:hazedrift 38s ease-in-out infinite; }

  /* ---- drafting type ---- */
  .tick{ font:600 9.5px/1 var(--mono); letter-spacing:.18em; fill:var(--muted);
    text-transform:uppercase; }
  /* room name: a clear engraved serif, with a faint dark backing so it reads off the grid */
  .roomname{ font:500 16.5px/1 var(--serif); fill:#f3f7ff; letter-spacing:.012em;
    paint-order:stroke; stroke:rgba(6,8,13,.72); stroke-width:3px; stroke-linejoin:round; }
  .roomsub{ font:600 9px/1 var(--mono); letter-spacing:.15em; fill:#9aa4b8;
    text-transform:uppercase; paint-order:stroke; stroke:rgba(6,8,13,.6); stroke-width:2.4px; }
  /* a faint accent kicker rule that tints the label in its wing's colour */
  .roomrule{ stroke:var(--c); stroke-width:1.4; opacity:.5; transition:opacity .3s ease; }
  .cart-title{ font:500 18px/1 var(--serif); fill:var(--ink); letter-spacing:.02em; }
  .cart-sub{ font:italic 10px/1 var(--serif); fill:var(--muted); }
  .cart-tick{ font:600 9px/1 var(--mono); letter-spacing:.26em; fill:var(--brass);
    text-transform:uppercase; }

  /* hairlines */
  .grid-line{ stroke:var(--line-soft); stroke-width:.5; opacity:.30; }
  .frame{ fill:none; stroke:var(--line); stroke-width:1; opacity:.6; }
  .frame-inner{ fill:none; stroke:var(--line); stroke-width:.6; opacity:.46; }
  /* the faint parkland / property boundary — a surveyed pale read around the estate */
  .estate-bound{ fill:none; stroke:var(--line-warm); stroke-width:1; opacity:.22;
    stroke-dasharray:10 5 2 5; stroke-linecap:round; }

  /* dashed survey paths linking the manor to each folly (warm ink) — tree-lined avenues */
  .survey-path{ fill:none; stroke:var(--line-warm); stroke-width:1.2; opacity:.34;
    stroke-dasharray:2 6; stroke-linecap:round; }
  .avenue-tree{ fill:var(--line-warm); opacity:.4; }

  /* footprints — a POI is an <a>; .fp* are its plan linework, given warm relief */
  .poi{ cursor:pointer; outline:none; }
  /* a very subtle per-wing accent wash on the floor of each footprint (reads at a glance
     as an inhabited, tinted plan; lifts to its full accent on hover) */
  .fp-floor{ fill:color-mix(in srgb, var(--c) 9%, var(--paper)); stroke:none; opacity:.9;
    transition:fill .3s ease, opacity .3s ease; }
  .fp-fill{ fill:var(--paper); stroke:var(--line-warm); stroke-width:1.5; opacity:.98;
    transition:stroke .3s ease, fill .3s ease, filter .35s ease; }
  .fp-lit{ fill:none; stroke:var(--brass); stroke-width:.8; opacity:.3;
    transition:stroke .3s ease, opacity .3s ease; }   /* a warm lit lip on the plan slab */
  .fp-line{ fill:none; stroke:var(--line-warm); stroke-width:1.1; opacity:.72;
    transition:stroke .3s ease, opacity .3s ease; }
  .fp-fine{ fill:none; stroke:var(--line-warm-d); stroke-width:.7; opacity:.6;
    transition:stroke .3s ease, opacity .3s ease; }
  /* a small warm lamp glow at the heart of each footprint (candlelit from inside) */
  .fp-lamp{ fill:var(--brass); opacity:.16; transition:opacity .35s ease, fill .35s ease; }
  .leader{ stroke:var(--line); stroke-width:.8; opacity:.58; fill:none;
    transition:stroke .3s ease, opacity .3s ease; }
  .leader-dot{ fill:var(--line); opacity:.7; transition:fill .3s ease; }
  .glyph-emoji{ font-size:17px; opacity:.96; transition:filter .35s ease;
    paint-order:stroke; }

  /* hover / focus — the POI's footprint lifts and glows in its own accent */
  .poi:hover .fp-floor, .poi:focus-visible .fp-floor{
    fill:color-mix(in srgb, var(--c) 26%, var(--paper-lit)); opacity:1; }
  .poi:hover .fp-fill, .poi:focus-visible .fp-fill{
    stroke:var(--c); fill:color-mix(in srgb, var(--c) 16%, var(--paper-lit));
    filter:drop-shadow(0 0 11px color-mix(in srgb,var(--c) 70%,transparent)); }
  .poi:hover .fp-lit, .poi:focus-visible .fp-lit{ stroke:var(--c); opacity:.6; }
  .poi:hover .fp-lamp, .poi:focus-visible .fp-lamp{ fill:var(--c); opacity:.4; }
  .poi:hover .fp-line, .poi:focus-visible .fp-line,
  .poi:hover .fp-fine, .poi:focus-visible .fp-fine{ stroke:var(--c); opacity:.95; }
  .poi:hover .leader, .poi:focus-visible .leader{ stroke:var(--c); opacity:.9; }
  .poi:hover .leader-dot, .poi:focus-visible .leader-dot{ fill:var(--c); opacity:1; }
  .poi:hover .roomrule, .poi:focus-visible .roomrule{ opacity:1; }
  .poi:hover .roomname, .poi:focus-visible .roomname{ fill:#fff; }
  .poi:hover .roomsub, .poi:focus-visible .roomsub{ fill:var(--c); }
  .poi:hover .glyph-emoji, .poi:focus-visible .glyph-emoji{
    filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 80%,transparent)); }
  /* visible keyboard focus ring around the whole footprint group */
  .poi:focus-visible .focusring{ opacity:1; }
  .focusring{ fill:none; stroke:var(--c); stroke-width:1; stroke-dasharray:3 3;
    opacity:0; transition:opacity .2s ease; rx:4; }

  /* companion mark: a small "within" tick that surfaces on hover */
  .within{ font:600 8px/1 var(--mono); letter-spacing:.12em; fill:var(--muted);
    text-transform:uppercase; opacity:0; transition:opacity .3s ease; }
  .poi:hover .within, .poi:focus-visible .within{ opacity:.85; }

  /* ════════════════════════════════════════════════════════════════════════
     DISTRICT PRECINCTS + WING SUB-PRECINCTS + ZONE LABELS — all renderer-drawn
     in the existing token language. A district hull is a faint double-ruled
     boundary with a very low-alpha tint wash; a wing hull is a lighter dashed
     hairline party-wall washed in the wing's lead accent; zone + wing labels are
     ENGRAVED ON their boundary (a brass tab/tick + a short flanking rule), never
     floating. Distinct surface textures let you read which precinct you are in. */
  .precinct{ fill:none; stroke:var(--line); stroke-width:1; opacity:.34; }
  .precinct-inner{ fill:none; stroke:var(--line); stroke-width:.6; opacity:.26; }
  .precinct-tint{ stroke:none; }                       /* per-district tint wash */
  /* the grounds read as a dashed park-line precinct */
  .precinct-park{ stroke-dasharray:9 5; opacity:.3; }
  /* the cavern/outskirts: a thin diagonal hatch over a faint tint */
  .precinct-hatch{ fill:url(#hatch); opacity:.5; stroke:none; }
  /* the manor: a richer warm double-ruled party-wall */
  .precinct-manor{ stroke:var(--line-warm); stroke-width:1.7; opacity:.86;
    filter:drop-shadow(0 0 12px rgba(201,162,74,.10)); }
  /* the observatory rise: a lifted cool terrace line */
  .precinct-rise{ stroke:#9db4ff; stroke-width:1; opacity:.34; stroke-dasharray:5 4; }
  /* a wing sub-precinct: a hairline dashed party-wall + a low-alpha accent wash */
  .wing-bound{ fill:none; stroke:var(--wa); stroke-width:.8; opacity:.5;
    stroke-dasharray:6 4; stroke-linecap:round; }
  .wing-tint{ fill:var(--wa); opacity:.055; stroke:none; }
  /* engraved labels seated ON a boundary (never floating) */
  .zone-label{ font:600 10px/1 var(--mono); letter-spacing:.22em; fill:var(--brass);
    text-transform:uppercase; opacity:.7; paint-order:stroke;
    stroke:rgba(6,8,13,.55); stroke-width:2.2px; }
  .zone-tab{ stroke:var(--brass); stroke-width:.9; opacity:.5; }
  .wing-label{ font:600 8px/1 var(--mono); letter-spacing:.18em; fill:var(--wa);
    text-transform:uppercase; opacity:.72; paint-order:stroke;
    stroke:rgba(6,8,13,.5); stroke-width:1.9px; }

  /* ---- the circulation graph: the warm SPINE, district avenues, wing aisles ---- */
  .spine{ fill:none; stroke:var(--line-warm); stroke-width:2.4; opacity:.5;
    stroke-linecap:round; filter:drop-shadow(0 0 5px rgba(201,162,74,.2)); }
  .aisle{ fill:none; stroke:var(--line-warm-d); stroke-width:.9; opacity:.3;
    stroke-dasharray:2 5; stroke-linecap:round; }
  .room-stub{ fill:none; stroke:var(--line-warm-d); stroke-width:.7; opacity:.26;
    stroke-linecap:round; }
  /* the marked FRONT DOOR — a brass medallion + a "you are here / enter" plate */
  .door-medallion{ fill:rgba(11,14,22,.85); stroke:var(--brass); stroke-width:1.4;
    filter:drop-shadow(0 0 8px rgba(201,162,74,.4)); }
  .door-glyph{ fill:var(--brass-bright); font-size:13px; }
  .door-plate{ font:600 8.5px/1 var(--mono); letter-spacing:.2em; fill:var(--brass);
    text-transform:uppercase; opacity:.82; paint-order:stroke;
    stroke:rgba(6,8,13,.6); stroke-width:2.2px; }
  /* the soft pulsing FIRST-VISIT THREAD from the door to the nearest unseen anchor */
  .first-thread{ fill:none; stroke:var(--brass-bright); stroke-width:1.6; opacity:.5;
    stroke-dasharray:3 6; stroke-linecap:round; animation:threadpulse 2.6s ease-in-out infinite; }
  @keyframes threadpulse{ 0%,100%{ opacity:.28; } 50%{ opacity:.7; } }
  .first-thread-tip{ font:italic 9px/1 var(--serif); fill:var(--brass-bright); opacity:.8; }

  /* ---- pan/zoom control (a small in-idiom brass plate, bottom-left near the legend) ---- */
  .pzctl{ position:fixed; left:calc(var(--gutter-x) + 20px); bottom:64px; z-index:31; display:flex; gap:6px;
    font:600 11px/1 var(--mono); }
  .pzctl button{ background:rgba(11,14,22,.85); color:var(--brass);
    border:1px solid color-mix(in srgb,var(--brass) 40%,transparent); border-radius:4px;
    width:26px; height:26px; cursor:pointer; transition:color .2s, border-color .2s, background .2s;
    padding:0; line-height:1; }
  .pzctl button:hover{ color:var(--brass-bright); border-color:var(--brass);
    background:rgba(201,162,74,.12); }
  #viewport{ will-change:transform; }
  .sheet.grabbable{ cursor:grab; }
  .sheet.grabbing{ cursor:grabbing; }
  @media (prefers-reduced-motion:reduce){ .first-thread{ animation:none; opacity:.5; } }

  /* ---- the Undercroft POI states (the locked way down) ---- */
  /* BROKEN: a sealed cellar stair — faint, dashed, NOT navigable */
  .undercroft.broken{ cursor:default; }
  .undercroft.broken .fp-fill{ opacity:.5; }
  .undercroft.broken .fp-line{ stroke-dasharray:3 3; }
  .undercroft.broken:hover .fp-fill, .undercroft.broken:focus-visible .fp-fill{
    stroke:var(--brass); fill:color-mix(in srgb,var(--brass) 8%,var(--paper));
    filter:drop-shadow(0 0 7px rgba(201,162,74,.34)); }
  .undercroft.broken .lostmark{ font:italic 8px/1 var(--serif); fill:var(--muted);
    opacity:.8; text-transform:none; letter-spacing:0; }
  /* first-appearance grow (the POI fades + scales up from its centre once) */
  .undercroft.grow{ animation:ucgrow 2.4s cubic-bezier(.2,.7,.2,1) both; transform-box:fill-box;
    transform-origin:center; }
  @keyframes ucgrow{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  /* the repair sweep when the rune is clicked (broken → whole) */
  .undercroft.repairing .fp-line{ animation:ucrepair 1.2s ease-out both; }
  @keyframes ucrepair{ from{ opacity:0; } to{ opacity:.62; } }

  /* ---- hover card (HTML overlay positioned over the plan) — dark, contrasty ---- */
  #card{ position:absolute; z-index:40; width:288px; pointer-events:none;
    opacity:0; transform:translateY(6px) scale(.985); transform-origin:top left;
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
  #card.show{ opacity:1; transform:none; }
  .card-inner{ position:relative; padding:15px 17px 16px; border-radius:6px;
    background:linear-gradient(180deg, rgba(13,16,24,.975), rgba(8,10,15,.985));
    border:1px solid color-mix(in srgb,var(--cc) 44%,rgba(255,255,255,.10));
    box-shadow:0 26px 64px -22px rgba(0,0,0,.88), 0 0 46px -22px var(--cc);
    backdrop-filter:blur(3px); }
  /* corner ticks — like a survey callout box */
  .card-inner::before, .card-inner::after{ content:""; position:absolute; width:10px; height:10px;
    border:1px solid color-mix(in srgb,var(--cc) 72%,transparent); }
  .card-inner::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card-inner::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card-room{ font:600 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 7px; }
  .card-name{ font:500 19px/1.15 var(--serif); color:var(--ink); margin:0;
    display:flex; align-items:baseline; gap:9px; }
  .card-name .ce{ font-size:17px; }
  .card-name small{ font:600 9px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase;
    color:var(--cc); }
  .card-blurb{ margin:9px 0 0; font:13px/1.52 var(--serif); color:#c4ccda; }
  .card-within{ margin:11px 0 0; display:inline-flex; align-items:center; gap:6px;
    font:600 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:5px 10px 5px 8px;
    border:1px solid color-mix(in srgb,var(--cc) 28%,rgba(255,255,255,.08));
    border-radius:999px; background:rgba(255,255,255,.025); }
  .card-within b{ color:color-mix(in srgb,var(--cc) 80%,var(--muted)); font-weight:600; }
  .card-open{ margin:11px 0 0; font:600 9px/1 var(--mono); letter-spacing:.16em;
    text-transform:uppercase; color:var(--cc); opacity:.92; }

  /* ---- margin legend (HTML, fixed corner) — matches the current footer's links ---- */
  .legend{ position:fixed; left:calc(var(--gutter-x) + 20px); bottom:16px; z-index:30; max-width:62vw;
    font:11px/1.7 var(--mono); color:var(--muted); letter-spacing:.04em; }
  .legend .craft{ display:block; opacity:.5; margin-bottom:5px; font-size:10px; }
  .legend a{ color:var(--muted); text-decoration:none;
    border-bottom:1px solid rgba(139,149,168,.3); transition:color .25s, border-color .25s; }
  .legend a:hover{ color:var(--brass); border-color:var(--brass); }
  .legend .sep{ opacity:.4; margin:0 5px; }

  /* the hidden mark — once you've wandered enough it appears in the margin: a slow-pulsing,
     glowing rune that draws the eye. It is the thing the Undercroft POI tells you to look for.
     Absent until earned. Ported from the current front door's `.rune`. See /UNLOCK.md */
  .rune{ display:inline-block; text-decoration:none; color:var(--brass); opacity:0;
    pointer-events:none; transition:opacity .9s ease, color .3s, text-shadow .6s; }
  .rune::before{ content:"·"; margin:0 9px; opacity:.5; color:var(--muted); }
  .rune.show{ pointer-events:auto; animation:runepulse 2.4s ease-in-out infinite; }
  @keyframes runepulse{
    0%,100%{ opacity:.4; text-shadow:0 0 6px rgba(201,162,74,.25); }
    50%{ opacity:1; text-shadow:0 0 16px rgba(201,162,74,.6), 0 0 30px rgba(201,162,74,.25); } }
  .rune:hover{ opacity:1 !important; color:var(--brass-bright); text-shadow:0 0 18px rgba(201,162,74,.7); }
  /* found & repaired: a quiet, steady confirmation mark — no pulse */
  .rune.found{ animation:none; opacity:.7; }
  .rune .gl{ font-size:15px; }
  .rune .lbl{ font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    opacity:0; transition:opacity .4s; }
  .rune:hover .lbl{ opacity:.9; }

  .hint{ position:fixed; right:calc(var(--gutter-x) + 20px); top:16px; z-index:30;
    font:600 9px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); opacity:.55; }

  /* ---- THE SURVEY OF HEAVEN — a personal night sky in the plate's dark margins.
     The <g.sky> is inserted as the FIRST child of #sheet, so the stars sit "in
     the paper" behind the grid & footprints. A lit star is a small, softly
     twinkling point; the asterism lines are hairlines that brighten to brass once
     their wing is charted; the engraved names sit in the margin like surveyor's
     marginalia. Monotone, cosmetic, never gated. See tools/sky/. ---- */
  .sky{ pointer-events:none; }
  /* a kindled star: a soft warm-white point with a faint halo, gently twinkling */
  .sky-star{ fill:#eaf0fa; opacity:.78;
    filter:drop-shadow(0 0 3px rgba(234,240,250,.5));
    animation:skytwinkle 4s ease-in-out infinite; }
  .sky-star.mag1{ fill:#fbf3df; opacity:.92;
    filter:drop-shadow(0 0 5px rgba(240,212,137,.55)); }   /* a wing's bright lead */
  .sky-star.mag3{ opacity:.6; }
  /* a CHARTED star (member of a completed asterism): warmed to brass with a stronger
     halo, so the named constellation's line visibly terminates on two real stars */
  .sky-star.charted{ fill:var(--brass-bright); opacity:1;
    filter:drop-shadow(0 0 6px rgba(201,162,74,.75)); }
  @keyframes skytwinkle{ 0%,100%{ opacity:.85; } 46%{ opacity:.5; } 72%{ opacity:1; } }
  /* asterism line: a faint cool hairline while partial; warms to brass when charted */
  .asterism-line{ fill:none; stroke:var(--line); stroke-width:.7; opacity:.22;
    stroke-linecap:round; stroke-linejoin:round;
    transition:stroke .8s ease, opacity .8s ease, stroke-width .8s ease; }
  .asterism-line.complete{ stroke:var(--brass); stroke-width:1; opacity:.62;
    filter:drop-shadow(0 0 4px rgba(201,162,74,.4)); }
  /* the two orphaned-wing reward asterisms get their wing's own tint when charted:
     the Automaton in Clockwork's cool teal, the Furnace in the Engine Room's amber. */
  .asterism-line.complete[data-wing="automaton"]{ stroke:#7ad0c4; opacity:.6; }
  .asterism-line.complete[data-wing="furnace"]{ stroke:#d9a441; opacity:.66; }
  .sky-star.charted[data-id="context-window"],.sky-star.charted[data-id="temperature-dial"],.sky-star.charted[data-id="the-turn"],.sky-star.charted[data-id="partition"]{ fill:#aee6dd; }
  .sky-star.charted[data-id="carnot"],.sky-star.charted[data-id="demon"],.sky-star.charted[data-id="brownian"],.sky-star.charted[data-id="stirling"]{ fill:#f0c878; }
  /* a faint brass tie from an engraved name to its nearest charted star — the same
     draughting idiom the room labels use (every POI label has a leader to its room),
     so a named constellation reads as ONE unit instead of a label + a line that both
     seem to point at nothing. Hairline, dashed, quiet; warms with the name. */
  .an-leader{ fill:none; stroke:var(--brass); stroke-width:.7; opacity:.42;
    stroke-dasharray:2.5 3; stroke-linecap:round;
    filter:drop-shadow(0 0 2px rgba(201,162,74,.35)); }
  /* the engraved asterism NAME + its one-line myth, set as margin marginalia */
  .asterism-name{ pointer-events:none; }
  .asterism-name .an-name{ font:italic 12.5px/1 var(--serif); fill:var(--brass-bright);
    letter-spacing:.01em; paint-order:stroke; stroke:rgba(6,8,13,.66); stroke-width:2.6px;
    stroke-linejoin:round; }
  .asterism-name .an-myth{ font:italic 8.5px/1.3 var(--serif); fill:#bcae8a;
    paint-order:stroke; stroke:rgba(6,8,13,.55); stroke-width:1.8px; }
  /* a small brass tick under the engraved name */
  .asterism-name .an-rule{ stroke:var(--brass); stroke-width:.8; opacity:.5; }
  /* the name fades+rises in the FIRST time its wing is charted (steady thereafter) */
  .asterism-name.named-in{ animation:skyname 1.6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes skyname{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  /* the margin tally — quiet surveyor's mono, like the scale-bar ticks */
  .sky-tally{ font:600 8.5px/1 var(--mono); letter-spacing:.2em; fill:var(--brass);
    text-transform:uppercase; opacity:.5; }
  /* the feats bonus sub-tally: brighter brass, sits just above the main tally */
  .sky-tally-feats{ fill:var(--brass-bright); opacity:.72; }
  /* the two orphaned-wing sub-tallies, tinted to their wings (stack above the feats line) */
  .sky-tally-automaton{ fill:#aee6dd; opacity:.72; }
  .sky-tally-furnace{ fill:#f0c878; opacity:.72; }
  /* the all-skies capstone: a whisper-faint warm lift over the charted plate */
  .sky.all-charted .sky-tally{ opacity:.78; fill:var(--brass-bright); }

  /* ───── THE HOURS — the front door's day/light LAYER (tools/hours) ─────
     A continuous day-phase tint keyed to the TRUE solar altitude, a brass gnomon
     that casts a real shadow, four time-gated apparitions, and the catch-the-hours
     phase-ring metagame. Cosmetics-only; mounted into #viewport after the sky pass;
     confers no access and touches no existing predicate. The night-stars are the
     SAME Survey-of-Heaven stars BRIGHTENING — gated below by the .hours-night class
     the layer toggles on the sky <g> (raising star contrast at night, never washing
     them out at noon). ── */
  #hours-back{ pointer-events:none; transition:opacity .9s ease; }
  /* the wash rect DARKENS the margins at night (raising star contrast) and is near
     transparent by day so the plan stays legible — its opacity is driven inline by
     (1 − dayFactor). It multiplies, so it only ever deepens the dark ground. */
  #hours-wash{ pointer-events:none; mix-blend-mode:multiply; }
  /* at night, brighten the existing Survey stars for contrast (no competing star set) */
  .sky.hours-night .sky-star{ opacity:1; filter:drop-shadow(0 0 5px rgba(234,240,250,.7)); }
  .sky.hours-night .sky-star.mag1{ filter:drop-shadow(0 0 7px rgba(240,212,137,.7)); }
  .sky.hours-night .sky-star.charted{ filter:drop-shadow(0 0 8px rgba(201,162,74,.85)); }
  #hours-apparitions{ pointer-events:none; }
  .hours-ap{ transition:opacity .8s ease; }
  .hours-firefly{ animation:hoursFly 3.4s ease-in-out infinite; }
  @keyframes hoursFly{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }
  /* the gnomon furniture: the live brass dial + its real cast shadow + HUD */
  #hours-gnomon{ cursor:grab; touch-action:none; }
  /* dragging the dial must never select map text — the drag listeners live on
     window, so suppress selection across the whole Hours furniture set. */
  #hours-gnomon, #hours-hud, #hours-ring, #hours-back, #hours-apparitions{
    user-select:none; -webkit-user-select:none; -moz-user-select:none; }
  #hours-gnomon.dragging{ cursor:grabbing; }
  #hours-gnomon .gn-shadow{ stroke:rgba(10,8,5,.82); stroke-linecap:round; transition:none; }
  #hours-gnomon .gn-style{ fill:#e6bd6f; stroke:#1a1206; stroke-width:.6; }
  #hours-gnomon .gn-rim{ fill:rgba(20,15,9,.42); stroke:#e6bd6f; stroke-width:1.2; }
  #hours-gnomon .gn-tick{ stroke:#e6bd6f; }
  #hours-gnomon .gn-handle{ fill:rgba(230,189,111,.16); stroke:#e6bd6f; stroke-width:1; }
  #hours-gnomon:hover .gn-handle{ fill:rgba(230,189,111,.32); }
  #hours-gnomon .gn-cap{ font:italic 9px/1 var(--serif); fill:#e6bd6f; paint-order:stroke;
    stroke:rgba(6,8,13,.7); stroke-width:2.4px; stroke-linejoin:round; }
  /* the gold phase-ring (caught-apparitions meter) — fills as each is caught */
  #hours-ring .pr-track{ fill:none; stroke:rgba(230,189,111,.22); stroke-width:3; }
  #hours-ring .pr-fill{ fill:none; stroke:var(--brass-bright); stroke-width:3; stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(201,162,74,.6)); transition:stroke-dashoffset .6s ease; }
  #hours-ring .pr-count{ font:600 8px/1 var(--mono); fill:var(--brass-bright); letter-spacing:.12em; }
  /* the HUD readout (clock + phase) sits as top furniture, like the sky tally */
  #hours-hud{ pointer-events:none; }
  #hours-hud .hh-clock{ font:600 13px/1 var(--mono); fill:var(--brass-bright); letter-spacing:.06em;
    paint-order:stroke; stroke:rgba(6,8,13,.7); stroke-width:2.6px; stroke-linejoin:round; }
  #hours-hud .hh-phase{ font:italic 9px/1 var(--serif); fill:#cbb98a; }
  /* the self-test pill (#hours-pill) was lifted OUT of #hours-hud to sit below the
     dial, so its styles are scoped by class — not under #hours-hud — to keep matching. */
  .hh-test{ font:600 7px/1 var(--mono); letter-spacing:.1em; fill:var(--ink-dim); opacity:.85;
    paint-order:stroke; stroke:rgba(6,8,13,.6); stroke-width:2px; stroke-linejoin:round; }
  .hh-test.ok{ fill:#8fd79a; }
  .hh-test.bad{ fill:#f08a7a; }

  @media (prefers-reduced-motion:reduce){
    .haze{ animation:none; }
    .fp-fill,.fp-line,.fp-fine,.fp-lit,.fp-floor,.fp-lamp,.roomrule,.leader,.leader-dot,.glyph-emoji,.within,#card,.focusring{ transition:none; }
    .undercroft.grow{ animation:none; opacity:1; transform:none; }
    .undercroft.repairing .fp-line{ animation:none; }
    .rune.show{ animation:none; opacity:.8; text-shadow:0 0 10px rgba(201,162,74,.4); }
    /* a STATIC sky: no twinkle, no name-in animation, transitions off */
    .sky-star{ animation:none; }
    .asterism-line{ transition:none; }
    .asterism-name.named-in{ animation:none; opacity:1; transform:none; }
    /* The Hours: a frozen day-frame — no live tick, no firefly flicker, no transitions */
    #hours-back,.hours-ap,#hours-ring .pr-fill{ transition:none; }
    .hours-firefly{ animation:none; }
  }
  @media (max-width:640px){
    .hint{ display:none; }
    .legend{ font-size:10px; max-width:none; left:12px; bottom:10px; }
    #card{ width:248px; }
  }
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="plan" id="plan">
    <!-- The sheet is a 1440x900 surveyor's plate; it scales to fill the viewport
         (xMidYMid meet) and pans inside .stage on small screens. -->
    <svg class="sheet" id="sheet" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="The Orrery Estate — an estate plan. Each labelled point of interest is a link to a room.">
      <defs>
        <!-- the base cool drafting grid (faint, present everywhere) -->
        <pattern id="draftgrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0 H0 V40" class="grid-line"/>
        </pattern>
        <!-- a warmer, finer grid that we fade IN near the manor (the surveyed, inhabited core)
             and OUT toward the margins, via the warmgrid radial mask below -->
        <pattern id="warmgrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0 H0 V20" fill="none" stroke="var(--line-warm)" stroke-width=".4" opacity=".5"/>
        </pattern>
        <!-- faint paper/ink grain on the dark ground -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.62  0 0 0 0 0.56  0 0 0 0 0.40  0 0 0 0.7 0"/>
        </filter>
        <!-- coarse stipple/ink-speckle so the dark ground reads as paper, not flat black -->
        <filter id="stipple" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="turbulence" baseFrequency="0.012 0.012" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.50  0 0 0 0 0.46  0 0 0 0 0.34  0 0 0 0.9 -0.30"/>
        </filter>
        <!-- warm candle-glow pooled at the MANOR (lamplit-from-inside) -->
        <radialGradient id="candle" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(201,162,74,.16)"/>
          <stop offset="45%" stop-color="rgba(201,162,74,.07)"/>
          <stop offset="100%" stop-color="rgba(201,162,74,0)"/>
        </radialGradient>
        <!-- a radial alpha mask: white (visible) at the manor → transparent at the margins.
             We paint the warm grid through it so the inhabited core is more present. -->
        <radialGradient id="coreFade" cx="50%" cy="45%" r="42%">
          <stop offset="0%"  stop-color="#fff"/>
          <stop offset="55%" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="coreMask">
          <rect x="0" y="0" width="1440" height="900" fill="url(#coreFade)"/>
        </mask>
        <!-- a thin diagonal hatch for the quarantined Cavern / Outskirts precinct -->
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#7fd4c0" stroke-width=".7" opacity=".28"/>
        </pattern>
      </defs>

      <!-- ===== THE VIEWPORT — pan/zoom transform target. EVERYTHING in the plate
           (the ground, grid, candle pool, frame furniture, the Survey-of-Heaven sky
           <g> inserted as its first child, the district precincts, the manor, the
           circulation paths, and the POIs) lives inside #viewport so it all pans &
           zooms as ONE registered plate. The #sheet viewBox is never mutated, so the
           sky catalog + label solve + manor geometry stay in fixed viewBox units. ===== -->
      <g id="viewport">
      <!-- the dark ground given paper-grain + a coarse ink stipple (not flat black) -->
      <rect x="0" y="0" width="1440" height="900" filter="url(#stipple)" opacity=".05"/>
      <!-- base cool drafting grid, then a warmer denser grid faded in at the manor core -->
      <rect x="0" y="0" width="1440" height="900" fill="url(#draftgrid)"/>
      <rect x="0" y="0" width="1440" height="900" fill="url(#warmgrid)" mask="url(#coreMask)" opacity=".7"/>
      <rect x="0" y="0" width="1440" height="900" filter="url(#grain)" opacity=".05"/>
      <!-- candlelit warmth pooled at the manor (centre of the plate) -->
      <rect x="421" y="150" width="600" height="600" fill="url(#candle)"/>

      <!-- the parkland / property boundary — one estate, with rounded park corners -->
      <rect x="78" y="80" width="1284" height="744" rx="46" class="estate-bound"/>

      <!-- sheet frame (double-ruled) + corner registration ticks -->
      <rect x="26" y="26" width="1388" height="848" class="frame"/>
      <rect x="34" y="34" width="1372" height="832" class="frame-inner"/>
      <g class="frame">
        <path d="M26 60 V26 H60"/><path d="M1380 26 H1414 V60"/>
        <path d="M26 840 V874 H60"/><path d="M1380 874 H1414 V840"/>
      </g>

      <!-- ===== compass rose (north-up), top-left ===== -->
      <g transform="translate(120,128)">
        <circle r="44" class="fp-fine" opacity=".5"/>
        <circle r="33" class="fp-fine" opacity=".35"/>
        <path d="M0 -50 L7 -7 L0 0 L-7 -7 Z" fill="var(--ink)" opacity=".9"/>
        <path d="M0 50 L7 7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".7"/>
        <path d="M-50 0 L-7 -7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M50 0 L7 -7 L0 0 L7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M-30 -30 L-5 -5 L-8 -8 Z M30 -30 L5 -5 L8 -8 Z M30 30 L5 5 L8 8 Z M-30 30 L-5 5 L-8 8 Z"
              fill="var(--line-warm)" opacity=".4"/>
        <text x="0" y="-56" text-anchor="middle" class="cart-tick">N</text>
        <text x="0" y="68" text-anchor="middle" class="tick">S</text>
        <text x="62" y="4" text-anchor="middle" class="tick">E</text>
        <text x="-62" y="4" text-anchor="middle" class="tick">W</text>
      </g>

      <!-- ===== scale bar, bottom-center (moved left of the revealed sky-tally stack) ===== -->
      <g transform="translate(820,824)">
        <text x="0" y="-9" class="tick">SCALE — RODS</text>
        <rect x="0" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="40" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="80" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="120" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="160" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <text x="0" y="22" class="tick">0</text>
        <text x="78" y="22" class="tick">10</text>
        <text x="158" y="22" class="tick">20</text>
      </g>

      <!-- ===== engraved SURVEY NAMEPLATE — the DOCUMENT/estate title, demoted to a
           slim hairline plate in the reserved bottom-left margin gutter (~40% of the
           old cartouche's mass) so it reads as the sheet's title, not a place you
           enter, and no longer competes with the Maker's Shed for the name "The
           Workshop." Registered as one FURNITURE bbox the label solver keeps clear. -->
      <g transform="translate(104,766)">
        <!-- the bordered plate: outer rule, hairline inner rule, lit lip -->
        <rect x="0" y="0" width="250" height="64" rx="2.5" fill="rgba(11,14,22,.82)"
              stroke="var(--line-warm)" stroke-width="1.1" opacity=".94"/>
        <rect x="4" y="4" width="242" height="56" rx="2" class="fp-fine" opacity=".5"/>
        <!-- engraved corner ticks -->
        <g stroke="var(--line-warm)" stroke-width=".9" fill="none" opacity=".65">
          <path d="M7 18 V7 H18"/><path d="M232 7 H243 V18"/>
          <path d="M7 46 V57 H18"/><path d="M232 57 H243 V46"/>
        </g>
        <text x="16" y="27" class="cart-title">The Orrery Estate</text>
        <line x1="16" y1="36" x2="234" y2="36" stroke="var(--line-warm)" stroke-width=".6" opacity=".4"/>
        <text x="16" y="51" class="cart-sub">an estate of made things — for the joy of making them</text>
      </g>

      <!-- =========================================================
           THE RENDERER-DRAWN LAYERS. Everything below is injected by
           script from the Layout solution (district frames, wing
           sub-precincts, zone labels, the manor shell + entrance, the
           circulation spine/avenues, and the POIs). NO hand-placed
           pixels: district/wing membership is DATA, derived by Layout.
           The two old hardcoded floating zone <text> labels and the
           static manor shell are GONE — they are computed now.
           ========================================================= -->
      <!-- district + wing precinct hulls + their tints (drawn first, behind the plan) -->
      <g id="precincts"></g>
      <!-- the manor shell, its candle pool, cross-passage, and the marked front door -->
      <g id="manor"></g>
      <!-- the circulation graph: spine, district avenues, wing aisles, room stubs -->
      <g id="paths"></g>
      <!-- the engraved zone + wing labels, seated ON their boundaries -->
      <g id="zonelabels"></g>
      <!-- the POIs (footprints + glyphs + leaders + labels) -->
      <g id="pois"></g>
      </g><!-- /#viewport -->
    </svg>
  </div>
</div>

<!-- hover card overlay (dark, high-contrast over the map) -->
<div id="card" role="status" aria-live="polite">
  <div class="card-inner">
    <p class="card-room" id="c-room"></p>
    <h2 class="card-name"><span class="ce" id="c-emoji"></span><span id="c-name"></span><small id="c-tag"></small></h2>
    <p class="card-blurb" id="c-blurb"></p>
    <span class="card-within" id="c-within"><span id="c-wemoji"></span>&nbsp;<span>↳ <b id="c-wname"></b> within</span></span>
    <p class="card-open" id="c-open">Open ▸</p>
  </div>
</div>

<!-- margin legend / surveyor's marks (matches the current footer's links) -->
<nav class="legend">
  <span class="craft">handcrafted by Claude during leisure time · all single-file, zero-dependency</span>

<!-- pan/zoom controls (in-idiom brass plate) -->
<div class="pzctl" aria-hidden="false">
  <button id="pz-in"  title="zoom in"  aria-label="zoom in">＋</button>
  <button id="pz-out" title="zoom out" aria-label="zoom out">－</button>
  <button id="pz-fit" title="fit / reset view" aria-label="fit the whole plate">⊕</button>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The shared WS unlock module (inlined at build time by forge). Provides the
   `WS` global: WS.seen / WS.store / WS.bootstrap / WS.checkUnlocks, etc.
   Auto-inits on DOMContentLoaded — so if a visitor completes a secret on an
   un-converted page and RETURNS to this front door, the candlelit cue fires
   here as a catch-all. See /UNLOCK.md and tools/ws/README.md. */
<!-- forge:include tools/ws/ws.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The shared LabelPlacer engine (inlined at build time by forge). Provides the
   `LabelPlacer` global the plan uses to AUTO-PLACE every POI label: it solves the
   cartographic point-feature label-placement problem (no label overlaps another
   label, a footprint, or the plan furniture, and all stay on the sheet) so the
   estate lays out its OWN names. The map thus eats its own dog food — the same
   engine the /letterer page demonstrates. See tools/label/README.md. */
<!-- forge:include tools/label/label.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The Survey of Heaven module (inlined at build time by forge). Provides the
   `Sky` global: a personal night sky drawn in the plate's dark margins that
   records WHERE YOU HAVE BEEN. First visit to a room (read from the `ws:seen:<id>`
   breadcrumb every page already drops) kindles a star; companion-pair "wings" are
   joined by faint asterism lines that brighten to brass once both members are
   visited, engraving a name + a one-line myth into the margin; charting every
   wing fires an all-skies capstone. Always-visible, monotone, cosmetics-only —
   it confers NO access and touches no existing predicate. See tools/sky/README.md. */
<!-- forge:include tools/sky/sky.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The DECLARATIVE PLACEMENT engine (inlined at build time by forge). Provides the
   `Layout` global: rooms DECLARE district + tier (+ optional wing); Layout DERIVES
   every coordinate, footprint size, district/wing boundary, zone label, and the
   circulation graph from those declarations plus two closed config tables
   (DISTRICTS, WING_META). No room carries a pixel; an unknown district is a HARD
   build error. The solve is deterministic + coordinate-pure (runs in Node for
   tests). See tools/layout/README.md. */
<!-- forge:include tools/layout/layout.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   THE HOURS — the day/light CORE (inlined at build time by forge). Provides the
   `Hours` global: a continuous day-phase keyed to the TRUE solar altitude (the
   SAME sun the Gnomon sundial keeps — its solar functions are copied verbatim
   from tools/dial/dial.js), plus the brass gnomon's real shadow (routed through
   the proven shadowTip) and four time-gated apparitions. The front door mounts a
   light/time LAYER from it (below, after the sky pass) and the gnomon POI is its
   on-ramp. Pure, DOM-free, dual-use; byte-twinned with tools/hours/hours.test.cjs.
   See tools/hours/README.md. */
<!-- forge:include tools/hours/hours.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   THE PLACES TABLE — the single DECLARATIVE data array that drives the whole plan.

   A room DECLARES INTENT — never a pixel. The Layout engine (inlined above) DERIVES
   every coordinate, footprint size, boundary, route, and zone label from these
   declarations plus its closed DISTRICTS / WING_META config. Adding a room = append
   ONE entry: { district, tier, (optional wing) + the content fields }. The plan also
   PLACES ITS OWN LABELS via the LabelPlacer engine (placeLabels(), below).

   Each entry — CONTENT (preserved verbatim; frozen by the Sky/seen-audit contract):
     id        the stable id; drives WS.seen(id), the sky star, forge --audit-seen,
               and the href click. (physics-lab keeps id=physics-lab paired with
               href=cavern/index.html — the ONE id≠folder pair; do not "correct" it.)
     room      the labelled place ("The Study", "The Maker's Shed", …)
     piece     the project's proper name ("The Oracle", "Strange Garden", …)
     glyph     the emoji at the footprint's heart
     accent    this POI's own glow colour (hover/focus)
     href      the destination page (folder/index.html)
     tag       the short mono kicker ("verse engine", "19 games", …)
     blurb     the survey-callout body text (verbatim card content)
     companion optional { name, glyph } — NOT a POI; shown as "↳ <name> within"

   Each entry — DECLARED SPATIAL INTENT (the renderer owns the geometry):
     district  'manor'|'grounds'|'observatory'|'outbuilding'|'cavern'|'beneath'
               — an unknown district is a HARD BUILD ERROR (assert in Layout.solve).
     tier      1 grand anchor | 2 standard wing | 3 folly — size & emphasis rank
               (Layout.SIZE_BAND), no raw size in any entry.
     wing      optional kin-cluster slug within the district ('studies','works',…);
               omit ⇒ the district's unwinged remainder. A wing is always drawn as a
               bounded, tinted, labelled sub-precinct (even a solo wing).
     footprint optional DRAW-table shape key (character art, orthogonal to placement —
               the drawer fills whatever slot rect Layout allots). Omit ⇒ a default.
     order     optional integer within-wing ordering hint (stable sort; ties by id).
     skyStar   optional catalog id this room lights (defaults to id) — a no-op
               affirmation that makes a future rename safe; never moves the catalog.

     ── label placement is AUTOMATIC; the following are OPTIONAL label hints ──
     prefer    a side or ranked list biasing the LabelPlacer: 'left'|'right'|'top'|
               'bottom'|'ne'|'nw'|'se'|'sw' (string) or an array. Seeds the start.
     locked    (undercroft only) — gated by revealUndercroft(); not drawn directly.

   GONE FROM THE API (the renderer now owns them): x, y, w, h, r, pin. A designer can
   no longer place a pixel, size a box, or pin a label.
   ════════════════════════════════════════════════════════════════════════════ */
const PLACES = [
  // ----- THE MANOR HOUSE (centre — one enclosing house with named wings) -----
  { id:"verse", room:"The Study", piece:"The Oracle", glyph:"✒️",
    accent:"#cba15a", href:"verse/index.html", tag:"verse engine",
    companion:{ name:"Scriptorium", glyph:"🖋️" },
    district:"manor", tier:2, wing:"studies", footprint:"house-wing", order:10, prefer:"left",
    blurb:"A generative poetry machine — conjures short, coherent, evocative poems in five forms across six themes, each with an invented poet and a seed you can keep." },

  { id:"compositor", room:"The Print Room", piece:"Compositor", glyph:"🔠",
    accent:"#e5484d", href:"compositor/index.html", tag:"type press",
    companion:{ name:"Blazon", glyph:"🛡️" },
    district:"manor", tier:2, wing:"studies", footprint:"house-wing", order:20, prefer:"top",
    blurb:"A generative type press — seed a striking poster from an evocative phrase, set in Swiss, Bauhaus, Brutalist, Art Deco or Editorial style." },

  { id:"cartographer", room:"The Map Room", piece:"Cartographer", glyph:"🗺️",
    accent:"#d9b46a", href:"cartographer/index.html", tag:"map generator",
    companion:{ name:"Bastion", glyph:"🏰" },
    district:"manor", tier:2, wing:"studies", footprint:"house-wing", order:30, prefer:"left",

/* ── solve the declarative layout ONCE: every footprint coordinate/size, every
   district + wing boundary, the front-door, and the circulation graph are derived
   here from the PLACES declarations + Layout's closed config. An unknown district
   throws (a hard build error). Coordinates are mutated back onto each PLACES entry
   (x/y/w/h or x/y/r) so the existing footprint drawers + label/leader geometry —
   which read r.x/r.y/r.w/r.h — run UNCHANGED against the derived slots. */
const LAYOUT = Layout.solve(PLACES);
PLACES.forEach(p=>{
  const f = LAYOUT.foot[p.id];
  if(f){
    if(f.r != null){ p.x = f.x; p.y = f.y; p.r = f.r; }
    else { p.x = f.x; p.y = f.y; p.w = f.w; p.h = f.h; }
  } else if(p.locked){
    // the gated cellar stair: a reserved slot at the manor south foundation,
    // resolved here so revealUndercroft() can build its POI on demand.
    const s = Layout.beneathSlot();
    p.x = s.x; p.y = s.y; p.w = s.w; p.h = s.h;
  }
});

const SVGNS = "http://www.w3.org/2000/svg";
const el = (n, attrs) => { const e = document.createElementNS(SVGNS, n);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ── footprint drawers: each appends plan linework into a <g> for one place.
   Every drawer paints an accent floor-wash (.fp-floor) + a base slab (.fp-fill) +
   a warm lit lip (.fp-lit), so the footprint reads as an inhabited, tinted plan at
   a glance, then its own characterful surveyed detailing.                        */
function drawSlab(g, x, y, w, h, rx){
  const r = rx==null?1.5:rx;
  // the per-wing accent floor wash (very subtle; lifts to full accent on hover)
  g.appendChild(el("rect",{x:x+1,y:y+1,width:w-2,height:h-2,rx:r,class:"fp-floor"}));
  g.appendChild(el("rect",{x,y,width:w,height:h,rx:r,class:"fp-fill"}));
  // a warm lit lip inset 3px (the candlelit edge of the stone)
  g.appendChild(el("rect",{x:x+3,y:y+3,width:w-6,height:h-6,rx:rx==null?1:r,class:"fp-lit"}));
}
function drawHouseWing(g, r){ // an interior room cell within the manor: slab + subdivision + furniture + door swing
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h);
  // a cross-wall subdivision so the room reads as two chambers
  g.appendChild(el("line",{x1:x+w*0.5,y1:y+8,x2:x+w*0.5,y2:y+h-8,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+8,y1:y+h*0.5,x2:x+w-8,y2:y+h*0.5,class:"fp-fine",opacity:".4"}));
  // surveyed "furniture" pips — a hearth on the outer wall + a small table
  const outerX = (x<716) ? x+5 : x+w-5;
  g.appendChild(el("rect",{x:outerX-(x<716?0:7),y:y+h*0.5-7,width:7,height:14,class:"fp-fine",opacity:".45"}));
  // a door swing into the central corridor (toward house centre, ~x=721)
  const left = (x < 716);
  const doorX = left ? x+w : x, dir = left ? -1 : 1;
  g.appendChild(el("path",{d:`M${doorX} ${y+h*0.5} h${dir*12}`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${doorX+dir*12} ${y+h*0.5} a12 12 0 0 ${left?1:0} ${dir*-12} -12`,class:"fp-fine"}));
}
function drawEastWing(g, r){ // the taller projecting east wing (Threshold): floors, bay windows, a doorway arc
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // three floor levels
  g.appendChild(el("line",{x1:x,y1:y+h*0.33,x2:x+w,y2:y+h*0.33,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.66,x2:x+w,y2:y+h*0.66,class:"fp-fine"}));
  // a projecting bay on the east face (three window mullions)
  g.appendChild(el("path",{d:`M${x+w} ${y+h*0.4} h10 v${h*0.2} h-10`,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+w+3,y1:y+h*0.4,x2:x+w+3,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  g.appendChild(el("line",{x1:x+w+7,y1:y+h*0.4,x2:x+w+7,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  // the doorway arc facing the house
  g.appendChild(el("path",{d:`M${x} ${y+h*0.5} h-14`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${x-14} ${y+h*0.5} a14 14 0 0 1 14 -14`,class:"fp-fine"}));
}
function drawGlasshouse(g, r){ // greenhouse: gabled plan, mullion grid, knot-parterre + topiary (the Tessellarium within)
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the gable ridge + a long mullion grid (glass house)
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<8;i++) g.appendChild(el("line",{x1:x+w*i/8,y1:y,x2:x+w*i/8,y2:y+h,class:"fp-fine",opacity:".42"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.25,x2:x+w,y2:y+h*0.25,class:"fp-fine",opacity:".34"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.75,x2:x+w,y2:y+h*0.75,class:"fp-fine",opacity:".34"}));
  // a knot-parterre at the heart: a diamond-quartered square (the Tessellarium)
  const cx=x+w*0.5, cy=y+h*0.5, s=Math.min(w,h)*0.24;
  g.appendChild(el("rect",{x:cx-s,y:cy-s,width:s*2,height:s*2,class:"fp-line",opacity:".55"}));
  g.appendChild(el("path",{d:`M${cx} ${cy-s} L${cx+s} ${cy} L${cx} ${cy+s} L${cx-s} ${cy} Z`,class:"fp-fine"}));
  g.appendChild(el("path",{d:`M${cx-s} ${cy-s} l${s*2} ${s*2} M${cx+s} ${cy-s} l${-s*2} ${s*2}`,class:"fp-fine",opacity:".4"}));
  // topiary dots along the front beds
  g.appendChild(el("g",{}));
  const bedY=y+h-7, topi=g.lastChild;
  for(let i=0;i<6;i++) topi.appendChild(el("circle",{cx:x+w*(i+0.5)/6,cy:bedY,r:3.4,class:"fp-fine",opacity:".5"}));
}
function drawGlasshouseWing(g, r){ // living-systems glasshouse: gabled mullion grid, kin to the gardens, but the
  // parterre-at-heart is replaced by the limit-cycle level-sets in plan — concentric closed rings about a centre dot.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the gable ridge + a mullion grid (reads as kin to strange-garden's glasshouse)
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<7;i++) g.appendChild(el("line",{x1:x+w*i/7,y1:y,x2:x+w*i/7,y2:y+h,class:"fp-fine",opacity:".4"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.25,x2:x+w,y2:y+h*0.25,class:"fp-fine",opacity:".32"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.75,x2:x+w,y2:y+h*0.75,class:"fp-fine",opacity:".32"}));
  // the conceit in miniature: the predator–prey limit cycle as level-sets in plan —
  // 2 nested closed orbit-ellipses about the fixed-point centre dot (kept simple).
  const cx=x+w*0.5, cy=y+h*0.5;
  const rx=Math.min(w,h)*0.30, ry=Math.min(w,h)*0.20;
  g.appendChild(el("ellipse",{cx,cy,rx,ry,class:"fp-line",opacity:".7"}));
  g.appendChild(el("ellipse",{cx,cy,rx:rx*0.58,ry:ry*0.58,class:"fp-fine",opacity:".5"}));
  // the centre fixed-point dot
  g.appendChild(el("circle",{cx,cy,r:2.4,class:"fp-line"}));
}
function drawTower(g, r){ // domed observatory tower: concentric drum, radial dome ribs, a slit + transit-rim ticks
  const {x,y,r:rad} = r;
  // floor wash + drum
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-floor"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-fill"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad-3,class:"fp-lit"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.66,class:"fp-fine"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.30,class:"fp-fine"}));
  // radial dome ribs (12 spokes) — reads as a ribbed cupola
  for(let a=0;a<360;a+=30){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad*0.30,y1:y+Math.sin(t)*rad*0.30,
      x2:x+Math.cos(t)*(rad-2),y2:y+Math.sin(t)*(rad-2),class:"fp-fine",opacity:".4"})); }
  // the dome slit (a wedge to the north) + the transit telescope line
  g.appendChild(el("path",{d:`M${x-5} ${y} L${x-3} ${y-rad+2} L${x+3} ${y-rad+2} L${x+5} ${y} Z`,
    class:"fp-line",opacity:".7"}));
  g.appendChild(el("line",{x1:x,y1:y,x2:x,y2:y-rad*0.62,class:"fp-line"}));
  // transit-rim graduation ticks
  for(let a=0;a<360;a+=15){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad,y1:y+Math.sin(t)*rad,
      x2:x+Math.cos(t)*(rad-5),y2:y+Math.sin(t)*(rad-5),class:"fp-fine"})); }
}
function drawMaze(g, r){ // hedge maze: a denser, genuinely traceable concentric labyrinth with one true path
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // a hedge-green floor read so the maze sits in a planted enclosure
  g.appendChild(el("rect",{x:x+4,y:y+4,width:w-8,height:h-8,fill:"rgba(127,209,199,.04)",stroke:"none"}));
  // six nested rectangular hedge runs, each with a staggered opening → reads as walkable
  const step=Math.min(w,h)/14;
  for(let i=1;i<=6;i++){
    const ins=step*i, ix=x+ins, iy=y+ins, iw=w-ins*2, ih=h-ins*2;
    if(iw<10||ih<10) break;
    const gap=Math.max(12,step*1.4), side=i%4; let d;
    if(side===0) d=`M${ix+gap} ${iy} H${ix+iw} V${iy+ih} H${ix} V${iy} H${ix+gap-8}`;
    else if(side===1) d=`M${ix} ${iy} H${ix+iw} V${iy+ih-gap} M${ix+iw} ${iy+ih} H${ix} V${iy}`;
    else if(side===2) d=`M${ix} ${iy} H${ix+iw} V${iy+ih} H${ix+gap} M${ix} ${iy+ih} V${iy}`;
    else d=`M${ix} ${iy+gap} V${iy} H${ix+iw} V${iy+ih} H${ix} V${iy+gap+8}`;
    g.appendChild(el("path",{d,class:"fp-fine",opacity:".62"}));
  }
  // the entrance gap on the south edge + the goal rosette at heart
  g.appendChild(el("path",{d:`M${x+w*0.5-7} ${y+h} v-6 M${x+w*0.5+7} ${y+h} v-6`,class:"fp-line"}));
  g.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.5,r:6,class:"fp-line"}));
  g.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.5,r:2.5,class:"fp-fine"}));
}
function drawArcade(g, r){ // covered arched gallery: a long colonnade of arches with a stylobate + entablature
