<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Workshop — an Estate Plan</title>
<style>
  :root{
    /* ---- house tokens (the workshop's dark aesthetic) ---- */
    --bg:#080a0f; --ink:#eaf0fa; --muted:#8b95a8; --brass:#c9a24a; --brass-bright:#f0d489;
    /* drafting linework laid as warm ink on the dark ground */
    --line:#6b7790;          /* hairline ink */
    --line-soft:#39435a;     /* faint drafting grid */
    --line-warm:#9c8a5e;     /* brass-tinted plan linework (footprints) */
    --paper:#0d1019;         /* footprint fill */
    --paper-lit:#141a26;     /* lit edge of a footprint slab */
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }
  /* atmosphere: a warm candlelit vignette + cool light bleed, drifting slowly (motion-gated) */
  body{ background:
    radial-gradient(1300px 820px at 50% 42%, rgba(95,150,196,.05), transparent 62%),
    radial-gradient(820px 600px at 84% 88%, rgba(201,162,74,.07), transparent 60%),
    radial-gradient(720px 520px at 14% 12%, rgba(120,110,180,.05), transparent 58%),
    var(--bg); }

  .stage{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; }
  .plan{ position:relative; width:100%; height:100%; min-width:1040px; min-height:700px;
    display:block; }
  svg.sheet{ width:100%; height:100%; display:block; }

  /* a slow drifting candle-haze over the whole plate (behind the linework) */
  .haze{ position:fixed; inset:-12%; z-index:0; pointer-events:none; opacity:.9;
    background:
      radial-gradient(620px 460px at 30% 34%, rgba(201,162,74,.06), transparent 64%),
      radial-gradient(560px 420px at 72% 64%, rgba(95,150,196,.045), transparent 64%); }
  @keyframes hazedrift{
    0%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(-2.2%,1.6%,0); }
    100%{ transform:translate3d(0,0,0); } }
  .haze{ animation:hazedrift 38s ease-in-out infinite; }

  /* ---- drafting type ---- */
  .tick{ font:600 9.5px/1 var(--mono); letter-spacing:.18em; fill:var(--muted);
    text-transform:uppercase; }
  .roomname{ font:500 15px/1 var(--serif); fill:var(--ink); letter-spacing:.01em; }
  .roomsub{ font:600 8.5px/1 var(--mono); letter-spacing:.14em; fill:var(--muted);
    text-transform:uppercase; }
  .cart-title{ font:500 28px/1 var(--serif); fill:var(--ink); letter-spacing:.02em; }
  .cart-sub{ font:italic 12.5px/1 var(--serif); fill:var(--muted); }
  .cart-tick{ font:600 9px/1 var(--mono); letter-spacing:.26em; fill:var(--brass);
    text-transform:uppercase; }

  /* hairlines */
  .grid-line{ stroke:var(--line-soft); stroke-width:.5; opacity:.30; }
  .frame{ fill:none; stroke:var(--line); stroke-width:1; opacity:.55; }
  .frame-inner{ fill:none; stroke:var(--line); stroke-width:.6; opacity:.42; }

  /* dashed survey paths linking the manor to each folly (warm ink, faint) */
  .survey-path{ fill:none; stroke:var(--line-warm); stroke-width:1.1; opacity:.26;
    stroke-dasharray:2 6; stroke-linecap:round; }

  /* footprints — a POI is an <a>; .fp* are its plan linework, given warm relief */
  .poi{ cursor:pointer; outline:none; }
  .fp-fill{ fill:var(--paper); stroke:var(--line-warm); stroke-width:1.3; opacity:.96;
    transition:stroke .3s ease, fill .3s ease, filter .35s ease; }
  .fp-lit{ fill:none; stroke:var(--brass); stroke-width:.7; opacity:.22;
    transition:stroke .3s ease, opacity .3s ease; }   /* a warm lit lip on the plan slab */
  .fp-line{ fill:none; stroke:var(--line-warm); stroke-width:1; opacity:.62;
    transition:stroke .3s ease, opacity .3s ease; }
  .fp-fine{ fill:none; stroke:var(--line-warm); stroke-width:.6; opacity:.46;
    transition:stroke .3s ease, opacity .3s ease; }
  .leader{ stroke:var(--line); stroke-width:.7; opacity:.5; fill:none;
    transition:stroke .3s ease, opacity .3s ease; }
  .leader-dot{ fill:var(--line); opacity:.6; transition:fill .3s ease; }
  .glyph-emoji{ font-size:16px; opacity:.94; transition:filter .35s ease;
    paint-order:stroke; }

  /* hover / focus — the POI's footprint lifts and glows in its own accent */
  .poi:hover .fp-fill, .poi:focus-visible .fp-fill{
    stroke:var(--c); fill:color-mix(in srgb, var(--c) 16%, var(--paper-lit));
    filter:drop-shadow(0 0 11px color-mix(in srgb,var(--c) 70%,transparent)); }
  .poi:hover .fp-lit, .poi:focus-visible .fp-lit{ stroke:var(--c); opacity:.6; }
  .poi:hover .fp-line, .poi:focus-visible .fp-line,
  .poi:hover .fp-fine, .poi:focus-visible .fp-fine{ stroke:var(--c); opacity:.95; }
  .poi:hover .leader, .poi:focus-visible .leader{ stroke:var(--c); opacity:.9; }
  .poi:hover .leader-dot, .poi:focus-visible .leader-dot{ fill:var(--c); opacity:1; }
  .poi:hover .roomname, .poi:focus-visible .roomname{ fill:#fff; }
  .poi:hover .roomsub, .poi:focus-visible .roomsub{ fill:var(--c); }
  .poi:hover .glyph-emoji, .poi:focus-visible .glyph-emoji{
    filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 80%,transparent)); }
  /* visible keyboard focus ring around the whole footprint group */
  .poi:focus-visible .focusring{ opacity:1; }
  .focusring{ fill:none; stroke:var(--c); stroke-width:1; stroke-dasharray:3 3;
    opacity:0; transition:opacity .2s ease; rx:4; }

  /* companion mark: a small "within" tick that surfaces on hover */
  .within{ font:600 8px/1 var(--mono); letter-spacing:.12em; fill:var(--muted);
    text-transform:uppercase; opacity:0; transition:opacity .3s ease; }
  .poi:hover .within, .poi:focus-visible .within{ opacity:.85; }

  /* ---- the Undercroft POI states (the locked way down) ---- */
  /* BROKEN: a sealed cellar stair — faint, dashed, NOT navigable */
  .undercroft.broken{ cursor:default; }
  .undercroft.broken .fp-fill{ opacity:.5; }
  .undercroft.broken .fp-line{ stroke-dasharray:3 3; }
  .undercroft.broken:hover .fp-fill, .undercroft.broken:focus-visible .fp-fill{
    stroke:var(--brass); fill:color-mix(in srgb,var(--brass) 8%,var(--paper));
    filter:drop-shadow(0 0 7px rgba(201,162,74,.34)); }
  .undercroft.broken .lostmark{ font:italic 8px/1 var(--serif); fill:var(--muted);
    opacity:.8; text-transform:none; letter-spacing:0; }
  /* first-appearance grow (the POI fades + scales up from its centre once) */
  .undercroft.grow{ animation:ucgrow 2.4s cubic-bezier(.2,.7,.2,1) both; transform-box:fill-box;
    transform-origin:center; }
  @keyframes ucgrow{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  /* the repair sweep when the rune is clicked (broken → whole) */
  .undercroft.repairing .fp-line{ animation:ucrepair 1.2s ease-out both; }
  @keyframes ucrepair{ from{ opacity:0; } to{ opacity:.62; } }

  /* ---- hover card (HTML overlay positioned over the plan) — dark, contrasty ---- */
  #card{ position:absolute; z-index:40; width:288px; pointer-events:none;
    opacity:0; transform:translateY(6px) scale(.985); transform-origin:top left;
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
  #card.show{ opacity:1; transform:none; }
  .card-inner{ position:relative; padding:15px 17px 16px; border-radius:6px;
    background:linear-gradient(180deg, rgba(13,16,24,.975), rgba(8,10,15,.985));
    border:1px solid color-mix(in srgb,var(--cc) 44%,rgba(255,255,255,.10));
    box-shadow:0 26px 64px -22px rgba(0,0,0,.88), 0 0 46px -22px var(--cc);
    backdrop-filter:blur(3px); }
  /* corner ticks — like a survey callout box */
  .card-inner::before, .card-inner::after{ content:""; position:absolute; width:10px; height:10px;
    border:1px solid color-mix(in srgb,var(--cc) 72%,transparent); }
  .card-inner::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card-inner::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card-room{ font:600 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 7px; }
  .card-name{ font:500 19px/1.15 var(--serif); color:var(--ink); margin:0;
    display:flex; align-items:baseline; gap:9px; }
  .card-name .ce{ font-size:17px; }
  .card-name small{ font:600 9px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase;
    color:var(--cc); }
  .card-blurb{ margin:9px 0 0; font:13px/1.52 var(--serif); color:#c4ccda; }
  .card-within{ margin:11px 0 0; display:inline-flex; align-items:center; gap:6px;
    font:600 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:5px 10px 5px 8px;
    border:1px solid color-mix(in srgb,var(--cc) 28%,rgba(255,255,255,.08));
    border-radius:999px; background:rgba(255,255,255,.025); }
  .card-within b{ color:color-mix(in srgb,var(--cc) 80%,var(--muted)); font-weight:600; }
  .card-open{ margin:11px 0 0; font:600 9px/1 var(--mono); letter-spacing:.16em;
    text-transform:uppercase; color:var(--cc); opacity:.92; }

  /* ---- margin legend (HTML, fixed corner) — matches the current footer's links ---- */
  .legend{ position:fixed; left:20px; bottom:16px; z-index:30; max-width:62vw;
    font:11px/1.7 var(--mono); color:var(--muted); letter-spacing:.04em; }
  .legend .craft{ display:block; opacity:.5; margin-bottom:5px; font-size:10px; }
  .legend a{ color:var(--muted); text-decoration:none;
    border-bottom:1px solid rgba(139,149,168,.3); transition:color .25s, border-color .25s; }
  .legend a:hover{ color:var(--brass); border-color:var(--brass); }
  .legend .sep{ opacity:.4; margin:0 5px; }

  /* the hidden mark — once you've wandered enough it appears in the margin: a slow-pulsing,
     glowing rune that draws the eye. It is the thing the Undercroft POI tells you to look for.
     Absent until earned. Ported from the current front door's `.rune`. See /UNLOCK.md */
  .rune{ display:inline-block; text-decoration:none; color:var(--brass); opacity:0;
    pointer-events:none; transition:opacity .9s ease, color .3s, text-shadow .6s; }
  .rune::before{ content:"·"; margin:0 9px; opacity:.5; color:var(--muted); }
  .rune.show{ pointer-events:auto; animation:runepulse 2.4s ease-in-out infinite; }
  @keyframes runepulse{
    0%,100%{ opacity:.4; text-shadow:0 0 6px rgba(201,162,74,.25); }
    50%{ opacity:1; text-shadow:0 0 16px rgba(201,162,74,.6), 0 0 30px rgba(201,162,74,.25); } }
  .rune:hover{ opacity:1 !important; color:var(--brass-bright); text-shadow:0 0 18px rgba(201,162,74,.7); }
  /* found & repaired: a quiet, steady confirmation mark — no pulse */
  .rune.found{ animation:none; opacity:.7; }
  .rune .gl{ font-size:15px; }
  .rune .lbl{ font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    opacity:0; transition:opacity .4s; }
  .rune:hover .lbl{ opacity:.9; }

  .hint{ position:fixed; right:20px; top:16px; z-index:30;
    font:600 9px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); opacity:.55; }

  @media (prefers-reduced-motion:reduce){
    .haze{ animation:none; }
    .fp-fill,.fp-line,.fp-fine,.fp-lit,.leader,.leader-dot,.glyph-emoji,.within,#card,.focusring{ transition:none; }
    .undercroft.grow{ animation:none; opacity:1; transform:none; }
    .undercroft.repairing .fp-line{ animation:none; }
    .rune.show{ animation:none; opacity:.8; text-shadow:0 0 10px rgba(201,162,74,.4); }
  }
  @media (max-width:640px){
    .hint{ display:none; }
    .legend{ font-size:10px; max-width:none; left:12px; bottom:10px; }
    #card{ width:248px; }
  }
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="plan" id="plan">
    <!-- The sheet is a 1440x900 surveyor's plate; it scales to fill the viewport
         (xMidYMid meet) and pans inside .stage on small screens. -->
    <svg class="sheet" id="sheet" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="The Workshop — an estate plan. Each labelled point of interest is a link to a room.">
      <defs>
        <pattern id="draftgrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0 H0 V40" class="grid-line"/>
        </pattern>
        <!-- faint paper/ink grain on the dark ground -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.62  0 0 0 0 0.56  0 0 0 0 0.40  0 0 0 0.7 0"/>
        </filter>
        <!-- warm candle-glow at the cartouche corner -->
        <radialGradient id="candle" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(201,162,74,.10)"/>
          <stop offset="100%" stop-color="rgba(201,162,74,0)"/>
        </radialGradient>
      </defs>

      <!-- drafting grid + faint ink/paper grain over the dark ground -->
      <rect x="0" y="0" width="1440" height="900" fill="url(#draftgrid)"/>
      <rect x="0" y="0" width="1440" height="900" filter="url(#grain)" opacity=".055"/>
      <!-- candlelit warmth bleeding from the cartouche corner -->
      <rect x="0" y="380" width="900" height="520" fill="url(#candle)"/>

      <!-- sheet frame (double-ruled) + corner registration ticks -->
      <rect x="26" y="26" width="1388" height="848" class="frame"/>
      <rect x="34" y="34" width="1372" height="832" class="frame-inner"/>
      <g class="frame">
        <path d="M26 60 V26 H60"/><path d="M1380 26 H1414 V60"/>
        <path d="M26 840 V874 H60"/><path d="M1380 874 H1414 V840"/>
      </g>

      <!-- ===== compass rose (north-up), top-left ===== -->
      <g transform="translate(120,128)">
        <circle r="44" class="fp-fine" opacity=".5"/>
        <circle r="33" class="fp-fine" opacity=".35"/>
        <path d="M0 -50 L7 -7 L0 0 L-7 -7 Z" fill="var(--ink)" opacity=".9"/>
        <path d="M0 50 L7 7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".7"/>
        <path d="M-50 0 L-7 -7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M50 0 L7 -7 L0 0 L7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M-30 -30 L-5 -5 L-8 -8 Z M30 -30 L5 -5 L8 -8 Z M30 30 L5 5 L8 8 Z M-30 30 L-5 5 L-8 8 Z"
              fill="var(--line-warm)" opacity=".4"/>
        <text x="0" y="-56" text-anchor="middle" class="cart-tick">N</text>
        <text x="0" y="68" text-anchor="middle" class="tick">S</text>
        <text x="62" y="4" text-anchor="middle" class="tick">E</text>
        <text x="-62" y="4" text-anchor="middle" class="tick">W</text>
      </g>

      <!-- ===== scale bar, bottom-right ===== -->
      <g transform="translate(1090,824)">
        <text x="0" y="-9" class="tick">SCALE — RODS</text>
        <rect x="0" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="40" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="80" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="120" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="160" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <text x="0" y="22" class="tick">0</text>
        <text x="78" y="22" class="tick">10</text>
        <text x="158" y="22" class="tick">20</text>
      </g>

      <!-- ===== title cartouche, bottom centre-left ===== -->
      <g transform="translate(118,704)">
        <rect x="0" y="0" width="356" height="118" rx="3" fill="rgba(12,15,23,.72)"
              stroke="var(--line-warm)" stroke-width=".9" opacity=".94"/>
        <rect x="7" y="7" width="342" height="104" rx="2" class="fp-lit" opacity=".4"/>
        <rect x="7" y="7" width="342" height="104" rx="2" class="fp-fine"/>
        <line x1="20" y1="62" x2="336" y2="62" stroke="var(--line-warm)" stroke-width=".6" opacity=".4"/>
        <text x="22" y="34" class="cart-tick">An Estate Plan</text>
        <text x="22" y="55" class="cart-title">The Workshop</text>
        <text x="22" y="82" class="cart-sub">things made for the joy of making them</text>
        <text x="22" y="100" class="tick">SURVEYED BY CLAUDE · DURING LEISURE TIME</text>
      </g>

      <!-- zone labels -->
      <text x="721" y="262" text-anchor="middle" class="tick" fill="var(--brass)" opacity=".8">· THE MANOR HOUSE ·</text>
      <text x="1118" y="150" text-anchor="middle" class="tick" fill="var(--line-warm)" opacity=".6">· THE GROUNDS ·</text>

      <!-- ===== the MANOR HOUSE shell — encloses the four central wings + the east wing,
           so the indoor rooms read as ONE house with named wings (static linework) ===== -->
      <g id="manor">
        <!-- outer house wall (double-line, like a real plan wall section), warm-ink -->
        <rect x="586" y="296" width="270" height="208" rx="3" fill="rgba(13,17,26,.6)"
              stroke="var(--line-warm)" stroke-width="1.6" opacity=".88"/>
        <rect x="592" y="302" width="258" height="196" rx="2" class="fp-lit" opacity=".3"/>
        <rect x="592" y="302" width="258" height="196" rx="2" class="fp-fine"/>
        <!-- central corridor cross -->
        <line x1="721" y1="302" x2="721" y2="498" stroke="var(--line-warm)" stroke-width=".7" opacity=".34"/>
        <line x1="592" y1="400" x2="850" y2="400" stroke="var(--line-warm)" stroke-width=".7" opacity=".34"/>
        <!-- the grand entry on the south wall (a door swing) -->
        <path d="M734 504 h-26" class="fp-line" opacity=".6"/>
        <path d="M708 504 a26 26 0 0 0 26 26" class="fp-fine" opacity=".5"/>
        <!-- dimension run along the south wall -->
        <g opacity=".4">
          <line x1="586" y1="516" x2="856" y2="516" stroke="var(--line-warm)" stroke-width=".5"/>
          <line x1="586" y1="512" x2="586" y2="520" stroke="var(--line-warm)" stroke-width=".5"/>
          <line x1="856" y1="512" x2="856" y2="520" stroke="var(--line-warm)" stroke-width=".5"/>
          <text x="721" y="529" text-anchor="middle" class="tick">— 26 rods —</text>
        </g>
      </g>

      <!-- dashed survey paths from the manor's south door out to each folly on the grounds -->
      <g id="paths"></g>

      <!-- =========================================================
           POIs are injected by script into #pois so the geometry &
           card data live in one declarative table (PLACES). The
           decorative survey furniture above is static.
           ========================================================= -->
      <g id="pois"></g>
    </svg>
  </div>
</div>

<!-- hover card overlay (dark, high-contrast over the map) -->
<div id="card" role="status" aria-live="polite">
  <div class="card-inner">
    <p class="card-room" id="c-room"></p>
    <h2 class="card-name"><span class="ce" id="c-emoji"></span><span id="c-name"></span><small id="c-tag"></small></h2>
    <p class="card-blurb" id="c-blurb"></p>
    <span class="card-within" id="c-within"><span id="c-wemoji"></span>&nbsp;<span>↳ <b id="c-wname"></b> within</span></span>
    <p class="card-open" id="c-open">Open ▸</p>
  </div>
</div>

<!-- margin legend / surveyor's marks (matches the current footer's links) -->

<div class="hint">hover a footprint · click to enter</div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The shared WS unlock module (inlined at build time by forge). Provides the
   `WS` global: WS.seen / WS.store / WS.bootstrap / WS.checkUnlocks, etc.
   Auto-inits on DOMContentLoaded — so if a visitor completes a secret on an
   un-converted page and RETURNS to this front door, the candlelit cue fires
   here as a catch-all. See /UNLOCK.md and tools/ws/README.md. */
<!-- forge:include tools/ws/ws.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   THE PLACES TABLE — the single data array that drives the whole plan.

   THE ESTATE GROWS WITHOUT A REDESIGN: adding a future room = adding ONE entry
   to PLACES (drop a coordinate, pick a footprint). No layout engine — hand-placed
   coords are intentional. A future editor extends the estate by appending here.

   Each entry:
     id        project folder name; WS.seen(id) breadcrumb is written on click
     room      the labelled place ("The Study", "The Gardens · Glasshouse", …)
     piece     the project's proper name ("The Oracle", "Strange Garden", …)
     glyph     the emoji at the footprint's heart
     accent    this POI's own glow colour (hover/focus)
     href      the destination page
     tag       the short mono kicker ("verse engine", "18 games", …)
     blurb     the survey-callout body text (verbatim card content)
     companion optional { name, glyph } — NOT a POI; shown as "↳ <name> within"
     x, y      plan coordinates in the 1440×900 viewBox (top-left of the footprint,
               or the centre for the 'tower' shape)
     footprint how the plan-view shape is drawn — one of the keys in DRAW below:
               'house-wing' | 'tower' | 'glasshouse' | 'maze' | 'arcade' | 'shed' | 'stair'
     w, h / r  footprint dimensions (w×h for rect-ish shapes; r for 'tower')
     label     which side the leader-line + label sits: 'left'|'right'|'top'|'bottom'
     lx, ly    the label anchor point (where the room name is typeset)
     locked    (optional) marks the Undercroft — its visibility/state is gated by
               the ws: unlock logic in revealUndercroft(), NOT drawn unconditionally.
   ════════════════════════════════════════════════════════════════════════════ */
const PLACES = [
  // ----- THE MANOR HOUSE (centre — one enclosing house with named wings) -----
  { id:"verse", room:"The Study", piece:"The Oracle", glyph:"✒️",

const SVGNS = "http://www.w3.org/2000/svg";
const el = (n, attrs) => { const e = document.createElementNS(SVGNS, n);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ── footprint drawers: each appends plan linework into a <g> for one place.
   Every drawer paints a base slab (.fp-fill) + a warm lit lip (.fp-lit) so the
   footprint reads as an inhabited plan, then its own characterful detailing.   */
function drawSlab(g, x, y, w, h, rx){
  g.appendChild(el("rect",{x,y,width:w,height:h,rx:rx==null?1.5:rx,class:"fp-fill"}));
  // a warm lit lip inset 3px (the candlelit edge of the stone)
  g.appendChild(el("rect",{x:x+3,y:y+3,width:w-6,height:h-6,rx:rx==null?1:rx,class:"fp-lit"}));
}
function drawHouseWing(g, r){ // an interior room cell within the manor: slab + subdivision + door swing
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h);
  g.appendChild(el("line",{x1:x+w*0.5,y1:y+8,x2:x+w*0.5,y2:y+h-8,class:"fp-fine"}));
  // a door swing into the central corridor (toward house centre, ~x=721)
  const left = (x < 716);
  const doorX = left ? x+w : x, dir = left ? -1 : 1;
  g.appendChild(el("path",{d:`M${doorX} ${y+h*0.5} h${dir*12}`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${doorX+dir*12} ${y+h*0.5} a12 12 0 0 ${left?1:0} ${dir*-12} -12`,class:"fp-fine"}));
}
function drawEastWing(g, r){ // the taller projecting east wing (Threshold), with a doorway arc facing the house
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  g.appendChild(el("line",{x1:x,y1:y+h*0.33,x2:x+w,y2:y+h*0.33,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.66,x2:x+w,y2:y+h*0.66,class:"fp-fine"}));
  g.appendChild(el("path",{d:`M${x} ${y+h*0.5} h-14`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${x-14} ${y+h*0.5} a14 14 0 0 1 14 -14`,class:"fp-fine"}));
}
function drawGlasshouse(g, r){ // greenhouse: gabled plan with mullion ribs + a quartered parterre (the Tessellarium within)
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<6;i++) g.appendChild(el("line",{x1:x+w*i/6,y1:y,x2:x+w*i/6,y2:y+h,class:"fp-fine"}));
  const px=x+w*0.5-15, py=y+h*0.5-15;
  g.appendChild(el("rect",{x:px,y:py,width:30,height:30,class:"fp-fine"}));
  g.appendChild(el("path",{d:`M${px} ${py} l30 30 M${px+30} ${py} l-30 30`,class:"fp-fine"}));
}
function drawTower(g, r){ // domed observatory tower: concentric circles + dome slit + transit-rim ticks
  const {x,y,r:rad} = r;
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-fill"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad-3,class:"fp-lit"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.64,class:"fp-fine"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.28,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x,y1:y-rad,x2:x,y2:y-rad*0.28,class:"fp-line"}));
  for(let a=0;a<360;a+=30){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad,y1:y+Math.sin(t)*rad,
      x2:x+Math.cos(t)*(rad*0.88),y2:y+Math.sin(t)*(rad*0.88),class:"fp-fine"})); }
}
function drawMaze(g, r){ // hedge maze: nested concentric runs with staggered gaps → reads as a labyrinth
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  for(let i=1;i<=4;i++){
    const inset=15*i, ix=x+inset, iy=y+inset, iw=w-inset*2, ih=h-inset*2;
    if(iw<8||ih<8) break;
    const gap=18, side=i%4; let d;
    if(side===0) d=`M${ix+gap} ${iy} H${ix+iw} V${iy+ih} H${ix} V${iy} H${ix+gap-8}`;
    else if(side===1) d=`M${ix} ${iy} H${ix+iw} V${iy+ih-gap} M${ix+iw} ${iy+ih} H${ix} V${iy}`;
    else if(side===2) d=`M${ix} ${iy} H${ix+iw} V${iy+ih} H${ix+gap} M${ix} ${iy+ih} V${iy}`;
    else d=`M${ix} ${iy+gap} V${iy} H${ix+iw} V${iy+ih} H${ix} V${iy+gap+8}`;
    g.appendChild(el("path",{d,class:"fp-fine"}));
  }
  g.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.5,r:5,class:"fp-line"})); // the goal at heart
}
function drawArcade(g, r){ // covered arched gallery: a colonnade of arches
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const bays=6, bw=w/bays;
  for(let i=0;i<bays;i++){ const bx=x+i*bw;
    g.appendChild(el("path",{d:`M${bx+4} ${y+h} V${y+h*0.5} a${bw/2-4} ${bw/2-4} 0 0 1 ${bw-8} 0 V${y+h}`,class:"fp-fine"})); }
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-fine"}));
}
function drawShed(g, r){ // maker's shed: simple plan + a long workbench + sawtooth north-light roof ticks
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  g.appendChild(el("rect",{x:x+8,y:y+8,width:w-16,height:12,class:"fp-fine"}));
  for(let i=0;i<5;i++){ const sx=x+10+i*(w-20)/5;
    g.appendChild(el("path",{d:`M${sx} ${y+h-10} l10 -10`,class:"fp-fine"})); }
  g.appendChild(el("line",{x1:x,y1:y+h-26,x2:x+w,y2:y+h-26,class:"fp-fine"}));
}
function drawStair(g, r){ // the cellar stair: a small treaded square descending into the dark
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,1);
  for(let i=1;i<5;i++) g.appendChild(el("line",{x1:x,y1:y+h*i/5,x2:x+w,y2:y+h*i/5,class:"fp-line"}));
  // a small down-arrow at the foot, into the abyss
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h-14} v8 M${x+w*0.5-5} ${y+h-9} l5 5 l5 -5`,class:"fp-fine"}));
}
const DRAW = { "house-wing":drawHouseWing, "east-wing":drawEastWing, glasshouse:drawGlasshouse,
  tower:drawTower, maze:drawMaze, arcade:drawArcade, shed:drawShed, stair:drawStair };

/* ── geometry helpers (leader-line origin/edge for a footprint) ── */
function footCentre(r){
  if(r.footprint==="tower") return { cx:r.x, cy:r.y };
  return { cx:r.x + r.w/2, cy:r.y + r.h/2 };
}
function footEdge(r, side){
  if(r.footprint==="tower"){
    const m={left:[r.x-r.r,r.y],right:[r.x+r.r,r.y],top:[r.x,r.y-r.r],bottom:[r.x,r.y+r.r]};
    return m[side];
  }
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  const m={left:[r.x,cy],right:[r.x+r.w,cy],top:[cx,r.y],bottom:[cx,r.y+r.h]};
  return m[side];
}
function footBBox(r){
  if(r.footprint==="tower") return { x:r.x-r.r, y:r.y-r.r, w:r.r*2, h:r.r*2 };
  return { x:r.x, y:r.y, w:r.w, h:r.h };
}

const pois  = document.getElementById("pois");
const paths = document.getElementById("paths");
const card  = document.getElementById("card");
const plan  = document.getElementById("plan");
const stage = document.getElementById("stage");

/* the manor's south door — where every survey path begins */
const MANOR_DOOR = { x:721, y:530 };

/* Build one POI <a> (footprint + glyph + leader + label + card behaviour).
   `asLink` lets the Undercroft be a non-navigating <div> while broken.        */
function buildPoi(r, opts){
  opts = opts || {};
  const asLink = opts.asLink !== false;       // default: a real link
  const a = el(asLink ? "a" : "g", {
    class:"poi"+(r.locked?" undercroft":"")+(opts.extraClass?(" "+opts.extraClass):""),
    style:`--c:${r.accent}` });
  if (asLink){ a.setAttribute("href", r.href); a.setAttribute("tabindex","0");
    a.setAttribute("aria-label", r.room+" — "+r.piece+", "+r.tag); }
  else { a.setAttribute("role","img"); a.setAttribute("aria-label", r.room+" — sealed; the way is lost"); }
  a.dataset.id = r.id;

  // keyboard focus ring around the footprint bbox
  const bb = footBBox(r);
  a.appendChild(el("rect",{ x:bb.x-7, y:bb.y-7, width:bb.w+14, height:bb.h+14,
    rx:4, class:"focusring" }));

  // footprint linework
  const fg = el("g",{});
  DRAW[r.footprint](fg, r);
  a.appendChild(fg);

  // emoji glyph at the footprint's heart
  const {cx,cy} = footCentre(r);
  const gly = el("text",{ x:cx, y:cy+5, "text-anchor":"middle", class:"glyph-emoji" });
  gly.textContent = r.glyph;
  a.appendChild(gly);

  // ---- elbow leader line + label ----
  const [ex,ey] = footEdge(r, r.label);
  const anchor = (r.label==="left")?"end":(r.label==="right")?"start":"middle";
  let path;
  if(r.label==="left") path=`M${ex} ${ey} H${r.lx+6}`;
  else if(r.label==="right") path=`M${ex} ${ey} H${r.lx-6}`;
  else if(r.label==="top") path=`M${ex} ${ey} V${r.ly+14}`;
  else path=`M${ex} ${ey} V${r.ly-26}`;
  a.appendChild(el("path",{ d:path, class:"leader" }));
  a.appendChild(el("circle",{ cx:ex, cy:ey, r:2, class:"leader-dot" }));

  // label block: room name + sub (piece · tag) + optional companion "within"
  const nm = el("text",{ x:r.lx, y:r.ly, "text-anchor":anchor, class:"roomname" });
  nm.textContent = r.room;
  a.appendChild(nm);
  const sub = el("text",{ x:r.lx, y:r.ly+14, "text-anchor":anchor, class:"roomsub" });
  sub.textContent = r.locked
    ? (asLink ? "DESCEND ▾" : "THE WAY IS LOST")
    : (r.piece.toUpperCase()+" · "+r.tag);
  a.appendChild(sub);
  if(r.companion){
    const w = el("text",{ x:r.lx, y:r.ly+27, "text-anchor":anchor, class:"within" });
    w.textContent = "↳ "+r.companion.name+" within";
    a.appendChild(w);
  }

  // ---- card behaviour ----
  const show = ()=> openCard(r, a);
  a.addEventListener("mouseenter", show);
  a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hideCard);
  a.addEventListener("blur", hideCard);

  // record which doors you open — the ws: breadcrumb, via the shared module,
  // written synchronously on click BEFORE the <a> navigates (harmless if storage off).
  if (asLink){
    a.addEventListener("click", ()=>{ try{ WS.seen(r.id); }catch(e){} });
  }

  return a;
}

/* ---- card positioning: place near the hovered footprint, clamped to viewport ---- */
function openCard(r, a){
  document.getElementById("c-room").textContent = r.room;
  document.getElementById("c-emoji").textContent = r.glyph;
  document.getElementById("c-name").textContent = r.piece;
  document.getElementById("c-tag").textContent = r.tag;
  document.getElementById("c-blurb").textContent = r.blurb;
  const wi = document.getElementById("c-within");
  if(r.companion){
    wi.style.display = "inline-flex";
    document.getElementById("c-wemoji").textContent = r.companion.glyph;
    document.getElementById("c-wname").textContent = r.companion.name;
  } else wi.style.display = "none";
  const open = document.getElementById("c-open");
  // the locked-but-broken Undercroft shows no "Open" affordance (there is no way down)
  if(r.locked && a.tagName.toLowerCase() !== "a"){ open.textContent = "the way is lost"; open.style.opacity=".7"; }
  else if(r.locked){ open.textContent = "Descend ▸"; open.style.opacity="0.92"; }
  else { open.textContent = "Open ▸"; open.style.opacity="0.92"; }
  card.style.setProperty("--cc", r.accent);

  // map the footprint's screen bbox → a card position beside it
  const bb = a.getBoundingClientRect();
  card.classList.add("show");                 // make measurable
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let left = bb.right + 14;
  let top  = bb.top;
  if(left + cw > window.innerWidth - 12) left = bb.left - cw - 14;       // flip left
  if(left < 12) left = Math.min(window.innerWidth - cw - 12, Math.max(12, bb.left));
  if(top + ch > window.innerHeight - 12) top = window.innerHeight - ch - 12;
  if(top < 12) top = 12;
  card.style.left = left + "px";
  card.style.top  = top + "px";
}
function hideCard(){ card.classList.remove("show"); }

/* ── render: draw every non-locked place + the dashed survey paths to the follies ── */
function renderEstate(){
  PLACES.forEach(r=>{
    if(r.locked) return;                       // the Undercroft is gated; handled below
    pois.appendChild(buildPoi(r));
    // a dashed survey path from the manor door to each piece on the grounds / outbuilding
    const inManor = (r.x >= 586 && r.x <= 856 && r.y >= 296 && r.y <= 504);
    if(!inManor){
      const {cx,cy} = footCentre(r);
      const midx = (MANOR_DOOR.x + cx)/2, midy = Math.max(MANOR_DOOR.y, cy) + 30;
      paths.appendChild(el("path",{ class:"survey-path",
        d:`M${MANOR_DOOR.x} ${MANOR_DOOR.y} Q${midx} ${midy} ${cx} ${cy}` }));
    }
  });
}
renderEstate();

/* ── responsive: on screens narrower than the plan, centre the pan on the manor ── */
function centreManor(){
  if(plan.offsetWidth > stage.clientWidth)
    stage.scrollLeft = (plan.offsetWidth - stage.clientWidth) * 0.46;
  if(plan.offsetHeight > stage.clientHeight)
    stage.scrollTop = (plan.offsetHeight - stage.clientHeight) * 0.30;
}
window.addEventListener("resize", ()=>{ centreManor(); hideCard(); });
centreManor();

/* ════════════════════════════════════════════════════════════════════════════
   THE UNDERCROFT — the hidden way down, ported faithfully from the previous front
   door and reimagined as a cellar-stair POI on the plan. The eligibility, the
   three states (broken → rune → whole), the first-appearance grow + opening flag,
   and graceful degradation are PRESERVED EXACTLY. Reads ws: via WS.store().
   See /UNLOCK.md. ════════════════════════════════════════════════════════════ */
(function revealUndercroft(){
  const UC = "undercroft/index.html";
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const data = PLACES.find(p=>p.locked);
  if(!data) return;

  // ---- read storage (eligibility unchanged from the old rune) ----
  let distinct = 0, alreadyEarned = false, runeFound = false, openingSeen = false;
  const store = WS.store();
  if(!store.ok) return;                          // storage off → show nothing extra (room still reachable by URL)
  try{
    const seen = new Set();
    for(const k in store.all){ if(k.indexOf("ws:seen:")===0) seen.add(k); }
    distinct = seen.size;
    alreadyEarned =
      (store.has("ws:seen:game-of-life") && store.has("ws:seen:lattice"))
      || store.has("ws:flag:eleven");
    // a returning visitor who has already reached the Undercroft (by either mechanism) is "found"
    runeFound = store.has("ws:seen:undercroft-rune") || store.has("ws:seen:undercroft");
    openingSeen = store.has("ws:seen:undercroft-opening");
  }catch(e){ return; }
  if(distinct < 4 && !alreadyEarned) return;
  const set = (k)=>{ try{ localStorage.setItem(k, String(Date.now())); }catch(e){} };

  // place the Undercroft POI (whole+navigable if found, else broken+sealed)
  let tile = buildPoi(data, { asLink:runeFound, extraClass: runeFound ? "" : "broken" });
  pois.appendChild(tile);
  // a dashed survey path also threads down to the cellar stair from the manor door
  const ucCentre = footCentre(data);
  paths.appendChild(el("path",{ class:"survey-path",
    d:`M${MANOR_DOOR.x} ${MANOR_DOOR.y} L${ucCentre.cx} ${ucCentre.cy}` }));

  if(runeFound){
    // State B: whole stair, functional, steady. (No animation; it's just there.)
  } else {
    // State A: broken stair, not navigable. First appearance → grow from nothing.
    if(!openingSeen && !reduced){
      tile.classList.add("grow");
      tile.addEventListener("animationend", function once(ev){
        if(ev.animationName !== "ucgrow") return;
        tile.removeEventListener("animationend", once);
        tile.classList.remove("grow");
        set("ws:seen:undercroft-opening");
      });
    } else {
      set("ws:seen:undercroft-opening");        // already opened before (or reduced motion) → static
    }
  }

  // ---- the margin rune ----
  const legend = document.querySelector(".legend");
  if(!legend) return;
  const rune = document.createElement("a");
  rune.className = "rune";
  rune.href = runeFound ? UC : "#";              // before repair it doesn't navigate; after, harmless
  rune.title = runeFound ? "the way down is open" : "something glints in the dark — a rune";
  rune.innerHTML = '<span class="gl">✦</span><span class="lbl"> the undercroft</span>';
  legend.appendChild(rune);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    rune.classList.add("show");
    if(runeFound) rune.classList.add("found");   // quiet steady mark, no pulse
  }));

  if(!runeFound){
    rune.addEventListener("click", function(ev){
      ev.preventDefault();
      if(rune.dataset.done) return;
      rune.dataset.done = "1";
      set("ws:seen:undercroft-rune");            // (1) repair the stair (persist)
      rune.classList.add("found");               // rune settles to a quiet steady mark
      // (2) replace the broken POI with a working, whole one (animate the repair)
      const fresh = buildPoi(data, { asLink:true, extraClass: reduced ? "" : "repairing" });
      tile.parentNode.replaceChild(fresh, tile);
      tile = fresh;
      rune.href = UC; rune.title = "the way down is open";
      if(!reduced){
        tile.addEventListener("animationend", function done(ev2){
          if(ev2.animationName !== "ucrepair") return;
          tile.removeEventListener("animationend", done);
          tile.classList.remove("repairing");
        });
      }
    });
  }
})();
</script>
</body>
</html>
