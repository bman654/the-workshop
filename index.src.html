<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Workshop — an Estate Plan</title>
<style>
  :root{
    /* ---- house tokens (the workshop's dark aesthetic) ---- */
    --bg:#080a0f; --ink:#eaf0fa; --muted:#8b95a8; --brass:#c9a24a; --brass-bright:#f0d489;
    /* drafting linework laid as warm ink on the dark ground */
    --line:#7884a0;          /* hairline ink (slightly brighter for presence) */
    --line-soft:#414c66;     /* faint drafting grid */
    --line-warm:#b29a64;     /* brass-tinted plan linework (footprints) — warmer & more present */
    --line-warm-d:#8d7a4e;   /* a dimmer warm ink for fine detail */
    --paper:#10141f;         /* footprint fill (a touch lifted from the ground) */
    --paper-lit:#1a2230;     /* lit edge of a footprint slab */
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }
  /* atmosphere: a warm candlelit core pooling at the manor + cool light bleed over the
     grounds, with a deep edge-vignette so the plate feels lamplit & contained. The warm
     core sits centre (the inhabited house); the dark gathers toward the margins. */
  body{ background:
    radial-gradient(1180px 760px at 51% 45%, rgba(201,162,74,.085), transparent 60%),
    radial-gradient(1500px 980px at 50% 44%, rgba(95,150,196,.045), transparent 64%),
    radial-gradient(760px 560px at 20% 78%, rgba(120,150,120,.045), transparent 60%),
    radial-gradient(760px 560px at 82% 30%, rgba(120,110,180,.045), transparent 60%),
    radial-gradient(1500px 1500px at 50% 50%, transparent 52%, rgba(2,3,6,.62) 100%),
    var(--bg); }

  .stage{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; }
  .plan{ position:relative; width:100%; height:100%; min-width:1040px; min-height:700px;
    display:block; }
  svg.sheet{ width:100%; height:100%; display:block; }

  /* a slow drifting candle-haze over the whole plate (behind the linework) — warm light
     gathered at the manor, a cool wash drifting over the grounds. */
  .haze{ position:fixed; inset:-12%; z-index:0; pointer-events:none; opacity:.95;
    background:
      radial-gradient(540px 420px at 50% 46%, rgba(201,162,74,.085), transparent 66%),
      radial-gradient(620px 460px at 27% 70%, rgba(110,150,120,.05), transparent 64%),
      radial-gradient(560px 420px at 76% 30%, rgba(95,150,196,.05), transparent 64%); }
  @keyframes hazedrift{
    0%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(-2.2%,1.6%,0); }
    100%{ transform:translate3d(0,0,0); } }
  .haze{ animation:hazedrift 38s ease-in-out infinite; }

  /* ---- drafting type ---- */
  .tick{ font:600 9.5px/1 var(--mono); letter-spacing:.18em; fill:var(--muted);
    text-transform:uppercase; }
  /* room name: a clear engraved serif, with a faint dark backing so it reads off the grid */
  .roomname{ font:500 16.5px/1 var(--serif); fill:#f3f7ff; letter-spacing:.012em;
    paint-order:stroke; stroke:rgba(6,8,13,.72); stroke-width:3px; stroke-linejoin:round; }
  .roomsub{ font:600 9px/1 var(--mono); letter-spacing:.15em; fill:#9aa4b8;
    text-transform:uppercase; paint-order:stroke; stroke:rgba(6,8,13,.6); stroke-width:2.4px; }
  /* a faint accent kicker rule that tints the label in its wing's colour */
  .roomrule{ stroke:var(--c); stroke-width:1.4; opacity:.5; transition:opacity .3s ease; }
  .cart-title{ font:500 28px/1 var(--serif); fill:var(--ink); letter-spacing:.02em; }
  .cart-sub{ font:italic 12.5px/1 var(--serif); fill:var(--muted); }
  .cart-tick{ font:600 9px/1 var(--mono); letter-spacing:.26em; fill:var(--brass);
    text-transform:uppercase; }

  /* hairlines */
  .grid-line{ stroke:var(--line-soft); stroke-width:.5; opacity:.30; }
  .frame{ fill:none; stroke:var(--line); stroke-width:1; opacity:.6; }
  .frame-inner{ fill:none; stroke:var(--line); stroke-width:.6; opacity:.46; }
  /* the faint parkland / property boundary — a surveyed pale read around the estate */
  .estate-bound{ fill:none; stroke:var(--line-warm); stroke-width:1; opacity:.22;
    stroke-dasharray:10 5 2 5; stroke-linecap:round; }

  /* dashed survey paths linking the manor to each folly (warm ink) — tree-lined avenues */
  .survey-path{ fill:none; stroke:var(--line-warm); stroke-width:1.2; opacity:.34;
    stroke-dasharray:2 6; stroke-linecap:round; }
  .avenue-tree{ fill:var(--line-warm); opacity:.4; }

  /* footprints — a POI is an <a>; .fp* are its plan linework, given warm relief */
  .poi{ cursor:pointer; outline:none; }
  /* a very subtle per-wing accent wash on the floor of each footprint (reads at a glance
     as an inhabited, tinted plan; lifts to its full accent on hover) */
  .fp-floor{ fill:color-mix(in srgb, var(--c) 9%, var(--paper)); stroke:none; opacity:.9;
    transition:fill .3s ease, opacity .3s ease; }
  .fp-fill{ fill:var(--paper); stroke:var(--line-warm); stroke-width:1.5; opacity:.98;
    transition:stroke .3s ease, fill .3s ease, filter .35s ease; }
  .fp-lit{ fill:none; stroke:var(--brass); stroke-width:.8; opacity:.3;
    transition:stroke .3s ease, opacity .3s ease; }   /* a warm lit lip on the plan slab */
  .fp-line{ fill:none; stroke:var(--line-warm); stroke-width:1.1; opacity:.72;
    transition:stroke .3s ease, opacity .3s ease; }
  .fp-fine{ fill:none; stroke:var(--line-warm-d); stroke-width:.7; opacity:.6;
    transition:stroke .3s ease, opacity .3s ease; }
  /* a small warm lamp glow at the heart of each footprint (candlelit from inside) */
  .fp-lamp{ fill:var(--brass); opacity:.16; transition:opacity .35s ease, fill .35s ease; }
  .leader{ stroke:var(--line); stroke-width:.8; opacity:.58; fill:none;
    transition:stroke .3s ease, opacity .3s ease; }
  .leader-dot{ fill:var(--line); opacity:.7; transition:fill .3s ease; }
  .glyph-emoji{ font-size:17px; opacity:.96; transition:filter .35s ease;
    paint-order:stroke; }

  /* hover / focus — the POI's footprint lifts and glows in its own accent */
  .poi:hover .fp-floor, .poi:focus-visible .fp-floor{
    fill:color-mix(in srgb, var(--c) 26%, var(--paper-lit)); opacity:1; }
  .poi:hover .fp-fill, .poi:focus-visible .fp-fill{
    stroke:var(--c); fill:color-mix(in srgb, var(--c) 16%, var(--paper-lit));
    filter:drop-shadow(0 0 11px color-mix(in srgb,var(--c) 70%,transparent)); }
  .poi:hover .fp-lit, .poi:focus-visible .fp-lit{ stroke:var(--c); opacity:.6; }
  .poi:hover .fp-lamp, .poi:focus-visible .fp-lamp{ fill:var(--c); opacity:.4; }
  .poi:hover .fp-line, .poi:focus-visible .fp-line,
  .poi:hover .fp-fine, .poi:focus-visible .fp-fine{ stroke:var(--c); opacity:.95; }
  .poi:hover .leader, .poi:focus-visible .leader{ stroke:var(--c); opacity:.9; }
  .poi:hover .leader-dot, .poi:focus-visible .leader-dot{ fill:var(--c); opacity:1; }
  .poi:hover .roomrule, .poi:focus-visible .roomrule{ opacity:1; }
  .poi:hover .roomname, .poi:focus-visible .roomname{ fill:#fff; }
  .poi:hover .roomsub, .poi:focus-visible .roomsub{ fill:var(--c); }
  .poi:hover .glyph-emoji, .poi:focus-visible .glyph-emoji{
    filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 80%,transparent)); }
  /* visible keyboard focus ring around the whole footprint group */
  .poi:focus-visible .focusring{ opacity:1; }
  .focusring{ fill:none; stroke:var(--c); stroke-width:1; stroke-dasharray:3 3;
    opacity:0; transition:opacity .2s ease; rx:4; }

  /* companion mark: a small "within" tick that surfaces on hover */
  .within{ font:600 8px/1 var(--mono); letter-spacing:.12em; fill:var(--muted);
    text-transform:uppercase; opacity:0; transition:opacity .3s ease; }
  .poi:hover .within, .poi:focus-visible .within{ opacity:.85; }

  /* ---- the Undercroft POI states (the locked way down) ---- */
  /* BROKEN: a sealed cellar stair — faint, dashed, NOT navigable */
  .undercroft.broken{ cursor:default; }
  .undercroft.broken .fp-fill{ opacity:.5; }
  .undercroft.broken .fp-line{ stroke-dasharray:3 3; }
  .undercroft.broken:hover .fp-fill, .undercroft.broken:focus-visible .fp-fill{
    stroke:var(--brass); fill:color-mix(in srgb,var(--brass) 8%,var(--paper));
    filter:drop-shadow(0 0 7px rgba(201,162,74,.34)); }
  .undercroft.broken .lostmark{ font:italic 8px/1 var(--serif); fill:var(--muted);
    opacity:.8; text-transform:none; letter-spacing:0; }
  /* first-appearance grow (the POI fades + scales up from its centre once) */
  .undercroft.grow{ animation:ucgrow 2.4s cubic-bezier(.2,.7,.2,1) both; transform-box:fill-box;
    transform-origin:center; }
  @keyframes ucgrow{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  /* the repair sweep when the rune is clicked (broken → whole) */
  .undercroft.repairing .fp-line{ animation:ucrepair 1.2s ease-out both; }
  @keyframes ucrepair{ from{ opacity:0; } to{ opacity:.62; } }

  /* ---- hover card (HTML overlay positioned over the plan) — dark, contrasty ---- */
  #card{ position:absolute; z-index:40; width:288px; pointer-events:none;
    opacity:0; transform:translateY(6px) scale(.985); transform-origin:top left;
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
  #card.show{ opacity:1; transform:none; }
  .card-inner{ position:relative; padding:15px 17px 16px; border-radius:6px;
    background:linear-gradient(180deg, rgba(13,16,24,.975), rgba(8,10,15,.985));
    border:1px solid color-mix(in srgb,var(--cc) 44%,rgba(255,255,255,.10));
    box-shadow:0 26px 64px -22px rgba(0,0,0,.88), 0 0 46px -22px var(--cc);
    backdrop-filter:blur(3px); }
  /* corner ticks — like a survey callout box */
  .card-inner::before, .card-inner::after{ content:""; position:absolute; width:10px; height:10px;
    border:1px solid color-mix(in srgb,var(--cc) 72%,transparent); }
  .card-inner::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card-inner::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card-room{ font:600 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 7px; }
  .card-name{ font:500 19px/1.15 var(--serif); color:var(--ink); margin:0;
    display:flex; align-items:baseline; gap:9px; }
  .card-name .ce{ font-size:17px; }
  .card-name small{ font:600 9px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase;
    color:var(--cc); }
  .card-blurb{ margin:9px 0 0; font:13px/1.52 var(--serif); color:#c4ccda; }
  .card-within{ margin:11px 0 0; display:inline-flex; align-items:center; gap:6px;
    font:600 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:5px 10px 5px 8px;
    border:1px solid color-mix(in srgb,var(--cc) 28%,rgba(255,255,255,.08));
    border-radius:999px; background:rgba(255,255,255,.025); }
  .card-within b{ color:color-mix(in srgb,var(--cc) 80%,var(--muted)); font-weight:600; }
  .card-open{ margin:11px 0 0; font:600 9px/1 var(--mono); letter-spacing:.16em;
    text-transform:uppercase; color:var(--cc); opacity:.92; }

  /* ---- margin legend (HTML, fixed corner) — matches the current footer's links ---- */
  .legend{ position:fixed; left:20px; bottom:16px; z-index:30; max-width:62vw;
    font:11px/1.7 var(--mono); color:var(--muted); letter-spacing:.04em; }
  .legend .craft{ display:block; opacity:.5; margin-bottom:5px; font-size:10px; }
  .legend a{ color:var(--muted); text-decoration:none;
    border-bottom:1px solid rgba(139,149,168,.3); transition:color .25s, border-color .25s; }
  .legend a:hover{ color:var(--brass); border-color:var(--brass); }
  .legend .sep{ opacity:.4; margin:0 5px; }

  /* the hidden mark — once you've wandered enough it appears in the margin: a slow-pulsing,
     glowing rune that draws the eye. It is the thing the Undercroft POI tells you to look for.
     Absent until earned. Ported from the current front door's `.rune`. See /UNLOCK.md */
  .rune{ display:inline-block; text-decoration:none; color:var(--brass); opacity:0;
    pointer-events:none; transition:opacity .9s ease, color .3s, text-shadow .6s; }
  .rune::before{ content:"·"; margin:0 9px; opacity:.5; color:var(--muted); }
  .rune.show{ pointer-events:auto; animation:runepulse 2.4s ease-in-out infinite; }
  @keyframes runepulse{
    0%,100%{ opacity:.4; text-shadow:0 0 6px rgba(201,162,74,.25); }
    50%{ opacity:1; text-shadow:0 0 16px rgba(201,162,74,.6), 0 0 30px rgba(201,162,74,.25); } }
  .rune:hover{ opacity:1 !important; color:var(--brass-bright); text-shadow:0 0 18px rgba(201,162,74,.7); }
  /* found & repaired: a quiet, steady confirmation mark — no pulse */
  .rune.found{ animation:none; opacity:.7; }
  .rune .gl{ font-size:15px; }
  .rune .lbl{ font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    opacity:0; transition:opacity .4s; }
  .rune:hover .lbl{ opacity:.9; }

  .hint{ position:fixed; right:20px; top:16px; z-index:30;
    font:600 9px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); opacity:.55; }

  /* ---- THE SURVEY OF HEAVEN — a personal night sky in the plate's dark margins.
     The <g.sky> is inserted as the FIRST child of #sheet, so the stars sit "in
     the paper" behind the grid & footprints. A lit star is a small, softly
     twinkling point; the asterism lines are hairlines that brighten to brass once
     their wing is charted; the engraved names sit in the margin like surveyor's
     marginalia. Monotone, cosmetic, never gated. See tools/sky/. ---- */
  .sky{ pointer-events:none; }
  /* a kindled star: a soft warm-white point with a faint halo, gently twinkling */
  .sky-star{ fill:#eaf0fa; opacity:.78;
    filter:drop-shadow(0 0 3px rgba(234,240,250,.5));
    animation:skytwinkle 4s ease-in-out infinite; }
  .sky-star.mag1{ fill:#fbf3df; opacity:.92;
    filter:drop-shadow(0 0 5px rgba(240,212,137,.55)); }   /* a wing's bright lead */
  .sky-star.mag3{ opacity:.6; }
  /* a CHARTED star (member of a completed asterism): warmed to brass with a stronger
     halo, so the named constellation's line visibly terminates on two real stars */
  .sky-star.charted{ fill:var(--brass-bright); opacity:1;
    filter:drop-shadow(0 0 6px rgba(201,162,74,.75)); }
  @keyframes skytwinkle{ 0%,100%{ opacity:.85; } 46%{ opacity:.5; } 72%{ opacity:1; } }
  /* asterism line: a faint cool hairline while partial; warms to brass when charted */
  .asterism-line{ fill:none; stroke:var(--line); stroke-width:.7; opacity:.22;
    stroke-linecap:round; stroke-linejoin:round;
    transition:stroke .8s ease, opacity .8s ease, stroke-width .8s ease; }
  .asterism-line.complete{ stroke:var(--brass); stroke-width:1; opacity:.62;
    filter:drop-shadow(0 0 4px rgba(201,162,74,.4)); }
  /* a faint brass tie from an engraved name to its nearest charted star — the same
     draughting idiom the room labels use (every POI label has a leader to its room),
     so a named constellation reads as ONE unit instead of a label + a line that both
     seem to point at nothing. Hairline, dashed, quiet; warms with the name. */
  .an-leader{ fill:none; stroke:var(--brass); stroke-width:.7; opacity:.42;
    stroke-dasharray:2.5 3; stroke-linecap:round;
    filter:drop-shadow(0 0 2px rgba(201,162,74,.35)); }
  /* the engraved asterism NAME + its one-line myth, set as margin marginalia */
  .asterism-name{ pointer-events:none; }
  .asterism-name .an-name{ font:italic 12.5px/1 var(--serif); fill:var(--brass-bright);
    letter-spacing:.01em; paint-order:stroke; stroke:rgba(6,8,13,.66); stroke-width:2.6px;
    stroke-linejoin:round; }
  .asterism-name .an-myth{ font:italic 8.5px/1.3 var(--serif); fill:#bcae8a;
    paint-order:stroke; stroke:rgba(6,8,13,.55); stroke-width:1.8px; }
  /* a small brass tick under the engraved name */
  .asterism-name .an-rule{ stroke:var(--brass); stroke-width:.8; opacity:.5; }
  /* the name fades+rises in the FIRST time its wing is charted (steady thereafter) */
  .asterism-name.named-in{ animation:skyname 1.6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes skyname{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  /* the margin tally — quiet surveyor's mono, like the scale-bar ticks */
  .sky-tally{ font:600 8.5px/1 var(--mono); letter-spacing:.2em; fill:var(--brass);
    text-transform:uppercase; opacity:.5; }
  /* the all-skies capstone: a whisper-faint warm lift over the charted plate */
  .sky.all-charted .sky-tally{ opacity:.78; fill:var(--brass-bright); }

  @media (prefers-reduced-motion:reduce){
    .haze{ animation:none; }
    .fp-fill,.fp-line,.fp-fine,.fp-lit,.fp-floor,.fp-lamp,.roomrule,.leader,.leader-dot,.glyph-emoji,.within,#card,.focusring{ transition:none; }
    .undercroft.grow{ animation:none; opacity:1; transform:none; }
    .undercroft.repairing .fp-line{ animation:none; }
    .rune.show{ animation:none; opacity:.8; text-shadow:0 0 10px rgba(201,162,74,.4); }
    /* a STATIC sky: no twinkle, no name-in animation, transitions off */
    .sky-star{ animation:none; }
    .asterism-line{ transition:none; }
    .asterism-name.named-in{ animation:none; opacity:1; transform:none; }
  }
  @media (max-width:640px){
    .hint{ display:none; }
    .legend{ font-size:10px; max-width:none; left:12px; bottom:10px; }
    #card{ width:248px; }
  }
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="plan" id="plan">
    <!-- The sheet is a 1440x900 surveyor's plate; it scales to fill the viewport
         (xMidYMid meet) and pans inside .stage on small screens. -->
    <svg class="sheet" id="sheet" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="The Workshop — an estate plan. Each labelled point of interest is a link to a room.">
      <defs>
        <!-- the base cool drafting grid (faint, present everywhere) -->
        <pattern id="draftgrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0 H0 V40" class="grid-line"/>
        </pattern>
        <!-- a warmer, finer grid that we fade IN near the manor (the surveyed, inhabited core)
             and OUT toward the margins, via the warmgrid radial mask below -->
        <pattern id="warmgrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0 H0 V20" fill="none" stroke="var(--line-warm)" stroke-width=".4" opacity=".5"/>
        </pattern>
        <!-- faint paper/ink grain on the dark ground -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.62  0 0 0 0 0.56  0 0 0 0 0.40  0 0 0 0.7 0"/>
        </filter>
        <!-- coarse stipple/ink-speckle so the dark ground reads as paper, not flat black -->
        <filter id="stipple" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="turbulence" baseFrequency="0.012 0.012" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.50  0 0 0 0 0.46  0 0 0 0 0.34  0 0 0 0.9 -0.30"/>
        </filter>
        <!-- warm candle-glow pooled at the MANOR (lamplit-from-inside) -->
        <radialGradient id="candle" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(201,162,74,.16)"/>
          <stop offset="45%" stop-color="rgba(201,162,74,.07)"/>
          <stop offset="100%" stop-color="rgba(201,162,74,0)"/>
        </radialGradient>
        <!-- a radial alpha mask: white (visible) at the manor → transparent at the margins.
             We paint the warm grid through it so the inhabited core is more present. -->
        <radialGradient id="coreFade" cx="50%" cy="45%" r="42%">
          <stop offset="0%"  stop-color="#fff"/>
          <stop offset="55%" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="coreMask">
          <rect x="0" y="0" width="1440" height="900" fill="url(#coreFade)"/>
        </mask>
      </defs>

      <!-- the dark ground given paper-grain + a coarse ink stipple (not flat black) -->
      <rect x="0" y="0" width="1440" height="900" filter="url(#stipple)" opacity=".05"/>
      <!-- base cool drafting grid, then a warmer denser grid faded in at the manor core -->
      <rect x="0" y="0" width="1440" height="900" fill="url(#draftgrid)"/>
      <rect x="0" y="0" width="1440" height="900" fill="url(#warmgrid)" mask="url(#coreMask)" opacity=".7"/>
      <rect x="0" y="0" width="1440" height="900" filter="url(#grain)" opacity=".05"/>
      <!-- candlelit warmth pooled at the manor (centre of the plate) -->
      <rect x="421" y="150" width="600" height="600" fill="url(#candle)"/>

      <!-- the parkland / property boundary — one estate, with rounded park corners -->
      <rect x="78" y="80" width="1284" height="744" rx="46" class="estate-bound"/>

      <!-- sheet frame (double-ruled) + corner registration ticks -->
      <rect x="26" y="26" width="1388" height="848" class="frame"/>
      <rect x="34" y="34" width="1372" height="832" class="frame-inner"/>
      <g class="frame">
        <path d="M26 60 V26 H60"/><path d="M1380 26 H1414 V60"/>
        <path d="M26 840 V874 H60"/><path d="M1380 874 H1414 V840"/>
      </g>

      <!-- ===== compass rose (north-up), top-left ===== -->
      <g transform="translate(120,128)">
        <circle r="44" class="fp-fine" opacity=".5"/>
        <circle r="33" class="fp-fine" opacity=".35"/>
        <path d="M0 -50 L7 -7 L0 0 L-7 -7 Z" fill="var(--ink)" opacity=".9"/>
        <path d="M0 50 L7 7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".7"/>
        <path d="M-50 0 L-7 -7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M50 0 L7 -7 L0 0 L7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M-30 -30 L-5 -5 L-8 -8 Z M30 -30 L5 -5 L8 -8 Z M30 30 L5 5 L8 8 Z M-30 30 L-5 5 L-8 8 Z"

const SVGNS = "http://www.w3.org/2000/svg";
const el = (n, attrs) => { const e = document.createElementNS(SVGNS, n);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ── footprint drawers: each appends plan linework into a <g> for one place.
   Every drawer paints an accent floor-wash (.fp-floor) + a base slab (.fp-fill) +
   a warm lit lip (.fp-lit), so the footprint reads as an inhabited, tinted plan at
   a glance, then its own characterful surveyed detailing.                        */
function drawSlab(g, x, y, w, h, rx){
  const r = rx==null?1.5:rx;
  // the per-wing accent floor wash (very subtle; lifts to full accent on hover)
  g.appendChild(el("rect",{x:x+1,y:y+1,width:w-2,height:h-2,rx:r,class:"fp-floor"}));
  g.appendChild(el("rect",{x,y,width:w,height:h,rx:r,class:"fp-fill"}));
  // a warm lit lip inset 3px (the candlelit edge of the stone)
  g.appendChild(el("rect",{x:x+3,y:y+3,width:w-6,height:h-6,rx:rx==null?1:r,class:"fp-lit"}));
}
function drawHouseWing(g, r){ // an interior room cell within the manor: slab + subdivision + furniture + door swing
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h);
  // a cross-wall subdivision so the room reads as two chambers
  g.appendChild(el("line",{x1:x+w*0.5,y1:y+8,x2:x+w*0.5,y2:y+h-8,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+8,y1:y+h*0.5,x2:x+w-8,y2:y+h*0.5,class:"fp-fine",opacity:".4"}));
  // surveyed "furniture" pips — a hearth on the outer wall + a small table
  const outerX = (x<716) ? x+5 : x+w-5;
  g.appendChild(el("rect",{x:outerX-(x<716?0:7),y:y+h*0.5-7,width:7,height:14,class:"fp-fine",opacity:".45"}));
  // a door swing into the central corridor (toward house centre, ~x=721)
  const left = (x < 716);
  const doorX = left ? x+w : x, dir = left ? -1 : 1;
  g.appendChild(el("path",{d:`M${doorX} ${y+h*0.5} h${dir*12}`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${doorX+dir*12} ${y+h*0.5} a12 12 0 0 ${left?1:0} ${dir*-12} -12`,class:"fp-fine"}));
}
function drawEastWing(g, r){ // the taller projecting east wing (Threshold): floors, bay windows, a doorway arc
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // three floor levels
  g.appendChild(el("line",{x1:x,y1:y+h*0.33,x2:x+w,y2:y+h*0.33,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.66,x2:x+w,y2:y+h*0.66,class:"fp-fine"}));
  // a projecting bay on the east face (three window mullions)
  g.appendChild(el("path",{d:`M${x+w} ${y+h*0.4} h10 v${h*0.2} h-10`,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+w+3,y1:y+h*0.4,x2:x+w+3,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  g.appendChild(el("line",{x1:x+w+7,y1:y+h*0.4,x2:x+w+7,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  // the doorway arc facing the house
  g.appendChild(el("path",{d:`M${x} ${y+h*0.5} h-14`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${x-14} ${y+h*0.5} a14 14 0 0 1 14 -14`,class:"fp-fine"}));
}
function drawGlasshouse(g, r){ // greenhouse: gabled plan, mullion grid, knot-parterre + topiary (the Tessellarium within)
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the gable ridge + a long mullion grid (glass house)
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<8;i++) g.appendChild(el("line",{x1:x+w*i/8,y1:y,x2:x+w*i/8,y2:y+h,class:"fp-fine",opacity:".42"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.25,x2:x+w,y2:y+h*0.25,class:"fp-fine",opacity:".34"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.75,x2:x+w,y2:y+h*0.75,class:"fp-fine",opacity:".34"}));
  // a knot-parterre at the heart: a diamond-quartered square (the Tessellarium)
  const cx=x+w*0.5, cy=y+h*0.5, s=Math.min(w,h)*0.24;
  g.appendChild(el("rect",{x:cx-s,y:cy-s,width:s*2,height:s*2,class:"fp-line",opacity:".55"}));
  g.appendChild(el("path",{d:`M${cx} ${cy-s} L${cx+s} ${cy} L${cx} ${cy+s} L${cx-s} ${cy} Z`,class:"fp-fine"}));
  g.appendChild(el("path",{d:`M${cx-s} ${cy-s} l${s*2} ${s*2} M${cx+s} ${cy-s} l${-s*2} ${s*2}`,class:"fp-fine",opacity:".4"}));
  // topiary dots along the front beds
  g.appendChild(el("g",{}));
  const bedY=y+h-7, topi=g.lastChild;
  for(let i=0;i<6;i++) topi.appendChild(el("circle",{cx:x+w*(i+0.5)/6,cy:bedY,r:3.4,class:"fp-fine",opacity:".5"}));
}
function drawTower(g, r){ // domed observatory tower: concentric drum, radial dome ribs, a slit + transit-rim ticks
  const {x,y,r:rad} = r;
  // floor wash + drum
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-floor"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-fill"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad-3,class:"fp-lit"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.66,class:"fp-fine"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.30,class:"fp-fine"}));
  // radial dome ribs (12 spokes) — reads as a ribbed cupola
  for(let a=0;a<360;a+=30){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad*0.30,y1:y+Math.sin(t)*rad*0.30,
      x2:x+Math.cos(t)*(rad-2),y2:y+Math.sin(t)*(rad-2),class:"fp-fine",opacity:".4"})); }
  // the dome slit (a wedge to the north) + the transit telescope line
  g.appendChild(el("path",{d:`M${x-5} ${y} L${x-3} ${y-rad+2} L${x+3} ${y-rad+2} L${x+5} ${y} Z`,
    class:"fp-line",opacity:".7"}));
  g.appendChild(el("line",{x1:x,y1:y,x2:x,y2:y-rad*0.62,class:"fp-line"}));
  // transit-rim graduation ticks
  for(let a=0;a<360;a+=15){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad,y1:y+Math.sin(t)*rad,
      x2:x+Math.cos(t)*(rad-5),y2:y+Math.sin(t)*(rad-5),class:"fp-fine"})); }
}
function drawMaze(g, r){ // hedge maze: a denser, genuinely traceable concentric labyrinth with one true path
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // a hedge-green floor read so the maze sits in a planted enclosure
  g.appendChild(el("rect",{x:x+4,y:y+4,width:w-8,height:h-8,fill:"rgba(127,209,199,.04)",stroke:"none"}));
  // six nested rectangular hedge runs, each with a staggered opening → reads as walkable
  const step=Math.min(w,h)/14;
  for(let i=1;i<=6;i++){
    const ins=step*i, ix=x+ins, iy=y+ins, iw=w-ins*2, ih=h-ins*2;
    if(iw<10||ih<10) break;
    const gap=Math.max(12,step*1.4), side=i%4; let d;
    if(side===0) d=`M${ix+gap} ${iy} H${ix+iw} V${iy+ih} H${ix} V${iy} H${ix+gap-8}`;
    else if(side===1) d=`M${ix} ${iy} H${ix+iw} V${iy+ih-gap} M${ix+iw} ${iy+ih} H${ix} V${iy}`;
    else if(side===2) d=`M${ix} ${iy} H${ix+iw} V${iy+ih} H${ix+gap} M${ix} ${iy+ih} V${iy}`;
    else d=`M${ix} ${iy+gap} V${iy} H${ix+iw} V${iy+ih} H${ix} V${iy+gap+8}`;
    g.appendChild(el("path",{d,class:"fp-fine",opacity:".62"}));
  }
  // the entrance gap on the south edge + the goal rosette at heart
  g.appendChild(el("path",{d:`M${x+w*0.5-7} ${y+h} v-6 M${x+w*0.5+7} ${y+h} v-6`,class:"fp-line"}));
  g.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.5,r:6,class:"fp-line"}));
  g.appendChild(el("circle",{cx:x+w*0.5,cy:y+h*0.5,r:2.5,class:"fp-fine"}));
}
function drawArcade(g, r){ // covered arched gallery: a long colonnade of arches with a stylobate + entablature
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const bays=9, bw=w/bays;
  // entablature line (the arcade's top course) + the springing line
  g.appendChild(el("line",{x1:x+3,y1:y+h*0.28,x2:x+w-3,y2:y+h*0.28,class:"fp-fine",opacity:".5"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.52,x2:x+w,y2:y+h*0.52,class:"fp-fine"}));
  // the colonnade of round-headed arches
  for(let i=0;i<bays;i++){ const bx=x+i*bw;
    g.appendChild(el("path",{d:`M${bx+3} ${y+h} V${y+h*0.52} a${bw/2-3} ${bw/2-3} 0 0 1 ${bw-6} 0 V${y+h}`,
      class:"fp-fine",opacity:".6"})); }
  // a stylobate (the step the columns stand on)
  g.appendChild(el("line",{x1:x,y1:y+h-4,x2:x+w,y2:y+h-4,class:"fp-fine",opacity:".4"}));
}
function drawShed(g, r){ // maker's shed: plan + long workbench + a sawtooth north-light roof + a chimney
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the long workbench against the north wall
  g.appendChild(el("rect",{x:x+8,y:y+8,width:w-16,height:13,class:"fp-fine",opacity:".55"}));
  // a sawtooth (north-light) roof reading across the body
  for(let i=0;i<6;i++){ const sx=x+10+i*(w-20)/6;
    g.appendChild(el("path",{d:`M${sx} ${y+h-12} l9 -9 v9`,class:"fp-fine",opacity:".5"})); }
  g.appendChild(el("line",{x1:x,y1:y+h-30,x2:x+w,y2:y+h-30,class:"fp-fine",opacity:".4"}));
  // the shed door on the south face + a stack/chimney pip at the ridge
  g.appendChild(el("path",{d:`M${x+w*0.5-9} ${y+h} v-2 h18 v2`,class:"fp-line"}));
  g.appendChild(el("rect",{x:x+w-22,y:y-6,width:9,height:9,class:"fp-line",opacity:".7"})); // chimney
}
function drawStair(g, r){ // the cellar stair: a small treaded square descending into the dark
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,1);
  for(let i=1;i<5;i++) g.appendChild(el("line",{x1:x,y1:y+h*i/5,x2:x+w,y2:y+h*i/5,class:"fp-line"}));
  // a small down-arrow at the foot, into the abyss
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h-14} v8 M${x+w*0.5-5} ${y+h-9} l5 5 l5 -5`,class:"fp-fine"}));
}
const DRAW = { "house-wing":drawHouseWing, "east-wing":drawEastWing, glasshouse:drawGlasshouse,
  tower:drawTower, maze:drawMaze, arcade:drawArcade, shed:drawShed, stair:drawStair };

/* ── geometry helpers (leader-line origin/edge for a footprint) ── */
function footCentre(r){
  if(r.footprint==="tower") return { cx:r.x, cy:r.y };
  return { cx:r.x + r.w/2, cy:r.y + r.h/2 };
}
function footEdge(r, side){
  if(r.footprint==="tower"){
    const m={left:[r.x-r.r,r.y],right:[r.x+r.r,r.y],top:[r.x,r.y-r.r],bottom:[r.x,r.y+r.r]};
    return m[side];
  }
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  const m={left:[r.x,cy],right:[r.x+r.w,cy],top:[cx,r.y],bottom:[cx,r.y+r.h]};
  return m[side];
}
function footBBox(r){
  if(r.footprint==="tower") return { x:r.x-r.r, y:r.y-r.r, w:r.r*2, h:r.r*2 };
  return { x:r.x, y:r.y, w:r.w, h:r.h };
}

const pois  = document.getElementById("pois");
const paths = document.getElementById("paths");
const card  = document.getElementById("card");
const plan  = document.getElementById("plan");
const stage = document.getElementById("stage");

/* a registry mapping each POI element → its label-render parts, so placeLabels()
   (which runs once after every present POI is built) can measure each label group,
   move it to the engine-solved slot, set its text-anchor, and redraw its leader. */
const LABELS = new Map();

/* the manor's south door — where every survey path begins */
const MANOR_DOOR = { x:721, y:530 };

/* Build one POI <a> (footprint + glyph + leader + label + card behaviour).
   `asLink` lets the Undercroft be a non-navigating <div> while broken.        */
function buildPoi(r, opts){
  opts = opts || {};
  const asLink = opts.asLink !== false;       // default: a real link
  const a = el(asLink ? "a" : "g", {
    class:"poi"+(r.locked?" undercroft":"")+(opts.extraClass?(" "+opts.extraClass):""),
    style:`--c:${r.accent}` });
  if (asLink){ a.setAttribute("href", r.href); a.setAttribute("tabindex","0");
    a.setAttribute("aria-label", r.room+" — "+r.piece+", "+r.tag); }
  else { a.setAttribute("role","img"); a.setAttribute("aria-label", r.room+" — sealed; the way is lost"); }
  a.dataset.id = r.id;

  // keyboard focus ring around the footprint bbox
  const bb = footBBox(r);
  a.appendChild(el("rect",{ x:bb.x-7, y:bb.y-7, width:bb.w+14, height:bb.h+14,
    rx:4, class:"focusring" }));

  // footprint linework
  const fg = el("g",{});
  DRAW[r.footprint](fg, r);
  a.appendChild(fg);

  // a soft warm lamp glow at the footprint's heart (candlelit from inside),
  // behind the glyph — lifts to the wing's accent on hover. Skipped for the
  // broken cellar stair (it is dark until the way is restored).
  const {cx,cy} = footCentre(r);
  if(!(r.locked && opts.extraClass==="broken")){
    a.appendChild(el("circle",{ cx, cy, r:13, class:"fp-lamp" }));
  }

  // emoji glyph at the footprint's heart
  const gly = el("text",{ x:cx, y:cy+5, "text-anchor":"middle", class:"glyph-emoji" });
  gly.textContent = r.glyph;
  a.appendChild(gly);

  // ---- leader line + label group ----
  // The leader is drawn from the footprint edge to the label; the label sits in
  // its own <g.labelgroup> typeset at a LOCAL origin (roomname baseline at 0,0)
  // so placeLabels() can translate the whole block to the engine-solved slot and
  // flip its text-anchor as one unit. The leader is (re)drawn from the footprint
  // boundary to the label's nearest edge once the slot is known.
  const leaderPath = el("path",{ class:"leader" });
  const leaderDot  = el("circle",{ r:2, class:"leader-dot" });
  a.appendChild(leaderPath);
  a.appendChild(leaderDot);

  const lg = el("g",{ class:"labelgroup" });
  // room name (local origin)
  const nm = el("text",{ x:0, y:0, "text-anchor":"start", class:"roomname" });
  nm.textContent = r.room;
  lg.appendChild(nm);
  // a short accent kicker rule under the room name
  const rule = el("line",{ x1:0, y1:5, x2:26, y2:5, class:"roomrule" });
  lg.appendChild(rule);
  // sub (piece · tag) — or the Undercroft's state line
  const sub = el("text",{ x:0, y:18, "text-anchor":"start", class:"roomsub" });
  sub.textContent = r.locked
    ? (asLink ? "DESCEND ▾" : "THE WAY IS LOST")
    : (r.piece.toUpperCase()+" · "+r.tag);
  lg.appendChild(sub);
  // optional companion "within" indicator
  let within = null;
  if(r.companion){
    within = el("text",{ x:0, y:33, "text-anchor":"start", class:"within" });
    within.textContent = "↳ "+r.companion.name+" within";
    lg.appendChild(within);
  }
  a.appendChild(lg);

  // hand the registry everything placeLabels() needs to measure, position the
  // label group, set its text-anchor, and (re)draw the leader for this POI.
  LABELS.set(a, { r, group:lg, leader:leaderPath, dot:leaderDot,
                  texts:[nm, sub].concat(within?[within]:[]), rule });

  // ---- card behaviour ----
  const show = ()=> openCard(r, a);
  a.addEventListener("mouseenter", show);
  a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hideCard);
  a.addEventListener("blur", hideCard);

  // record which doors you open — the ws: breadcrumb, via the shared module,
  // written synchronously on click BEFORE the <a> navigates (harmless if storage off).
  if (asLink){
    a.addEventListener("click", ()=>{ try{ WS.seen(r.id); }catch(e){} });
  }

  return a;
}

/* ---- card positioning: place near the hovered footprint, clamped to viewport ---- */
function openCard(r, a){
  document.getElementById("c-room").textContent = r.room;
  document.getElementById("c-emoji").textContent = r.glyph;
  document.getElementById("c-name").textContent = r.piece;
  document.getElementById("c-tag").textContent = r.tag;
  document.getElementById("c-blurb").textContent = r.blurb;
  const wi = document.getElementById("c-within");
  if(r.companion){
    wi.style.display = "inline-flex";
    document.getElementById("c-wemoji").textContent = r.companion.glyph;
    document.getElementById("c-wname").textContent = r.companion.name;
  } else wi.style.display = "none";
  const open = document.getElementById("c-open");
  // the locked-but-broken Undercroft shows no "Open" affordance (there is no way down)
  if(r.locked && a.tagName.toLowerCase() !== "a"){ open.textContent = "the way is lost"; open.style.opacity=".7"; }
  else if(r.locked){ open.textContent = "Descend ▸"; open.style.opacity="0.92"; }
  else { open.textContent = "Open ▸"; open.style.opacity="0.92"; }
  card.style.setProperty("--cc", r.accent);

  // map the footprint's screen bbox → a card position beside it
  const bb = a.getBoundingClientRect();
  card.classList.add("show");                 // make measurable
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let left = bb.right + 14;
  let top  = bb.top;
  if(left + cw > window.innerWidth - 12) left = bb.left - cw - 14;       // flip left
  if(left < 12) left = Math.min(window.innerWidth - cw - 12, Math.max(12, bb.left));
  if(top + ch > window.innerHeight - 12) top = window.innerHeight - ch - 12;
  if(top < 12) top = 12;
  card.style.left = left + "px";
  card.style.top  = top + "px";
}
function hideCard(){ card.classList.remove("show"); }

/* ── a tree-lined survey avenue: a faint dashed quadratic path from the manor door to a
   target, flanked by small paired tree-dots so the open ground reads as planted grounds.
   Trees are placed along the curve's normal, skipping the ends (door / building).      */
function drawAvenue(x0,y0, cx,cy, mx,my, opts){
  opts = opts || {};
  paths.appendChild(el("path",{ class:"survey-path",
    d:`M${x0} ${y0} Q${mx} ${my} ${cx} ${cy}` }));
  if(opts.trees===false) return;
  const Q = t => {                              // point on the quadratic Bézier at t
    const u=1-t;
    return [ u*u*x0 + 2*u*t*mx + t*t*cx, u*u*y0 + 2*u*t*my + t*t*cy ];
  };
  const dQ = t => {                             // tangent (for the perpendicular offset)
    return [ 2*(1-t)*(mx-x0) + 2*t*(cx-mx), 2*(1-t)*(my-y0) + 2*t*(cy-my) ];
  };
  const N = opts.count==null ? 4 : opts.count, off = opts.off==null ? 11 : opts.off;
  for(let i=1;i<=N;i++){
    const t = 0.16 + (i/(N+1))*0.7;             // skip the door & the building ends
    const [px,py] = Q(t); const [tx,ty] = dQ(t);
    const len = Math.hypot(tx,ty) || 1; const nx=-ty/len, ny=tx/len;
    pois && paths.appendChild(el("circle",{ cx:px+nx*off, cy:py+ny*off, r:2.6, class:"avenue-tree" }));
    paths.appendChild(el("circle",{ cx:px-nx*off, cy:py-ny*off, r:2.6, class:"avenue-tree" }));
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   AUTOMATIC LABEL PLACEMENT — the plan letters itself with the LabelPlacer engine.

   Each POI's name is built (by buildPoi) into a <g.labelgroup> typeset at a local
   origin; placeLabels() measures every such group, then asks LabelPlacer.solve()
   for a layout in which no label overlaps another label, any footprint, or the
   fixed plan furniture, and all stay inside the frame. The curated `prefer` side
   on each PLACES entry SEEDS the solver, so the hand-composed look is the starting
   point and only colliding labels move. A FIXED SEED makes the layout identical on
   every visit. The viewBox scales uniformly, so we solve ONCE (never on resize).
   ════════════════════════════════════════════════════════════════════════════ */

/* the fixed plan furniture the labels must never cover (viewBox bboxes), beyond
   the footprints themselves. Tuned against the static SVG above.
   NOTE: the manor-house SHELL is deliberately NOT an obstacle here — the four wing
   footprints inside it ARE obstacles, and they collectively guard the manor's
   interior (an outward-pushed wing label that tried to fall inward would land on a
   neighbouring wing and be rejected). Adding the whole 270×208 shell instead would
   wall off the wings' own labels from ever escaping the house. */
const FURNITURE = [
  { x:74,  y:82,  w:92,  h:92  },   // the compass rose (top-left)
  { x:1086,y:798, w:212, h:52  },   // the scale bar (bottom-right)
  { x:100, y:686, w:384, h:148 },   // the engraved title cartouche ("The Workshop")
  { x:631, y:252, w:180, h:18  },   // zone label · THE MANOR HOUSE ·
  { x:1057,y:140, w:124, h:18  },   // zone label · THE GROUNDS ·
];
/* the inner frame, inset a little so no label kisses the ruled border. */
const LABEL_BOUNDS = { x:46, y:52, w:1348, h:790 };
/* solver params — a fixed seed → deterministic layout; LABEL_GAP is the constant
   leader breathing-room margin ADDED to each footprint's half-extent (see labelGap)
   so a label always clears the building it names. */
const LABEL_SEED = 0x5EED;
const LABEL_GAP  = 14;
/* getBBox returns GEOMETRY only (no stroke); the roomname/sub carry a ~3px dark
   backing stroke, so we inflate the measured box by PAD on every side to keep that
   halo clear of neighbours, then translate accounting for the same inflation. */
const LABEL_PAD  = 3;

/* the per-POI solved placement, keyed by id, so a POI rebuilt after the solve
   (the Undercroft on rune-click: broken→whole) can REUSE its placement. */
const SOLVED = new Map();

/* side → text-anchor: a label left of its dot right-aligns toward the plan; right
   of its dot left-aligns; above/below reads centred. (Diagonals follow their E/W.) */
function sideToAnchor(side){
  if(side==="left"||side==="nw"||side==="sw") return "end";
  if(side==="right"||side==="ne"||side==="se") return "start";
  return "middle"; // top | bottom
}

/* lay out a label group's text + kicker rule for a chosen text-anchor, all about
   the group's LOCAL x=0 (roomname baseline at local y=0). The box {w,h} is the
   same whatever the anchor, so we can measure once and re-anchor freely. */
function applyAnchor(parts, anchor){
  parts.texts.forEach(t=> t.setAttribute("text-anchor", anchor));
  let rx1, rx2;
  if(anchor==="end"){ rx1=-26; rx2=0; }
  else if(anchor==="middle"){ rx1=-13; rx2=13; }
  else { rx1=0; rx2=26; }
  parts.rule.setAttribute("x1", rx1);
  parts.rule.setAttribute("x2", rx2);
}

/* position ONE label group at a solved label-box {x,y,w,h} + side, and (re)draw
   its leader from the footprint boundary to the label's nearest edge. */
function applyPlacement(parts, box, side){
  const anchor = sideToAnchor(side);
  applyAnchor(parts, anchor);
  // measure the (re-anchored) block in local coords, then translate so the inflated
  // box's top-left (geometry top-left minus PAD) lands on the solved rectangle.
  const bb = parts.group.getBBox();
  const tx = box.x - (bb.x - LABEL_PAD), ty = box.y - (bb.y - LABEL_PAD);
  parts.group.setAttribute("transform", `translate(${tx} ${ty})`);
  // the label rect in viewBox coords (what the leader must reach)
  const rect = { x:box.x, y:box.y, w:box.w, h:box.h };
  const fb = footBBox(parts.r);
  const {cx,cy} = footCentre(parts.r);
  // leader: from the footprint's boundary (toward the label) to the label's nearest
  // edge — a clean straight draughting line, side-agnostic.
  const lend = LabelPlacer.geom.nearestEdgePoint(cx, cy, rect);   // on the label
  const fstart = LabelPlacer.geom.nearestEdgePoint(lend[0], lend[1], fb); // on the footprint
  parts.leader.setAttribute("d", `M${fstart[0]} ${fstart[1]} L${lend[0]} ${lend[1]}`);
  parts.dot.setAttribute("cx", fstart[0]);
  parts.dot.setAttribute("cy", fstart[1]);
}

/* normalise a PLACES `prefer` hint (string | array | undefined) into a ranked list. */
function preferList(r){
  if(!r.prefer) return undefined;
  return Array.isArray(r.prefer) ? r.prefer.slice() : [r.prefer];
}

/* The label ANCHOR is the footprint's CENTRE — the natural focus the leader points
   back to. The engine's candidate slots sit `gap` away from the anchor on each
   side, so to keep a label off its OWN footprint we size the gap to the footprint's
   half-extent (below), letting every slot clear the building it names. */
function labelAnchor(r){
  const c = footCentre(r);
  return { x:c.cx, y:c.cy };
}

/* Per-feature GAP: the breathing room between the anchor (footprint centre) and the
   label box. Sized to clear the footprint's own half-extent on every side, plus a
   constant margin — so a label seats just OUTSIDE the structure it names, with a
   short, clean leader, whichever side the engine chooses. */
function labelGap(r){
  const b = footBBox(r);
  return Math.max(b.w, b.h) / 2 + LABEL_GAP;
}

/* ── THE SURVEY OF HEAVEN: engraved-asterism-name labels ───────────────────────
   The Sky module draws the stars, asterism lines, and the margin tally; the
   ENGRAVED NAMES of charted asterisms are routed through the SAME LabelPlacer
   pass as the POI labels, so a name can never collide with a room label, a
   footprint, or the plan furniture. We build each charted asterism's name <g>
   (typeset at a LOCAL origin like a roomname group), register it in SKY_LABELS,
   and placeLabels() adds it as a solver feature anchored at the wing's star-pair
   midpoint (out in the dark margin, beside its stars). */
const SKY_LABELS = new Map();   // wingId → { group, anchor:{x,y}, prefer, firstTime }

/* Curated BERTHS for the engraved asterism names: a roomy dark-margin anchor near
   each wing's stars + an inward side preference (toward the open plate, away from
   the frame). Each name is then tied to its constellation by a faint leader to the
   nearest charted star (added 2026-06-13 — proximity + shared brass ALONE read as
   "a label and a line both pointing at nothing", which fooled even the site's owner
   into reporting a bug; the leader makes the named sky legible as one unit, matching
   the leader every POI label already draws). The SAME solver keeps every name clear
   of POI labels, footprints, and furniture; the solver still adapts the exact side. */
const SKY_BERTH = {
  celestial: { x:130, y:470, prefer:['bottom','se','right'] },  // left band, below the tower
  letters:   { x:455, y:104, prefer:['top','left','bottom'] },  // top band, left of the manor
  design:    { x:990, y:104, prefer:['top','right','bottom'] }, // top band, right of the manor
  realm:     { x:120, y:560, prefer:['bottom','se','right'] },  // left band, below the map room
  garden:    { x:560, y:806, prefer:['bottom','right','top'] }, // bottom band, right of the cartouche
  labyrinth: { x:1316,y:500, prefer:['bottom','se','right'] }   // right band, above the maze
};

/* (re)build the engraved-name groups for the currently-charted asterisms from the
   sky <g> the module produced (it carries __skyNamed + __skyState). Returns the
   sky <g>, or null if no sky was drawn. */
function buildSkyNames(skyG){
  SKY_LABELS.clear();
  if(!skyG || !skyG.__skyNamed || !skyG.__skyState) return skyG || null;
  const named = skyG.__skyNamed;          // [{ ast, firstTime }]
  named.forEach(({ ast, firstTime })=>{
    // anchor: this wing's curated margin berth (fallback: the star-pair midpoint)
    const berth = SKY_BERTH[ast.id];
    let anchor, prefer;
    if(berth){ anchor = { x:berth.x, y:berth.y }; prefer = berth.prefer; }
    else {
      let sx=0, sy=0, n=0;
      ast.members.forEach(mid=>{ const c = Sky.CATALOG[mid]; if(c){ sx+=c.x; sy+=c.y; n++; } });
      if(!n) return;
      anchor = { x:sx/n, y:sy/n };
    }
    // this wing's lit member-star coords — the leader ties the name to the nearest one
    const stars = ast.members.map(mid=> Sky.CATALOG[mid]).filter(Boolean)
                             .map(c=> ({ x:c.x, y:c.y }));
    // a faint tie-line from the name to its constellation (drawn UNDER the name text)
    const leader = el("path",{ class:"an-leader" });
    skyG.appendChild(leader);
    // the engraved name block, typeset at a local origin (name baseline at 0,0)
    const lg = el("g",{ class:"asterism-name"+(firstTime?" named-in":""), "data-wing":ast.id });
    const nm = el("text",{ x:0, y:0, "text-anchor":"start", class:"an-name" });
    nm.textContent = ast.name;
    lg.appendChild(nm);
    const rule = el("line",{ x1:0, y1:5, x2:30, y2:5, class:"an-rule" });
    lg.appendChild(rule);
    const myth = el("text",{ x:0, y:18, "text-anchor":"start", class:"an-myth" });
    myth.textContent = ast.myth;
    lg.appendChild(myth);
    skyG.appendChild(lg);                  // lives inside the sky layer (in the paper)
    SKY_LABELS.set(ast.id, { group:lg, leader, stars, anchor, prefer, firstTime });
  });
  return skyG;
}

/* position ONE asterism-name group at a solved label-box {x,y} + side (anchor flip),
   then draw its faint leader to the nearest charted star so the name and its
   constellation read as a single engraved unit. */
function applySkyName(parts, box, side){
  const anchor = (side==="left"||side==="nw"||side==="sw") ? "end"
               : (side==="right"||side==="ne"||side==="se") ? "start" : "middle";
  parts.group.querySelectorAll("text").forEach(t=> t.setAttribute("text-anchor", anchor));
  const rule = parts.group.querySelector(".an-rule");
  if(rule){ if(anchor==="end"){ rule.setAttribute("x1",-30); rule.setAttribute("x2",0); }
    else if(anchor==="middle"){ rule.setAttribute("x1",-15); rule.setAttribute("x2",15); }
    else { rule.setAttribute("x1",0); rule.setAttribute("x2",30); } }
  const bb = parts.group.getBBox();
  const tx = box.x - (bb.x - LABEL_PAD), ty = box.y - (bb.y - LABEL_PAD);
  parts.group.setAttribute("transform", `translate(${tx} ${ty})`);
  // tie the name to its constellation: a faint leader from the name box's nearest edge
  // to the NEAREST charted star, stopping just shy of the star's glow (the same
  // draughting idiom every room label uses — so a named sky reads as one whole unit).
  if(parts.leader && parts.stars && parts.stars.length){
    const rect = { x:box.x, y:box.y, w:box.w, h:box.h };
    const cx = box.x + box.w/2, cy = box.y + box.h/2;
    let best = parts.stars[0], bestD = Infinity;
    parts.stars.forEach(s=>{ const d=(s.x-cx)*(s.x-cx)+(s.y-cy)*(s.y-cy); if(d<bestD){ bestD=d; best=s; } });
    const start = LabelPlacer.geom.nearestEdgePoint(best.x, best.y, rect);   // on the name box
    const dx = best.x - start[0], dy = best.y - start[1], len = Math.hypot(dx,dy) || 1;
    if(len < 14){
      // the name already abuts its star — a stub would read as a glitch, so let the
      // proximity + the brightened anchor-star carry the tie (no leader drawn).
      parts.leader.setAttribute("d", "");
    } else {
      const end = [ best.x - dx/len*4, best.y - dy/len*4 ];   // 4px shy of the star centre
      parts.leader.setAttribute("d", `M${start[0]} ${start[1]} L${end[0]} ${end[1]}`);
    }
  }
}

/* solve + apply labels. TWO independent passes so the POI layout is INVARIANT to
   sky state (adding sky features must never perturb a room label):

     PASS 1 — the POI labels. EXACTLY the baseline solve (same features, obstacles,
              seed) → byte-identical layout whether or not any asterism is charted.
     PASS 2 — the engraved asterism names, solved SEPARATELY with the already-solved
              POI label rects added as obstacles (plus footprints + furniture). The
              names route cleanly around the fixed POI labels; they cannot disturb
              them. Skipped entirely when no asterism is charted.

   Runs once, after the Undercroft reveal so a revealed cellar-stair label is part
   of pass 1. Returns the merged overlap count (pass1 + pass2). */
function placeLabels(){
  if(typeof LabelPlacer === "undefined" || !LABELS.size) return;
  const entries = [];            // [{ a, parts, w, h }] — w/h inflated by 2*PAD
  LABELS.forEach((parts, a)=>{
    const bb = parts.group.getBBox();
    entries.push({ a, parts, w:bb.width + 2*LABEL_PAD, h:bb.height + 2*LABEL_PAD });
  });

  // obstacles = every present footprint + the fixed plan furniture
  const footObstacles = entries.map(e=> footBBox(e.parts.r));
  const obstacles = footObstacles.concat(FURNITURE);

  const features = entries.map(e=>{
    const r = e.parts.r;
    const f = { id:r.id, anchor:labelAnchor(r), label:{ w:e.w, h:e.h }, gap:labelGap(r) };
    const pref = preferList(r);
    if(pref) f.prefer = pref;
    if(r.pin) f.pin = r.pin;       // a forced placement the engine honours as-is
    return f;
  });

  // ── PASS 1: the POI labels (identical to baseline — sky state cannot touch this) ──
  const spec = { bounds:LABEL_BOUNDS, features, obstacles, seed:LABEL_SEED };
  let res = LabelPlacer.solve(Object.assign({ positions:8 }, spec));
  if(res.overlaps > 0){
    const alt = LabelPlacer.solve(Object.assign({ positions:4 }, spec));
    if(alt.overlaps < res.overlaps) res = alt;
  }
  const byId = {};
  entries.forEach(e=>{ byId[e.parts.r.id] = e; });
  const poiLabelRects = [];        // the solved POI label boxes — obstacles for pass 2
  res.placements.forEach(p=>{
    const e = byId[p.id]; if(!e) return;
    SOLVED.set(p.id, { box:p.label, side:p.side });
    applyPlacement(e.parts, p.label, p.side);
    poiLabelRects.push({ x:p.label.x, y:p.label.y, w:p.label.w, h:p.label.h });
  });
  let totalOverlaps = res.overlaps;

  // ── PASS 2: the engraved asterism names, around the now-fixed POI labels ──
  if(SKY_LABELS.size){
    const skyEntries = [];         // [{ wingId, parts, w, h }]
    const skyFeatures = [];
    SKY_LABELS.forEach((info, wingId)=>{
      const bb = info.group.getBBox();
      const w = bb.width + 2*LABEL_PAD, h = bb.height + 2*LABEL_PAD;
      skyEntries.push({ wingId, parts:info, w, h });
      const f = { id:"sky:"+wingId, anchor:info.anchor, label:{ w, h }, gap:14 };
      if(info.prefer) f.prefer = info.prefer;
      skyFeatures.push(f);
    });
    // obstacles for the names = footprints + furniture + every solved POI label
    const skyObstacles = obstacles.concat(poiLabelRects);
    const skySpec = { bounds:LABEL_BOUNDS, features:skyFeatures, obstacles:skyObstacles, seed:LABEL_SEED };
    let skyRes = LabelPlacer.solve(Object.assign({ positions:8 }, skySpec));
    if(skyRes.overlaps > 0){
      const alt = LabelPlacer.solve(Object.assign({ positions:4 }, skySpec));
      if(alt.overlaps < skyRes.overlaps) skyRes = alt;
    }
    const skyById = {};
    skyEntries.forEach(e=>{ skyById["sky:"+e.wingId] = e; });
    skyRes.placements.forEach(p=>{
      const se = skyById[p.id]; if(!se) return;
      applySkyName(se.parts, p.label, p.side);
    });
    totalOverlaps += skyRes.overlaps;
  }

  return { overlaps: totalOverlaps, placements: res.placements };
}

/* ── render: draw every non-locked place + the tree-lined survey avenues to the follies ── */
const sheet = document.getElementById("sheet");
function renderEstate(){
  PLACES.forEach(r=>{
    if(r.locked) return;                       // the Undercroft is gated; handled below
    pois.appendChild(buildPoi(r));
    // a tree-lined survey avenue from the manor door to each piece on the grounds / outbuilding
    const inManor = (r.x >= 586 && r.x <= 856 && r.y >= 296 && r.y <= 504);
    if(!inManor){
      const {cx,cy} = footCentre(r);
      const midx = (MANOR_DOOR.x + cx)/2, midy = Math.max(MANOR_DOOR.y, cy) + 30;
      drawAvenue(MANOR_DOOR.x, MANOR_DOOR.y, cx, cy, midx, midy);
    }
  });
  // ── THE SURVEY OF HEAVEN — kindle the personal night sky from the ws: breadcrumbs.
  //    Bootstrap first (silence already-charted wings for returning visitors), then
  //    draw the stars + asterism lines + tally as the first child of #sheet (in the
  //    paper, behind the plan), and build the charted-asterism NAME groups so the
  //    final placeLabels() pass solves them alongside the POI labels. Degrades to
  //    nothing if storage is off (renderInto returns null). ──
  if(typeof Sky !== "undefined" && sheet){
    try{
      // bootstrap FIRST (may set sky-<id>-named for wings already charted before this
      // feature existed), THEN take a FRESH store snapshot so renderInto sees those
      // flags — so a returning visitor gets NO retroactive name-in animation.
      Sky.bootstrap(WS.store());
      const skyG = Sky.renderInto(sheet, PLACES, WS.store());
      buildSkyNames(skyG);
    }catch(e){ /* the sky is cosmetic — never let it break the plan */ }
  }
}
renderEstate();

/* ── responsive: on screens narrower than the plan, centre the pan on the manor ── */
function centreManor(){
  if(plan.offsetWidth > stage.clientWidth)
    stage.scrollLeft = (plan.offsetWidth - stage.clientWidth) * 0.46;
  if(plan.offsetHeight > stage.clientHeight)
    stage.scrollTop = (plan.offsetHeight - stage.clientHeight) * 0.30;
}
window.addEventListener("resize", ()=>{ centreManor(); hideCard(); });
centreManor();

/* ════════════════════════════════════════════════════════════════════════════
   THE UNDERCROFT — the hidden way down, ported faithfully from the previous front
   door and reimagined as a cellar-stair POI on the plan. The eligibility, the
   three states (broken → rune → whole), the first-appearance grow + opening flag,
   and graceful degradation are PRESERVED EXACTLY. Reads ws: via WS.store().
   See /UNLOCK.md. ════════════════════════════════════════════════════════════ */
(function revealUndercroft(){
  const UC = "undercroft/index.html";
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const data = PLACES.find(p=>p.locked);
  if(!data) return;

  // ---- read storage (eligibility unchanged from the old rune) ----
  let distinct = 0, alreadyEarned = false, runeFound = false, openingSeen = false;
  const store = WS.store();
  if(!store.ok) return;                          // storage off → show nothing extra (room still reachable by URL)
  try{
    const seen = new Set();
    for(const k in store.all){ if(k.indexOf("ws:seen:")===0) seen.add(k); }
    distinct = seen.size;
    alreadyEarned =
      (store.has("ws:seen:game-of-life") && store.has("ws:seen:lattice"))
      || store.has("ws:flag:eleven");
    // a returning visitor who has already reached the Undercroft (by either mechanism) is "found"
    runeFound = store.has("ws:seen:undercroft-rune") || store.has("ws:seen:undercroft");
    openingSeen = store.has("ws:seen:undercroft-opening");
  }catch(e){ return; }
  if(distinct < 4 && !alreadyEarned) return;
  const set = (k)=>{ try{ localStorage.setItem(k, String(Date.now())); }catch(e){} };

  // place the Undercroft POI (whole+navigable if found, else broken+sealed)
  let tile = buildPoi(data, { asLink:runeFound, extraClass: runeFound ? "" : "broken" });
  pois.appendChild(tile);
  // a dashed survey path also threads down to the cellar stair from the manor door
  const ucCentre = footCentre(data);
  paths.appendChild(el("path",{ class:"survey-path",
    d:`M${MANOR_DOOR.x} ${MANOR_DOOR.y} L${ucCentre.cx} ${ucCentre.cy}` }));

  if(runeFound){
    // State B: whole stair, functional, steady. (No animation; it's just there.)
  } else {
    // State A: broken stair, not navigable. First appearance → grow from nothing.
    if(!openingSeen && !reduced){
      tile.classList.add("grow");
      tile.addEventListener("animationend", function once(ev){
        if(ev.animationName !== "ucgrow") return;
        tile.removeEventListener("animationend", once);
        tile.classList.remove("grow");
        set("ws:seen:undercroft-opening");
      });
    } else {
      set("ws:seen:undercroft-opening");        // already opened before (or reduced motion) → static
    }
  }

  // ---- the margin rune ----
  const legend = document.querySelector(".legend");
  if(!legend) return;
  const rune = document.createElement("a");
  rune.className = "rune";
  rune.href = runeFound ? UC : "#";              // before repair it doesn't navigate; after, harmless
  rune.title = runeFound ? "the way down is open" : "something glints in the dark — a rune";
  rune.innerHTML = '<span class="gl">✦</span><span class="lbl"> the undercroft</span>';
  legend.appendChild(rune);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    rune.classList.add("show");
    if(runeFound) rune.classList.add("found");   // quiet steady mark, no pulse
  }));

  if(!runeFound){
    rune.addEventListener("click", function(ev){
      ev.preventDefault();
      if(rune.dataset.done) return;
      rune.dataset.done = "1";
      set("ws:seen:undercroft-rune");            // (1) repair the stair (persist)
      rune.classList.add("found");               // rune settles to a quiet steady mark
      // (2) replace the broken POI with a working, whole one (animate the repair)
      const fresh = buildPoi(data, { asLink:true, extraClass: reduced ? "" : "repairing" });
      LABELS.delete(tile);                         // retire the broken tile's label parts
      tile.parentNode.replaceChild(fresh, tile);
      tile = fresh;
      // reuse the cellar-stair's already-solved label slot so the whole stair's name
      // lands exactly where the broken one's did (no re-solve, no layout shift).
      const placed = SOLVED.get(data.id);
      if(placed){ const fp = LABELS.get(fresh); if(fp) applyPlacement(fp, placed.box, placed.side); }
      else { placeLabels(); }                      // fallback: solver hadn't run (shouldn't happen)
      rune.href = UC; rune.title = "the way down is open";
      if(!reduced){
        tile.addEventListener("animationend", function done(ev2){
          if(ev2.animationName !== "ucrepair") return;
          tile.removeEventListener("animationend", done);
          tile.classList.remove("repairing");
        });
      }
    });
  }
})();

/* ── all present POIs (manor wings, follies, the outbuilding, and — if revealed —
   the cellar stair) are now in the DOM and registered; let the plan letter itself.
   Solved ONCE: the viewBox scales uniformly, so the layout holds at every size. */
placeLabels();
</script>
