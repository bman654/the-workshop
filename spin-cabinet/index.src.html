<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════════
     THE SPIN CABINET — a walnut display case with six sunk niches, one for each
     of the estate's things that stay up only because they are turning.

     THE TAKE: the shadow is the instrument. There is no HUD here, no readout, no
     stat pill and no proof chip — every niche shows you the OBJECT, lit by its
     own lamp, and its own points flattened onto the stage floor as its shadow.
     You read the physics off the shadow, or off the thing itself, or not at all.
     The case makes NO claim; each theorem stays proved in the room it lives in,
     and the brass plate under each niche is the door to that room.

     HONESTY — every panel is driven by its room's SHIPPED core.mjs, inlined here
     by forge and wrapped in an IIFE (all six cores would otherwise fight over
     the same top-level names: M, G, R, A, B, deriv, integrate…). The panel
     drivers live in panels.mjs, injected with those cores, so panels.test.mjs
     drives EXACTLY the physics this page renders.

     STAGING — the cores model the flow, not the spin bleed. Each panel adds one
     coast-down rate and one timescale of the MAKER's, named in panels.mjs.
     PANEL TIME IS NOT ROOM TIME. Read the physics in the room.
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spin Cabinet — things that won't fall over</title>
<style>
  :root{
    --ink:#eaf0fa; --ink-dim:#9aa6bd;
    --brass:#c9a24a; --brass-bright:#f0d489;
    --wood:#3b2517; --wood-dk:#1e120a; --wood-lt:#5a3b25;
    --lamp:#ffc98a;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#07080b;
    background-image:radial-gradient(120% 90% at 50% 18%, #14100c 0%, #0a0908 55%, #060607 100%);
    color:var(--ink); font-family:var(--serif);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:min(5vh,44px) 18px 48px; -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none;
  }

  /* ── THE CASE ─────────────────────────────────────────────────────────── */
  .case{
    width:min(96vw,940px); position:relative; border-radius:5px 5px 3px 3px;
    background:
      repeating-linear-gradient(93deg, rgba(0,0,0,.20) 0 1px, rgba(255,255,255,.017) 1px 3px, rgba(0,0,0,.09) 3px 6px),
      repeating-linear-gradient(91deg, rgba(0,0,0,.11) 0 7px, rgba(120,74,40,.07) 7px 19px),
      linear-gradient(180deg, var(--wood-lt) 0%, var(--wood) 12%, #2c1a10 68%, var(--wood-dk) 100%);
    box-shadow:
      0 2px 0 rgba(255,220,170,.10) inset,
      0 -30px 60px -30px #000 inset,
      0 40px 90px -40px #000, 0 8px 30px -10px rgba(0,0,0,.8);
    transition:filter 1.2s ease, box-shadow 1.2s ease;
  }
  .case.full{ filter:brightness(1.06) saturate(1.05);
    box-shadow:0 2px 0 rgba(255,220,170,.16) inset, 0 -30px 60px -30px #000 inset,
      0 40px 110px -36px rgba(255,178,92,.20), 0 8px 30px -10px rgba(0,0,0,.8); }

  /* crown + engraved title */
  .crown{
    padding:18px 26px 15px; text-align:center; position:relative;
    border-bottom:1px solid rgba(0,0,0,.55);
    box-shadow:0 1px 0 rgba(255,214,160,.09);
  }
  .crown h1{
    margin:0; font-weight:400; font-size:clamp(15px,2.5vw,21px);
    letter-spacing:.34em; text-indent:.34em; color:#d8b478;
    text-shadow:0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,214,160,.14);
    position:relative; overflow:hidden;
  }
  .crown h1 .gleam{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(105deg,transparent 30%,rgba(255,236,190,.85) 48%,transparent 66%);
    mix-blend-mode:screen;
  }
  .case.full .crown h1 .gleam{ animation:sweep 1.9s ease-out .15s 1; }
  @keyframes sweep{ 0%{opacity:0;transform:translateX(-70%);} 18%{opacity:1;} 100%{opacity:0;transform:translateX(70%);} }

  /* ── THE SHELVES ──────────────────────────────────────────────────────── */
  .shelves{ display:grid; grid-template-columns:repeat(3,1fr); }
  @media (max-width:760px){ .shelves{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .shelves{ grid-template-columns:1fr; } }

  /* flex column + the plate's auto top margin keep every brass plate in a row on ONE
     baseline even when one niche's character line wraps a line further than its neighbours' */
  .niche{ padding:20px 14px 16px; position:relative; display:flex; flex-direction:column; }
  .niche+.niche::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px;
    background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.2));
    box-shadow:1px 0 0 rgba(255,214,160,.055); }
  .niche::after{ content:""; position:absolute; left:6px; right:6px; bottom:0; height:3px;
    background:linear-gradient(180deg,rgba(255,214,160,.13),rgba(0,0,0,.55));
    border-radius:1px; }

  /* the recess: a genuinely sunken box with a bevelled arched opening */
  .recess{
    position:relative; aspect-ratio:6/5; border-radius:60px 60px 4px 4px; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 6%, #43301f 0%, #241608 46%, #150c05 100%);
    box-shadow:
      0 10px 26px -8px rgba(0,0,0,.95) inset,
      0 -6px 14px -6px rgba(0,0,0,.8) inset,
      0 1px 0 rgba(255,214,160,.14),
      0 0 0 1px rgba(0,0,0,.6);
    cursor:grab; touch-action:none;
    transition:box-shadow .5s ease;
  }
  .recess:active{ cursor:grabbing; }
  .recess:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:2px; }
  .recess canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* the lamp cone at the top of the niche; brightness = aliveness (24% → 82%) */
  .lamp{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
    background:
      radial-gradient(58% 42% at 50% -6%, rgba(255,201,128,.62) 0%, rgba(255,178,92,.16) 46%, transparent 72%),
      radial-gradient(80% 55% at 50% 96%, rgba(255,186,104,.16) 0%, transparent 70%);
    opacity:calc(.24 + .58*var(--alive,0)); transition:opacity .55s ease;
  }
  .niche[data-live="1"] .recess{ box-shadow:
      0 10px 26px -8px rgba(0,0,0,.95) inset, 0 -6px 14px -6px rgba(0,0,0,.8) inset,
      0 1px 0 rgba(255,222,175,.30), 0 0 0 1px rgba(0,0,0,.6), 0 0 22px -6px rgba(255,178,92,.35); }

  /* the line under the opening: INSTRUCTION while it sleeps, CHARACTER once woken */
  .say{
    margin:9px 4px 9px; min-height:4.05em; text-align:center;
    font:italic 12px/1.35 var(--serif); letter-spacing:.03em;
    color:rgba(255,214,168,.42); transition:opacity .45s ease, color .45s ease;
  }
  .niche[data-woke="1"] .say{ color:rgba(240,212,137,.72); }
  .say.swap{ opacity:0; }

  /* the brass label plate — THE DOOR. mounted on the wood under the niche. */
  .plate{
    display:block; margin:auto auto 0; width:max-content; max-width:100%;
    padding:5px 15px 6px; border-radius:2px; text-decoration:none; position:relative; overflow:hidden;
    background:linear-gradient(180deg,#7d6127 0%,#b8923f 22%,#8d6d2c 60%,#5e4718 100%);
    box-shadow:0 1px 0 rgba(255,236,190,.35) inset, 0 -1px 0 rgba(0,0,0,.5) inset,
      0 2px 5px -2px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.45);
    color:#2a1e06; font-size:11px; letter-spacing:.19em; text-transform:uppercase;
    text-shadow:0 1px 0 rgba(255,240,200,.36); white-space:nowrap;
    transition:transform .18s ease, box-shadow .25s ease, filter .25s ease;
  }
  .plate::after{ /* the two mounting screws */
    content:""; position:absolute; left:5px; right:5px; top:50%; height:3px; margin-top:-1.5px;
    background:radial-gradient(circle at 1.5px 1.5px, rgba(0,0,0,.5) 0 1.4px, transparent 1.5px) left/50% 100% no-repeat,
               radial-gradient(circle at calc(100% - 1.5px) 1.5px, rgba(0,0,0,.5) 0 1.4px, transparent 1.5px) right/50% 100% no-repeat;
    pointer-events:none;
  }
  .plate .arrow{ opacity:0; margin-left:0; display:inline-block; width:0; overflow:hidden;
    transition:opacity .2s ease, width .2s ease, margin .2s ease; }
  .plate:hover{ filter:brightness(1.16); transform:translateY(-1px);
    box-shadow:0 1px 0 rgba(255,244,214,.5) inset, 0 -1px 0 rgba(0,0,0,.5) inset,
      0 4px 10px -3px rgba(0,0,0,.9), 0 0 14px -3px rgba(255,200,120,.5), 0 0 0 1px rgba(0,0,0,.45); }
  .plate:hover .arrow,.plate:focus-visible .arrow{ opacity:1; width:1.1em; margin-left:.35em; }
  .plate:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:3px; }

  /* ── THE PLINTH ───────────────────────────────────────────────────────── */
  .plinth{
    padding:16px 26px 20px; text-align:center;
    border-top:1px solid rgba(0,0,0,.6); box-shadow:0 -1px 0 rgba(255,214,160,.07) inset;
  }
  .thread{ margin:0; font-style:italic; font-size:clamp(12.5px,1.9vw,15px); color:#c7b295; letter-spacing:.02em; }
  .sub{ margin:26px 0 0; color:var(--ink-dim); font-size:12.5px; text-align:center; max-width:62ch; line-height:1.65;
        text-wrap:balance; }
  .sub a{ color:var(--brass-bright); text-decoration:none; border-bottom:1px solid rgba(240,212,137,.3); }
  #st{ position:fixed; left:8px; bottom:8px; font:11px/1.45 ui-monospace,Menlo,monospace;
       background:rgba(0,0,0,.86); color:#cfe; padding:8px 10px; border-radius:4px; max-width:52ch;
       white-space:pre-wrap; display:none; z-index:9; }
  @media (prefers-reduced-motion:reduce){ .case.full .crown h1 .gleam{ animation:none; } }
</style>
</head>
<body>

<div class="case" id="case">
  <div class="crown"><h1>Things That Won&rsquo;t Fall Over<span class="gleam"></span></h1></div>
  <div class="shelves" id="shelves"></div>
  <div class="plinth"><p class="thread">Six of them, and every one is only standing because it is turning.</p></div>
</div>
<p class="sub">Reach into a niche and flick. It keeps going while you wake the next one &mdash; and the brass plate is the door
  to the room each of these came from. <a href="../midway/index.html">&larr; back to the Midway</a></p>
<pre id="st"></pre>

<script>try{ var __ck='ws:seen:spin-cabinet'; if(!localStorage.getItem(__ck)) localStorage.setItem(__ck, String(Date.now())); }catch(e){}</script>

<!-- ══ THE SIX SHIPPED CORES ═════════════════════════════════════════════════
     Each room's core.mjs, inlined VERBATIM by forge (which strips the `export`
     keywords) and sealed inside an IIFE that publishes only the names this page
     calls. The IIFE is not decoration: six cores share top-level M, G, R, A, B,
     deriv, integrate, runSelfTest and would silently overwrite one another in a
     classic script — the last one loaded would quietly drive all six niches.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
"use strict";
var CORE = {};

CORE['the-top'] = (function(){
<!-- forge:include ../the-top/core.mjs -->
return { I, M, G, R, OMEGA0, precessRate, topples, axleHat, cross, mag, runSelfTest };
})();

CORE['tippe-top'] = (function(){
<!-- forge:include ../tippe-top/core.mjs -->
return { defaults, H_SIM, omegaCrit, startState, integrate, nFromP, flips, runSelfTest };
})();

CORE['rattleback'] = (function(){
<!-- forge:include ../rattleback/core.mjs -->
return { epsOfSkewDeg, favoredSign, rk4Step, energySplit, runSelfTest };
})();

CORE['spinning-chair'] = (function(){
<!-- forge:include ../spinning-chair/core.mjs -->
return { A, B, omegaAt, inertia, runSelfTest };
})();

CORE['rotor'] = (function(){
<!-- forge:include ../rotor/core.mjs -->
return { omegaC, riderState, holds, press, runSelfTest };
})();

CORE['tusi'] = (function(){
<!-- forge:include ../tusi/core.mjs -->
return { pen, wheelCentre, lineFit };
})();
</script>

<!-- ══ THE PANEL DRIVERS ═════════════════════════════════════════════════════
     panels.mjs, the SAME file panels.test.mjs imports. Each factory takes its
     room's core as an argument, so the headless twin drives exactly what the
     canvas renders. ══════════════════════════════════════════════════════ -->
<script>
"use strict";
var PANELS_MOD = (function(){
<!-- forge:include panels.mjs -->
return { makePanels, ROOM_IDS };
})();
</script>

<script>
"use strict";
/* ═══ BUILD THE CASE ═══════════════════════════════════════════════════════ */
const PANELS = PANELS_MOD.makePanels(CORE);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shelves = document.getElementById('shelves');
const caseEl = document.getElementById('case');

for(const P of PANELS){
  const n = document.createElement('div');
  n.className = 'niche'; n.dataset.p = P.id;
  n.innerHTML =
    `<div class="recess" role="button" tabindex="0" aria-label="${P.label} — reach in and flick it">` +
      `<canvas></canvas><div class="lamp"></div></div>` +
    `<p class="say"></p>` +
    `<a class="plate" href="${P.href}"><span>${P.label}</span><span class="arrow">&rarr;</span></a>`;
  shelves.appendChild(n);
  P.el = n; P.cv = n.querySelector('canvas'); P.g = P.cv.getContext('2d');
  P.recess = n.querySelector('.recess'); P.say = n.querySelector('.say');
  P.say.innerHTML = P.hint;
  P.visible = true;

  /* the ONE graft from the Turntable: the line under the niche reads as
     INSTRUCTION while the object sleeps and swaps, on waking, to that object's
     one line of character. Instruction before, character after. */
  P.woke = () => {
    if(n.dataset.woke === '1') return;
    n.dataset.woke = '1';
    P.say.classList.add('swap');
    setTimeout(() => { P.say.textContent = P.character; P.say.classList.remove('swap'); }, REDUCED ? 0 : 260);
  };

  /* the gesture: reach INTO the niche. The plate is a DISJOINT target — the door. */
  let down = null, alt = -1;   // a bare click alternates sense, so both fates are findable
  P.recess.addEventListener('pointerdown', e => {
    down = { x: e.clientX, y: e.clientY, t: performance.now() };
    try { P.recess.setPointerCapture(e.pointerId); } catch (_) {}
    if(P.wantsHold) P.poke('down', 0, 0, true);
    P.woke();
  });
  P.recess.addEventListener('pointerup', e => {
    if(P.wantsHold) P.poke('up', 0, 0, false);
    if(!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    const moved = Math.hypot(dx, dy), dtms = performance.now() - down.t;
    if(moved > 4 || dtms < 420){ const fx = moved > 4 ? dx : (alt *= -1) * 40; P.poke('flick', fx, dy); }
    down = null;
  });
  P.recess.addEventListener('pointercancel', () => { if(P.wantsHold) P.poke('up', 0, 0, false); down = null; });
  P.recess.addEventListener('lostpointercapture', () => { down = null; });

  /* the niche is a real control: Space/Enter flicks, ←/→ pick the spin sense
     (so the rattleback's refusal is reachable without a mouse), and Space is a
     HOLD for the chair — keydown pulls the arms in, keyup lets them out. */
  P.recess.addEventListener('keydown', e => {
    const k = e.key;
    if(!['Enter', ' ', 'ArrowLeft', 'ArrowRight'].includes(k)) return;
    e.preventDefault();
    if(e.repeat) return;
    P.woke();
    if(P.wantsHold && (k === ' ' || k === 'Enter')) P.poke('down', 0, 0, true);
    P.poke('flick', k === 'ArrowLeft' ? -40 : k === 'ArrowRight' ? 40 : (alt *= -1) * 40, 0);
  });
  P.recess.addEventListener('keyup', e => {
    if(P.wantsHold && (e.key === ' ' || e.key === 'Enter')) P.poke('up', 0, 0, false);
  });
}

/* ═══ SIZE ═════════════════════════════════════════════════════════════════ */
function size(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  for(const P of PANELS){
    const r = P.recess.getBoundingClientRect();
    if(!r.width) continue;
    P.w = r.width; P.h = r.height;
    P.cv.width = Math.round(r.width * dpr); P.cv.height = Math.round(r.height * dpr);
    P.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    P.dirty = true;
  }
}
addEventListener('resize', size);
size();

/* ═══ PERF: only draw what is awake AND on screen ═══════════════════════════
   A sleeping niche is a still image — redrawing it 60×/s is pure waste, and six
   canvases of it is a warm laptop. Each panel redraws only when its state moved
   (or it was just resized); an IntersectionObserver stops offscreen niches from
   stepping at all. */
if('IntersectionObserver' in window){
  const io = new IntersectionObserver(es => {
    for(const e of es){
      const P = PANELS.find(p => p.recess === e.target);
      if(P){ P.visible = e.isIntersecting; if(e.isIntersecting) P.dirty = true; }
    }
  }, { rootMargin: '80px' });
  for(const P of PANELS) io.observe(P.recess);
}

/* ═══ REDUCED MOTION ═══════════════════════════════════════════════════════
   Not just the crown gleam: the PANELS themselves are stilled. Each object is
   posed in a settled frame — the wheel out on its axle, the rattleback at rest
   on its keel, the tippe-top already stood up on its stem — so the case is a
   cabinet of still objects rather than a cabinet of blank stages. Waking a niche
   still works; it simply steps only while you hold the gesture. */
let last = performance.now(), everFull = false;

function paint(P){
  P.g.clearRect(0, 0, P.w, P.h);
  P.draw(P.g, P.w, P.h);
  P.dirty = false;
}

function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let liveCount = 0;
  for(const P of PANELS){
    if(!P.w) continue;
    const wasAlive = P.alive();
    if(P.visible && wasAlive && !REDUCED){ P.step(dt); P.dirty = true; }
    const a = P.alive();
    if(a) liveCount++;
    if(P.el.dataset.live !== (a ? '1' : '0')){
      P.el.dataset.live = a ? '1' : '0';
      P.recess.style.setProperty('--alive', a ? 1 : 0);
    }
    if(P.dirty) paint(P);
  }
  if(liveCount === PANELS.length && !everFull){ everFull = true; caseEl.classList.add('full'); }
  requestAnimationFrame(frame);
}

if(REDUCED){ for(const P of PANELS){ P.settle(); P.dirty = true; } }
requestAnimationFrame(frame);

/* ═══ THE LIVENESS TWIN, IN THE PAGE (?selftest) ═══════════════════════════
   The cabinet makes no claim, so there is no proof chip and no accuracy pill on
   the visitor's page — this panel is hidden unless you ask for it by query. It
   runs the same three questions panels.test.mjs asks: is each panel driven by a
   real room core, does it MOVE, and does its payoff FIRE. Driven through the
   panels' own entry functions; never a canvas pointer event. */
if(location.search.includes('selftest')){
  const out = document.getElementById('st');
  out.style.display = 'block';
  const lines = [];
  // (1) the shipped cores really are here and still green in-page
  const t1 = CORE['the-top'].runSelfTest(), t2 = CORE.rattleback.runSelfTest();
  const t3 = CORE.rotor.runSelfTest(), t4 = CORE['spinning-chair'].runSelfTest();
  const cnt = r => r.checks ? `${r.checks.filter(c => c.ok).length}/${r.checks.length}`
                            : `${r.pass}/${r.pass + r.fail}`;
  lines.push(`cores in page: top ${cnt(t1)} · rattleback ${cnt(t2)} · rotor ${cnt(t3)} · chair ${cnt(t4)}`);
  // (2)+(3) wake every panel and run it long enough for its trick
  const probes = PANELS.map(P => PANELS_MOD.makePanels(CORE)[PANELS.indexOf(P)]);
  const before = probes.map(P => JSON.stringify(P.st));
  probes.forEach(P => { if(P.wantsHold) P.poke('down', 0, 0, true); P.poke('flick', -60, 0); });
  let n = 0;
  const tick = () => {
    for(let k = 0; k < 30; k++){ probes.forEach(P => P.step(1 / 60)); n++; }
    if(n < 60 * 12) return setTimeout(tick, 0);
    probes.forEach((P, i) => {
      const moved = JSON.stringify(P.st) !== before[i];
      lines.push(` ${moved ? '✓' : '✗'} ${P.id} moved   ${P.payoff() ? '✓' : '✗'} payoff fired`);
    });
    const allMoved = probes.every((P, i) => JSON.stringify(P.st) !== before[i]);
    const allPaid = probes.every(P => P.payoff());
    lines.push(`${allMoved && allPaid ? '✓ ALL SIX ALIVE' : '✗ A NICHE IS DEAD'}`);
    // the case's own payoff: six awake at once lights the wood
    PANELS.forEach(P => { P.poke('flick', -60, 0); if(P.wantsHold) P.poke('up', 0, 0, false); });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      lines.push(`${caseEl.classList.contains('full') ? '✓' : '…'} the case lit (six for six)`);
      out.textContent = lines.join('\n');
      window.__spinCabinetSelfTest = { allMoved, allPaid, lit: caseEl.classList.contains('full') };
    }));
  };
  tick();
}
</script>
</body>
</html>
