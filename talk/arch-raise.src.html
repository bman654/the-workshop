<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Arch-Raising · The Orrery Estate</title>
<style>
  :root{
    /* the Museum tokens, VERBATIM (museum/index.src.html) — kinship with the estate */
    --bg:#0a0805;
    --ink:#efe4cf;
    --ink-dim:#a7977a;
    --gold:#cba15a;
    --gilt:#e8cf8b;
    --gold-soft:rgba(203,161,90,0.14);
    --gold-edge:rgba(203,161,90,0.40);
    --rust:#c87a4a;
    --cool:#6f8ba0;
    --ok:#8fd79a;
    --bad:#f08a7a;
    --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --font-mono:"SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(1200px 760px at 50% -8%, rgba(203,161,90,0.10), transparent 56%),
      radial-gradient(900px 600px at 50% 120%, rgba(200,122,74,0.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto;
    min-height:100%; display:flex; flex-direction:column; padding:16px 20px 20px; gap:12px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .eyebrow{ font:600 11px/1 var(--font-mono); letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold); opacity:.92; margin:0; }
  .eyebrow .sub{ color:var(--ink-dim); letter-spacing:.16em; }
  .selftest{ font:600 10.5px/1 var(--font-mono); letter-spacing:.3px; padding:6px 11px; border-radius:20px;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.7); color:var(--ink-dim);
    cursor:pointer; transition:.25s; white-space:nowrap; }
  .selftest.ok{ color:var(--ok); border-color:rgba(143,215,154,0.45); }
  .selftest.bad{ color:var(--bad); border-color:rgba(240,138,122,0.6); }
  .selftest:hover{ filter:brightness(1.12); }

  .scenebar{ display:flex; align-items:baseline; gap:12px; }
  #stageTag{ display:flex; align-items:baseline; gap:9px; }
  #stageTag .st-n{ font:600 10px/1 var(--font-mono); letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold); opacity:.8; }
  #stageTag .st-name{ font:400 clamp(17px,2.6vw,23px)/1.1 var(--font-serif); color:var(--gilt); font-style:italic; }
  #hands{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .hand{ display:inline-flex; align-items:center; gap:7px; font:500 11.5px/1 var(--font-mono);
    letter-spacing:.02em; color:var(--ink-dim); opacity:.5; transition:opacity .3s, color .3s; }
  .hand.lit{ opacity:1; color:var(--ink); }
  .hand .of{ color:var(--ink-dim); }
  .hand .sw{ width:12px; height:12px; border-radius:3px; display:inline-block;
    border:1px solid rgba(0,0,0,0.5); }
  .hand-first .sw{ background:linear-gradient(180deg,#c9a35c,#7c5a26); }
  .hand-fresh .sw{ background:linear-gradient(180deg,#b79a72,#6d5738); }
  .hand-last  .sw{ background:linear-gradient(180deg,#f0d493,#c69a3f); }

  /* ─────────────── the stage cradle ─────────────── */
  .stage-cradle{ position:relative; flex:1 1 auto; display:flex;
    padding:12px; border-radius:16px;
    background:linear-gradient(180deg, rgba(203,161,90,0.12), rgba(60,44,20,0.08)), rgba(12,9,5,0.8);
    border:1px solid var(--gold-edge);
    box-shadow:0 24px 60px -28px rgba(0,0,0,0.9), inset 0 1px 0 rgba(232,207,139,0.14); }
  .stage-cradle::before, .stage-cradle::after{
    content:""; position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gilt), #6b4e22 70%); opacity:.7; }
  .stage-cradle::before{ top:9px; left:9px; }
  .stage-cradle::after{ top:9px; right:9px; }
  .stage{ position:relative; flex:1 1 auto; width:100%; overflow:hidden; border-radius:9px;
    background:radial-gradient(120% 100% at 50% 8%, #0d0b07, #050403 70%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6); }

  #archSvg{ display:block; width:100%; height:auto; }

  /* the abutments + ground the arch bears on */
  .ground{ fill:#141009; }
  .pier{ fill:url(#g-pier); stroke:rgba(0,0,0,0.55); stroke-width:1; }
  .springline{ stroke:rgba(203,161,90,0.30); stroke-width:1; stroke-dasharray:5 6; }

  /* the "centering" ghost — the falsework outline of the finished ring; struck once locked */
  .centering{ fill:none; stroke:var(--gold-edge); stroke-width:1.2; stroke-dasharray:3 7;
    opacity:.55; transition:opacity .8s ease; }
  #archSvg.ring-closed .centering{ opacity:.16; }
  #archSvg.locked .centering{ opacity:0; }

  /* the voussoirs — each drawn once; the ghost outlines its target, the stone
     pops into place when its course is laid (a pure function of the stage). */
  .vou .ghost{ fill:none; stroke:var(--gold-edge); stroke-width:1; stroke-dasharray:2 5;
    opacity:.5; transition:opacity .4s ease; }
  .vou.set .ghost{ opacity:0; }
  .vou .stone{ stroke:#1c140a; stroke-width:1.4; stroke-linejoin:round;
    opacity:0; transform:scale(.82); transform-box:fill-box; transform-origin:center;
    transition:opacity .5s ease, transform .55s cubic-bezier(.22,.61,.24,1); }
  .vou.set .stone{ opacity:1; transform:none; }
  .vou.hand-first .stone{ fill:url(#g-first); }
  .vou.hand-fresh .stone{ fill:url(#g-fresh); }
  .vou.hand-last  .stone{ fill:url(#g-last); }
  /* the climb reads course by course */
  .vou[data-course="2"] .stone{ transition-delay:.14s; }
  .vou[data-course="3"] .stone{ transition-delay:.28s; }
  /* the keystone DROPS into the crown gap from above */
  .vou[data-kind="keystone"] .stone{ transform:translateY(-46px) scale(.9); }
  .vou[data-kind="keystone"].set .stone{ transform:none; }
  /* the locked ring brightens along its joints */
  #archSvg.locked .vou .stone{ stroke:rgba(232,207,139,0.55); }

  /* the line of thrust — drawn on when the ring goes rigid */
  .thrust{ fill:none; stroke:var(--gilt); stroke-width:2.6; stroke-linecap:round;
    stroke-dasharray:700; stroke-dashoffset:700; opacity:0; filter:url(#glow); }
  #archSvg.locked .thrust{ opacity:.95; animation:draw 900ms ease forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .thrust-mark{ fill:var(--gilt); opacity:0; transition:opacity .5s ease .4s; }
  #archSvg.locked .thrust-mark{ opacity:.85; }

  /* the depleting yard tray */
  .yard-label{ fill:var(--ink-dim); font:600 12px/1 var(--font-mono); letter-spacing:.24em;
    text-transform:uppercase; text-anchor:middle; opacity:.7; }
  .tok{ stroke:#1c140a; stroke-width:1; transition:opacity .45s ease; }
  .tok.hand-first{ fill:url(#g-first); } .tok.hand-fresh{ fill:url(#g-fresh); } .tok.hand-last{ fill:url(#g-last); }
  .tok.placed{ opacity:.14; }

  /* ─────────────── caption band ─────────────── */
  .caption{ min-height:2.6em; margin:2px 4px 0; text-align:center;
    font:400 clamp(14px,2.05vw,18px)/1.5 var(--font-serif); color:var(--ink); opacity:.94; transition:opacity .3s; }

  /* ─────────────── the stage scrubber ─────────────── */
  .scrubber{ display:flex; align-items:center; gap:12px; }
  .navbtn{ flex:0 0 auto; width:40px; height:34px; border-radius:10px; cursor:pointer;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.72); color:var(--gilt);
    font:600 16px/1 var(--font-ui); transition:.2s; }
  .navbtn:hover:not(:disabled){ background:rgba(203,161,90,0.16); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  .dots{ flex:1 1 auto; display:flex; align-items:center; gap:9px; }
  .dot{ flex:0 0 auto; width:16px; height:16px; padding:0; border-radius:50%; cursor:pointer;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.6); transition:.2s; }
  .dot:hover{ filter:brightness(1.3); }
  .dot.past{ background:rgba(203,161,90,0.30); }
  .dot.on{ background:var(--gold); border-color:var(--gilt); box-shadow:0 0 0 3px rgba(203,161,90,0.22); }

  .foot{ margin-top:2px; font:400 12px/1.55 var(--font-serif); color:var(--ink-dim); }
  .foot code{ font:500 11.5px/1.5 var(--font-mono); color:var(--gilt);
    background:rgba(203,161,90,0.08); padding:1px 5px; border-radius:4px; }
  .foot a{ color:var(--gold); text-decoration:none; }
  .foot a:hover{ color:var(--gilt); text-decoration:underline; }

  @media (max-width:720px){
    #hands{ width:100%; margin-left:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .vou .stone, .vou .ghost, .centering, .thrust-mark, .caption, .tok{ transition:none; }
    #archSvg.locked .thrust{ animation:none; stroke-dashoffset:0; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <p class="eyebrow">The Arch-Raising &nbsp;<span class="sub">· one arch, raised course by course, by many hands</span></p>
      <button class="selftest" id="selftest" type="button" title="re-run the raising self-test">read the arch</button>
    </div>

    <div class="scenebar">
      <div id="stageTag"></div>
      <div id="hands"></div>
    </div>

    <div class="stage-cradle">
      <div class="stage" id="stage" aria-live="polite"></div>
    </div>

    <p class="caption" id="caption"></p>

    <div class="scrubber">
      <button class="navbtn" id="prev" type="button" aria-label="previous stage" title="previous stage">◂</button>
      <div class="dots" id="dots" role="tablist" aria-label="raising stages"></div>
      <button class="navbtn" id="next" type="button" aria-label="next stage" title="next stage">▸</button>
    </div>

    <p class="foot">
      A semicircular arch of <b>nine dry-stacked voussoirs</b> — held up by nothing
      but its own shape. Drawing kin to the estate's
      <a href="../the-keystone-arch/index.html">Keystone Arch ↗</a>; this frame is
      <b>drawn, not asserted</b> — the statics live there.
    </p>
  </main>

</body>
</html>
