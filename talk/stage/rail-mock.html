<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Rail — static design mock (T1.2)</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════════
     SCORE RAIL — static design mock (WS7 T1.2).  NOT deck code.
     A Victorian player-piano programme roll for the projection-room film:
     the film's full cue sheet punched into a paper strip that travels DOWN
     past a fixed brass tracker bar (the play-line), exactly as pianola paper
     spools top → tracker bar → take-up spool.  Future cues hang above the
     bar and descend into it; spent cues collect below.
     All rail classes are prefixed sr- so T1.3 can lift them wholesale.
     Palette: deck tokens (showing.src.html) + pin-barrel brass
     (the-barrel-house/pin-barrel).
     ══════════════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#07090e; --ink:#eaf0fa; --muted:#8b95a8; --gold:#d9b168; --lit:#fff5df;
    /* rail materials */
    --paper:#e7dcbb; --paper-lo:#d9cca6; --p-ink:#2b2114; --p-dim:#7a6b4d;
    --brass-hi:#e9cd7f; --brass:#b78f3a; --brass-lo:#8a6a28; --brass-edge:#5f4a1c;
    --walnut-hi:#3a2a1c; --walnut-lo:#20160d;
    --hole:#171006; --flare:#ffdf9e;
    --rail-w:356px; --cheek:12px; --bar-y:640px;
    --pxs:16;               /* px per second of film time */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased; }

  /* ── mock stage backdrop (placeholder for the live estate room) ─────────── */
  #mock-stage{ position:fixed; inset:0;
    background:
      radial-gradient(90% 70% at 62% 30%, #101828 0%, #0a101d 55%, #060910 100%); }
  #mock-stage .glowarc{ position:absolute; left:52%; top:16%; width:640px; height:640px;
    border-radius:50%; border:2px solid rgba(217,177,104,.28);
    box-shadow:0 0 60px rgba(217,177,104,.10), inset 0 0 80px rgba(120,150,255,.06);
    clip-path:inset(0 0 46% 0); }
  #mock-stage .glowdot{ position:absolute; border-radius:50%; background:rgba(140,170,255,.5);
    box-shadow:0 0 18px rgba(140,170,255,.5); }
  #mock-stage .placeholder{ position:absolute; left:55%; top:52%; transform:translateX(-50%);
    color:rgba(139,149,168,.4); font-size:13px; letter-spacing:.22em; text-transform:uppercase; }
  /* the deck's one-line karaoke caption, faked for contrast judgment */
  #mock-caption{ position:fixed; left:0; right:0; bottom:40px; text-align:center;
    font-family:Georgia,"Times New Roman",serif; font-size:30px; color:#8791a6; z-index:5; }
  #mock-caption .on{ color:var(--lit); text-shadow:0 0 16px rgba(217,177,104,.45); }

  /* ══ THE SCORE RAIL ══════════════════════════════════════════════════════ */
  #sr-rail{ position:fixed; left:0; top:0; bottom:0; width:var(--rail-w); z-index:6;
    transform:translateX(0);
    transition:transform .48s cubic-bezier(.6,.05,.32,1);
    box-shadow:14px 0 34px rgba(0,0,0,.55); }
  #sr-rail.sr-hidden{ transform:translateX(-106%); }
  #sr-rail.sr-noanim{ transition:none; }
  @media (prefers-reduced-motion: reduce){
    #sr-rail{ transition:none; }
    .sr-punch.sr-flare, .sr-row.sr-flare .sr-verb{ transition:none; animation:none; }
  }

  /* walnut cheeks (side rails) */
  .sr-cheek{ position:absolute; top:0; bottom:0; width:var(--cheek); z-index:4;
    background:linear-gradient(90deg, var(--walnut-hi), var(--walnut-lo));
    box-shadow:inset -2px 0 3px rgba(0,0,0,.5); }
  .sr-cheek.right{ right:0; left:auto;
    background:linear-gradient(270deg, var(--walnut-hi), var(--walnut-lo));
    box-shadow:inset 2px 0 3px rgba(0,0,0,.5); }
  .sr-cheek.left{ left:0; }

  /* brass header plate */
  #sr-head{ position:absolute; left:0; right:0; top:0; height:58px; z-index:5;
    background:linear-gradient(180deg, var(--brass-hi) 0%, var(--brass) 55%, var(--brass-lo) 100%);
    border-bottom:2px solid var(--brass-edge);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-right:74px;   /* room for the counter drum */
    text-shadow:0 1px 0 rgba(255,240,200,.5); }
  #sr-head .t{ font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:15px; letter-spacing:.30em; color:#3d2f12; font-variant:small-caps; }
  #sr-head .s{ font-size:9.5px; letter-spacing:.14em; color:#4d3c18; margin-top:2px;
    font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic; }
  #sr-head .screw{ position:absolute; top:50%; width:7px; height:7px; border-radius:50%;
    transform:translateY(-50%);
    background:radial-gradient(circle at 35% 30%, #f2dfa4, #7c5f24 70%);
    box-shadow:inset 0 0 2px rgba(0,0,0,.6); }
  #sr-head .screw.l{ left:18px; } #sr-head .screw.r{ right:18px; }

  /* spool slivers (supply above, take-up below) */
  .sr-spool{ position:absolute; left:var(--cheek); right:var(--cheek); height:22px; z-index:3;
    background:linear-gradient(180deg, #0d0905 0%, #4a3826 30%, #6b543a 50%, #2e2113 80%, #0d0905 100%); }
  .sr-spool.top{ top:58px; box-shadow:0 4px 8px rgba(20,12,4,.55); }
  .sr-spool.bottom{ bottom:0; box-shadow:0 -4px 8px rgba(20,12,4,.55); }

  /* the paper run (viewport) */
  #sr-scroll{ position:absolute; left:var(--cheek); right:var(--cheek);
    top:80px; bottom:22px; overflow:hidden; z-index:1;
    background:
      /* lane ruling, left zone only */
      repeating-linear-gradient(90deg,
        rgba(122,107,77,.28) 0px, rgba(122,107,77,.28) 1px, transparent 1px, transparent 13px)
        24px 0 / 66px 100% no-repeat,
      /* paper grain */
      repeating-linear-gradient(180deg,
        rgba(120,100,60,.05) 0 2px, transparent 2px 6px),
      linear-gradient(90deg, var(--paper-lo) 0%, var(--paper) 7%, var(--paper) 93%, var(--paper-lo) 100%); }
  /* curl shadows where the paper meets the spools */
  #sr-scroll::before, #sr-scroll::after{ content:""; position:absolute; left:0; right:0;
    height:16px; z-index:3; pointer-events:none; }
  #sr-scroll::before{ top:0; background:linear-gradient(180deg, rgba(30,20,8,.45), transparent); }
  #sr-scroll::after{ bottom:0; background:linear-gradient(0deg, rgba(30,20,8,.45), transparent); }

  /* the moving strip: children live at fixed absolute-time positions;
     ONE translateY moves the whole paper (in the deck: derived from the clock) */
  #sr-strip{ position:absolute; left:0; right:0; top:0; height:0; will-change:transform; }

  /* lane-head letters etched at the top of the paper */
  #sr-lanehead{ position:absolute; left:var(--cheek); top:84px; width:66px; margin-left:24px;
    display:flex; z-index:2; pointer-events:none; }
  #sr-lanehead span{ width:13px; text-align:center; font-size:8.5px; color:var(--p-dim);
    font-family:ui-monospace,Menlo,monospace; opacity:.85; }

  /* ── cue rows ──────────────────────────────────────────────────────────── */
  .sr-row{ position:absolute; left:0; right:0; height:0; }
  .sr-punch{ position:absolute; transform:translate(-50%,-50%);
    background:var(--hole); box-shadow:inset 0 1px 2px rgba(0,0,0,.85), 0 1px 0 rgba(255,248,225,.5); }
  .sr-punch.k-frame{ width:16px; height:8px; border-radius:4px; }
  .sr-punch.k-state{ width:9px; height:9px; border-radius:50%; }
  .sr-punch.k-impulse{ width:6px; height:6px; border-radius:50%; }
  .sr-punch.k-spot{ width:8px; height:8px; border-radius:2px; transform:translate(-50%,-50%) rotate(45deg); }
  .sr-punch.k-note{ width:10px; height:3px; border-radius:1.5px; }
  .sr-verb{ position:absolute; left:92px; max-width:192px; transform:translateY(-50%);
    font:13px/1.15 ui-monospace,Menlo,monospace; color:var(--p-ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr-ts{ position:absolute; right:12px; transform:translateY(-50%);
    font:10px/1 ui-monospace,Menlo,monospace; color:var(--p-dim); }
  .sr-leader{ position:absolute; height:0; border-top:1px dotted rgba(122,107,77,.55); }

  /* spent (below the bar) */
  .sr-row.sr-spent .sr-verb, .sr-row.sr-spent .sr-ts{ opacity:.45; }
  .sr-row.sr-spent .sr-punch{ background:#241a0e; box-shadow:inset 0 1px 2px rgba(0,0,0,.7); }

  /* flare: the punch crosses a tracker-bar port — light through paper */
  .sr-row.sr-flare .sr-punch{ background:var(--flare);
    box-shadow:0 0 14px 4px rgba(255,213,138,.55), inset 0 0 3px rgba(255,255,255,.8); }
  .sr-row.sr-flare .sr-verb{ color:#6b3f00; font-weight:700;
    text-shadow:0 0 10px rgba(255,196,110,.65); }
  .sr-row.sr-flare::before{ content:""; position:absolute; left:8px; right:8px;
    top:-14px; height:28px; border-radius:14px; pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,213,138,.30), transparent 70%); }

  /* ── chapter plates (printed roll labels) ───────────────────────────────
     A plate's TOP edge sits at its chapter-boundary time and the plate hangs
     BELOW it (into the ~2s of paper just before the chapter) so it crosses
     the play-line as a title card right before its chapter's first cues. */
  .sr-plate{ position:absolute; left:8px; right:8px; height:34px; margin-top:4px;
    background:linear-gradient(180deg, #f2ead2, #e9dfc4);
    border-top:1px solid #8a6f3f; border-bottom:1px solid #8a6f3f;
    box-shadow:0 1px 0 #c9bb94 inset, 0 -1px 0 #c9bb94 inset, 0 1px 3px rgba(60,40,10,.25);
    display:flex; align-items:center; justify-content:center; }
  .sr-plate .no{ font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:12.5px; letter-spacing:.12em; color:#4a3a1a; font-variant:small-caps;
    white-space:nowrap; }

  /* ── the tracker bar (fixed play-line): a slim brass rule + ring ports,
     so a crossing punch stays VISIBLE as it flares on the line ───────────── */
  #sr-bar{ position:absolute; left:0; right:0; top:var(--bar-y); height:0; z-index:3;
    pointer-events:none; }
  /* strong rule across the lane zone only; a faint hairline continues under
     the label zone so crossing verbs are never struck through */
  #sr-bar::before{ content:""; position:absolute; left:0; width:104px; top:-2px; height:3px;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    box-shadow:0 1px 3px rgba(10,6,0,.55), 0 -1px 2px rgba(255,240,200,.25); }
  #sr-bar::after{ content:""; position:absolute; left:104px; right:0; top:-1px; height:1px;
    background:rgba(138,106,40,.4); }
  /* five reading ports (open brass rings) aligned to the five lanes */
  #sr-bar .port{ position:absolute; top:0; width:18px; height:13px; border-radius:6px;
    transform:translate(-50%,-50%); border:2px solid var(--brass-lo); background:transparent;
    box-shadow:0 1px 2px rgba(10,6,0,.45), inset 0 1px 1px rgba(255,240,200,.3); }
  /* pallet end-cap on the left cheek */
  #sr-bar .pallet{ position:absolute; left:-2px; top:0; width:16px; height:22px;
    transform:translateY(-50%); border-radius:0 4px 4px 0;
    background:linear-gradient(180deg, var(--brass-hi) 0%, var(--brass) 46%, var(--brass-lo) 100%);
    border:1px solid var(--brass-edge); box-shadow:0 2px 5px rgba(10,6,0,.5); }
  /* master-clock counter drum, set into the header plate (off the play-line
     so crossing labels never collide with it) */
  #sr-head .sr-counter{ position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:#221808; color:var(--flare); border:1px solid var(--brass-edge); border-radius:3px;
    font:11.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.08em; padding:4px 7px;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.8), 0 1px 0 rgba(255,240,200,.4);
    text-shadow:0 0 6px rgba(255,213,138,.6); }

  /* ── mock harness (design aid only — never ships) ──────────────────────── */
  #harness{ position:fixed; right:14px; bottom:14px; z-index:60; width:300px;
    background:rgba(10,13,20,.92); border:1px solid rgba(255,255,255,.14); border-radius:10px;
    padding:10px 12px; font:11.5px/1.6 ui-monospace,Menlo,monospace; color:#aeb6d4; }
  #harness b{ color:#d9b168; letter-spacing:.06em; }
  #harness input[type=range]{ width:100%; }
  #harness button{ background:#131a28; color:#cdd3e8; border:1px solid rgba(255,255,255,.18);
    border-radius:6px; padding:3px 9px; font:inherit; cursor:pointer; margin-right:6px; }
  #harness button:hover{ border-color:rgba(217,177,104,.6); }
  body.bare #harness{ display:none; }
</style>
</head>
<body>

<div id="mock-stage" aria-hidden="true">
  <div class="glowarc"></div>
  <div class="glowdot" style="left:58%;top:38%;width:10px;height:10px"></div>
  <div class="glowdot" style="left:70%;top:24%;width:6px;height:6px"></div>
  <div class="glowdot" style="left:48%;top:30%;width:7px;height:7px"></div>
  <div class="placeholder">stage placeholder — a live estate room plays here</div>
</div>
<div id="mock-caption">At this word, frame the <span class="on">aquarium</span>.</div>

<div id="sr-rail">
  <div class="sr-cheek left"></div>
  <div class="sr-cheek right"></div>
  <div id="sr-head">
    <span class="screw l"></span>
    <div class="t">The Score</div>
    <div class="s">programme roll · the projection room</div>
    <span class="sr-counter" id="sr-clock">01:03.4</span>
  </div>
  <div class="sr-spool top"></div>
  <div id="sr-lanehead"><span>F</span><span>S</span><span>I</span><span>◆</span><span>¶</span></div>
  <div id="sr-scroll"><div id="sr-strip"></div></div>
  <div id="sr-bar">
    <span class="pallet"></span>
    <span class="port" style="left:43px"></span>
    <span class="port" style="left:56px"></span>
    <span class="port" style="left:69px"></span>
    <span class="port" style="left:82px"></span>
    <span class="port" style="left:95px"></span>
  </div>
  <div class="sr-spool bottom"></div>
</div>

<div id="harness">
  <b>RAIL MOCK</b> — design harness (not deck code)<br>
  now <span id="h-now">63.4</span>s
  <input id="h-scrub" type="range" min="0" max="360" step="0.1" value="63.4">
  <button id="h-hide" type="button">toggle hide</button>
  <button id="h-anim" type="button">anim: on</button>
</div>

<script>
/* Static mock layout. In the deck (T1.3) the ONLY per-tick work is:
   (1) one translateY on #sr-strip derived from the master clock,
   (2) flare/spent classes from (now − cueT).
   Everything else — positions, label nudging, leaders — is built once. */
(function(){
  'use strict';
  var PX = 16;                 /* px per second of film time */
  var BAR_Y = 640;             /* play-line, screen px from rail top */
  var SCROLL_TOP = 80;         /* #sr-scroll offset from rail top */
  var FLARE_S = 1.1;           /* seconds a crossing stays lit */
  var TMAX = 360;

  /* lanes: punch x-centers inside the strip (24px left margin + 13px lanes);
     the bar's ports sit at cheek(12) + these, i.e. 43/56/69/82/95 */
  var LANE_X = { frame:31, state:44, impulse:57, spot:70, note:83 };

  /* ── SAMPLE programme (realistic for THIS film per SPEC; times illustrative) ── */
  var CHAPTERS = [
    { no:'№ 1', title:'THE TAKE',               start:0   },
    { no:'№ 2', title:'ONE PAGE, MANY ROOMS',   start:42  },
    { no:'№ 3', title:'FIFTY-SEVEN BYTES',      start:86  },
    { no:'№ 4', title:'THE CLOCK IS THE VOICE', start:136 },
    { no:'№ 5', title:'DRAFT THREE',            start:252 },
    { no:'№ 6', title:'PRESS RECORD',           start:312 }
  ];
  var CUES = [
    [0,  0.0,'note',   'preflight — live, this page-load'],
    [0,  3.2,'state',  'pf.flip(1)'],
    [0,  4.6,'state',  'pf.flip(2)'],
    [0,  6.0,'state',  'pf.flip(3)'],
    [0,  7.4,'state',  'pf.flip(4)'],
    [0,  8.8,'state',  'pf.flip(5)'],
    [0, 10.2,'state',  'pf.flip(6)'],
    [0, 20.8,'frame',  '→ strata'],
    [0, 33.6,'note',   'walk in at any door'],
    [1,  0.0,'note',   'inception — rail on camera'],
    [1,  5.5,'spot',   '#sr-rail push-in'],
    [1, 14.2,'frame',  '→ the-aquarium'],
    [1, 21.4,'state',  "leverTo('days')"],
    [1, 29.9,'frame',  '→ museum/ages'],
    [1, 36.1,'note',   'a line in a table did'],
    [2,  0.0,'frame',  '→ why-the-sky-is-blue'],
    [2,  6.3,'state',  'sunset()'],
    [2, 32.5,'state',  "card('p03-hook')"],
    [2, 45.0,'note',   'the sun set on “reach”'],
    [3,  0.0,'state',  'sidecar.follow()'],
    [3, 16.8,'state',  "card('p04-docks')"],
    [3, 35.2,'frame',  '→ choice-replay?clock=css'],
    [3, 40.0,'impulse','replay.run()'],
    [3, 52.4,'frame',  '→ choice-replay?clock=audio'],
    [3, 57.1,'impulse','replay.run()'],
    [3, 67.7,'state',  "card('p04-eight')"],
    [3, 83.5,'note',   'p04a ends — bed swells alone'],
    [3, 88.6,'note',   'p04b — “Right on cue.”'],
    [4,  0.0,'frame',  '→ stage/storyboard.html'],
    [4,  7.3,'impulse','board.land(1)'],
    [4, 11.8,'impulse','board.land(2)'],
    [4, 16.1,'impulse','board.strike(2)'],
    [4, 24.5,'state',  "card('p05-seed')"],
    [4, 36.9,'state',  "card('p05-critique')"],
    [4, 49.2,'state',  "card('p05-lens')"],
    [5,  0.0,'state',  'rec.split()'],
    [5,  6.7,'impulse',"hand.click('rec')"],
    [5, 15.4,'impulse',"hand.click('arm')"],
    [5, 23.0,'state',  'mirror.on()'],
    [5, 32.8,'state',  "card('p06-trim')"],
    [5, 40.6,'impulse',"hand.click('stop')"],
    [5, 44.0,'note',   'end card — rail bows out'],
    [5, 45.5,'frame',  '→ end card']
  ];

  /* strip-space y for an absolute film time: later time = higher on the strip
     (paper travels down; the future descends into the tracker bar) */
  var PAD = 40;
  function stripY(absT){ return PAD + (TMAX - absT) * PX; }

  /* ── build once ── */
  var strip = document.getElementById('sr-strip');
  var rows = [];   /* { el, absT } for per-tick class flips */

  /* chapter plates (obstacles for label nudging) */
  var items = [];  /* { y, h, el?, cue? } sorted top-down for the nudge pass */
  CHAPTERS.forEach(function(ch){
    var el = document.createElement('div');
    el.className = 'sr-plate';
    el.innerHTML = '<span class="no">' + ch.no + ' · ' + ch.title + '</span>';
    var y = stripY(ch.start);
    el.style.top = y + 'px';
    strip.appendChild(el);
    items.push({ y:y, h:34, plate:true });
  });

  CUES.forEach(function(c){
    var chIx = c[0], t = c[1], kind = c[2], label = c[3];
    var absT = CHAPTERS[chIx].start + t;
    var y = stripY(absT);
    var row = document.createElement('div');
    row.className = 'sr-row';
    row.style.top = y + 'px';
    var punch = document.createElement('span');
    punch.className = 'sr-punch k-' + kind;
    punch.style.left = LANE_X[kind] + 'px';
    punch.style.top = '0px';
    var verb = document.createElement('span');
    verb.className = 'sr-verb';
    verb.textContent = label;
    var ts = document.createElement('span');
    ts.className = 'sr-ts';
    ts.textContent = 't:' + t.toFixed(1);
    row.appendChild(punch); row.appendChild(verb); row.appendChild(ts);
    strip.appendChild(row);
    items.push({ y:y, h:16, cue:true, row:row, verb:verb, ts:ts, punchX:LANE_X[kind] });
    rows.push({ el:row, absT:absT });
  });

  /* label nudge: punches stay at TRUE time positions; labels get pushed down
     to a min separation, with a dotted leader back to their punch */
  items.sort(function(a,b){ return a.y - b.y; });
  var floor = -1e9;
  items.forEach(function(it){
    var top = it.plate ? it.y + 4 : it.y - 8;   /* plates hang below their boundary */
    if (top < floor){
      var shift = floor - top;
      if (it.plate){ /* plates never move — cues yield to them */ floor = it.y + 4 + it.h + 4; return; }
      it.verb.style.transform = 'translateY(calc(-50% + ' + shift + 'px))';
      it.ts.style.transform   = 'translateY(calc(-50% + ' + shift + 'px))';
      if (shift > 4){
        var lead = document.createElement('span');
        lead.className = 'sr-leader';
        lead.style.left = (it.punchX + 12) + 'px';
        lead.style.width = (92 - it.punchX - 16) + 'px';
        lead.style.top = (shift/2) + 'px';
        lead.style.transform = 'rotate(' + Math.atan2(shift, 92 - it.punchX - 16) * 57.3 / 2 + 'deg)';
        it.row.appendChild(lead);
      }
      floor = it.y + shift + 12;
    } else {
      floor = (it.plate ? it.y + 4 + it.h + 4 : it.y + 12);
    }
  });

  /* ── per-tick (mock: driven by the scrub; deck: by the master clock) ── */
  var railEl = document.getElementById('sr-rail');
  var clockEl = document.getElementById('sr-clock');
  function fmt(t){
    var m = Math.floor(t/60), s = t - m*60;
    return (m<10?'0':'') + m + ':' + (s<10?'0':'') + s.toFixed(1);
  }
  function render(now){
    /* one transform: place strip so stripY(now) sits at the bar */
    var ty = (BAR_Y - SCROLL_TOP) - stripY(now);
    strip.style.transform = 'translateY(' + ty + 'px)';
    rows.forEach(function(r){
      var d = now - r.absT;
      r.el.classList.toggle('sr-flare', d >= 0 && d < FLARE_S);
      r.el.classList.toggle('sr-spent', d >= FLARE_S);
    });
    clockEl.textContent = fmt(now);
  }

  /* harness wiring (mock only) */
  var scrub = document.getElementById('h-scrub');
  var nowEl = document.getElementById('h-now');
  scrub.addEventListener('input', function(){
    var v = parseFloat(scrub.value);
    nowEl.textContent = v.toFixed(1);
    render(v);
  });
  document.getElementById('h-hide').addEventListener('click', function(){
    railEl.classList.toggle('sr-hidden');
  });
  var animBtn = document.getElementById('h-anim');
  animBtn.addEventListener('click', function(){
    railEl.classList.toggle('sr-noanim');
    animBtn.textContent = 'anim: ' + (railEl.classList.contains('sr-noanim') ? 'off' : 'on');
  });

  if (/[?&]bare=1/.test(location.search)) document.body.classList.add('bare');
  var m = /[?&]now=([\d.]+)/.exec(location.search);
  var start = m ? parseFloat(m[1]) : 63.4;
  scrub.value = start; nowEl.textContent = start.toFixed(1);
  render(start);
})();
</script>
</body>
</html>
