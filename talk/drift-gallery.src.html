<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Drift Gallery · The Orrery Estate</title>
<style>
  :root{
    /* the Museum archive tokens, VERBATIM (museum/index.src.html) */
    --bg:#0a0805;
    --ink:#efe4cf;
    --ink-dim:#a7977a;
    --gold:#cba15a;
    --gilt:#e8cf8b;
    --gold-soft:rgba(203,161,90,0.14);
    --gold-edge:rgba(203,161,90,0.40);
    --rust:#c87a4a;
    --cool:#6f8ba0;
    --cool-edge:rgba(111,139,160,0.40);
    --foxing:rgba(160,110,60,0.10);
    --panel:rgba(14,11,7,0.86);
    --ok:#8fd79a;
    --bad:#f08a7a;
    --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --font-mono:"SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(1200px 760px at 50% -8%, rgba(203,161,90,0.10), transparent 56%),
      radial-gradient(900px 600px at 12% 118%, rgba(200,122,74,0.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,240,210,0.012) 0 1px, transparent 1px 26px),
      radial-gradient(circle at 28% 18%, var(--foxing) 0 90px, transparent 140px),
      radial-gradient(circle at 80% 66%, var(--foxing) 0 70px, transparent 120px);
    mix-blend-mode:overlay;
  }

  /* ─────────────── layout shell ─────────────── */
  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto;
    min-height:100%; display:flex; flex-direction:column; padding:16px 20px 20px; gap:12px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .eyebrow{ font:600 11px/1 var(--font-mono); letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold); opacity:.92; margin:0; }
  .eyebrow .sub{ color:var(--ink-dim); letter-spacing:.16em; }
  .selftest{ font:600 10.5px/1 var(--font-mono); letter-spacing:.3px; padding:6px 11px; border-radius:20px;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.7); color:var(--ink-dim);
    cursor:pointer; transition:.25s; white-space:nowrap; }
  .selftest.ok{ color:var(--ok); border-color:rgba(143,215,154,0.45); }
  .selftest.bad{ color:var(--bad); border-color:rgba(240,138,122,0.6); }
  .selftest:hover{ filter:brightness(1.12); }

  .scenebar{ display:flex; align-items:baseline; gap:12px; }
  #sceneTag{ display:flex; align-items:baseline; gap:9px; }
  #sceneTag .sc-n{ font:600 10px/1 var(--font-mono); letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold); opacity:.8; }
  #sceneTag .sc-name{ font:400 clamp(17px,2.6vw,23px)/1.1 var(--font-serif); color:var(--gilt); font-style:italic; }
  #stepMeta{ margin-left:auto; display:flex; align-items:baseline; gap:9px;
    font:500 12px/1.3 var(--font-mono); }
  #stepMeta .ex{ color:var(--ink); font-family:var(--font-serif); font-size:13.5px; font-style:italic; }
  #stepMeta .sha{ }
  #stepMeta .sha.cold{ color:var(--cool); }
  #stepMeta .sha.warm{ color:var(--gilt); }
  #stepMeta .date{ color:var(--ink-dim); }
  #stepMeta .sep{ color:var(--ink-dim); }
  #stepMeta .ba{ display:inline-flex; align-items:baseline; gap:6px; }

  /* ─────────────── the stage cradle ─────────────── */
  .stage-cradle{ position:relative; flex:1 1 auto; min-height:48vh; display:flex;
    padding:12px; border-radius:16px;
    background:linear-gradient(180deg, rgba(203,161,90,0.14), rgba(60,44,20,0.10)), rgba(12,9,5,0.8);
    border:1px solid var(--gold-edge);
    box-shadow:0 24px 60px -28px rgba(0,0,0,0.9), inset 0 1px 0 rgba(232,207,139,0.14); }
  .stage-cradle::before, .stage-cradle::after{
    content:""; position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gilt), #6b4e22 70%); opacity:.7; }
  .stage-cradle::before{ top:9px; left:9px; }
  .stage-cradle::after{ top:9px; right:9px; }

  .stage{ position:relative; flex:1 1 auto; width:100%; min-height:46vh; overflow:hidden;
    border-radius:9px; background:#050403; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.6); }

  /* a mounted exhibit screen — absolutely placed, revealed per step */
  .screen{ position:absolute; inset:0; overflow:hidden; opacity:0; pointer-events:none;
    transition:opacity 420ms ease; background:#0b0a08;
    border:1px solid rgba(0,0,0,0.5); border-radius:7px; }
  .screen.shown{ opacity:1; pointer-events:auto; }
  .screen.full{ inset:0; }
  .screen.left{ inset:0 auto 0 0; width:calc(50% - 26px); }
  .screen.right{ inset:0 0 0 auto; width:calc(50% - 26px); }
  .screen.left{ border-color:var(--cool-edge); box-shadow:inset 0 0 0 1px rgba(111,139,160,0.18); }
  .screen.right{ border-color:var(--gold-edge); box-shadow:inset 0 0 0 1px rgba(203,161,90,0.22); }
  .screen.survivor{ border-color:var(--gold-edge); box-shadow:inset 0 0 0 1px rgba(203,161,90,0.22); }
  /* a corner tag on cold vs re-souled panels */
  .screen.left::after, .screen.right::after, .screen.survivor::after{
    position:absolute; top:0; left:0; z-index:3; padding:3px 9px;
    font:600 9.5px/1 var(--font-mono); letter-spacing:.18em; text-transform:uppercase;
    border-radius:7px 0 8px 0; }
  .screen.left::after{ content:"as it stood"; color:var(--cool);
    background:linear-gradient(120deg, rgba(20,26,32,0.94), rgba(20,26,32,0)); }
  .screen.right::after{ content:"re-souled"; color:var(--gilt);
    background:linear-gradient(120deg, rgba(32,24,10,0.94), rgba(32,24,10,0)); }
  .screen.survivor::after{ content:"the survivor"; color:var(--gilt);
    background:linear-gradient(120deg, rgba(32,24,10,0.94), rgba(32,24,10,0)); }

  .screen-scale{ transform-origin:top left; will-change:transform; }
  .screen-scale iframe{ width:100%; height:100%; border:0; display:block; background:#0b0a08; }
  /* a faint vignette so a scaled exhibit reads as a projected plate */
  .screen::before{ content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(130% 120% at 50% 30%, transparent 66%, rgba(0,0,0,0.32)); }

  /* the rework arrow between a before/after pair */
  #arrow{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5;
    display:none; flex-direction:column; align-items:center; gap:2px; padding:10px 8px;
    border-radius:12px; background:rgba(8,6,3,0.82); border:1px solid var(--gold-edge);
    box-shadow:0 10px 30px -14px rgba(0,0,0,0.9); pointer-events:none; }
  #arrow.shown{ display:flex; }
  #arrow .arrow-shaft{ font:700 13px/1 var(--font-mono); letter-spacing:.06em; color:var(--gilt); white-space:nowrap; }
  #arrow .arrow-sha{ font:600 11px/1.2 var(--font-mono); color:var(--gold); margin-top:3px; }
  #arrow .arrow-date{ font:500 9.5px/1 var(--font-mono); color:var(--ink-dim); }

  /* the change-beat panel (scene 2) */
  #beat{ position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center;
    padding:6% 8%; background:
      radial-gradient(900px 520px at 50% 30%, rgba(203,161,90,0.10), transparent 62%), #070605; }
  #beat.shown{ display:flex; }
  #beat .beat-inner{ max-width:70ch; text-align:center; }
  #beat .beat-h{ font:600 clamp(24px,4.4vw,40px)/1.1 var(--font-serif); color:var(--gilt); margin:0 0 20px; }
  #beat .beat-body{ font:400 clamp(15px,2.3vw,20px)/1.62 var(--font-serif); color:var(--ink); opacity:.94; margin:0; }

  /* ─────────────── caption band ─────────────── */
  .caption{ min-height:2.6em; margin:2px 4px 0; text-align:center;
    font:400 clamp(14px,2.05vw,18px)/1.5 var(--font-serif); color:var(--ink); opacity:.94; transition:opacity .3s; }
  .caption.empty{ min-height:0; }
  q.cited{ quotes:"“" "”"; font-style:italic; color:var(--gilt); }
  q.cited::before{ content:open-quote; } q.cited::after{ content:close-quote; }
  #beat q.cited{ color:var(--gilt); }

  /* ─────────────── the step scrubber ─────────────── */
  .scrubber{ display:flex; align-items:center; gap:12px; }
  .navbtn{ flex:0 0 auto; width:40px; height:34px; border-radius:10px; cursor:pointer;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.72); color:var(--gilt);
    font:600 16px/1 var(--font-ui); transition:.2s; }
  .navbtn:hover:not(:disabled){ background:rgba(203,161,90,0.16); }
  .navbtn:disabled{ opacity:.3; cursor:default; }
  .dots{ flex:1 1 auto; display:flex; align-items:center; gap:7px; }
  .dot{ flex:0 0 auto; width:16px; height:16px; padding:0; border-radius:50%; cursor:pointer;
    border:1px solid var(--gold-edge); background:rgba(20,15,8,0.6); transition:.2s; position:relative; }
  .dot.scene-1{ border-color:var(--cool-edge); }
  .dot:hover{ filter:brightness(1.3); }
  .dot.past{ background:rgba(203,161,90,0.30); }
  .dot.on{ background:var(--gold); border-color:var(--gilt);
    box-shadow:0 0 0 3px rgba(203,161,90,0.22); }
  .dot.scene-1.on{ background:var(--cool); border-color:#a9c2d4; box-shadow:0 0 0 3px rgba(111,139,160,0.22); }
  .dot.scene-end{ margin-right:16px; }
  .dot.scene-end::after{ content:""; position:absolute; right:-11px; top:50%; transform:translateY(-50%);
    width:1px; height:15px; background:var(--gold-edge); }

  .foot{ margin-top:2px; font:400 12px/1.55 var(--font-serif); color:var(--ink-dim); }
  .foot code{ font:500 11.5px/1.5 var(--font-mono); color:var(--gilt);
    background:rgba(203,161,90,0.08); padding:1px 5px; border-radius:4px; }
  .foot a{ color:var(--gold); text-decoration:none; }
  .foot a:hover{ color:var(--gilt); text-decoration:underline; }

  @media (max-width:720px){
    .screen.left, .screen.right{ inset:auto; width:100%; height:calc(50% - 5px); }
    .screen.left{ top:0; } .screen.right{ bottom:0; }
    #arrow{ transform:translate(-50%,-50%) rotate(90deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .screen{ transition:none; }
    .caption{ transition:none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <p class="eyebrow">The Drift Gallery &nbsp;<span class="sub">· a walk through one week the estate forgot how to play</span></p>
      <button class="selftest" id="selftest" type="button" title="re-run the walk self-test">read the walk</button>
    </div>

    <div class="scenebar">
      <div id="sceneTag"></div>
      <div id="stepMeta"></div>
    </div>

    <div class="stage-cradle">
      <div class="stage" id="stage" aria-live="polite">
        <div id="arrow"></div>
        <div id="beat"></div>
      </div>
    </div>

    <p class="caption" id="caption"></p>

    <div class="scrubber">
      <button class="navbtn" id="prev" type="button" aria-label="previous step" title="previous step">◂</button>
      <div class="dots" id="dots" role="tablist" aria-label="gallery steps"></div>
      <button class="navbtn" id="next" type="button" aria-label="next step" title="next step">▸</button>
    </div>

    <p class="foot">
      Every plate is <b>read, not drawn</b> — the cold bodies from
      <code>museum/archive/</code>, the re-souled bodies at their live paths.
      Restore any one: <code>git show &lt;sha&gt;:&lt;path&gt; &gt; x.html</code>.
      &nbsp;·&nbsp; <a href="../museum/index.html">The Museum ↗</a>
    </p>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       The page logic — the four-scene walk + the STATE-convergent galleryTo(k)
       tour hook. forge inlines talk/drift-gallery.js into the script below at
       build time (the directive owns its whole line so it folds cleanly). The
       exhibits it shows are loaded by relative-path iframe, never inlined, so this
       page's own source stays free of any wall-clock or randomness and the
       frame-determinism manifest reads it as a deterministic frame. -->
  <script>
<!-- forge:include drift-gallery.js -->
  </script>
</body>
</html>
