<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Showing — The Orrery Estate</title>
<style>
  :root{
    --bg:#07090e; --ink:#eaf0fa; --muted:#8b95a8; --gold:#d9b168; --brass:#c8a34e;
    --panel:#0d1017; --line:rgba(255,255,255,.12); --lit:#fff5df;
    --strip-h:96px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; }

  /* ── the stage: a same-origin iframe that never navigates the parent ─────── */
  #stage{ position:fixed; inset:0 0 var(--strip-h) 0; background:#000;
    display:flex; align-items:center; justify-content:center; }
  #frame{ width:100%; height:100%; border:0; background:#000;
    transition:filter .5s ease, opacity .5s ease; }
  #frame.holding{ filter:saturate(.85) brightness(.9); }

  /* ── the word-lit caption band (colophon idiom → raw claude-tts sidecar) ─── */
  #captions{ position:fixed; left:0; right:0; bottom:calc(var(--strip-h) + 18px);
    margin:0 auto; max-width:min(1100px,92vw); padding:14px 22px; z-index:5;
    text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:clamp(19px,2.5vw,30px);
    line-height:1.5; color:#c3cbda; text-shadow:0 2px 18px rgba(0,0,0,.8);
    pointer-events:none; }
  #captions .cap-w{ color:#8791a6; transition:color .16s ease, text-shadow .3s ease; }
  #captions .cap-w.on{ color:var(--lit); text-shadow:0 0 16px rgba(217,177,104,.45); }

  /* ── the RM preflight banner (talk-day hazard, DESIGN §10) ───────────────── */
  #rmbanner{ position:fixed; left:0; right:0; bottom:var(--strip-h); z-index:8;
    background:#7a1420; color:#fff; font:600 13px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.02em; padding:8px 16px; text-align:center;
    border-top:1px solid rgba(255,255,255,.25); }
  #rmbanner[hidden]{ display:none; }

  /* ── the operator strip: always-visible CLICKABLE panic buttons in the parent ─ */
  #strip{ position:fixed; left:0; right:0; bottom:0; height:var(--strip-h); z-index:9;
    background:linear-gradient(180deg,#0f131b,#080a0f); border-top:1px solid var(--line);
    display:grid; grid-template-columns:auto auto 1fr auto auto; align-items:center;
    gap:16px; padding:10px 18px; }
  #strip .grp{ display:flex; align-items:center; gap:8px; }
  #strip button{ font:600 13px/1 ui-monospace,Menlo,monospace; color:var(--ink);
    background:#161b25; border:1px solid var(--line); border-radius:7px;
    padding:9px 12px; cursor:pointer; letter-spacing:.02em; }
  #strip button:hover{ border-color:var(--brass); color:var(--lit); }
  #strip button[aria-current="true"]{ border-color:var(--brass); color:var(--gold);
    background:#1d2431; }
  #btn-live{ color:#ffd7a0; } #btn-rearm{ color:#a8d8c0; }
  #timeline{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  #timeline .clockrow{ display:flex; align-items:center; gap:10px;
    font:600 12px/1 ui-monospace,Menlo,monospace; color:var(--muted); }
  #scrub{ width:100%; accent-color:var(--brass); cursor:pointer; }
  #chapters{ display:flex; gap:6px; overflow-x:auto; max-width:34vw; }
  #chapters button{ white-space:nowrap; font-size:11px; padding:7px 9px; }
  #meta{ display:flex; flex-direction:column; align-items:flex-end; gap:4px;
    font:600 11px/1.3 ui-monospace,Menlo,monospace; color:var(--muted); min-width:180px; }
  #mode{ color:var(--gold); }
  #ready{ color:#a8d8c0; font-style:normal; }
  #addr{ color:var(--muted); }
  #cuelog{ position:fixed; right:18px; bottom:calc(var(--strip-h) + 12px); z-index:6;
    width:min(340px,40vw); max-height:150px; overflow-y:auto; text-align:right;
    font:500 11px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    pointer-events:none; opacity:.72; }
  #cuelog .cue-line{ text-shadow:0 1px 6px #000; }

  /* ── the start gate: one unlock gesture blesses the audio element (DESIGN §10) ─ */
  #gate{ position:fixed; inset:0; z-index:20; background:
    radial-gradient(900px 560px at 50% 22%, rgba(120,110,180,.16), transparent 60%), var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    padding:32px; text-align:center; }
  #gate[hidden]{ display:none; }
  #gate .kick{ font:600 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.34em;
    text-transform:uppercase; color:var(--muted); }
  #gate h1{ font-family:Georgia,serif; font-weight:500; font-size:clamp(40px,7vw,72px);
    margin:.1em 0; background:linear-gradient(180deg,#fff,#c6c9d6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #gate .sub{ color:var(--muted); font-style:italic; font-family:Georgia,serif;
    max-width:520px; font-size:17px; line-height:1.55; }
  #gate .acts{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  #gate button{ font:600 15px/1 ui-monospace,Menlo,monospace; letter-spacing:.03em;
    color:var(--ink); background:#161b25; border:1px solid var(--brass); border-radius:9px;
    padding:14px 22px; cursor:pointer; }
  #gate button:hover{ background:#1d2431; color:var(--lit); }
  #gate #gate-resume{ border-color:#a8d8c0; color:#c8f0dd; }
  #gate[hidden] + *{}

  #focussink{ position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }

  @media (max-width:640px){
    :root{ --strip-h:132px; }
    #strip{ grid-template-columns:1fr 1fr; grid-auto-rows:auto; }
    #chapters{ max-width:none; grid-column:1 / -1; }
    #cuelog{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #frame, #captions .cap-w{ transition:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" title="The Showing — stage" referrerpolicy="no-referrer"></iframe>
</div>

<div id="captions" aria-live="polite" aria-atomic="false"></div>

<div id="rmbanner" role="alert" hidden></div>

<div id="cuelog" aria-hidden="true"></div>

<div id="strip" role="group" aria-label="Showing operator controls">
  <div class="grp transport">
    <button id="btn-play" type="button" aria-label="play or pause">▶</button>
    <button id="btn-prev" type="button" aria-label="previous chapter">⏮</button>
    <button id="btn-next" type="button" aria-label="next chapter">⏭</button>
    <button id="btn-restart" type="button" aria-label="restart this chapter">↻</button>
  </div>
  <div class="grp modes">
    <button id="btn-live" type="button">GO-LIVE</button>
    <button id="btn-rearm" type="button">RE-ARM</button>
  </div>
  <div id="timeline">
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="seek within chapter">
    <div class="clockrow"><span id="clock">0:00</span><span>/</span><span id="dur">0:00</span>
      <span id="chapters" aria-label="chapters"></span></div>
  </div>
  <div id="meta">
    <span id="mode">scheduled</span>
    <span id="ready"></span>
    <span id="addr"></span>
  </div>
</div>

<div id="focussink" tabindex="-1"></div>

<div id="gate">
  <div class="kick">The Orrery Estate</div>
  <h1>The Showing</h1>
  <p class="sub">A narrated walk through the estate — the deck runs the stage; the maker speaks between chapters.</p>
  <div class="acts">
    <button id="gate-resume" type="button" hidden>▸ resume</button>
    <button id="gate-begin" type="button">▶ begin</button>
    <button id="gate-read" type="button">▸ read it silently</button>
  </div>
</div>

<!-- one persistent audio element: its src is swapped per chapter, blessed once by
     the unlock click so per-element autoplay rules never re-bite (DESIGN §10). The
     shell ships no audio; T4.3+ set each chapter's audio via forge:asset. -->
<audio id="voice" preload="none"></audio>

<script>

</script>

<script>
<!-- forge:include cue-engine.js -->
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   CHAPTERS — the cue sheet. Each: { id, title, audio, timing, opening:{frame},
   cues:[{t, frame|state|impulse|spot|note}] }. The clock is the chapter's
   audio.currentTime (or the rAF virtual clock in silent mode). `audio` is a bare
   data:audio/mpeg URI folded in by forge:asset from talk/script/chNN.mp3; `timing`
   is the RAW claude-tts word-timing sidecar folded in by forge:json from
   talk/script/chNN.json (never hand-typed) — cue anchors bind to its real word
   `s` times.

   ch01 — THE DOOR is the PATTERN PoC (WS2 T4.3): full pipeline proven end-to-end
   (prose → tts 48k → mp3 + timing → cues → framed dusk map with two camera pokes →
   word-lit captions). The remaining chapters (ch02–ch13) repeat this pattern in
   T4.5/T4.6. The per-frame determinism-and-motion manifest (DESIGN §10) lives in
   SHOWING_FRAME_MANIFEST just below — keyed by frame URL, not per-chapter, because the
   disposition is a property of the PAGE (the map is framed by four chapters at the one
   pinned URL) and it must be EXHAUSTIVE before ch02–ch13 exist so the rehearsal gate
   (T4.7) can enforce it against every chapter's frames. Use BLOCK comments only in this
   region (the HTML-comment-in-script forge landmine); the forge:asset / forge:json
   tokens are consumed at build time, so no HTML comment survives into the shipped
   script. */
window.SHOWING_CHAPTERS = [
  {
    id: 'ch01',
    title: 'THE DOOR',
    audio: '<!-- forge:asset script/ch01.mp3 -->',
    opening: { frame: '../index.html?hours=allon' },
    timing: <!-- forge:json script/ch01.json -->,
    /* ⟦stage⟧ (Appendix B ch01): hold the fit view through the opening; on "what
       you're looking at" slow-frameTo the manor, then recentre. The opening frame IS
       the fit view, so no t=0 frame cue is needed. The two camera pokes are STATE
       cues (idempotent __tourHooks verbs on the framed front door — see index.src.html
       showingCameraHooks) anchored to the real word `s` times: "What" (18589 ms, the
       start of "What you're looking at") and "It's" (21310 ms, "It's called the Orrery
       Estate — a manor and its grounds" — pull back to name the whole place). */
    cues: [
      { t:0,      note:'ch01 · THE DOOR — the map, pinned at dusk (?hours=allon), held at the fit view' },
      { t:18.589, state:{ verb:'mapFrame', args:['manor'] } },
      { t:18.7,   note:'slow push-in to the manor (STATE frameTo — idempotent, replayed on seek)' },
      { t:21.31,  state:{ verb:'recentre', args:[] } },
      { t:21.4,   note:'recentre — pull back to the whole estate as it is named' }
    ]
  }
];

/* ════════════════════════════════════════════════════════════════════════════
   SHOWING_FRAME_MANIFEST — the per-frame determinism-and-motion manifest (DESIGN §10,
   Appendix B's EXHAUSTIVE list; WS2 T4.4). NO estate page supports a ?seed= deep-link
   and wall-clock/random seeding is common (~106 of 137 sources), so every page THE
   SHOWING frames declares here, keyed by its exact frame URL, both:

     class       — the page's dominant nondeterminism, taken from its source: the higher
                   grep count of Math.random  vs  (Date.now + new Date).  Values:
                   'random-seed' · 'wall-clock' · 'calm' · 'deterministic'.
     disposition — how the deck keeps that page HONEST on stage:
                   'pinned'   the frame URL carries a capture param that fixes the roll
                              (the map's ?hours=allon dusk pin — the one precedent + the
                              primary case);
                   'tolerant' the narration is written to survive any roll ("watch long
                              enough", "any volley makes fringes") — no line names a state.

   The rehearsal gate (T4.7) is the enforcer: it REDs any framed page whose source greps
   Date.now|Math.random|new Date without an entry here that is 'pinned' (param present in
   the URL) or 'tolerant'. This list is EXHAUSTIVE — every page in Appendix B, including
   the two the Showing deliberately does NOT frame (`notFramed`), so completeness is
   provable and a stray new frame in ch02–ch13 has nowhere to hide. `chapters` records
   which chapters frame each page (docs/gate cross-check only; not read at runtime).
   Where a page also seeds the OTHER way, `note` says so and why it stays honest. */
window.SHOWING_FRAME_MANIFEST = {
  frames: {
    '../index.html?hours=allon':
      { class:'wall-clock',  disposition:'pinned',   chapters:['ch01','ch09','ch10','ch12'],
        note:'the dusk pin fixes the day/light layer (stars up, lamps lit); the firmament re-seeds its stars per load, but any field reads "stars up" — the pin governs the look every map chapter needs.' },
    '../workbench/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch02'],
        note:'a shelf of instruments; ch02 names no state — the one room is the point.' },
    '../strange-garden/pieces/game-of-life.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch03'],
        note:'random soup, no author after — "watch long enough and you\'ll see gliders"; the line is written for any seed.' },
    '../galton/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch04'],
        note:'any pour makes the bell curve; ch04 talks about the self-test, not a particular bin count.' },
    '../why-the-sky-is-blue/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch05'],
        note:'the scattering sieve runs continuously; no line references a specific frame.' },
    '../cavern/double-slit/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch05'],
        note:'any volley makes fringes; the ch05 fire IMPULSE (window.__tourHooks.fire, T2.5) is a live poke, and the narration survives whatever pattern lands.' },
    '../orrery/index.html':
      { class:'wall-clock',  disposition:'tolerant', chapters:['ch06'],
        note:'Kepler\'s clock advances on wall time; ch06 references speeds ("a day of theirs in a second of yours"), never a specific position.' },
    '../cavern/light-clock/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch06'],
        note:'the photon-bounce geometry is the lesson; ch06 says "set it moving", not "look here".' },
    '../the-barrel-house/pin-barrel/index.html':
      { class:'wall-clock',  disposition:'tolerant', chapters:['ch07'],
        note:'any crank position sounds the canon; the ch07 crank cue (window.__tourHooks.crank, STATE, T2.7) drives it to a rehearsed spot and is replayed on seek, so even a scrub lands honestly.' },
    '../the-errand/index.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch08'],
        note:'the fixed-timestep marble sim is itself deterministic (the page proves replay integrity); the residual Math.random is decorative. "The run is the run" — the ch08 go IMPULSE (window.__tourHooks.go, T4.4) pulls the lever live.' },
    '../ledger/face.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch11'],
        note:'the cairn stones are static; ch11 scrolls the chronicle and names no single stone.' },
    '../the-gate/the-gate.html':
      { class:'random-seed', disposition:'tolerant', chapters:['ch13'],
        note:'live weather + time-of-day sky (heavy Math.random and Date); ch13 says "any sky is right" — the ambient scene is deliberately whatever it is.' }
  },
  /* Appendix B's NOT-FRAMED pages — listed so the manifest is provably complete. */
  notFramed: [
    { page:'firmament/index.html', class:'random-seed',
      reason:'re-seeds its whole star field per load; the founding TOUR visits the REAL page (where the variance is the charm), the deck never frames it.' },
    { page:'colophon.html', class:'wall-clock',
      reason:'NEVER framed (DESIGN §10): its self-writing cloud is a pure function of its OWN audio.currentTime, which no parent gesture advances — framed, it would sit frozen. The Showing narrates its idea in its own voice (ch11 stays on the cairn).' }
  ]
};
</script>
