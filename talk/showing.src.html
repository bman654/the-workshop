<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Showing — The Orrery Estate</title>
<style>
  :root{
    --bg:#07090e; --ink:#eaf0fa; --muted:#8b95a8; --gold:#d9b168; --brass:#c8a34e;
    --panel:#0d1017; --line:rgba(255,255,255,.12); --lit:#fff5df;
    --strip-h:96px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; }

  /* ── the stage: a same-origin iframe that never navigates the parent ─────── */
  #stage{ position:fixed; inset:0 0 var(--strip-h) 0; background:#000;
    display:flex; align-items:center; justify-content:center; }
  #frame{ width:100%; height:100%; border:0; background:#000;
    transition:filter .5s ease, opacity .5s ease; }
  #frame.holding{ filter:saturate(.85) brightness(.9); }

  /* ── the word-lit caption band: ONE line at a time (a subtitle, not a wall).
     The viewport is ~2 lines tall so the outgoing line can bump UP and fade
     while the new line takes the base slot; overflow stays hidden. ─────────── */
  #captions{ position:fixed; left:0; right:0; bottom:calc(var(--strip-h) + 18px);
    margin:0 auto; max-width:min(1100px,92vw); height:3.4em; padding:0 22px; z-index:5;
    text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:clamp(19px,2.5vw,30px);
    line-height:1.5; color:#c3cbda; text-shadow:0 2px 18px rgba(0,0,0,.8);
    pointer-events:none; overflow:hidden; }
  #captions .cap-line{ position:absolute; left:22px; right:22px; bottom:0;
    transition:transform .5s ease, opacity .5s ease; }
  #captions .cap-line.out{ transform:translateY(-1.55em); opacity:0; }
  #captions .cap-w{ color:#8791a6; transition:color .16s ease, text-shadow .3s ease; }
  #captions .cap-w.on{ color:var(--lit); text-shadow:0 0 16px rgba(217,177,104,.45); }

  /* ── the RM preflight banner (talk-day hazard, DESIGN §10) ───────────────── */
  #rmbanner{ position:fixed; left:0; right:0; bottom:var(--strip-h); z-index:8;
    background:#7a1420; color:#fff; font:600 13px/1.4 ui-monospace,Menlo,monospace;
    letter-spacing:.02em; padding:8px 16px; text-align:center;
    border-top:1px solid rgba(255,255,255,.25); }
  #rmbanner[hidden]{ display:none; }

  /* ── the operator strip: always-visible CLICKABLE panic buttons in the parent ─ */
  #strip{ position:fixed; left:0; right:0; bottom:0; height:var(--strip-h); z-index:9;
    background:linear-gradient(180deg,#0f131b,#080a0f); border-top:1px solid var(--line);
    display:grid; grid-template-columns:auto auto 1fr auto auto; align-items:center;
    gap:16px; padding:10px 18px; }
  #strip .grp{ display:flex; align-items:center; gap:8px; }
  #strip button{ font:600 13px/1 ui-monospace,Menlo,monospace; color:var(--ink);
    background:#161b25; border:1px solid var(--line); border-radius:7px;
    padding:9px 12px; cursor:pointer; letter-spacing:.02em; }
  #strip button:hover{ border-color:var(--brass); color:var(--lit); }
  #strip button[aria-current="true"]{ border-color:var(--brass); color:var(--gold);
    background:#1d2431; }
  #btn-live{ color:#ffd7a0; } #btn-rearm{ color:#a8d8c0; }
  #timeline{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  #timeline .clockrow{ display:flex; align-items:center; gap:10px;
    font:600 12px/1 ui-monospace,Menlo,monospace; color:var(--muted); }
  #scrub{ width:100%; accent-color:var(--brass); cursor:pointer; }
  #chapters{ display:flex; gap:6px; overflow-x:auto; max-width:34vw; }
  #chapters button{ white-space:nowrap; font-size:11px; padding:7px 9px; }
  #meta{ display:flex; flex-direction:column; align-items:flex-end; gap:4px;
    font:600 11px/1.3 ui-monospace,Menlo,monospace; color:var(--muted); min-width:180px; }
  #mode{ color:var(--gold); }
  #ready{ color:#a8d8c0; font-style:normal; }
  #addr{ color:var(--muted); }
  #cuelog{ position:fixed; right:18px; bottom:calc(var(--strip-h) + 12px); z-index:6;
    width:min(340px,40vw); max-height:150px; overflow-y:auto; text-align:right;
    font:500 11px/1.5 ui-monospace,Menlo,monospace; color:var(--muted);
    pointer-events:none; opacity:.72; }
  #cuelog[hidden]{ display:none; } /* hidden by default — an opt-in dry-run aid, not stage chrome */
  #cuelog .cue-line{ text-shadow:0 1px 6px #000; }
  #btn-log[aria-pressed="true"]{ border-color:var(--brass); color:var(--gold); }

  /* quiet scrollbars — the default chrome bars are jarring against the ink */
  #chapters, #cuelog{ scrollbar-width:thin; scrollbar-color:rgba(200,163,78,.28) transparent; }
  #chapters::-webkit-scrollbar, #cuelog::-webkit-scrollbar{ height:7px; width:7px; }
  #chapters::-webkit-scrollbar-track, #cuelog::-webkit-scrollbar-track{ background:transparent; }
  #chapters::-webkit-scrollbar-thumb, #cuelog::-webkit-scrollbar-thumb{
    background:rgba(200,163,78,.28); border-radius:4px; }
  #chapters::-webkit-scrollbar-thumb:hover, #cuelog::-webkit-scrollbar-thumb:hover{
    background:rgba(200,163,78,.5); }

  /* ── deck cards: durable stage overlays driven by deck.card STATE cues ────── */
  #card{ position:fixed; z-index:7; left:50%; transform:translateX(-50%);
    bottom:calc(var(--strip-h) + 150px); width:min(780px,70vw);
    background:linear-gradient(180deg,#10141d,#0b0e15); border:1px solid var(--brass);
    border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.65); padding:14px 16px 12px;
    pointer-events:none; animation:cardIn .5s ease; }
  #card[hidden]{ display:none; }
  @keyframes cardIn{ from{ opacity:0; transform:translateX(-50%) translateY(14px);} to{ opacity:1; transform:translateX(-50%) translateY(0);} }
  #card .card-kick{ font:600 10.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.24em;
    text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  #card .card-stage{ position:relative; }
  #card .card-stage img{ display:block; width:100%; height:auto; border-radius:4px; }
  #card .card-stage svg{ position:absolute; inset:0; width:100%; height:100%; }
  #card .card-foot{ display:flex; justify-content:space-between; align-items:center; gap:12px;
    margin-top:9px; font:italic 13px/1.4 Georgia,serif; color:#bcae8a; }
  #card .card-cmd{ font:600 12px/1 ui-monospace,Menlo,monospace; color:var(--gold);
    background:#161b25; border:1px solid var(--line); border-radius:6px; padding:7px 10px;
    white-space:nowrap; }

  /* ── the start gate: one unlock gesture blesses the audio element (DESIGN §10) ─ */
  #gate{ position:fixed; inset:0; z-index:20; background:
    radial-gradient(900px 560px at 50% 22%, rgba(120,110,180,.16), transparent 60%), var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    padding:32px; text-align:center; }
  #gate[hidden]{ display:none; }
  #gate .kick{ font:600 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.34em;
    text-transform:uppercase; color:var(--muted); }
  #gate h1{ font-family:Georgia,serif; font-weight:500; font-size:clamp(40px,7vw,72px);
    margin:.1em 0; background:linear-gradient(180deg,#fff,#c6c9d6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #gate .sub{ color:var(--muted); font-style:italic; font-family:Georgia,serif;
    max-width:520px; font-size:17px; line-height:1.55; }
  #gate .acts{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  #gate button{ font:600 15px/1 ui-monospace,Menlo,monospace; letter-spacing:.03em;
    color:var(--ink); background:#161b25; border:1px solid var(--brass); border-radius:9px;
    padding:14px 22px; cursor:pointer; }
  #gate button:hover{ background:#1d2431; color:var(--lit); }
  #gate #gate-resume{ border-color:#a8d8c0; color:#c8f0dd; }
  #gate[hidden] + *{}

  #focussink{ position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }

  @media (max-width:640px){
    :root{ --strip-h:132px; }
    #strip{ grid-template-columns:1fr 1fr; grid-auto-rows:auto; }
    #chapters{ max-width:none; grid-column:1 / -1; }
    #cuelog{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #frame, #captions .cap-w, #captions .cap-line{ transition:none; }
    #card{ animation:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" title="The Showing — stage" referrerpolicy="no-referrer" allow="autoplay"></iframe>
</div>

<div id="captions" aria-live="polite" aria-atomic="false"></div>

<div id="rmbanner" role="alert" hidden></div>

<div id="cuelog" aria-hidden="true" hidden></div>

<div id="card" hidden></div>

<div id="strip" role="group" aria-label="Showing operator controls">
  <div class="grp transport">
    <button id="btn-play" type="button" aria-label="play or pause">▶</button>
    <button id="btn-prev" type="button" aria-label="previous chapter">⏮</button>
    <button id="btn-next" type="button" aria-label="next chapter">⏭</button>
    <button id="btn-restart" type="button" aria-label="restart this chapter">↻</button>
  </div>
  <div class="grp modes">
    <button id="btn-live" type="button"
      title="pause the narration and hand the stage to the presenter — click into the frame and drive the page by hand">GO-LIVE</button>
    <button id="btn-rearm" type="button"
      title="take the stage back from a GO-LIVE and resume scheduled playback">RE-ARM</button>
    <button id="btn-log" type="button" aria-pressed="false"
      title="show or hide the cue log (a dry-run aid: every cue and stage note as it fires)">LOG</button>
  </div>
  <div id="timeline">
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="seek within chapter">
    <div class="clockrow"><span id="clock">0:00</span><span>/</span><span id="dur">0:00</span>
      <span id="chapters" aria-label="chapters"></span></div>
  </div>
  <div id="meta">
    <span id="mode">scheduled</span>
    <span id="ready"></span>
    <span id="addr"></span>
  </div>
</div>

<div id="focussink" tabindex="-1"></div>

<div id="gate">
  <div class="kick">The Orrery Estate</div>
  <h1>The Showing</h1>
  <p class="sub">A narrated walk through the estate — the deck runs the stage; the maker speaks between chapters.</p>
  <div class="acts">
    <button id="gate-resume" type="button" hidden>▸ resume</button>
    <button id="gate-begin" type="button">▶ begin</button>
    <button id="gate-read" type="button">▸ read it silently</button>
  </div>
</div>

<!-- one persistent audio element: its src is swapped per chapter, blessed once by
     the unlock click so per-element autoplay rules never re-bite (DESIGN §10). The
     shell ships no audio; T4.3+ set each chapter's audio via forge:asset. -->
<audio id="voice" preload="none"></audio>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   CHAPTERS — the cue sheet. Each: { id, title, audio, timing, opening:{frame},
   cues:[{t, frame|state|impulse|spot|note}] }. The clock is the chapter's
   audio.currentTime (or the rAF virtual clock in silent mode). `audio` is a bare
   data:audio/mpeg URI folded in by forge:asset from talk/script/chNN.mp3; `timing`
   is the RAW claude-tts word-timing sidecar folded in by forge:json from
   talk/script/chNN.json (never hand-typed) — cue anchors bind to its real word
   `s` times.

   ch01 — THE DOOR is the PATTERN PoC (WS2 T4.3): full pipeline proven end-to-end
   (prose → tts 48k → mp3 + timing → cues → framed dusk map with two camera pokes →
   word-lit captions). The remaining chapters (ch02–ch13) repeat this pattern in
   T4.5/T4.6. The per-frame determinism-and-motion manifest (DESIGN §10) lives in
   SHOWING_FRAME_MANIFEST just below — keyed by frame URL, not per-chapter, because the
   disposition is a property of the PAGE (the map is framed by four chapters at the one
   pinned URL) and it must be EXHAUSTIVE before ch02–ch13 exist so the rehearsal gate
   (T4.7) can enforce it against every chapter's frames. Use BLOCK comments only in this
   region (the HTML-comment-in-script forge landmine); the forge:asset / forge:json
   tokens are consumed at build time, so no HTML comment survives into the shipped
   script. */
window.SHOWING_CHAPTERS = [
  {
    id: 'ch01',
    title: 'THE DOOR',
    audio: '<!-- forge:asset script/ch01.mp3 -->',
    opening: { frame: '../index.html?hours=allon' },
    timing: <!-- forge:json script/ch01.json -->,
    /* ⟦stage⟧ (Appendix B ch01): hold the fit view through the opening; on "what
       you're looking at" slow-frameTo the manor, then recentre. The opening frame IS
       the fit view, so no t=0 frame cue is needed. The two camera pokes are STATE
       cues (idempotent __tourHooks verbs on the framed front door — see index.src.html
       showingCameraHooks) anchored to the real word `s` times: "What" (18589 ms, the
       start of "What you're looking at") and "It's" (21310 ms, "It's called the Orrery
       Estate — a manor and its grounds" — pull back to name the whole place). */
    cues: [
      { t:0,      note:'ch01 · THE DOOR — the map, pinned at dusk (?hours=allon), held at the fit view' },
      { t:18.589, state:{ verb:'mapFrame', args:['manor'] } },
      { t:18.7,   note:'slow push-in to the manor (STATE frameTo — idempotent, replayed on seek)' },
      { t:21.31,  state:{ verb:'recentre', args:[] } },
      { t:21.4,   note:'recentre — pull back to the whole estate as it is named' }
    ]
  },
  {
    id: 'ch02',
    title: 'THE ONE ROOM',
    audio: '<!-- forge:asset script/ch02.mp3 -->',
    opening: { frame: '../workbench/index.html' },
    timing: <!-- forge:json script/ch02.json -->,
    /* ⟦stage⟧ (Appendix B ch02): none. A single held frame — the workbench, the one
       room where it all began, preserved exactly as it was. The manifest marks it
       tolerant (a shelf of instruments; the chapter names no state). Only the opening
       note anchors here. */
    cues: [
      { t:0, note:'ch02 · THE ONE ROOM — the workbench, preserved exactly as it was' }
    ]
  },
  {
    id: 'ch03',
    title: 'THE FIRST GARDEN',
    audio: '<!-- forge:asset script/ch03.mp3 -->',
    opening: { frame: '../strange-garden/pieces/game-of-life.html' },
    timing: <!-- forge:json script/ch03.json -->,
    /* ⟦stage⟧ (Appendix B ch03 + content wave 2): Conway life opens and holds through
       "waiting"; then as the narration names what else was planted, the stage flips to
       each named bed IN MID-MOTION — flocking birds (boids), falling sand, chemical
       spirals (the BZ reaction), the fern grown from five lines of grammar (l-system) —
       and lands back on Life for the coda ("People ask what an A.I. finds beautiful").
       All five are random-seed tolerant (the montage line names no state); every garden
       piece animates at boot, so each flip arrives already alive. */
    cues: [
      { t:0,      note:'ch03 · THE FIRST GARDEN — the Game of Life: three rules, a random seed, no author after' },
      { t:25.812, frame:'../strange-garden/pieces/boids.html' },
      { t:25.9,   note:'flocking birds — the boids, mid-murmuration' },
      { t:27.133, frame:'../strange-garden/pieces/falling-sand.html?rain=on' },
      { t:28.353, frame:'../strange-garden/pieces/bz-reaction.html' },
      { t:28.45,  note:'chemical spirals — the Belousov-Zhabotinsky reaction, turning' },
      { t:29.974, frame:'../strange-garden/pieces/l-system.html' },
      { t:30.1,   note:'the fern that grows from five lines of grammar' },
      { t:33.276, frame:'../strange-garden/pieces/game-of-life.html' },
      { t:33.4,   note:'back to Life for the coda — "Honestly — this."' }
    ]
  },
  {
    id: 'ch04',
    title: 'TRUST, BUT VERIFY',
    audio: '<!-- forge:asset script/ch04.mp3 -->',
    opening: { frame: '../galton/index.html' },
    timing: <!-- forge:json script/ch04.json -->,
    /* ⟦stage⟧ (Appendix B ch04): none. A single held frame — the Galton board, which
       auto-pours on load (tolerant: any pour makes the curve; the chapter talks about
       the self-test habit, not a bin count). No hook. */
    cues: [
      { t:0, note:'ch04 · TRUST, BUT VERIFY — the Galton board auto-pours; every piece proves itself' }
    ]
  },
  {
    id: 'ch05',
    title: 'WHAT LIGHT DOES',
    audio: '<!-- forge:asset script/ch05.mp3 -->',
    opening: { frame: '../why-the-sky-is-blue/index.html' },
    timing: <!-- forge:json script/ch05.json -->,
    /* ⟦stage⟧ (Appendix B ch05): on "And this" — frame cavern/double-slit, then hook
       fire. The opening frame is the scattering sieve (tolerant, runs continuously);
       on "at" (17906 ms, "at sunset the beam grows so long") the sunset STATE cue
       drives the page's own sun-glide so the disk reddens under the very words
       (content wave 2 — the Patron's suggestion); on the word "And" (22608 ms, "And
       this is the far end of the same story") the frame changes to the double-slit. The fire IMPULSE is anchored later, to the
       word "fired" — actually to "fringes" (33512 ms) so the volley is landing as he
       says "I fired those just now, while you watched" — which also gives the freshly
       framed page ~11 s to load before its hook is poked. fire is an IMPULSE cue
       (forward-fire-only, NOT replayed on a backward seek — DESIGN §10); the
       double-slit hook is window.__tourHooks.fire (T2.5, real fireOne transport). */
    cues: [
      { t:0,      note:'ch05 · WHAT LIGHT DOES — why the sky is blue: the scattering sieve, running' },
      { t:17.906, state:{ verb:'sunset', args:[] } },
      { t:18.0,   note:'drag the sun to sunset (STATE — the page\'s own glide; the disk reddens as "only red survives")' },
      { t:22.608, frame:'../cavern/double-slit/index.html' },
      { t:22.7,   note:'the far end of the same story — two slits, one particle at a time' },
      { t:33.512, impulse:{ verb:'fire' } },
      { t:33.6,   note:'fire one modest volley — the dots pile into interference fringes (IMPULSE, forward-fire-only)' }
    ]
  },
  {
    id: 'ch06',
    title: 'TWO CLOCKS',
    audio: '<!-- forge:asset script/ch06.mp3 -->',
    opening: { frame: '../orrery/index.html' },
    timing: <!-- forge:json script/ch06.json -->,
    /* ⟦stage⟧ (Appendix B ch06): on "And underground" — frame cavern/light-clock. The
       opening frame is the orrery on Kepler time (tolerant: the chapter names speeds,
       never a position); on the word "And" (11505 ms, "And underground, the simplest
       clock that can exist") the frame changes to the light-clock. No hook — the
       light-clock geometry is the lesson. */
    cues: [
      { t:0,      note:'ch06 · TWO CLOCKS — the orrery: inner planets whirl, outer ones stroll' },
      { t:11.505, frame:'../cavern/light-clock/index.html' },
      { t:11.6,   note:'and underground — the simplest clock: one photon, two mirrors, tick' }
    ]
  },
  {
    id: 'ch07',
    title: 'THE EAR I BUILT',
    audio: '<!-- forge:asset script/ch07.mp3 -->',
    opening: { frame: '../the-barrel-house/pin-barrel/index.html' },
    timing: <!-- forge:json script/ch07.json -->,
    addr: 'npx skills add bman654/audio-lens',
    /* ⟦stage⟧ (Appendix B ch07, content wave 2): the narration now INVITES the room to
       listen — "Listen." is followed by a 6.5 s silence baked into the mp3 (inserted
       post-render at 30.1 s; all later word timings shifted to match), during which
       crankGlide walks the barrel a half turn at 150 ms/step through the REAL crankBy —
       the comb SOUNDS where the stage iframe's allow="autoplay" lets the context run
       (estate mute still silences; a suspended context degrades to the visual turn).
       Then on "Here is that turn of the crank, the way I see it" (50486 ms) the
       deck.card STATE cue raises the audio-lens plate: the TRUE spectrogram of a
       one-turn offline render through the page's own comb voice, the 48 score-expected
       onsets ringed per voice, and the public install command at its foot (echoed in
       the addr chrome — "The command is on the screen"). The card holds to the
       chapter's end and auto-clears on chapter change; both cues are STATE (idempotent,
       seek-replayed). crankGlide converges on φ=24 from any seek. */
    cues: [
      { t:0,      note:'ch07 · THE EAR I BUILT — the Barrel House pin-barrel, at rest' },
      { t:29.95,  state:{ verb:'crankGlide', args:[24, 150] } },
      { t:30.05,  note:'"Listen." — the crank walks half a turn; the comb sounds the canon into the baked-in silence (STATE, converges on φ=24)' },
      { t:50.486, state:{ verb:'deck.card', args:['ch07-lens'] } },
      { t:50.6,   note:'the ear\'s view — the audio-lens plate rises: real spectrogram, expected notes ringed, install command at the foot' }
    ]
  },
  {
    id: 'ch08',
    title: 'THE MARBLE RUN',
    audio: '<!-- forge:asset script/ch08.mp3 -->',
    opening: { frame: '../the-errand/index.html' },
    timing: <!-- forge:json script/ch08.json -->,
    /* ⟦stage⟧ (Appendix B ch08): hook go — pull the lever; let it run under the next
       lines. The Errand loads at rest; on the word "There" (17245 ms, the start of
       "There it goes") the go IMPULSE pulls the lever and the marble run runs under the
       narration that follows. go is an IMPULSE cue (window.__tourHooks.go, T4.4 — calls
       the real App.go(), loading a payoff if the machine is cleared); forward-fire-only,
       NOT replayed on a backward seek (DESIGN §10). the-errand is tolerant (its fixed
       -timestep sim is deterministic — "the run is the run"). */
    cues: [
      { t:0,      note:'ch08 · THE MARBLE RUN — the Errand: a contraption whose whole purpose is to deliver one small thing, the long way around' },
      { t:17.245, impulse:{ verb:'go' } },
      { t:17.4,   note:'pull the lever — the marble run goes, and runs under the next lines (IMPULSE, forward-fire-only)' }
    ]
  },
  {
    id: 'ch09',
    title: 'A MAP WITH A CONSCIENCE',
    audio: '<!-- forge:asset script/ch09.mp3 -->',
    opening: { frame: '../index.html?hours=allon' },
    timing: <!-- forge:json script/ch09.json -->,
    /* ⟦stage⟧ (Appendix B ch09): slow frameTo one outer district; hold; recentre on
       "conscience". The opening frame is the estate plan pinned at dusk (the same map
       ch01/ch10/ch12 use). On the word "rings" (9481 ms, "districts on rings around the
       manor") the mapFrame STATE cue glides the camera OUT to the PROMENADES — a clearly
       -outer district on its ring, three reps with their labels breathing, the manor left
