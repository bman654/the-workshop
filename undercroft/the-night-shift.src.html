<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Shift · a Lantern tale</title>
<style>
  :root{
    --accent:#a9b8d8;
    --bg:#0a0b0e; --bg2:#0e1015;
    --ink:#ece7da; --ink-soft:#bdb8aa; --muted:#7a766c;
    --line:rgba(169,184,216,.16); --panel:rgba(255,255,255,.025);
    --ok:#7fd28a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  html{ background:var(--bg); }
  body{
    background:
      radial-gradient(1100px 760px at 50% -10%, rgba(169,184,216,.07), transparent 60%),
      radial-gradient(700px 560px at 50% 120%, rgba(169,184,216,.04), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  a{ color:inherit; }

  /* top bar */
  .topbar{ width:100%; max-width:940px; display:flex; align-items:center;
    justify-content:space-between; padding:18px 26px 0; }
  .topbar .left{ display:flex; gap:18px; align-items:center; }
  .back{ font:600 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); text-decoration:none; opacity:.8; transition:.25s; }
  .back:hover{ color:var(--accent); opacity:1; }
  .mark{ font:600 11px/1 var(--mono); letter-spacing:.32em; text-transform:uppercase;
    color:var(--muted); opacity:.62; }

  /* self-test chip */
  .selftest{ display:inline-flex; align-items:center; gap:7px;
    font:11px/1 var(--mono); padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,.02);
    color:var(--muted); cursor:default; user-select:none; letter-spacing:.02em; }
  .selftest.ok{ color:var(--ok); border-color:rgba(127,210,138,.4); background:rgba(127,210,138,.08); }
  .selftest.bad{ color:#f08a7a; border-color:rgba(240,138,122,.5); background:rgba(240,138,122,.1); }
  .selftest .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  /* stage */
  .stage{ flex:1 0 auto; width:100%; max-width:940px; padding:22px 26px 60px;
    display:flex; flex-direction:column; }

  .frame{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:26px;
    align-items:start; }
  @media(max-width:720px){ .frame{ grid-template-columns:1fr; gap:18px; } }

  /* scene panel */
  .scenewrap{ position:relative; border:1px solid var(--line); border-radius:14px;
    background:linear-gradient(180deg, var(--bg2), #090a0d); overflow:hidden;
    aspect-ratio:5/3; min-height:200px; box-shadow:inset 0 0 80px -30px rgba(169,184,216,.12); }
  #scene{ position:absolute; inset:0; display:block; }
  #scene svg{ width:100%; height:100%; display:block; }
  .scenewrap .vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,.55)); }

  /* prose panel */
  .prosewrap{ display:flex; flex-direction:column; }
  .kicker{ font:600 10px/1 var(--mono); letter-spacing:.34em; text-transform:uppercase;
    color:var(--accent); opacity:.62; margin:0 0 9px; }
  .roomName{ font-weight:500; font-size:clamp(21px,3.4vw,27px); line-height:1.18;
    margin:0 0 14px; color:var(--ink); }
  #prose{ font-size:clamp(15.5px,2vw,17.5px); line-height:1.72; color:var(--ink-soft);
    max-width:54ch; }
  #prose .desc{ margin:0 0 1em; }
  #prose .event{ margin:0; color:var(--ink); padding-left:14px;
    border-left:2px solid var(--line); }
  #prose .event::first-letter{ color:var(--accent); }

  /* exits row */
  .label{ font:600 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); opacity:.85; margin:22px 0 8px; }
  #exits{ display:flex; flex-wrap:wrap; gap:8px; }
  .exit{ cursor:pointer; font:500 14px/1 var(--serif); letter-spacing:.01em;
    color:var(--ink-soft); background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:9px 15px; transition:.2s; position:relative; }
  .exit:hover, .exit:focus-visible{ color:var(--ink); border-color:var(--accent);
    background:rgba(169,184,216,.06); outline:none; }
  .exit .dir{ text-transform:capitalize; }
  .exit::before{ content:"→ "; color:var(--accent); opacity:.7; }
  .exit.barred{ color:var(--muted); opacity:.55; border-style:dashed; cursor:help; }
  .exit.barred::before{ content:"⊘ "; opacity:.6; }
  .exit.barred:hover{ border-color:var(--line); background:var(--panel); color:var(--ink-soft); opacity:.75; }

  /* inventory tray */
  #inv{ display:flex; flex-wrap:wrap; gap:8px; min-height:1em; }
  .item{ cursor:pointer; font:500 13px/1 var(--serif); color:var(--ink-soft);
    background:rgba(169,184,216,.05); border:1px solid var(--line); border-radius:20px;
    padding:7px 14px; transition:.2s; }
  .item::before{ content:"◆ "; color:var(--accent); opacity:.6; font-size:.8em; }
  .item:hover{ color:var(--ink); border-color:var(--accent); }
  .item.sel, .item.using{ color:var(--ink); border-color:var(--accent); background:rgba(169,184,216,.12); }

  /* context action bar */
  #actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:38px;
    margin-top:6px; padding:12px 14px; border:1px solid var(--line); border-radius:11px;
    background:var(--panel); }
  #actions .hint{ font:italic 400 13.5px/1.4 var(--serif); color:var(--muted); }
  .verb{ cursor:pointer; font:600 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); background:rgba(255,255,255,.03); border:1px solid var(--line);
    border-radius:7px; padding:9px 13px; transition:.2s; }
  .verb:hover, .verb:focus-visible{ color:var(--ink); border-color:var(--accent);
    background:rgba(169,184,216,.07); outline:none; }
  .verb.use{ color:var(--accent); border-color:var(--accent); }
  .verb.ghost{ color:var(--muted); opacity:.8; text-transform:none; font-style:italic;
    font-family:var(--serif); letter-spacing:0; font-size:12.5px; }
  .verb.thingtap{ text-transform:none; font-family:var(--serif); letter-spacing:.01em;
    font-weight:500; font-size:13px; }

  .muted{ color:var(--muted); font:italic 400 13px/1.4 var(--serif); opacity:.8; }

  /* play controls */
  .controls{ display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; align-items:center; }
  button.ctl{ font:600 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
    cursor:pointer; border-radius:8px; padding:11px 16px; transition:.2s;
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink-soft); }
  button.ctl:hover{ border-color:var(--accent); color:var(--ink); background:rgba(169,184,216,.06); }
  button.ctl:active{ transform:translateY(1px); }
  button.ctl.primary{ color:var(--accent); border-color:var(--accent); }
  .controls .spacer{ flex:1; }

  /* overlay cards (title + win) */
  .card{ position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    padding:30px; background:radial-gradient(900px 700px at 50% 30%, rgba(8,16,15,.7), rgba(6,7,9,.94));
    backdrop-filter:blur(3px); transition:opacity .5s; }
  .card.hidden{ opacity:0; pointer-events:none; }
  .cardinner{ max-width:560px; text-align:center; }
  .cardinner .glyph{ font-size:42px; filter:drop-shadow(0 0 22px rgba(169,184,216,.45)); margin-bottom:14px; }
  .cardinner h1{ font-weight:500; font-size:clamp(28px,6vw,42px); margin:0 0 8px; color:var(--ink);
    letter-spacing:.01em; }
  .cardinner .byline{ font:600 10px/1 var(--mono); letter-spacing:.34em; text-transform:uppercase;
    color:var(--accent); opacity:.7; margin-bottom:22px; }
  .cardinner .intro{ font-size:clamp(15.5px,2.3vw,18px); line-height:1.74; color:var(--ink-soft);
    margin:0 auto 30px; max-width:46ch; text-align:left; }
  .cardinner .wintext{ font-size:clamp(15.5px,2.3vw,18px); line-height:1.78; color:var(--ink-soft);
    margin:0 auto 28px; max-width:46ch; text-align:left; font-style:italic; }
  .bigbtn{ font:600 12px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer; border-radius:10px; padding:15px 34px; transition:.25s;
    border:1px solid var(--accent); background:rgba(169,184,216,.1); color:var(--accent); }
  .bigbtn:hover{ background:rgba(169,184,216,.2); color:#fff; }
  .winactions{ display:flex; gap:12px; justify-content:center; margin-top:22px; }

  @media(prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .card{ backdrop-filter:none; }
  }
  @media(max-width:560px){
    .stage{ padding:18px 18px 50px; }
    .topbar{ padding:14px 18px 0; flex-wrap:wrap; gap:10px; }
  }
</style>
</head>
<body>
  <div id="lantern-root">
    <div class="topbar">
      <div class="left">
        <!-- a HIDDEN piece: the only door back is the Undercroft (never the public shelf) -->
        <a class="back" href="index.html">← the undercroft</a>
      </div>
      <div class="left">
        <div id="selftest" class="selftest" title="Built-in solver: this tale is provably winnable & softlock-free.">
          <span class="dot"></span><span id="stText">running self-test…</span>
        </div>
        <div class="mark">Lantern</div>
      </div>
    </div>

    <main class="stage">
      <div class="frame">
        <div class="scenewrap">
          <div id="scene"></div>
          <div class="vignette"></div>
        </div>
        <div class="prosewrap">
          <div class="kicker">The Night Shift</div>
          <h2 class="roomName" id="roomName">—</h2>
          <div id="prose"></div>
        </div>
      </div>

      <div class="label">Ways on</div>
      <div id="exits"></div>

      <div class="label">In hand</div>
      <div id="inv"></div>

      <div class="label">Act</div>
      <div id="actions"></div>

      <div class="controls">
        <button class="ctl primary" id="playBtn" title="Watch the tale solve itself">▶ Let it play</button>
        <button class="ctl" id="startOverBtn" title="Clear the save and begin again">↺ Start over</button>
        <div class="spacer"></div>
      </div>
    </main>
  </div>

  <!-- title card -->
  <div class="card" id="titleCard">
    <div class="cardinner">
      <div class="glyph">🕯️</div>
      <h1 id="tcTitle">The Night Shift</h1>
      <div class="byline" id="tcByline">a Lantern tale</div>
      <p class="intro" id="tcIntro"></p>
      <button class="bigbtn" id="beginBtn">Begin</button>
    </div>
  </div>

  <!-- win ending -->
  <div class="card hidden" id="winCard">
    <div class="cardinner">
      <div class="glyph">☾</div>
      <h1 id="winTitle">The Night Watch</h1>
      <p class="wintext" id="winText"></p>
      <div class="winactions">
        <button class="bigbtn" id="winOverBtn">Walk it again</button>
      </div>
    </div>
  </div>

<!-- win-card "walk it again" wiring (chrome-local, not engine) -->
<script>
(function(){
  var wb = document.getElementById('winOverBtn');
  if (wb) wb.addEventListener('click', function(){
    var c = document.getElementById('winCard'); if (c) c.classList.add('hidden');
    var so = document.getElementById('startOverBtn'); if (so) so.click();
  });
})();
</script>
</body>
</html>
