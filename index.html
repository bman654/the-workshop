/* the manor's south door — the origin of the whole circulation graph. Derived by
   the Layout engine (the spine's south terminus) rather than hardcoded. */
const MANOR_DOOR = LAYOUT.door || { x:721, y:504 };

const precincts  = document.getElementById("precincts");
const manorG     = document.getElementById("manor");
const zonelabels = document.getElementById("zonelabels");
const viewport   = document.getElementById("viewport");

/* Build one POI <a> (footprint + glyph + leader + label + card behaviour).
   `asLink` lets the Undercroft be a non-navigating <div> while broken.        */
function buildPoi(r, opts){
  opts = opts || {};
  const asLink = opts.asLink !== false;       // default: a real link
  const a = el(asLink ? "a" : "g", {
    class:"poi"+(r.locked?" undercroft":"")+(opts.extraClass?(" "+opts.extraClass):""),
    style:`--c:${r.accent}` });
  if (asLink){ a.setAttribute("href", r.href); a.setAttribute("tabindex","0");
    a.setAttribute("aria-label", r.room+" — "+r.piece+", "+r.tag); }
  else { a.setAttribute("role","img"); a.setAttribute("aria-label", r.room+" — sealed; the way is lost"); }
  a.dataset.id = r.id;

  // keyboard focus ring around the footprint bbox
  const bb = footBBox(r);
  a.appendChild(el("rect",{ x:bb.x-7, y:bb.y-7, width:bb.w+14, height:bb.h+14,
    rx:4, class:"focusring" }));

  // footprint linework
  const fg = el("g",{});
  DRAW[r.footprint](fg, r);
  a.appendChild(fg);

  // a soft warm lamp glow at the footprint's heart (candlelit from inside),
  // behind the glyph — lifts to the wing's accent on hover. Skipped for the
  // broken cellar stair (it is dark until the way is restored).
  const {cx,cy} = footCentre(r);
  if(!(r.locked && opts.extraClass==="broken")){
    a.appendChild(el("circle",{ cx, cy, r:13, class:"fp-lamp" }));
  }

  // emoji glyph at the footprint's heart
  const gly = el("text",{ x:cx, y:cy+5, "text-anchor":"middle", class:"glyph-emoji" });
  gly.textContent = r.glyph;
  a.appendChild(gly);

  // ---- leader line + label group ----
  // The leader is drawn from the footprint edge to the label; the label sits in
  // its own <g.labelgroup> typeset at a LOCAL origin (roomname baseline at 0,0)
  // so placeLabels() can translate the whole block to the engine-solved slot and
  // flip its text-anchor as one unit. The leader is (re)drawn from the footprint
  // boundary to the label's nearest edge once the slot is known.
  const leaderPath = el("path",{ class:"leader" });
  const leaderDot  = el("circle",{ r:2, class:"leader-dot" });
  a.appendChild(leaderPath);
  a.appendChild(leaderDot);

  const lg = el("g",{ class:"labelgroup" });
  // room name (local origin)
  const nm = el("text",{ x:0, y:0, "text-anchor":"start", class:"roomname" });
  nm.textContent = r.room;
  lg.appendChild(nm);
  // a short accent kicker rule under the room name
  const rule = el("line",{ x1:0, y1:5, x2:26, y2:5, class:"roomrule" });
  lg.appendChild(rule);
  // sub (piece · tag) — or the Undercroft's state line
  const sub = el("text",{ x:0, y:18, "text-anchor":"start", class:"roomsub" });
  sub.textContent = r.locked
    ? (asLink ? "DESCEND ▾" : "THE WAY IS LOST")
    : (r.piece.toUpperCase()+" · "+r.tag);
  lg.appendChild(sub);
  // optional companion "within" indicator
  let within = null;
  if(r.companion){
    within = el("text",{ x:0, y:33, "text-anchor":"start", class:"within" });
    within.textContent = "↳ "+r.companion.name+" within";
    lg.appendChild(within);
  }
  a.appendChild(lg);

  // hand the registry everything placeLabels() needs to measure, position the
  // label group, set its text-anchor, and (re)draw the leader for this POI.
  LABELS.set(a, { r, group:lg, leader:leaderPath, dot:leaderDot,
                  texts:[nm, sub].concat(within?[within]:[]), rule });

  // ---- card behaviour ----
  const show = ()=> openCard(r, a);
  a.addEventListener("mouseenter", show);
  a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hideCard);
  a.addEventListener("blur", hideCard);

  // record which doors you open — the ws: breadcrumb, via the shared module,
  // written synchronously on click BEFORE the <a> navigates (harmless if storage off).
  if (asLink){
    a.addEventListener("click", ()=>{ try{ WS.seen(r.id); }catch(e){} });
  }

  return a;
}

/* ---- card positioning: place near the hovered footprint, clamped to viewport ---- */
function openCard(r, a){
  document.getElementById("c-room").textContent = r.room;
  document.getElementById("c-emoji").textContent = r.glyph;
  document.getElementById("c-name").textContent = r.piece;
  document.getElementById("c-tag").textContent = r.tag;
  document.getElementById("c-blurb").textContent = r.blurb;
  const wi = document.getElementById("c-within");
  if(r.companion){
    wi.style.display = "inline-flex";
    document.getElementById("c-wemoji").textContent = r.companion.glyph;
    document.getElementById("c-wname").textContent = r.companion.name;
  } else wi.style.display = "none";
  const open = document.getElementById("c-open");
  // the locked-but-broken Undercroft shows no "Open" affordance (there is no way down)
  if(r.locked && a.tagName.toLowerCase() !== "a"){ open.textContent = "the way is lost"; open.style.opacity=".7"; }
  else if(r.locked){ open.textContent = "Descend ▸"; open.style.opacity="0.92"; }
  else { open.textContent = "Open ▸"; open.style.opacity="0.92"; }
  card.style.setProperty("--cc", r.accent);

  // map the footprint's screen bbox → a card position beside it
  const bb = a.getBoundingClientRect();
  card.classList.add("show");                 // make measurable
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let left = bb.right + 14;
  let top  = bb.top;
  if(left + cw > window.innerWidth - 12) left = bb.left - cw - 14;       // flip left
  if(left < 12) left = Math.min(window.innerWidth - cw - 12, Math.max(12, bb.left));
  if(top + ch > window.innerHeight - 12) top = window.innerHeight - ch - 12;
  if(top < 12) top = 12;
  card.style.left = left + "px";
  card.style.top  = top + "px";
}
function hideCard(){ card.classList.remove("show"); }

/* ── a tree-lined survey avenue: a faint dashed quadratic path from the manor door to a
   target, flanked by small paired tree-dots so the open ground reads as planted grounds.
   Trees are placed along the curve's normal, skipping the ends (door / building).      */
function drawAvenue(x0,y0, cx,cy, mx,my, opts){
  opts = opts || {};
  paths.appendChild(el("path",{ class:"survey-path",
    d:`M${x0} ${y0} Q${mx} ${my} ${cx} ${cy}` }));
  if(opts.trees===false) return;
  const Q = t => {                              // point on the quadratic Bézier at t
    const u=1-t;
    return [ u*u*x0 + 2*u*t*mx + t*t*cx, u*u*y0 + 2*u*t*my + t*t*cy ];
  };
  const dQ = t => {                             // tangent (for the perpendicular offset)
    return [ 2*(1-t)*(mx-x0) + 2*t*(cx-mx), 2*(1-t)*(my-y0) + 2*t*(cy-my) ];
  };
  const N = opts.count==null ? 4 : opts.count, off = opts.off==null ? 11 : opts.off;
  for(let i=1;i<=N;i++){
    const t = 0.16 + (i/(N+1))*0.7;             // skip the door & the building ends
    const [px,py] = Q(t); const [tx,ty] = dQ(t);
    const len = Math.hypot(tx,ty) || 1; const nx=-ty/len, ny=tx/len;
    pois && paths.appendChild(el("circle",{ cx:px+nx*off, cy:py+ny*off, r:2.6, class:"avenue-tree" }));
    paths.appendChild(el("circle",{ cx:px-nx*off, cy:py-ny*off, r:2.6, class:"avenue-tree" }));
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   THE DECLARATIVE LAYOUT, RENDERED — district precincts, wing sub-precincts, the
   manor shell + entrance, the circulation graph, and the engraved zone/wing labels
   are ALL drawn from the LAYOUT solution. No hand-placed pixels: every boundary,
   route, and label position is derived from the room declarations.
   ════════════════════════════════════════════════════════════════════════════ */

/* a rounded-rect path (so a hull can be drawn as one <path>) */
function roundRectPath(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  return `M${x+r} ${y} H${x+w-r} A${r} ${r} 0 0 1 ${x+w} ${y+r} V${y+h-r}`
       + ` A${r} ${r} 0 0 1 ${x+w-r} ${y+h} H${x+r} A${r} ${r} 0 0 1 ${x} ${y+h-r}`
       + ` V${y+r} A${r} ${r} 0 0 1 ${x+r} ${y} Z`;
}

/* draw every DISTRICT precinct hull (tint + double rule) behind the plan, then its
   WING sub-precincts (accent-washed dashed party-walls). The manor is drawn richer. */
function drawPrecincts(){
  // district hulls + tints
  LAYOUT.districtRects.forEach(d=>{
    const r = 14;
    const tintFill = `color-mix(in srgb, ${d.hue} ${Math.round(d.tint*100)}%, transparent)`;
    // tint wash
    precincts.appendChild(el("path",{ d:roundRectPath(d.x,d.y,d.w,d.h,r),
      class:"precinct-tint", fill:tintFill }));
    if(d.district==="cavern"){
      // a quarantined hatch over the tint
      precincts.appendChild(el("path",{ d:roundRectPath(d.x,d.y,d.w,d.h,r), class:"precinct-hatch" }));
    }
    // the double-ruled boundary (manor richer + warm)
    const boundCls = d.district==="manor" ? "precinct precinct-manor"
                   : d.district==="grounds" ? "precinct precinct-park"
                   : d.district==="observatory" ? "precinct precinct-rise"
                   : "precinct";
    precincts.appendChild(el("path",{ d:roundRectPath(d.x,d.y,d.w,d.h,r), class:boundCls }));
    if(d.district==="manor"){
      precincts.appendChild(el("path",{ d:roundRectPath(d.x+5,d.y+5,d.w-10,d.h-10,r-2),
        class:"precinct-inner" }));
    }
  });
  // wing sub-precinct hulls (accent-washed dashed party-walls)
  LAYOUT.wingRects.forEach(w=>{
    const r = 8;
    const g = el("g",{ style:`--wa:${w.accent}` });
    g.appendChild(el("path",{ d:roundRectPath(w.x,w.y,w.w,w.h,r), class:"wing-tint" }));
    g.appendChild(el("path",{ d:roundRectPath(w.x,w.y,w.w,w.h,r), class:"wing-bound" }));
    precincts.appendChild(g);
  });
}

/* draw the MANOR shell interior: a candle pool deepening + a cross-passage hall +
   the central stair-hall, all positioned from the solved manor district rect. */
function drawManorInterior(){
  const m = LAYOUT.districtRects.find(d=>d.district==="manor");
  if(!m) return;
  const cx = m.x + m.w/2, cy = m.y + m.h/2;
  // a candle pool deepening at the house heart
  manorG.appendChild(el("ellipse",{ cx, cy, rx:m.w*0.5, ry:m.h*0.42, fill:"rgba(201,162,74,.035)" }));
  // the central corridor cross (great hall + cross-passage)
  manorG.appendChild(el("line",{ x1:cx, y1:m.y+8, x2:cx, y2:m.y+m.h-8,
    stroke:"var(--line-warm)", "stroke-width":".9", opacity:".34" }));
  manorG.appendChild(el("line",{ x1:m.x+8, y1:cy, x2:m.x+m.w-8, y2:cy,
    stroke:"var(--line-warm)", "stroke-width":".9", opacity:".34" }));
  // the great central stair-hall at the crossing
  const sg = el("g",{ opacity:".5" });
  sg.appendChild(el("rect",{ x:cx-16, y:cy-16, width:32, height:32, class:"fp-fine" }));
  for(let i=1;i<4;i++) sg.appendChild(el("line",{ x1:cx-16, y1:cy-16+i*8, x2:cx+16, y2:cy-16+i*8, class:"fp-fine" }));
  manorG.appendChild(sg);
}

/* draw the marked FRONT DOOR at the spine's south terminus: a portico apron +
   colonnade + a brass medallion + a "YOU ARE HERE / ENTER" plate. */
function drawEntrance(){
  const door = LAYOUT.door;
  const m = LAYOUT.districtRects.find(d=>d.district==="manor");
  // portico apron beneath the door (a step slab + paired colonnade dots)
  const aw = 150, ax = door.x - aw/2, ay = door.y;
  manorG.appendChild(el("rect",{ x:ax, y:ay, width:aw, height:18, rx:1.5,
    fill:"rgba(201,162,74,.04)", stroke:"var(--line-warm)", "stroke-width":".9", opacity:".55" }));
  const colG = el("g",{ fill:"var(--paper)", stroke:"var(--line-warm)", "stroke-width":".9", opacity:".72" });
  for(const dx of [-58,-40,-22,22,40,58]) colG.appendChild(el("circle",{ cx:door.x+dx, cy:ay+11, r:3.2 }));
  manorG.appendChild(colG);
  // the brass door medallion at the door, centred on the threshold
  manorG.appendChild(el("circle",{ cx:door.x, cy:door.y, r:11, class:"door-medallion" }));
  const dgl = el("text",{ x:door.x, y:door.y+4.5, "text-anchor":"middle", class:"door-glyph" });
  dgl.textContent = "▾"; manorG.appendChild(dgl);
  // the "YOU ARE HERE / ENTER" plate just below the apron
  const plate = el("text",{ x:door.x, y:ay+34, "text-anchor":"middle", class:"door-plate" });
  plate.textContent = "▸ YOU ARE HERE · ENTER";
  manorG.appendChild(plate);
}

/* draw the circulation GRAPH from the solved adjacency: the heavy warm SPINE up
   the manor centre, district AVENUES from the door to each district gate (reusing
   the tree-lined avenue idiom), WING AISLES, and short room STUBS. */
function drawCirculation(){
  const G = LAYOUT.graph;
  // the spine — a heavy warm avenue up the manor centre from the door
  if(G.spine) paths.appendChild(el("path",{ class:"spine",
    d:`M${G.spine.x0} ${G.spine.y0} L${G.spine.x1} ${G.spine.y1}` }));
  // district avenues — tree-lined, from the door to each district gate
  G.avenues.forEach(av=>{
    const midx = (av.x0 + av.x1)/2, midy = Math.max(av.y0, av.y1) + 24;
    drawAvenue(av.x0, av.y0, av.x1, av.y1, midx, midy, { count:3, off:9 });
  });
  // wing aisles (lighter dashed branches to each wing boundary)
  G.aisles.forEach(a=> paths.appendChild(el("path",{ class:"aisle",
    d:`M${a.x0} ${a.y0} L${a.x1} ${a.y1}` })));
  // short room stubs (kin connectors from each footprint toward its wing centre)
  G.stubs.forEach(s=> paths.appendChild(el("path",{ class:"room-stub",
    d:`M${s.x0} ${s.y0} L${s.x1} ${s.y1}` })));
}

/* engrave each DISTRICT zone label ON its boundary (a brass tab + a flanking rule),
   and each WING label on its wing-rect's top edge — never floating. */
function drawZoneLabels(){
  LAYOUT.districtRects.forEach(d=>{
    // seat the label on the district's top boundary, centred
    const lx = d.x + d.w/2, ly = d.y - 4;
    // a short flanking rule under the engraved tab
    zonelabels.appendChild(el("line",{ x1:lx-58, y1:d.y, x2:lx-30, y2:d.y, class:"zone-tab" }));
    zonelabels.appendChild(el("line",{ x1:lx+30, y1:d.y, x2:lx+58, y2:d.y, class:"zone-tab" }));
    const t = el("text",{ x:lx, y:ly, "text-anchor":"middle", class:"zone-label" });
    t.textContent = d.label;
    zonelabels.appendChild(t);
  });
  LAYOUT.wingRects.forEach(w=>{
    const lx = w.x + 8, ly = w.y - 3;
    const t = el("text",{ x:lx, y:ly, "text-anchor":"start", class:"wing-label",
      style:`--wa:${w.accent}` });
    t.textContent = w.label;
    zonelabels.appendChild(t);
  });
}

/* the FIRST-VISIT THREAD: on a visitor's first load (no ws:seen breadcrumbs), light
   a soft pulsing thread from the door up the spine to the nearest unseen tier-1
   anchor — an explicit on-ramp. Fades once any room is seen. Degrades to nothing. */
function drawFirstVisitThread(){
  let seenAny = false;
  try{
    const store = WS.store();
    if(store && store.ok){
      for(const k in store.all){ if(k.indexOf("ws:seen:")===0){ seenAny = true; break; } }
    } else { return; }   // storage off → no thread
  }catch(e){ return; }
  if(seenAny) return;    // a returning visitor needs no on-ramp
  // the nearest unseen tier-1 anchor (by distance from the door)
  const door = LAYOUT.door;
  let best = null, bestD = Infinity;
  PLACES.forEach(r=>{
    if(r.locked || r.tier !== 1) return;
    const f = LAYOUT.foot[r.id]; if(!f) return;
    const c = f.r!=null ? {x:f.x,y:f.y} : {x:f.x+f.w/2, y:f.y+f.h/2};
    const dist = (c.x-door.x)**2 + (c.y-door.y)**2;
    if(dist < bestD){ bestD = dist; best = c; }
  });
  if(!best) return;
  // thread: door → spine top → the anchor
  const sp = LAYOUT.graph.spine;
  paths.appendChild(el("path",{ class:"first-thread",
    d:`M${door.x} ${door.y} L${sp.x1} ${sp.y1} L${best.x} ${best.y}` }));
  const tip = el("text",{ x:door.x+14, y:door.y-16, class:"first-thread-tip" });
  tip.textContent = "start here ↑";
  paths.appendChild(tip);
}

/* ════════════════════════════════════════════════════════════════════════════
   AUTOMATIC LABEL PLACEMENT — the plan letters itself with the LabelPlacer engine.

   Each POI's name is built (by buildPoi) into a <g.labelgroup> typeset at a local
   origin; placeLabels() measures every such group, then asks LabelPlacer.solve()
   for a layout in which no label overlaps another label, any footprint, or the
   fixed plan furniture, and all stay inside the frame. The curated `prefer` side
   on each PLACES entry SEEDS the solver, so the hand-composed look is the starting
   point and only colliding labels move. A FIXED SEED makes the layout identical on
   every visit. The viewBox scales uniformly, so we solve ONCE (never on resize).
   ════════════════════════════════════════════════════════════════════════════ */

/* the fixed plan furniture the labels must never cover (viewBox bboxes), beyond
   the footprints themselves. Tuned against the static SVG above.
   NOTE: the manor-house SHELL is deliberately NOT an obstacle here — the four wing
   footprints inside it ARE obstacles, and they collectively guard the manor's
   interior (an outward-pushed wing label that tried to fall inward would land on a
   neighbouring wing and be rejected). Adding the whole 270×208 shell instead would
   wall off the wings' own labels from ever escaping the house. */
/* The fixed plan furniture the labels must never cover (viewBox bboxes), beyond the
   footprints. The compass + scale bar are unchanged static furniture; the title
   block is now the DEMOTED corner nameplate (smaller, lower-left). The two old
   floating zone-label boxes are GONE — zone labels now sit ON district boundaries
   (drawn by the renderer), and the district hulls themselves are added as soft
   obstacles below so a POI label can't fall across a precinct boundary text. */
const FURNITURE = [
  { x:74,  y:82,  w:92,  h:92  },   // the compass rose (top-left)
  { x:816, y:798, w:212, h:52  },   // the scale bar (moved left to clear the revealed sky-tally)
  { x:96,  y:760, w:266, h:78  },   // the demoted corner survey nameplate ("The Workshop")
];
/* The Hours layer (theHours(), which runs BEFORE placeLabels) injects SVG furniture —
   the live clock/phase/self-test HUD — that bypasses the label solver. It registers its
   occupied box here so placeLabels() keeps the gnomon's own POI label off the HUD. */
const HOURS_FURNITURE = [];
/* the inner frame, inset a little so no label kisses the ruled border. */
const LABEL_BOUNDS = { x:46, y:52, w:1348, h:790 };
/* solver params — a fixed seed → deterministic layout; LABEL_GAP is the constant
   leader breathing-room margin ADDED to each footprint's half-extent (see labelGap)
   so a label always clears the building it names. */
const LABEL_SEED = 0x5EED;
const LABEL_GAP  = 14;
/* getBBox returns GEOMETRY only (no stroke); the roomname/sub carry a ~3px dark
   backing stroke, so we inflate the measured box by PAD on every side to keep that
   halo clear of neighbours, then translate accounting for the same inflation. */
const LABEL_PAD  = 3;

/* the per-POI solved placement, keyed by id, so a POI rebuilt after the solve
   (the Undercroft on rune-click: broken→whole) can REUSE its placement. */
const SOLVED = new Map();

/* side → text-anchor: a label left of its dot right-aligns toward the plan; right
   of its dot left-aligns; above/below reads centred. (Diagonals follow their E/W.) */
function sideToAnchor(side){
  if(side==="left"||side==="nw"||side==="sw") return "end";
  if(side==="right"||side==="ne"||side==="se") return "start";
  return "middle"; // top | bottom
}

/* lay out a label group's text + kicker rule for a chosen text-anchor, all about
   the group's LOCAL x=0 (roomname baseline at local y=0). The box {w,h} is the
   same whatever the anchor, so we can measure once and re-anchor freely. */
function applyAnchor(parts, anchor){
  parts.texts.forEach(t=> t.setAttribute("text-anchor", anchor));
  let rx1, rx2;
  if(anchor==="end"){ rx1=-26; rx2=0; }
  else if(anchor==="middle"){ rx1=-13; rx2=13; }
  else { rx1=0; rx2=26; }
  parts.rule.setAttribute("x1", rx1);
  parts.rule.setAttribute("x2", rx2);
}

/* position ONE label group at a solved label-box {x,y,w,h} + side, and (re)draw
   its leader from the footprint boundary to the label's nearest edge. */
function applyPlacement(parts, box, side){
  const anchor = sideToAnchor(side);
  applyAnchor(parts, anchor);
  // measure the (re-anchored) block in local coords, then translate so the inflated
  // box's top-left (geometry top-left minus PAD) lands on the solved rectangle.
  const bb = parts.group.getBBox();
  const tx = box.x - (bb.x - LABEL_PAD), ty = box.y - (bb.y - LABEL_PAD);
  parts.group.setAttribute("transform", `translate(${tx} ${ty})`);
  // the label rect in viewBox coords (what the leader must reach)
  const rect = { x:box.x, y:box.y, w:box.w, h:box.h };
  const fb = footBBox(parts.r);
  const {cx,cy} = footCentre(parts.r);
  // leader: from the footprint's boundary (toward the label) to the label's nearest
  // edge — a clean straight draughting line, side-agnostic.
  const lend = LabelPlacer.geom.nearestEdgePoint(cx, cy, rect);   // on the label
  const fstart = LabelPlacer.geom.nearestEdgePoint(lend[0], lend[1], fb); // on the footprint
  parts.leader.setAttribute("d", `M${fstart[0]} ${fstart[1]} L${lend[0]} ${lend[1]}`);
  parts.dot.setAttribute("cx", fstart[0]);
  parts.dot.setAttribute("cy", fstart[1]);
}

/* normalise a PLACES `prefer` hint (string | array | undefined) into a ranked list. */
function preferList(r){
  if(!r.prefer) return undefined;
  return Array.isArray(r.prefer) ? r.prefer.slice() : [r.prefer];
}

/* The label ANCHOR is the footprint's CENTRE — the natural focus the leader points
   back to. The engine's candidate slots sit `gap` away from the anchor on each
   side, so to keep a label off its OWN footprint we size the gap to the footprint's
   half-extent (below), letting every slot clear the building it names. */
function labelAnchor(r){
  const c = footCentre(r);
  return { x:c.cx, y:c.cy };
}

/* Per-feature GAP: the breathing room between the anchor (footprint centre) and the
   label box. Sized to clear the footprint's own half-extent on every side, plus a
   constant margin — so a label seats just OUTSIDE the structure it names, with a
   short, clean leader, whichever side the engine chooses. */
function labelGap(r){
  const b = footBBox(r);
  return Math.max(b.w, b.h) / 2 + LABEL_GAP;
}

/* ── THE SURVEY OF HEAVEN: engraved-asterism-name labels ───────────────────────
   The Sky module draws the stars, asterism lines, and the margin tally; the
   ENGRAVED NAMES of charted asterisms are routed through the SAME LabelPlacer
   pass as the POI labels, so a name can never collide with a room label, a
   footprint, or the plan furniture. We build each charted asterism's name <g>
   (typeset at a LOCAL origin like a roomname group), register it in SKY_LABELS,
   and placeLabels() adds it as a solver feature anchored at the wing's star-pair
   midpoint (out in the dark margin, beside its stars). */
const SKY_LABELS = new Map();   // wingId → { group, anchor:{x,y}, prefer, firstTime }

/* Curated BERTHS for the engraved asterism names: a roomy dark-margin anchor near
   each wing's stars + an inward side preference (toward the open plate, away from
   the frame). Each name is then tied to its constellation by a faint leader to the
   nearest charted star (added 2026-06-13 — proximity + shared brass ALONE read as
   "a label and a line both pointing at nothing", which fooled even the site's owner
   into reporting a bug; the leader makes the named sky legible as one unit, matching
   the leader every POI label already draws). The SAME solver keeps every name clear
   of POI labels, footprints, and furniture; the solver still adapts the exact side. */
const SKY_BERTH = {
  celestial: { x:130, y:470, prefer:['bottom','se','right'] },  // left band, below the tower
  letters:   { x:455, y:104, prefer:['top','left','bottom'] },  // top band, left of the manor
  design:    { x:990, y:104, prefer:['top','right','bottom'] }, // top band, right of the manor
  realm:     { x:120, y:560, prefer:['bottom','se','right'] },  // left band, below the map room
  garden:    { x:560, y:806, prefer:['bottom','right','top'] }, // bottom band, right of the cartouche
  labyrinth: { x:1316,y:500, prefer:['bottom','se','right'] },  // right band, above the maze
  // the feats constellation (bonus): the lens sits in the west grounds left margin
  // beside the Hall of Mirrors; its name berths to the RIGHT of the lens's lower apex,
  // out toward the open plate (clear of the Hall footprint and the cartouche).
  feats:     { x:118, y:650, prefer:['right','se','bottom'] },
  // the two orphaned-wing reward asterisms: the Automaton stands in the north grounds,
  // the Furnace rises in the far-right margin. Both name-boxes are PINNED (their box
  // top-left is fixed) at hand-verified star-clear voids — the right margin is too
  // crowded for a free solve to reliably find a 137–152px slot, and a free solve of two
  // extra names perturbs the six wings' placement (it dropped a sibling name onto its
  // own star). Pinned, they never move and never disturb the wings; DOM-truth verified
  // 0 overlaps in every state. The `pin` is the box's TOP-LEFT corner; `anchor`/`prefer`
  // pick the text alignment + the leader side the box flips toward its stars.
  automaton: { x:322, y:92,  prefer:['right','se','ne'], pin:{ x:173, y:58 } },  // void left of the figure (right of the compass)
  furnace:   { x:1300,y:760, prefer:['right','se','ne'], pin:{ x:1140, y:480 } } // center-right void above the daedalus footprint
};

/* (re)build the engraved-name groups for the currently-charted asterisms from the
   sky <g> the module produced (it carries __skyNamed + __skyState). Returns the
   sky <g>, or null if no sky was drawn. */
function buildSkyNames(skyG){
  SKY_LABELS.clear();
  if(!skyG || !skyG.__skyNamed || !skyG.__skyState) return skyG || null;
  const named = skyG.__skyNamed;          // [{ ast, firstTime }]
  named.forEach(({ ast, firstTime })=>{
    // anchor: this wing's curated margin berth (fallback: the star-pair midpoint)
    const berth = SKY_BERTH[ast.id];
    let anchor, prefer, pin = null;
    if(berth){ anchor = { x:berth.x, y:berth.y }; prefer = berth.prefer; pin = berth.pin || null; }
    else {
      let sx=0, sy=0, n=0;
      ast.members.forEach(mid=>{ const c = Sky.CATALOG[mid]; if(c){ sx+=c.x; sy+=c.y; n++; } });
      if(!n) return;
      anchor = { x:sx/n, y:sy/n };
    }
    // this wing's lit member-star coords — the leader ties the name to the nearest one
    const stars = ast.members.map(mid=> Sky.CATALOG[mid]).filter(Boolean)
                             .map(c=> ({ x:c.x, y:c.y }));
    // a faint tie-line from the name to its constellation (drawn UNDER the name text)
    const leader = el("path",{ class:"an-leader" });
    skyG.appendChild(leader);
    // the engraved name block, typeset at a local origin (name baseline at 0,0)
    const lg = el("g",{ class:"asterism-name"+(firstTime?" named-in":""), "data-wing":ast.id });
    const nm = el("text",{ x:0, y:0, "text-anchor":"start", class:"an-name" });
    nm.textContent = ast.name;
    lg.appendChild(nm);
    const rule = el("line",{ x1:0, y1:5, x2:30, y2:5, class:"an-rule" });
    lg.appendChild(rule);
    const myth = el("text",{ x:0, y:18, "text-anchor":"start", class:"an-myth" });
    myth.textContent = ast.myth;
    lg.appendChild(myth);
    skyG.appendChild(lg);                  // lives inside the sky layer (in the paper)
    SKY_LABELS.set(ast.id, { group:lg, leader, stars, anchor, prefer, pin, firstTime });
  });
  return skyG;
}

/* position ONE asterism-name group at a solved label-box {x,y} + side (anchor flip),
   then draw its faint leader to the nearest charted star so the name and its
   constellation read as a single engraved unit. */
function applySkyName(parts, box, side){
  const anchor = (side==="left"||side==="nw"||side==="sw") ? "end"
               : (side==="right"||side==="ne"||side==="se") ? "start" : "middle";
  parts.group.querySelectorAll("text").forEach(t=> t.setAttribute("text-anchor", anchor));
  const rule = parts.group.querySelector(".an-rule");
  if(rule){ if(anchor==="end"){ rule.setAttribute("x1",-30); rule.setAttribute("x2",0); }
    else if(anchor==="middle"){ rule.setAttribute("x1",-15); rule.setAttribute("x2",15); }
    else { rule.setAttribute("x1",0); rule.setAttribute("x2",30); } }
  const bb = parts.group.getBBox();
  const tx = box.x - (bb.x - LABEL_PAD), ty = box.y - (bb.y - LABEL_PAD);
  parts.group.setAttribute("transform", `translate(${tx} ${ty})`);
  // tie the name to its constellation: a faint leader from the name box's nearest edge
  // to the NEAREST charted star, stopping just shy of the star's glow (the same
  // draughting idiom every room label uses — so a named sky reads as one whole unit).
  if(parts.leader && parts.stars && parts.stars.length){
    const rect = { x:box.x, y:box.y, w:box.w, h:box.h };
    const cx = box.x + box.w/2, cy = box.y + box.h/2;
    let best = parts.stars[0], bestD = Infinity;
    parts.stars.forEach(s=>{ const d=(s.x-cx)*(s.x-cx)+(s.y-cy)*(s.y-cy); if(d<bestD){ bestD=d; best=s; } });
    const start = LabelPlacer.geom.nearestEdgePoint(best.x, best.y, rect);   // on the name box
    const dx = best.x - start[0], dy = best.y - start[1], len = Math.hypot(dx,dy) || 1;
    if(len < 14){
      // the name already abuts its star — a stub would read as a glitch, so let the
      // proximity + the brightened anchor-star carry the tie (no leader drawn).
      parts.leader.setAttribute("d", "");
    } else {
      const end = [ best.x - dx/len*4, best.y - dy/len*4 ];   // 4px shy of the star centre
      parts.leader.setAttribute("d", `M${start[0]} ${start[1]} L${end[0]} ${end[1]}`);
    }
  }
}

/* solve + apply labels. TWO independent passes so the POI layout is INVARIANT to
   sky state (adding sky features must never perturb a room label):

     PASS 1 — the POI labels. EXACTLY the baseline solve (same features, obstacles,
              seed) → byte-identical layout whether or not any asterism is charted.
     PASS 2 — the engraved asterism names, solved SEPARATELY with the already-solved
              POI label rects added as obstacles (plus footprints + furniture). The
              names route cleanly around the fixed POI labels; they cannot disturb
              them. Skipped entirely when no asterism is charted.

   Runs once, after the Undercroft reveal so a revealed cellar-stair label is part
   of pass 1. Returns the merged overlap count (pass1 + pass2). */
function placeLabels(){
  if(typeof LabelPlacer === "undefined" || !LABELS.size) return;
  const entries = [];            // [{ a, parts, w, h }] — w/h inflated by 2*PAD
  LABELS.forEach((parts, a)=>{
    const bb = parts.group.getBBox();
    entries.push({ a, parts, w:bb.width + 2*LABEL_PAD, h:bb.height + 2*LABEL_PAD });
  });

  // obstacles = every present footprint + the fixed plan furniture + the GENERATED
  // zone-label text boxes (each district's engraved label sits on its top boundary;
  // we keep POI labels clear of them so a room label never lands on a zone caption).
  const footObstacles = entries.map(e=> footBBox(e.parts.r));
  const zoneObstacles = LAYOUT.districtRects.map(d=>{
    // the engraved zone caption (10px mono, ~6.4px/char incl. tracking) sits centred
    // on the district's top boundary; keep POI labels off the caption box only.
    const labelW = d.label.length * 6.4;
    return { x:d.x + d.w/2 - labelW/2, y:d.y - 17, w:labelW, h:15 };
  });
  const obstacles = footObstacles.concat(FURNITURE).concat(HOURS_FURNITURE).concat(zoneObstacles);

  const features = entries.map(e=>{
    const r = e.parts.r;
    const f = { id:r.id, anchor:labelAnchor(r), label:{ w:e.w, h:e.h }, gap:labelGap(r) };
    const pref = preferList(r);
    if(pref) f.prefer = pref;
    if(r.pin) f.pin = r.pin;       // a forced placement the engine honours as-is
    return f;
  });

  // ── PASS 1: the POI labels (identical to baseline — sky state cannot touch this) ──
  const spec = { bounds:LABEL_BOUNDS, features, obstacles, seed:LABEL_SEED };
  let res = LabelPlacer.solve(Object.assign({ positions:8 }, spec));
  if(res.overlaps > 0){
    const alt = LabelPlacer.solve(Object.assign({ positions:4 }, spec));
    if(alt.overlaps < res.overlaps) res = alt;
  }
  const byId = {};
  entries.forEach(e=>{ byId[e.parts.r.id] = e; });
  const poiLabelRects = [];        // the solved POI label boxes — obstacles for pass 2
  res.placements.forEach(p=>{
    const e = byId[p.id]; if(!e) return;
    SOLVED.set(p.id, { box:p.label, side:p.side });
    applyPlacement(e.parts, p.label, p.side);
    poiLabelRects.push({ x:p.label.x, y:p.label.y, w:p.label.w, h:p.label.h });
  });
  let totalOverlaps = res.overlaps;

  // ── PASS 2: the engraved asterism names, around the now-fixed POI labels ──
  if(SKY_LABELS.size){
    const skyEntries = [];         // [{ wingId, parts, w, h }]
    const skyFeatures = [];
    SKY_LABELS.forEach((info, wingId)=>{
      const bb = info.group.getBBox();
      const w = bb.width + 2*LABEL_PAD, h = bb.height + 2*LABEL_PAD;
      skyEntries.push({ wingId, parts:info, w, h });
      const f = { id:"sky:"+wingId, anchor:info.anchor, label:{ w, h }, gap:14 };
      if(info.prefer) f.prefer = info.prefer;
      // a PINNED name (the Automaton / the Furnace): fix the box top-left so it never
      // moves and never perturbs the six wings' free solve. Side 'se' ⇒ start-anchored
      // text (the name reads left→right, its leader runs right toward the figure stars).
      if(info.pin) f.pin = { x:info.pin.x, y:info.pin.y, side:"se" };
      skyFeatures.push(f);
    });
    // obstacles for the names = footprints + furniture + every solved POI label. The two
    // new orphaned-wing names (the Automaton / the Furnace) are PINNED at verified
    // star-clear voids, so they neither move nor perturb the six wings' free solve (which
    // stays byte-identical to baseline). The free wing-names route around the fixed POI
    // labels exactly as before.
    const skyObstacles = obstacles.concat(poiLabelRects);
    const skySpec = { bounds:LABEL_BOUNDS, features:skyFeatures, obstacles:skyObstacles, seed:LABEL_SEED };
    let skyRes = LabelPlacer.solve(Object.assign({ positions:8 }, skySpec));
    if(skyRes.overlaps > 0){
      const alt = LabelPlacer.solve(Object.assign({ positions:4 }, skySpec));
      if(alt.overlaps < skyRes.overlaps) skyRes = alt;
    }
    const skyById = {};
    skyEntries.forEach(e=>{ skyById["sky:"+e.wingId] = e; });
    skyRes.placements.forEach(p=>{
      const se = skyById[p.id]; if(!se) return;
      applySkyName(se.parts, p.label, p.side);
    });
    totalOverlaps += skyRes.overlaps;
  }

  return { overlaps: totalOverlaps, placements: res.placements };
}

/* ── render: draw every non-locked place + the tree-lined survey avenues to the follies ── */
const sheet = document.getElementById("sheet");
function renderEstate(){
  // 1. the bounded, tinted, labelled precincts (districts + wings) behind the plan
  drawPrecincts();
  // 2. the manor interior shell + the marked front-door entrance
  drawManorInterior();
  drawEntrance();
  // 3. the circulation graph — spine, district avenues, wing aisles, room stubs.
  //    Routes now MEAN adjacency (graph-driven), not a decorative every-folly fan.
  drawCirculation();
  // 4. the engraved zone + wing labels, seated ON their boundaries (never floating)
  drawZoneLabels();
  // 5. the POIs — every footprint coordinate/size is the Layout-solved slot
  PLACES.forEach(r=>{
    if(r.locked) return;                       // the Undercroft is gated; handled below
    pois.appendChild(buildPoi(r));
  });
  // 6. the first-visit on-ramp thread (door → spine → nearest unseen tier-1 anchor)
  drawFirstVisitThread();
  // ── THE SURVEY OF HEAVEN — kindle the personal night sky from the ws: breadcrumbs.
  //    Bootstrap first (silence already-charted wings for returning visitors), then
  //    draw the stars + asterism lines + tally as the FIRST CHILD OF #viewport (in
  //    the paper, behind the plan) — so the stars stay registered to plan coordinates
  //    AND pan/zoom WITH the plan, which is correct (catalog coords are viewBox units).
  //    Build the charted-asterism NAME groups so the final placeLabels() pass solves
  //    them alongside the POI labels. Degrades to nothing if storage is off. ──
  if(typeof Sky !== "undefined" && viewport){
    try{
      // bootstrap FIRST (may set sky-<id>-named for wings already charted before this
      // feature existed), THEN take a FRESH store snapshot so renderInto sees those
      // flags — so a returning visitor gets NO retroactive name-in animation.
      Sky.bootstrap(WS.store());
      // renderInto inserts <g class="sky"> as the first child of the container it is
      // given; passing #viewport (not #sheet) keeps the sky in the paper AND in the
      // pan/zoom transform group. The catalog geometry is unchanged (viewBox units).
      const skyG = Sky.renderInto(viewport, PLACES, WS.store());
      buildSkyNames(skyG);
    }catch(e){ /* the sky is cosmetic — never let it break the plan */ }
  }
}
renderEstate();

/* ════════════════════════════════════════════════════════════════════════════
   THE HOURS — the front door's day/light LAYER (the grounds swing, cycle #71).

   Mounts an explicit named layer stack INTO #viewport, coordinated with the Sky
   pass (drawn right after Sky.renderInto so the time layer sits above the plan but
   the catalog stars are already in the paper). Everything is driven by the Hours
   core (tools/hours/hours.js, inlined above) — the SAME functions the Node twin
   proves — so the page can't drift from the test:
     • hours-back     — a LOW-ALPHA wash that DARKENS the margins at night (raising
                        star contrast so the Survey constellations read brighter)
                        and stays near-transparent at noon (the plan reads).
     • hours-apparitions — the four apparitions, above the plan, each shown ONLY in
                        its altitude window.
     • hours-gnomon   — the brass dial + its real cast shadow (direction routed
                        through the proven shadowTip), drawn at the gnomon POI's
                        DERIVED centre; a real DRAG handle that scrubs minute↔angle.
     • hours-ring / hours-hud — the catch-the-hours phase-ring metagame + clock HUD,
                        as TOP furniture like the sky tally.

   Cosmetics-only: it confers NO access, mutates NO LayoutPlacer/placeLabels
   geometry, touches NO existing predicate, and writes ONLY additive cosmetic
   ws:flag:hours-caught-<id> flags (never gating). prefers-reduced-motion / a
   ws:pref freeze → a correct STATIC frozen frame (no live tick, no auto-run). The
   whole module is wrapped so any failure degrades to a plain, fully-legible plate.
   ════════════════════════════════════════════════════════════════════════════ */
(function theHours(){
  try{
    if(typeof Hours === "undefined" || !viewport) return;

    var SVGNS2 = "http://www.w3.org/2000/svg";
    function E(n, attrs){ var e = document.createElementNS(SVGNS2, n);
      if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]); return e; }

    var reduce = false;
    try{ reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches; }catch(e){}
    // a ws:pref freeze (the shared reduced-motion preference) also freezes the day.
    try{ if(WS && WS.store){ var st = WS.store(); if(st && st.has && st.has("ws:pref:reduced-motion")) reduce = true; } }catch(e){}

    // the gnomon POI's DERIVED centre (Layout-solved) — the dial + shadow origin.
    var gp = PLACES.filter(function(p){ return p.id==="gnomon"; })[0];
    var GX = gp ? (gp.x + gp.w/2) : 1189, GY = gp ? (gp.y + gp.h/2) : 252;
    var DIAL_R = 30;                          // the live brass dial radius on the plate
    // the fixed estate place + the day to show. A canonical day (summer; the swing is
    // widest) keeps the demo's range legible; the visitor scrubs the civil minute.
    var LAT = Hours.ESTATE.latDeg, DOY = 172;  // summer solstice — the longest day
    var STYLE_LEN = 1;                          // dial-units; we scale the shadow to DIAL_R

    /* ── CANONICAL / SCREENSHOT determinism ──────────────────────────────────
       For the reveal-all-secrets / map-screenshot path the day must be FIXED and
       every apparition forced visible, so screenshots are deterministic. We detect
       the revealed state (the rune flag the reveal script sets) OR an explicit
       ?hours=allon / #hours-allon and pin a canonical dusk minute + force-all-on. */
    /* TWO concerns that USED to share one flag (the #76 bug): the SCREENSHOT path and
       the rune REWARD. They are now split.
         • pinFrame — the DETERMINISTIC-SCREENSHOT path ONLY (?hours=allon / #hours-allon).
           It pins the clock to CANON_MIN, forces every apparition ON, and suppresses
           catch-recording, so captures are stable. NOTHING ELSE may set it.
         • runeReward — the persisted Undercroft-rune flag. A real visitor who earned it
           opens at their LIVE local clock with the LIVE apparition windows, EXACTLY like
           everyone else (no pinned 20:30 night, no permanent grey dawn-mist slab, catches
           record normally). The reward is the wing's lore, not a frozen night. */
    var pinFrame = false, runeReward = false, CANON_MIN = 1230;   // ~20:30 — dusk: stars up, lamps lit, candle burning
    try{
      var q = String(location.search||""), h = String(location.hash||"");
      if(/hours=allon/.test(q) || /hours-allon/.test(h)) pinFrame = true;
      if(WS && WS.store){ var s2 = WS.store(); if(s2 && s2.has && s2.has("ws:seen:undercroft-rune")) runeReward = true; }
    }catch(e){}

    /* ── BUILD THE LAYER STACK (into #viewport, after the sky pass) ─────────── */
    var skyG = viewport.querySelector("g.sky");   // the existing Survey stars (we only toggle a class)

    // 1) hours-back: the day-phase wash. Two rects multiply over the dark ground —
    //    a flat night-deepener (fades in as the sun sets) the WHOLE plate, kept very
    //    low alpha over the lit manor core so footprints never wash out.
    var back = E("g", { id:"hours-back" });
    var wash = E("rect", { id:"hours-wash", x:0, y:0, width:1440, height:900, fill:"#0a1022", opacity:"0" });
    back.appendChild(wash);
    viewport.appendChild(back);

    // 2) hours-apparitions: the four apparitions, above the plan.
    var apG = E("g", { id:"hours-apparitions" });
    // dawn-mist: a soft horizon band low on the plate (drawn faint, blurred via opacity).
    var mist = E("rect", { "class":"hours-ap", x:120, y:740, width:1200, height:120, rx:40,
      fill:"rgba(196,180,214,0)" });
    apG.appendChild(mist);
    // dusk-fireflies / first star: a cluster of warm points sprinkled in the east park
    // beside the gnomon (where the first star kindles), each gently flickering.
    var fireG = E("g", { "class":"hours-ap", opacity:"0" });
    var FPTS = [[GX-66,GY-58],[GX+74,GY-40],[GX-40,GY+70],[GX+58,GY+64],[GX+90,GY+8],[GX-86,GY+18],[GX+8,GY-92]];
    for(var fi=0; fi<FPTS.length; fi++){
      var fl = E("circle", { "class":"hours-firefly", cx:FPTS[fi][0], cy:FPTS[fi][1], r:(fi%3===0?2.2:1.5),
        fill:"#ffe6a0" });
      if(!reduce) fl.style.animationDelay = ((fi*613)%3000)/1000 + "s";
      fireG.appendChild(fl);
    }
    apG.appendChild(fireG);
    // candle-window: a lit window glowing in the manor wall through the night.
    var candleG = E("g", { "class":"hours-ap", opacity:"0" });
    candleG.appendChild(E("circle", { cx:721, cy:470, r:26, fill:"url(#candle)", opacity:".9" }));
    candleG.appendChild(E("rect", { x:714, y:462, width:14, height:18, rx:1.5, fill:"rgba(255,212,120,.92)" }));
    candleG.appendChild(E("line", { x1:721, y1:462, x2:721, y2:480, stroke:"rgba(120,80,30,.8)", "stroke-width":".8" }));
    candleG.appendChild(E("line", { x1:714, y1:471, x2:728, y2:471, stroke:"rgba(120,80,30,.8)", "stroke-width":".8" }));
    apG.appendChild(candleG);
    // witching-ghost: a pale figure that drifts across the manor corridor at deep night.
    var ghost = E("ellipse", { "class":"hours-ap", cx:640, cy:430, rx:8, ry:18, fill:"rgba(184,202,232,0)" });
    apG.appendChild(ghost);
    viewport.appendChild(apG);

    // 3) hours-gnomon: the live brass dial + cast shadow + drag handle, at (GX,GY).
    var gnG = E("g", { id:"hours-gnomon", transform:"translate("+GX+" "+GY+")", role:"slider",
      tabindex:"0", "aria-label":"the gnomon — drag to run the day and catch every apparition" });
    // a wide invisible grab handle ring so the dial is easy to take hold of
    gnG.appendChild(E("circle", { "class":"gn-handle", r:DIAL_R+10 }));
    gnG.appendChild(E("circle", { "class":"gn-rim", r:DIAL_R }));
    // hour ticks
    var ticks = "";
    for(var th=0; th<24; th++){ var ta=(th/24)*Math.PI*2 - Math.PI/2;
      var r1=(th%6===0)?DIAL_R-9:DIAL_R-5, r2=DIAL_R-1;
      ticks += '<line class="gn-tick" x1="'+(Math.cos(ta)*r1).toFixed(1)+'" y1="'+(Math.sin(ta)*r1).toFixed(1)+
        '" x2="'+(Math.cos(ta)*r2).toFixed(1)+'" y2="'+(Math.sin(ta)*r2).toFixed(1)+
        '" stroke-width="'+((th%6===0)?1.1:0.7)+'" opacity="'+((th%6===0)?'.9':'.45')+'"/>';
    }
    var tickHolder = E("g"); tickHolder.innerHTML = ticks; gnG.appendChild(tickHolder);
    // the cast shadow (drawn first, under the style)
    var shadow = E("line", { "class":"gn-shadow", x1:0, y1:0, x2:0, y2:0, "stroke-width":"3.5", opacity:"0" });
    gnG.appendChild(shadow);
    // the brass style (the polar gnomon edge) + nodus
    gnG.appendChild(E("circle", { "class":"gn-style", r:3.2 }));
    gnG.appendChild(E("circle", { r:6, fill:"none", stroke:"#e6bd6f", "stroke-width":".8", opacity:".5" }));
    // the teaser caption — the on-ramp legibility cue (NOT a hidden rune)
    var cap = E("text", { "class":"gn-cap", x:0, y:DIAL_R+18, "text-anchor":"middle" });
    cap.textContent = "drag to run the day";
    gnG.appendChild(cap);
    // the rune REWARD (earned in the Undercroft) is honest lore, never a frozen night:
    // the dial still opens at the visitor's LIVE clock with the LIVE apparition windows
    // (exactly like everyone else); we only acknowledge it in the aria label, so the
    // earned state is legible to a screen reader without pinning time or the dawn-mist.
    if(runeReward){ gnG.setAttribute("aria-label",
      "the gnomon — drag to run the day and catch every apparition (the Undercroft rune is yours; all four hours are findable)"); }
    viewport.appendChild(gnG);

    // 4) hours-ring: the gold phase-ring meter, around the dial.
    var ringG = E("g", { id:"hours-ring", transform:"translate("+GX+" "+GY+")", "pointer-events":"none" });
    var RR = DIAL_R + 16, CIRC = 2*Math.PI*RR;
    ringG.appendChild(E("circle", { "class":"pr-track", r:RR }));
    var ringFill = E("circle", { "class":"pr-fill", r:RR, transform:"rotate(-90)",
      "stroke-dasharray":CIRC.toFixed(2), "stroke-dashoffset":CIRC.toFixed(2) });
    ringG.appendChild(ringFill);
    var ringCount = E("text", { "class":"pr-count", x:0, y:-RR-7, "text-anchor":"middle" });
    ringG.appendChild(ringCount);
    viewport.appendChild(ringG);

    // 5) hours-hud: a COMPACT two-line live readout (clock + phase) seated in the thin
    //    band just above the dial. The catch-count is NOT repeated here (the gold
    //    phase-ring + its pr-count already show it), and the self-test pill rides BELOW
    //    the dial by the cap — so this furniture stays small and the gnomon's own POI
    //    label (solved after this layer) can take the clean slot above without garbling.
    var HUD_DY = -(DIAL_R + 18);                    // clock baseline, just above the rim
    var hud = E("g", { id:"hours-hud", transform:"translate("+GX+" "+(GY+HUD_DY)+")" });
    var hClock = E("text", { "class":"hh-clock", x:0, y:0, "text-anchor":"middle" }); hud.appendChild(hClock);
    var hPhase = E("text", { "class":"hh-phase", x:0, y:11, "text-anchor":"middle" }); hud.appendChild(hPhase);
    viewport.appendChild(hud);

    // the in-page SELF-TEST PILL — runs the SAME core the Node twin proves; green ✓ N/N.
    // It sits just BELOW the dial, under the "drag to run the day" cap, in the open band
    // before the Puzzle Pavilion — out of the POI label's way entirely.
    var hTest = E("text", { id:"hours-pill", "class":"hh-test", x:GX, y:GY+DIAL_R+38, "text-anchor":"middle" });
    (function(){
      try{ var r = Hours.selfTest(); var nP = r.results.filter(function(x){return x.pass;}).length;
        hTest.textContent = (r.pass?"✓ ":"✗ ") + nP + "/" + r.results.length + " · the dial proved exact";
        hTest.setAttribute("class", "hh-test " + (r.pass ? "ok" : "bad"));
      }catch(e){ hTest.textContent = ""; }
    })();
    viewport.appendChild(hTest);

    // Register the HUD's occupied boxes with the label solver (it runs AFTER this layer)
    // so the gnomon's own POI label is forced into the clear slot ABOVE the readout
    // instead of garbling over it. Box A brackets the 2-line clock/phase readout (made
    // WIDE so the only collision-free escape is straight up); box B brackets the pill.
    try{
      var hudY = GY + HUD_DY;
      HOURS_FURNITURE.push({ x: GX - 170, y: hudY - 13, w: 340, h: 30 });   // clock+phase
      HOURS_FURNITURE.push({ x: GX - 95,  y: GY + DIAL_R + 30, w: 190, h: 14 }); // self-test pill
    }catch(e){}

    /* ── THE CAUGHT-APPARITIONS METAGAME — additive ws:flag:hours-caught-<id>. ──
       Catching an apparition (seeing it ON while scrubbing) fills the gold ring. The
       flags are NEVER gating (no predicate reads them); they only persist the meter. */
    var APS = Hours.APPARITIONS, NAP = APS.length;
    var caught = {};
    (function(){
      try{ var s3 = WS && WS.store ? WS.store() : null;
        if(s3 && s3.has) for(var i=0;i<NAP;i++){ if(s3.has("ws:flag:hours-caught-"+APS[i].id)) caught[APS[i].id]=true; }
      }catch(e){}
    })();
    function catchCount(){ var n=0; for(var i=0;i<NAP;i++) if(caught[APS[i].id]) n++; return n; }
    function markCaught(id){
      if(caught[id]) return;
      caught[id] = true;
      // additive cosmetic flag — never gating (no predicate reads it).
      try{ if(WS && WS.flag) WS.flag("hours-caught-"+id); }catch(e){}
    }

    function fmtClock(min){ min=((min%1440)+1440)%1440; var h=Math.floor(min/60), m=Math.floor(min%60);
      return (h<10?"0":"")+h+":"+(m<10?"0":"")+m; }
    function rgb(c){ return "rgb("+c[0]+","+c[1]+","+c[2]+")"; }

    /* ── RENDER one civil minute — the whole layer is a pure function of it. ── */
    function render(civilMin){
      var aa = Hours.solarAltAz(LAT, DOY, civilMin);
      var altDeg = aa.alt * Hours.R2D, azDeg = aa.az * Hours.R2D;
      var bri = Hours.brightness(altDeg);
      var day = Hours.dayFactor(altDeg);           // 0 night → 1 day
      var lamp = Hours.lampGlow(altDeg);
      var sky = Hours.skyColor(altDeg);
      var aps = pinFrame ? null : Hours.apparitionsAt(altDeg);

      // (a) the wash: darken the margins at night (1−day), tinted toward the phase
      //     colour so dusk reads warm-rose and deep night reads cool-indigo. Capped
      //     low so the lit plan/footprints stay legible even at the darkest.
      var washA = (1 - day) * 0.5;                  // 0 at noon → 0.5 at deep night
      wash.setAttribute("fill", rgb([Math.round(sky[0]*0.5), Math.round(sky[1]*0.5), Math.round(sky[2]*0.7)]));
      wash.setAttribute("opacity", washA.toFixed(3));

      // (b) the night-stars BRIGHTEN: toggle the class the CSS keys on (the SAME
      //     Survey stars, never a competing set). On below dayFactor ~0.4.
      if(skyG){ if(day < 0.4) skyG.classList.add("hours-night"); else skyG.classList.remove("hours-night"); }

      // (c) the gnomon shadow — direction from the PROVEN shadowTip, length scaled to
      //     the dial. Dial-local frame: +x → afternoon(west), +y → up the noon line;
      //     SVG y is down, so we flip y to put noon UP on the plate.
      if(altDeg > 0.4){
        var tip = Hours.gnomonShadow(LAT, DOY, civilMin, STYLE_LEN);  // {x,y,r,theta,below}
        // scale the (unit-style) projection to a legible plate length, clamped.
        var len = Math.min(DIAL_R-3, (DIAL_R-3) * Math.min(1, tip.r/6) + 6);
        var ux = Math.sin(tip.theta), uy = Math.cos(tip.theta);       // unit dir on the dial
        shadow.setAttribute("x2", (ux*len).toFixed(2));
        shadow.setAttribute("y2", (-uy*len).toFixed(2));              // flip y: noon points UP
        shadow.setAttribute("opacity", "0.82");
      } else {
        shadow.setAttribute("opacity", "0");                         // sun down: the dial sleeps
      }

      // (d) apparitions — each shown ONLY inside its altitude window (or all-on for
      //     the deterministic SCREENSHOT path, pinFrame; the rune reward is NOT this).
      //     Catch any that's ON.
      function on(id){ return pinFrame ? true : !!(aps && aps[id]); }
      mist.setAttribute("fill", on("dawn-mist") ? "rgba(200,184,216,.16)" : "rgba(196,180,214,0)");
      fireG.setAttribute("opacity", on("dusk-fireflies") ? "1" : "0");
      candleG.setAttribute("opacity", on("candle-window") ? "1" : "0");
      ghost.setAttribute("fill", on("witching-ghost") ? "rgba(184,202,232,.5)" : "rgba(184,202,232,0)");
      if(on("witching-ghost")){ ghost.setAttribute("cx", (560 + ((civilMin%240)/240)*220).toFixed(0)); }
      // record catches (only while a real scrub is happening, not the forced screenshot)
      if(!pinFrame && aps){ for(var i=0;i<NAP;i++){ if(aps[APS[i].id]) markCaught(APS[i].id); } }

      // (e) the ring fill + counts
      var n = catchCount();
      ringFill.setAttribute("stroke-dashoffset", (CIRC * (1 - n/NAP)).toFixed(2));
      ringCount.textContent = n + "/" + NAP;
      // (f) the HUD — the live clock + phase (the catch-count lives on the ring count)
      hClock.textContent = fmtClock(civilMin);
      hPhase.textContent = Hours.phaseName(altDeg);
    }

    /* ── THE DRAG: pointerdown→drag on the dial maps angle→minute. A full turn is a
       full day; clock 12:00 is straight UP. Also: a mirrored hour-slider, a ● LIVE
       snap-to-real-clock, and a ▶ run-the-day button live on the gnomon POI's own
       wing page (hours/index.html); here on the front door the dial itself is the
       handle (drag to scrub) so the on-ramp is operable in one gesture. ── */
    // the door opens at the VISITOR'S TRUE LOCAL CLOCK (real civil minute of the
    // current moment) so the plate's tint matches the wall clock — EXCEPT the
    // canonical screenshot/reduced-motion frames, which stay pinned for stable captures.
    function localCivilMin(){
      try{ var d = new Date(); return ((d.getHours()*60 + d.getMinutes())%1440+1440)%1440; }
      catch(e){ return 750; }                    // fall back to ~12:30 if Date is unavailable
    }
    var curMin = pinFrame ? CANON_MIN : localCivilMin();
    var dragging = false, scrubbed = false, downX = 0, downY = 0, playing = false, rafId = null;

    /* THE CLICK-vs-SCRUB CLASSIFIER (the #76 dead-click fix).
       A real mouse click commonly jitters a few px between down and up. The OLD code
       tripped a scrub at >4px on EITHER axis (so a 5px+5px diagonal wiggle = "scrub")
       and then swallowed the click with preventDefault — leaving a dead dial. Now a
       gesture only counts as a SCRUB once it travels past SCRUB_PX of EUCLIDEAN distance
       from pointerdown — ~10px, well above incidental jitter but far below any real
       drag. `scrubbed` is the single source of truth: set true the instant the gesture
       crosses the threshold, it gates BOTH the live render and the click swallow, so a
       tap (and a sub-threshold jitter) reliably navigates while a genuine drag does not. */
    var SCRUB_PX = 10, SCRUB_PX2 = SCRUB_PX*SCRUB_PX;
    function pastThreshold(ev){
      var dx = ev.clientX-downX, dy = ev.clientY-downY;
      return (dx*dx + dy*dy) > SCRUB_PX2;
    }

    function angleToMin(dx, dy){
      // SVG: atan2(dy,dx); noon(12:00) is straight up (dx0, dy<0). map to [0,1440).
      var a = Math.atan2(dx, -dy);                 // 0 at up, +clockwise
      var frac = (a/(2*Math.PI)); frac = (frac%1+1)%1;
      return Math.round(frac*1440)%1440;
    }
    function svgPt(clientX, clientY){
      var ctm = sheet.getScreenCTM(); if(!ctm) return null; var inv = ctm.inverse();
      return { x: inv.a*clientX + inv.c*clientY + inv.e, y: inv.b*clientX + inv.d*clientY + inv.f };
    }
    function onMove(ev){
      if(!dragging) return;
      // a gesture only becomes a SCRUB once it crosses SCRUB_PX (euclidean) from the
      // pointerdown; below that it's incidental jitter and the tap stays a navigation.
      if(!scrubbed && pastThreshold(ev)){ scrubbed = true; gnG.classList.add("dragging"); }
      if(!scrubbed) return;
      var p = svgPt(ev.clientX, ev.clientY); if(!p) return;
      curMin = angleToMin(p.x - GX, p.y - GY);
      render(curMin);
      ev.preventDefault();
    }
    // the dial's nav target. Declared ahead of endDrag because endDrag is where the
    // no-scrub TAP now navigates (see below) — NOT a bubbled `click` MouseEvent.
    var GNHREF = (gp && gp.href) ? gp.href : "hours/index.html";
    // THE NAVIGATION (the #80 dead-click fix). A REAL physical mouse dispatches its
    // `click` on the nearest common ancestor of the (differing) down/up hit-targets —
    // which for this overlaid dial resolves to svg#sheet, OUTSIDE the #hours-gnomon
    // subtree — so a `gnG`-scoped click listener NEVER fired and the tap was dead.
    // (Programmatic .click()/agent-browser dispatch straight to the node, so they DID
    // navigate — which is exactly why two prior click-based "fixes" verified green yet
    // shipped broken.) The cure: navigate from `pointerup` (endDrag), which fires on the
    // window and already has the scrub classification in scope. `scrubbed` is the boolean
    // source of truth (untouched by the dragging-class removal); we read it FIRST, then
    // tear down, then navigate iff it was NOT a scrub. We also re-check euclidean distance
    // at pointerup so a fast scrub that skipped onMove (no move event fired) still counts.
    function endDrag(ev){ if(!dragging) return;
      var wasScrub = scrubbed || (ev && pastThreshold(ev));  // read BEFORE removing the class
      dragging=false; gnG.classList.remove("dragging");
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", endDrag);
      if(!wasScrub){ try{ WS.seen("gnomon"); }catch(e){} location.href = GNHREF; }
    }
    gnG.addEventListener("pointerdown", function(ev){
      if(playing) stopPlay();
      dragging = true; scrubbed = false; downX = ev.clientX; downY = ev.clientY;
      window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", endDrag);
      // do NOT preventDefault/stopPropagation here — endDrag handles the tap navigation.
    });
    // Enter/Space on the focused dial also enters the wing (a11y).
    gnG.addEventListener("keydown", function(ev){
      if(ev.key==="Enter" || ev.key===" "){ try{ WS.seen("gnomon"); }catch(e){} location.href = GNHREF; ev.preventDefault(); }
    });
    // keyboard: arrows scrub by 15 min, page keys by an hour (a11y on the slider role)
    gnG.addEventListener("keydown", function(ev){
      var d=0; if(ev.key==="ArrowRight"||ev.key==="ArrowUp") d=15;
      else if(ev.key==="ArrowLeft"||ev.key==="ArrowDown") d=-15;
      else if(ev.key==="PageUp") d=60; else if(ev.key==="PageDown") d=-60; else return;
      if(playing) stopPlay();
      curMin = ((curMin+d)%1440+1440)%1440; render(curMin); ev.preventDefault();
    });
    // double-click the dial = run the whole day once (a quick way to catch them all)
    function stopPlay(){ playing=false; if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }
    function stepDay(){ if(!playing) return; curMin=(curMin+6)%1440; render(curMin);
      rafId = requestAnimationFrame(function(){ setTimeout(stepDay, 16); }); }
    gnG.addEventListener("dblclick", function(ev){
      if(reduce) return; if(playing){ stopPlay(); } else { playing=true; stepDay(); } ev.preventDefault(); ev.stopPropagation();
    });

    // initial paint. Under reduced-motion / freeze we render the canonical frozen
    // frame and never tick; otherwise a clear midday so the dial + shadow read.
    if(reduce){ curMin = pinFrame ? CANON_MIN : 765; }   // 12:45 — a legible shadow, static
    render(curMin);
  }catch(e){ /* the Hours layer is cosmetic — never let it break the plan */ }
})();

/* ════════════════════════════════════════════════════════════════════════════
   PAN / ZOOM — a true transform on #viewport. The #sheet viewBox (0 0 1440 900)
   is NEVER mutated (the sky catalog + label solve run in fixed viewBox units before
   any transform). The viewport carries translate(tx,ty) scale(k). The whole plate
   fits at k=1 (xMidYMid meet). WHEEL zooms toward the cursor; DRAG on empty plate
   pans (a >4px threshold distinguishes pan from a click so links still navigate);
   double-click / the ⊕ control / the ± buttons reset or step; keyboard +/-/arrows
   for a11y. Bounds keep the plate from being dragged entirely off-screen. The whole
   controller is wrapped so any failure degrades to a static, fully-visible plate. ── */
(function panZoom(){
  try{
    const VB = { w:1440, h:900 };
    const K_MIN = 1, K_MAX = 4;
    let k = 1, tx = 0, ty = 0;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    function apply(){ viewport.setAttribute("transform", `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})`); }
    // clamp so the plate edge can't be dragged fully off the viewport: at scale k the
    // plate spans k*VB; keep its centre band on screen (you can't lose the plate).
    function clamp(){
      const span = VB.w*k, spanH = VB.h*k;
      if(k <= 1){ tx = 0; ty = 0; return; }
      const maxX = (k-1)*VB.w*0.5 + VB.w*0.25, minX = -(k-1)*VB.w*0.5 - VB.w*0.25;
      const maxY = (k-1)*VB.h*0.5 + VB.h*0.25, minY = -(k-1)*VB.h*0.5 - VB.h*0.25;
      // tx is added to a k-scaled plate; bound the visible offset
      const overX = (k-1)*VB.w, overY = (k-1)*VB.h;
      tx = Math.max(-overX - VB.w*0.2, Math.min(VB.w*0.2, tx));
      ty = Math.max(-overY - VB.h*0.2, Math.min(VB.h*0.2, ty));
    }
    // the SVG point (viewBox units) under a client pointer
    function svgPoint(clientX, clientY){
      const ctm = sheet.getScreenCTM(); if(!ctm) return null;
      const inv = ctm.inverse();
      return { x: inv.a*clientX + inv.c*clientY + inv.e, y: inv.b*clientX + inv.d*clientY + inv.f };
    }
    function zoomTo(newK, pivot){
      newK = Math.max(K_MIN, Math.min(K_MAX, newK));
      if(pivot){
        // keep the pivot point fixed: viewportPt = (svgPt - t)/k must stay constant
        const vx = (pivot.x - tx)/k, vy = (pivot.y - ty)/k;
        k = newK; tx = pivot.x - vx*k; ty = pivot.y - vy*k;
      } else { k = newK; }
      clamp(); apply();
    }
    function reset(){ k=1; tx=0; ty=0; apply(); }

    // ── WHEEL = zoom toward cursor ──
    sheet.addEventListener("wheel", (e)=>{
      e.preventDefault();
      const p = svgPoint(e.clientX, e.clientY); if(!p) return;
      const factor = Math.exp(-e.deltaY * 0.0016);
      zoomTo(k*factor, p);
    }, { passive:false });

    // ── DRAG = pan (suppressed when starting on a .poi so clicks navigate) ──
    let dragging=false, moved=false, startX=0, startY=0, startTx=0, startTy=0;
    sheet.addEventListener("pointerdown", (e)=>{
      if(e.button!==0) return;
      // a drag starting on a POI (or the rune/legend) must NOT pan — let the link work
      if(e.target.closest && e.target.closest(".poi")) return;
      dragging=true; moved=false; startX=e.clientX; startY=e.clientY; startTx=tx; startTy=ty;
      sheet.classList.add("grabbing");
      sheet.setPointerCapture && sheet.setPointerCapture(e.pointerId);
    });
    sheet.addEventListener("pointermove", (e)=>{
      if(!dragging) return;
      const dx=e.clientX-startX, dy=e.clientY-startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
      if(k<=1 && !moved) return;
      // convert client delta → viewBox delta via the CTM scale
      const ctm = sheet.getScreenCTM(); if(!ctm) return;
      tx = startTx + dx/ctm.a; ty = startTy + dy/ctm.d;
      clamp(); apply(); hideCard();
    });
    function endDrag(e){
      if(!dragging) return;
      dragging=false; sheet.classList.remove("grabbing");
      try{ sheet.releasePointerCapture && sheet.releasePointerCapture(e.pointerId); }catch(_){}
    }
    sheet.addEventListener("pointerup", endDrag);
    sheet.addEventListener("pointercancel", endDrag);
    // suppress the click that follows a real drag (so a pan doesn't fire a link)
    sheet.addEventListener("click", (e)=>{
      if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; }
    }, true);

    // ── double-click empty plate = reset ──
    sheet.addEventListener("dblclick", (e)=>{
      if(e.target.closest && e.target.closest(".poi")) return;
      e.preventDefault(); reset();
    });

    // ── the brass ± / ⊕ controls ──
    const cIn=document.getElementById("pz-in"), cOut=document.getElementById("pz-out"), cFit=document.getElementById("pz-fit");
    const centrePivot = ()=> ({ x:VB.w/2, y:VB.h/2 });
    cIn  && cIn.addEventListener("click", ()=> zoomTo(k*1.4, centrePivot()));
    cOut && cOut.addEventListener("click", ()=> zoomTo(k/1.4, centrePivot()));
    cFit && cFit.addEventListener("click", reset);

    // ── keyboard a11y: +/- zoom, arrows pan ──
    window.addEventListener("keydown", (e)=>{
      if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const step = 60;
      if(e.key==="+"||e.key==="="){ zoomTo(k*1.25, centrePivot()); }
      else if(e.key==="-"||e.key==="_"){ zoomTo(k/1.25, centrePivot()); }
      else if(e.key==="0"){ reset(); }
      else if(e.key==="ArrowLeft" && k>1){ tx+=step; clamp(); apply(); }
      else if(e.key==="ArrowRight" && k>1){ tx-=step; clamp(); apply(); }
      else if(e.key==="ArrowUp" && k>1){ ty+=step; clamp(); apply(); }
      else if(e.key==="ArrowDown" && k>1){ ty-=step; clamp(); apply(); }
      else return;
    });

    sheet.classList.add("grabbable");
    apply();
  }catch(e){ /* any failure → static, fully-visible plate (no transform) */ }
})();

window.addEventListener("resize", hideCard);

/* ════════════════════════════════════════════════════════════════════════════
   THE UNDERCROFT — the hidden way down, ported faithfully from the previous front
   door and reimagined as a cellar-stair POI on the plan. The eligibility, the
   three states (broken → rune → whole), the first-appearance grow + opening flag,
   and graceful degradation are PRESERVED EXACTLY. Reads ws: via WS.store().
   See /UNLOCK.md. ════════════════════════════════════════════════════════════ */
(function revealUndercroft(){
  const UC = "undercroft/index.html";
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const data = PLACES.find(p=>p.locked);
  if(!data) return;

  // ---- read storage (eligibility unchanged from the old rune) ----
  let distinct = 0, alreadyEarned = false, runeFound = false, openingSeen = false;
  const store = WS.store();
  if(!store.ok) return;                          // storage off → show nothing extra (room still reachable by URL)
  try{
    const seen = new Set();
    for(const k in store.all){ if(k.indexOf("ws:seen:")===0) seen.add(k); }
    distinct = seen.size;
    alreadyEarned =
      (store.has("ws:seen:game-of-life") && store.has("ws:seen:lattice"))
      || store.has("ws:flag:eleven");
    // a returning visitor who has already reached the Undercroft (by either mechanism) is "found"
    runeFound = store.has("ws:seen:undercroft-rune") || store.has("ws:seen:undercroft");
    openingSeen = store.has("ws:seen:undercroft-opening");
  }catch(e){ return; }
  if(distinct < 4 && !alreadyEarned) return;
  const set = (k)=>{ try{ localStorage.setItem(k, String(Date.now())); }catch(e){} };

  // place the Undercroft POI (whole+navigable if found, else broken+sealed)
  let tile = buildPoi(data, { asLink:runeFound, extraClass: runeFound ? "" : "broken" });
  pois.appendChild(tile);
  // a dashed survey path also threads down to the cellar stair from the manor door
  const ucCentre = footCentre(data);
  paths.appendChild(el("path",{ class:"survey-path",
    d:`M${MANOR_DOOR.x} ${MANOR_DOOR.y} L${ucCentre.cx} ${ucCentre.cy}` }));

  if(runeFound){
    // State B: whole stair, functional, steady. (No animation; it's just there.)
  } else {
    // State A: broken stair, not navigable. First appearance → grow from nothing.
    if(!openingSeen && !reduced){
      tile.classList.add("grow");
      tile.addEventListener("animationend", function once(ev){
        if(ev.animationName !== "ucgrow") return;
        tile.removeEventListener("animationend", once);
        tile.classList.remove("grow");
        set("ws:seen:undercroft-opening");
      });
    } else {
      set("ws:seen:undercroft-opening");        // already opened before (or reduced motion) → static
    }
  }

  // ---- the margin rune ----
  const legend = document.querySelector(".legend");
  if(!legend) return;
  const rune = document.createElement("a");
  rune.className = "rune";
  rune.href = runeFound ? UC : "#";              // before repair it doesn't navigate; after, harmless
  rune.title = runeFound ? "the way down is open" : "something glints in the dark — a rune";
  rune.innerHTML = '<span class="gl">✦</span><span class="lbl"> the undercroft</span>';
  legend.appendChild(rune);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    rune.classList.add("show");
    if(runeFound) rune.classList.add("found");   // quiet steady mark, no pulse
  }));

  if(!runeFound){
    rune.addEventListener("click", function(ev){
      ev.preventDefault();
      if(rune.dataset.done) return;
      rune.dataset.done = "1";
      set("ws:seen:undercroft-rune");            // (1) repair the stair (persist)
      rune.classList.add("found");               // rune settles to a quiet steady mark
      // (2) replace the broken POI with a working, whole one (animate the repair)
      const fresh = buildPoi(data, { asLink:true, extraClass: reduced ? "" : "repairing" });
      LABELS.delete(tile);                         // retire the broken tile's label parts
      tile.parentNode.replaceChild(fresh, tile);
      tile = fresh;
      // reuse the cellar-stair's already-solved label slot so the whole stair's name
      // lands exactly where the broken one's did (no re-solve, no layout shift).
      const placed = SOLVED.get(data.id);
      if(placed){ const fp = LABELS.get(fresh); if(fp) applyPlacement(fp, placed.box, placed.side); }
      else { placeLabels(); }                      // fallback: solver hadn't run (shouldn't happen)
      rune.href = UC; rune.title = "the way down is open";
      if(!reduced){
        tile.addEventListener("animationend", function done(ev2){
          if(ev2.animationName !== "ucrepair") return;
          tile.removeEventListener("animationend", done);
          tile.classList.remove("repairing");
        });
      }
    });
  }
})();

/* ── all present POIs (manor wings, follies, the outbuilding, and — if revealed —
   the cellar stair) are now in the DOM and registered; let the plan letter itself.
   Solved ONCE: the viewBox scales uniformly, so the layout holds at every size. */
placeLabels();
</script>
</body>
</html>
