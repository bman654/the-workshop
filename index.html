function drawRattleback(g, r){ // THE CONTRARY STONE — a felt table slab with a canoe-shaped celt seen from above:
  // the canoe hull (long keel ridge) + the cyan dashed MASS-AXIS line tilted a few degrees off the keel,
  // plus a faint curved "favored" arc — the whole secret read at a glance.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.5, cy=y+h*0.52;
  const longR=Math.min(w,h)*0.46, shortR=longR*0.40;
  // the felt table oval the stone sits on
  g.appendChild(el("ellipse",{cx,cy,rx:Math.min(w,h)*0.40,ry:Math.min(w,h)*0.40*0.5,class:"fp-fine",opacity:".22"}));
  // the canoe hull (a pinched ellipse) — drawn as a polyline so the ends sharpen like a celt
  let d="";
  for(let i=0;i<=40;i++){ const t=i/40*Math.PI*2;
    const sharp=1-0.18*Math.cos(2*t);
    const px=cx+Math.cos(t)*longR*sharp, py=cy+Math.sin(t)*shortR;
    d += (i?"L":"M")+px.toFixed(1)+" "+py.toFixed(1); }
  d+="Z";
  g.appendChild(el("path",{d,class:"fp-line",fill:"none",opacity:".82"}));
  g.appendChild(el("path",{d,class:"fp-lit",fill:"none",opacity:".5"}));
  // the keel ridge along the long axis
  g.appendChild(el("line",{x1:cx-longR*0.86,y1:cy,x2:cx+longR*0.86,y2:cy,class:"fp-fine",opacity:".7"}));
  // the cyan MASS-AXIS skew line, tilted ~14° off the keel — the visible cause
  const dRad=14*Math.PI/180, ml=longR*0.74;
  g.appendChild(el("line",{x1:cx-Math.cos(dRad)*ml,y1:cy-Math.sin(dRad)*ml*shortR/longR*1.0 - Math.sin(dRad)*ml*0.0,
    x2:cx+Math.cos(dRad)*ml,y2:cy+Math.sin(dRad)*ml*(shortR/longR),
    class:"fp-fine",stroke:"#7fc7e8",opacity:".75","stroke-dasharray":"4 3"}));
  // a faint favored-arc above the stone
  g.appendChild(el("path",{d:`M${cx-longR*0.5} ${cy-shortR-6} Q${cx} ${cy-shortR-13} ${cx+longR*0.5} ${cy-shortR-6}`,
    class:"fp-fine",fill:"none",stroke:"#8fd79a",opacity:".4"}));
  // two end pips so the long axis reads
  g.appendChild(el("circle",{cx:cx+longR*0.82,cy:cy,r:2.6,class:"fp-lit",opacity:".7"}));
  g.appendChild(el("circle",{cx:cx-longR*0.82,cy:cy,r:2.6,class:"fp-line",opacity:".7"}));
}
function drawOverhang(g, r){ // THE INFINITE OVERHANG — a side-on brass table slab whose right edge is the CLIFF,
  // with a stepped staircase of book rects leaning ever-further out past it, plus a faint x=1 goal tick.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the brass table: a solid block on the LEFT, its right face the cliff edge
  const cliffX = x + w*0.46;                          // the cliff sits left-of-centre; books lean right
  const tableTop = y + h*0.60;                         // the table surface the bottom book rests on
  g.appendChild(el("rect",{x:x+w*0.06,y:tableTop,width:cliffX-(x+w*0.06),height:y+h*0.92-tableTop,
    class:"fp-line",fill:"none",opacity:".7"}));
  // the lit table-surface line + the cliff face (the brink past which the books float)
  g.appendChild(el("line",{x1:x+w*0.06,y1:tableTop,x2:cliffX,y2:tableTop,class:"fp-lit",opacity:".7"}));
  g.appendChild(el("line",{x1:cliffX,y1:tableTop,x2:cliffX,y2:y+h*0.92,class:"fp-lit",opacity:".55"}));
  // the stepped staircase of books: each higher book leans a diminishing 1/(2k) further right —
  // drawn bottom-up so the steps overlap correctly and the top book floats well past the cliff.
  const bw = w*0.30, bh = Math.max(3, h*0.075);        // book width / height in plan units
  let off = 0;                                          // cumulative right offset past the cliff
  const N = 5;
  for(let k=1;k<=N;k++){                                // k = book counted FROM THE TOP
    off += 1/(2*k);                                     // the harmonic nudge, shrinking each step
  }
  // re-walk bottom→top placing rects, so the lowest is flush at the cliff and the top juts farthest
  let cum = 0;
  for(let k=N;k>=1;k--){
    cum += 1/(2*k);
    const bx = cliffX - bw + cum*bw*0.92;              // lean right by the cumulative nudge
    const by = tableTop - (N-k+1)*bh;
    const lit = (k===1);                                // the top (farthest-out) book is the lit hero
    g.appendChild(el("rect",{x:bx,y:by,width:bw,height:bh-1,
      class:lit?"fp-lit":"fp-line",fill:"none",opacity:lit?".82":".62"}));
  }
  // the faint x=1 goal tick — one book-length past the cliff (the first divergence threshold)
  const goalX = cliffX + bw;
  if(goalX < x+w-3){
    g.appendChild(el("line",{x1:goalX,y1:tableTop-N*bh-2,x2:goalX,y2:tableTop,
      class:"fp-fine",opacity:".5",stroke:"#7fc7e8","stroke-dasharray":"3 3"}));
  }
}
function drawSundial(g, r){ // THE GNOMON — a garden sundial: a graduated dial-face, radial hour ticks, a
  // triangular polar style. The LIVE brass shadow + gnomon furniture are drawn by the Hours
  // layer ON TOP (mounted into #viewport after the sky pass); this is the static plan engraving.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.5, cy=y+h*0.54, rad=Math.min(w,h)*0.40;
  // the graduated dial drum (two concentric rims)
  g.appendChild(el("circle",{cx,cy,r:rad,class:"fp-line",opacity:".7"}));
  g.appendChild(el("circle",{cx,cy,r:rad-3.5,class:"fp-fine",opacity:".5"}));
  // radial hour ticks (every 15°, long at the cardinal hours) reading like an engraved dial
  for(let a=0;a<360;a+=15){ const t=(a-90)*Math.PI/180, long=(a%90===0);
    g.appendChild(el("line",{x1:cx+Math.cos(t)*(rad-(long?9:5)),y1:cy+Math.sin(t)*(rad-(long?9:5)),
      x2:cx+Math.cos(t)*(rad-1),y2:cy+Math.sin(t)*(rad-1),class:"fp-fine",opacity:long?".7":".42"})); }
  // the noon line (up the dial, toward 12)
  g.appendChild(el("line",{x1:cx,y1:cy-rad+1,x2:cx,y2:cy,class:"fp-fine",opacity:".5"}));
  // the triangular polar STYLE (the gnomon edge) rising from the centre toward 12
  g.appendChild(el("path",{d:`M${cx} ${cy} L${cx} ${cy-rad*0.92} L${cx+rad*0.42} ${cy} Z`,class:"fp-line",opacity:".82"}));
  g.appendChild(el("path",{d:`M${cx} ${cy} L${cx} ${cy-rad*0.92} L${cx+rad*0.42} ${cy} Z`,class:"fp-lit",opacity:".5"}));
  // the centre nodus
  g.appendChild(el("circle",{cx,cy,r:2.2,class:"fp-line"}));
}
function drawReckoning(g, r){ // THE RECKONING CABINET — a brass instrument-panel slab: five engraved station

  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);

    g.appendChild(el("line",{x1:tx,y1:railY-(big?2.6:1.4),x2:tx,y2:railY+(big?2.6:1.4),class:"fp-fine",opacity:big?".6":".38"})); }
  // five station BAYS on the rail, each with a pointer dropping to it

    // a tiny engraved mark inside each bay (a different glyph-shape per instrument, abstracted to plan)
    const my = bayTop + bayH*0.5;
    if(i===0){ // slipstick: two short parallel scale-bars

      g.appendChild(el("path",{d:`M${cx} ${my+bayH*0.22} L${cx} ${my-bayH*0.22} L${cx+span*0.22} ${my+bayH*0.22} Z`,class:"fp-fine",opacity:".6"}));
      g.appendChild(el("line",{x1:cx,y1:my+bayH*0.22,x2:cx+span*0.30,y2:my+bayH*0.10,class:"fp-fine",opacity:".42","stroke-dasharray":"2 2"}));

  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} a${w*0.16} ${w*0.16} 0 0 1 ${w*0.16} -3`,class:"fp-fine",opacity:".38"}));

function drawLaunchRail(g, r){ // THE AERODROME — a side-on launch complex: a braced gantry MAST, a diagonal
  // RAIL up to a launch LIP, a small craft WEDGE on the rail, and a thin engraved ARC leaving the lip
  // up-and-right (the trace it will fly). Reads "something launches from here" at plan-glance.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);

  // the gantry MAST + cross-braces at the foot
  g.appendChild(el("line",{x1:fx,y1:y+h*0.94,x2:fx,y2:y+h*0.30,class:"fp-line",opacity:".72"}));
  for(let i=0;i<4;i++){ const yy=y+h*0.86-i*h*0.16;
    g.appendChild(el("line",{x1:fx-w*0.05,y1:yy,x2:fx+w*0.05,y2:yy-h*0.05,class:"fp-fine",opacity:".5"})); }
  // the diagonal RAIL with sleeper ties
  g.appendChild(el("line",{x1:fx,y1:fy,x2:lx,y2:ly,class:"fp-line",opacity:".7"}));

  for(let i=0;i<=7;i++){ const t=i/7, mx=fx+dx*t, my=fy+dy*t;

  // the launch LIP (a short upturn) + the craft WEDGE riding the rail
  g.appendChild(el("path",{d:`M${lx} ${ly} l${w*0.06} ${-h*0.02}`,class:"fp-line",opacity:".66"}));
  const cx0=fx+dx*0.46, cy0=fy+dy*0.46, ang=Math.atan2(dy,dx);
  const wedge=`M${cx0+Math.cos(ang)*6} ${cy0+Math.sin(ang)*6}
    L${cx0+Math.cos(ang+2.5)*4} ${cy0+Math.sin(ang+2.5)*4}
    L${cx0+Math.cos(ang-2.5)*4} ${cy0+Math.sin(ang-2.5)*4} Z`;
  g.appendChild(el("path",{d:wedge,class:"fp-lit",opacity:".7"}));

  g.appendChild(el("path",{d:`M${lx} ${ly} Q ${lx+w*0.22} ${ly-h*0.20} ${x+w-3} ${y+h*0.14}`,

}

/* ── geometry helpers (leader-line origin/edge for a footprint) ── */
function footCentre(r){
  if(r.footprint==="tower") return { cx:r.x, cy:r.y };
  return { cx:r.x + r.w/2, cy:r.y + r.h/2 };
}
function footEdge(r, side){
  if(r.footprint==="tower"){
    const m={left:[r.x-r.r,r.y],right:[r.x+r.r,r.y],top:[r.x,r.y-r.r],bottom:[r.x,r.y+r.r]};
    return m[side];
  }
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  const m={left:[r.x,cy],right:[r.x+r.w,cy],top:[cx,r.y],bottom:[cx,r.y+r.h]};
  return m[side];
}
function footBBox(r){
  if(r.footprint==="tower") return { x:r.x-r.r, y:r.y-r.r, w:r.r*2, h:r.r*2 };
  return { x:r.x, y:r.y, w:r.w, h:r.h };
}
