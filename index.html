    var GUT = gutterFor(district), WPAD = wingPadFor(district), DPAD = districtPadFor(district);

    // group by wing (undefined wing → '' remainder bucket)
    var wings = {};
    for (var i = 0; i < rooms.length; i++) {
      var w = rooms[i].wing || '';
      (wings[w] = wings[w] || []).push(rooms[i]);
    }
    var wingIds = Object.keys(wings).sort();

    // pack each wing into a local grid; collect its block size + per-room slots
    var blocks = [];
    var wingPacks = {};
    var frameInnerW = region.w - 2 * DPAD;
    for (var wi = 0; wi < wingIds.length; wi++) {
      var wid = wingIds[wi];
      var list = wings[wid].slice().sort(byOrderId);
      // all rooms in a wing share a tier (kin look alike); use the first room's band
      var band = bandFor(list[0].tier, district);
      var pk = packGrid(list.length, band.w, band.h, frameInnerW - 2 * WPAD, GUT);
      wingPacks[wid] = { list: list, pack: pk };
      // a wing block is its slot-union + WPAD all around
      blocks.push({ wid: wid, w: pk.w + 2 * WPAD, h: pk.h + 2 * WPAD });
    }
    // shelf-pack the wing blocks (first-fit-decreasing by area for tighter packing)
    var order = blocks.slice().sort(function (a, b) { return b.w * b.h - a.w * a.h; });
    var sp = shelfPack(order, frameInnerW, GUT);
    // map back: order[k] sits at sp.offs[k]
    var blockOff = {};
    for (var k = 0; k < order.length; k++) blockOff[order[k].wid] = sp.offs[k];

    // fit the packed content into the region
    var ft = fitInto(sp.w, sp.h, region, DPAD);

    // emit absolute footprints + wing rects
    var allSlots = [];
    for (var wj = 0; wj < wingIds.length; wj++) {
      var wid2 = wingIds[wj];
      var bo = blockOff[wid2];
      var wp = wingPacks[wid2];
      var wingSlotRects = [];
      for (var si = 0; si < wp.list.length; si++) {
        var s = wp.pack.slots[si];
        // local: blockOff + WPAD + slot, then scale+offset
        var lx = bo.x + WPAD + s.x, ly = bo.y + WPAD + s.y;
        var abs = {
          x: ft.ox + lx * ft.s,
          y: ft.oy + ly * ft.s,
          w: s.w * ft.s,
          h: s.h * ft.s
        };
        setFoot(solution, wp.list[si], abs);
        wingSlotRects.push(abs);
        allSlots.push(abs);
      }
      // a wing rect (even a solo wing gets a bounded tint) — only if the wing is named
      if (wid2 !== '') {
        var wu = rectUnion(wingSlotRects);
        solution.wingRects.push({
          district: district, wing: wid2,
          label: wingLabel(wid2), accent: wingAccent(wid2, conf.hue),
          x: wu.x - WPAD * ft.s, y: wu.y - WPAD * ft.s,
          w: wu.w + 2 * WPAD * ft.s, h: wu.h + 2 * WPAD * ft.s
        });
      }
    }
    var du = rectUnion(allSlots);
    return du;
  }

  /* the MANOR: pinned region, three wings (studies/east/maker). */
  function placeManor(rooms, solution) {
    if (!rooms.length) return;
    var conf = DISTRICTS.manor;
    var du = packDistrictInto('manor', rooms, conf.region, solution);
    emitDistrictRect('manor', du, solution);
  }

  /* the GROUNDS: each wing goes to its own sub-region (GROUNDS_WINGS), so the
     grounds spread across the field instead of crowding one block. */
  function placeGrounds(rooms, solution) {
    if (!rooms.length) return;
    var conf = DISTRICTS.grounds;
    // bucket rooms by wing → sub-region
    var wings = {};
    for (var i = 0; i < rooms.length; i++) {
      var w = rooms[i].wing || '_remainder';
      (wings[w] = wings[w] || []).push(rooms[i]);
    }
    var allDU = [];
    var wingIds = Object.keys(wings).sort();
    for (var wj = 0; wj < wingIds.length; wj++) {
      var wid = wingIds[wj];
      var list = wings[wid].slice().sort(byOrderId);
      // pick a sub-region: conservatory-wing rooms use the east band
      var sub = GROUNDS_WINGS[wid];
      if (!sub && wid === 'conservatory') sub = GROUNDS_WINGS.conservatory_band;
      if (!sub) sub = GROUNDS_WINGS[wid] || { x: FIELD.x, y: FIELD.y + 480, w: 240, h: 130 };
      var band = bandFor(list[0].tier, 'grounds');
      var pk = packGrid(list.length, band.w, band.h, sub.w - 2 * WING_PAD);
      var ft = fitInto(pk.w + 2 * WING_PAD, pk.h + 2 * WING_PAD, sub, 6);
      var slotRects = [];
      for (var si = 0; si < list.length; si++) {
        var s = pk.slots[si];
        var lx = WING_PAD + s.x, ly = WING_PAD + s.y;
        var abs = clampToField({
          x: ft.ox + lx * ft.s, y: ft.oy + ly * ft.s,
          w: s.w * ft.s, h: s.h * ft.s
        });
        setFoot(solution, list[si], abs);
        slotRects.push(abs);
        allDU.push(abs);
      }
      if (wid !== '_remainder') {
        var wu = rectUnion(slotRects);
        var pad = WING_PAD * ft.s;
        solution.wingRects.push({
          district: 'grounds', wing: wid,
          label: wingLabel(wid), accent: wingAccent(wid, conf.hue),
          x: wu.x - pad, y: wu.y - pad, w: wu.w + 2 * pad, h: wu.h + 2 * pad
        });
      }
    }
    var du = rectUnion(allDU);
    emitDistrictRect('grounds', du, solution);
  }

  /* a SIMPLE district (observatory/outbuilding/cavern): pack into its own region.
     These have no named wings — one bounded precinct. */
  function placeSimpleDistrict(district, rooms, solution) {
    if (!rooms.length) return;
    var conf = DISTRICTS[district];
    var du = packDistrictInto(district, rooms, conf.region, solution);
    emitDistrictRect(district, du, solution);
  }

  function emitDistrictRect(district, du, solution) {
    if (!du) return;
    var conf = DISTRICTS[district];
    var pad = districtPadFor(district);
    solution.districtRects.push({
      district: district, label: conf.label, hue: conf.hue, tint: conf.tint,
      style: conf.style, anchor: !!conf.anchor,
      x: du.x - pad, y: du.y - pad, w: du.w + 2 * pad, h: du.h + 2 * pad
    });
  }

  /* a district rect's south-centre gate point (where its avenue terminates) */
  function gateOf(dr) {
    if (dr.district === 'observatory') return { x: dr.x + dr.w / 2, y: dr.y + dr.h }; // gate at base of rise
    return { x: dr.x + dr.w / 2, y: dr.y };  // gate at the north (manor-facing) edge
  }

  /* build the circulation graph: door → spine → district avenues → wing aisles
     → room stubs. Coordinates from the solved district/wing/footprint rects. */
  function buildGraph(solution) {
    var manorRect = null;
    for (var i = 0; i < solution.districtRects.length; i++)
      if (solution.districtRects[i].district === 'manor') manorRect = solution.districtRects[i];
    var manorRegion = DISTRICTS.manor.region;
    // the FRONT DOOR: south-centre of the manor region (historic ~x721 y504)
    var door = { x: manorRegion.x + manorRegion.w / 2, y: manorRegion.y + manorRegion.h };
    solution.door = door;
    solution.graph.door = door;

    // the SPINE: a short heavy avenue rising up the manor centre from the door
    var spineTop = { x: door.x, y: manorRegion.y + manorRegion.h * 0.18 };
    solution.graph.spine = { x0: door.x, y0: door.y, x1: spineTop.x, y1: spineTop.y };

    // DISTRICT AVENUES: from the door to each non-manor district gate
    for (var d = 0; d < solution.districtRects.length; d++) {
      var dr = solution.districtRects[d];
      if (dr.district === 'manor') continue;
      var gate = gateOf(dr);
      solution.graph.avenues.push({
        district: dr.district, label: 'to ' + titleCase(dr.label),
        x0: door.x, y0: door.y, x1: gate.x, y1: gate.y
      });
    }

    // WING AISLES: from each wing rect's nearest edge toward the door, + a stub
    // to each room footprint edge (kin connectors). Manor wings get short stubs.
    for (var w2 = 0; w2 < solution.wingRects.length; w2++) {
      var wr = solution.wingRects[w2];
      var wc = { x: wr.x + wr.w / 2, y: wr.y + wr.h / 2 };
      // the wing's gate: the point on its boundary nearest the door
      var gx = Math.max(wr.x, Math.min(door.x, wr.x + wr.w));
      var gy = Math.max(wr.y, Math.min(door.y, wr.y + wr.h));
      solution.graph.aisles.push({
        district: wr.district, wing: wr.wing,
        x0: gx, y0: gy, x1: wc.x, y1: wc.y
      });
    }

    // ROOM STUBS: short connector from each footprint edge toward its wing centre
    for (var id in solution.foot) {
      var f = solution.foot[id];
      var c = f.r != null ? { x: f.x, y: f.y } : { x: f.x + f.w / 2, y: f.y + f.h / 2 };
      var meta = solution.footMeta[id];
      // find the wing rect this room belongs to (for a short kin stub)
      var target = null;
      if (meta && meta.wing) {
        for (var wk = 0; wk < solution.wingRects.length; wk++) {
          var w3 = solution.wingRects[wk];
          if (w3.district === meta.district && w3.wing === meta.wing) {
            target = { x: w3.x + w3.w / 2, y: w3.y + w3.h / 2 }; break;
          }
        }
      }
      if (!target) target = door;
      solution.graph.stubs.push({ id: id, x0: c.x, y0: c.y, x1: target.x, y1: target.y });
    }
  }

  function titleCase(s) {
    return String(s).toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  /* the gated BENEATH slot (a reserved cellar slot at the manor south foundation) —
     revealUndercroft asks for it by id. Returns {x,y,w,h} for the stair footprint. */
  function beneathSlot() {
    var reg = DISTRICTS.beneath.region;
    var band = bandFor(3);
    var w = Math.min(band.w * 0.5, reg.w), h = Math.min(band.h, reg.h);
    return { x: reg.x + (reg.w - w) / 2, y: reg.y + (reg.h - h) / 2, w: w, h: h };
  }

  return {
    solve: solve,
    DISTRICTS: DISTRICTS,
    WING_META: WING_META,
    GROUNDS_WINGS: GROUNDS_WINGS,
    SIZE_BAND: SIZE_BAND,
    FIELD: FIELD,
    beneathSlot: beneathSlot,
    bandFor: bandFor,
    wingLabel: wingLabel,
    wingAccent: wingAccent
  };
})();

</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   THE LEGIBILITY CONSCIENCE (inlined at build time by forge). Provides the
   `Legibility` global: the SAME conscience that judges this door's own layout —
   it models each POI's label box + leader from the declarations and scores how
   crowded the plate reads. It depends on the Layout + LabelPlacer engines inlined
   ABOVE, so it is included here, after them. The door's page-level self-test pill
   (below, near the legend) runs Legibility's regression proof LIVE in the browser
   on the SAME clean/crowded controls the Node twin (legibility.test.cjs) asserts —
   so the conscience that judges this door is itself proven sound in front of you.
   See tools/layout/legibility.cjs + tools/layout/legibility.test.cjs. */
/* ════════════════════════════════════════════════════════════════════════════
   legibility.cjs — the Workshop estate-plan's automated LEGIBILITY CONSCIENCE.

   The Layout engine GUARANTEES the structural mechanics (no footprint stacks, no
   star collision, every room reachable). What it does NOT guarantee is that the
   LABELS — the room names + sub-lines + leaders that a human actually reads — stay
   legible once a district fills up. This module is the conscience for that: it
   MODELS each placed POI's label box + leader from the declarations, then scores
   how crowded the result reads, BEFORE a human ever screenshots the plate.

   ── WHAT IT MEASURES — THREE SUB-SCORES OVER ONE SHARED LABEL MODEL ──
     1. gapSubScore     — pairwise gap between every label box and every other
                          label box / non-owner footprint (the most direct signal).
     2. leaderClutter   — leader-line CROSSINGS + footprint INTRUSIONS (corroborating
                          structural clutter the pairwise gap can't see).
     3. densitySubScore — per-district Gaussian kernel density over claim centroids
                          (the regional "this corner is packed" signal).
   A weighted blend (gap dominant) → ONE composite per district + overall, against a
   single threshold DERIVED from clean/crowded controls (see THRESHOLD below).

   ── HONEST BOUND: A MODELED-LABEL PROXY, NOT RENDERED PIXELS (#103) ──
   We model each label from the prefer-seed START slot, not the annealed render —
   a crowding PROXY (#103); it measures the PRESSURE that forces labels into
   competition, not pixel-exact overlap. The annealer then relieves some of that
   pressure by flipping sides; the proxy deliberately reads the pre-anneal demand,
   which is the quantity a [map] re-draw must reduce at the source (region budgets,
   wing sub-anchors, room counts) — annealing can only paper over so much.

   ── CALIBRATED TUNABLES ("writ in water" — re-measure if the type scale changes) ──
   CHAR_W_NAME 8.4  px/char of the roomname  (16.5px serif .roomname — measured getBBox)
   CHAR_W_SUB  6.8  px/char of the sub-line   (9px mono .roomsub    — measured getBBox)
   In 35/36 placed POIs the UPPERCASE sub-line ("PIECE · tag") is the WIDER line and
   therefore drives boxW; the roomname drives it only for the few very short subs.
   BOX_H_BASE 35 / BOX_H_COMPANION 50  the typeset block height (name+rule+sub, +the
   "↳ companion within" line when present), pre-PAD. PAD = LABEL_PAD = 3 (the dark
   backing-stroke halo index.src.html inflates by on every side).

   ── COMPOSITE WEIGHTS + THRESHOLD DERIVATION ──
   composite = 0.5*gap + 0.3*density + 0.2*leader.
     gap is dominant — it is the most direct legibility signal (can I read this label
       without it touching that one?).
     density is regional corroboration (is this whole corner packed?).
     leader is structural corroboration (do the leaders cross / stab footprints?).
   The THRESHOLD is derived AFTER the weights are fixed, from the shared control
   corpus: the clean-positive control (6 rooms, 1/district, spread) composites to ~0,
   and the crowded-negative control (12 rooms in one wing) composites high. THRESHOLD
   = 0.30 sits with margin between them (clean << 0.30 << crowded). The test asserts
   this derivation: clean PASSES and crowded FAILS with the controls' actual numbers.

   ── EXIT-CODE POLICY (why smoke.cjs reports legibility as a WARNING, not exit-1) ──
   The LIVE 37-POI front door is EXPECTED to FAIL the legibility threshold — that red
   is the HONEST, INTENDED confirmation of #103 in code, the very pressure a pending
   [map] re-draw must relieve. If it tripped smoke.cjs's structural exit code, every
   unrelated cycle's CI would break on a known-open issue. So smoke.cjs prints the
   legibility verdict + heat-map as its OWN clearly-labelled WARNING section and
   leaves the structural exit code untouched. The legibility regression guard lives
   in legibility.test.cjs (exit 0 on the controls), not in smoke's door scan.

   Node-pure, zero external deps. The ONE thing it `require`s is the repo's own
   engines — layout.js (FIELD, the solve) and label/label.js (the renderer's EXACT
   slotTopLeft + nearestEdgePoint geometry) — so the modeled box+leader provably
   cannot drift from index.src.html's applyPlacement (index.src.html:2033-2052).
   ════════════════════════════════════════════════════════════════════════════ */
'use strict';

/* ── DUAL-USE WIRING (Node require · forge-inlined browser global) ───────────
   In Node this module `require`s the repo's own engines. When forge inlines it
   into index.html, `require`/`module` are absent — but layout.js + label/label.js
   are inlined ABOVE this block and have already attached the `Layout` /
   `LabelPlacer` globals, so we resolve from those instead. The IIFE returns the
   exports object; the `globalThis` block attaches it as the `Legibility` global
   for the page; the strippable guard at the very bottom keeps Node's
   `require('./legibility.cjs')` working (forge drops exactly that braced line). */
var Legibility = (function () {
'use strict';
// Browser default: read the globals the inlined layout.js / label.js attached above.
var Layout = (typeof globalThis !== 'undefined') ? globalThis.Layout : null;
var LabelPlacer = (typeof globalThis !== 'undefined') ? globalThis.LabelPlacer : null;
// Node override (forge strips exactly this braced single line from the browser inline):
var geom = LabelPlacer.geom;

/* ── calibrated tunables (see header) ─────────────────────────────────────── */
const CHAR_W_NAME = 8.4;   // px/char, 16.5px serif .roomname  (measured getBBox)
const CHAR_W_SUB = 6.8;    // px/char, 9px mono .roomsub        (measured getBBox)
const BOX_H_BASE = 35;     // name + kicker rule + sub-line block height (pre-PAD)
const BOX_H_COMPANION = 50;// + the "↳ companion within" line
const PAD = 3;             // LABEL_PAD — the backing-stroke halo (index.src.html:2004)
const LABEL_GAP = 14;      // LABEL_GAP (index.src.html:2000) — leader breathing room
const LABEL_BOUNDS = { x: 46, y: 52, w: 1348, h: 790 }; // index.src.html:1995

/* composite weights + derived threshold (see header) */
const WEIGHTS = { gap: 0.5, density: 0.3, leader: 0.2 };
const THRESHOLD = 0.30;

/* density kernel params (the PROVEN facet-3 backbone — preserve exactly) */
const DENSITY_H = 64;      // Gaussian bandwidth in viewBox units (~3 label heights)
const DENSITY_K = 3.0;     // saturating scale: peak~3 (a 4-clump) → sub~0.5

/* leader-clutter scale */
const LEADER_K = 4.0;      // raw clutter → sub via 1-exp(-raw/K)
const LEADER_EPS = 1.5;    // footprint inset for intrusion test (avoid edge-grazes)

/* ── geometry helpers ─────────────────────────────────────────────────────── */
function footBBox(f) {
  // mirror index.src.html footBBox: a tower carries {x,y,r}; a room {x,y,w,h}.
  return f.r != null ? { x: f.x - f.r, y: f.y - f.r, w: f.r * 2, h: f.r * 2 }
                     : { x: f.x, y: f.y, w: f.w, h: f.h };
}
function footCentre(f) {
  // mirror index.src.html footCentre: tower → its centre; room → its mid.
  return f.r != null ? { x: f.x, y: f.y } : { x: f.x + f.w / 2, y: f.y + f.h / 2 };
}
/* gap (clear distance) between two AABBs; 0 if they touch/overlap. */
function rectGap(a, b) {
  const dx = Math.max(0, Math.max(a.x - (b.x + b.w), b.x - (a.x + a.w)));
  const dy = Math.max(0, Math.max(a.y - (b.y + b.h), b.y - (a.y + a.h)));
  if (dx === 0 && dy === 0) return 0; // overlapping or edge-touching
  return Math.sqrt(dx * dx + dy * dy);
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
/* clamp a box into LABEL_BOUNDS the same way the FIELD-clamp pattern does. */
function clampToBounds(box) {
  const B = LABEL_BOUNDS;
  return {
    x: Math.max(B.x, Math.min(box.x, B.x + B.w - box.w)),
    y: Math.max(B.y, Math.min(box.y, B.y + B.h - box.h)),
    w: box.w, h: box.h
  };
}

/* ════════════════════════════════════════════════════════════════════════════
   1. THE ONE SHARED LABEL MODEL — every facet consumes THIS, never its own.
   buildLabelModel(places, solution) → { boxes:[...], footMeta:{id→{district}} }
   Each box: { id, district, box:{x,y,w,h}, side, anchor:{x,y}, foot, leader:{...} }
   ════════════════════════════════════════════════════════════════════════════ */
function preferSide(r) {
  const p = r.prefer;
  if (Array.isArray(p)) return p[0] || 'right';
  return p || 'right';
}
function subLen(r) {
  // the sub-line is the UPPERCASE "PIECE · tag" (index.src.html:1701). It drives
  // width in 35/36 placed POIs. Fall back to the id for synthetic controls.
  const piece = (r.piece || r.room || r.id || '').toUpperCase();
  const tag = r.tag || '';
  return tag ? (piece + ' · ' + tag).length : piece.length;
}
function nameLen(r) { return (r.room || r.id || '').length; }

function buildLabelModel(places, solution) {
  const boxes = [];
  const footMeta = {};
  // index places by id so a box can recover its declaration (companion, prefer).
  const byId = {};
  for (const r of places) byId[r.id] = r;

  for (const r of places) {
    const f = solution.foot[r.id];
    if (!f) continue; // locked/undercroft (not in sol.foot) and any unplaced id
    footMeta[r.id] = { district: r.district };

    // ── box dims from the MEASURED model (header) ──
    const boxW = Math.max(nameLen(r) * CHAR_W_NAME, subLen(r) * CHAR_W_SUB) + 2 * PAD;
    const boxH = (r.companion ? BOX_H_COMPANION : BOX_H_BASE) + 2 * PAD;

    // ── seat the box with the RENDERER'S OWN geometry ──
    const side = preferSide(r);                         // the solver's START slot
    const anchor = footCentre(f);
    const fb = footBBox(f);
    const gap = Math.max(fb.w, fb.h) / 2 + LABEL_GAP;   // labelGap(r), index.src.html:2073
    const tl = geom.slotTopLeft(anchor, boxW, boxH, gap, side);
    const box = clampToBounds({ x: tl.x, y: tl.y, w: boxW, h: boxH });
    box.id = r.id; box.district = r.district;

    // ── leader segment, mirroring applyPlacement EXACTLY (index.src.html:2047-2048) ──
    const lend = geom.nearestEdgePoint(anchor.x, anchor.y, box);     // on the label
    const fstart = geom.nearestEdgePoint(lend[0], lend[1], fb);       // on the footprint
    const leader = { x0: fstart[0], y0: fstart[1], x1: lend[0], y1: lend[1] };

    boxes.push({ id: r.id, district: r.district, box, side, anchor, foot: fb, leader });
  }
  return { boxes, footMeta, byId };
}

/* ════════════════════════════════════════════════════════════════════════════
   2a. FACET 1 — gapSubScore: pairwise label↔label + label↔non-owner-footprint.
   Quadratic penalty pinned 1 on overlap; folded by worst-K soft-max.
   ════════════════════════════════════════════════════════════════════════════ */
function gapSubScore(boxes, MARGIN) {
  const pen = g => (g >= MARGIN ? 0 : Math.pow(1 - g / MARGIN, 2));
  const penalties = [];
  let minGap = Infinity;
  const offenders = [];

  for (let i = 0; i < boxes.length; i++) {
    const A = boxes[i];
    // label ↔ every OTHER label
    for (let j = i + 1; j < boxes.length; j++) {
      const B = boxes[j];
      const g = rectsOverlap(A.box, B.box) ? 0 : rectGap(A.box, B.box);
      if (g < minGap) minGap = g;
      const p = rectsOverlap(A.box, B.box) ? 1 : pen(g);
      if (p > 0) {
        penalties.push(p);
        if (p > 0.25) offenders.push({ a: A.id, b: B.id, gap: +g.toFixed(1), kind: 'label-label' });
      }
    }
    // label ↔ non-owner footprint (exclude A's OWN footprint via owner id)
    for (let k = 0; k < boxes.length; k++) {
      if (k === i) continue;            // skip own footprint
      const fb = boxes[k].foot;
      const g = rectsOverlap(A.box, fb) ? 0 : rectGap(A.box, fb);
      const p = rectsOverlap(A.box, fb) ? 1 : pen(g);
      if (p > 0) {
        penalties.push(p);
        if (p > 0.25) offenders.push({ a: A.id, b: boxes[k].id, gap: +g.toFixed(1), kind: 'label-foot' });
      }
    }
  }

  if (!penalties.length) return { score: 0, minGap: isFinite(minGap) ? +minGap.toFixed(1) : null, offenders: [] };
  penalties.sort((p, q) => q - p); // descending
  const K = Math.max(4, Math.ceil(boxes.length * 0.15));
  const top = penalties.slice(0, K);
  const score = top.reduce((s, p) => s + p, 0) / top.length;
  offenders.sort((p, q) => p.gap - q.gap);
  return { score, minGap: isFinite(minGap) ? +minGap.toFixed(1) : null, offenders: offenders.slice(0, 8) };
}

/* ════════════════════════════════════════════════════════════════════════════
   2b. FACET 2 — leaderClutter: proper segment crossings + footprint intrusions.

   ════════════════════════════════════════════════════════════════════════════ */

  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);

  const grid = [];

  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const px = F.x + (c + 0.5) / COLS * F.w;
      const py = F.y + (r + 0.5) / ROWS * F.h;
      let v = 0;
      for (const cen of cs) {
        const dx = px - cen.x, dy = py - cen.y;
        v += Math.exp(-(dx * dx + dy * dy) / (DENSITY_H * DENSITY_H));

      row.push(v);
      if (v > gmax) gmax = v;

    grid.push(row);

  // each district's own label subset so a district composite is self-contained.
  const byD = {};
  for (const b of model.boxes) (byD[b.district] = byD[b.district] || []).push(b);
  const dDens = {};
  for (const d of densR.districts) dDens[d.district] = d;

    const g = gapSubScore(subset, MARGIN).score;
    const l = leaderClutter({ boxes: subset, footMeta: model.footMeta }, null).score;
    const dn = (dDens[d] || {}).sub || 0;
    districts.push({
      district: d, n: subset.length,
      gap: +g.toFixed(3), density: +dn.toFixed(3), leader: +l.toFixed(3),
      composite: +compositeOf(g, dn, l).toFixed(3)

  const composite = +compositeOf(gapR.score, densR.score, leaderR.score).toFixed(3);

  const ch = (report.overall.countHottest || {}).district;

  { id:"tone-mill", room:"The Tone Mill", piece:"The Tone Mill", glyph:"⚙",
    accent:"#d8a94a", href:"tone-mill/index.html", tag:"f = N·Ω/2π",
    companion:{ name:"The Passing Siren", glyph:"🚨" }, skyStar:"tone-mill",
    district:"manor", tier:2, wing:"kinetics-sound", footprint:"house-wing", order:10, prefer:"bottom",
    blurb:"An enclosed brass LAB INSTRUMENT you operate at a bench — a 19th-century acoustic siren that proves pitch is a RATE you can watch. Grab the toothed disc and CRANK it (drag it round, or fling and let go; friction bleeds it down); one shared phase θ(t) turns the disc AND sets the pitch, so the rate you WATCH (Ω) and the tone you HEAR (f = N·Ω/2π) are a single number by construction. Double Ω and you SEE it whirl twice as fast and HEAR an exact octave (+1200¢). Dial a STROBE lamp until the teeth stand still and its readout IS the pitch you hear — the eye reads the ear. Pick a small-integer ring ratio (2:1, 3:2, 4:3, 5:4) and two concentric tooth-rings on the same Ω sound a just interval and freeze together as one chord; detune one and the moiré crawls and the chord sours. The DETACHED-NEEDLE negative control runs the ear off a free knob: the strobe still freezes the disc but the heard Hz drifts off N·Ω/2π — proof it's the shared phase, not two tuned dials, that binds seen and heard. Self-proved exact (a Node twin + an in-page pill: the eye-rate × N === f to <1e-9, doubling Ω === +1200¢, the rings sound the derived just ratio, the detached needle drives f off the law) with an audio-lens ear-check that recovers the fundamental headless. Founds the MANOR's Kinetics & Sound wing; kin to the Sound Garden's monochord, next door to The Passing Siren's Doppler." },

  { id:"firmament", room:"The Observatory", piece:"Firmament", glyph:"🌌",

  { id:"parallax-baseline", room:"The Observatory", piece:"The Parallax Baseline", glyph:"📐",
    accent:"#9db4ff", href:"parallax-baseline/index.html", tag:"distance you measure",
    companion:{ name:"Firmament", glyph:"🌌" },
    district:"observatory", tier:1, footprint:"tower", prefer:"right",
    blurb:"Distance you MEASURE, not a curve you read. Drag Earth across its one-AU baseline and blink the sky between January and July — a nearby star wobbles against Firmament's fixed far field while a brass machinist's micrometer reads its parallax half-angle p live. Throw the RESOLVE knife-switch and the parsec definition turns the angle into a distance: d = 1/p, because 1 pc ≝ the distance at which 1 AU subtends 1″. The factor of two between the dialed half-angle and the full Jan→Jul throw is shown, never fudged. Two honest negative controls live under your hand: lock the baseline to zero, or pull the star out to infinity, and the throw vanishes to a flat 0.000″. A clearly-labelled \"sky ×N\" knob magnifies only the picture — never the core, never the micrometer number — because real parallax is sub-arcsecond and invisible at screen scale. A Node-twin self-test proves the reciprocal exact to machine-ε over a decade of distances, the two zero-controls exact, and the view-map an exact inverse over a decade of zoom. Companion to Firmament, the sky it measures against." },

  { id:"stellar-forge", room:"The Stellar Forge", piece:"The Scales of a Star's Death", glyph:"✦",
    accent:"#9db4ff", href:"stellar-forge/index.html", tag:"star physics",
    companion:{ name:"Firmament", glyph:"🌌" },
    district:"observatory", tier:2, wing:"stellar", footprint:"tower",
    blurb:"Where a dying star is weighed, not just watched. Put a stellar core on the scales and drag the brass collar to add mass: past Chandrasekhar (≈1.44 M☉) the electron floor snaps and the luminous body IMPLODES into a spinning neutron star; past TOV (≈2.2–2.3 M☉) the neutron floor snaps too and the horizon irises shut into a black hole. The body itself is the readout — it cools, implodes, or disappears — never a curve you read off an axis. Two ordered gates ⇒ three fates, proved exact by classify(M) with an always-neutron neg-control that fails both flips. A companion fusion-ladder bench works the other end of a star's life: it builds the elements up to iron and refuses to climb further." },

  { id:"breathing-star", room:"The Breathing Star", piece:"A Star You Can Squeeze", glyph:"✶",
    accent:"#9db4ff", href:"breathing-star/index.html", tag:"a star you squeeze",
    companion:{ name:"Stellar Forge", glyph:"✦" },
    district:"observatory", tier:2, wing:"stellar", footprint:"breathing-star", prefer:["right","bottom"],
    blurb:"Grab a star's glowing limb and SQUEEZE. A star is a standoff — gravity pulls every gram inward forever, and only pressure pushes back; where they cancel is the rest radius. Squeeze in and you over-stuff the pressure: it shoves back, overshoots, and the whole luminous body RINGS around its rest radius until the ringing damps and it settles right back where it started — the dashed rest-ring is the keystone that makes overshoot, settle, and the no-equilibrium collapse all legible with zero number-wall. Release while still moving for a struck-bell ring, slowly for a soft breath (one release path; only the velocity differs). The body itself is the readout — it brightens and bluens as it compresses, dims amber as it swells (Stefan-Boltzmann shown, not stated), with the interior mass shells drawn as faint concentric rings so the spring-of-shells is the body. Turn the brass fusion knob and it re-relaxes to a new rest radius (R ∝ K, the n=3/2 polytrope law, exact); the rest-ring animates over and the limb chases it. Or pull the DANGER toggle and cut the pressure entirely: the rest-ring dissolves, the disc reddens toward black, the shells crush in and never rebound — there is no equilibrium to breathe around. A reduced N=12-shell polytrope (γ=5/3): the balance, the stable ring-back, the monotone fuel dial, and the free-fall neg-control are proved EXACT by a Node twin + an in-page pill (the ringing envelope decays under the very dt the live page integrates with). Honest scope: dimensionless — not solar radii, not a Cepheid period. The living star to the Stellar Forge's dead one." },

  { id:"equal-area-sweep", room:"The Equal-Area Sweep", piece:"Kepler's 2nd Law in Your Hand", glyph:"◐",
    accent:"#9db4ff", href:"equal-area-sweep/index.html", tag:"drag the planet, sweep equal areas",
    companion:{ name:"Orrery", glyph:"🪐" }, skyStar:"equal-area-sweep",
    district:"observatory", tier:2, wing:"celestial-mechanics", footprint:"tower", prefer:["right","bottom"],
    blurb:"Grab the planet on one fixed ellipse — the Sun pinned visibly OFF-CENTRE at the focus — and drag it round; the brass arm joining Sun to planet sweeps a wedge, and you FEEL the planet race when it swings close to the Sun and crawl when it drifts far away. Let go and it glides one fixed tick of TIME at its real orbital speed, stamping the swept wedge both on the orbit and as a chip on a specimen rail below. Fire several around the orbit and the rail fills with wildly different silhouettes — a fat stubby wedge at perihelion, a long thin sliver at aphelion — every one carrying the SAME printed area to machine precision, an equals-rail '= = = =' and a live 'all N wedges equal, ε ≈ 1e-15' badge under them. A brass e-dial slides the orbit from a circle (e=0, boring equal pie-slices) up to a comet (e=0.85), the Sun visibly sliding toward perihelion as it stretches, the planet holding its place so nothing jumps. The soul is the falsifier: flip the toggle from ⏱ EQUAL TIME (the law) to ∠ EQUAL ANGLE (the cheat) and the SAME machinery makes the perihelion wedge balloon and the aphelion sliver starve — areas WILDLY unequal, the equals-rail flipping to an amber '≠ ≠ ≠' — so you SEE that only equal time gives equal area. The drawn wedge area is the exact closed-form focal-sector integral (b/2)(M₁−M₀); proved exact by an in-page self-test pill and a headless Node twin three independent ways (closed form, shoelace polygon, Simpson ½∫r²dθ), with r²·θ̇ = √(1−e²) constant around the orbit and the equal-angle cheat measurably failing. Honest scope: dimensionless — a is one orbit-unit, time is mean-anomaly turns not years; the law is exact, the units illustrative. Sibling to the Orrery, which wheels this very law for the real planets." },

  { id:"einstein-ring", room:"The Ring Made of One Star", piece:"Author an Einstein Ring by Hand", glyph:"◎",
    accent:"#9db4ff", href:"einstein-ring/index.html", tag:"line up the dark mass, close the ring",
    companion:{ name:"Equal-Area Sweep", glyph:"◐" },
    district:"observatory", tier:2, wing:"celestial-mechanics", footprint:"tower", prefer:["right","bottom"],
    blurb:"One ordinary background star, and a DARK MASS you cannot see floating in front of it — a thing that bends the light passing close to it. Grab the dark mass and drag it across the sky: the star's light SPLITS into two crescents, an outer one just beyond a dashed bullseye and an inner one just inside it on the opposite side. Slide the mass dead-centre in front of the star and the two crescents reach around, their tapered tips MEET across the bullseye, and they fuse into one complete bright RING — the Einstein ring, drawn by your own hand. Every photon you see is PLACED by the lens equation β = θ − θ_E²/θ, not painted: the two crescents sit at its two roots (θ₊ > θ_E outside, |θ₋| < θ_E inside), and as the offset β falls to zero a brightness readout climbs (formally to ∞ for a point source — a real ring has finite width) while a bonus row holds μ₊ + μ₋ = 1, light redistributed and never created. A mass dial fattens the ring (θ_E = √M — heavier lens, fatter ring); turn it to ZERO and the lens does nothing: the ring vanishes, one un-bent image, brightness ×1 — the negative control built into the same machinery. Proved exact by an in-page self-test pill and a headless Node twin: both images are exact roots of the lens equation to machine precision, β = 0 closes a full ring at ±θ_E, total brightness ≥ 1 everywhere, the signed magnifications sum to 1, and no mass ⇒ one image. Honest scope: a thin-lens point-mass in illustrative sky-units — NOT GR ray-tracing; the lens equation and its magnification are exact, the units illustrative. Sibling to the Equal-Area Sweep, the other touchable law in the observatory's celestial-mechanics wing." },

  { id:"transit", room:"The Transit", piece:"Find the Planet by the Star That Blinks", glyph:"🪐",
    accent:"#9db4ff", href:"transit/index.html", tag:"the planet you only see by the light it steals",
    companion:{ name:"First Light", glyph:"🌌" },
    district:"observatory", tier:1, wing:"exoplanets", footprint:"tower", prefer:["right","bottom"],
    blurb:"A dark planet you will NEVER SEE is about to cross the face of a glowing star — and you must find its size by the only evidence there is: the tiny dip in the star's light while it passes. Watch the whole luminous disc DIM as the silhouette slides across (the planet steals exactly the light its shadow covers); a hero brightness lamp sags and a light-curve trough draws the dip live underneath. Then take the brass vernier caliper and size your guess of the planet's radius against a ghost disc on the star — lock it in, and the gold truth disc reveals over your guess so the size error is SEEN, scored, with a streak multiplier carrying across rounds. The crux is the dip's depth: for a full transit it is exactly the SQUARE of the radius ratio, depth = (R_p/R_*)², so ρ = √depth. But a GRAZE is the trap the geometry sets — when the planet only clips the limb the dip is shallow with NO flat bottom (a pointed V, not a tub), and √depth LIES, under-reporting the size; a flat-bottom badge driven by the same geometry warns you when √depth is honest and when it isn't, so you learn to hunt the radius, not the naive square-root. A sandbox lets you drag a known planet and watch its curve before the competitive hunt. The whole thing is a single lens-overlap primitive: depth, flat-bottom width, contact width, and the full/graze label all fall out of one area-of-two-discs function, proved EXACT by a Node twin + in-page pill — full-transit depth = ρ² to machine precision, the graze dip strictly shallower with no flat bottom, the lens area re-derived a second way by numerical integration (and a third by Monte-Carlo darts), a zero-dip neg-control when the planet misses, and the caliper depth↔radius round-trip exact. Honest scope: dimensionless, a uniform disc — the limb-darkened glow is depicted for beauty, not modelled, and no scored number leans on it; the lamp's swing is amplified ×25 for drama but the % readout and the curve show true values. The exoplanet hunt to First Light's expanding sky — the same observatory, the same trick of reading a body you cannot resolve from the light it changes." },

  { id:"vantage", room:"The Vantage", piece:"Cor Caeli · the Heart of the Vault", glyph:"✶",
    accent:"#9db4ff", href:"vantage/index.html", tag:"a scene you walk into",
    companion:{ name:"Firmament", glyph:"🌌" },
    district:"observatory", tier:1, wing:"vantages", footprint:"tower", prefer:"top",
    blurb:"The first SCENE YOU WALK INTO: forty gold line-fragments hang in 3-D as meaningless debris from every angle, but ONE earned camera pose un-scrambles them into a five-point star. Drag to orbit, scroll (or pinch) to dolly in and out — the whole field warms cool-blue → gold and the shards tighten as you near the vantage, the only feedback an UNDISPLAYED residual gives you. Find it and the dashes gild into one clean star and the place names itself: Cor Caeli, the Heart of the Vault. The star is not searched-for but BUILT by back-projection, so r(C*)=Σ‖π(C*,Pᵢ)−Tᵢ‖²=0 is an algebraic identity (measured 8e-17), not a fit; perturb any single camera axis — yaw, pitch, or the intrinsically-softer dolly — and a calibrated per-axis threshold says you have left the pose, while a random cloud of fragments admits no vantage at all over 18432 trial poses. Reveal the back-projection rays to see WHY they align there and nowhere else: each fragment sits on the sky-blue pencil from the construction eye through its star-point. A 2-rotation camera (no roll), proved by a Node twin and an in-page pill. Opens the navigable-scene medium; sibling to Firmament, the sky it finds a star inside." },

  { id:"relativity", room:"The Moving Frame", piece:"The Twin Voyage", glyph:"⏱",
    accent:"#9db4ff", href:"relativity/index.html", tag:"the fare a clock pays to travel",
    companion:{ name:"Light Clock", glyph:"🛰️" },
    district:"observatory", tier:1, wing:"moving-frame", footprint:"tower", prefer:"right",
    blurb:"Fly the rail and your clock pays the fare. Two clocks touch at the platform; one stays home, you take the other and push a brass throttle toward c, coast, slam the TURN, and dock again — and your face reads LESS than home's. The gap is no trick: it is the literal AREA of the √(1−β²) band you draw live below the rail, because your proper time is the integral τ=∫√(1−β(t)²)dt over the whole flight. The twin 'paradox' is shown to be a THEOREM, not a trick — a faster or longer detour ALWAYS costs strictly more time, monotone, and a one-tap A/B comparator stores two voyages and narrates which shape of β(t) aged you less and by how much. Two diegetic instrument switches are honest falsifiers that must FAIL to lag: a coordinate clock that ignores β (τ≡t, never lags) and a never-leave-home pin (τ=t exactly, no dilation at rest). The shared Lorentz core is the estate's single source of truth — the same √(1−β²) the Light Clock draws as its slanted photon path, the same boost that holds the interval s²=(ct)²−x² invariant — proved by a Node twin and an in-page pill (the boost guard included), and byte-twinned across both pages so the two can never drift. Sibling to the Light Clock and The Hours: one geometry, five windows on it." },

  { id:"first-light", room:"First Light", piece:"The Patch With No Middle", glyph:"🌌",
    accent:"#9db4ff", href:"first-light/index.html", tag:"the universe with no centre",
    companion:{ name:"Stellar Forge", glyph:"✦" },
    district:"observatory", tier:1, wing:"cosmology", footprint:"tower", prefer:["left","bottom"],
    blurb:"Grab the brass a-collar and pull, and the whole sky-knit dilates — galaxies are buttons on a stretching fabric, never particles flying through space. The motion IS the metric growing: proper position = a·comoving, so the recession velocity falls out as a theorem, v = ȧ·Δcomoving = H·d, exactly linear and the farther galaxy always faster. The soul is the no-centre hunt: CLICK ANY GALAXY TO RIDE IT and the field re-pins to that seat — and looks identical, an isotropic v∝d outflow from every vantage, the isotropy rose staying centred and the goal '🎯 centre found when the rose is symmetric' satisfied at every seat. That sameness, FELT by re-pinning, IS the proof that no seat is the middle. Two honest neg-controls break in your hands: flip the FIXED-CENTRE CHEAT and galaxies fly from one origin in a fixed space — innocent at the centre, but re-anchor off-centre and a near-side galaxy turns around to APPROACH you (impossible under real expansion), v stops tracking d, and the rose pegs (if you can find the centre, you're in a cheat); a side-by-side true|cheat dial measures the difference on screen at a fixed off-centre seat, one calm, one pegged. FREEZE THE METRIC and a launched photon arrives UNSHIFTED, 1+z=1 exactly — proof the colour-slide white→amber→deep-red→dark is the ruler growing, not the source receding, with NO Doppler term anywhere (the axis that sets it apart from the estate's kinematic Doppler pieces). The redshift is watched, not plotted: crests spread because they're pinned to the metric, 1+z = a_now/a_then, and a temperature strip cools as T∝1/a (T·a invariant). A Node twin + in-page pill prove all four split claims exact: 1+z=a-ratio to <1e-9 with the drawn crest-spacing the SAME number, homogeneity (re-anchor on every vantage recovers the same H, R²=1, anisotropy<1e-9), T·a invariant, and the fixed-centre control measurably violating v∝d off-centre while truth stays perfect. Mints the cosmology wing; sibling to the Stellar Forge — the same sky, one star's death against the whole universe's birth." },

  { id:"holonomy", room:"The Holonomy Walk", piece:"The Holonomy Walk", glyph:"🧭",
    accent:"#caa15a", href:"holonomy/index.html", tag:"the twist you can't survey away",
    companion:{ name:"Planimeter", glyph:"📐" }, skyStar:"holonomy",
    district:"grounds", tier:1, wing:"curved-country", footprint:"hall", prefer:["left","bottom"],
    blurb:"Carry a gold spear around a loop on a court you can BEND — and it comes home pointing wrong. There is no vehicle: YOUR FINGERTIP is the parallel-transported vector. Pick the spear off the surveyor's geodesy net and drag any freehand path; at every micro-step the engine applies the curved metric's Levi-Civita connection, so the spear visibly rotates even though your hand never twisted it — a frozen slate ghost-north riding alongside keeps the gap legible. Close the loop and a brass protractor blooms with the leftover angle Δθ — and that leftover IS the curvature you enclosed, ∬K dA (Gauss-Bonnet, shown not stated). A knurled curvature dial bends K from sphere → flat → saddle and the mesh breathes; at the flat DETENT it clicks and the run goes boring on purpose — Δθ = 0 for any loop, navigation Euclidean. A figure-eight's opposite-sign lobes cancel to zero; two grains dragged north kiss on the dome and flee on the saddle. Founds CURVED COUNTRY; self-proved by a Node twin + an in-page pill; kin to the Planimeter (area from a boundary)." },

  { id:"aerodrome", room:"The Aerodrome", piece:"The Launch Rail", glyph:"🚀",
    accent:"#cdd6e0", href:"aerodrome/index.html", tag:"flight you cause, not a curve you read",
    companion:{ name:"Orrery", glyph:"🪐" }, skyStar:"aerodrome",
    district:"grounds", tier:1, wing:"aerospace", footprint:"launch-rail", prefer:"top",
    blurb:"Kick the conic — the one orbit room where you PUSH OFF and author the path with your hand. Grab the ship and a brass thrust-rosette blooms: drag a handle for an instantaneous Δv (clamped to the propellant you have), release, and the live conic recomputes from the new state vector while a cyan ghost of the old orbit lingers. Prograde balloons the far side; retrograde collapses it (over-do it → reentry bloom); radial thrust ROTATES the apse line instead of growing it. Push past the warm escape wall and the ellipse springs open into a hyperbola that never returns. The drawn conic is the exact analytic solution; the moving craft is the integrated state — riding together, both the beauty and the proof. Three claims self-proved live: Tsiolkovsky Δv = vₑ·ln(m₀/mf) to machine ε, specific energy conserved < 1e-9 over the coast (a leaky integrator fails the same test), and escape exactly at v = √(2μ/r). Sibling to the Orrery, which wheels the orbits the universe already chose." },

  { id:"hall-of-mirrors", room:"The Hall of Mirrors", piece:"The Hall of Mirrors", glyph:"🪞",
    accent:"#8fd9ff", href:"hall-of-mirrors/index.html", tag:"optics wing",
    companion:null,
    district:"grounds", tier:1, wing:"optics", footprint:"hall", prefer:"bottom",
    blurb:"A luminous wing for all things light — how it bends and reflects, splits into colour, and what it is up close. A telescope and a spectroscope, a rainbow drawn from one raindrop, an anamorphic mirror, a polariser, iridescent films, and the optical light-bench — each self-proved." },

  { id:"refraction-run", room:"The Photon's Errand", piece:"The Photon's Errand", glyph:"🔦",
    accent:"#8fd9ff", href:"refraction-run/index.html", tag:"fall into Snell by flying least-time",
    companion:{ name:"Hall of Mirrors", glyph:"🪞" },
    skyStar:"refraction-run",
    district:"grounds", tier:1, wing:"optics", footprint:"tank", prefer:["bottom","right"],
    blurb:"You ARE the photon. Pilot a brass camera-probe out of an emitter and steer it BY HAND, in real time, down through a glass tank of horizontal strata — air, water, flint, and a graded block whose index rises with depth — toward a hidden gold focus across the tank. A mounted optical-path gauge climbs as you fly, reading the running ∫n·ds; most dives bleed it red. There is exactly ONE arriving flight that also leaves the gauge stationary: fly it and every interface snaps to obey n₁sinθ₁=n₂sinθ₂ at once, the strata gild amber→white, and LEAST TIME engraves. You fell into Snell; you didn't memorise it. The graded block's payoff is a smooth CURVE a flat slab-stack can never show — the eikonal bend, n(y)·sinθ held constant down the column. Twist the knurled index dial so every n→1 and the optimal ray straightens, the gold target tick walks to the straight-shot length, and the errand goes dead boring exactly when the optics go trivial — the negative control, made tactile. The first real-time fly-THROUGH on the grounds: its camera reuses The Vantage's proven projection unforked, and a Node twin proves the conditional math exact — Snell at every interface to 1e-9, the Fermat path a true stationary point of ∫n·ds, the eikonal invariant machine-flat. Kin to the Hall of Mirrors; honest foil to The Lifeguard's Run, where the same least-time law is found by hand on a flat 2-D map." },

  { id:"numbers-room", room:"The Numbers Room", piece:"The Numbers Room", glyph:"🌳",
    accent:"#c9a24a", href:"numbers-room/index.html", tag:"number-theory wing",
    companion:null,
    district:"grounds", tier:2, wing:"number", footprint:"numbers-room", prefer:["bottom","top","right"],
    blurb:"The estate's number-theory wing — arithmetic made a place you can walk. Thirteen benches where the plain counting numbers turn out to have a shape: descend the Stern–Brocot tree to the best fraction, watch the primes line up on the diagonals of a spiral, trace the tree every number falls down to 1, draw a cardioid out of the times table, cut two rods down to the rod that measures them both, count a sunflower's spiral arms to read off two Fibonacci numbers, take stones from heaps where the XOR rule decides who wins, and slide a lone queen home where her safe squares trace two lines climbing at the golden ratio. Twelve prove a theorem exactly; one states the question mathematics cannot yet answer — and is honest about which is which." },

  { id:"collisions", room:"The Clack Counter", piece:"The Clack Counter", glyph:"🎱",
    accent:"#e8b86b", href:"collisions/index.html", tag:"π in collisions",
    companion:null,
    district:"grounds", tier:2, wing:"number", footprint:"numbers-room", prefer:["right","top","bottom"],
    blurb:"A frictionless lane, a heavy block, a light block, a wall — and π hiding in the noise. Shove the heavy block and COUNT every clack (block-on-block + block-on-wall) until everything drifts apart forever: at a mass ratio of 100, then 10,000, then a million to one, the tally locks on 31, 314, 3141 — the digits of π, spelled in collisions. The count IS the hero: a big brass counter ticks up while real pitched clacks fire (a warm wooden knock for block-on-block, a bright metallic tick at the wall), then it locks green and reads off π ≈ 3.14… The burst is too fast to see, so crank slow-mo and step one clack at a time. A toggle opens the energy-circle 'why π?' wedge — the rays pack a fixed angle θ=atan√(m/M) apart, and ⌈π/θ⌉−1 of them fit. Kin to the Numbers Room: another place where π falls out of plain counting. Self-proved exact — closed form == velocity count == the event-driven engine the animation replays." },

  { id:"benford-mill", room:"The Benford Mill", piece:"The Benford Mill", glyph:"⚙️",
    accent:"#c9a24a", href:"benford-mill/index.html", tag:"why a 1 leads 30% of the time",
    companion:null,
    district:"grounds", tier:2, wing:"number", footprint:"benford-mill", prefer:["bottom","right"],
    blurb:"A hand-cranked brass mill where Benford's law is dropped, not asserted. Pour in grains flat across one decade and turn the crank: each pass MULTIPLIES every grain by a random factor, and nine glass bins fill into the descending gold log₁₀(1+1/d) staircase — a 1 leads ~30% of the time, a 9 barely 5%. A grabbable LOG-WHEEL shows WHY: each grain sits at its mantissa frac(log₁₀ x) on a circular log scale, the dots smear uniformly as you crank, and the arc each digit subtends IS its Benford height — the staircase is the wheel's shadow. Throw the MULTIPLY⇄ADD knife-switch and the magic dies on purpose: additive milling collapses the bins onto digit 8, the gold curve stops fitting, χ² goes red, the dots clump. Deterministic, fixed-seed, self-proved: the closed form sums to 1 and matches log₁₀ to machine-ε exactly; the milled bins do not reject Benford within χ²; the mantissa passes a uniformity test. Kin to the Slipstick, whose C/D scale IS this very log-wheel." },

  { id:"hexapawn", room:"The Matchbox That Learns", piece:"The Matchbox That Learns", glyph:"♟️",
    accent:"#c9a24a", href:"hexapawn/index.html", tag:"a pile of beads that teaches itself",
    companion:null,
    district:"grounds", tier:2, wing:"number", footprint:"hexapawn", prefer:["bottom","right"],
    blurb:"A machine with no strategy — just matchboxes of coloured beads — that teaches itself to stop losing, in front of you. Play Hexapawn (three pawns a side on a 3×3 board: push forward, capture diagonally, reach the far rank to win). The machine is the second player; every position it meets gets a little open-faced tray of beads, one per legal reply, and it moves by drawing a bead at random. When it loses, it throws that game's beads away — and you watch its trays drain, a discard trough fill, and the boxes nearest its opening 'resign' to dimmed husks. Beat it a few times, then try to win again: the win-streak meter climbs, then CRACKS the first match it refuses to lose — the rack has hardened. It is no fluke that you can no longer win: Hexapawn is a proven second-player win (mate in 6), and the discard rule shrinks its forced-losing lines 17→0 in fifteen monotone steps to the minimax-optimal subset — the green pill runs that proof live. Flip the 'reward the loss' knife-switch and the same trainer with the sign flipped diverges: the losing lines bloat and the machine never stops losing. The win tally is an honest live stat, never the proof. Kin to The Adversary (play the same solved game against perfect play) and the Numbers Room's stone heaps." },

  { id:"quiet-room", room:"The Quiet Room", piece:"The Quiet Room", glyph:"💡",
    accent:"#8fb6ff", href:"quiet-room/index.html", tag:"two darks no presses can reach",
    companion:{ name:"The Fifteen", glyph:"⬚" },
    district:"grounds", tier:2, wing:"number", footprint:"quiet-room", prefer:["bottom","right"],
    blurb:"A 5×5 brass Lights-Out panel where the lamps are a vector space over GF(2) — tap one and it flips itself plus its four orthogonal neighbours, and leaving the room dark to win is solving one linear system, no search. Pressing cell c adds (XOR) a column of the 25×25 toggle matrix A, so order never matters and pressing twice undoes itself; a board is SOLVABLE iff it is orthogonal to A's left-nullspace — the kernel. For the 5×5 that kernel has dimension 2: two QUIET PATTERNS with A·Q = 0, so pressing every lamp of either leaves the panel byte-identical — the only two moves the lamps can never see — and 2²³ of the 2²⁵ boards are solvable, the rest provably impossible. A rotary DEAL knob only ever deals provably-solvable boards; a SOLVE pull-lever lights the minimal press-set in gold and plays it out to dark, but JAMS red on a lone-lamp impossible deal (no press-set exists). Two negative controls fire red: hand-paint a lamp and the provenance meter reds though the board may still be reachable; deal an impossible one and SOLVE refuses. Self-proved exact: A·solution===deal byte-exact, double-press===identity, kernel dim 2 computed not hard-coded, solvable iff ⟂ every kernel vector. Kin to The Fifteen, where solvability is also a parity invariant — the same idea one dimension up over GF(2)." },

  { id:"the-coin-that-lies", room:"The Coin That Lies", piece:"The Coin That Lies", glyph:"⚖",
    accent:"#c9a24a", href:"the-coin-that-lies/index.html", tag:"12 coins, one fake, three weighings",
    companion:{ name:"The Source Dial", glyph:"📻" },
    district:"grounds", tier:2, wing:"number", footprint:"coin-balance", prefer:["bottom","right"],
    blurb:"A touchable brass two-pan balance over the classic puzzle: twelve coins, exactly one counterfeit — light or heavy, you don't know which — found in three weighings and no fewer. The soul is TERNARY SEARCH: a balance gives three answers (left down, level, right down), so each weighing is one question with three answers, and W of them tell apart at most 3^W cases. There are 24 cases (12 coins × light/heavy), and since 3² = 9 < 24 ≤ 27 = 3³, the information floor is ⌈log₃24⌉ = 3 — and a real depth-3 schedule, built and verified leaf-by-leaf in the core, actually reaches it. Drag coins onto the pans, pull the brass RELEASE to commit a weighing (the beam settles on a critically-damped spring reading a −/0/+ plumb arc), and watch the rack FAN into three lanes {left-lighter, balance, left-heavier} = core.partition — the two inconsistent lanes tarnish and slide off, the surviving third reflows, a ●●● pip advances. PLANT a fake (by index + light/heavy, or random-hidden) or RUN THE OPTIMAL SCHEDULE to watch the rack collapse to one coin hands-off. The seal lights gold — NO FEWER WAS POSSIBLE, ⌈log₃24⌉ = 3 — the instant one suspect remains at depth ≤ 3; two knife-switches break it red: a two-way balance is a bit not a trit (⌈log₂24⌉ = 5 > 3), and a 13th coin leaves a best-first branch of 10 > 9 (solvableIn(13,3) = false). Self-proved exact: each weighing splits disjoint+total, 3^W reach, the ⌈log₃24⌉ = 3 floor, and a depth-3 schedule covering all 24 leaves. Kin to The Source Dial — there symbols pack into bits (log₂); here a question with three answers (log₃)." },

  { id:"belief-beam", room:"The Belief Beam", piece:"The Belief Beam", glyph:"⚗️",
    accent:"#6fd3c4", href:"belief-beam/index.html", tag:"belief is a conserved liquid",
    companion:{ name:"The Galton Board", glyph:"🎲" }, skyStar:"belief-beam",
    district:"grounds", tier:2, wing:"number", footprint:"belief-beam", prefer:["bottom","right"],
    blurb:"A brass-and-glass apparatus where Bayes is poured, not plotted: belief is a CONSERVED LIQUID flowing between three glass vials. A frosted HIDDEN SOURCE urn pours you coloured beads; the level in each vial is your probability that the source is the mostly-red urn A, the balanced B, or the mostly-blue C — and because a posterior is a probability, the three menisci ALWAYS sum to one full beam, a gold Σ = 1 rule across the tops. Press DRAW and watch belief pour sideways (one shared eased u interpolates levels→posterior, so Σ(render)=1 for every frame algebraically — mass moves, never appears). A brass rail below reads the pairwise log-odds in NATS, and each bead slides its jeweled bead by a FIXED step ln(L_ic/L_jc), leaving a ghost-trail tick — so the slides simply ADD and the ORDER of the evidence cannot matter: every drawn bead becomes a draggable card; shuffle them, hit ↻ REPLAY, and belief lands BIT-IDENTICAL (|Δ| < 1e-12, an 'identical ✓' seal), because the posterior is derived from the per-colour tally — a sufficient statistic — never from order-dependent float products. A real GRAY bead (equal in every urn) is a touchable no-op: it moves nothing, bit-exactly. Two knife-switches break the law visibly: SKIP RENORMALIZATION and Σ drifts off 1 (the menisci no longer reach the rule, a red Σ ✕ badge — belief is not a probability); count CORRELATED evidence as INDEPENDENT and the log-odds doubles, the bead RUNNING OFF THE RAIL past its true bound. Self-proved exact (a Node twin + an in-page pill): Σ = 1 to 1e-12 every step, additive + order-free over all 120 permutations of a 5-bead list (strict bit-identity), the equal-likelihood no-op bit-exact, and BOTH negative controls fire red. The inverse of The Galton Board next door — there a FIXED law samples a fixed bell; here the evidence updates WHICH law you believe." },

  { id:"physics-lab", room:"The Cavern", piece:"The Cavern", glyph:"⚛️",
    accent:"#7fd4c0", href:"cavern/index.html", tag:"physics wing",
    companion:null,
    district:"cavern", tier:1, footprint:"cave", prefer:"top",
    blurb:"The estate's physics laboratory, quarried into the hillside and kept underground — dangerous experiments quarantined for safety. Two drifts off the central shaft: a Newtonian one (cradles, orbits, the fastest descent) and an Einsteinian one (light-clocks, bending light, a creeping perihelion). Each bench proves its physics exact." },

  { id:"daedalus", room:"The Hedge Maze", piece:"Daedalus", glyph:"🌀",

  { id:"arcade", room:"The Arcade", piece:"Arcade", glyph:"🕹️",

  { id:"puzzle-pavilion", room:"The Puzzle Pavilion", piece:"The Puzzle Pavilion", glyph:"🧩",
    accent:"#6fd3c4", href:"puzzle-pavilion/index.html", tag:"deduction puzzles", companion:null,
    district:"grounds", tier:1, wing:"amusements", footprint:"pavilion", order:15, prefer:"top",
    blurb:"A gallery of generated deduction puzzles — each board proven UNIQUE and solvable by pure logic, never a guess. All three leaves in flower, each a different verb: The Bridge House (connect — drag spans until a numbered archipelago fuses into one network), The Cross-Sums (fill — place 1–9 so every run sums to its clue), and The Pearl Loop (draw — lay one closed loop the scattered pearls pin to a single shape)." },

  { id:"spinning-chair", room:"The Spinning Chair", piece:"Pull Your Arms In, Spin Faster", glyph:"💺",
    accent:"#e0a93a", href:"spinning-chair/index.html", tag:"L = Iω, conserved",
    companion:null,
    district:"grounds", tier:1, wing:"amusements", footprint:"pavilion", order:18, prefer:["bottom","se"],
    blurb:"A figure skater spins on one blade on a free, frictionless pivot, arms flung wide with a brass weight in each hand — already turning when you arrive. Pull her arms in and she speeds up, drawn as a motion-blur fan that shrinks in reach AND widens into a whirring disc at once: no one added spin, the momentum she already had simply had nowhere to go. The whole trick is one conserved number — angular momentum L = I·ω stays pinned, so shrinking the moment of inertia I forces the spin ω up by exactly the inverse ratio. A brass instrument rail reads it live: a dead-flat pinned-L bar (nothing was added), a rising kinetic-energy fill labelled where it came from (your arms' work against the weights' fling), and a plate confirming ω(B)/ω(A) === I(A)/I(B) to a part in a billion. The load-bearing neg-control bolts the pivot to a motor that drives a fixed ω — now the slider does nothing AND the once-pinned L bar swings free, teaching why the free pivot matters by taking it away. A green self-test proves L conserved across the full pull, the spin-up ratio exact, the energy rise equal to the integrated arm-work, and the clamp inverting it all. Next door to The Rotor — another spin that does something to a rider, by a different law." },

  { id:"warren", room:"The Warren", piece:"The Warren", glyph:"▦",
    accent:"#7fd4c0", href:"warren/the-crossing.html", tag:"the second game engine",
    companion:null,
    district:"grounds", tier:1, wing:"amusements", footprint:"warren", order:25, prefer:["bottom","right","se"],
    blurb:"The estate's SECOND game engine — where the Arcade is twitch and the Adversary is perfect play, the Warren's verb is WHERE YOU STAND. On a discrete grid you take turns with a deterministic monster: you act, then it steps once by its fixed rule, and stillness is a first-class move — hold at the mouth of the corridor and cross on the beat its back is turned. The Crossing is the first floor; a patrol walks a longer beat than you can see, vanishing off-stage behind the wall, and the shortest survivable line spends four teaching waits. Every floor is a finite game tree, so before it ships a headless BFS PROVES it survivable AND softlock-free (no reachable live state can ever get stranded), and a load-bearing negative control — a sentry that tiles the only crossing — is proved UNSURVIVABLE, confirming the solver discriminates rather than rubber-stamps. A green pill mirrors the proof in the page; let the solver walk it from wherever you stand." },

  { id:"midway", room:"The Midway", piece:"The Midway", glyph:"🎢",
    accent:"#e0a93a", href:"midway/index.html", tag:"physics you ride",
    companion:{ name:"The Coaster", glyph:"🎢" },
    district:"grounds", tier:1, wing:"amusements", footprint:"coaster", order:5, prefer:["top","ne"],
    blurb:"A brass fairground at dusk where every ride is a real instrument you operate and a body you sit inside — physics you ride, not chart. The lit flagship is The Coaster · The Loop You Dare to Shape: you shape a side-view rail from a hoist tower, a valley, and a vertical loop whose radius you drag, then pull the release lever and the bead runs YOUR track under gravity alone. It either whips over the top or peels off the rail and falls — and the split is one number that is pure geometry: a loop survives only when you drop from at least 2½ loop-radii up. A live energy column shows PE pour into KE and back while the conserved total never moves; a real rail-force needle reads N(θ)=mv²/r+mg·cosθ, stays green while the rail can push, and pegs to a red zero-stop the instant the car detaches — at which point it becomes a free projectile, not a renderer cheating it round. The math self-test proves energy conserved to <1e-9, the survival threshold h≥2.5r derived not asserted, the exact detach angle cosθ_d=−⅔(h/r−1), and a load-bearing negative control: an always-completes renderer that ignores the normal force provably FAILS. The Loop (a rider's-frame cockpit) and The Rotor are reserved stalls." },

  { id:"the-shepherd", room:"The Arcade · The Fold", piece:"The Shepherd", glyph:"🐑",
    accent:"#c9a24a", href:"the-shepherd/index.html", tag:"herd a living flock",
    companion:null,
    district:"grounds", tier:1, wing:"amusements", footprint:"fold", order:30, prefer:["bottom","se"],
    blurb:"You cannot push a flock — you can only choose where your dog stands. A scatter of sheep run on the three Reynolds boids rules (keep apart, fly together, match the flock) and additionally FLEE one shepherd point: a working dog you steer, which has weight and a top speed and chases your cursor on a critically-damped spring. Drive every sheep through the gate into the brass fold before the glass runs out, across a three-round arc — an open pasture, a wall with a single gap to thread, and a detached cluster of strays to re-merge first. Underneath the game runs a quiet decidable conscience: a hard-floor separation barrier guarantees min pairwise sheep-separation NEVER reaches 0 (no two sheep ever overlap — proven by an unconditionally-stable positional projection that a per-step speed clamp forbids any sheep tunnelling past), and WIN latches EXACTLY iff every sheep is inside the fold polygon (a robust concave-safe point-in-polygon, no timer race, no close-enough). A live pill mirrors both claims; flip the Separation toggle OFF and the neg-control collapses the whole flock to a point on screen, the pill diving red — proving separation is what keeps them a herd. The same three rules, passive, breathe the murmuration in the Strange Garden's Boids; here you steer them into a pen." },

  { id:"murmuration-meter", room:"The Gardens · The Flocking Field", piece:"The Murmuration Meter", glyph:"🐦",
    accent:"#6fd0ff", href:"murmuration-meter/index.html", tag:"φ = |Σ v̂|/N",
    companion:{ name:"The Shepherd", glyph:"🐑" },
    district:"grounds", tier:1, wing:"amusements", footprint:"flock", order:32, prefer:["bottom","sw"],
    blurb:"A flock has no leader and no plan — just birds, each turning to match the average heading of the neighbours it can see, plus a little jitter. One noise dial η is the whole instrument: turn it up and watch the single mind come apart. At η=0 the 300 birds fly as one cold-blue sheet (the order φ = |Σ v̂|/N pinned at 1, one mind); twist the dial and the kick begins to drown the copying — the sheet warms and scatters, the hero φ needle drops, and somewhere in the middle it tips into a milling crowd whose order sits on the 1/√N floor. The place it tips is a SOFT crossover — it slides with how many birds there are and how densely they are packed — so you find it by hand on the dial; we never paint a precise η_c on the wall. The honest test makes the birds BLIND (each ignores its neighbours) and no amount of low noise can order them: the order is the copying, not the motion. The self-test proves only what is exact — φ is rotation-blind to the bit, the two ends anchor (η=0 ⇒ φ→1; η=2π ⇒ φ·√N is O(1) at two flock sizes — the floor is a law, not a point), and φ(η) only ever falls as noise rises — single-sourced to core.mjs and byte-twinned into the page. The same boids rules breathe the Strange Garden's Boids; The Shepherd lets you steer them into a pen; here a meter reads how much one mind they still share." },

  { id:"engine-room", room:"The Engine Room", piece:"The Engine Room", glyph:"♨️",
    accent:"#d9a441", href:"engine-room/index.html", tag:"thermodynamics wing",
    companion:null,
    district:"grounds", tier:2, wing:"works", footprint:"engine", order:10, prefer:"top",
    blurb:"The estate's power house, at the working edge of the grounds — where heat is turned into work and the great flywheel never gives back quite all you put in. A wing for thermodynamics: operate a Carnot engine on coupled P–V and T–S diagrams and watch its efficiency rise toward a wall it can never cross, η = 1 − T_c/T_h. Each bench proves its own physics exact." },

  { id:"alchemy", room:"The Alchemy Lab", piece:"The Alchemy Lab", glyph:"⚗️",
    accent:"#dca74a", href:"alchemy/index.html", tag:"chemistry wing",
    companion:null,
    district:"grounds", tier:2, wing:"works", footprint:"laboratory", order:20, prefer:["right","top","ne"],
    blurb:"The estate's first chemistry wing, set on the bench-ground just north of the Cavern — the atoms the physics drift takes apart are the ones you put back together here. A wall of hanging balances: the Reaction Balancer reads the whole-number coefficients of a reaction straight off the nullspace of its element-count matrix — no guessing — and tips a two-pan scale level only when every element tallies equal on both sides; Titration pours NaOH into HCl drop by drop and roots the equivalence pH from charge balance, exact, so the flask flips pink a hair past pH 7; the Limiting Reagent runs a pan dry at ξ = min(nᵢ/cᵢ); Le Chatelier's Vise seals a reversible reaction in a glass cylinder you shove, watching it re-settle toward fewer gas molecules until Q ≡ K; and the Aufbau Staircase lets you climb the n + ℓ ladder and watch the periodic table be born one electron at a time, periods sealing at the noble gases {2, 10, 18, 36}. Five balances hang lit and level, with no empty cradle left waiting." },

  { id:"iron-filings", room:"The Lodestone Plate", piece:"Iron Filings", glyph:"🧲",
    accent:"#8fb6ff", href:"iron-filings/index.html", tag:"magnetic field plate",
    companion:null,
    district:"grounds", tier:2, footprint:"iron-filings", prefer:["right","bottom"],
    blurb:"A dark plate where a magnetic field becomes visible — drag bar-magnets across it and thousands of iron filings snap live into the field lines, threading pole to pole, fountaining from a lone north into the dark. Flip a pole and the whole texture re-knits. Set two like poles facing and hunt with your cursor for the saddle null — the one spot the field is zero and the filings have nowhere to point. Every line is an honest RK4 streamline of the exact superposed dipole field; the self-test proves ∇·B=0 everywhere — no line ever crosses or dies in mid-air — and a fictitious monopole turned on as a control makes the test go red." },

  { id:"lodestone-hall", room:"The Lodestone Hall", piece:"The Lodestone Hall", glyph:"🧲",
    accent:"#7fd4ff", href:"lodestone-hall/index.html", tag:"the current you make by MOVING",
    companion:{ name:"Iron Filings", glyph:"🧲" },
    skyStar:"lodestone-hall",
    district:"grounds", tier:1, wing:"induction", footprint:"coil", prefer:["right","bottom"],
    blurb:"The estate's first electromagnetism wing — and there is no battery anywhere. The only current here is the one you make by MOVING. A fixed brass coil sits edge-on, drawn as a narrow mouth; you grab a bar magnet and drag it through, trailing its full live dipole field-line portrait. Shove it IN and the lines crowd the gap, a flux-counter climbs, and the galvanometer needle kicks one way; pull it OUT and the lines peel away, the counter drops, and the needle kicks the OTHER way — the sign flip IS the lesson about dΦ/dt. Hold the magnet DEAD STILL inside and the picture turns: the lines stay dense, the counter pinned high, but the needle dies and the wire goes dark — it is the CHANGE in the flux, not the flux, that makes the current. Swap the rail for a hand-crank and the magnet spins past the mouth as an alternator: the needle swings ± in step with how fast you turn, and doubling the crank rate exactly doubles the peak — every power plant on Earth is this turbine. Feel the drag: a back-force pushes against your every motion, and two energy bars show the bargain — mechanical work in equals electrical energy out, the drag you feel IS the electricity. Flip the Lenz cheat and the coil starts to PULL the magnet in; a red FREE ENERGY banner fires and the bars run away, proving Lenz's law is just energy conservation wearing a magnet. The sole flux/EMF authority is a self-tested core: EMF = −dΦ/dt to 1e-9 over a position and angle sweep, peak EMF linear in crank rate, a closed round trip transporting zero charge, the static field-line portrait reused unforked from Iron Filings — its kin, the same dipole held still. Founds an EM vein whose next benches are obvious: an LC tank, a transformer, an eddy brake, a betatron." },

  { id:"bootstrap-bench", room:"The Bootstrap Bench", piece:"The Wave That Carries Itself", glyph:"〜",
    accent:"#7fd4ff", href:"bootstrap-bench/index.html", tag:"the wave that carries itself",
    companion:{ name:"The Lodestone Hall", glyph:"🧲" },
    skyStar:"bootstrap-bench",
    district:"grounds", tier:2, wing:"induction", footprint:"bootstrap-bench", prefer:["right","bottom"],
    blurb:"The induction wing's capstone — the field that finally let go of the magnet and walked off on its own. The Lodestone Hall taught that a CHANGING field makes the other; here that lesson runs away with itself. You look side-on down a long dark run of empty space — no wire, no spring, no medium drawn. Grab the fat handle at the left edge and drag it UP: a charge meter fills, the handle glows hotter (you are loading ½ε₀E²). Let go and a single self-sustaining pulse PEELS OFF and rolls right on its own, holding its shape, a bright spark sprinting at its head and dead-flat dark space ahead. That spark is the relay made literal: it alternates cyan (a rising E here is birthing B just ahead) then copper (that rising B is birthing E one cell further), advancing one grid cell per beat — the leapfrog's two half-updates as a two-beat heartbeat, its brightness bound to the core's real curl-source magnitude so the bloom is honest to the numerics, not a timer. Two speed-posts straddle the run; the front trips post A then post B and a stopwatch reads the measured front-speed beside the dialed c = 1/√(μ₀ε₀). Turn either of the vacuum's two knobs — μ₀ (how reluctantly B answers a changing E), ε₀ (how reluctantly E answers a changing B) — and the pulse visibly speeds or slows; a labelled detent doubles ε₀ and drops c to exactly 1/√2, a ghost marker of the old front showing you've fallen behind. Throw the FREEZE-THE-CURL toggle mid-flight and the copper half-beat goes dark, B stops being re-sourced, and the pulse slumps in place — proof it's the mutual coupling carrying it, not a scripted shape. Try to set c by hand past the Courant limit and the self-test fires red: you cannot outrun the vacuum, and the sim blows into grid noise. The sole physics authority is a self-tested 1-D FDTD/Yee core: energy conserved to machine-ε over thousands of symplectic leapfrog steps, the measured front speed = 1/√(μ₀ε₀) over a sweep of both constants, one flick = exactly one right-mover holding its L2 shape to the absorbing edge, doubling ε₀ scaling c by exactly 1/√2, and both neg-controls red. This is light, built from Maxwell's two curl equations and nothing else." },

  { id:"rattleback", room:"The Contrary Stone", piece:"The Contrary Stone", glyph:"🌰",
    accent:"#e8b86b", href:"rattleback/index.html", tag:"the rattleback that reverses",
    companion:null,
    district:"grounds", tier:2, footprint:"rattleback", prefer:["bottom","right","se"],
    blurb:"A canoe-shaped stone on green felt that argues with your hand. Flick it the favored way and it spins clean; flick it the WRONG way and the belly-rock GROWS as the spin bleeds to zero — then it spontaneously REVERSES into its favored spin and settles there. The secret is the cyan dashed line on its deck: the stone's mass axis, tilted a few degrees off its keel. That skew couples spin to rocking; spin one way and the rock is damped, the other and it is anti-damped, fed by the spin until the spin gives out and flips. Drag the skew angle δ to zero (or hit the diagonal-tensor button) and the line snaps to the keel — now it spins happily both ways, the negative control. The reversal is emergent from the integrator, never scripted: the verdict flips only because the integrated spin crossed zero, and a self-test proves both launches end at the single favored sign, the diagonal tensor spins both ways, and energy is conserved to machine ε on the frictionless run — the reversal is real spin↔rock energy transfer. Kin to the collision lane and the dissection bench: a thing you touch, with the mechanism made visible." },

  { id:"overhang", room:"The Infinite Overhang", piece:"The Infinite Overhang", glyph:"📚",
    accent:"#e8b86b", href:"overhang/index.html", tag:"the harmonic overhang you stack",
