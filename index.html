/* ── solve the declarative layout ONCE: every footprint coordinate/size, every
   district + wing boundary, the front-door, and the circulation graph are derived
   here from the PLACES declarations + Layout's closed config. An unknown district
   throws (a hard build error). Coordinates are mutated back onto each PLACES entry
   (x/y/w/h or x/y/r) so the existing footprint drawers + label/leader geometry —
   which read r.x/r.y/r.w/r.h — run UNCHANGED against the derived slots. */
const LAYOUT = Layout.solve(PLACES);
PLACES.forEach(p=>{
  const f = LAYOUT.foot[p.id];
  if(f){
    if(f.r != null){ p.x = f.x; p.y = f.y; p.r = f.r; }
    else { p.x = f.x; p.y = f.y; p.w = f.w; p.h = f.h; }
  } else if(p.locked){
    // the gated cellar stair: a reserved slot at the manor south foundation,
    // resolved here so revealUndercroft() can build its POI on demand.
    const s = Layout.beneathSlot();
    p.x = s.x; p.y = s.y; p.w = s.w; p.h = s.h;
  }
});

const SVGNS = "http://www.w3.org/2000/svg";
const el = (n, attrs) => { const e = document.createElementNS(SVGNS, n);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ── footprint drawers: each appends plan linework into a <g> for one place.
   Every drawer paints an accent floor-wash (.fp-floor) + a base slab (.fp-fill) +
   a warm lit lip (.fp-lit), so the footprint reads as an inhabited, tinted plan at
   a glance, then its own characterful surveyed detailing.                        */
function drawSlab(g, x, y, w, h, rx){
  const r = rx==null?1.5:rx;
  // the per-wing accent floor wash (very subtle; lifts to full accent on hover)
  g.appendChild(el("rect",{x:x+1,y:y+1,width:w-2,height:h-2,rx:r,class:"fp-floor"}));
  g.appendChild(el("rect",{x,y,width:w,height:h,rx:r,class:"fp-fill"}));
  // a warm lit lip inset 3px (the candlelit edge of the stone)
  g.appendChild(el("rect",{x:x+3,y:y+3,width:w-6,height:h-6,rx:rx==null?1:r,class:"fp-lit"}));
}
function drawHouseWing(g, r){ // an interior room cell within the manor: slab + subdivision + furniture + door swing
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h);
  // a cross-wall subdivision so the room reads as two chambers
  g.appendChild(el("line",{x1:x+w*0.5,y1:y+8,x2:x+w*0.5,y2:y+h-8,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+8,y1:y+h*0.5,x2:x+w-8,y2:y+h*0.5,class:"fp-fine",opacity:".4"}));
  // surveyed "furniture" pips — a hearth on the outer wall + a small table
  const outerX = (x<716) ? x+5 : x+w-5;
  g.appendChild(el("rect",{x:outerX-(x<716?0:7),y:y+h*0.5-7,width:7,height:14,class:"fp-fine",opacity:".45"}));
  // a door swing into the central corridor (toward house centre, ~x=721)
  const left = (x < 716);
  const doorX = left ? x+w : x, dir = left ? -1 : 1;
  g.appendChild(el("path",{d:`M${doorX} ${y+h*0.5} h${dir*12}`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${doorX+dir*12} ${y+h*0.5} a12 12 0 0 ${left?1:0} ${dir*-12} -12`,class:"fp-fine"}));
}
function drawEastWing(g, r){ // the taller projecting east wing (Threshold): floors, bay windows, a doorway arc
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // three floor levels
  g.appendChild(el("line",{x1:x,y1:y+h*0.33,x2:x+w,y2:y+h*0.33,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.66,x2:x+w,y2:y+h*0.66,class:"fp-fine"}));
  // a projecting bay on the east face (three window mullions)
  g.appendChild(el("path",{d:`M${x+w} ${y+h*0.4} h10 v${h*0.2} h-10`,class:"fp-fine"}));
  g.appendChild(el("line",{x1:x+w+3,y1:y+h*0.4,x2:x+w+3,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  g.appendChild(el("line",{x1:x+w+7,y1:y+h*0.4,x2:x+w+7,y2:y+h*0.6,class:"fp-fine",opacity:".4"}));
  // the doorway arc facing the house
  g.appendChild(el("path",{d:`M${x} ${y+h*0.5} h-14`,class:"fp-line"}));
  g.appendChild(el("path",{d:`M${x-14} ${y+h*0.5} a14 14 0 0 1 14 -14`,class:"fp-fine"}));
}
function drawGlasshouse(g, r){ // greenhouse: gabled plan, mullion grid, knot-parterre + topiary (the Tessellarium within)
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the gable ridge + a long mullion grid (glass house)
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<8;i++) g.appendChild(el("line",{x1:x+w*i/8,y1:y,x2:x+w*i/8,y2:y+h,class:"fp-fine",opacity:".42"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.25,x2:x+w,y2:y+h*0.25,class:"fp-fine",opacity:".34"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.75,x2:x+w,y2:y+h*0.75,class:"fp-fine",opacity:".34"}));
  // a knot-parterre at the heart: a diamond-quartered square (the Tessellarium)
  const cx=x+w*0.5, cy=y+h*0.5, s=Math.min(w,h)*0.24;
  g.appendChild(el("rect",{x:cx-s,y:cy-s,width:s*2,height:s*2,class:"fp-line",opacity:".55"}));
  g.appendChild(el("path",{d:`M${cx} ${cy-s} L${cx+s} ${cy} L${cx} ${cy+s} L${cx-s} ${cy} Z`,class:"fp-fine"}));
  g.appendChild(el("path",{d:`M${cx-s} ${cy-s} l${s*2} ${s*2} M${cx+s} ${cy-s} l${-s*2} ${s*2}`,class:"fp-fine",opacity:".4"}));
  // topiary dots along the front beds
  g.appendChild(el("g",{}));
  const bedY=y+h-7, topi=g.lastChild;
  for(let i=0;i<6;i++) topi.appendChild(el("circle",{cx:x+w*(i+0.5)/6,cy:bedY,r:3.4,class:"fp-fine",opacity:".5"}));
}
function drawGlasshouseWing(g, r){ // living-systems glasshouse: gabled mullion grid, kin to the gardens, but the
  // parterre-at-heart is replaced by the limit-cycle level-sets in plan — concentric closed rings about a centre dot.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the gable ridge + a mullion grid (reads as kin to strange-garden's glasshouse)
  g.appendChild(el("line",{x1:x,y1:y+h*0.5,x2:x+w,y2:y+h*0.5,class:"fp-line"}));
  for(let i=1;i<7;i++) g.appendChild(el("line",{x1:x+w*i/7,y1:y,x2:x+w*i/7,y2:y+h,class:"fp-fine",opacity:".4"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.25,x2:x+w,y2:y+h*0.25,class:"fp-fine",opacity:".32"}));
  g.appendChild(el("line",{x1:x,y1:y+h*0.75,x2:x+w,y2:y+h*0.75,class:"fp-fine",opacity:".32"}));
  // the conceit in miniature: the predator–prey limit cycle as level-sets in plan —
  // 2 nested closed orbit-ellipses about the fixed-point centre dot (kept simple).
  const cx=x+w*0.5, cy=y+h*0.5;
  const rx=Math.min(w,h)*0.30, ry=Math.min(w,h)*0.20;
  g.appendChild(el("ellipse",{cx,cy,rx,ry,class:"fp-line",opacity:".7"}));
  g.appendChild(el("ellipse",{cx,cy,rx:rx*0.58,ry:ry*0.58,class:"fp-fine",opacity:".5"}));
  // the centre fixed-point dot
  g.appendChild(el("circle",{cx,cy,r:2.4,class:"fp-line"}));
}
function drawTower(g, r){ // domed observatory tower: concentric drum, radial dome ribs, a slit + transit-rim ticks
  const {x,y,r:rad} = r;
  // floor wash + drum
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-floor"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,class:"fp-fill"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad-3,class:"fp-lit"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.66,class:"fp-fine"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*0.30,class:"fp-fine"}));
  // radial dome ribs (12 spokes) — reads as a ribbed cupola
  for(let a=0;a<360;a+=30){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad*0.30,y1:y+Math.sin(t)*rad*0.30,
      x2:x+Math.cos(t)*(rad-2),y2:y+Math.sin(t)*(rad-2),class:"fp-fine",opacity:".4"})); }
  // the dome slit (a wedge to the north) + the transit telescope line
  g.appendChild(el("path",{d:`M${x-5} ${y} L${x-3} ${y-rad+2} L${x+3} ${y-rad+2} L${x+5} ${y} Z`,
    class:"fp-line",opacity:".7"}));
  g.appendChild(el("line",{x1:x,y1:y,x2:x,y2:y-rad*0.62,class:"fp-line"}));
  // transit-rim graduation ticks
  for(let a=0;a<360;a+=15){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:x+Math.cos(t)*rad,y1:y+Math.sin(t)*rad,
      x2:x+Math.cos(t)*(rad-5),y2:y+Math.sin(t)*(rad-5),class:"fp-fine"})); }
}
function drawMaze(g, r){ // hedge maze: a denser, genuinely traceable concentric labyrinth with one true path

function drawBenfordMill(g, r){ // THE BENFORD MILL — a brass burr-mill (round body + knurled hand-crank) feeding
  // nine descending bins under a dashed gold log₁₀(1+1/d) staircase, with a small log-wheel dial beside it.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const benf = d => Math.log10(1 + 1/d);            // the Benford height oracle (same closed form as the room)
  // the mill body — a round burr-mill at the upper-left, with a hand-crank on its right cheek
  const mcx = x + w*0.26, mcy = y + h*0.30, mr = Math.min(w,h)*0.15;
  g.appendChild(el("circle",{cx:mcx,cy:mcy,r:mr,class:"fp-line",opacity:".72"}));
  g.appendChild(el("circle",{cx:mcx,cy:mcy,r:mr-2.5,class:"fp-fine",opacity:".46"}));
  g.appendChild(el("circle",{cx:mcx,cy:mcy-mr+3,r:2.2,class:"fp-fine",opacity:".55"}));   // the throat (intake)
  // the knurled hand-crank: an arm + knob off the right cheek (the hero verb at plan-glance)
  g.appendChild(el("line",{x1:mcx+mr-2,y1:mcy,x2:mcx+mr+9,y2:mcy-5,class:"fp-line",opacity:".7"}));
  g.appendChild(el("circle",{cx:mcx+mr+9,cy:mcy-5,r:2.6,class:"fp-lit",opacity:".66"}));
  // nine descending bins along the lower span, fed by a fanning spout from the mill
  const bx0 = x + w*0.10, bx1 = x + w*0.78, baseY = y + h - 9, binTop = y + h*0.52;
  const gap = (bx1 - bx0)/9, maxBarH = baseY - binTop;
  for(let d=1; d<=9; d++){
    const cx = bx0 + gap*(d-0.5), bw = gap*0.66;
    const barH = maxBarH * benf(d)/benf(1);          // heights normalized to bin 1 (the descending shape)
    g.appendChild(el("rect",{x:cx-bw/2,y:baseY-barH,width:bw,height:barH,class:d===1?"fp-line":"fp-fine",opacity:d===1?".66":".46"}));
    g.appendChild(el("line",{x1:mcx,y1:mcy+mr-2,x2:cx,y2:baseY-barH,class:"fp-fine",opacity:".22"}));  // the spout chute
  }
  // the dashed gold staircase (the predicted curve) traced across the bin tops
  let stair = '';
  for(let d=1; d<=9; d++){ const cx = bx0 + gap*(d-0.5), ty = baseY - maxBarH*benf(d)/benf(1); stair += (d===1?`M${cx.toFixed(1)} ${ty.toFixed(1)}`:` L${cx.toFixed(1)} ${ty.toFixed(1)}`); }
  g.appendChild(el("path",{d:stair,class:"fp-lit",fill:"none",opacity:".7","stroke-dasharray":"3 2"}));
  g.appendChild(el("line",{x1:bx0-2,y1:baseY,x2:bx1+2,y2:baseY,class:"fp-line",opacity:".5"}));         // baseline
  // the small log-wheel dial at the upper-right: a ring with one WIDE wedge (digit 1 ≈ 30% of the rim)
  const wcx = x + w*0.74, wcy = y + h*0.26, wrad = Math.min(w,h)*0.13;
  g.appendChild(el("circle",{cx:wcx,cy:wcy,r:wrad,class:"fp-line",opacity:".68"}));
  // the digit-1 wedge: from 12 o'clock clockwise by 30.1% of the circle (the visibly-widest slice)
  const a0 = -Math.PI/2, a1 = a0 + benf(1)*2*Math.PI;
  const wx0 = wcx + Math.cos(a0)*wrad, wy0 = wcy + Math.sin(a0)*wrad;
  const wx1 = wcx + Math.cos(a1)*wrad, wy1 = wcy + Math.sin(a1)*wrad;
  g.appendChild(el("path",{d:`M${wcx} ${wcy} L${wx0.toFixed(1)} ${wy0.toFixed(1)} A${wrad.toFixed(1)} ${wrad.toFixed(1)} 0 0 1 ${wx1.toFixed(1)} ${wy1.toFixed(1)} Z`,class:"fp-lit",opacity:".5"}));
  g.appendChild(el("circle",{cx:wcx,cy:wcy,r:1.6,class:"fp-fine",opacity:".6"}));
  // a south door-swing toward the wing aisle
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} v-3 h${w*0.14} v3`,class:"fp-line",opacity:".56"}));
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} a${w*0.14} ${w*0.14} 0 0 1 ${w*0.14} -3`,class:"fp-fine",opacity:".36"}));
}

function drawQuietRoom(g, r){ // THE QUIET ROOM — a 5×5 dot-grid of small lamps with one gold plus-cross

function drawIronFilings(g, r){ // the lodestone plate: a dark slab with two bar-magnet poles, field-line arcs threading pole→pole, and a faint filing-grain hatch
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cy=y+h/2;
  // the two bar-magnet POLES, set on the plate's centre line (an unlike pair, N left of S)
  const px1=x+w*0.30, px2=x+w*0.70;
  // each pole drawn as a small capsule end-dot: a warm-red N and a cool-blue S, with a faint bar between
  g.appendChild(el("line",{x1:px1,y1:cy,x2:px2,y2:cy,class:"fp-fine",opacity:".3"}));            // the conceptual bar
  g.appendChild(el("circle",{cx:px1,cy:cy,r:4.2,class:"fp-line",opacity:".82"}));                 // N pole-dot
  g.appendChild(el("circle",{cx:px2,cy:cy,r:4.2,class:"fp-lit",opacity:".7"}));                   // S pole-dot (lit lip)
  // ── the FIELD LINES: arcs bowing from the N pole to the S pole, above and below the axis,
  //    fanning out the way iron filings thread a dipole bridge ──
  for(let k=1;k<=3;k++){
    const bow=h*0.10*k;                                                                            // each arc bows wider
    g.appendChild(el("path",{d:`M${px1} ${cy} Q${(px1+px2)/2} ${cy-bow} ${px2} ${cy}`,class:"fp-fine",fill:"none",opacity:(.6-k*0.12).toFixed(2)}));
    g.appendChild(el("path",{d:`M${px1} ${cy} Q${(px1+px2)/2} ${cy+bow} ${px2} ${cy}`,class:"fp-fine",fill:"none",opacity:(.6-k*0.12).toFixed(2)}));
  }
  // the outer return loops fountaining past each pole toward the plate edge
  g.appendChild(el("path",{d:`M${px1} ${cy} Q${x+w*0.10} ${cy-h*0.30} ${x+w*0.10} ${cy}`,class:"fp-fine",fill:"none",opacity:".34"}));
  g.appendChild(el("path",{d:`M${px1} ${cy} Q${x+w*0.10} ${cy+h*0.30} ${x+w*0.10} ${cy}`,class:"fp-fine",fill:"none",opacity:".34"}));
  g.appendChild(el("path",{d:`M${px2} ${cy} Q${x+w*0.90} ${cy-h*0.30} ${x+w*0.90} ${cy}`,class:"fp-fine",fill:"none",opacity:".34"}));
  g.appendChild(el("path",{d:`M${px2} ${cy} Q${x+w*0.90} ${cy+h*0.30} ${x+w*0.90} ${cy}`,class:"fp-fine",fill:"none",opacity:".34"}));
  // ── a faint FILING-GRAIN hatch: short tick-marks scattered over the plate, each angled along
  //    the local bridge direction (toward the axis) — the texture of filings read at a glance ──
  for(const [fx,fy,ang] of [[0.20,0.26,-0.5],[0.50,0.20,0],[0.80,0.26,0.5],[0.20,0.74,0.5],[0.50,0.80,0],[0.80,0.74,-0.5],[0.38,0.40,-0.2],[0.62,0.40,0.2],[0.38,0.60,0.2],[0.62,0.60,-0.2]]){
    const cxp=x+w*fx, cyp=y+h*fy, dl=3;
    g.appendChild(el("line",{x1:cxp-Math.cos(ang)*dl,y1:cyp-Math.sin(ang)*dl,x2:cxp+Math.cos(ang)*dl,y2:cyp+Math.sin(ang)*dl,class:"fp-fine",opacity:".26"}));
  }
}
function drawCoil(g, r){ // THE LODESTONE HALL — the induction bench: a coil seen edge-on as a vertical
  // MOUTH gap (two winding stacks flanking it), a bar magnet on a rail trailing field lines that thread the
  // mouth, and a centre-zero galvanometer needle — the whole "current you make by moving" read at a glance.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.58, cy=y+h*0.52;           // the coil sits right-of-centre; the magnet rides in from the left
  const gap=h*0.40;                          // the mouth height
  // the coil: two short winding stacks bracketing the gap (burnished copper rings, edge-on)
  for(let side=-1;side<=1;side+=2){
    for(let k=0;k<4;k++){
      const ry=cy-gap/2 + gap*(k+0.5)/4;
      g.appendChild(el("ellipse",{cx:cx+side*5, cy:ry, rx:3.2, ry:1.8, class:"fp-line", opacity:".74"}));
    }
  }
  // the brass mouth lips (top + bottom of the gap)
  g.appendChild(el("line",{x1:cx-7,y1:cy-gap/2,x2:cx+7,y2:cy-gap/2,class:"fp-lit",opacity:".8"}));
  g.appendChild(el("line",{x1:cx-7,y1:cy+gap/2,x2:cx+7,y2:cy+gap/2,class:"fp-lit",opacity:".8"}));
  // the bar magnet riding in on its rail from the left (N toward the mouth)
  const mx=x+w*0.22;
  g.appendChild(el("line",{x1:x+w*0.10,y1:cy,x2:cx-9,y2:cy,class:"fp-fine",opacity:".34"})); // the rail
  g.appendChild(el("rect",{x:mx-7,y:cy-3.2,width:8,height:6.4,rx:1,class:"fp-line",opacity:".82"}));  // N half
  g.appendChild(el("rect",{x:mx+1,y:cy-3.2,width:8,height:6.4,rx:1,class:"fp-fill",opacity:".6"}));   // S half
  // the field lines bowing from the magnet's north toward / through the mouth (the ones piercing glow)
  for(let k=1;k<=3;k++){
    const bow=h*0.11*k;
    g.appendChild(el("path",{d:`M${mx+9} ${cy} Q${(mx+cx)/2} ${cy-bow} ${cx} ${cy}`,class:"fp-fine",fill:"none",opacity:(.62-k*0.13).toFixed(2)}));
    g.appendChild(el("path",{d:`M${mx+9} ${cy} Q${(mx+cx)/2} ${cy+bow} ${cx} ${cy}`,class:"fp-fine",fill:"none",opacity:(.62-k*0.13).toFixed(2)}));
  }
  // the centre-zero galvanometer needle below the coil (the EMF read)
  const gy=y+h*0.84, gxx=cx;
  g.appendChild(el("path",{d:`M${gxx-9} ${gy} A 9 9 0 0 1 ${gxx+9} ${gy}`,class:"fp-fine",fill:"none",opacity:".5"})); // dial arc
  g.appendChild(el("line",{x1:gxx,y1:gy,x2:gxx+5,y2:gy-6,class:"fp-lit",opacity:".85"}));   // the needle, kicked
}
function drawBootstrapBench(g, r){ // THE BOOTSTRAP BENCH — the induction wing's CAPSTONE: a long dark run
  // of free space seen side-on (no wire/spring drawn), two phase-locked field ribbons (an E up-down comb +
  // a B oblique-depth comb a quarter-step apart) with ONE bright leading-edge spark — "the wave that carries
  // itself" read at a glance. The two speed-posts straddle the run; the grab handle sits at the left edge.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const x0=x+w*0.16, x1=x+w*0.92, axis=y+h*0.50;     // the run, left→right, with its E=0 centreline
  const amp=h*0.26, lead=x0+(x1-x0)*0.60;            // pulse amplitude + where the leading edge sits
  // the E=0 centreline (the long dark run)
  g.appendChild(el("line",{x1:x0,y1:axis,x2:x1,y2:axis,class:"fp-fine",opacity:".34"}));
  // the grab HANDLE at the left edge (the flick-to-charge knob)
  g.appendChild(el("rect",{x:x0-7,y:axis-4,width:6,height:8,rx:1.5,class:"fp-lit",opacity:".9"}));
  // the E ribbon (up-down): a Gaussian bump trailing back from the leading edge (the laid-down wake)
  let eD=`M${x0} ${axis}`;
  for(let i=0;i<=24;i++){ const t=i/24; const xx=x0+(lead-x0)*t; const env=Math.exp(-Math.pow((t-1)/0.34,2));
    eD+=` L${xx.toFixed(1)} ${(axis-amp*env).toFixed(1)}`; }
  g.appendChild(el("path",{d:eD,class:"fp-lit",fill:"none",opacity:".9"}));            // E (cyan-lit ribbon)
  // the B ribbon (oblique depth): the same envelope, shoved into the page + down (copper, the staggered comb)
  let bD=`M${x0+5} ${axis+8}`;
  for(let i=0;i<=24;i++){ const t=i/24; const xx=x0+5+(lead-x0)*t; const env=Math.exp(-Math.pow((t-1)/0.34,2));
    bD+=` L${xx.toFixed(1)} ${(axis+8+amp*0.7*env).toFixed(1)}`; }
  g.appendChild(el("path",{d:bD,class:"fp-fine",fill:"none",opacity:".62"}));          // B (depth comb)
  // ahead of the front: dead-flat dark un-sourced space (a faint dotted continuation)
  g.appendChild(el("line",{x1:lead,y1:axis,x2:x1,y2:axis,class:"fp-fine","stroke-dasharray":"1 4",opacity:".22"}));
  // THE SPARK — the single bright leading-edge bloom (creation at a moving edge)
  g.appendChild(el("circle",{cx:lead,cy:axis-amp,r:3.4,class:"fp-lit",opacity:".95"}));
  g.appendChild(el("circle",{cx:lead,cy:axis-amp,r:6.5,class:"fp-fine",fill:"none",opacity:".5"}));
  // the two speed-posts A / B straddling the run (fixed brass uprights)
  for(const px of [x0+(x1-x0)*0.34, x0+(x1-x0)*0.78]){
    g.appendChild(el("line",{x1:px,y1:axis-amp*1.25,x2:px,y2:axis+amp*1.0,class:"fp-fine",opacity:".42"}));
  }
}
function drawBreathingStar(g, r){ // THE BREATHING STAR — a squeezable star in plan: a luminous body of
  // concentric photosphere shells (warm inward), a softly opacity-PULSING core + halo (the heartbeat),
  // a dashed rest-radius ring it breathes around, and a 5/2 star limb-mark — the spring-of-shells read.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.5, cy=y+h*0.5, rad=Math.min(w,h)*0.40;
  // the dashed REST-RADIUS ring (the keystone the disc breathes around)
  g.appendChild(el("circle",{cx,cy,r:rad*1.04,class:"fp-fine","stroke-dasharray":"3 4",opacity:".5"}));
  // concentric photosphere shells — warmer (lit) inward, cooler (fine) outward; the body of gas
  const shells=6;
  for(let i=shells;i>=1;i--){
    const rr=rad*i/shells;
    g.appendChild(el("circle",{cx,cy,r:rr,class:i<=2?"fp-lit":"fp-line",opacity:(0.34+0.40*(1-i/shells)).toFixed(2)}));
  }
  // the softly pulsing halo + core (the heartbeat — CSS opacity pulse, portable like runepulse)
  g.appendChild(el("circle",{cx,cy,r:rad*0.92,class:"fp-lit bstar-halo",opacity:".4"}));
  g.appendChild(el("circle",{cx,cy,r:rad*0.26,class:"fp-lit bstar-core",opacity:".9"}));
  // the bright centre point
  g.appendChild(el("circle",{cx,cy,r:2.1,fill:"rgba(207,224,255,.95)",stroke:"none"}));
  // a 5/2 star limb-mark riding the surface (the stellar glyph, surveyed)
  let d=""; const sr=rad*0.40, sx=cx, sy=cy-rad*1.02;
  for(let k=0;k<=5;k++){ const a=-Math.PI/2 + k*(4*Math.PI/5); // {5/2} star polygon
    d += (k?"L":"M")+(sx+Math.cos(a)*sr).toFixed(1)+" "+(sy+Math.sin(a)*sr).toFixed(1); }
  d+="Z";
  g.appendChild(el("path",{d,class:"fp-lit",fill:"none",opacity:".7"}));
}
function drawRattleback(g, r){ // THE CONTRARY STONE — a felt table slab with a canoe-shaped celt seen from above:
  // the canoe hull (long keel ridge) + the cyan dashed MASS-AXIS line tilted a few degrees off the keel,
  // plus a faint curved "favored" arc — the whole secret read at a glance.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.5, cy=y+h*0.52;
  const longR=Math.min(w,h)*0.46, shortR=longR*0.40;
  // the felt table oval the stone sits on
  g.appendChild(el("ellipse",{cx,cy,rx:Math.min(w,h)*0.40,ry:Math.min(w,h)*0.40*0.5,class:"fp-fine",opacity:".22"}));
  // the canoe hull (a pinched ellipse) — drawn as a polyline so the ends sharpen like a celt
  let d="";
  for(let i=0;i<=40;i++){ const t=i/40*Math.PI*2;
    const sharp=1-0.18*Math.cos(2*t);
    const px=cx+Math.cos(t)*longR*sharp, py=cy+Math.sin(t)*shortR;
    d += (i?"L":"M")+px.toFixed(1)+" "+py.toFixed(1); }
  d+="Z";
  g.appendChild(el("path",{d,class:"fp-line",fill:"none",opacity:".82"}));
  g.appendChild(el("path",{d,class:"fp-lit",fill:"none",opacity:".5"}));
  // the keel ridge along the long axis
  g.appendChild(el("line",{x1:cx-longR*0.86,y1:cy,x2:cx+longR*0.86,y2:cy,class:"fp-fine",opacity:".7"}));
  // the cyan MASS-AXIS skew line, tilted ~14° off the keel — the visible cause
  const dRad=14*Math.PI/180, ml=longR*0.74;
  g.appendChild(el("line",{x1:cx-Math.cos(dRad)*ml,y1:cy-Math.sin(dRad)*ml*shortR/longR*1.0 - Math.sin(dRad)*ml*0.0,
    x2:cx+Math.cos(dRad)*ml,y2:cy+Math.sin(dRad)*ml*(shortR/longR),
    class:"fp-fine",stroke:"#7fc7e8",opacity:".75","stroke-dasharray":"4 3"}));
  // a faint favored-arc above the stone
  g.appendChild(el("path",{d:`M${cx-longR*0.5} ${cy-shortR-6} Q${cx} ${cy-shortR-13} ${cx+longR*0.5} ${cy-shortR-6}`,
    class:"fp-fine",fill:"none",stroke:"#8fd79a",opacity:".4"}));
  // two end pips so the long axis reads
  g.appendChild(el("circle",{cx:cx+longR*0.82,cy:cy,r:2.6,class:"fp-lit",opacity:".7"}));
  g.appendChild(el("circle",{cx:cx-longR*0.82,cy:cy,r:2.6,class:"fp-line",opacity:".7"}));
}
function drawOverhang(g, r){ // THE INFINITE OVERHANG — a side-on brass table slab whose right edge is the CLIFF,
  // with a stepped staircase of book rects leaning ever-further out past it, plus a faint x=1 goal tick.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the brass table: a solid block on the LEFT, its right face the cliff edge
  const cliffX = x + w*0.46;                          // the cliff sits left-of-centre; books lean right
  const tableTop = y + h*0.60;                         // the table surface the bottom book rests on
  g.appendChild(el("rect",{x:x+w*0.06,y:tableTop,width:cliffX-(x+w*0.06),height:y+h*0.92-tableTop,
    class:"fp-line",fill:"none",opacity:".7"}));
  // the lit table-surface line + the cliff face (the brink past which the books float)
  g.appendChild(el("line",{x1:x+w*0.06,y1:tableTop,x2:cliffX,y2:tableTop,class:"fp-lit",opacity:".7"}));
  g.appendChild(el("line",{x1:cliffX,y1:tableTop,x2:cliffX,y2:y+h*0.92,class:"fp-lit",opacity:".55"}));
  // the stepped staircase of books: each higher book leans a diminishing 1/(2k) further right —
  // drawn bottom-up so the steps overlap correctly and the top book floats well past the cliff.
  const bw = w*0.30, bh = Math.max(3, h*0.075);        // book width / height in plan units
  let off = 0;                                          // cumulative right offset past the cliff
  const N = 5;
  for(let k=1;k<=N;k++){                                // k = book counted FROM THE TOP
    off += 1/(2*k);                                     // the harmonic nudge, shrinking each step
  }
  // re-walk bottom→top placing rects, so the lowest is flush at the cliff and the top juts farthest
  let cum = 0;
  for(let k=N;k>=1;k--){
    cum += 1/(2*k);
    const bx = cliffX - bw + cum*bw*0.92;              // lean right by the cumulative nudge
    const by = tableTop - (N-k+1)*bh;
    const lit = (k===1);                                // the top (farthest-out) book is the lit hero
    g.appendChild(el("rect",{x:bx,y:by,width:bw,height:bh-1,
      class:lit?"fp-lit":"fp-line",fill:"none",opacity:lit?".82":".62"}));
  }
  // the faint x=1 goal tick — one book-length past the cliff (the first divergence threshold)
  const goalX = cliffX + bw;
  if(goalX < x+w-3){
    g.appendChild(el("line",{x1:goalX,y1:tableTop-N*bh-2,x2:goalX,y2:tableTop,
      class:"fp-fine",opacity:".5",stroke:"#7fc7e8","stroke-dasharray":"3 3"}));
  }
}
function drawSundial(g, r){ // THE GNOMON — a garden sundial: a graduated dial-face, radial hour ticks, a
  // triangular polar style. The LIVE brass shadow + gnomon furniture are drawn by the Hours
  // layer ON TOP (mounted into #viewport after the sky pass); this is the static plan engraving.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cx=x+w*0.5, cy=y+h*0.54, rad=Math.min(w,h)*0.40;
  // the graduated dial drum (two concentric rims)
  g.appendChild(el("circle",{cx,cy,r:rad,class:"fp-line",opacity:".7"}));
  g.appendChild(el("circle",{cx,cy,r:rad-3.5,class:"fp-fine",opacity:".5"}));
  // radial hour ticks (every 15°, long at the cardinal hours) reading like an engraved dial
  for(let a=0;a<360;a+=15){ const t=(a-90)*Math.PI/180, long=(a%90===0);
    g.appendChild(el("line",{x1:cx+Math.cos(t)*(rad-(long?9:5)),y1:cy+Math.sin(t)*(rad-(long?9:5)),
      x2:cx+Math.cos(t)*(rad-1),y2:cy+Math.sin(t)*(rad-1),class:"fp-fine",opacity:long?".7":".42"})); }
  // the noon line (up the dial, toward 12)
  g.appendChild(el("line",{x1:cx,y1:cy-rad+1,x2:cx,y2:cy,class:"fp-fine",opacity:".5"}));
  // the triangular polar STYLE (the gnomon edge) rising from the centre toward 12
  g.appendChild(el("path",{d:`M${cx} ${cy} L${cx} ${cy-rad*0.92} L${cx+rad*0.42} ${cy} Z`,class:"fp-line",opacity:".82"}));
  g.appendChild(el("path",{d:`M${cx} ${cy} L${cx} ${cy-rad*0.92} L${cx+rad*0.42} ${cy} Z`,class:"fp-lit",opacity:".5"}));
  // the centre nodus
  g.appendChild(el("circle",{cx,cy,r:2.2,class:"fp-line"}));
}
function drawReckoning(g, r){ // THE RECKONING CABINET — a brass instrument-panel slab: five engraved station
  // bays mounted on one shared rail, each dropping a pointer to it, echoing the landing's panel.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const railY = y + h*0.62;                              // the one shared rail runs across the lower panel
  const bx0 = x + w*0.10, bx1 = x + w*0.90;
  const bayTop = y + h*0.18, bayH = h*0.30;
  const n = 5, span = (bx1 - bx0)/n;
  // the shared engraved RAIL with fine ticks (one continuous instrument scale)
  g.appendChild(el("line",{x1:bx0,y1:railY,x2:bx1,y2:railY,class:"fp-line",opacity:".66"}));
  for(let tx=bx0; tx<=bx1+0.01; tx+=span/4){ const big=(Math.round((tx-bx0)/(span/4))%4===0);
    g.appendChild(el("line",{x1:tx,y1:railY-(big?2.6:1.4),x2:tx,y2:railY+(big?2.6:1.4),class:"fp-fine",opacity:big?".6":".38"})); }
  // five station BAYS on the rail, each with a pointer dropping to it
  for(let i=0;i<n;i++){
    const cx = bx0 + span*(i+0.5);
    const hero = (i===0);                                // the slipstick bay reads as the lit hero
    g.appendChild(el("rect",{x:cx-span*0.40,y:bayTop,width:span*0.80,height:bayH,rx:1.5,
      class:hero?"fp-line":"fp-fine",opacity:hero?".72":".5"}));
    if(hero) g.appendChild(el("rect",{x:cx-span*0.40+1.5,y:bayTop+1.5,width:span*0.80-3,height:bayH-3,rx:1,class:"fp-lit",opacity:".5"}));
    // a tiny engraved mark inside each bay (a different glyph-shape per instrument, abstracted to plan)
    const my = bayTop + bayH*0.5;
    if(i===0){ // slipstick: two short parallel scale-bars
      g.appendChild(el("line",{x1:cx-span*0.26,y1:my-2,x2:cx+span*0.26,y2:my-2,class:"fp-fine",opacity:".7"}));
      g.appendChild(el("line",{x1:cx-span*0.26,y1:my+2,x2:cx+span*0.26,y2:my+2,class:"fp-fine",opacity:".7"}));
    } else if(i===1){ // astrolabe: a small ringed dial
      g.appendChild(el("circle",{cx,cy:my,r:bayH*0.26,class:"fp-fine",opacity:".6"}));
    } else if(i===2){ // planimeter: a hinged arm
      g.appendChild(el("line",{x1:cx-span*0.24,y1:my+2,x2:cx+span*0.10,y2:my-3,class:"fp-fine",opacity:".6"}));
      g.appendChild(el("circle",{cx:cx-span*0.24,cy:my+2,r:1,class:"fp-fine",opacity:".55"}));
    } else if(i===3){ // abacus: a rod with a bead
      g.appendChild(el("line",{x1:cx,y1:my-bayH*0.26,x2:cx,y2:my+bayH*0.26,class:"fp-fine",opacity:".6"}));
      g.appendChild(el("ellipse",{cx,cy:my,rx:2.4,ry:1.2,class:"fp-fine",opacity:".6"}));
    } else { // gnomon (offsite): a style + a leaning shadow, marked as pointing OUT
      g.appendChild(el("path",{d:`M${cx} ${my+bayH*0.22} L${cx} ${my-bayH*0.22} L${cx+span*0.22} ${my+bayH*0.22} Z`,class:"fp-fine",opacity:".6"}));
      g.appendChild(el("line",{x1:cx,y1:my+bayH*0.22,x2:cx+span*0.30,y2:my+bayH*0.10,class:"fp-fine",opacity:".42","stroke-dasharray":"2 2"}));
    }
    // the pointer dropping from this bay to the shared rail + its rail node
    g.appendChild(el("line",{x1:cx,y1:bayTop+bayH,x2:cx,y2:railY,class:"fp-fine",opacity:".46"}));
    g.appendChild(el("circle",{cx,cy:railY,r:1.3,class:hero?"fp-lit":"fp-fine",opacity:hero?".7":".5"}));
  }
  // a small "↗" engraved past the gnomon bay — the wing points OUT to the grounds
  g.appendChild(el("path",{d:`M${bx1-2} ${bayTop-3} l5 -3 l-1 4`,class:"fp-fine",opacity:".5"}));
  // a south door-swing toward the manor interior (the wing's entrance)
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} v-3 h${w*0.16} v3`,class:"fp-line",opacity:".58"}));
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} a${w*0.16} ${w*0.16} 0 0 1 ${w*0.16} -3`,class:"fp-fine",opacity:".38"}));
}
function drawColonnade(g, r){ // THE MUSEUM — a grand classical archive hall in plan: a stepped stylobate, a row
  // of column dots ringing the cella, and a pedimented portico on the entrance face. Reads
  // "archive / temple" at plan-glance, authored in the drawSlab + el() idiom (manor interior).
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the stepped STYLOBATE — two concentric inset rectangles (the temple's rising base)
  g.appendChild(el("rect",{x:x+3,y:y+3,width:w-6,height:h-6,rx:1.5,class:"fp-fine",opacity:".5"}));

function drawLaunchRail(g, r){ // THE AERODROME — a side-on launch complex: a braced gantry MAST, a diagonal
  // RAIL up to a launch LIP, a small craft WEDGE on the rail, and a thin engraved ARC leaving the lip
  // up-and-right (the trace it will fly). Reads "something launches from here" at plan-glance.
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the foot of the rail (lower-left) up to the launch lip (upper-right of the slab)
  const fx = x + w*0.16, fy = y + h*0.86;        // gantry foot
  const lx = x + w*0.62, ly = y + h*0.30;        // launch lip
  // the gantry MAST + cross-braces at the foot
  g.appendChild(el("line",{x1:fx,y1:y+h*0.94,x2:fx,y2:y+h*0.30,class:"fp-line",opacity:".72"}));
  for(let i=0;i<4;i++){ const yy=y+h*0.86-i*h*0.16;
    g.appendChild(el("line",{x1:fx-w*0.05,y1:yy,x2:fx+w*0.05,y2:yy-h*0.05,class:"fp-fine",opacity:".5"})); }
  // the diagonal RAIL with sleeper ties
  g.appendChild(el("line",{x1:fx,y1:fy,x2:lx,y2:ly,class:"fp-line",opacity:".7"}));
  const dx=lx-fx, dy=ly-fy, dl=Math.hypot(dx,dy), nx=-dy/dl, ny=dx/dl;
  for(let i=0;i<=7;i++){ const t=i/7, mx=fx+dx*t, my=fy+dy*t;

  // the launch LIP (a short upturn) + the craft WEDGE riding the rail
  g.appendChild(el("path",{d:`M${lx} ${ly} l${w*0.06} ${-h*0.02}`,class:"fp-line",opacity:".66"}));
  const cx0=fx+dx*0.46, cy0=fy+dy*0.46, ang=Math.atan2(dy,dx);
  const wedge=`M${cx0+Math.cos(ang)*6} ${cy0+Math.sin(ang)*6}
    L${cx0+Math.cos(ang+2.5)*4} ${cy0+Math.sin(ang+2.5)*4}
    L${cx0+Math.cos(ang-2.5)*4} ${cy0+Math.sin(ang-2.5)*4} Z`;

  g.appendChild(el("path",{d:`M${lx} ${ly} Q ${lx+w*0.22} ${ly-h*0.20} ${x+w-3} ${y+h*0.14}`,

  g.appendChild(el("circle",{cx:x+w-5,cy:y+h*0.14,r:1.6,class:"fp-lit",opacity:".7"}));
  g.appendChild(el("path",{d:`M${x+w-12} ${y+h*0.05} l5 -2 l-1 4`,class:"fp-fine",opacity:".5"}));
}
function drawLoom(g, r){ // THE REVERSING-ROOM — a loom-in-plan over a billiards lane: two warp beams hold
  // taut warp threads across the frame, a shuttle bar sits mid-weave, a worldline runs the long axis
  // beaded with collision KNOTS (one frayed), and a small CRANK wheel at the west end winds it. Reads
  // "a loom that weaves time, with a handle to wind it back" at plan-glance (manor interior idiom).
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  const cy=y+h/2;
  // the two WARP BEAMS (the rollers the cloth winds between) — short bars at the long ends
  const bx0=x+w*0.16, bx1=x+w*0.90;
  g.appendChild(el("rect",{x:bx0-2,y:y+h*0.20,width:4,height:h*0.60,rx:1,class:"fp-line",opacity:".66"}));
  g.appendChild(el("rect",{x:bx1-2,y:y+h*0.20,width:4,height:h*0.60,rx:1,class:"fp-line",opacity:".66"}));
  // the taut WARP THREADS running between the beams (the loom's bed)
  for(let i=0;i<5;i++){ const ty=y+h*0.26+i*h*0.12;
    g.appendChild(el("line",{x1:bx0,y1:ty,x2:bx1,y2:ty,class:"fp-fine",opacity:i===2?".5":".3"})); }
  // the WORLDLINE THREAD woven along the centre, beaded with KNOTS at collisions
  g.appendChild(el("line",{x1:bx0,y1:cy,x2:bx1,y2:cy,class:"fp-lit",opacity:".6"}));
  const nK=5, kx0=bx0+w*0.10, kspan=(bx1-kx0-w*0.06)/(nK-1);
  for(let i=0;i<nK;i++){ const kx=kx0+kspan*i, fray=(i===nK-1);
    g.appendChild(el("circle",{cx:kx,cy,r:fray?2.2:1.9,class:fray?"fp-fine":"fp-lit",opacity:fray?".55":".75"}));
    if(fray){ g.appendChild(el("line",{x1:kx,y1:cy,x2:kx+3,y2:cy-4,class:"fp-fine",opacity:".5"}));
      g.appendChild(el("line",{x1:kx,y1:cy,x2:kx-2,y2:cy-5,class:"fp-fine",opacity:".5"})); } }
  // the SHUTTLE bar crossing the warp mid-weave (a short bar with a point, between two knots)
  const shx=kx0+kspan*1.5;
  g.appendChild(el("rect",{x:shx-1.5,y:cy-h*0.20,width:3,height:h*0.40,rx:1.2,class:"fp-line",opacity:".68"}));
  g.appendChild(el("path",{d:`M${shx-3} ${cy-h*0.20} L${shx+3} ${cy-h*0.20} L${shx} ${cy-h*0.20+4} Z`,class:"fp-lit",opacity:".7"}));
  // the CRANK wheel at the west end (the handle that owns time) — a small spoked wheel
  const wcx=x+w*0.085, wr=Math.min(h*0.20,w*0.06);
  g.appendChild(el("circle",{cx:wcx,cy,r:wr,class:"fp-line",opacity:".72"}));
  g.appendChild(el("circle",{cx:wcx,cy,r:wr*0.20,class:"fp-fine",opacity:".55"}));
  for(let a=0;a<360;a+=60){ const t=a*Math.PI/180;
    g.appendChild(el("line",{x1:wcx,y1:cy,x2:wcx+Math.cos(t)*wr*0.86,y2:cy+Math.sin(t)*wr*0.86,class:"fp-fine",opacity:".4"})); }
  g.appendChild(el("circle",{cx:wcx,cy:cy-wr,r:1.6,class:"fp-lit",opacity:".7"})); // the handle knob
  // a small "⟲" reverse-arrow engraved over the wheel — the wing's whole idea
  g.appendChild(el("path",{d:`M${wcx-wr-3} ${cy-wr-2} a3 3 0 1 0 3 -3`,class:"fp-fine",opacity:".5"}));
  // a south door-swing into the manor interior (the wing's entrance)
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} v-3 h${w*0.14} v3`,class:"fp-line",opacity:".56"}));
  g.appendChild(el("path",{d:`M${x+w*0.5} ${y+h} a${w*0.14} ${w*0.14} 0 0 1 ${w*0.14} -3`,class:"fp-fine",opacity:".36"}));
}

function drawFlock(g, r){ // a flocking field: an open plot scattered with little oriented birds, mostly of one mind (a few stragglers warm-scattered) + the noise dial's arc
  const {x,y,w,h} = r; drawSlab(g,x,y,w,h,2);
  // the field's inner rim (the open torus the flock flies on)
  g.appendChild(el("rect",{x:x+w*0.10,y:y+h*0.14,width:w*0.80,height:h*0.62,rx:3,class:"fp-fine",opacity:".3"}));
  // a small flock of arrowhead birds — 11 mostly-aligned (heading ~ -20°), 2 stragglers turned away
  const hx=x+w*0.50, hy=y+h*0.44, s=Math.min(w,h);
  const bird=(bx,by,ang,lit)=>{ // a tiny chevron pointing along ang
    const c=Math.cos(ang), si=Math.sin(ang), L=s*0.052, B=s*0.034;
    const tx=bx+c*L, ty=by+si*L;                       // nose
    const lx=bx-c*B - si*B, ly=by-si*B + c*B;          // left wing
    const rx2=bx-c*B + si*B, ry=by-si*B - c*B;         // right wing
    g.appendChild(el("path",{d:`M${tx.toFixed(2)} ${ty.toFixed(2)} L${lx.toFixed(2)} ${ly.toFixed(2)} L${rx2.toFixed(2)} ${ry.toFixed(2)} Z`,
      class:lit?"fp-lit":"fp-line",opacity:lit?".7":".82"})); };
  const base=-0.35; // the shared heading (radians), a flock nearly of one mind
  [[-0.34,-0.20,0],[-0.10,-0.26,0.05],[0.16,-0.18,-0.04],[0.34,-0.04,0.06],
   [-0.30,0.06,-0.05],[-0.06,0.00,0.03],[0.20,0.10,-0.02],[0.06,0.24,0.04],
   [-0.24,0.26,-0.03],[0.32,0.24,0.02],[-0.40,0.34,0.05]].forEach(([dx,dy,j])=>
    bird(hx+dx*w*0.74, hy+dy*h*0.92, base+j, false));

  bird(hx+0.40*w*0.74, hy-0.30*h*0.92, base+2.6, true);

  const dcx=x+w*0.80, dcy=y+h*0.84, dr=s*0.11;
  g.appendChild(el("path",{d:`M${(dcx-dr).toFixed(2)} ${dcy.toFixed(2)} A${dr.toFixed(2)} ${dr.toFixed(2)} 0 0 1 ${(dcx+dr).toFixed(2)} ${dcy.toFixed(2)}`,

  g.appendChild(el("circle",{cx:dcx-dr*0.55,cy:dcy-dr*0.55,r:1.7,class:"fp-lit",opacity:".7"}));

/* ── geometry helpers (leader-line origin/edge for a footprint) ── */
function footCentre(r){
  if(r.footprint==="tower") return { cx:r.x, cy:r.y };
  return { cx:r.x + r.w/2, cy:r.y + r.h/2 };
}
function footEdge(r, side){
  if(r.footprint==="tower"){
    const m={left:[r.x-r.r,r.y],right:[r.x+r.r,r.y],top:[r.x,r.y-r.r],bottom:[r.x,r.y+r.r]};
    return m[side];
  }
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  const m={left:[r.x,cy],right:[r.x+r.w,cy],top:[cx,r.y],bottom:[cx,r.y+r.h]};
  return m[side];
}
function footBBox(r){
  if(r.footprint==="tower") return { x:r.x-r.r, y:r.y-r.r, w:r.r*2, h:r.r*2 };
  return { x:r.x, y:r.y, w:r.w, h:r.h };
}
