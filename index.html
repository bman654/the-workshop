<head>

<title>The Workshop — an Estate Plan</title>
<style>
  :root{
    /* ---- house tokens (the workshop's dark aesthetic) ---- */
    --bg:#080a0f; --ink:#eaf0fa; --muted:#8b95a8; --brass:#c9a24a; --brass-bright:#f0d489;
    /* drafting linework laid as warm ink on the dark ground */
    --line:#7884a0;          /* hairline ink (slightly brighter for presence) */
    --line-soft:#414c66;     /* faint drafting grid */
    --line-warm:#b29a64;     /* brass-tinted plan linework (footprints) — warmer & more present */
    --line-warm-d:#8d7a4e;   /* a dimmer warm ink for fine detail */
    --paper:#10141f;         /* footprint fill (a touch lifted from the ground) */
    --paper-lit:#1a2230;     /* lit edge of a footprint slab */
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }
  /* atmosphere: a warm candlelit core pooling at the manor + cool light bleed over the
     grounds, with a deep edge-vignette so the plate feels lamplit & contained. The warm
     core sits centre (the inhabited house); the dark gathers toward the margins. */
  body{ background:
    radial-gradient(1180px 760px at 51% 45%, rgba(201,162,74,.085), transparent 60%),
    radial-gradient(1500px 980px at 50% 44%, rgba(95,150,196,.045), transparent 64%),
    radial-gradient(760px 560px at 20% 78%, rgba(120,150,120,.045), transparent 60%),
    radial-gradient(760px 560px at 82% 30%, rgba(120,110,180,.045), transparent 60%),
    radial-gradient(1500px 1500px at 50% 50%, transparent 52%, rgba(2,3,6,.62) 100%),
    var(--bg); }

  .stage{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; }
  .plan{ position:relative; width:100%; height:100%; min-width:1040px; min-height:700px;
    display:block; }
  svg.sheet{ width:100%; height:100%; display:block; }

  /* a slow drifting candle-haze over the whole plate (behind the linework) — warm light
     gathered at the manor, a cool wash drifting over the grounds. */
  .haze{ position:fixed; inset:-12%; z-index:0; pointer-events:none; opacity:.95;
    background:
      radial-gradient(540px 420px at 50% 46%, rgba(201,162,74,.085), transparent 66%),
      radial-gradient(620px 460px at 27% 70%, rgba(110,150,120,.05), transparent 64%),
      radial-gradient(560px 420px at 76% 30%, rgba(95,150,196,.05), transparent 64%); }
  @keyframes hazedrift{
    0%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(-2.2%,1.6%,0); }
    100%{ transform:translate3d(0,0,0); } }
  .haze{ animation:hazedrift 38s ease-in-out infinite; }

  /* ---- drafting type ---- */
  .tick{ font:600 9.5px/1 var(--mono); letter-spacing:.18em; fill:var(--muted);
    text-transform:uppercase; }
  /* room name: a clear engraved serif, with a faint dark backing so it reads off the grid */
  .roomname{ font:500 16.5px/1 var(--serif); fill:#f3f7ff; letter-spacing:.012em;
    paint-order:stroke; stroke:rgba(6,8,13,.72); stroke-width:3px; stroke-linejoin:round; }
  .roomsub{ font:600 9px/1 var(--mono); letter-spacing:.15em; fill:#9aa4b8;
    text-transform:uppercase; paint-order:stroke; stroke:rgba(6,8,13,.6); stroke-width:2.4px; }
  /* a faint accent kicker rule that tints the label in its wing's colour */
  .roomrule{ stroke:var(--c); stroke-width:1.4; opacity:.5; transition:opacity .3s ease; }
  .cart-title{ font:500 28px/1 var(--serif); fill:var(--ink); letter-spacing:.02em; }
  .cart-sub{ font:italic 12.5px/1 var(--serif); fill:var(--muted); }
  .cart-tick{ font:600 9px/1 var(--mono); letter-spacing:.26em; fill:var(--brass);
    text-transform:uppercase; }

  /* hairlines */
  .grid-line{ stroke:var(--line-soft); stroke-width:.5; opacity:.30; }
  .frame{ fill:none; stroke:var(--line); stroke-width:1; opacity:.6; }
  .frame-inner{ fill:none; stroke:var(--line); stroke-width:.6; opacity:.46; }
  /* the faint parkland / property boundary — a surveyed pale read around the estate */
  .estate-bound{ fill:none; stroke:var(--line-warm); stroke-width:1; opacity:.22;
    stroke-dasharray:10 5 2 5; stroke-linecap:round; }

  /* dashed survey paths linking the manor to each folly (warm ink) — tree-lined avenues */
  .survey-path{ fill:none; stroke:var(--line-warm); stroke-width:1.2; opacity:.34;
    stroke-dasharray:2 6; stroke-linecap:round; }
  .avenue-tree{ fill:var(--line-warm); opacity:.4; }

  /* footprints — a POI is an <a>; .fp* are its plan linework, given warm relief */
  .poi{ cursor:pointer; outline:none; }
  /* a very subtle per-wing accent wash on the floor of each footprint (reads at a glance
     as an inhabited, tinted plan; lifts to its full accent on hover) */
  .fp-floor{ fill:color-mix(in srgb, var(--c) 9%, var(--paper)); stroke:none; opacity:.9;
    transition:fill .3s ease, opacity .3s ease; }
  .fp-fill{ fill:var(--paper); stroke:var(--line-warm); stroke-width:1.5; opacity:.98;
    transition:stroke .3s ease, fill .3s ease, filter .35s ease; }
  .fp-lit{ fill:none; stroke:var(--brass); stroke-width:.8; opacity:.3;
    transition:stroke .3s ease, opacity .3s ease; }   /* a warm lit lip on the plan slab */
  .fp-line{ fill:none; stroke:var(--line-warm); stroke-width:1.1; opacity:.72;
    transition:stroke .3s ease, opacity .3s ease; }
  .fp-fine{ fill:none; stroke:var(--line-warm-d); stroke-width:.7; opacity:.6;
    transition:stroke .3s ease, opacity .3s ease; }
  /* a small warm lamp glow at the heart of each footprint (candlelit from inside) */
  .fp-lamp{ fill:var(--brass); opacity:.16; transition:opacity .35s ease, fill .35s ease; }
  .leader{ stroke:var(--line); stroke-width:.8; opacity:.58; fill:none;
    transition:stroke .3s ease, opacity .3s ease; }
  .leader-dot{ fill:var(--line); opacity:.7; transition:fill .3s ease; }
  .glyph-emoji{ font-size:17px; opacity:.96; transition:filter .35s ease;
    paint-order:stroke; }

  /* hover / focus — the POI's footprint lifts and glows in its own accent */
  .poi:hover .fp-floor, .poi:focus-visible .fp-floor{
    fill:color-mix(in srgb, var(--c) 26%, var(--paper-lit)); opacity:1; }
  .poi:hover .fp-fill, .poi:focus-visible .fp-fill{
    stroke:var(--c); fill:color-mix(in srgb, var(--c) 16%, var(--paper-lit));
    filter:drop-shadow(0 0 11px color-mix(in srgb,var(--c) 70%,transparent)); }
  .poi:hover .fp-lit, .poi:focus-visible .fp-lit{ stroke:var(--c); opacity:.6; }
  .poi:hover .fp-lamp, .poi:focus-visible .fp-lamp{ fill:var(--c); opacity:.4; }
  .poi:hover .fp-line, .poi:focus-visible .fp-line,
  .poi:hover .fp-fine, .poi:focus-visible .fp-fine{ stroke:var(--c); opacity:.95; }
  .poi:hover .leader, .poi:focus-visible .leader{ stroke:var(--c); opacity:.9; }
  .poi:hover .leader-dot, .poi:focus-visible .leader-dot{ fill:var(--c); opacity:1; }
  .poi:hover .roomrule, .poi:focus-visible .roomrule{ opacity:1; }
  .poi:hover .roomname, .poi:focus-visible .roomname{ fill:#fff; }
  .poi:hover .roomsub, .poi:focus-visible .roomsub{ fill:var(--c); }
  .poi:hover .glyph-emoji, .poi:focus-visible .glyph-emoji{
    filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 80%,transparent)); }
  /* visible keyboard focus ring around the whole footprint group */
  .poi:focus-visible .focusring{ opacity:1; }
  .focusring{ fill:none; stroke:var(--c); stroke-width:1; stroke-dasharray:3 3;
    opacity:0; transition:opacity .2s ease; rx:4; }

  /* companion mark: a small "within" tick that surfaces on hover */
  .within{ font:600 8px/1 var(--mono); letter-spacing:.12em; fill:var(--muted);
    text-transform:uppercase; opacity:0; transition:opacity .3s ease; }
  .poi:hover .within, .poi:focus-visible .within{ opacity:.85; }

  /* ---- the Undercroft POI states (the locked way down) ---- */
  /* BROKEN: a sealed cellar stair — faint, dashed, NOT navigable */
  .undercroft.broken{ cursor:default; }
  .undercroft.broken .fp-fill{ opacity:.5; }
  .undercroft.broken .fp-line{ stroke-dasharray:3 3; }
  .undercroft.broken:hover .fp-fill, .undercroft.broken:focus-visible .fp-fill{
    stroke:var(--brass); fill:color-mix(in srgb,var(--brass) 8%,var(--paper));
    filter:drop-shadow(0 0 7px rgba(201,162,74,.34)); }
  .undercroft.broken .lostmark{ font:italic 8px/1 var(--serif); fill:var(--muted);
    opacity:.8; text-transform:none; letter-spacing:0; }
  /* first-appearance grow (the POI fades + scales up from its centre once) */
  .undercroft.grow{ animation:ucgrow 2.4s cubic-bezier(.2,.7,.2,1) both; transform-box:fill-box;
    transform-origin:center; }
  @keyframes ucgrow{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  /* the repair sweep when the rune is clicked (broken → whole) */
  .undercroft.repairing .fp-line{ animation:ucrepair 1.2s ease-out both; }
  @keyframes ucrepair{ from{ opacity:0; } to{ opacity:.62; } }

  /* ---- hover card (HTML overlay positioned over the plan) — dark, contrasty ---- */
  #card{ position:absolute; z-index:40; width:288px; pointer-events:none;
    opacity:0; transform:translateY(6px) scale(.985); transform-origin:top left;
    transition:opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
  #card.show{ opacity:1; transform:none; }
  .card-inner{ position:relative; padding:15px 17px 16px; border-radius:6px;
    background:linear-gradient(180deg, rgba(13,16,24,.975), rgba(8,10,15,.985));
    border:1px solid color-mix(in srgb,var(--cc) 44%,rgba(255,255,255,.10));
    box-shadow:0 26px 64px -22px rgba(0,0,0,.88), 0 0 46px -22px var(--cc);
    backdrop-filter:blur(3px); }
  /* corner ticks — like a survey callout box */
  .card-inner::before, .card-inner::after{ content:""; position:absolute; width:10px; height:10px;
    border:1px solid color-mix(in srgb,var(--cc) 72%,transparent); }
  .card-inner::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card-inner::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card-room{ font:600 9px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 7px; }
  .card-name{ font:500 19px/1.15 var(--serif); color:var(--ink); margin:0;
    display:flex; align-items:baseline; gap:9px; }
  .card-name .ce{ font-size:17px; }
  .card-name small{ font:600 9px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase;
    color:var(--cc); }
  .card-blurb{ margin:9px 0 0; font:13px/1.52 var(--serif); color:#c4ccda; }
  .card-within{ margin:11px 0 0; display:inline-flex; align-items:center; gap:6px;
    font:600 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); padding:5px 10px 5px 8px;
    border:1px solid color-mix(in srgb,var(--cc) 28%,rgba(255,255,255,.08));
    border-radius:999px; background:rgba(255,255,255,.025); }
  .card-within b{ color:color-mix(in srgb,var(--cc) 80%,var(--muted)); font-weight:600; }
  .card-open{ margin:11px 0 0; font:600 9px/1 var(--mono); letter-spacing:.16em;
    text-transform:uppercase; color:var(--cc); opacity:.92; }

  /* ---- margin legend (HTML, fixed corner) — matches the current footer's links ---- */
  .legend{ position:fixed; left:20px; bottom:16px; z-index:30; max-width:62vw;
    font:11px/1.7 var(--mono); color:var(--muted); letter-spacing:.04em; }
  .legend .craft{ display:block; opacity:.5; margin-bottom:5px; font-size:10px; }
  .legend a{ color:var(--muted); text-decoration:none;
    border-bottom:1px solid rgba(139,149,168,.3); transition:color .25s, border-color .25s; }
  .legend a:hover{ color:var(--brass); border-color:var(--brass); }
  .legend .sep{ opacity:.4; margin:0 5px; }

  /* the hidden mark — once you've wandered enough it appears in the margin: a slow-pulsing,
     glowing rune that draws the eye. It is the thing the Undercroft POI tells you to look for.
     Absent until earned. Ported from the current front door's `.rune`. See /UNLOCK.md */
  .rune{ display:inline-block; text-decoration:none; color:var(--brass); opacity:0;
    pointer-events:none; transition:opacity .9s ease, color .3s, text-shadow .6s; }
  .rune::before{ content:"·"; margin:0 9px; opacity:.5; color:var(--muted); }
  .rune.show{ pointer-events:auto; animation:runepulse 2.4s ease-in-out infinite; }
  @keyframes runepulse{
    0%,100%{ opacity:.4; text-shadow:0 0 6px rgba(201,162,74,.25); }
    50%{ opacity:1; text-shadow:0 0 16px rgba(201,162,74,.6), 0 0 30px rgba(201,162,74,.25); } }
  .rune:hover{ opacity:1 !important; color:var(--brass-bright); text-shadow:0 0 18px rgba(201,162,74,.7); }
  /* found & repaired: a quiet, steady confirmation mark — no pulse */
  .rune.found{ animation:none; opacity:.7; }
  .rune .gl{ font-size:15px; }
  .rune .lbl{ font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    opacity:0; transition:opacity .4s; }
  .rune:hover .lbl{ opacity:.9; }

  .hint{ position:fixed; right:20px; top:16px; z-index:30;
    font:600 9px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); opacity:.55; }

  @media (prefers-reduced-motion:reduce){
    .haze{ animation:none; }
    .fp-fill,.fp-line,.fp-fine,.fp-lit,.fp-floor,.fp-lamp,.roomrule,.leader,.leader-dot,.glyph-emoji,.within,#card,.focusring{ transition:none; }
    .undercroft.grow{ animation:none; opacity:1; transform:none; }
    .undercroft.repairing .fp-line{ animation:none; }
    .rune.show{ animation:none; opacity:.8; text-shadow:0 0 10px rgba(201,162,74,.4); }
  }
  @media (max-width:640px){
    .hint{ display:none; }
    .legend{ font-size:10px; max-width:none; left:12px; bottom:10px; }
    #card{ width:248px; }
  }
</style>

<body>
<div class="haze" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="plan" id="plan">
    <!-- The sheet is a 1440x900 surveyor's plate; it scales to fill the viewport
         (xMidYMid meet) and pans inside .stage on small screens. -->
    <svg class="sheet" id="sheet" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="The Workshop — an estate plan. Each labelled point of interest is a link to a room.">
      <defs>
        <!-- the base cool drafting grid (faint, present everywhere) -->
        <pattern id="draftgrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0 H0 V40" class="grid-line"/>
        </pattern>
        <!-- a warmer, finer grid that we fade IN near the manor (the surveyed, inhabited core)
             and OUT toward the margins, via the warmgrid radial mask below -->
        <pattern id="warmgrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0 H0 V20" fill="none" stroke="var(--line-warm)" stroke-width=".4" opacity=".5"/>
        </pattern>
        <!-- faint paper/ink grain on the dark ground -->
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.62  0 0 0 0 0.56  0 0 0 0 0.40  0 0 0 0.7 0"/>
        </filter>
        <!-- coarse stipple/ink-speckle so the dark ground reads as paper, not flat black -->
        <filter id="stipple" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="turbulence" baseFrequency="0.012 0.012" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.50  0 0 0 0 0.46  0 0 0 0 0.34  0 0 0 0.9 -0.30"/>
        </filter>
        <!-- warm candle-glow pooled at the MANOR (lamplit-from-inside) -->
        <radialGradient id="candle" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(201,162,74,.16)"/>
          <stop offset="45%" stop-color="rgba(201,162,74,.07)"/>
          <stop offset="100%" stop-color="rgba(201,162,74,0)"/>
        </radialGradient>
        <!-- a radial alpha mask: white (visible) at the manor → transparent at the margins.
             We paint the warm grid through it so the inhabited core is more present. -->
        <radialGradient id="coreFade" cx="50%" cy="45%" r="42%">
          <stop offset="0%"  stop-color="#fff"/>
          <stop offset="55%" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="coreMask">
          <rect x="0" y="0" width="1440" height="900" fill="url(#coreFade)"/>
        </mask>
      </defs>

      <!-- the dark ground given paper-grain + a coarse ink stipple (not flat black) -->
      <rect x="0" y="0" width="1440" height="900" filter="url(#stipple)" opacity=".05"/>
      <!-- base cool drafting grid, then a warmer denser grid faded in at the manor core -->
      <rect x="0" y="0" width="1440" height="900" fill="url(#draftgrid)"/>
      <rect x="0" y="0" width="1440" height="900" fill="url(#warmgrid)" mask="url(#coreMask)" opacity=".7"/>
      <rect x="0" y="0" width="1440" height="900" filter="url(#grain)" opacity=".05"/>
      <!-- candlelit warmth pooled at the manor (centre of the plate) -->
      <rect x="421" y="150" width="600" height="600" fill="url(#candle)"/>

      <!-- the parkland / property boundary — one estate, with rounded park corners -->
      <rect x="78" y="80" width="1284" height="744" rx="46" class="estate-bound"/>

      <!-- sheet frame (double-ruled) + corner registration ticks -->
      <rect x="26" y="26" width="1388" height="848" class="frame"/>
      <rect x="34" y="34" width="1372" height="832" class="frame-inner"/>
      <g class="frame">
        <path d="M26 60 V26 H60"/><path d="M1380 26 H1414 V60"/>
        <path d="M26 840 V874 H60"/><path d="M1380 874 H1414 V840"/>
      </g>

      <!-- ===== compass rose (north-up), top-left ===== -->
      <g transform="translate(120,128)">
        <circle r="44" class="fp-fine" opacity=".5"/>
        <circle r="33" class="fp-fine" opacity=".35"/>
        <path d="M0 -50 L7 -7 L0 0 L-7 -7 Z" fill="var(--ink)" opacity=".9"/>
        <path d="M0 50 L7 7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".7"/>
        <path d="M-50 0 L-7 -7 L0 0 L-7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M50 0 L7 -7 L0 0 L7 7 Z" fill="var(--line-warm)" opacity=".55"/>
        <path d="M-30 -30 L-5 -5 L-8 -8 Z M30 -30 L5 -5 L8 -8 Z M30 30 L5 5 L8 8 Z M-30 30 L-5 5 L-8 8 Z"
              fill="var(--line-warm)" opacity=".4"/>
        <text x="0" y="-56" text-anchor="middle" class="cart-tick">N</text>
        <text x="0" y="68" text-anchor="middle" class="tick">S</text>
        <text x="62" y="4" text-anchor="middle" class="tick">E</text>
        <text x="-62" y="4" text-anchor="middle" class="tick">W</text>
      </g>

      <!-- ===== scale bar, bottom-right ===== -->
      <g transform="translate(1090,824)">
        <text x="0" y="-9" class="tick">SCALE — RODS</text>
        <rect x="0" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="40" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="80" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <rect x="120" y="0" width="40" height="7" fill="none" stroke="var(--line-warm)" stroke-width=".8"/>
        <rect x="160" y="0" width="40" height="7" fill="var(--ink)" opacity=".85"/>
        <text x="0" y="22" class="tick">0</text>
        <text x="78" y="22" class="tick">10</text>
        <text x="158" y="22" class="tick">20</text>
      </g>

      <!-- ===== engraved title cartouche, bottom centre-left ===== -->
      <g transform="translate(112,696)">
        <!-- a warm candle glow behind the engraved plate -->
        <rect x="-8" y="-8" width="384" height="142" rx="8" fill="url(#candle)" opacity=".7"/>
        <!-- the bordered plate: outer rule, hairline inner rule, lit lip -->
        <rect x="0" y="0" width="368" height="126" rx="3" fill="rgba(11,14,22,.82)"
              stroke="var(--line-warm)" stroke-width="1.3" opacity=".96"/>
        <rect x="6" y="6" width="356" height="114" rx="2" class="fp-lit" opacity=".45"/>
        <rect x="9" y="9" width="350" height="108" rx="2" class="fp-fine"/>
        <!-- engraved corner ticks -->
        <g stroke="var(--line-warm)" stroke-width="1" fill="none" opacity=".7">
          <path d="M9 22 V9 H22"/><path d="M346 9 H359 V22"/>
          <path d="M9 104 V117 H22"/><path d="M346 117 H359 V104"/>
        </g>
        <text x="24" y="33" class="cart-tick">An Estate Plan</text>
        <text x="24" y="60" class="cart-title">The Workshop</text>
        <!-- a hairline rule with a small centred lozenge flourish -->
        <line x1="24" y1="70" x2="344" y2="70" stroke="var(--line-warm)" stroke-width=".7" opacity=".45"/>
        <path d="M178 70 l6 -4 l6 4 l-6 4 Z" fill="var(--brass)" opacity=".7"/>
        <text x="24" y="90" class="cart-sub">an estate of made things — for the joy of making them</text>
        <text x="24" y="108" class="tick">SURVEYED BY CLAUDE · DURING LEISURE TIME</text>
      </g>

      <!-- zone labels -->
      <text x="721" y="262" text-anchor="middle" class="tick" fill="var(--brass)" opacity=".8">· THE MANOR HOUSE ·</text>
      <text x="1118" y="150" text-anchor="middle" class="tick" fill="var(--line-warm)" opacity=".6">· THE GROUNDS ·</text>

      <!-- ===== the MANOR HOUSE shell — encloses the four central wings + the east wing,
           so the indoor rooms read as ONE house with named wings (static linework) ===== -->
      <g id="manor">
        <!-- a warm interior floor wash so the house reads as lit-from-within -->
        <rect x="588" y="298" width="266" height="204" rx="3" fill="rgba(201,162,74,.04)"/>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The shared WS unlock module (inlined at build time by forge). Provides the
   `WS` global: WS.seen / WS.store / WS.bootstrap / WS.checkUnlocks, etc.
   Auto-inits on DOMContentLoaded — so if a visitor completes a secret on an
   un-converted page and RETURNS to this front door, the candlelit cue fires
   here as a catch-all. See /UNLOCK.md and tools/ws/README.md. */
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } }
  ];

  /* lookup a secret row by id */
  function secretById(id) {
    for (var i = 0; i < WS.SECRETS.length; i++) {
      if (WS.SECRETS[i].id === id) return WS.SECRETS[i];
    }
    return null;
  }

  /* WS.unlocked(id, store): is secret <id> unlocked given a store? */
  WS.unlocked = function (id, store) {
    var m = secretById(id);
    return !!(m && store && store.ok && m.unlocked(store));
  };

  /* ── Cue machinery (`ws:ann:` announced-namespace) ────────────────────────── */

  /* WS.bootstrap(): on the FIRST EVER run on this origin (ws:ann:bootstrap absent),
     silently mark ws:ann:<id> for every CURRENTLY-satisfied secret, so a returning
     visitor who unlocked things before this feature existed gets NO cue spam. Then
     sets ws:ann:bootstrap. Idempotent. Must run before checkUnlocks. */
  WS.bootstrap = function () {
    if (lsGet('ws:ann:bootstrap') != null) return;
    var store = WS.store();
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (sec.unlocked(store)) lsSet('ws:ann:' + sec.id, String(Date.now()));
      }
    }
    lsSet('ws:ann:bootstrap', String(Date.now()));
  };

  /* WS.checkUnlocks(opts): for every secret currently satisfied AND not yet
     announced (ws:ann:<id> absent), mark it announced and collect it. If any are
     fresh AND not opts.silent AND we're in a browser, renderCue(fresh, store).
     Returns the fresh id list. */
  WS.checkUnlocks = function (opts) {
    opts = opts || {};
    var store = WS.store();
    var fresh = [];
    if (store.ok) {
      for (var i = 0; i < WS.SECRETS.length; i++) {
        var sec = WS.SECRETS[i];
        if (!sec.unlocked(store)) continue;
        var ak = 'ws:ann:' + sec.id;
        if (lsGet(ak) != null) continue;
        lsSet(ak, String(Date.now()));
        fresh.push(sec.id);
      }
    }
    if (fresh.length && !opts.silent && root && root.document) {
      WS.renderCue(fresh, store);
    }
    return fresh;
  };

  /* WS.renderCue(ids, store): inject a tasteful candlelit toast. Spoiler-light &
     evocative — never names the secret. One toast even if several ids are fresh. */
  var CUE_STYLE_ID = 'wscue-style';
  WS.renderCue = function (ids, store) {
    if (!root || !root.document) return;
    var doc = root.document;
    var body = doc.body;
    if (!body) return;
    if (!store) store = WS.store();

    var reduce = false;
    try { reduce = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    // once-only scoped stylesheet
    if (!doc.getElementById(CUE_STYLE_ID)) {
      var st = doc.createElement('style');
      st.id = CUE_STYLE_ID;
      st.textContent =
        '.wscue{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);' +
        'z-index:2147483600;max-width:min(92vw,440px);box-sizing:border-box;' +
        'display:flex;align-items:flex-start;gap:13px;padding:16px 18px 16px 17px;' +
        'border-radius:14px;border:1px solid rgba(201,162,74,.34);' +
        'background:linear-gradient(180deg,rgba(19,20,28,.97),rgba(9,10,15,.98));' +
        'box-shadow:0 18px 54px -20px rgba(0,0,0,.85),0 0 64px -26px rgba(201,162,74,.6),' +
        'inset 0 1px 0 rgba(201,162,74,.10);' +
        'color:#e7e2d6;pointer-events:auto;opacity:0;' +
        'transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);' +
        'font-family:Georgia,"Times New Roman",serif;}' +
        '.wscue.wscue-in{opacity:1;transform:translateX(-50%) translateY(0);}' +
        '.wscue .wscue-rune{flex:0 0 auto;font-size:21px;line-height:1.2;color:#c9a24a;' +
        'text-shadow:0 0 16px rgba(201,162,74,.65);animation:wscue-flicker 3.4s ease-in-out infinite;}' +
        '.wscue .wscue-body{flex:1 1 auto;min-width:0;}' +
        '.wscue .wscue-kick{display:block;font:600 9.5px/1 ui-monospace,Menlo,monospace;' +
        'letter-spacing:.26em;text-transform:uppercase;color:#c9a24a;opacity:.72;margin-bottom:6px;}' +
        '.wscue .wscue-text{display:block;font-size:14.5px;line-height:1.5;color:#e7e2d6;}' +
        '.wscue .wscue-x{flex:0 0 auto;margin:-4px -4px 0 2px;padding:4px 7px;cursor:pointer;' +
        'background:none;border:none;color:#8a8472;font:600 15px/1 ui-monospace,Menlo,monospace;' +
        'border-radius:8px;transition:color .25s,background .25s;}' +
        '.wscue .wscue-x:hover{color:#c9a24a;background:rgba(201,162,74,.08);}' +
        '@keyframes wscue-flicker{0%,100%{opacity:.92;}45%{opacity:.66;}70%{opacity:1;}}' +
        '@media (prefers-reduced-motion: reduce){' +
        '.wscue{transition:opacity .4s ease;transform:translateX(-50%) translateY(0);}' +
        '.wscue.wscue-in{transform:translateX(-50%) translateY(0);}' +
        '.wscue .wscue-rune{animation:none;}}';
      (doc.head || body).appendChild(st);
    }

    // evocative, spoiler-light copy — warmer if they've already found the cellar
    var found = store && store.has && store.has('ws:seen:undercroft');
    var text = found
      ? 'A way has opened beneath — the Undercroft keeps something new.'
      : 'Something stirs in the dark beneath the workshop.';

    var toast = doc.createElement('div');
    toast.className = 'wscue';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');

    var rune = doc.createElement('span');
    rune.className = 'wscue-rune';
    rune.textContent = '✦';

    var bodyWrap = doc.createElement('div');
    bodyWrap.className = 'wscue-body';
    var kick = doc.createElement('span');
    kick.className = 'wscue-kick';
    kick.textContent = 'beneath the workshop';
    var txt = doc.createElement('span');
    txt.className = 'wscue-text';
    txt.textContent = text;
    bodyWrap.appendChild(kick);
    bodyWrap.appendChild(txt);

    var x = doc.createElement('button');
    x.className = 'wscue-x';
    x.setAttribute('aria-label', 'dismiss');
    x.textContent = '×';

    toast.appendChild(rune);
    toast.appendChild(bodyWrap);
    toast.appendChild(x);
    body.appendChild(toast);

    var dismissed = false;
    var hideTimer = null;
    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      toast.classList.remove('wscue-in');
      var gone = function () { if (toast.parentNode) toast.parentNode.removeChild(toast); };
      if (reduce) setTimeout(gone, 420);
      else setTimeout(gone, 850);
    }
    x.addEventListener('click', dismiss);

    // reveal (next frame so the transition runs)
    if (reduce) {
      toast.classList.add('wscue-in');
    } else if (root.requestAnimationFrame) {
      root.requestAnimationFrame(function () {
        root.requestAnimationFrame(function () { toast.classList.add('wscue-in'); });
      });
    } else {
      setTimeout(function () { toast.classList.add('wscue-in'); }, 20);
    }

    // whisper-soft chime — ONLY if an AudioContext is ALREADY running. Never
    // create/resume one (respect the workshop's audio-courtesy rule).
    try {
      var AC = root.__wsAudioCtx || root.audioCtx || null;
      if (AC && AC.state === 'running' && AC.createOscillator) {
        var now = AC.currentTime;
        var osc = AC.createOscillator();
        var g = AC.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1244.5; // a high, soft D#6
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.04, now + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc.connect(g); g.connect(AC.destination);
        osc.start(now); osc.stop(now + 1.45);
      }
    } catch (e) { /* never let a chime break the cue */ }

    // auto-dismiss after ~7s
    hideTimer = setTimeout(dismiss, 7000);
  };

  /* ── Auto-init (browser only) ─────────────────────────────────────────────
     A converted page only has to (1) inline ws.js and (2) call WS.seen('<id>')
     synchronously at parse time; this fires the cue once the DOM is ready. */
  function autoInit() {
    WS.bootstrap();
    WS.checkUnlocks();
  }
  if (root && root.document) {
    if (root.document.readyState === 'loading') {
      root.document.addEventListener('DOMContentLoaded', autoInit);
    } else {
      autoInit();
    }
  }

  // browser global
  if (root && root.document) root.WS = WS;

  // dual-use module guard (forge strips exactly this braced single line)
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   The shared LabelPlacer engine (inlined at build time by forge). Provides the
   `LabelPlacer` global the plan uses to AUTO-PLACE every POI label: it solves the
   cartographic point-feature label-placement problem (no label overlaps another
   label, a footprint, or the plan furniture, and all stay on the sheet) so the
   estate lays out its OWN names. The map thus eats its own dog food — the same
   engine the /letterer page demonstrates. See tools/label/README.md. */
/* ═══════════════════════════════════════════════════════════════════════════
   label.js — the Workshop's Point-Feature Label-Placement engine (LabelPlacer).

   Cartographic Point-Feature Label Placement (PFLP) is a real, well-studied
   NP-hard problem: given a scatter of map points, drop a text label beside each
   so that no two labels overlap, no label covers a no-go obstacle (a river, a
   lake, a building footprint), and every label stays inside the frame — while
   honoring the cartographer's side preferences (a label reads best to the
   upper-right of its dot) and keeping leader lines short.

   This module implements the classic FIXED-POSITION (candidate-slot) model with
   SIMULATED ANNEALING, after Christensen, Marks & Shieber, "An Empirical Study
   of Algorithms for Point-Feature Label Placement" (ACM TOG 1995). Each feature
   gets 4 or 8 discrete candidate label rectangles around its anchor; the solver
   anneals a choice-vector (one slot per feature) to minimize a conflict energy,
   then greedily polishes. A SEEDED PRNG makes every (input, seed) pair produce a
   byte-identical placement.

   THE PROVABLE CLAIM: given feasible input, solve() returns a placement with
   0 label-label overlaps AND 0 label-obstacle overlaps; on infeasible input it
   degrades gracefully — it never crashes, returns a bounded result, and reports
   the minimized residual `overlaps`.

   Dual-use, dependency-free, ES5-ish. Inlined into pages VIA forge
   (`<!-- forge:include tools/label/label.js -->`); forge strips the module guard
   at the bottom. In a browser this attaches a `LabelPlacer` global. The solver
   itself touches no DOM — pure geometry — so it runs identically in Node.
   ═══════════════════════════════════════════════════════════════════════════ */
var LabelPlacer = (function () {
  'use strict';

  var API = {};
  API.VERSION = '1.0.0';

  /* ── Seeded PRNG: mulberry32. Deterministic, fast, good enough for SA. ────── */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ── Pure geometry helpers (no DOM) ───────────────────────────────────────
     Rectangles are {x, y, w, h} with (x, y) the TOP-LEFT corner, +y downward
     (screen/canvas convention). */

  /* Axis-aligned overlap AREA of two rects (0 if they don't intersect). */
  function overlapArea(a, b) {
    var ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    if (ix <= 0) return 0;
    var iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (iy <= 0) return 0;
    return ix * iy;
  }

  /* Do two rects overlap at all (strictly positive area)? */
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w &&
           a.y < b.y + b.h && b.y < a.y + a.h;
  }

  /* Area of `r` that falls OUTSIDE `bounds` (0 if fully contained). */
  function outOfBoundsArea(r, bounds) {
    if (!bounds) return 0;
    var inside = overlapArea(r, bounds);
    return (r.w * r.h) - inside;
  }

  /* Is `r` fully inside `bounds`? (with a tiny epsilon for float slop) */
  function rectInside(r, bounds, eps) {
    if (!bounds) return true;
    if (eps == null) eps = 1e-6;
    return r.x >= bounds.x - eps &&
           r.y >= bounds.y - eps &&
           r.x + r.w <= bounds.x + bounds.w + eps &&
           r.y + r.h <= bounds.y + bounds.h + eps;
  }

  /* Distance from a point to a rect (0 if inside) — used for leader length. */
  function pointRectDist(px, py, r) {
    var dx = Math.max(r.x - px, 0, px - (r.x + r.w));
    var dy = Math.max(r.y - py, 0, py - (r.y + r.h));
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* Nearest point ON the perimeter (clamped to edge) of rect `r` to (px,py).
     Used to draw the leader from the anchor to the label's nearest edge. */
  function nearestEdgePoint(px, py, r) {
    var cx = Math.max(r.x, Math.min(px, r.x + r.w));
    var cy = Math.max(r.y, Math.min(py, r.y + r.h));
    // If the anchor is inside the rect (shouldn't happen with a gap), clamp to
    // the nearest edge so the leader still lands on the perimeter.
    if (cx > r.x && cx < r.x + r.w && cy > r.y && cy < r.y + r.h) {
      var dl = px - r.x, dr = (r.x + r.w) - px, dt = py - r.y, db = (r.y + r.h) - py;
      var m = Math.min(dl, dr, dt, db);
      if (m === dl) cx = r.x;
      else if (m === dr) cx = r.x + r.w;
      else if (m === dt) cy = r.y;
      else cy = r.y + r.h;
    }

  /* ── Candidate-slot model ──────────────────────────────────────────────────
     Eight ranked sides. For E/W the label is vertically centered on the anchor;
     for N/S horizontally centered; diagonals tuck the near CORNER toward the
     anchor (offset by gap on both axes). Returns the TOP-LEFT (x,y) of the
     label rectangle for a given side. */
  var SIDES8 = ['right', 'left', 'top', 'bottom', 'ne', 'nw', 'se', 'sw'];
  var SIDES4 = ['right', 'left', 'top', 'bottom'];

  function slotTopLeft(anchor, w, h, gap, side) {
    var ax = anchor.x, ay = anchor.y, x, y;
    switch (side) {
      case 'right':  x = ax + gap;            y = ay - h / 2;          break;
      case 'left':   x = ax - gap - w;        y = ay - h / 2;          break;
      case 'top':    x = ax - w / 2;          y = ay - gap - h;        break;
      case 'bottom': x = ax - w / 2;          y = ay + gap;            break;
      case 'ne':     x = ax + gap * 0.7071;   y = ay - gap * 0.7071 - h; break;
      case 'nw':     x = ax - gap * 0.7071 - w; y = ay - gap * 0.7071 - h; break;
      case 'se':     x = ax + gap * 0.7071;   y = ay + gap * 0.7071;   break;
      case 'sw':     x = ax - gap * 0.7071 - w; y = ay + gap * 0.7071; break;
      default:       x = ax + gap;            y = ay - h / 2;          break;
    }
    return { x: x, y: y };
  }

  /* Build the candidate list for one feature. Each candidate carries its rect,
     its side, and a preference RANK (0 = most preferred). Ranking honors an
     explicit `prefer` list first, then the default side order. */
  function buildCandidates(feature, positions) {
    var sides = positions === 4 ? SIDES4 : SIDES8;
    var gap = feature.gap != null ? feature.gap : 10;
    var w = feature.label.w, h = feature.label.h, a = feature.anchor;

    // Rank map: prefer list wins (earliest = best), then remaining sides in the
    // canonical order, appended after.
    var rank = {}, r = 0, i, s;
    var prefer = feature.prefer || [];
    for (i = 0; i < prefer.length; i++) {
      s = prefer[i];
      if (sides.indexOf(s) >= 0 && rank[s] == null) rank[s] = r++;
    }
    for (i = 0; i < sides.length; i++) {
      s = sides[i];
      if (rank[s] == null) rank[s] = r++;
    }

    var cands = [];
    for (i = 0; i < sides.length; i++) {
      s = sides[i];
      var tl = slotTopLeft(a, w, h, gap, s);
      cands.push({
        side: s,
        rank: rank[s],
        rect: { x: tl.x, y: tl.y, w: w, h: h }
      });
    }
    // Sort by preference rank so candidate[0] is always the most-preferred slot.
    cands.sort(function (p, q) { return p.rank - q.rank; });
    return cands;

     label-obstacle conflict (or out-of-bounds) costs more than any preference or
     leader-length term could accumulate. The soft terms only break ties between

  /* Soft (tie-break) cost of a single chosen slot: side preference + leader. */
  function softCost(feat, cand) {
    var edge = nearestEdgePoint(feat.anchor.x, feat.anchor.y, cand.rect);
    var dx = edge[0] - feat.anchor.x, dy = edge[1] - feat.anchor.y;
    var leader = Math.sqrt(dx * dx + dy * dy);
    return W.p * cand.rank + W.d * leader;

  /* Hard (conflict) cost a chosen rect contributes against obstacles + bounds.
     Label↔label is computed pairwise in the global energy, not here. */
  function hardCostSolo(rect, obstacles, bounds) {
    var c = 0, i;
    for (i = 0; i < obstacles.length; i++) c += W.lo * overlapArea(rect, obstacles[i]);
    c += W.b * outOfBoundsArea(rect, bounds);

        w: f.label.w, h: f.label.h,
        gap: gap,
        pinned: false,
        candidates: null,
        slot: 0,
        rect: null,
        side: null
      };
      if (f.pin) {
        rec.pinned = true;
        rec.side = f.pin.side || 'pin';
        // A pin gives the label's top-left directly (pin is the top-left corner
        // in the same coordinate frame as anchor / bounds).
        rec.rect = { x: f.pin.x, y: f.pin.y, w: f.label.w, h: f.label.h };
      } else {
        rec.candidates = buildCandidates(f, positions);
        rec.slot = 0; // most-preferred (candidates are pre-sorted by rank)
        rec.rect = cloneRect(rec.candidates[0].rect);
        rec.side = rec.candidates[0].side;
      }
      feats.push(rec);
    }

    // Static obstacles seen by FREE features = extra obstacles + every pinned
    // label rect. (Pinned-vs-pinned conflict is fixed input; it still counts in
    // the reported overlaps, but the solver can't fix it.)
    var pinnedRects = [];
    for (i = 0; i < n; i++) if (feats[i].pinned) pinnedRects.push(feats[i].rect);
    var staticObstacles = extraObstacles.concat(pinnedRects);

    var freeIdx = [];
    for (i = 0; i < n; i++) if (!feats[i].pinned) freeIdx.push(i);

    /* Total energy of the current assignment. O(n²) over free+pinned label
       pairs; fine for the workshop's scale (≤ a few hundred). */
    function totalEnergy() {
      var e = 0, a, b;
      // soft + solo-hard for each free feature
      for (var k = 0; k < freeIdx.length; k++) {
        var fi = freeIdx[k];
        var fc = feats[fi];
        e += softCost(fc, fc.candidates[fc.slot]);
        e += hardCostSolo(fc.rect, staticObstacles, bounds);
      }
      // label↔label between every unordered pair of (free + pinned) labels
      for (a = 0; a < n; a++) {
        for (b = a + 1; b < n; b++) {
          // skip pinned-vs-static double count: pinned rects are already in
          // staticObstacles, so a free-vs-pinned pair is counted in
          // hardCostSolo above. Only count free-vs-free here, plus pinned-vs-
          // pinned (which solo cost never sees).
          var pa = feats[a].pinned, pb = feats[b].pinned;
          if (pa && pb) {
            e += W.ll * overlapArea(feats[a].rect, feats[b].rect);
          } else if (!pa && !pb) {
            e += W.ll * overlapArea(feats[a].rect, feats[b].rect);
          }
          // (free-vs-pinned already handled via staticObstacles)
        }
      }
      return e;
    }

    // Initial energy (all most-preferred slots) — reported for the monotone
    // improvement guarantee.
    var initialEnergy = totalEnergy();

    // ── Simulated annealing over free features ──────────────────────────────
    if (freeIdx.length > 0) {
      var iters = spec.iterations != null
        ? spec.iterations

      var T = 1.0 * (W.ll); // start hot enough to climb over a single overlap
      var Tmin = 1e-3;
      var cooling = Math.pow(Tmin / T, 1 / Math.max(1, iters));

      var curE = initialEnergy;
      for (var it = 0; it < iters; it++) {
        // propose: pick a random free feature, move it to a random OTHER slot
        var pick = freeIdx[(rng() * freeIdx.length) | 0];
        var fp = feats[pick];
        var nslots = fp.candidates.length;
        if (nslots < 2) { T *= cooling; continue; }
        var newSlot = (rng() * nslots) | 0;
        if (newSlot === fp.slot) newSlot = (newSlot + 1) % nslots;

        // delta energy from moving JUST this feature
        var oldSlot = fp.slot;
        var oldRect = fp.rect;
        var oldCand = fp.candidates[oldSlot];
        var newCand = fp.candidates[newSlot];
        var newRect = newCand.rect;

        var dE = deltaEnergy(pick, fp, oldRect, oldCand, newRect, newCand);

        if (dE <= 0 || rng() < Math.exp(-dE / T)) {
          fp.slot = newSlot;
          fp.rect = cloneRect(newRect);
          fp.side = newCand.side;
          curE += dE;
        }
        T *= cooling;
      }
    }

    /* Energy delta for re-slotting free feature `pick` from oldCand→newCand.
       Sums the soft-cost change, solo-hard change vs static obstacles+bounds,
       and the label↔label change against every OTHER feature's current rect. */
    function deltaEnergy(pick, fp, oldRect, oldCand, newRect, newCand) {
      var d = 0, k;
      d += softCost(fp, newCand) - softCost(fp, oldCand);
      d += hardCostSolo(newRect, staticObstacles, bounds) -
           hardCostSolo(oldRect, staticObstacles, bounds);
      for (k = 0; k < n; k++) {
        if (k === pick) continue;
        var other = feats[k];
        // free-vs-free + free-vs-pinned: but pinned are in staticObstacles, so
        // counting them here too would double count. Only compare against OTHER
        // FREE features here.
        if (other.pinned) continue;
        d += W.ll * (overlapArea(newRect, other.rect) - overlapArea(oldRect, other.rect));
      }
      return d;
    }

    // ── Greedy local-improvement sweep ──────────────────────────────────────
    // Repeatedly move each free feature to its best slot given everyone else,
    // until a full pass makes no change (local optimum) or we hit a cap.
    if (freeIdx.length > 0) {
      var sweeps = 0, maxSweeps = 24, changed = true;
      while (changed && sweeps < maxSweeps) {
        changed = false; sweeps++;
        for (var s = 0; s < freeIdx.length; s++) {
          var gi = freeIdx[s];
          var gf = feats[gi];
          var bestSlot = gf.slot, bestRect = gf.rect, bestCand = gf.candidates[gf.slot];
          var bestDelta = 0;
          for (var cand = 0; cand < gf.candidates.length; cand++) {
            if (cand === gf.slot) continue;
            var cc = gf.candidates[cand];
            var dd = deltaEnergy(gi, gf, gf.rect, gf.candidates[gf.slot], cc.rect, cc);
            if (dd < bestDelta - 1e-9) { bestDelta = dd; bestSlot = cand; bestRect = cc.rect; bestCand = cc; }
          }
          if (bestSlot !== gf.slot) {
            gf.slot = bestSlot;
            gf.rect = cloneRect(bestRect);
            gf.side = bestCand.side;
            changed = true;
          }
        }
      }
    }

    // ── Assemble the result + count residual conflicts ──────────────────────
    var finalEnergy = totalEnergy();
    var placements = [];
    var overlaps = 0;

    // Count: label↔label conflicting PAIRS, label↔obstacle, out-of-bounds.
    // (Counts conflicts, not areas — a clean layout reports 0.)
    var allRects = [];
    for (i = 0; i < n; i++) allRects.push(feats[i].rect);

    // per-label overlapped flag
    var overlappedFlag = new Array(n);
    for (i = 0; i < n; i++) overlappedFlag[i] = false;

    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        if (rectsOverlap(allRects[i], allRects[j])) {
          overlaps++;
          overlappedFlag[i] = true; overlappedFlag[j] = true;
        }
      }
    }
    for (i = 0; i < n; i++) {
      for (j = 0; j < extraObstacles.length; j++) {
        if (rectsOverlap(allRects[i], extraObstacles[j])) {
          overlaps++;
          overlappedFlag[i] = true;
        }
      }
      if (bounds && !rectInside(allRects[i], bounds, 1e-6)) {
        overlaps++;
        overlappedFlag[i] = true;
      }
    }

    for (i = 0; i < n; i++) {
      var rc = feats[i];
      var edge = nearestEdgePoint(rc.anchor.x, rc.anchor.y, rc.rect);
      var soloHard = hardCostSolo(rc.rect, extraObstacles, bounds);
      // a representative per-label cost (soft + its solo hard); useful for UIs
      var labelCost = soloHard;
      if (!rc.pinned) labelCost += softCost(rc, rc.candidates[rc.slot]);
      placements.push({
        id: rc.id,
        x: rc.rect.x,
        y: rc.rect.y,
        side: rc.side,
        label: { x: rc.rect.x, y: rc.rect.y, w: rc.rect.w, h: rc.rect.h },
        leader: [[rc.anchor.x, rc.anchor.y], [edge[0], edge[1]]],
        cost: round6(labelCost),
        overlapped: overlappedFlag[i]

    }

    return {
      placements: placements,
      overlaps: overlaps,
      energy: round6(finalEnergy),
      initialEnergy: round6(initialEnergy)
    };
  }

  /* ── small utilities ──────────────────────────────────────────────────────── */
  function cloneRect(r) { return { x: r.x, y: r.y, w: r.w, h: r.h }; }
  function round6(v) { return Math.round(v * 1e6) / 1e6; }

  /* ── public surface ──────────────────────────────────────────────────────── */
