<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Weighted Lid — art preview</title>
<style>
  html,body{margin:0;height:100%;background:#070809;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="720" height="480"></canvas>
<!-- the candidate asset module assigns window.__LID and/or window.__PLATE -->
<script src="asset.js"></script>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;

  /* the exhibit's dark rock box with a warm-amber inner frame (the real vessel) */
  var boxX=90, boxW=460, boxTop=40, boxH=400, boxBottom=boxTop+boxH;
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
  var bg=ctx.createRadialGradient(W*0.35,-40,60,W*0.35,H*0.4,W*0.9);
  bg.addColorStop(0,'rgba(230,176,102,0.05)'); bg.addColorStop(1,'#070809');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#05060a'; ctx.fillRect(boxX,boxTop,boxW,boxH);
  ctx.strokeStyle='rgba(230,176,102,0.16)'; ctx.lineWidth=1; ctx.strokeRect(boxX+0.5,boxTop+0.5,boxW-1,boxH-1);

  /* a shallow gas below the lid, coloured by speed, for true context */
  function speedColor(t){ var s=[[0x6f,0xb3,0xff],[0x7f,0xd4,0xc0],[0xe6,0xb0,0x66],[0xf0,0x8a,0x5d]];
    var seg=t*(s.length-1), i=Math.min(s.length-2,Math.floor(seg)), f=seg-i, a=s[i], b=s[i+1];
    return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')'; }
  var lidY=boxTop+150, th=13;
  for(var k=0;k<260;k++){ var rx=boxX+8+Math.random()*(boxW-16), ry=lidY+th+6+Math.random()*(boxBottom-lidY-th-12);
    ctx.beginPath(); ctx.arc(rx,ry,2.4,0,6.2832); ctx.fillStyle=speedColor(Math.random()); ctx.globalAlpha=0.9; ctx.fill(); }
  ctx.globalAlpha=1;

  /* ── placeholder art (replaced by the candidate when present) ── */
  function phLid(ctx,x,yTop,w,t){ var g=ctx.createLinearGradient(0,yTop,0,yTop+t);
    g.addColorStop(0,'#b8c0c8'); g.addColorStop(0.5,'#7f878f'); g.addColorStop(1,'#4b5158');
    ctx.fillStyle=g; ctx.fillRect(x,yTop,w,t); ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(x,yTop,w,1.5); }
  function phPlate(ctx,cx,cy,pw,ph,wt){ var g=ctx.createLinearGradient(0,cy-ph/2,0,cy+ph/2);
    g.addColorStop(0,'#3a4046'); g.addColorStop(1,'#171b1f'); ctx.fillStyle=g; ctx.fillRect(cx-pw/2,cy-ph/2,pw,ph);
    ctx.beginPath(); ctx.arc(cx,cy,ph*0.2,0,6.2832); ctx.fillStyle='#0a0c0f'; ctx.fill();
    ctx.fillStyle='rgba(230,176,102,0.9)'; ctx.font='600 '+Math.round(ph*0.42)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(''+wt, cx+pw*0.26, cy); ctx.textBaseline='alphabetic'; }

  var LID=window.__LID||phLid, PLATE=window.__PLATE||phPlate;

  /* the machined lid bar, spanning the box */
  LID(ctx, boxX, lidY, boxW, th);

  /* three gym-plates stacked on the lid (weights 80 / 110 / 150) */
  var cx=boxX+boxW/2, plates=[80,110,150];
  for(var i=0;i<plates.length;i++){ var ph=18, pw=Math.max(70, 120+plates[i]*0.3);
    PLATE(ctx, cx, lidY-(i+0.5)*ph, pw, ph, plates[i]); }

  /* a rack of two spare plates at the right */
  PLATE(ctx, boxX+boxW+80, boxTop+60, 120, 18, 80);
  PLATE(ctx, boxX+boxW+80, boxTop+110, 140, 18, 110);

  if(!window.__LID && !window.__PLATE){ ctx.fillStyle='#f08a7a'; ctx.font='15px monospace'; ctx.textAlign='left';
    ctx.fillText('candidate set neither window.__LID nor window.__PLATE', 90, H-16); }
})();
</script>
</body>
</html>
