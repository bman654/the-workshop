<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pendulum-Wave bob-glow preview</title>
<style>
  html,body{margin:0;height:100%;background:#070809;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="720" height="480"></canvas>
<!-- the candidate asset module: assigns window.__ASSET (and optionally window.__HUE) -->
<script src="asset.js"></script>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, N = 15;

  /* fallback hue ramp (teal → indigo) if the candidate does not ship one */
  var HUE = window.__HUE || function(h){
    var a=[127,212,192], b=[177,140,255];
    return [Math.round(a[0]+(b[0]-a[0])*h), Math.round(a[1]+(b[1]-a[1])*h), Math.round(a[2]+(b[2]-a[2])*h)];
  };
  var GLOW = window.__ASSET;   /* the candidate bob-glow: fn(ctx,x,y,r,hue01,intensity) */

  /* dark contemplative backdrop with a cold vignette, matching the exhibit */
  var bg = ctx.createRadialGradient(W/2, H*0.36, 40, W/2, H*0.36, W*0.8);
  bg.addColorStop(0,'#10131a'); bg.addColorStop(0.55,'#0a0c11'); bg.addColorStop(1,'#060709');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  /* a faint level beam so the glow reads in true context */
  ctx.strokeStyle='rgba(150,170,190,0.28)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(40,70); ctx.lineTo(W-40,70); ctx.stroke();

  /* the wave shape: 15 bobs on a travelling-wave arc, hue 0→1, intensity swelling
   * toward the middle (fast bobs) — plus a couple of overlapping stamps so the
   * judge sees the ADDITIVE blend the trail layer relies on. */
  function bobXY(i){
    var x = 60 + (W-120) * (i/(N-1));
    var phase = i/(N-1) * Math.PI * 1.6;
    var y = 150 + Math.sin(phase) * 150;
    return [x,y];
  }

  ctx.globalCompositeOperation = 'lighter';
  /* trail ghosts (dimmer, offset) to exercise additive overlap */
  for(var g=0; g<N; g++){
    var p = bobXY(g), hue = g/(N-1);
    var inten = 0.3 + 0.4*Math.abs(Math.sin(g/(N-1)*Math.PI));
    if(GLOW){ GLOW(ctx, p[0]-6, p[1]-4, 16, hue, inten*0.5); GLOW(ctx, p[0]-3, p[1]-2, 15, hue, inten*0.7); }
  }
  /* the bobs themselves, sharp */
  for(var i=0;i<N;i++){
    var pp = bobXY(i), h = i/(N-1);
    var intensity = 0.55 + 0.45*Math.abs(Math.sin(i/(N-1)*Math.PI));
    if(GLOW) GLOW(ctx, pp[0], pp[1], 13, h, intensity);
    /* solid core, for scale reference */
    var c = HUE(h);
    ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+',0.95)';
    ctx.beginPath(); ctx.arc(pp[0], pp[1], 3.6, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  if(!GLOW){
    ctx.fillStyle='#f08a7a'; ctx.font='16px monospace';
    ctx.fillText('candidate did not set window.__ASSET', 60, H-40);
  }
})();
</script>
</body>
</html>
