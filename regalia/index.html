<!DOCTYPE html>
<!-- ════════════════════════════════════════════════════════════════════════════════════════
     THE ORDER OF THE GRAND CARTOGRAPHER — a pendant struck for the makers of the Orrery Estate,
     awarded for the front-door map redrawn true (the district/slot survey that lets a visitor
     find any wing). The honor: a surveyor's iron Gunter's-chain from which hangs a pocket-watch-
     sized circumferentor — naval brass with an oil-rubbed patina, two sight vanes on clockwork
     hinges, a domed bevelled glass over a silvered compass face engraved in the front-door
     district serif, and a sapphire magnetized needle that always seeks home. Turn the medal and
     the dial swings while the needle stubbornly re-finds north; flip it and the solid brass back
     is inscribed "For Masterful Delineation of the Orrery Estate & All Its Wings. May Your Needle
     Never Waver." The makers' keepsake — regalia, a sibling to the Cairn and the ledger's
     medallion. NOT linked from the deployed estate; it owes no math proof. A file is just a file.
     Opens by double-click. Pure inline SVG + a small vanilla-JS tick. No deps, no canvas, no network.
     ════════════════════════════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Order of the Grand Cartographer — a pendant for the makers of the Orrery Estate</title>
<style>
  /* The front-door tokens, verbatim — the ONLY palette permitted, plus a patina dark and a
     sapphire pair DERIVED for the metal and the jewel. (index.src.html:8 + :18 district serif.) */
  :root{
    --bg:#080a0f;            /* the void / front-door ground          */
    --ink:#eaf0fa;           /* paper ink                              */
    --brass:#c9a24a;         /* the gilt                               */
    --brass-bright:#f0d489;  /* the lamp-struck high                   */
    --patina:#1c1810;        /* oil-rubbed dark passage (derived)      */
    --sapphire:#2b5cff;      /* the needle's deep blue (derived)       */
    --sapphire-lit:#9fc0ff;  /* the needle's faceted glint (derived)   */
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;   /* front-door district token, verbatim */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    /* unlit black velvet — a radial vignette so the jewel floats (the writ's vitrine) */
    background-image:radial-gradient(120% 90% at 42% 38%, #0c0e15 0%, #0a0c12 46%, #080a0f 100%);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
  }
  /* the case sits in a perspective stage so the disc can flip in real 3D depth */
  #stage{
    width:min(94vw, 600px);
    perspective:1700px;
    display:flex; align-items:center; justify-content:center;
    padding:18px 0 26px;
  }
  svg#medal{ display:block; width:100%; height:auto; overflow:visible; }
  /* the disc wrapper is the ONLY thing that flips — chain + tallies stay in front */
  .flip3d{ transform-style:preserve-3d; }
  /* a faint hint, fades on first interaction */
  #hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font-family:var(--serif); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(201,162,74,.42); text-shadow:0 1px 0 #000; white-space:nowrap;
    transition:opacity .8s ease; pointer-events:none; text-align:center;
  }
  #hint.gone{ opacity:0; }
  @media (prefers-reduced-motion: reduce){ #hint{ display:none; } }
</style>
</head>
<body>
<div id="stage">
  <!-- viewBox tuned tall: chain + neck tallies up top, the circumferentor resting in the case -->
  <svg id="medal" viewBox="0 0 600 820" role="img"
       aria-label="A struck-brass pendant: a surveyor's circumferentor on an iron chain, its sapphire needle pointing home.">
    <defs>
      <!-- ── velvet vitrine vignette so the jewel floats against unlit black ── -->
      <radialGradient id="velvet" cx="42%" cy="38%" r="78%">
        <stop offset="0"  stop-color="#0c0e15"/>
        <stop offset=".55" stop-color="#0a0c12"/>
        <stop offset="1"  stop-color="#080a0f"/>
      </radialGradient>

      <!-- ── struck naval brass: rim highlight → field → patina → near-black incised edge ──
           the darkest passage matches the estate's deep-midnight grid (#080a0f-ish). ── -->
      <radialGradient id="brassDisc" cx="40%" cy="34%" r="74%">
        <stop offset="0"   stop-color="#f0d489"/>
        <stop offset=".30" stop-color="#c9a24a"/>
        <stop offset=".62" stop-color="#6e5a24"/>
        <stop offset=".86" stop-color="#2a2210"/>
        <stop offset="1"   stop-color="#0c0a06"/>
      </radialGradient>
      <!-- the raised bezel ring: a brighter band that catches the upper-left lamp -->
      <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"   stop-color="#f7e2ac"/>
        <stop offset=".34" stop-color="#c9a24a"/>
        <stop offset=".70" stop-color="#6e5a24"/>
        <stop offset="1"   stop-color="#3a2f14"/>
      </linearGradient>
      <!-- plain warm brass for the SOLID BACK -->
      <radialGradient id="brassBack" cx="40%" cy="34%" r="80%">
        <stop offset="0"   stop-color="#e7cd86"/>
        <stop offset=".34" stop-color="#c9a24a"/>
        <stop offset=".70" stop-color="#7a6328"/>
        <stop offset=".92" stop-color="#3a2f14"/>
        <stop offset="1"   stop-color="#1c1810"/>
      </radialGradient>

      <!-- ── the silvered compass face: cool silver-white, lit upper-left ── -->
      <radialGradient id="silver" cx="40%" cy="34%" r="72%">
        <stop offset="0"   stop-color="#f4f7fc"/>
        <stop offset=".42" stop-color="#e9edf4"/>
        <stop offset=".78" stop-color="#c5ccd9"/>
        <stop offset="1"   stop-color="#aab3c4"/>
      </radialGradient>

      <!-- ── the sapphire needle gem ── -->
      <linearGradient id="sapphire" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0"   stop-color="#1c3aa8"/>
        <stop offset=".45" stop-color="#2b5cff"/>
        <stop offset="1"   stop-color="#9fc0ff"/>
      </linearGradient>
      <radialGradient id="gemBezel" cx="38%" cy="32%" r="70%">
        <stop offset="0" stop-color="#f7e2ac"/>
        <stop offset="1" stop-color="#6e5a24"/>
      </radialGradient>
      <!-- the jeweled center-cap pivot -->
      <radialGradient id="capJewel" cx="38%" cy="32%" r="70%">
        <stop offset="0"   stop-color="#fff"/>
        <stop offset=".4"  stop-color="#9fc0ff"/>
        <stop offset="1"   stop-color="#2b5cff"/>
      </radialGradient>

      <!-- ── antiqued brass for the chain links (drawn-wire look) ── -->
      <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"   stop-color="#e7cd86"/>
        <stop offset=".5"  stop-color="#a8842e"/>
        <stop offset="1"   stop-color="#5a4a1e"/>
      </linearGradient>
      <linearGradient id="tally" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#e7cd86"/>
        <stop offset=".55" stop-color="#b8902f"/>
        <stop offset="1"   stop-color="#5a4a1e"/>
      </linearGradient>

      <!-- the bevelled-glass dome sheen -->
      <radialGradient id="dome" cx="36%" cy="28%" r="64%">
        <stop offset="0"   stop-color="#ffffff" stop-opacity=".40"/>
        <stop offset=".5"  stop-color="#ffffff" stop-opacity=".07"/>
        <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>

      <!-- soft drop shadow so the disc reads as a struck object resting in the case -->
      <filter id="cast" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".62"/>
      </filter>
      <filter id="castSmall" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="2.4" stdDeviation="2.4" flood-color="#000" flood-opacity=".5"/>
      </filter>

      <!-- clip the dome sheen to the glass circle -->
      <clipPath id="faceClip"><circle cx="0" cy="0" r="118"/></clipPath>
    </defs>

    <!-- ════ velvet ════ -->
    <rect x="0" y="0" width="600" height="820" fill="url(#velvet)"/>

    <!-- ════ the engraved brass case-frame (thin, around the whole vitrine) ════ -->
    <rect x="14" y="14" width="572" height="792" rx="16" fill="none"
          stroke="#3a2f14" stroke-width="6"/>
    <rect x="14" y="14" width="572" height="792" rx="16" fill="none"
          stroke="url(#bezel)" stroke-width="2" opacity=".9"/>
    <rect x="20" y="20" width="560" height="780" rx="12" fill="none"
          stroke="#0c0a06" stroke-width="1" opacity=".8"/>

    <!-- ════ the split-ring / bail at the top of the case ════ -->
    <g transform="translate(300,40)">
      <ellipse cx="0" cy="0" rx="15" ry="11" fill="none" stroke="url(#link)" stroke-width="6"/>
      <ellipse cx="0" cy="0" rx="15" ry="11" fill="none" stroke="#5a4a1e" stroke-width="6"
               stroke-dasharray="2 30" stroke-dashoffset="3" opacity=".7"/>
      <!-- the bright lamp-side inner stroke -->
      <path d="M-13 -5 A15 11 0 0 1 7 -9" fill="none" stroke="var(--brass-bright)"
            stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- ════ THE IRON SURVEY-CHAIN — drawn here, NEVER flips ════
         13 elongated wire-drawn links, alternating orientation 90° (real Gunter's interlock),
         running from the bail down to the case-bow above the disc. Each link: a bright inner
         stroke on the lamp side (upper-left) + an oil-rubbed dark stroke on the shadow side. -->
    <g id="chain" filter="url(#castSmall)"></g>

    <!-- ════ NOTCHED BRASS TALLY MARKERS — hung symmetrically along the neck ════ -->
    <g id="tallies"></g>

    <!-- the case-bow the chain runs into, just above the disc -->
    <g transform="translate(300,300)">
      <path d="M-26 6 Q0 -16 26 6" fill="none" stroke="url(#link)" stroke-width="7"/>
      <path d="M-24 4 Q0 -12 24 4" fill="none" stroke="var(--brass-bright)" stroke-width="1.4"
            opacity=".85"/>
      <circle cx="0" cy="6" r="6" fill="url(#gemBezel)" stroke="#3a2f14" stroke-width="1"/>
    </g>

    <!-- ════ THE CIRCUMFERENTOR — the flip wrapper. ONLY this group flips on Y. ════
         The needle's physics state lives in the FRONT group; the flip never resets it. -->
    <g id="discWrap" transform="translate(300,470)">
      <g id="flip" class="flip3d">

        <!-- ───────────────────────── FRONT FACE ───────────────────────── -->
        <g id="frontFace">

          <!-- ══ THE CASE BODY — the rigid circumferentor that TURNS with the holder's hand.
               Everything in here spins together on caseAzimuth: body, bezel, silvered face,
               dial, vanes, glass, AND the needle. The needle's physics target subtracts
               caseAzimuth, so its WORLD angle holds at home while the dial turns under it. ══ -->
          <g id="caseBody">
            <!-- the struck brass body, with reeded/milled outer bezel + cast shadow -->
            <g filter="url(#cast)">
              <!-- reeded bezel: a ring of short radial ticks (drawn) under the body edge -->
              <g id="reeding"></g>
              <circle cx="0" cy="0" r="150" fill="url(#brassDisc)"/>
              <!-- near-black incised edge -->
              <circle cx="0" cy="0" r="150" fill="none" stroke="#0c0a06" stroke-width="2.5"/>
              <!-- raised bezel ring catching the lamp -->
              <circle cx="0" cy="0" r="140" fill="none" stroke="url(#bezel)" stroke-width="8"/>
              <circle cx="0" cy="0" r="135.5" fill="none" stroke="#2a2210" stroke-width="1.5" opacity=".8"/>
              <!-- the lamp-side bright arc / shadow-side dark arc so the bezel reads ROUND -->
              <path d="M-99 -99 A140 140 0 0 1 99 -99" fill="none" stroke="var(--brass-bright)"
                    stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
              <path d="M99 99 A140 140 0 0 1 -99 99" fill="none" stroke="#1c1810"
                    stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
            </g>

            <!-- THE SILVERED COMPASS FACE under bevelled glass -->
            <g>
              <!-- the inner brass step the glass seats into -->
              <circle cx="0" cy="0" r="126" fill="#2a2210"/>
              <circle cx="0" cy="0" r="123" fill="url(#bezel)" opacity=".5"/>
              <!-- the silvered field -->
              <circle cx="0" cy="0" r="118" fill="url(#silver)"/>
              <!-- the degree-tick ring + cardinal labels, generated -->
              <g id="dial"></g>
              <!-- the home glyph (a hair west of N — the Orrery's bearing) -->
              <g id="homeGlyph"></g>

              <!-- ══ THE SAPPHIRE NEEDLE (the ONE living element) ══
                   rotates on screen-angle θ via JS. Sapphire arm seeks home; brass counterweight
                   tail; jeweled brass center-cap pivot. -->
              <g id="needle">
                <!-- counterweight (brass tail) -->
                <path d="M0 0 L8 6 L0 86 L-8 6 Z" fill="url(#link)" stroke="#3a2f14" stroke-width=".8"/>
                <path d="M0 0 L-8 6 L0 86 Z" fill="#5a4a1e" opacity=".55"/>
                <!-- sapphire pointing arm -->
                <path d="M0 0 L7 -8 L0 -98 L-7 -8 Z" fill="url(#sapphire)" stroke="#1c3aa8" stroke-width=".8"/>
                <!-- lit facet on the lamp side of the arm -->
                <path d="M0 0 L-7 -8 L0 -98 Z" fill="#9fc0ff" opacity=".45"/>
                <!-- faceted tip glint + cut-gem bezel near the point -->
                <circle cx="0" cy="-90" r="6" fill="url(#gemBezel)" stroke="#3a2f14" stroke-width=".7"/>
                <path d="M0 -98 L4 -90 L0 -82 L-4 -90 Z" fill="url(#capJewel)" stroke="#1c3aa8" stroke-width=".5"/>
                <circle cx="-1.4" cy="-92" r="1.5" fill="#fff" opacity=".95"/>
              </g>
              <!-- jeweled brass center-cap pivot, on top of the needle -->
              <circle cx="0" cy="0" r="9" fill="url(#gemBezel)" stroke="#3a2f14" stroke-width="1.2"/>
              <circle cx="0" cy="0" r="4.2" fill="url(#capJewel)" stroke="#1c3aa8" stroke-width=".6"/>
              <circle cx="-1.3" cy="-1.3" r="1.3" fill="#fff" opacity=".9"/>

              <!-- ══ DOMED BEVELLED GLASS ══ a clipped sheen catching the upper-left lamp -->
              <g clip-path="url(#faceClip)" pointer-events="none">
                <ellipse cx="-34" cy="-44" rx="120" ry="96" fill="url(#dome)"/>
                <!-- crisp specular streak -->
                <path d="M-86 -64 Q-40 -104 28 -92" fill="none" stroke="#ffffff" stroke-width="6"
                      stroke-linecap="round" opacity=".22"/>
                <path d="M-78 -58 Q-44 -88 6 -84" fill="none" stroke="#ffffff" stroke-width="2"
                      stroke-linecap="round" opacity=".30"/>
              </g>
              <!-- faint inner-bevel ring (glass thickness) -->
              <circle cx="0" cy="0" r="116" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".18"/>
              <circle cx="0" cy="0" r="118" fill="none" stroke="#5a667e" stroke-width="1" opacity=".4"/>
            </g>

            <!-- ══ TWO SIGHT VANES at N and S, each on a clockwork pivot-pin ══
                 drawn AFTER the glass so they stand proud of the face, casting a hairline shadow. -->
            <g id="vanes" pointer-events="none"></g>
          </g><!-- /caseBody -->

          <!-- THE INCISED DEDICATION PLATE on the case base — FIXED, does NOT turn with the dial
               (a quiet satellite, never a certificate; stays readable as the dial spins). -->
          <g transform="translate(0,176)" pointer-events="none">
            <rect x="-128" y="-15" width="256" height="34" rx="5"
                  fill="url(#brassBack)" stroke="#2a2210" stroke-width="1.4" filter="url(#castSmall)"/>
            <rect x="-124" y="-11" width="248" height="26" rx="3" fill="none"
                  stroke="#0c0a06" stroke-width="1" opacity=".7"/>
            <!-- double-stroke incised text: dark inset under a bright lower-bevel -->
            <text x="0" y="-1" text-anchor="middle" font-family="var(--serif)"
                  font-size="11" letter-spacing="1.6" fill="#0c0a06" opacity=".9">THE ORDER OF THE GRAND CARTOGRAPHER</text>
            <text x="0.6" y="-1.6" text-anchor="middle" font-family="var(--serif)"
                  font-size="11" letter-spacing="1.6" fill="#f0d489" opacity=".92">THE ORDER OF THE GRAND CARTOGRAPHER</text>
            <text x="0" y="11" text-anchor="middle" font-family="var(--serif)"
                  font-size="7.6" letter-spacing=".4" fill="#0c0a06" opacity=".82">for the front-door map redrawn true · the makers of the Orrery Estate</text>
            <text x="0.4" y="10.6" text-anchor="middle" font-family="var(--serif)"
                  font-size="7.6" letter-spacing=".4" fill="#d9b86a" opacity=".7">for the front-door map redrawn true · the makers of the Orrery Estate</text>
          </g>

          <!-- the small "⟲ TURN" roundel below the dial — FIXED (also flips the disc) -->
          <g id="turnRoundel" transform="translate(0,150)" style="cursor:pointer">
            <circle cx="0" cy="0" r="13" fill="url(#brassBack)" stroke="#2a2210" stroke-width="1.2" filter="url(#castSmall)"/>
            <circle cx="0" cy="0" r="9.5" fill="none" stroke="#0c0a06" stroke-width=".8" opacity=".7"/>
            <text x="0" y="4.4" text-anchor="middle" font-size="13" fill="#0c0a06" opacity=".9">⟲</text>
            <text x="0.4" y="4" text-anchor="middle" font-size="13" fill="#f0d489" opacity=".88">⟲</text>
          </g>
        </g>

        <!-- ───────────────────────── BACK FACE ───────────────────────── -->
        <!-- mirrored on X so, once the wrapper has flipped 180°, the inscription reads upright.
             Hidden by default; JS reveals it at the flip's 90° midpoint (deterministic swap,
             avoids SVG backface-visibility ambiguity across engines). -->
        <g id="backFace" transform="scale(-1,1)" style="display:none">
          <g filter="url(#cast)">
            <circle cx="0" cy="0" r="150" fill="url(#brassBack)"/>
            <circle cx="0" cy="0" r="150" fill="none" stroke="#0c0a06" stroke-width="2.5"/>
            <!-- oil-rubbed rim patina ring -->
            <circle cx="0" cy="0" r="138" fill="none" stroke="#1c1810" stroke-width="9" opacity=".55"/>
            <circle cx="0" cy="0" r="140" fill="none" stroke="url(#bezel)" stroke-width="3" opacity=".8"/>
            <path d="M-99 -99 A140 140 0 0 1 99 -99" fill="none" stroke="var(--brass-bright)"
                  stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
            <path d="M99 99 A140 140 0 0 1 -99 99" fill="none" stroke="#0c0a06"
                  stroke-width="2.2" stroke-linecap="round" opacity=".65"/>
          </g>

          <!-- the DEEPLY INSCRIBED dedication on arcs (upper + lower), double-stroke incised -->
          <defs>
            <path id="arcUpper" d="M0 0 m -104,0 a 104,104 0 0,1 208,0" fill="none"/>
            <path id="arcLower" d="M0 0 m -110,0 a 110,110 0 0,0 220,0" fill="none"/>
          </defs>

          <!-- upper arc: first sentence -->
          <text font-family="var(--serif)" font-size="14.6" letter-spacing="1.2"
                fill="#0c0a06" opacity=".92">
            <textPath href="#arcUpper" startOffset="50%" text-anchor="middle"
                      transform="translate(0.7,0.7)">For Masterful Delineation of the Orrery Estate &amp; All Its Wings</textPath>
          </text>
          <text font-family="var(--serif)" font-size="14.6" letter-spacing="1.2"
                fill="#f3dca0" opacity=".95">
            <textPath href="#arcUpper" startOffset="50%" text-anchor="middle">For Masterful Delineation of the Orrery Estate &amp; All Its Wings</textPath>
          </text>

          <!-- lower arc: second sentence (reads left→right along the bottom) -->
          <text font-family="var(--serif)" font-size="15.4" letter-spacing="1.6"
                fill="#0c0a06" opacity=".92">
            <textPath href="#arcLower" startOffset="50%" text-anchor="middle"
                      transform="translate(0.7,0.7)">May Your Needle Never Waver.</textPath>
          </text>
          <text font-family="var(--serif)" font-size="15.4" letter-spacing="1.6"
                fill="#f3dca0" opacity=".95">
            <textPath href="#arcLower" startOffset="50%" text-anchor="middle">May Your Needle Never Waver.</textPath>
          </text>

          <!-- a small struck cartographer's compass-star hallmark in the centre -->
          <g>
            <circle cx="0" cy="0" r="46" fill="none" stroke="#0c0a06" stroke-width="1.4" opacity=".6"/>
            <circle cx="0" cy="0" r="40" fill="none" stroke="url(#bezel)" stroke-width="1.4" opacity=".7"/>
            <!-- 8-point compass star, incised -->
            <g id="hallmark"></g>
            <text x="0.6" y="3.4" text-anchor="middle" font-family="var(--serif)" font-size="13"
                  fill="#0c0a06" opacity=".85">✦</text>
            <text x="0" y="3" text-anchor="middle" font-family="var(--serif)" font-size="13"
                  fill="#f3dca0" opacity=".9">✦</text>
          </g>
          <!-- a tiny exergue naming the Order, incised, below the star -->
          <text x="0" y="64" text-anchor="middle" font-family="var(--serif)" font-size="8"
                letter-spacing="2.4" fill="#0c0a06" opacity=".8">· THE ORDER OF THE GRAND CARTOGRAPHER ·</text>
          <text x="0.4" y="63.6" text-anchor="middle" font-family="var(--serif)" font-size="8"
                letter-spacing="2.4" fill="#caa860" opacity=".62">· THE ORDER OF THE GRAND CARTOGRAPHER ·</text>
        </g>

      </g>
    </g>
  </svg>
</div>
<div id="hint">drag the dial to turn it · click to flip</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════════════════════
   THE ORDER OF THE GRAND CARTOGRAPHER — the living tick.
   ONE source of truth: caseAzimuth (where the holder has turned the whole circumferentor).
   The needle is a damped torsional spring on screen-angle θ toward target = θ_home − caseAzimuth.
   It always takes the SHORT way round, can overshoot once, and settles in ~1.3–1.6 s. No proof
   owed — its only job is to be beautiful and always come home. Generated dial/chain/vanes below.
   ════════════════════════════════════════════════════════════════════════════════════════ */
const NS = "http://www.w3.org/2000/svg";
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = id => document.getElementById(id);
function mk(name, attrs){ const e=document.createElementNS(NS,name); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

/* ── HOME bearing: a hair west of North (matches the front-door rose's gold-N-up reading) ── */
const HOME_DEG = -4;                          // screen degrees from straight-up (0 = N up)
const THETA_HOME = (HOME_DEG - 90) * Math.PI/180;   // SVG angle where 0rad points +x (right), -90° points up

/* ════ THE IRON SURVEY-CHAIN — wire-drawn antiqued-brass links, alternating 90° (Gunter's
   interlock), running bail → case-bow. Each link: a bright inner stroke on the lamp side
   (upper-left) + an oil-rubbed dark stroke on the shadow side, so the wire reads ROUND. ════ */
(function chain(){
  const g = el('chain');
  const x = 300;                  // the chain hangs straight down the centre
  const top = 58, bot = 296;      // from below the bail to just above the case-bow
  const N = 13;
  const linkH = (bot - top) / N;  // link pitch
  const ry = linkH*0.62;          // elongated
  for(let i=0;i<N;i++){
    const cy = top + linkH*(i+0.5);
    const horiz = (i % 2 === 1);  // alternate orientation 90° for a real interlock
    const rx = horiz ? ry*0.46 : 8.5;
    const ery = horiz ? 8.5 : ry;
    // the wire body
    g.appendChild(mk('ellipse',{cx:x,cy,rx,ry:ery,fill:'none',stroke:'url(#link)','stroke-width':3.4}));
    // oil-rubbed dark inner stroke on the shadow (lower-right) side
    g.appendChild(mk('ellipse',{cx:x+0.7,cy:cy+0.7,rx:rx-0.6,ry:ery-0.6,fill:'none',stroke:'#5a4a1e','stroke-width':1.3,opacity:.7}));
    // bright lamp-side catch on the upper-left arc
    const ax = x-rx*0.72, ay = cy-ery*0.72;
    g.appendChild(mk('path',{d:`M${x-rx*0.86} ${cy} A${rx} ${ery} 0 0 1 ${x} ${cy-ery*0.92}`,
      fill:'none',stroke:'var(--brass-bright)','stroke-width':1.2,'stroke-linecap':'round',opacity:.85}));
  }
})();

/* ════ NOTCHED BRASS TALLY MARKERS — small trapezoidal tags hung symmetrically left/right along
   the neck, each with 1–4 incised notch teeth on its lower edge + an inner-shadow stroke. ════ */
(function tallies(){
  const g = el('tallies');
  // four pairs at regular intervals down the neck; notch counts 1..4 (a surveyor's link-tally)
  const rows = [ {y:96,n:1}, {y:148,n:2}, {y:200,n:3}, {y:252,n:4} ];
  const x0 = 300, off = 30;      // hung a little out from the chain, mirrored L/R
  function tag(cx, cy, n, mirror){
    const s = mk('g',{transform:`translate(${cx},${cy})`});
    // the hang-wire from the chain to the tag
    s.appendChild(mk('line',{x1:mirror? 11:-11,y1:-2,x2:mirror?-off+11:off-11,y2:0,stroke:'#7a6328','stroke-width':1.4,opacity:.8}));
    // trapezoidal brass tag (wider top, notched bottom)
    s.appendChild(mk('path',{d:'M-11 -8 L11 -8 L8 8 L-8 8 Z',fill:'url(#tally)',stroke:'#3a2f14','stroke-width':.9,filter:'url(#castSmall)'}));
    // inner-shadow stroke
    s.appendChild(mk('path',{d:'M-9 -6 L9 -6 L6.6 6 L-6.6 6 Z',fill:'none',stroke:'#0c0a06','stroke-width':.7,opacity:.55}));
    // bright lamp-side top edge
    s.appendChild(mk('line',{x1:-10,y1:-7.4,x2:10,y2:-7.4,stroke:'var(--brass-bright)','stroke-width':.9,opacity:.8}));
    // 1–4 incised notch teeth along the lower edge
    const span = 11; const step = span/(n+1);
    for(let k=1;k<=n;k++){
      const nx = -span/2 + step*k;
      s.appendChild(mk('line',{x1:nx,y1:5,x2:nx,y2:9,stroke:'#0c0a06','stroke-width':1.1,opacity:.8}));
    }
    return s;
  }
  for(const r of rows){
    g.appendChild(tag(x0 - off, r.y, r.n, false));   // left tag
    g.appendChild(tag(x0 + off, r.y, r.n, true));    // right tag (mirrored)
  }
})();

/* ════ generate the reeded/milled outer bezel: short radial ticks ════ */
(function reeding(){
  const g = el('reeding'); const n=120;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const x1=Math.cos(a)*150, y1=Math.sin(a)*150;
    const x2=Math.cos(a)*144, y2=Math.sin(a)*144;
    // lamp-side ticks brighter (upper-left), shadow-side darker — so the milling reads round
    const lamp = Math.cos(a - (-2.3)) ;      // ~upper-left direction
    const col = lamp>0.2 ? '#e7cd86' : (lamp<-0.4 ? '#3a2f14' : '#7a6328');
    g.appendChild(mk('line',{x1,y1,x2,y2,stroke:col,'stroke-width':1.3,opacity:.85}));
  }
})();

/* ════ generate the degree-tick ring + cardinals on the silvered face ════ */
(function dial(){
  const g = el('dial');
  for(let d=0; d<360; d+=5){
    const a=(d-90)*Math.PI/180;
    const major = (d%30===0);
    const r1=110, r2=major?98:104;
    const x1=Math.cos(a)*r1, y1=Math.sin(a)*r1;
    const x2=Math.cos(a)*r2, y2=Math.sin(a)*r2;
    g.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#5a667e','stroke-width':major?1.4:0.8,opacity:major?.7:.45}));
  }
  // gold North tick at top (mirrors the front-door rose's gold N) + cardinals in the district serif/brass
  g.appendChild(mk('path',{d:'M0 -110 L4 -98 L0 -94 L-4 -98 Z',fill:'#c9a24a',opacity:.95}));
  const card = [['N',0,-78],['E',82,5],['S',0,90],['W',-82,5]];
  for(const [t,x,y] of card){
    const a=mk('text',{x,y,'text-anchor':'middle','font-family':'var(--serif)','font-size':t==='N'?20:17,fill:'#c9a24a'});
    a.textContent=t; a.setAttribute('opacity',t==='N'?'.95':'.8'); g.appendChild(a);
  }
  // faint inner ring + maker's reticle cross (silvered engraving, NOT district names)
  g.appendChild(mk('circle',{cx:0,cy:0,r:94,fill:'none',stroke:'#aab3c4','stroke-width':.8,opacity:.45}));
})();

/* ════ the home glyph: a small engraved ✦ a hair west of N ════ */
(function home(){
  const g=el('homeGlyph');
  const a=(HOME_DEG-90)*Math.PI/180, r=72;
  const x=Math.cos(a)*r, y=Math.sin(a)*r;
  const t=mk('text',{x,y:y+5,'text-anchor':'middle','font-family':'var(--serif)','font-size':14,fill:'#8d7a4e',opacity:.85});
  t.textContent='✦'; g.appendChild(t);
})();

/* ════ the two sight vanes at N and S ════ */
(function vanes(){
  const g=el('vanes');
  function vane(flip){
    const s = mk('g',{transform:`scale(1,${flip?-1:1})`});
    // clockwork pivot-pin at the base
    s.appendChild(mk('circle',{cx:0,cy:-130,r:3.4,fill:'url(#gemBezel)',stroke:'#3a2f14','stroke-width':.8}));
    // a tapered upright blade with a beveled top + central sighting-slit
    s.appendChild(mk('path',{d:'M-5 -130 L5 -130 L3.4 -176 L0 -182 L-3.4 -176 Z',fill:'url(#bezel)',stroke:'#3a2f14','stroke-width':.8}));
    // lamp-side bright edge / shadow-side dark edge so the blade stands PROUD
    s.appendChild(mk('path',{d:'M-5 -130 L-3.4 -176 L0 -182',fill:'none',stroke:'#f0d489','stroke-width':.9,opacity:.85}));
    s.appendChild(mk('path',{d:'M5 -130 L3.4 -176 L0 -182',fill:'none',stroke:'#1c1810','stroke-width':.9,opacity:.7}));
    // the 1px central sighting-slit
    s.appendChild(mk('line',{x1:0,y1:-138,x2:0,y2:-178,stroke:'#0c0a06','stroke-width':1,opacity:.85}));
    // hairline shadow the blade casts onto the rose
    s.appendChild(mk('line',{x1:2,y1:-132,x2:2,y2:-176,stroke:'#000','stroke-width':2,opacity:.12}));
    return s;
  }
  g.appendChild(vane(false));  // N vane
  g.appendChild(vane(true));   // S vane
})();

/* ════ the back-face compass-star hallmark (8-point, incised) ════ */
(function hallmark(){
  const g=el('hallmark');
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const long = (i%2===0);
    const r=long?38:20;
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    const w=long?Math.cos(a)*6:Math.cos(a)*3, h=long?Math.sin(a)*6:Math.sin(a)*3;
    g.appendChild(mk('path',{d:`M${-w*0.5+ -h*0.0} 0 L${x} ${y} L0 0 Z`,fill:'none'}));
    // a clean incised triangle ray
    const nx=Math.cos(a+Math.PI/2)*(long?4:2), ny=Math.sin(a+Math.PI/2)*(long?4:2);
    g.appendChild(mk('path',{d:`M${nx} ${ny} L${x} ${y} L${-nx} ${-ny} Z`,fill:'#0c0a06',opacity:.55}));
    g.appendChild(mk('path',{d:`M${nx*0.6} ${ny*0.6} L${x*0.94} ${y*0.94} L0 0 Z`,fill:'#e7cd86',opacity:.3}));
  }
})();

/* ════════════════════════════════════════════════════════════════════════════════════════
   THE NEEDLE PHYSICS — a damped torsional spring.
   ════════════════════════════════════════════════════════════════════════════════════════ */
const needle = el('needle');
const STIFF = 22, DAMP = 5.2;        // two tuned consts: overshoot once, settle in ~1.3–1.6 s
let theta = THETA_HOME;              // current needle screen-angle (rad)
let omega = 0;                       // angular velocity
let caseAzimuth = 0;                 // the single source of truth (rad the holder has turned the case)
let lastT = 0;

function angDiff(target, cur){       // wrap to (−π, π] — always the SHORT way
  let d = (target - cur) % (Math.PI*2);
  if (d <= -Math.PI) d += Math.PI*2;
  if (d > Math.PI) d -= Math.PI*2;
  return d;
}

function setNeedle(){ needle.setAttribute('transform', `rotate(${theta*180/Math.PI + 90})`); }
// +90 because θ is measured from +x; the needle art points UP (−y) at θ=0 transform... so align:
// at rotate(0) the needle points up; we want screen-angle θ (0rad = +x). rotate(θ_deg+90) maps θ→up-relative.

function tick(t){
  if(!lastT) lastT=t;
  let dt=(t-lastT)/1000; lastT=t;
  if(dt>0.05) dt=0.05;                // tab-switch guard
  const target = THETA_HOME - caseAzimuth;
  const err = angDiff(target, theta);
  // a faint ±0.4° band-limited idle breath so it's never dead-frozen
  const breath = REDUCED ? 0 : Math.sin(t*0.0011)*0.4*Math.PI/180;
  omega += (STIFF*err - DAMP*omega)*dt;
  theta += omega*dt;
  needle.setAttribute('transform', `rotate(${(theta+breath)*180/Math.PI + 90})`);
  requestAnimationFrame(tick);
}

if (REDUCED){
  theta = THETA_HOME - caseAzimuth; setNeedle();   // snap straight to home, no swing
} else {
  // on load: start a touch off so it visibly settles toward home
  theta = THETA_HOME + 38*Math.PI/180;
  requestAnimationFrame(tick);
}

/* ════════════════════════════════════════════════════════════════════════════════════════
   INTERACTION — drag the dial to rotate the WHOLE circumferentor (case + bezel + vanes + face)
   as one rigid group; the needle swings back through its spring to re-find home. Click (not a
   drag) flips the disc; the needle physics state SURVIVES the flip.
   ════════════════════════════════════════════════════════════════════════════════════════ */
const front = el('frontFace');     // the pointer surface (whole front)
const caseBody = el('caseBody');   // the rigid group that TURNS with the holder's hand
const flip  = el('flip');
const turnRoundel = el('turnRoundel');
const svg = el('medal');
const hint = el('hint');

let dragging=false, dragMoved=false, startAng=0, startAz=0, flipped=false;

// pointer angle around the disc centre, in the SVG user space of #discWrap (translate 300,470)
function pointerAngle(ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const ctm = el('discWrap').getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  return Math.atan2(p.y, p.x);
}

function onDown(ev){
  // ignore the dedicated TURN roundel (it has its own click → flip)
  dragging=true; dragMoved=false;
  startAng = pointerAngle(ev);
  startAz = caseAzimuth;
  if(hint && !hint.classList.contains('gone')) hint.classList.add('gone');
  try{ front.setPointerCapture(ev.pointerId); }catch(e){}
}
function onMove(ev){
  if(!dragging) return;
  const a = pointerAngle(ev);
  let d = a - startAng;
  // accumulate without wrapping jumps
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  if(Math.abs(d) > 0.018) dragMoved=true;
  caseAzimuth = startAz + d;
  applyCaseRotation();
}
function onUp(ev){
  if(!dragging) return;
  dragging=false;
  // a click (no real drag) → flip; otherwise the case holds where left (the needle re-seeks home)
  if(!dragMoved) doFlip();
  try{ front.releasePointerCapture(ev.pointerId); }catch(e){}
}

// Rotate ONLY the rigid #caseBody (body + bezel + face + dial + vanes + glass + needle). The
// dedication plate + TURN roundel are siblings OUTSIDE caseBody, so they stay readable.
function applyCaseRotation(){
  caseBody.setAttribute('transform', `rotate(${caseAzimuth*180/Math.PI})`);
}
// The needle lives INSIDE caseBody, so it inherits caseAzimuth: needle-world = caseAzimuth + θ.
// The physics target is THETA_HOME − caseAzimuth, so needle-world → caseAzimuth + (THETA_HOME −
// caseAzimuth) = THETA_HOME. The dial turns under a needle that holds at home. ✔ (tick() does this.)

const backFace = el('backFace');
let swapTimer = null;
function showFace(){
  // reveal exactly one face for the current flip state
  front.style.display = flipped ? 'none' : '';
  backFace.style.display = flipped ? '' : 'none';
}
function doFlip(){
  flipped=!flipped;
  if(hint && !hint.classList.contains('gone')) hint.classList.add('gone');
  if(REDUCED){
    flip.style.transform = flipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
    showFace();
    return;
  }
  flip.style.transition='transform .7s cubic-bezier(.4,.05,.2,1)';
  flip.style.transform = flipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
  // swap the visible face at the 90° midpoint (edge-on), so each side only shows when facing us
  if(swapTimer) clearTimeout(swapTimer);
  swapTimer = setTimeout(showFace, 350);
}
showFace();   // initial: front visible, back hidden

front.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, {passive:true});
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
// clicking the BACK flips it home again (the front is hidden while flipped)
backFace.style.cursor='pointer';
backFace.addEventListener('click', doFlip);
// the dedicated TURN roundel: a clean flip, never a drag
turnRoundel.addEventListener('pointerdown', e=>{ e.stopPropagation(); });
turnRoundel.addEventListener('click', e=>{ e.stopPropagation(); doFlip(); });

// keyboard accessibility: arrow keys nudge the case; Enter/Space flips
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    caseAzimuth += (e.key==='ArrowRight'? 0.18 : -0.18); applyCaseRotation(); e.preventDefault();
    if(hint) hint.classList.add('gone');
  } else if(e.key==='Enter'||e.key===' '){ doFlip(); e.preventDefault(); }
});
</script>
</body>
</html>
