<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oracle Bird preview</title>
<style>
  :root{
    --bg:#08070b; --plate1:#15121b; --plate2:#0d0b12; --ink:#ede2f0; --ink-dim:#a79ab2;
    --brass:#c9a24a; --brass-bright:#f0d488; --brass-soft:rgba(201,162,74,0.14); --brass-edge:rgba(201,162,74,0.40);
    --blue:#6ea8e8; --blue-edge:rgba(110,168,232,0.66); --blue-soft:rgba(110,168,232,0.16);
    --red:#e0664f; --red-edge:rgba(224,102,79,0.62); --red-soft:rgba(224,102,79,0.14);
    --green:#7bd88f; --green-edge:rgba(123,216,143,0.60);
    --font-mono:"SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    --font-serif:Georgia, "Times New Roman", serif;
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-serif);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:600px;margin:0 auto;}
  .panel{border-radius:12px;padding:12px 14px 14px;text-align:center;border:1px solid var(--brass-soft);background:rgba(0,0,0,0.28);}
  .panel.blue{border-color:var(--blue-edge);background:var(--blue-soft);}
  .panel.red{border-color:var(--red-edge);background:var(--red-soft);}
  .panel.zero{border-color:var(--brass-edge);background:var(--brass-soft);}
  .panel.warn{border-color:var(--green-edge);background:rgba(123,216,143,0.10);}
  .lbl{font:600 9px/1.3 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);}
  svg.stage{display:block;width:100%;height:74px;margin:2px 0 4px;}
</style>
</head>
<body>
  <div class="grid">
    <div class="panel blue"><div class="lbl">value &gt; 0 · Blue wins</div><svg class="stage" data-side="blue" viewBox="0 0 300 74"></svg></div>
    <div class="panel red"><div class="lbl">value &lt; 0 · Red wins</div><svg class="stage" data-side="red" viewBox="0 0 300 74"></svg></div>
    <div class="panel zero"><div class="lbl">value = 0 · Mover loses</div><svg class="stage" data-side="center" viewBox="0 0 300 74"></svg></div>
    <div class="panel warn"><div class="lbl">all-green · the sign lies</div><svg class="stage" data-side="warn" viewBox="0 0 300 74"></svg></div>
  </div>
<script src="bird.js"></script>
<script>
  // mount an independent Bird into each panel (fall back gracefully if the candidate
  // exposes a factory instead of a singleton — we just re-mount the same object).
  (function(){
    const stages = Array.from(document.querySelectorAll('svg.stage'));
    stages.forEach((svg, i) => {
      try {
        // a fresh Bird per panel if the module exposes a factory; else the singleton.
        const B = (typeof window.makeBird === 'function') ? window.makeBird() : window.Bird;
        if (!B || !B.mount) return;
        B.__panel = svg;
        B.mount(svg);
        const side = svg.dataset.side;
        setTimeout(() => { try { B.setSide(side, null); } catch(e){} }, 120);
        if (side === 'blue' || side === 'red'){ setTimeout(() => { try { B.cheer(side, null); } catch(e){} }, 1400); }
      } catch(e){}
    });
  })();
</script>
</body>
</html>
