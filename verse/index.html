<!doctype html>
<html lang="en">
<head>

<title>The Oracle · Verse Engine</title>
<style>
  :root{
    --bg:#0c0b10; --paper:#13121a; --ink:#ede7da; --ink-soft:#c8c1b3;
    --muted:#8a8479; --gold:#cba15a; --gold-soft:#d8b878; --line:rgba(203,161,90,.22);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(1200px 760px at 50% -16%, rgba(203,161,90,.10), transparent 62%),
      radial-gradient(720px 560px at 8% 112%, rgba(120,110,170,.08), transparent 58%),
      radial-gradient(760px 540px at 96% 108%, rgba(150,90,120,.06), transparent 56%),
      var(--bg);
    color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100%; display:flex; flex-direction:column; align-items:center;
  }
  a{ color:inherit; }

  /* ---- top bar ---- */
  .topbar{ width:100%; max-width:960px; display:flex; align-items:center;
    justify-content:space-between; padding:22px 30px 0; }
  .back{ font:600 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); text-decoration:none; opacity:.8; transition:.25s; }
  .back:hover{ color:var(--gold-soft); opacity:1; }
  .mark{ font:600 11px/1 var(--mono); letter-spacing:.34em; text-transform:uppercase;
    color:var(--muted); opacity:.7; }
  .topbar .right{ display:flex; align-items:center; gap:16px; }
  .sib-link{ font:600 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); text-decoration:none; opacity:.78; transition:.25s;
    border-bottom:1px solid transparent; padding-bottom:1px; }
  .sib-link:hover{ opacity:1; color:var(--gold-soft); border-bottom-color:rgba(203,161,90,.4); }
  .sib-link .dim{ color:var(--muted); letter-spacing:.04em; text-transform:none; font-weight:400; }

  /* ---- stage ---- */
  .stage{ flex:1; width:100%; max-width:760px; padding:34px 30px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .plate{ position:relative; width:100%; max-width:600px; padding:54px 48px 50px;
    background:linear-gradient(180deg, rgba(255,255,255,.018), rgba(255,255,255,0));
    border:1px solid var(--line); border-radius:6px;
    box-shadow:0 30px 90px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03); }
  .plate::before{ content:""; position:absolute; inset:7px; border:1px solid rgba(203,161,90,.12);
    border-radius:3px; pointer-events:none; }

  .ornament{ text-align:center; color:var(--gold); opacity:.6; font-size:15px;
    letter-spacing:.5em; margin:0 0 26px; padding-right:.5em; }

  .poem-title{ text-align:center; font-weight:500; font-style:normal;
    font-size:clamp(25px,4.6vw,33px); line-height:1.18; letter-spacing:.005em;
    margin:0 0 6px; color:var(--ink);
    background:linear-gradient(180deg,#fbf6ea,#d4ad6c); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; }
  .poem-form{ text-align:center; font:600 10.5px/1 var(--mono); letter-spacing:.28em;
    text-transform:uppercase; color:var(--gold); opacity:.7; margin:0 0 30px; }

  .poem-body{ font-size:clamp(17px,2.4vw,20px); line-height:1.95; color:var(--ink-soft);
    text-align:center; }
  .poem-body .line{ display:block; opacity:0; transform:translateY(7px);
    filter:blur(2px); }
  .poem-body.reveal .line{ animation:lineIn .62s cubic-bezier(.22,.7,.2,1) forwards; }
  @keyframes lineIn{ to{ opacity:1; transform:none; filter:blur(0); } }
  .stanza-gap{ display:block; height:.85em; }

  .byline{ text-align:center; margin:32px 0 0; color:var(--muted);
    font-style:italic; font-size:14.5px; letter-spacing:.02em; opacity:0;
    transition:opacity .6s ease .5s; }
  .poem-body.reveal ~ .byline, .reveal-by{ opacity:.85; }

  /* ---- controls ---- */
  .controls{ width:100%; max-width:600px; margin:30px auto 0;
    display:flex; flex-wrap:wrap; gap:14px 16px; align-items:flex-end; justify-content:center; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font:600 9.5px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); opacity:.85; padding-left:2px; }
  select, input[type=text]{
    appearance:none; background:rgba(255,255,255,.03); color:var(--ink-soft);
    border:1px solid var(--line); border-radius:5px; padding:9px 12px;
    font:14px/1 var(--serif); letter-spacing:.01em; min-width:118px; transition:.2s; }
  select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1l4 4 4-4' fill='none' stroke='%23cba15a' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat; background-position:right 11px center; padding-right:30px; cursor:pointer; }
  input[type=text]{ width:118px; }
  select:hover, input:hover{ border-color:rgba(203,161,90,.4); }
  select:focus, input:focus{ outline:none; border-color:var(--gold); background:rgba(203,161,90,.05); }

  .btns{ display:flex; gap:11px; align-items:center; }
  button{ font:600 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    cursor:pointer; border-radius:5px; padding:11px 18px; transition:.22s;
    border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink-soft); }
  button:hover{ border-color:rgba(203,161,90,.5); color:var(--ink);
    background:rgba(203,161,90,.06); }
  button:active{ transform:translateY(1px); }
  button.primary{ background:linear-gradient(180deg, rgba(203,161,90,.92), rgba(176,134,68,.92));
    color:#1a140a; border-color:transparent; box-shadow:0 8px 24px -10px rgba(203,161,90,.6); }
  button.primary:hover{ background:linear-gradient(180deg,#e0bb78,#c79a52); color:#160f06; }

  .hint{ width:100%; text-align:center; margin:20px auto 40px; color:var(--muted);
    font:11px/1.6 var(--mono); letter-spacing:.08em; opacity:.55; }
  .hint kbd{ font-family:var(--mono); border:1px solid var(--line); border-radius:3px;
    padding:1px 6px; font-size:10px; color:var(--ink-soft); }

  .toast{ position:fixed; bottom:26px; left:50%; transform:translate(-50%,16px);
    background:rgba(20,18,26,.96); border:1px solid var(--line); color:var(--ink);
    padding:10px 18px; border-radius:6px; font:600 11px/1 var(--mono); letter-spacing:.14em;
    text-transform:uppercase; opacity:0; pointer-events:none; transition:.3s;
    box-shadow:0 14px 40px -16px rgba(0,0,0,.8); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media(max-width:560px){
    .plate{ padding:40px 26px 38px; }
    .controls{ gap:12px; }
    input[type=text]{ width:100px; }
  }

<script>
"use strict";
/* =======================================================================
   THE ORACLE — a generative verse engine.
   Seeded PRNG · themed evocative vocabularies · grammatical templates
   per poetic form · poetic devices (alliteration, anaphora, metaphor).
   ======================================================================= */

/* ---------- seeded PRNG (mulberry32 over a hashed string) ---------- */
function hashStr(s){ let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return (h^=h>>>16)>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
let RND = mulberry32(hashStr("oracle"));
function rnd(){ return RND(); }
function pick(arr){ return arr[(rnd()*arr.length)|0]; }
function chance(p){ return rnd() < p; }
function pickN(arr,n){ const a=arr.slice(), out=[];
  while(out.length<n && a.length){ out.push(a.splice((rnd()*a.length)|0,1)[0]); } return out; }

/* =======================================================================

/* helper: pull a themed pool merged with a fraction of common words */
function pool(kind, theme){
  const t = VOCAB[kind][theme] || [];
  const c = VOCAB[kind].common || [];
  // weight theme heavily, keep some common color
  return t.concat(t).concat(c);
}
/* pick a value from arr (string or [word,..]) whose word differs from any in `avoid` */
function pickNot(arr, ...avoid){
  const word = x => Array.isArray(x)?x[0]:x;
  const bad = new Set(avoid.map(a=> a==null?null:(Array.isArray(a)?a[0]:a)));
  for(let i=0;i<16;i++){ const c=pick(arr); if(!bad.has(word(c))) return c; }
  return pick(arr);
}

/* article agreement: a / an */
function vowelStart(w){ return /^[aeiou]/i.test(w) || /^(hour|honest|heir)/i.test(w); }
function artFor(w){ return vowelStart(w) ? "an" : "a"; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* alliteration: try to pick a second word sharing the initial letter of `seed` */
function allit(arr, seedWord){
  const letter = seedWord[0].toLowerCase();
  const matches = arr.filter(x=> (Array.isArray(x)?x[0]:x)[0].toLowerCase()===letter);
  if(matches.length && chance(0.7)) return pick(matches);
  return pick(arr);
}

/* =======================================================================
   FORM GENERATORS
   Each returns { lines:[...], stanzaBreaks:Set } ; titles handled separately.
   ======================================================================= */

/* ----- HAIKU: syllable-aware 5/7/5 ----- */
function genHaiku(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme);
  // line 1 (5): {prep} {the} {adj?} {noun}  — aim ~5
  // We assemble by syllable budget using tagged nouns; no noun repeats in a poem.
  const usedNouns = new Set();
  function nounSyl(min,max){ // find a fresh noun within syllable range
    for(let i=0;i<48;i++){ const n=pick(N);
      if(n[1]>=min && n[1]<=max && !usedNouns.has(n[0])){ usedNouns.add(n[0]); return n; } }
    for(let i=0;i<24;i++){ const n=pick(N); if(!usedNouns.has(n[0])){ usedNouns.add(n[0]); return n; } }
    return pick(N);
  }
  // L1: a small scene, 5 syllables
  const l1opts = [
    ()=>{ const n=nounSyl(2,3); return cap(`${pick(VOCAB.preps)} the ${n[0]}`); }, // prep(1-2)+the(1)+noun(2-3) ≈5
    ()=>{ const a=pick(A.filter(x=>x.length>=6&&x.length<11)); const n=nounSyl(2,2);
          return cap(`the ${a} ${n[0]}`); },                                       // the+adj(2-3)+noun(2) ≈5-6
    ()=>{ const n1=nounSyl(2,2), n2=nounSyl(1,2); return cap(`${n1[0]}, then ${n2[0]}`); }, // ≈4-5
  ];
  // L2: 7 syllables — a small action
  const l2opts = [
    ()=>{ const n=nounSyl(2,3); const v=pick(V); return `the ${n[0]} ${v[2]} again`; },
    ()=>{ const a=pick(A.filter(x=>x.length<9)); const n=nounSyl(2,3); const v=pick(V);
          return `${a} ${n[0]} ${v[1]} slow`; },
    ()=>{ const n=nounSyl(1,2); return `nothing answers but the ${n[0]}`; },
    ()=>{ const v=pick(V); const n=nounSyl(2,3); return `I watch the ${n[0]} ${v[2]}`; },
  ];
  // L3: 5 syllables — a turn / image
  const l3opts = [
    ()=>{ const n=nounSyl(1,2); return `and then the ${n[0]}`; },
    ()=>{ const n=nounSyl(2,3); return `the ${n[0]} is enough`; },
    ()=>{ const n=nounSyl(1,2); const v=pick(V); return `the ${n[0]} ${v[1]} on`; },
    ()=>{ const n=nounSyl(2,3); return `still, the ${n[0]} holds`; },
  ];
  return { lines:[ pick(l1opts)(), pick(l2opts)(), pick(l3opts)() ], stanzaBreaks:new Set() };
}

/* ----- COUPLET: two lines, end rhyme ----- */
function genCouplet(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme), grp = pick(VOCAB.rhymes);
  // prefer noun-like rhyme words so they read after "the …"
  const nounish = grp.filter(x=>x[2]);
  const usable = nounish.length>=2 ? nounish : grp;
  const [r1,r2] = pickN(usable,2).map(x=>x[0]);
  const n1 = pick(N)[0], n2 = pick(N)[0], a1 = pick(A), a2 = pick(A);
  const v = pick(V);
  // templates that end each line on a rhyme word
  // Rhyme words sit at line-end in slots that read for any word class.
  const t = pick([
    ()=>[ `The ${a1} ${n1} remembers neither ${r1} nor ${n2};`,
          `it keeps only the hush, and the ${r2}.` ],
    ()=>[ `I came to the ${n1} to be rid of the ${r1},`,
          `but the ${a2} ${n2} gave me only ${r2}.` ],
    ()=>[ `All night the ${n1} kept turning toward the ${r1};`,
          `by morning, the ${a1} ${n2} had become the ${r2}.` ],
    ()=>[ `Let the ${n1} keep its ${pickNot(A,r1)} ${r1};`,
          `I have learned to live without the ${r2}.` ],
    ()=>[ `There is ${artFor(n1)} ${n1} in me that answers to the ${r1},`,
          `and ${artFor(a2)} ${a2} ${n2} that will not leave the ${r2}.` ],
  ])();
  return { lines:t, stanzaBreaks:new Set() };
}

/* ----- FREE VERSE: 3–6 lines, varied shapes, enjambment ----- */
function genFree(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme), ABS = VOCAB.abstractions;
  // each metaphor vehicle is used at most once per poem; tenor != vehicle
  const usedVehicles = new Set();
  function metaphor(){
    const n1=pick(N)[0];
    let n2=pickNot(N, n1, ...usedVehicles)[0];
    usedVehicles.add(n2);
    return `the ${n1} ${chance(.5)?"is":"becomes"} ${artFor(n2)} ${n2}`;
  }
  const lineMakers = [
    ()=>{ const a=pick(A), n=pick(N)[0]; const v=pick(V);
          return `${cap(artFor(a))} ${a} ${n} ${v[1]} the ${pick(N)[0]}`; },
    ()=>{ const n=pick(N)[0]; return `${cap(pick(VOCAB.preps))} the ${n}, ${pick(ABS)} ${pick(V)[1]}`; },
    metaphor, // metaphor
    ()=>{ const v=pick(V); return `and the ${pick(N)[0]} keeps ${v[2]}`; },
    ()=>{ return `I have seen the ${pick(A)} ${pick(N)[0]}`; },
    ()=>{ const n=pick(N)[0]; return `what the ${n} took, it does not ${pick(VOCAB.verbs.common)[0]}`; },
    ()=>{ const a=allit(A, pick(A)); return `everything ${pick(A)} and ${a}`; },
    ()=>{ const n=pick(N)[0], v=pick(V); return `here, where the ${n} ${v[1]}, I wait`; },
  ];
  const n = 3 + ((rnd()*4)|0); // 3..6
  const lines=[]; let lastIdx=-1;
  for(let i=0;i<n;i++){
    let idx; for(let g=0;g<6;g++){ idx=(rnd()*lineMakers.length)|0; if(idx!==lastIdx) break; }
    lastIdx=idx; lines.push(lineMakers[idx]());
  }
  // chance of a metaphor closer (distinct vehicle)
  if(chance(0.5)){
    lines[lines.length-1] = "and "+metaphor();
  }
  return { lines, stanzaBreaks:new Set() };
}

/* ----- INCANTATION: imperative + anaphora ----- */
function genIncantation(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const IMP = VOCAB.imperatives, ABS=VOCAB.abstractions;
  // pick a verb whose base differs from the imperative's leading word (avoid
  // "Unspool what the X could not unspool")
  function verbUnlike(imp){
    const lead = imp.toLowerCase().split(" ")[0];
    for(let i=0;i<12;i++){ const v=pick(VOCAB.verbs.common)[0]; if(v!==lead) return v; }
    return pick(VOCAB.verbs.common)[0];
  }
  const anaphora = pick([
    ()=>(imp)=>{ const n=pick(N)[0]; return `${imp} the ${pickNot(A,n)} ${n}`; },
    ()=>(imp)=>`${imp} what the ${pick(N)[0]} could not ${verbUnlike(imp)}`,
    ()=>(imp)=>`${imp} the ${pick(N)[0]} ${pick(VOCAB.preps)} the ${pick(N)[0]}`,
  ])();
  const mk = anaphora;
  const lines=[];
  const fixedImp = chance(0.55) ? pick(IMP) : null; // sometimes repeat same imperative (true anaphora)
  const n = 3 + ((rnd()*3)|0); // 3..5
  for(let i=0;i<n;i++){ const imp = fixedImp || pick(IMP); lines.push(mk(imp)); }
  // a closing benediction
  const closer = pick([
    `and let the ${pick(N)[0]} forget your name.`,
    `until the ${pick(A)} ${pick(N)[0]} answers.`,
    `for the ${pick(N)[0]} is ${chance(.5)?"listening":"awake"}.`,
    `then ${pick(IMP).toLowerCase()} the rest.`,
    `and call it ${pick(ABS)}.`,
  ]);
  lines.push(closer);
  return { lines, stanzaBreaks:new Set() };
}

/* ----- APHORISM: one line, gnomic ----- */
function genAphorism(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const ABS=VOCAB.abstractions, V=pool("verbs",theme);
  const line = pick([
    ()=>`The ${pick(N)[0]} keeps no ${pick(ABS)}, only ${pick(N)[0]}.`,
    ()=>`What the ${pick(N)[0]} ${pick(V)[1]}, the ${pick(N)[0]} cannot ${pick(VOCAB.verbs.common)[0]}.`,
    ()=>{ const n=pick(N)[0]; return `Every ${pick(N)[0]} is ${artFor(n)} ${n} that has learned ${pick(ABS)}.`; },
    ()=>`${cap(pick(ABS))} is only the ${pick(N)[0]} the ${pick(N)[0]} forgot.`,
    ()=>`To love the ${pick(N)[0]} is to forgive the ${pick(A)} ${pick(N)[0]}.`,
    ()=>`There is no ${pick(N)[0]} so ${pick(A)} it cannot ${pick(VOCAB.verbs.common)[0]}.`,
    ()=>`The ${pick(A)} ${pick(N)[0]} owes nothing to the ${pick(N)[0]}.`,
  ])();
  return { lines:[line], stanzaBreaks:new Set() };
}

const FORMS = {
  haiku:{ gen:genHaiku, label:"Haiku" },
  couplet:{ gen:genCouplet, label:"Couplet" },
  free:{ gen:genFree, label:"Free Verse" },
  incantation:{ gen:genIncantation, label:"Incantation" },
  aphorism:{ gen:genAphorism, label:"Aphorism" },
};
const FORM_KEYS = Object.keys(FORMS);
const THEME_KEYS = ["garden","sea","cosmos","dusk","memory","winter"];

/* ---- TITLE generator ---- */
function genTitle(theme){
  const r = rnd();
  if(r<0.4) return pick(VOCAB.titleNouns);
  if(r<0.8) return `${pick(VOCAB.titleNouns)} ${pick(VOCAB.titleOf)}`;
  // image-title from theme nouns
  const N = pool("nouns",theme);
  return cap(`The ${pick(N)[0]} ${pick(["Remembers","Keeps Watch","Will Not Answer","at Dusk","in Winter","Endures"])}`);
}
function genPoet(){ return `${pick(VOCAB.poetsFirst)} ${pick(VOCAB.poetsLast)}`; }

/* =======================================================================
   ASSEMBLY + RENDER
   ======================================================================= */
let CURRENT = { text:"", title:"", form:"", poet:"" };

function generate(formSel, themeSel, seedStr){
  // resolve seed
  let seed = seedStr && seedStr.trim() ? seedStr.trim()
           : (Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36));
  RND = mulberry32(hashStr(seed));
  // resolve form/theme (after seeding so 'auto' is reproducible from the seed)
  const form = (formSel==="auto") ? pick(FORM_KEYS) : formSel;
  const theme = (themeSel==="auto") ? pick(THEME_KEYS) : themeSel;
  const out = FORMS[form].gen(theme);
  const title = genTitle(theme);
  const poet = genPoet();
  return { ...out, form, theme, title, poet, seed };
}

const $ = id=>document.getElementById(id);
function render(res){
  $("ptitle").textContent = res.title;
  $("pform").textContent = `${FORMS[res.form].label} · ${cap(res.theme)}`;
  const body = $("pbody");
  body.classList.remove("reveal"); void body.offsetWidth; // restart animation
  body.innerHTML = "";
  res.lines.forEach((ln,i)=>{
    const span=document.createElement("span");
    span.className="line"; span.textContent=ln;
    span.style.animationDelay = (0.12 + i*0.13)+"s";
    body.appendChild(span);
  });
  requestAnimationFrame(()=> body.classList.add("reveal"));
  const by=$("pby");
  by.textContent = `— ${res.poet}`;
  by.classList.remove("reveal-by"); void by.offsetWidth; by.classList.add("reveal-by");
  // store plain text for copying
  CURRENT.text = res.lines.join("\n");
  CURRENT.title = res.title; CURRENT.form = res.form; CURRENT.poet = res.poet;
}

function roll(){
  const res = generate($("form").value, $("theme").value, $("seed").value);
  render(res);
}

/* ---- toast ---- */
let toastT=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1500); }

/* ---- copy ---- */
$("copy").addEventListener("click", async ()=>{
  const text = `${CURRENT.title}\n\n${CURRENT.text}\n\n— ${CURRENT.poet}`;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
    toast("copied ✓");
  }catch(e){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast("copied ✓"); }
    catch(_){ toast("copy failed"); } document.body.removeChild(ta);
  }
});

/* ---- wiring ---- */
$("roll").addEventListener("click", roll);
$("form").addEventListener("change", roll);
$("theme").addEventListener("change", roll);
$("seed").addEventListener("keydown", e=>{ if(e.key==="Enter") roll(); });
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && document.activeElement.tagName!=="INPUT"
     && document.activeElement.tagName!=="SELECT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); roll();
  }
});

/* first poem */
roll();
