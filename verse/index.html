   Each returns { lines:[...], stanzaBreaks:Set } ; titles handled separately.
   ======================================================================= */

/* ----- HAIKU: syllable-aware 5/7/5 ----- */
function genHaiku(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme);
  // line 1 (5): {prep} {the} {adj?} {noun}  — aim ~5
  // We assemble by syllable budget using tagged nouns; no noun repeats in a poem.
  const usedNouns = new Set();
  function nounSyl(min,max){ // find a fresh noun within syllable range
    for(let i=0;i<48;i++){ const n=pick(N);
      if(n[1]>=min && n[1]<=max && !usedNouns.has(n[0])){ usedNouns.add(n[0]); return n; } }
    for(let i=0;i<24;i++){ const n=pick(N); if(!usedNouns.has(n[0])){ usedNouns.add(n[0]); return n; } }
    return pick(N);
  }
  // L1: a small scene, 5 syllables
  const l1opts = [
    ()=>{ const n=nounSyl(2,3); return cap(`${pick(VOCAB.preps)} the ${n[0]}`); }, // prep(1-2)+the(1)+noun(2-3) ≈5
    ()=>{ const a=pick(A.filter(x=>x.length>=6&&x.length<11)); const n=nounSyl(2,2);
          return cap(`the ${a} ${n[0]}`); },                                       // the+adj(2-3)+noun(2) ≈5-6
    ()=>{ const n1=nounSyl(2,2), n2=nounSyl(1,2); return cap(`${n1[0]}, then ${n2[0]}`); }, // ≈4-5
  ];
  // L2: 7 syllables — a small action
  const l2opts = [
    ()=>{ const n=nounSyl(2,3); const v=pick(V); return `the ${n[0]} ${v[2]} again`; },
    ()=>{ const a=pick(A.filter(x=>x.length<9)); const n=nounSyl(2,3); const v=pick(V);
          return `${a} ${n[0]} ${v[1]} slow`; },
    ()=>{ const n=nounSyl(1,2); return `nothing answers but the ${n[0]}`; },
    ()=>{ const v=pick(V); const n=nounSyl(2,3); return `I watch the ${n[0]} ${v[2]}`; },
  ];
  // L3: 5 syllables — a turn / image
  const l3opts = [
    ()=>{ const n=nounSyl(1,2); return `and then the ${n[0]}`; },
    ()=>{ const n=nounSyl(2,3); return `the ${n[0]} is enough`; },
    ()=>{ const n=nounSyl(1,2); const v=pick(V); return `the ${n[0]} ${v[1]} on`; },
    ()=>{ const n=nounSyl(2,3); return `still, the ${n[0]} holds`; },
  ];
  return { lines:[ pick(l1opts)(), pick(l2opts)(), pick(l3opts)() ], stanzaBreaks:new Set() };
}

/* ----- COUPLET: two lines, end rhyme ----- */
function genCouplet(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme), grp = pick(VOCAB.rhymes);
  // prefer noun-like rhyme words so they read after "the …"
  const nounish = grp.filter(x=>x[2]);
  const usable = nounish.length>=2 ? nounish : grp;
  const [r1,r2] = pickN(usable,2).map(x=>x[0]);
  const n1 = pick(N)[0], n2 = pick(N)[0], a1 = pick(A), a2 = pick(A);
  const v = pick(V);
  // templates that end each line on a rhyme word
  // Rhyme words sit at line-end in slots that read for any word class.
  const t = pick([
    ()=>[ `The ${a1} ${n1} remembers neither ${r1} nor ${n2};`,
          `it keeps only the hush, and the ${r2}.` ],
    ()=>[ `I came to the ${n1} to be rid of the ${r1},`,
          `but the ${a2} ${n2} gave me only ${r2}.` ],
    ()=>[ `All night the ${n1} kept turning toward the ${r1};`,
          `by morning, the ${a1} ${n2} had become the ${r2}.` ],
    ()=>[ `Let the ${n1} keep its ${pickNot(A,r1)} ${r1};`,
          `I have learned to live without the ${r2}.` ],
    ()=>[ `There is ${artFor(n1)} ${n1} in me that answers to the ${r1},`,
          `and ${artFor(a2)} ${a2} ${n2} that will not leave the ${r2}.` ],
  ])();
  return { lines:t, stanzaBreaks:new Set() };
}

/* ----- FREE VERSE: 3–6 lines, varied shapes, enjambment ----- */
function genFree(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const V = pool("verbs",theme), ABS = VOCAB.abstractions;
  // each metaphor vehicle is used at most once per poem; tenor != vehicle
  const usedVehicles = new Set();
  function metaphor(){
    const n1=pick(N)[0];
    let n2=pickNot(N, n1, ...usedVehicles)[0];
    usedVehicles.add(n2);
    return `the ${n1} ${chance(.5)?"is":"becomes"} ${artFor(n2)} ${n2}`;
  }
  const lineMakers = [
    ()=>{ const a=pick(A), n=pick(N)[0]; const v=pick(V);
          return `${cap(artFor(a))} ${a} ${n} ${v[1]} the ${pick(N)[0]}`; },
    ()=>{ const n=pick(N)[0]; return `${cap(pick(VOCAB.preps))} the ${n}, ${pick(ABS)} ${pick(V)[1]}`; },
    metaphor, // metaphor
    ()=>{ const v=pick(V); return `and the ${pick(N)[0]} keeps ${v[2]}`; },
    ()=>{ return `I have seen the ${pick(A)} ${pick(N)[0]}`; },
    ()=>{ const n=pick(N)[0]; return `what the ${n} took, it does not ${pick(VOCAB.verbs.common)[0]}`; },
    ()=>{ const a=allit(A, pick(A)); return `everything ${pick(A)} and ${a}`; },
    ()=>{ const n=pick(N)[0], v=pick(V); return `here, where the ${n} ${v[1]}, I wait`; },
  ];
  const n = 3 + ((rnd()*4)|0); // 3..6
  const lines=[]; let lastIdx=-1;
  for(let i=0;i<n;i++){
    let idx; for(let g=0;g<6;g++){ idx=(rnd()*lineMakers.length)|0; if(idx!==lastIdx) break; }
    lastIdx=idx; lines.push(lineMakers[idx]());
  }
  // chance of a metaphor closer (distinct vehicle)
  if(chance(0.5)){
    lines[lines.length-1] = "and "+metaphor();
  }
  return { lines, stanzaBreaks:new Set() };
}

/* ----- INCANTATION: imperative + anaphora ----- */
function genIncantation(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const IMP = VOCAB.imperatives, ABS=VOCAB.abstractions;
  // pick a verb whose base differs from the imperative's leading word (avoid
  // "Unspool what the X could not unspool")
  function verbUnlike(imp){
    const lead = imp.toLowerCase().split(" ")[0];
    for(let i=0;i<12;i++){ const v=pick(VOCAB.verbs.common)[0]; if(v!==lead) return v; }
    return pick(VOCAB.verbs.common)[0];
  }
  const anaphora = pick([
    ()=>(imp)=>{ const n=pick(N)[0]; return `${imp} the ${pickNot(A,n)} ${n}`; },
    ()=>(imp)=>`${imp} what the ${pick(N)[0]} could not ${verbUnlike(imp)}`,
    ()=>(imp)=>`${imp} the ${pick(N)[0]} ${pick(VOCAB.preps)} the ${pick(N)[0]}`,
  ])();
  const mk = anaphora;
  const lines=[];
  const fixedImp = chance(0.55) ? pick(IMP) : null; // sometimes repeat same imperative (true anaphora)
  const n = 3 + ((rnd()*3)|0); // 3..5
  for(let i=0;i<n;i++){ const imp = fixedImp || pick(IMP); lines.push(mk(imp)); }
  // a closing benediction
  const closer = pick([
    `and let the ${pick(N)[0]} forget your name.`,
    `until the ${pick(A)} ${pick(N)[0]} answers.`,
    `for the ${pick(N)[0]} is ${chance(.5)?"listening":"awake"}.`,
    `then ${pick(IMP).toLowerCase()} the rest.`,
    `and call it ${pick(ABS)}.`,
  ]);
  lines.push(closer);
  return { lines, stanzaBreaks:new Set() };
}

/* ----- APHORISM: one line, gnomic ----- */
function genAphorism(theme){
  const N = pool("nouns",theme), A = VOCAB.adjs[theme].concat(VOCAB.adjs.common);
  const ABS=VOCAB.abstractions, V=pool("verbs",theme);
  const line = pick([
    ()=>`The ${pick(N)[0]} keeps no ${pick(ABS)}, only ${pick(N)[0]}.`,
    ()=>`What the ${pick(N)[0]} ${pick(V)[1]}, the ${pick(N)[0]} cannot ${pick(VOCAB.verbs.common)[0]}.`,
    ()=>{ const n=pick(N)[0]; return `Every ${pick(N)[0]} is ${artFor(n)} ${n} that has learned ${pick(ABS)}.`; },
    ()=>`${cap(pick(ABS))} is only the ${pick(N)[0]} the ${pick(N)[0]} forgot.`,
    ()=>`To love the ${pick(N)[0]} is to forgive the ${pick(A)} ${pick(N)[0]}.`,
    ()=>`There is no ${pick(N)[0]} so ${pick(A)} it cannot ${pick(VOCAB.verbs.common)[0]}.`,
    ()=>`The ${pick(A)} ${pick(N)[0]} owes nothing to the ${pick(N)[0]}.`,
  ])();
  return { lines:[line], stanzaBreaks:new Set() };
}

const FORMS = {
  haiku:{ gen:genHaiku, label:"Haiku" },
  couplet:{ gen:genCouplet, label:"Couplet" },
  free:{ gen:genFree, label:"Free Verse" },
  incantation:{ gen:genIncantation, label:"Incantation" },
  aphorism:{ gen:genAphorism, label:"Aphorism" },
};
const FORM_KEYS = Object.keys(FORMS);
const THEME_KEYS = ["garden","sea","cosmos","dusk","memory","winter"];

/* ---- TITLE generator ---- */
function genTitle(theme){
  const r = rnd();
  if(r<0.4) return pick(VOCAB.titleNouns);
  if(r<0.8) return `${pick(VOCAB.titleNouns)} ${pick(VOCAB.titleOf)}`;
  // image-title from theme nouns
  const N = pool("nouns",theme);
  return cap(`The ${pick(N)[0]} ${pick(["Remembers","Keeps Watch","Will Not Answer","at Dusk","in Winter","Endures"])}`);
}
function genPoet(){ return `${pick(VOCAB.poetsFirst)} ${pick(VOCAB.poetsLast)}`; }

/* =======================================================================
   ASSEMBLY + RENDER
   ======================================================================= */
let CURRENT = { text:"", title:"", form:"", poet:"" };

function generate(formSel, themeSel, seedStr){
  // resolve seed
  let seed = seedStr && seedStr.trim() ? seedStr.trim()
           : (Date.now().toString(36)+Math.floor(rnd()*1e6).toString(36));
  RND = mulberry32(hashStr(seed));
  // resolve form/theme (after seeding so 'auto' is reproducible from the seed)
  const form = (formSel==="auto") ? pick(FORM_KEYS) : formSel;
  const theme = (themeSel==="auto") ? pick(THEME_KEYS) : themeSel;
  const out = FORMS[form].gen(theme);
  const title = genTitle(theme);
  const poet = genPoet();
  return { ...out, form, theme, title, poet, seed };
}

const $ = id=>document.getElementById(id);
function render(res){
  $("ptitle").textContent = res.title;
  $("pform").textContent = `${FORMS[res.form].label} · ${cap(res.theme)}`;
  const body = $("pbody");
  body.classList.remove("reveal"); void body.offsetWidth; // restart animation
  body.innerHTML = "";
  res.lines.forEach((ln,i)=>{
    const span=document.createElement("span");
    span.className="line"; span.textContent=ln;
    span.style.animationDelay = (0.12 + i*0.13)+"s";
    body.appendChild(span);
  });
  requestAnimationFrame(()=> body.classList.add("reveal"));
  const by=$("pby");
  by.textContent = `— ${res.poet}`;
  by.classList.remove("reveal-by"); void by.offsetWidth; by.classList.add("reveal-by");
  // store plain text for copying
  CURRENT.text = res.lines.join("\n");
  CURRENT.title = res.title; CURRENT.form = res.form; CURRENT.poet = res.poet;
}

function roll(){
  const res = generate($("form").value, $("theme").value, $("seed").value);
  render(res);
}

/* ---- toast ---- */
let toastT=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1500); }

/* ---- copy ---- */
$("copy").addEventListener("click", async ()=>{
  const text = `${CURRENT.title}\n\n${CURRENT.text}\n\n— ${CURRENT.poet}`;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
    toast("copied ✓");
  }catch(e){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast("copied ✓"); }
    catch(_){ toast("copy failed"); } document.body.removeChild(ta);
  }
});

/* ---- wiring ---- */
$("roll").addEventListener("click", roll);
$("form").addEventListener("change", roll);
$("theme").addEventListener("change", roll);
$("seed").addEventListener("keydown", e=>{ if(e.key==="Enter") roll(); });
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && document.activeElement.tagName!=="INPUT"
     && document.activeElement.tagName!=="SELECT" && document.activeElement.tagName!=="TEXTAREA"){
    e.preventDefault(); roll();
  }
});

/* first poem */
roll();

/* ws: unlock breadcrumb — the shared module (one source of truth), inlined via
   forge. See /UNLOCK.md and tools/ws/README.md. Defines WS, records this piece's
   first-visit, and (via WS auto-init) fires the unlock cue. Harmless if storage off. */
/* ═══════════════════════════════════════════════════════════════════════════
   ws.js — the Workshop's shared `ws:` unlock module (the one source of truth).

   The workshop has a hidden growth axis: pieces drop trivial localStorage
   breadcrumbs (`ws:seen:*`, `ws:best:*`, `ws:dwell:*`, `ws:flag:*`), and the
   Undercroft reads them to decide what's unlocked. See /UNLOCK.md.

   This file used to be a copy-paste micro-convention pasted into every page.
   It is now ONE module, inlined into pages VIA forge (`<!-- forge:include
   ../tools/ws/ws.js -->`) so shipped files stay self-contained but the source
   lives in exactly one place. forge strips the module guard at the bottom; in a
   browser this attaches a `WS` global and auto-fires the unlock cue.

   Vanilla, ES5-ish, zero-dependency. Every storage touch is wrapped — storage
   off (private mode / disabled) is always harmless. Secrets are bonuses, never
   blockers.
   ═══════════════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var WS = {};

  /* ── storage helpers (all swallow throws — storage may be blocked) ────────── */
  function lsGet(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function lsRemove(k) {
    try { localStorage.removeItem(k); } catch (e) { /* nothing to forget */ }
  }

  /* ── Shared estate-wide MUTE (the single key ws:pref:muted) ─────────────────
     House convention (DESIGNING.md): any page that makes sound reads/writes ONE
     shared key, so a visitor mutes once and it holds everywhere — and a mute
     toggled on another estate tab takes effect live. A page's audio gates on
     WS.muted(); a control writes via WS.setMuted(); WS.onMuteChange(fn) fires on
     any change (this tab OR another). */
  var MUTE_KEY = 'ws:pref:muted';
  var muteSubs = [];
  WS.muted = function () { return lsGet(MUTE_KEY) === '1'; };
  WS.setMuted = function (v) {
    var on = !!v;
    lsSet(MUTE_KEY, on ? '1' : '0');
    for (var i = 0; i < muteSubs.length; i++) {
      try { muteSubs[i](on); } catch (e) {}
    }
    return on;
  };
  WS.onMuteChange = function (fn) {
    if (typeof fn === 'function') muteSubs.push(fn);
  };
  // cross-tab: a mute set on ANOTHER estate tab fires our subscribers live.
  if (root && root.addEventListener) {
    root.addEventListener('storage', function (e) {
      if (!e || e.key !== MUTE_KEY) return;
      var on = WS.muted();
      for (var i = 0; i < muteSubs.length; i++) {
        try { muteSubs[i](on); } catch (e2) {}
      }
    });
  }

  /* ── Writers ──────────────────────────────────────────────────────────────
     All wrapped so storage-off is harmless. */

  /* WS.seen(id): set ws:seen:<id>=now if absent. Returns true iff newly set. */
  WS.seen = function (id) {
    var k = 'ws:seen:' + id;
    if (lsGet(k) != null) return false;
    return lsSet(k, String(Date.now()));
  };

  /* WS.best(game, val): raise ws:best:<game> only if val > current. */
  WS.best = function (game, val) {
    var k = 'ws:best:' + game;
    var prev = +(lsGet(k) || 0);
    if (val > prev) lsSet(k, String(val));
  };

  /* WS.flag(ev): set ws:flag:<ev>='1'. */
  WS.flag = function (ev) {
    lsSet('ws:flag:' + ev, '1');
  };

  /* WS.dwellAdd(id, ms): add ms to ws:dwell:<id>, then re-sum ALL ws:dwell:*
     and set ws:flag:patience once the summed total crosses `thresh` (default
     150000 ms ≈ 2.5 min). Returns the new summed total. */
  WS.dwellAdd = function (id, ms, thresh, patienceFlag) {
    if (thresh == null) thresh = 150000;
    if (patienceFlag == null) patienceFlag = 'patience';
    var k = 'ws:dwell:' + id;
    lsSet(k, String((+lsGet(k) || 0) + ms));
    var total = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var kk = localStorage.key(i);
        if (kk && kk.indexOf('ws:dwell:') === 0) total += (+lsGet(kk) || 0);
      }
    } catch (e) { return 0; }
    if (total >= thresh && lsGet('ws:flag:' + patienceFlag) == null) {
      WS.flag(patienceFlag);
    }
    return total;
  };

  /* WS.startDwell(id, opts): start a dwell accumulator that ticks only while the
     tab is visible. opts.tick (ms/tick, default 5000), opts.thresh (summed ms to
     set the patience flag, default 150000), opts.patienceFlag (flag name, default
     'patience'). Returns the interval id (clearInterval to stop). No-op outside a
     browser. */
  WS.startDwell = function (id, opts) {
    opts = opts || {};
    var tick = opts.tick != null ? opts.tick : 5000;
    var thresh = opts.thresh != null ? opts.thresh : 150000;
    var patienceFlag = opts.patienceFlag != null ? opts.patienceFlag : 'patience';
    if (!root || !root.document) return null;
    return setInterval(function () {
      if (root.document.hidden) return;
      WS.dwellAdd(id, tick, thresh, patienceFlag);
    }, tick);
  };

  /* ── Reader ───────────────────────────────────────────────────────────────
     WS.store(): snapshot of every ws: key. Same shape as the Undercroft's old
     makeStore — the predicates below run verbatim against it. */
  WS.store = function () {
    var ok = true, map = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('ws:') === 0) map[k] = localStorage.getItem(k);
      }
    } catch (e) { ok = false; }
    return {
      ok: ok,
      has: function (k) { return k in map; },
      get: function (k) { return map[k]; },
      all: map
    };
  };

  /* ── Predicate table ──────────────────────────────────────────────────────
     id + predicate ONLY. Secret names / blurbs / riddles stay in the Undercroft
     so secret prose never leaks into public page source. The store arg is `s`. */
  WS.SECRETS = [
    { id: 'quickening',     unlocked: function (s) { return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice'); } },
    { id: 'the-long-quiet', unlocked: function (s) { return s.has('ws:flag:patience'); } },
    { id: 'eleven',         unlocked: function (s) { return s.has('ws:flag:eleven'); } },
    { id: 'the-survivor',   unlocked: function (s) { return (+s.get('ws:best:swarm') || 0) >= 5; } },
    { id: 'rosette',        unlocked: function (s) {
        return s.has('ws:seen:game-of-life') && s.has('ws:seen:lattice')
            && s.has('ws:flag:patience') && s.has('ws:flag:eleven')
            && (+s.get('ws:best:swarm') || 0) >= 8;
      } },
    { id: 'codex',          unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:scriptorium'); } },
    { id: 'floating-ink',   unlocked: function (s) { return s.has('ws:seen:cartographer') && s.has('ws:seen:scriptorium'); } },
    { id: 'almanac',        unlocked: function (s) { return s.has('ws:seen:verse') && s.has('ws:seen:orrery'); } },
    { id: 'enigma',         unlocked: function (s) { return s.has('ws:seen:scriptorium') && s.has('ws:seen:slipstick'); } },
    { id: 'reckoner',       unlocked: function (s) { return s.has('ws:seen:slipstick') && s.has('ws:seen:astrolabe') && s.has('ws:seen:abacus'); } },
    { id: 'night-shift',    unlocked: function (s) { return s.has('ws:flag:the-lamplighter-won') && s.has('ws:flag:the-ferryman-won'); } },
    { id: 'light-mixer',    unlocked: function (s) {
        // earned by mastering every Feat of Light in the Hall of Mirrors (all 9)
        var f = ['rainbow','halo','spyglass','camera','spectroscope','polariser','anamorphosis','iridescence','maze'];
        for (var i = 0; i < f.length; i++) { if (!s.has('ws:flag:earned-' + f[i])) return false; }
        return true;
      } },

    /* reliquary (#399): read the Sealed Room's Diary to its end — the estate's
       found-diary mystery, solved across the Museum → Scytale → Card Catalog. An
       honest cross-link trophy: the Reliquary and the Undercroft share this ws
       engine. Predicate = the payoff key the Sealed Study sets on final solve. */
    { id: 'reliquary',      unlocked: function (s) { return s.has('ws:seen:reliquary-solved'); } },

    /* the-mere: the whole diary, read to its very last page — the memorial annex
       past the study's cold wall. The grand payoff of the Sealed Room's mystery,
       one clue and one chapter beyond the reliquary trophy above. Predicate = the
       grand key the annex sets on entry (guarded on the final chapter's witness). */
    { id: 'the-mere',       unlocked: function (s) { return s.has('ws:seen:the-mere'); } },

    /* ── The Constellation of Mastery (wave one) ────────────────────────────────
       A named group of secrets that reward what you CONQUERED, not merely what you
       wandered past. Each candle stands for a feat finished; the capstone lights
       only when all five are lit. Predicates are ids + fns ONLY — the names, badges,
       riddles, and prose live in undercroft/index.src.html (hidden-world content),
       so no secret prose leaks into a public trigger page. */

    /* m-keeper-of-tales: carried ALL THREE public Lantern tales to their ends.
       GATES the earned Keeper's Alcove (keeper.html). */
    { id: 'm-keeper-of-tales', unlocked: function (s) {
        return s.has('ws:flag:the-lamplighter-won')
            && s.has('ws:flag:the-ferryman-won')
            && s.has('ws:flag:the-clockmaker-won');
      } },

    /* m-clean-sweep: a flawless ("clean") solve of all FOUR puzzle benches. */
    { id: 'm-clean-sweep', unlocked: function (s) {
        return s.has('ws:flag:latch-clean')
            && s.has('ws:flag:slitherlink-clean')
            && s.has('ws:flag:akari-clean')
            && s.has('ws:flag:mirror-maze-clean');
      } },

    /* m-held-the-line: outlasted the Swarm to the tenth wave (reachable; sits

    /* the exhibit-start plaque (§7) — quiet, bottom-right, dismissible per visit.
       Rendered ONLY when NOT touring and this page starts an exhibit-start tour. */
    function renderPlaque(info, reduced) {
      if (!doc.body) return;
      injectPlaqueStyles();
      var wrap = el('div', 'td-plaque'); wrap.id = 'td-plaque';
      wrap.setAttribute('data-tour-docent', DOCENT_SENTINEL);
      var head = el('div', 'tdp-head', '⟲ A Grand Tour begins here');
      var title = el('div', 'tdp-title', String(info.title).toUpperCase());
      wrap.appendChild(head); wrap.appendChild(title);
      var row = el('div', 'tdp-row');
      if (info.resume) {
        row.appendChild(btn('tdp-btn', 'resume where you left off', 'resume this tour where you left off', function () { root.location.assign(info.resume.resumeTarget); }));
        row.appendChild(btn('tdp-btn tdp-alt', 'start over', 'start this tour over', function () { root.location.assign(info.resume.startOverTarget); }));
      } else {
        row.appendChild(btn('tdp-btn', 'begin', 'begin this tour', function () { root.location.assign(info.beginTarget); }));
      }
      wrap.appendChild(row);
      var x = btn('tdp-x', '✕', 'dismiss', function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); });
      wrap.appendChild(x);
      doc.body.appendChild(wrap);
      if (!reduced && root.requestAnimationFrame) root.requestAnimationFrame(function () { root.requestAnimationFrame(function () { wrap.classList.add('tdp-in'); }); });
      else wrap.classList.add('tdp-in');
    }
    function injectPlaqueStyles() {
      if (doc.getElementById('td-plaque-style')) return;
      var st = el('style'); st.id = 'td-plaque-style';
      st.textContent =
        '#td-plaque{position:fixed;right:16px;bottom:16px;z-index:2147482000;max-width:min(90vw,300px);' +
        'box-sizing:border-box;padding:13px 32px 13px 15px;color:var(--ink,#eaf0fa);' +

        '#td-plaque.tdp-in{opacity:1;transform:none;}' +
        '.tdp-head{font:600 9px/1.2 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.16em;text-transform:uppercase;color:var(--brass,#c9a24a);opacity:.8;}' +
        '.tdp-title{margin:6px 0 10px;font:italic 15px/1.2 var(--serif,Georgia,serif);color:var(--brass-bright,#f0d489);}' +
        '.tdp-row{display:flex;gap:8px;flex-wrap:wrap;}' +
        '.tdp-btn{min-height:38px;padding:0 12px;cursor:pointer;color:#12151d;background:var(--brass-bright,#f0d489);' +
        'border:1px solid var(--brass-bright,#f0d489);border-radius:5px;font:600 11px/1 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.04em;}' +
        '.tdp-btn:hover{filter:brightness(1.06);}.tdp-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}' +
        '.tdp-alt{color:var(--brass,#c9a24a);background:rgba(0,0,0,.2);border-color:rgba(201,162,74,.32);}' +

        '.tdp-x:hover{color:var(--brass,#c9a24a);}.tdp-x:focus-visible{outline:1.5px solid var(--brass,#c9a24a);outline-offset:2px;}' +
        '@media (prefers-reduced-motion:reduce){#td-plaque{transition:none;transform:none;opacity:1;}}';

    /* ── the TOURS drawer (§6/§7) — the front door's REST affordance ─────────────
       A labeled `⟲ tours` control joins the .pzctl corner cluster (visible text
       label, not icon-only — [[hidden-features-need-an-on-ramp]]); it opens an
       engraved, focus-trapped panel (Esc / ✕ / scrim-click closes) listing every
       thread from the TOURS data with title · minutes — tagline + begin / resume.
       Panel + scrim mount at BODY level and the control lives in the top-level
       .pzctl (both OUTSIDE #sheet), so the map's capture-phase pointerdown never
       swallows a click (recon A §10a). Mounts ONLY on a page carrying the .pzctl
       cluster (the front door) and ONLY in normal mode (the docent card, not the
       drawer, is the affordance while touring). All copy is Appendix A verbatim. */
    function injectDrawerStyles() {
      if (doc.getElementById('td-drawer-style')) return;
      var st = el('style'); st.id = 'td-drawer-style';
      st.textContent =
        '#td-drawer-scrim{position:fixed;inset:0;z-index:2147482400;background:rgba(6,8,13,.55);cursor:pointer;' +
        'opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s;}' +
        '#td-drawer-scrim.td-open{opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s;}' +
        '#td-drawer{position:fixed;z-index:2147482500;left:50%;top:50%;transform:translate(-50%,-50%);' +
        'width:min(92vw,30rem);max-height:82vh;overflow:auto;box-sizing:border-box;' +

        'color:var(--ink,#eaf0fa);background:linear-gradient(180deg,rgba(26,30,42,.98),rgba(15,18,27,.99));' +
        'border:1px solid var(--brass,#c9a24a);border-radius:10px;' +
        'box-shadow:0 0 0 1px rgba(201,162,74,.16),0 22px 70px rgba(0,0,0,.62),inset 0 0 34px rgba(201,162,74,.05);}' +
        '.tdd-h{margin:0;font:600 12px/1 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.28em;' +
        'text-transform:uppercase;color:var(--brass,#c9a24a);}' +
        '.tdd-sub{margin:9px 0 15px;font:italic 13.5px/1.5 var(--serif,Georgia,serif);color:var(--muted,#c8cddb);' +
        'padding-bottom:14px;border-bottom:1px solid rgba(201,162,74,.16);}' +
        '.tdd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;}' +
        '.tdd-row{display:flex;flex-direction:column;gap:9px;}' +
        '.tdd-meta{font:14.5px/1.5 var(--serif,Georgia,serif);color:var(--ink,#eaf0fa);}' +
        '.tdd-title{font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--brass-bright,#f0d489);}' +
        '.tdd-min{color:var(--brass,#c9a24a);font:600 11px/1 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.05em;}' +
        '.tdd-tag{color:var(--muted,#c8cddb);font-style:italic;}' +
        '.tdd-actions{display:flex;gap:8px;flex-wrap:wrap;}' +
        '.tdd-go{min-height:40px;padding:0 15px;cursor:pointer;color:#12151d;background:var(--brass-bright,#f0d489);' +
        'border:1px solid var(--brass-bright,#f0d489);border-radius:6px;' +
        'font:600 11.5px/1 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.05em;}' +
        '.tdd-go:hover{filter:brightness(1.06);}' +
        '.tdd-go:focus-visible{outline:2px solid #fff;outline-offset:2px;}' +
        '.tdd-alt{color:var(--brass,#c9a24a);background:rgba(0,0,0,.22);border-color:rgba(201,162,74,.32);}' +
        '.tdd-x{position:absolute;top:9px;right:9px;width:30px;height:30px;padding:0;cursor:pointer;' +
        'color:var(--muted,#8b95a8);background:none;border:0;border-radius:6px;' +
        'font:600 15px/1 var(--mono,ui-monospace,Menlo,monospace);}' +
        '.tdd-x:hover{color:var(--brass,#c9a24a);}' +
        '.tdd-x:focus-visible{outline:1.5px solid var(--brass,#c9a24a);outline-offset:2px;}' +
        '.pzctl button.td-tours-btn{width:auto;min-width:0;height:26px;padding:0 11px;white-space:nowrap;' +
        'font:600 11px/1 var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.08em;}' +
        '@media (max-width:430px){#td-drawer{left:0;top:auto;bottom:0;transform:none;width:100%;max-height:86vh;}' +
        '#td-drawer .tdd-panel{border-radius:12px 12px 0 0;border-bottom:0;}}' +
        '@media (prefers-reduced-motion:reduce){#td-drawer,#td-drawer-scrim{transition:none;}}';
      (doc.head || doc.body).appendChild(st);
    }

    function mountDrawer(ws) {
      var cluster = doc.querySelector('.pzctl');
      if (!cluster || doc.getElementById('td-tours-btn')) return;   /* front door only; idempotent */
      var tours = TOURS_REF();
      if (!Array.isArray(tours) || !tours.length) return;
      injectDrawerStyles();

      /* the control that joins the corner cluster */
      var opener = el('button', 'td-tours-btn'); opener.id = 'td-tours-btn'; opener.type = 'button';
      opener.textContent = '⟲ tours';                          /* ⟲ tours */
      opener.setAttribute('title', 'take a grand tour');
      opener.setAttribute('aria-haspopup', 'dialog');
      opener.setAttribute('aria-controls', 'td-drawer');
      opener.setAttribute('aria-expanded', 'false');
      cluster.insertBefore(opener, cluster.firstChild);

      /* the scrim + engraved panel, mounted body-level (outside #sheet) */
      var scrim = el('div'); scrim.id = 'td-drawer-scrim';
      var panel = el('div'); panel.id = 'td-drawer';
      panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true');
      panel.setAttribute('aria-labelledby', 'td-drawer-h');
      var inner = el('div', 'tdd-panel');
      inner.appendChild(btn('tdd-x', '✕', 'close the tours drawer', function () { closeDrawer(); }));
      var h = el('h2', 'tdd-h', 'GRAND TOURS'); h.id = 'td-drawer-h';
      inner.appendChild(h);
      inner.appendChild(el('p', 'tdd-sub',
        'composed walks, docent at your side — begin one; leave whenever you like.'));
      var list = el('ul', 'tdd-list');
      inner.appendChild(list);
      panel.appendChild(inner);
      doc.body.appendChild(scrim); doc.body.appendChild(panel);

      /* rebuild rows each open so the resume state (WS.best) is fresh */
      function renderRows() {
        list.innerHTML = '';
        var rows = drawerRows(tours, ws, 'index.html');
        for (var i = 0; i < rows.length; i++) {
          var li = el('li', 'tdd-row');
          var meta = el('div', 'tdd-meta');
          meta.appendChild(el('span', 'tdd-title', rows[i].title));
          meta.appendChild(doc.createTextNode(' · '));        /* · */
          meta.appendChild(el('span', 'tdd-min', rows[i].minutes + ' min'));
          meta.appendChild(doc.createTextNode(' — '));        /* — */
          meta.appendChild(el('span', 'tdd-tag', rows[i].tagline));
          li.appendChild(meta);
          var actions = el('div', 'tdd-actions');
          (function (r) {
            if (r.resume) {
              actions.appendChild(btn('tdd-go', 'resume where you left off',
                'resume ' + r.title + ' where you left off', function () { root.location.assign(r.resume.resumeTarget); }));
              actions.appendChild(btn('tdd-go tdd-alt', 'start over',
                'start ' + r.title + ' over', function () { root.location.assign(r.resume.startOverTarget); }));
            } else {
              actions.appendChild(btn('tdd-go', 'begin',
                'begin ' + r.title, function () { root.location.assign(r.beginTarget); }));
            }
          })(rows[i]);
          li.appendChild(actions);
          list.appendChild(li);
        }
      }

      function focusables() {
        return Array.prototype.slice.call(panel.querySelectorAll('button:not([disabled])'));
      }
      function onKeydown(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
          e.preventDefault(); e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          closeDrawer(); return;
        }
        if (e.key === 'Tab') {                                     /* focus trap */
          var f = focusables(); if (!f.length) { e.preventDefault(); return; }
          var first = f[0], last = f[f.length - 1], a = doc.activeElement;
          if (!panel.contains(a)) { e.preventDefault(); first.focus(); return; }
          if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
        }
      }
      function isOpen() { return panel.classList.contains('td-open'); }
      function openDrawer() {
        if (isOpen()) return;
        renderRows();
        scrim.classList.add('td-open'); panel.classList.add('td-open');
        opener.setAttribute('aria-expanded', 'true');
        doc.addEventListener('keydown', onKeydown, true);         /* capture: outrank the global Esc→retreat (recon A §10c) */
        var f = focusables(); if (f.length) f[0].focus();
      }
      function closeDrawer() {
        if (!isOpen()) return;
        scrim.classList.remove('td-open'); panel.classList.remove('td-open');
        opener.setAttribute('aria-expanded', 'false');
        doc.removeEventListener('keydown', onKeydown, true);
        try { opener.focus(); } catch (e) {}
      }
      opener.addEventListener('click', function (e) { e.preventDefault(); if (isOpen()) closeDrawer(); else openDrawer(); });
      scrim.addEventListener('click', function () { closeDrawer(); });
    }

    /* ── the beats seam (§4) — the browser side of the layered runtime ──────────
       Wires createBeatsRuntime to the live page: the act is the page's own
       window.__tourAct (a bespoke performance); with none, the declarative walk
       visits the page's [data-tour-spot] elements in numeric order with an
       engraved halo. The runtime itself is pure + tick-driven; the machine feeds
       it dt from the same rAF loop as the dwell clock. __tourHooks is a DIFFERENT
       page surface (the Showing's cue verbs, §4/§10) and is deliberately NOT read
       here — tours never call hooks. */
    var SPOT_STYLE_ID = 'tour-spot-style';
    function injectSpotStyles() {
      if (doc.getElementById(SPOT_STYLE_ID)) return;
      var st = el('style'); st.id = SPOT_STYLE_ID;
      st.textContent =
        '.td-spot-lit{outline:2px solid var(--brass-bright,#f0d489)!important;outline-offset:3px;' +
        'box-shadow:0 0 0 3px rgba(201,162,74,.22),0 0 24px rgba(201,162,74,.4)!important;' +
        'border-radius:4px;transition:outline-color .3s ease,box-shadow .3s ease;position:relative;z-index:1;}' +
        '@media (prefers-reduced-motion:reduce){.td-spot-lit{transition:none;}}';
      (doc.head || doc.body).appendChild(st);
    }
    function collectSpots() {
      var list = [];
      try { list = Array.prototype.slice.call(doc.querySelectorAll('[data-tour-spot]')); } catch (e) {}
      list.sort(function (a, b) {
        return (parseInt(a.getAttribute('data-tour-spot'), 10) || 0) - (parseInt(b.getAttribute('data-tour-spot'), 10) || 0);
      });
      return list;
    }
    function makeBeatsBrowser(info) {
      var spots = collectSpots();
      var act = (typeof root.__tourAct === 'function') ? root.__tourAct : null;
      if (act || spots.length) injectSpotStyles();
      return createBeatsRuntime({
        info: info,
        act: act,
        spots: spots,
        spotDwell: SPOT_DWELL,
        spotlight: function (elx, on) { if (elx && elx.classList) elx.classList.toggle('td-spot-lit', !!on); },
        scrollTo: function (elx) {
          if (!elx || !elx.scrollIntoView) return;
          try { elx.scrollIntoView({ behavior: info.reduced ? 'auto' : 'smooth', block: 'center', inline: 'center' }); }
          catch (e) { try { elx.scrollIntoView(); } catch (e2) {} }
        }
      });
    }

    /* deploy best-effort rejoin (wandered case). rel() from the CURRENT pathname:
       correct on localhost (base '/'); on Pages (base '/the-workshop/') it is off
       by the base depth — the design's real way back is the start plaque's resume
       (§1/§7), so this stays a best-effort convenience. */
    function rejoinTargetBrowser(tour, n) {
      var from = String(root.location.pathname || '').replace(/^\/+/, '');
      if (from === '' || from.charAt(from.length - 1) === '/') from += 'index.html';
      return stopTarget(tour, n, from);
    }

    function run() {
      var params = parseTourParams(root.location.search);
      var pathname = root.location.pathname;
      var reduced = prefersReduced();
      var ws = root.WS || null;
      var cls0 = classifyLoad(TOURS_REF(), params, pathname);

      if (cls0.mode === 'normal') {
        if (cls0.reason && cls0.reason !== 'no-params') { try { console.info('[grand-tour] ' + cls0.reason + ' — showing a plain page'); } catch (e) {} }
        var plaque = startPlaqueInfo(TOURS_REF(), pathname, ws);
        if (plaque) renderPlaque(plaque, reduced);
        try { mountDrawer(ws); } catch (e) { /* the drawer is optional chrome; a throw must not blank the front door */ }
        return;
      }

      var ctl = {};
      var view = makeView(reduced, ctl);
      var machine = createDocentMachine({
        tours: TOURS_REF(), params: params, pathname: pathname, ws: ws, reduced: reduced,
        makeBeats: makeBeatsBrowser, view: view,
        navigate: function (url) { root.location.assign(url); },
        leave: function () {
          try { root.history.replaceState(null, '', root.location.pathname + stripTourParams(root.location.search) + root.location.hash); }
          catch (e) { /* replaceState can throw on file://; the chrome is already gone */ }
        },
        rejoinTarget: rejoinTargetBrowser
      });
      /* bind the controller the view's buttons call */
      ctl.back = machine.back; ctl.pause = machine.pause; ctl.resume = machine.resume;
      ctl.walkOn = machine.walkOn; ctl.leave = machine.leave; ctl.finaleChoice = machine.finaleChoice;

      wireListeners(doc, machine, view);
      machine.start();
      runRaf(machine);
      root.addEventListener('pageshow', function (e) { if (e && e.persisted) { view.reset(); machine.pageshow(true); runRaf(machine); } });
    }

    function wireListeners(doc, machine, view) {
      /* Esc = leave (capture; outranks the front-door retreat only WHILE touring).
         ←/→ = back/walk-on but ONLY when focus is within the card (stop pages own
         their arrow keys — DESIGN §3). */
      doc.addEventListener('keydown', function (e) {
        var ph = machine.phase();
        var touring = ph !== 'normal' && ph !== 'left' && ph !== 'idle';
        if (!touring) return;
        if (e.key === 'Escape' || e.keyCode === 27) { e.stopPropagation(); e.preventDefault(); machine.leave(); return; }
        if (view.contains(e.target)) {
          if (e.key === 'ArrowLeft') { e.preventDefault(); machine.back(); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); machine.walkOn(); }
        }
      }, true);

      /* soft-pause: ANY engagement on the page OUTSIDE the card suspends a live
         countdown (§1). Interacting with the docent itself is not "taking over". */
      var engaged = function (e) { if (view.contains(e.target)) return; machine.engage(); };
      doc.addEventListener('pointerdown', engaged, true);
      doc.addEventListener('keydown', function (e) { if (e.key === 'Escape' || e.keyCode === 27) return; engaged(e); }, true);
      try { doc.addEventListener('wheel', engaged, { capture: true, passive: true }); } catch (e2) { doc.addEventListener('wheel', engaged, true); }
      try { doc.addEventListener('scroll', engaged, { capture: true, passive: true }); } catch (e3) { doc.addEventListener('scroll', engaged, true); }
      var lastMove = 0;
      doc.addEventListener('mousemove', function (e) {
        var t = (root.performance && root.performance.now) ? root.performance.now() : 0;
        if (t - lastMove < 400) return; lastMove = t; engaged(e);
      }, true);
      doc.addEventListener('visibilitychange', function () { if (!doc.hidden) machine.engage(); });
    }

    function runRaf(machine) {
      if (!root.requestAnimationFrame) return;
      var last = null;
      function frame(ts) {
        var ph = machine.phase();
        if (ph === 'left' || ph === 'normal' || ph === 'idle') return;
        /* feed dt to the machine every frame while alive; it routes ticks itself
           (dwell → the countdown clock, perform → the beats runtime, else no-op). */
        if (last != null) machine.tick(ts - last);
        last = ts;
        root.requestAnimationFrame(frame);
      }
      root.requestAnimationFrame(frame);
    }

    /* TOURS is a sibling forge-include (a browser global); read it lazily so load
       order within the page doesn't matter. */
    function TOURS_REF() { return root.TOURS || []; }

    if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', run);
    else run();
  }

  /* ── attach + auto-boot ──────────────────────────────────────────────────── */
  if (root) root.GrandTour = API;
  if (root && root.document) { try { boot(); } catch (e) { /* a thrown docent leaves the page usable (§3) */ } }

  /* dual-use module guard (forge strips exactly this braced single line) */
