<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Garden — generative instruments</title>
<style>
  :root{ --bg:#07060d; --ink:#ece9f6; --muted:#8a85a6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; background:
    radial-gradient(1000px 600px at 50% -10%, rgba(150,110,220,.16), transparent 60%),
    radial-gradient(820px 520px at 14% 110%, rgba(90,150,230,.12), transparent 55%),
    radial-gradient(820px 520px at 88% 112%, rgba(210,110,200,.10), transparent 55%),
    var(--bg); }
  .wrap{ max-width:980px; margin:0 auto; padding:84px 28px 100px; }
  header{ text-align:center; margin-bottom:6px; }
  .kick{ font:600 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.34em;
    text-transform:uppercase; color:var(--muted); opacity:.85; }
  h1{ font-family:Georgia,"Times New Roman",serif; font-weight:500;
    font-size:clamp(38px,7vw,66px); margin:.18em 0 .12em; letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,#cabfe6); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .sub{ color:var(--muted); font-size:15px; font-style:italic; font-family:Georgia,serif;
    max-width:540px; margin:0 auto; line-height:1.5; }
  .note{ margin-top:14px; font:11px/1 ui-monospace,Menlo,monospace; letter-spacing:.12em;
    color:var(--muted); opacity:.7; }
  .grid{ margin-top:48px; display:grid; gap:22px; grid-template-columns:1fr; }
  @media(min-width:700px){ .grid{ grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); } }
  .card{ position:relative; display:block; text-decoration:none; color:inherit;
    border-radius:16px; overflow:hidden; background:#110e1c;
    border:1px solid rgba(255,255,255,.08);
    transition:transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s, border-color .28s;
    opacity:0; transform:translateY(14px); animation:rise .6s forwards; }
  @keyframes rise{ to{opacity:1; transform:none;} }
  .card:hover{ transform:translateY(-6px);
    border-color:color-mix(in srgb,var(--c) 55%,transparent);
    box-shadow:0 18px 54px -16px rgba(0,0,0,.8), 0 0 46px -10px var(--c); }
  .thumb{ position:relative; aspect-ratio:16/10; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 35%, color-mix(in srgb,var(--c) 34%,#110e1c), #08070f 72%); }
  .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .card:hover .thumb img{ transform:scale(1.05); }
  .thumb::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,transparent 44%, rgba(7,6,13,.92)); }
  .play{ position:absolute; top:13px; right:15px; z-index:2; font-size:11px; letter-spacing:.18em;
    color:var(--c); opacity:0; transform:translateX(6px); transition:.25s; text-shadow:0 0 8px var(--c); }
  .card:hover .play{ opacity:1; transform:none; }
  .meta{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 18px 18px; }
  .meta h2{ margin:0; font-family:Georgia,serif; font-weight:500; font-size:21px; }
  .meta p{ margin:5px 0 0; font-size:12.5px; color:var(--muted); line-height:1.45; }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--c);
    margin-right:8px; vertical-align:middle; box-shadow:0 0 10px var(--c); }
  footer{ margin-top:60px; text-align:center; color:var(--muted); opacity:.55;
    font:11px/1.7 ui-monospace,Menlo,monospace; letter-spacing:.05em; }
  footer a{ color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick">Sound&nbsp;Garden</div>
    <h1>Instruments</h1>
    <p class="sub">Music grown from geometry — generative systems you can hear as well as watch.
      Each plays itself, forever, never quite the same.</p>
    <div class="note" id="note">▶ each needs a click to begin (browser autoplay rules)</div>
  </header>
  <main class="grid" id="grid"></main>
  <footer>all sound synthesised live with the Web Audio API · zero dependencies ·
    <a href="../index.html">← the workshop</a></footer>
</div>
<script src="instruments.js"></script>
<script>
  const grid=document.getElementById('grid'), items=window.INSTRUMENTS||[];
  items.forEach((it,i)=>{
    const base=it.file.replace(/\.html$/,'');
    const thumb=it.thumb||`assets/${base}.png`;
    const a=document.createElement('a');
    a.className='card'; a.href=it.file; a.style.setProperty('--c',it.accent||'#cf7bff');
    a.style.animationDelay=(i*0.07)+'s';
    a.innerHTML=`
      <div class="thumb"><img src="${thumb}" alt="${it.name}" loading="lazy"
        onerror="this.style.display='none'"></div>
      <div class="play">▶ listen</div>
      <div class="meta"><h2><span class="dot"></span>${it.name}</h2><p>${it.blurb||''}</p></div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
